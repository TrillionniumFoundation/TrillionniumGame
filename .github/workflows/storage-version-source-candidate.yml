name: storage-version-source-candidate

on:
  pull_request:
    paths:
      - 'crates/trnm-storage-nakama-version/**'
      - 'contracts/storage/nakama-public-version-v1.json'
      - 'docs/development/STORAGE_PUBLIC_VERSION_COMPATIBILITY_V1.md'
      - 'scripts/check-storage-version-compat.py'
      - '.github/workflows/storage-version-source-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-storage-nakama-version/**'
      - 'contracts/storage/nakama-public-version-v1.json'
      - 'docs/development/STORAGE_PUBLIC_VERSION_COMPATIBILITY_V1.md'
      - 'scripts/check-storage-version-compat.py'
      - '.github/workflows/storage-version-source-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-version-source-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  storage-version-source-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Verify source contract
        run: python3 scripts/check-storage-version-compat.py
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format
        run: cargo fmt --manifest-path crates/trnm-storage-nakama-version/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/trnm-storage-nakama-version/Cargo.toml --all-targets --locked
      - name: Strict lint
        run: cargo clippy --manifest-path crates/trnm-storage-nakama-version/Cargo.toml --all-targets --locked -- -D warnings
