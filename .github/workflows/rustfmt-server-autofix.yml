name: rustfmt-server-autofix

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29
    paths:
      - 'crates/trnm-server/**/*.rs'
      - '.github/workflows/rustfmt-server-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rustfmt-server-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: feat/plan-v3-gap-closure-2026-08-29
      EXPECTED_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact feature head without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "refs/heads/${BRANCH}"
          git -C "$GITHUB_WORKSPACE" checkout -B "$BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          cd "$GITHUB_WORKSPACE"
      - name: Install exact Rust formatter
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1
      - name: Apply deterministic formatting
        run: cargo fmt --manifest-path crates/trnm-server/Cargo.toml
      - name: Commit formatting-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- crates/trnm-server; then
            echo 'rustfmt produced no diff'
            exit 0
          fi
          git diff --stat -- crates/trnm-server
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/trnm-server
          git commit -m 'style(server): apply Rust 1.85.1 formatting'
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${BRANCH}"
