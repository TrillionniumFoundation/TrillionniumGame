name: effective-governance-readback

on:
  push:
    branches: [tooling/gap-closure-audit-2026-09-07]
    paths:
      - '.github/workflows/effective-governance-readback.yml'

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_PR: '63'
      TARGET_BASE: main
      EXPECTED_HEAD: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
      EXPECTED_BASE: d66c1b5b614a2a7b682c233fe2e7a19939b6976b
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${TARGET_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Read effective GraphQL governance state
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p run/governance-readback
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          owner, name = os.environ['TARGET_REPOSITORY'].split('/', 1)
          number = int(os.environ['TARGET_PR'])
          expected_head = os.environ['EXPECTED_HEAD']
          expected_base = os.environ['EXPECTED_BASE']
          output = Path('run/governance-readback')

          def graphql(query: str, variables: dict | None = None) -> dict:
              body = json.dumps({'query': query, 'variables': variables or {}}, separators=(',', ':')).encode()
              request = urllib.request.Request(
                  'https://api.github.com/graphql',
                  data=body,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'User-Agent': 'trillionnium-governance-readback',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      value = json.load(response)
              except urllib.error.HTTPError as error:
                  raw = error.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'GraphQL HTTP {error.code}: {raw[:2000]}')
              if value.get('errors'):
                  raise SystemExit('GraphQL errors: ' + json.dumps(value['errors'], sort_keys=True))
              return value['data']

          schema = graphql('''
          query {
            __type(name: "BranchProtectionRule") {
              fields { name }
            }
          }
          ''')
          available = {row['name'] for row in schema['__type']['fields']}
          requested = [
              'pattern',
              'allowsDeletions',
              'allowsForcePushes',
              'dismissesStaleReviews',
              'isAdminEnforced',
              'requireLastPushApproval',
              'requiredApprovingReviewCount',
              'requiredStatusCheckContexts',
              'requiresApprovingReviews',
              'requiresCodeOwnerReviews',
              'requiresConversationResolution',
              'requiresLinearHistory',
              'requiresStatusChecks',
              'requiresStrictStatusChecks',
              'restrictsPushes',
              'restrictsReviewDismissals',
          ]
          fields = [item for item in requested if item in available]
          connection_fields = [
              'bypassForcePushAllowances',
              'bypassPullRequestAllowances',
              'pushAllowances',
              'reviewDismissalAllowances',
          ]
          connections = [item for item in connection_fields if item in available]
          selection = '\n'.join(fields + [f'{item}(first: 100) {{ totalCount }}' for item in connections])
          query = f'''
          query($owner: String!, $name: String!, $number: Int!) {{
            repository(owner: $owner, name: $name) {{
              defaultBranchRef {{ name target {{ oid }} }}
              branchProtectionRules(first: 100) {{
                totalCount
                nodes {{ {selection} }}
              }}
              pullRequest(number: $number) {{
                number
                state
                isDraft
                headRefOid
                baseRefOid
                mergeable
                mergeStateStatus
                reviewDecision
                reviewThreads(first: 100) {{
                  totalCount
                  nodes {{ isResolved isOutdated }}
                }}
                latestOpinionatedReviews(first: 100) {{
                  totalCount
                  nodes {{
                    state
                    submittedAt
                    commit {{ oid }}
                    author {{ login }}
                  }}
                }}
              }}
            }}
          }}
          '''
          data = graphql(query, {'owner': owner, 'name': name, 'number': number})
          repository = data['repository']
          pull = repository['pullRequest']
          if pull is None:
              raise SystemExit('target PR is absent')
          if pull['headRefOid'] != expected_head:
              raise SystemExit(f"head drift: {pull['headRefOid']} != {expected_head}")
          if pull['baseRefOid'] != expected_base:
              raise SystemExit(f"base drift: {pull['baseRefOid']} != {expected_base}")
          default = repository['defaultBranchRef']
          if default['name'] != os.environ['TARGET_BASE'] or default['target']['oid'] != expected_base:
              raise SystemExit('default branch identity drift')
          rules = repository['branchProtectionRules']['nodes']
          matching = [row for row in rules if row.get('pattern') == os.environ['TARGET_BASE']]
          result = {
              'schema': 'trillionnium.effective-governance-readback.v1',
              'repository': os.environ['TARGET_REPOSITORY'],
              'base': expected_base,
              'head': expected_head,
              'pull_request': pull,
              'available_branch_protection_fields': sorted(available),
              'queried_fields': fields,
              'queried_connections': connections,
              'branch_protection_rule_count': repository['branchProtectionRules']['totalCount'],
              'matching_main_rules': matching,
              'derived': {
                  'matching_rule_present': len(matching) == 1,
                  'unresolved_current_threads': sum(
                      1 for row in pull['reviewThreads']['nodes']
                      if not row['isResolved'] and not row['isOutdated']
                  ),
                  'accepted': False,
                  'gap_closed': False,
                  'production_ready': False,
              },
              'limitations': [
                  'This packet is a repository-token readback, not an independent governance acceptance.',
                  'A successful query does not prove a blocked negative merge rehearsal.',
                  'The packet grants no compatibility, production, cutover or retirement credit.',
              ],
          }
          (output / 'governance-readback.json').write_text(
              json.dumps(result, sort_keys=True, separators=(',', ':'), allow_nan=False) + '\n',
              encoding='utf-8',
          )
          if len(matching) != 1:
              raise SystemExit(f'expected exactly one main protection rule, observed {len(matching)}')
          print(json.dumps(result['derived'], sort_keys=True))
          PY
          sha256sum run/governance-readback/governance-readback.json \
            > run/governance-readback/SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf run/effective-governance-readback-${EXPECTED_HEAD}.tar.gz \
            -C run/governance-readback governance-readback.json SHA256SUMS

      - name: Retain effective governance readback
        id: retained
        uses: ./source/.github/actions/upload-evidence
        with:
          name: effective-governance-readback-${{ env.EXPECTED_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/run/effective-governance-readback-${{ env.EXPECTED_HEAD }}.tar.gz
          mime_type: application/gzip

      - name: Verify retained receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained.outputs.artifact_id }}'
          test -n '${{ steps.retained.outputs.sha256 }}'
          test '${{ steps.retained.outputs.size_bytes }}' -gt 0
          printf 'artifact_id=%s\nsha256=%s\nsize_bytes=%s\n' \
            '${{ steps.retained.outputs.artifact_id }}' \
            '${{ steps.retained.outputs.sha256 }}' \
            '${{ steps.retained.outputs.size_bytes }}'
