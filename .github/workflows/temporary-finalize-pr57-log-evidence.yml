name: temporary-finalize-pr57-log-evidence

on:
  push:
    branches:
      - codex/grpc-healthcheck-source-2026-08-31
    paths:
      - '.github/workflows/temporary-finalize-pr57-log-evidence.yml'

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CANDIDATE_REPOSITORY: ${{ github.repository }}
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Materialize reviewed final source and remove publisher
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temporary-finalize-pr57-log-evidence.py
          test -x scripts/emit-actions-log-artifact.py
          test -x scripts/verify-actions-log-artifact.py
          test -f tests/control_plane/test_actions_log_verifier.py
          test ! -e .trnm-final-payload
          test ! -e tmp-schema-create-file-probe.txt
          test ! -e tmp-schema-probe.txt
          test ! -e scripts/temporary-finalize-pr57-log-evidence.py
          test ! -e .github/workflows/temporary-finalize-pr57-log-evidence.yml

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
          python3 --version
          python3 -c 'import tomllib; print("tomllib=available")'

      - name: Validate source, control-plane and language workspaces
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-gap-register.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-plan.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-schema-authority.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-source-candidate-boundaries.py
          bash scripts/check-api-rtapi-denominator.sh
          bash -n scripts/ci-outbox-final-attempt-reaper.sh
          bash -n scripts/ci-trnm-server-live.sh
          files=$(find runtime -type f -name '*.go' -print | sort)
          test -n "$files"
          unformatted=$(printf '%s\n' "$files" | xargs gofmt -l)
          test -z "$unformatted" || { printf '%s\n' "$unformatted" >&2; exit 1; }
          (cd runtime && go test ./... -count=1 && go test -race ./... -count=1 && go vet ./...)
          git diff --check

      - name: Validate both outbox database profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          profiles = json.loads(
              Path('config/database-test-images.json').read_text(encoding='utf-8')
          )['profiles']
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f"TRNM_POSTGRES_IMAGE={profiles['postgresql']['image']}\n")
              output.write(f"TRNM_COCKROACH_IMAGE={profiles['cockroachdb']['image']}\n")
          PY
          TRNM_EVIDENCE_ROOT=run/finalizer-outbox \
            TRNM_RUN_ID=finalizer-postgresql \
            bash scripts/ci-outbox-final-attempt-reaper.sh postgresql
          TRNM_EVIDENCE_ROOT=run/finalizer-outbox \
            TRNM_RUN_ID=finalizer-cockroachdb \
            bash scripts/ci-outbox-final-attempt-reaper.sh cockroachdb

      - name: Validate final PostgreSQL server readiness and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          TRNM_EVIDENCE_ROOT=run/finalizer-server \
            TRNM_RUN_ID=finalizer-postgresql \
            bash scripts/ci-trnm-server-live.sh postgresql

      - name: Commit exact validated clean source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: codex/grpc-healthcheck-source-2026-08-31
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --short)"
          git diff --cached --check
          test ! -e .trnm-final-payload
          test ! -e scripts/temporary-finalize-pr57-log-evidence.py
          test ! -e .github/workflows/temporary-finalize-pr57-log-evidence.yml
          git commit -m 'fix(evidence): bind retained outbox logs to exact completed runs'
          git push origin "HEAD:${TARGET_BRANCH}"
