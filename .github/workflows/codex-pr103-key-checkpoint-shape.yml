name: codex-pr103-key-checkpoint-shape

on:
  push:
    branches:
      - codex/plan-v31-product-gap-wave-2026-09-07

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'TrillionniumFoundation/TrillionniumGame'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/plan-v31-product-gap-wave-2026-09-07
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Fetch exact repair head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$TARGET_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply deterministic checkpoint repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/codex-pr103-key-checkpoint-shape.py

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1

      - name: Format test and lint crypto provider
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml
          cargo test --manifest-path crates/trnm-token-crypto-provider/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path crates/trnm-token-crypto-provider/Cargo.toml --all-targets --locked -- -D warnings

      - name: Materialize final source-only tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/codex-pr103-key-checkpoint-shape.py
          rm -f scripts/codex-pr103-key-checkpoint-trigger.txt
          rm -f .github/workflows/codex-pr103-key-checkpoint-shape.yml
          git add -A
          git diff --cached --check

      - name: Validate final control and Python corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py

      - name: Publish non-force repaired source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "ProfHepta"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          test -n "$(git status --porcelain)"
          git commit -m "fix(crypto): enforce single-active checkpoint lifecycle"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
