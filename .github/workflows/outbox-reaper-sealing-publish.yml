name: outbox-reaper-sealing-publish

on:
  push:
    branches: [tooling/outbox-evidence-sealing-staging-2026-09-07a]
    paths:
      - '.github/workflows/outbox-reaper-sealing-publish.yml'

permissions:
  contents: write

env:
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch staging and live product
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/stage" "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/stage"
          git -C "$GITHUB_WORKSPACE/stage" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/stage" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/stage" checkout --detach FETCH_HEAD
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=2 origin "refs/heads/${PRODUCT_BRANCH}"
          git -C "$GITHUB_WORKSPACE/source" checkout -b "$PRODUCT_BRANCH" FETCH_HEAD
          git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD > "$RUNNER_TEMP/start-head"

      - name: Install stable reaper payload and hostile regression
        shell: bash
        run: |
          set -euo pipefail
          payload="$GITHUB_WORKSPACE/stage/tooling/outbox-evidence-sealing/payload/scripts/ci-outbox-final-attempt-reaper.sh"
          source="$GITHUB_WORKSPACE/source"
          test -s "$payload"
          bash -n "$payload"
          grep -Eq 'wait .*(tee|TEE|log)' "$payload"
          grep -Eq 'sha256sum .*--check|sha256sum --check' "$payload"
          grep -Eq "files\\.sha256" "$payload"
          cp "$payload" "$source/scripts/ci-outbox-final-attempt-reaper.sh"
          cat > "$source/tests/control_plane/test_outbox_reaper_sealing.py" <<'PY'
          from pathlib import Path
          import re
          import unittest

          ROOT = Path(__file__).resolve().parents[2]
          SCRIPT = ROOT / "scripts/ci-outbox-final-attempt-reaper.sh"

          class OutboxReaperSealingTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.source = SCRIPT.read_text(encoding="utf-8")

              def test_log_writer_is_joined_before_manifest_is_created(self) -> None:
                  manifest = self.source.index("files.sha256")
                  waits = [match.start() for match in re.finditer(r"\bwait\b", self.source)]
                  self.assertTrue(waits, "the tee/log writer must be joined")
                  self.assertLess(max(waits), manifest)

              def test_manifest_excludes_itself(self) -> None:
                  self.assertRegex(
                      self.source,
                      r"(?:!\s+-path|-not\s+-path|!\s+-name|-not\s+-name).*files\\?\.sha256",
                  )

              def test_manifest_is_checked_before_success(self) -> None:
                  self.assertRegex(self.source, r"sha256sum\s+(?:[^\n]*\s)?--check")

          if __name__ == "__main__":
              unittest.main()
          PY
          cd "$source"
          bash -n scripts/ci-outbox-final-attempt-reaper.sh
          python3 -m py_compile tests/control_plane/test_outbox_reaper_sealing.py
          git diff --check

      - name: Execute complete repository control corpus
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.control_plane.test_outbox_reaper_sealing
          python3 -m compileall -q scripts tools tests
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 scripts/derive-gap-status.py
          python3 scripts/derive-gates.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-rust-foundation.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"

      - name: Ordinary fast-forward product branch
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          start=$(cat "$RUNNER_TEMP/start-head")
          observed=$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')
          test "$observed" = "$start"
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add scripts/ci-outbox-final-attempt-reaper.sh tests/control_plane/test_outbox_reaper_sealing.py
          git diff --cached --check
          git commit -m "ci(evidence): seal outbox reaper artifacts before success"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          new_head=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')" = "$new_head"
          printf 'start_head=%s\nnew_head=%s\nnew_tree=%s\n' \
            "$start" "$new_head" "$(git rev-parse HEAD^{tree})"
