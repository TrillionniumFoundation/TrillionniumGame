name: pr100-domain-contract-repair-v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr100-domain-contract-repair-v2
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/reviewer-conflict-capacity-fix-2026-09-07
  EXPECTED_TARGET_HEAD: d6f0e0cae4bb951097ae7916e98523bbf4522058
  TRIGGER_BRANCH: tooling/pr100-domain-contract-trigger-v2-2026-09-07

jobs:
  repair-and-validate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'tooling/pr100-domain-contract-trigger-v2-2026-09-07'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact trigger without external actions
        env:
          CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Patch exact target
        run: |
          set -euo pipefail
          observed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$EXPECTED_TARGET_HEAD"
          git fetch --no-tags --depth=1 origin "$EXPECTED_TARGET_HEAD"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          validator_path = Path("scripts/check-independent-review-matrix.py")
          test_path = Path("tests/control_plane/test_independent_review_domain_contract.py")
          matrix_path = Path("docs/review/INDEPENDENT_REVIEW_MATRIX.json")
          owners_path = Path(".github/CODEOWNERS")

          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          owner_patterns: list[str] = []
          for raw in owners_path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if line and not line.startswith("#"):
                  owner_patterns.append(line.split()[0])

          def covering_pattern(path: str) -> str:
              normalized = path.lstrip("/")
              if normalized.endswith("/**"):
                  normalized = normalized[:-2]
              candidates: list[str] = []
              for pattern in owner_patterns:
                  if pattern == "*":
                      candidates.append(pattern)
                      continue
                  raw = pattern.lstrip("/")
                  if pattern.endswith("/") and normalized.startswith(raw):
                      candidates.append(pattern)
                  elif "*" not in pattern and normalized == raw:
                      candidates.append(pattern)
              if not candidates:
                  raise SystemExit(f"no CODEOWNERS coverage for {path}")
              return max(candidates, key=len)

          specs: dict[str, dict[str, tuple[str, ...]]] = {}
          for domain in matrix["domains"]:
              specs[domain["id"]] = {
                  "required_roles": tuple(sorted(domain["required_roles"])),
                  "protected_paths": tuple(sorted(domain["protected_paths"])),
                  "blocking_gaps": tuple(sorted(domain["blocking_gaps"])),
                  "codeowner_patterns": tuple(
                      sorted({covering_pattern(path) for path in domain["protected_paths"]})
                  ),
              }

          rows = [
              "# Canonical candidate-review contract. The matrix under validation",
              "# cannot redefine, delete or exchange its own domain obligations.",
              "EXPECTED_DOMAINS: dict[str, dict[str, frozenset[str]]] = {",
          ]
          for domain_id in sorted(specs):
              rows.append(f"    {domain_id!r}: {{")
              for field in (
                  "required_roles",
                  "protected_paths",
                  "blocking_gaps",
                  "codeowner_patterns",
              ):
                  rows.append(
                      f"        {field!r}: frozenset({specs[domain_id][field]!r}),"
                  )
              rows.append("    },")
          rows.append("}")
          constant = "\n".join(rows)

          validator = validator_path.read_text(encoding="utf-8")
          class_anchor = "\n\nclass ReviewMatrixError(RuntimeError):"
          if "EXPECTED_DOMAINS:" in validator:
              raise SystemExit("EXPECTED_DOMAINS already present")
          if class_anchor not in validator:
              raise SystemExit("validator class anchor missing")
          validator = validator.replace(
              class_anchor, f"\n\n{constant}{class_anchor}", 1
          )

          helper_anchor = "\n\ndef qualification_evidence("
          if helper_anchor not in validator:
              raise SystemExit("validator helper anchor missing")
          helper = '''

          def validate_canonical_domains(domains: object) -> None:
              require(isinstance(domains, list) and domains, "review domains required")
              actual: dict[str, dict[str, object]] = {}
              for index, domain in enumerate(domains):
                  label = f"domains[{index}]"
                  require(isinstance(domain, dict), f"{label}: object required")
                  domain_id = domain.get("id")
                  require(
                      isinstance(domain_id, str)
                      and IDENTIFIER.fullmatch(domain_id) is not None
                      and domain_id not in actual,
                      f"{label}: invalid or duplicate domain id",
                  )
                  actual[domain_id] = domain
              missing = sorted(set(EXPECTED_DOMAINS) - set(actual))
              extra = sorted(set(actual) - set(EXPECTED_DOMAINS))
              require(
                  not missing and not extra,
                  f"review domain set mismatch: missing={missing}, extra={extra}",
              )
              for domain_id, expected in EXPECTED_DOMAINS.items():
                  domain = actual[domain_id]
                  roles = frozenset(
                      string_list(domain.get("required_roles"), f"{domain_id}.required_roles")
                  )
                  paths = frozenset(
                      string_list(domain.get("protected_paths"), f"{domain_id}.protected_paths")
                  )
                  gaps = frozenset(
                      string_list(domain.get("blocking_gaps"), f"{domain_id}.blocking_gaps")
                  )
                  require(roles == expected["required_roles"], f"{domain_id}: required roles drift")
                  require(paths == expected["protected_paths"], f"{domain_id}: protected paths drift")
                  require(gaps == expected["blocking_gaps"], f"{domain_id}: blocking gaps drift")


          def validate_domain_codeowners(
              codeowners: dict[str, set[str]], expected_owners: set[str]
          ) -> None:
              for domain_id, expected in EXPECTED_DOMAINS.items():
                  missing = sorted(expected["codeowner_patterns"] - set(codeowners))
                  require(
                      not missing,
                      f"{domain_id}: CODEOWNERS missing expected domain patterns {missing}",
                  )
                  for pattern in expected["codeowner_patterns"]:
                      require(
                          expected_owners <= codeowners[pattern],
                          f"{domain_id}: CODEOWNERS pattern {pattern} lacks conflict-surviving review routes",
                      )
          '''
          import textwrap
          validator = validator.replace(
              helper_anchor, textwrap.dedent(helper) + helper_anchor, 1
          )

          domain_call_anchor = (
              '    domains_raw = matrix.get("domains")\n'
              '    domains_to_roles = domain_role_map(domains_raw)\n'
          )
          domain_call_replacement = (
              '    domains_raw = matrix.get("domains")\n'
              '    validate_canonical_domains(domains_raw)\n'
              '    domains_to_roles = domain_role_map(domains_raw)\n'
          )
          if validator.count(domain_call_anchor) != 1:
              raise SystemExit("domain validation call anchor is not unique")
          validator = validator.replace(
              domain_call_anchor, domain_call_replacement, 1
          )

          loop_anchor = "    domain_ids: set[str] = set()\n"
          if validator.count(loop_anchor) != 1:
              raise SystemExit("domain loop anchor is not unique")
          validator = validator.replace(
              loop_anchor,
              "    validate_domain_codeowners(codeowners, expected_owners)\n\n"
              + loop_anchor,
              1,
          )
          validator_path.write_text(validator, encoding="utf-8")

          test_path.write_text(r'''from __future__ import annotations

          import importlib.util
          import json
          import tempfile
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          SCRIPT = ROOT / "scripts/check-independent-review-matrix.py"
          MATRIX = ROOT / "docs/review/INDEPENDENT_REVIEW_MATRIX.json"
          GAPS = ROOT / "docs/status/GAP_REGISTER.json"
          OWNERS = ROOT / ".github/CODEOWNERS"


          def checker():
              spec = importlib.util.spec_from_file_location("domain_contract_checker", SCRIPT)
              assert spec is not None and spec.loader is not None
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          class ReviewDomainContractTests(unittest.TestCase):
              def fixture(self, directory: str):
                  root = Path(directory)
                  matrix = root / "matrix.json"
                  gaps = root / "gaps.json"
                  owners = root / "CODEOWNERS"
                  matrix.write_bytes(MATRIX.read_bytes())
                  gaps.write_bytes(GAPS.read_bytes())
                  owners.write_bytes(OWNERS.read_bytes())
                  return matrix, gaps, owners

              def invalid(self, mutation, pattern: str) -> None:
                  module = checker()
                  with tempfile.TemporaryDirectory() as directory:
                      matrix, gaps, owners = self.fixture(directory)
                      value = json.loads(matrix.read_text(encoding="utf-8"))
                      mutation(value)
                      matrix.write_text(json.dumps(value) + "\n", encoding="utf-8")
                      with self.assertRaisesRegex(module.ReviewMatrixError, pattern):
                          module.validate(matrix, gaps, owners)

              def test_current_contract_passes(self) -> None:
                  result = checker().validate(MATRIX, GAPS, OWNERS)
                  self.assertEqual(result["available_domains"], 0)
                  self.assertEqual(result["blocked_domains"], 6)

              def test_domain_cannot_be_removed(self) -> None:
                  self.invalid(
                      lambda value: value["domains"].pop(),
                      "review domain set mismatch",
                  )

              def test_required_role_cannot_shrink(self) -> None:
                  self.invalid(
                      lambda value: value["domains"][2]["required_roles"].pop(),
                      "required roles drift",
                  )

              def test_protected_path_cannot_be_exchanged(self) -> None:
                  self.invalid(
                      lambda value: value["domains"][1]["protected_paths"].__setitem__(
                          0, "crates/trnm-token-core/**"
                      ),
                      "protected paths drift",
                  )

              def test_blocking_gap_cannot_shrink(self) -> None:
                  self.invalid(
                      lambda value: value["domains"][1]["blocking_gaps"].pop(),
                      "blocking gaps drift",
                  )

              def test_domain_codeowner_mapping_is_required(self) -> None:
                  module = checker()
                  with tempfile.TemporaryDirectory() as directory:
                      matrix, gaps, owners = self.fixture(directory)
                      text = owners.read_text(encoding="utf-8")
                      text = "\n".join(
                          line for line in text.splitlines()
                          if not line.startswith(
                              "/docs/development/SCHEMA_AUTHORITY.json "
                          )
                      ) + "\n"
                      owners.write_text(text, encoding="utf-8")
                      with self.assertRaisesRegex(
                          module.ReviewMatrixError,
                          "CODEOWNERS missing expected domain patterns",
                      ):
                          module.validate(matrix, gaps, owners)


          if __name__ == "__main__":
              unittest.main()
          '''.replace("\n          ", "\n"), encoding="utf-8")
          PY
          test "$(git diff --name-only | sort | paste -sd, -)" = \
            "scripts/check-independent-review-matrix.py,tests/control_plane/test_independent_review_domain_contract.py"

      - name: Execute focused and complete controls
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check-independent-review-matrix.py \
            tests/control_plane/test_independent_review_domain_contract.py
          python3 -m unittest \
            tests.control_plane.test_independent_review_domain_contract \
            tests.control_plane.test_independent_review_matrix
          python3 scripts/check-independent-review-matrix.py > /tmp/review-matrix.json
          python3 -m unittest discover -s tests/control_plane -p 'test_*.py'
          python3 - <<'PY'
          import json
          value = json.load(open('/tmp/review-matrix.json', encoding='utf-8'))
          assert value['available_domains'] == 0
          assert value['blocked_domains'] == 6
          assert value['required_roles'] == 12
          assert value['covered_required_roles'] == 0
          assert value['all_required_reviews_available'] is False
          PY

      - name: Commit non-force exact target repair
        env:
          AUTHOR_NAME: trillionnium-governance-bot
          AUTHOR_EMAIL: trillionnium-governance-bot@users.noreply.github.com
        run: |
          set -euo pipefail
          observed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$EXPECTED_TARGET_HEAD"
          git config user.name "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add \
            scripts/check-independent-review-matrix.py \
            tests/control_plane/test_independent_review_domain_contract.py
          git diff --cached --check
          git commit -m "fix(governance): pin canonical independent-review domains"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_HEAD"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
