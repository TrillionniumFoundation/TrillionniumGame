name: native-artifact-retention-preflight

on:
  push:
    branches: [tooling/session-response-loss-preflight-2026-09-06]

permissions:
  contents: read

concurrency:
  group: native-artifact-retention-preflight
  cancel-in-progress: true

env:
  PRODUCT_HEAD: d6df83741ea7c55d799605b349a655669498da57

jobs:
  upload-bounded-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact tooling and candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/tooling" "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin \
            https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/tooling" rev-parse HEAD)" = "$GITHUB_SHA"

          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin "$PRODUCT_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$PRODUCT_HEAD"
      - name: Build deterministic nonempty packet
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/native-artifact-preflight"
          mkdir -p "$packet"
          printf '{"schema":"trillionnium.native-artifact-preflight.v1","repository":"%s","head":"%s","run_id":"%s","run_attempt":"%s","job":"%s","claims":{"accepted_evidence":false,"gap_closed":false}}\n' \
            "$GITHUB_REPOSITORY" "$PRODUCT_HEAD" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" \
            > "$packet/identity.json"
          sha256sum "$packet/identity.json" > "$packet/SHA256SUMS"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/native-artifact-preflight.tar.gz" -C "$packet" .
          test -s "$RUNNER_TEMP/native-artifact-preflight.tar.gz"
      - name: Upload through hardened first-party transport
        id: upload
        uses: ./tooling/publish
        with:
          name: native-artifact-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-artifact-preflight.tar.gz
          mime_type: application/gzip
      - name: Publish bounded receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.upload.outputs.artifact_id }}'
          test '${{ steps.upload.outputs.sha256 }}' != ''
          test '${{ steps.upload.outputs.size_bytes }}' -gt 0
          printf 'artifact_id=%s\nsha256=%s\nsize_bytes=%s\n' \
            '${{ steps.upload.outputs.artifact_id }}' \
            '${{ steps.upload.outputs.sha256 }}' \
            '${{ steps.upload.outputs.size_bytes }}'
