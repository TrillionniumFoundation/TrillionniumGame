name: readonly-review-export

on:
  push:
    branches: [tooling/readonly-review-export-arm-8fde7e81]

permissions:
  contents: read
  actions: read

jobs:
  supplementary-arm-rust-not-required-gates:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - name: Fetch exact tooling and unchanged source plus actual merge objects
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/tooling" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/tooling" hash-object build_probe.py)" = f6a3a513941e1db992601826f3a2c2e73b0f85a9
          test "$(git -C "$GITHUB_WORKSPACE/tooling" hash-object test_build_probe.py)" = d17e823f6067db961db9a0fa8c8bc4f84e4c107c
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=2 origin be2be89efa3984e82b4e8584e2b8d6e7e315c9ca
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=2 origin refs/pull/63/merge
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse FETCH_HEAD)" = a630c3fab4113f5e7a8fd86252cf0f586be3aca7
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = be2be89efa3984e82b4e8584e2b8d6e7e315c9ca
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = 7aaa04dd376c6beade753d610f0649fd9db526bf
      - name: Validate bounded runner and source inventory using synthetic processes
        shell: bash
        working-directory: tooling
        run: python3 -m unittest -v test_build_probe
      - name: Install the product-pinned Rust compiler format and lint components
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustc +1.85.1 --version --verbose
          cargo +1.85.1 --version --verbose
      - name: Run all root and isolated Rust commands on both fixed objects without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tooling/build_probe.py" --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/rust-matrix"
      - name: Retain the command outcomes including failed diagnostics
        uses: ./tooling/publish
      - name: Reject incomplete failed empty or stale supplementary matrices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'rust-matrix/matrix.json').read_text())
          assert r['complete'] is True
          assert r['architecture']=='aarch64'
          assert len(r['commands'])==70
          assert all(x['returncode']==0 and x['failure'] is None for x in r['commands'])
          assert sum('tests' in x for x in r['commands'])==24
          source=Path(os.environ['GITHUB_WORKSPACE'])/'source'
          refs=subprocess.run(['git','-C',str(source),'ls-remote','origin','refs/heads/main','refs/heads/codex/branch-evidence-closure-2026-09-02','refs/pull/63/merge'],check=True,capture_output=True,text=True,timeout=30)
          observed={ref:sha for sha,ref in (line.split() for line in refs.stdout.splitlines())}
          assert observed=={'refs/heads/main':'d66c1b5b614a2a7b682c233fe2e7a19939b6976b','refs/heads/codex/branch-evidence-closure-2026-09-02':'be2be89efa3984e82b4e8584e2b8d6e7e315c9ca','refs/pull/63/merge':'a630c3fab4113f5e7a8fd86252cf0f586be3aca7'}
          print('Supplementary ARM source/merge Rust matrix: PASS; required x64 gates, live databases and independent acceptance remain separate.')
          PY
