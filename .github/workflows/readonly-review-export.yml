name: readonly-review-export

on:
  push:
    branches: [tooling/readonly-review-export-arm-8fde7e81]

permissions:
  contents: read
  actions: read

jobs:
  diagnostic-export-not-acceptance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - name: Fetch fixed tooling and the exact current product candidate
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/tooling" rev-parse HEAD)" = "$GITHUB_SHA"
          cd "$GITHUB_WORKSPACE/tooling"
          printf '%s\n' '1e58a66edd5b0d0bfe002ab9da78aa4adf61bdd0e6ecac95076807c8d7fce5d0  export-source.json.gz' | sha256sum -c -
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          files = json.loads(gzip.decompress(Path('export-source.json.gz').read_bytes()))
          assert set(files) == {'export_packet.py', 'test_export_packet.py'}
          replacements = {
              "HEAD = '8fde7e81b94113fa72f3bc700fba78c7da01b36e'": "HEAD = 'bdfa705c751be77aff1f7e35f14c76ed4e032ea4'",
              "TREE = '4d816c8d25e0e9fc42982e433447985e7bfcbee2'": "TREE = 'f2391bbf7210d155fc7e56a190253cbadc820802'",
              "MERGE = 'f24495de21def9f824135a8ec54bfb69a1e3e4ec'": "MERGE = '4a06c89dcc6ddd27679b11a909f87e213f75a8aa'",
              'GATES = (33940741805, 33940741737)': 'GATES = (33944870643, 33944870724)',
          }
          for old, new in replacements.items():
              assert files['export_packet.py'].count(old) == 1
              files['export_packet.py'] = files['export_packet.py'].replace(old, new)
          for name, text in files.items():
              with open(name, 'x', encoding='utf-8') as stream:
                  stream.write(text)
          PY
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin bdfa705c751be77aff1f7e35f14c76ed4e032ea4
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = bdfa705c751be77aff1f7e35f14c76ed4e032ea4
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = f2391bbf7210d155fc7e56a190253cbadc820802
          test "$(git -C "$GITHUB_WORKSPACE/source" hash-object scripts/upload-actions-artifact.py)" = 0943a72a5978241a79e590b34d759cb2878b77d2
          test "$(git -C "$GITHUB_WORKSPACE/source" hash-object tests/control_plane/test_actions_artifact_protocol.py)" = 8732c8f2464d49e7e91291591d02d661449972fe
      - name: Test the identity-bound read-only exporter
        shell: bash
        working-directory: tooling
        run: python3 -m unittest -v test_export_packet
      - name: Run complete product Python and source-control preflight without credentials
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/product-preflight.log"
          grep -Eq '^Ran 411 tests in ' "$RUNNER_TEMP/product-preflight.log"
          grep -qx 'OK' "$RUNNER_TEMP/product-preflight.log"
          for check in check-documentation-authority.py check-plan.py check-evidence-index.py check-gap-register.py derive-gap-status.py derive-gates.py check-status-transitions.py check-workflow-action-policy.py check-repository-hygiene.py check-trnm-server.py check-rust-foundation.py; do
            python3 "scripts/$check"
          done
          test -z "$(git status --porcelain)"
      - name: Retain actual current-head logs and bounded embedded archives
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tooling/export_packet.py" --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/trnm-review-bdfa705c.zip"
      - name: Store diagnostic ZIP through the corrected product uploader
        uses: ./tooling/publish
