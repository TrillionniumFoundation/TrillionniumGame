name: session-interleaving-publisher

on:
  push:
    branches: [tooling/session-response-loss-preflight-2026-09-06]

permissions:
  contents: write

concurrency:
  group: session-interleaving-publisher
  cancel-in-progress: true

env:
  EXPECTED_HEAD: 296e3deff5949c297e7147485d2b3764b838adce
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
  PATCH_SOURCE_COMMIT: dc38c707ba8f48e96cf9a08bfaefb15c7dbfe19c
  CARGO_TERM_COLOR: never

jobs:
  exact-session-interleaving-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact tooling and candidate
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin \
            https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=8 origin \
            "refs/heads/${GITHUB_REF_NAME}"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          git -C "$GITHUB_WORKSPACE/tooling" cat-file -e "${PATCH_SOURCE_COMMIT}^{commit}"

          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=64 origin \
            "refs/heads/${PRODUCT_BRANCH}"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"

      - name: Extract and validate fixed patch program
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/tooling" show \
            "${PATCH_SOURCE_COMMIT}:.github/workflows/readonly-review-export.yml" \
            > "$RUNNER_TEMP/patch-source.yml"
          PATCH_SOURCE="$RUNNER_TEMP/patch-source.yml" \
          PATCH_PROGRAM="$RUNNER_TEMP/session-interleaving-patch.py" \
          python3 - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          source = Path(os.environ["PATCH_SOURCE"]).read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          cargo +1.85.1 fmt --all"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit("fixed patch program markers changed")
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          program = textwrap.dedent(body)
          Path(os.environ["PATCH_PROGRAM"]).write_text(program, encoding="utf-8")
          PY
          python3 -m py_compile "$RUNNER_TEMP/session-interleaving-patch.py"
          sha256sum "$RUNNER_TEMP/patch-source.yml" \
            "$RUNNER_TEMP/session-interleaving-patch.py"

      - name: Install exact compiler and formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustc +1.85.1 --version --verbose
          cargo +1.85.1 --version --verbose

      - name: Apply and verify deterministic session contracts
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/session-interleaving-patch.py"
          cargo +1.85.1 fmt --all
          expected_paths=$(cat <<'EOF'
          crates/trnm-persistence-pg/Cargo.toml
          crates/trnm-persistence-pg/src/lib.rs
          crates/trnm-persistence-pg/src/session.rs
          crates/trnm-persistence-pg/tests/session_response_loss.rs
          scripts/check-pg-server-response-loss.sh
          scripts/ci-trnm-server-live.sh
          tests/control_plane/test_session_live_harness_scope.py
          EOF
          )
          test "$(git diff --name-only)" = "$expected_paths"
          git diff --check
          bash -n scripts/check-pg-server-response-loss.sh
          bash -n scripts/ci-trnm-server-live.sh
          cargo +1.85.1 fmt --all -- --check
          python3 -m unittest -v tests.control_plane.test_session_live_harness_scope
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-trnm-server.py
          cargo +1.85.1 test -p trnm-persistence-pg --all-targets --locked -- --nocapture
          cargo +1.85.1 test -p trnm-persistence-pg --all-targets \
            --features session-test-hooks --locked -- --nocapture
          cargo +1.85.1 clippy -p trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo +1.85.1 clippy -p trnm-persistence-pg --all-targets \
            --features session-test-hooks --locked -- -D warnings

      - name: Commit and ordinary fast-forward push
        shell: bash
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'Trillionnium qualification bot'
          git config user.email 'qualification-bot@invalid'
          git add \
            crates/trnm-persistence-pg/Cargo.toml \
            crates/trnm-persistence-pg/src/lib.rs \
            crates/trnm-persistence-pg/src/session.rs \
            crates/trnm-persistence-pg/tests/session_response_loss.rs \
            scripts/check-pg-server-response-loss.sh \
            scripts/ci-trnm-server-live.sh \
            tests/control_plane/test_session_live_harness_scope.py
          git commit -m 'test(session): add deterministic multi-connection histories'
          new_head=$(git rev-parse HEAD)
          new_tree=$(git rev-parse HEAD^{tree})
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$new_head"
          printf 'new_head=%s\nnew_tree=%s\nforce_push=false\nmain_write=false\n' \
            "$new_head" "$new_tree"
