name: session-ssi-setup-repair-publisher

on:
  push:
    branches: [tooling/session-response-loss-preflight-2026-09-06]

permissions:
  contents: write

concurrency:
  group: session-ssi-setup-repair-publisher
  cancel-in-progress: true

env:
  EXPECTED_HEAD: 95548e7a6b2a00696d81579aef2e7b70715d8993
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
  CARGO_TERM_COLOR: never

jobs:
  exact-session-ssi-setup-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=64 origin \
            "refs/heads/${PRODUCT_BRANCH}"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"

      - name: Install exact compiler and formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustc +1.85.1 --version --verbose
          cargo +1.85.1 --version --verbose

      - name: Apply bounded SSI setup repair
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path("crates/trnm-persistence-pg/tests/session_response_loss.rs")
          source = test_path.read_text(encoding="utf-8")
          old = '''    match repository
              .rotate_refresh_token(&RotateRefreshToken {
                  presented: predecessor,
                  replacement: successor,
                  rotated_at_ms: 200,
              })
              .unwrap()
          {
              RefreshRotationOutcome::Rotated(record) => record,
              RefreshRotationOutcome::ReplayRevoked(_) => {
                  panic!("fresh setup rotation was classified as replay")
              }
          }
          '''
          new = '''    let request = RotateRefreshToken {
              presented: predecessor,
              replacement: successor,
              rotated_at_ms: 200,
          };
          for attempt in 0..4 {
              match repository.rotate_refresh_token(&request) {
                  Ok(RefreshRotationOutcome::Rotated(record)) => return record,
                  Ok(RefreshRotationOutcome::ReplayRevoked(_)) => {
                      panic!("fresh setup rotation was classified as replay")
                  }
                  Err(error)
                      if error.code() == StableCode::Aborted
                          && error.reason() == "database_serialization_failure"
                          && attempt < 3 =>
                  {
                      repository = PgRepository::connect(database_url, profile).unwrap();
                  }
                  Err(error) => panic!("fresh setup rotation failed: {error}"),
              }
          }
          unreachable!("bounded fresh setup rotation retries exhausted")
          '''
          if source.count(old) != 1:
              raise SystemExit("session setup rotation block changed")
          test_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          for name in (
              "scripts/check-pg-server-response-loss.sh",
              "scripts/ci-trnm-server-live.sh",
          ):
              path = Path(name)
              source = path.read_text(encoding="utf-8")
              old = "--test session_response_loss -- --nocapture 2>&1 | tee"
              new = "--test session_response_loss -- --nocapture --test-threads=1 2>&1 | tee"
              if source.count(old) != 1:
                  raise SystemExit(f"{name}: session test invocation changed")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")

          static_path = Path("tests/control_plane/test_session_live_harness_scope.py")
          source = static_path.read_text(encoding="utf-8")
          old = '''        self.assertIn("SessionMutationPoint::BeforeCommit", source)
                  self.assertIn("SessionMutationPoint::CredentialResolved", source)
          '''
          new = '''        self.assertIn("SessionMutationPoint::BeforeCommit", source)
                  self.assertIn("SessionMutationPoint::CredentialResolved", source)
                  self.assertIn("for attempt in 0..4", source)
                  self.assertIn('error.reason() == "database_serialization_failure"', source)
          '''
          if source.count(old) != 1:
              raise SystemExit("static session setup-retry insertion point changed")
          source = source.replace(old, new, 1)
          old = '''                self.assertIn("--features session-test-hooks", source)
                          self.assertIn('test "$session_test_count" -ge 8', source)
          '''
          new = '''                self.assertIn("--features session-test-hooks", source)
                          self.assertIn("--test-threads=1", source)
                          self.assertIn('test "$session_test_count" -ge 8', source)
          '''
          if source.count(old) != 1:
              raise SystemExit("static serial invocation insertion point changed")
          static_path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

          cargo +1.85.1 fmt --all
          expected_paths=$(cat <<'EOF'
          crates/trnm-persistence-pg/tests/session_response_loss.rs
          scripts/check-pg-server-response-loss.sh
          scripts/ci-trnm-server-live.sh
          tests/control_plane/test_session_live_harness_scope.py
          EOF
          )
          test "$(git diff --name-only)" = "$expected_paths"
          git diff --check
          bash -n scripts/check-pg-server-response-loss.sh
          bash -n scripts/ci-trnm-server-live.sh
          cargo +1.85.1 fmt --all -- --check
          python3 -m unittest -v tests.control_plane.test_session_live_harness_scope
          cargo +1.85.1 test -p trnm-persistence-pg --all-targets \
            --features session-test-hooks --locked -- --nocapture
          cargo +1.85.1 clippy -p trnm-persistence-pg --all-targets \
            --features session-test-hooks --locked -- -D warnings

      - name: Execute exact PostgreSQL response-loss contract
        shell: bash
        working-directory: source
        env:
          TRNM_PG_RESPONSE_LOSS_ROOT: run/session-ssi-preflight
        run: bash scripts/check-pg-server-response-loss.sh

      - name: Commit and ordinary fast-forward push
        shell: bash
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'Trillionnium qualification bot'
          git config user.email 'qualification-bot@invalid'
          git add \
            crates/trnm-persistence-pg/tests/session_response_loss.rs \
            scripts/check-pg-server-response-loss.sh \
            scripts/ci-trnm-server-live.sh \
            tests/control_plane/test_session_live_harness_scope.py
          git commit -m 'test(session): isolate shared database fixtures from SSI noise'
          new_head=$(git rev-parse HEAD)
          new_tree=$(git rev-parse HEAD^{tree})
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$new_head"
          printf 'new_head=%s\nnew_tree=%s\nforce_push=false\nmain_write=false\n' \
            "$new_head" "$new_tree"
