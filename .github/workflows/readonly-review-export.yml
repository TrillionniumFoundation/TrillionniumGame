name: session-summary-parser-publisher

on:
  push:
    branches: [tooling/session-response-loss-preflight-2026-09-06]

permissions:
  contents: write

concurrency:
  group: session-repair-publisher
  cancel-in-progress: true

env:
  EXPECTED_HEAD: 39d73f9be6020118027889dd2ebd15e6500f23c7
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
  CARGO_TERM_COLOR: never

jobs:
  exact-summary-parser-publish:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Fetch exact candidate with authenticated write transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" \
            -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --depth=32 origin "refs/heads/${PRODUCT_BRANCH}"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"

      - name: Install exact compiler and formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustc +1.85.1 --version --verbose
          cargo +1.85.1 --version --verbose

      - name: Apply three exact parser-contract edits and verify
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              'scripts/check-pg-server-response-loss.sh',
              'scripts/ci-trnm-server-live.sh',
          ):
              path = Path(name)
              source = path.read_text(encoding='utf-8')
              old = 'TRNM_REQUIRE_LIVE_DATABASE=1 \\\nTRNM_DATABASE_URL="$database_url" \\\n'
              new = 'CARGO_TERM_COLOR=never \\\nTRNM_REQUIRE_LIVE_DATABASE=1 \\\nTRNM_DATABASE_URL="$database_url" \\\n'
              if source.count(old) != 1 or 'CARGO_TERM_COLOR=never \\\nTRNM_REQUIRE_LIVE_DATABASE=1' in source:
                  raise SystemExit(f'{name}: live cargo environment block changed')
              path.write_text(source.replace(old, new), encoding='utf-8')

          path = Path('tests/control_plane/test_session_live_harness_scope.py')
          source = path.read_text(encoding='utf-8')
          old = '                self.assertIn("session_test_count=", source)\n'
          new = (
              '                self.assertIn("CARGO_TERM_COLOR=never", source)\n'
              '                self.assertIn("session_test_count=", source)\n'
          )
          if source.count(old) != 1 or 'self.assertIn("CARGO_TERM_COLOR=never", source)' in source:
              raise SystemExit('static harness test insertion point changed')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          expected_paths=$(cat <<'EOF'
          scripts/check-pg-server-response-loss.sh
          scripts/ci-trnm-server-live.sh
          tests/control_plane/test_session_live_harness_scope.py
          EOF
          )
          test "$(git diff --name-only)" = "$expected_paths"
          git diff --check
          bash -n scripts/check-pg-server-response-loss.sh
          bash -n scripts/ci-trnm-server-live.sh
          cargo +1.85.1 fmt --all -- --check
          python3 -m unittest -v tests.control_plane.test_session_live_harness_scope
          cargo +1.85.1 test -p trnm-persistence-pg --all-targets --locked -- --nocapture
          cargo +1.85.1 clippy -p trnm-persistence-pg --all-targets --locked -- -D warnings

      - name: Commit and ordinary fast-forward push
        shell: bash
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'Trillionnium qualification bot'
          git config user.email 'qualification-bot@invalid'
          git add \
            scripts/check-pg-server-response-loss.sh \
            scripts/ci-trnm-server-live.sh \
            tests/control_plane/test_session_live_harness_scope.py
          git commit -m 'fix(ci): make session test summary parsing deterministic'
          new_head=$(git rev-parse HEAD)
          new_tree=$(git rev-parse HEAD^{tree})
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$new_head"
          printf 'new_head=%s\nnew_tree=%s\nforce_push=false\nmain_write=false\n' \
            "$new_head" "$new_tree"
