name: session-harness-current-preflight

on:
  push:
    branches: [tooling/session-response-loss-preflight-2026-09-06]

permissions:
  contents: read
  actions: read

env:
  BASE_COMMIT: d66c1b5b614a2a7b682c233fe2e7a19939b6976b
  PRODUCT_HEAD: 6f2b8ab5c4432e811d7eae6ac88fb8170835821a
  PRODUCT_TREE: eacab2860d72988fd005325f5468cffe73c08596
  PRODUCT_MERGE: b20c8a46aa72d8fb9a90076cc7536410a69fea1f
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  current-source-and-merge:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Fetch exact current product source and GitHub merge
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=32 origin "$PRODUCT_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$PRODUCT_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=2 origin refs/pull/63/merge
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse FETCH_HEAD)" = "$PRODUCT_MERGE"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse "$PRODUCT_MERGE^{tree}")" = "$PRODUCT_TREE"
          mapfile -t parents < <(git -C "$GITHUB_WORKSPACE/source" cat-file -p "$PRODUCT_MERGE" | sed -n 's/^parent //p')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$BASE_COMMIT"
          test "${parents[1]}" = "$PRODUCT_HEAD"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustc +1.85.1 --version --verbose
          cargo +1.85.1 --version --verbose

      - name: Execute current source and merge contracts
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          for pair in "source:$PRODUCT_HEAD" "merge:$PRODUCT_MERGE"; do
            label=${pair%%:*}
            object=${pair#*:}
            git checkout --detach "$object"
            test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
            test -z "$(git status --porcelain)"

            bash -n scripts/check-pg-server-response-loss.sh
            bash -n scripts/ci-trnm-server-live.sh
            python3 -m unittest -v tests.control_plane.test_session_live_harness_scope

            cargo +1.85.1 fmt --all -- --check
            cargo +1.85.1 test -p trnm-persistence-pg --all-targets --locked -- --nocapture \
              2>&1 | tee "$RUNNER_TEMP/${label}-persistence-tests.log"
            cargo +1.85.1 clippy -p trnm-persistence-pg --all-targets --locked -- -D warnings

            python3 -m compileall -q scripts tools tests
            python3 -m unittest discover -s tests -p 'test_*.py' -v \
              2>&1 | tee "$RUNNER_TEMP/${label}-python.log"
            grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/${label}-python.log"
            grep -qx OK "$RUNNER_TEMP/${label}-python.log"

            for check in \
              check-documentation-authority.py \
              check-plan.py \
              check-evidence-index.py \
              check-gap-register.py \
              derive-gap-status.py \
              derive-gates.py \
              check-status-transitions.py \
              check-workflow-action-policy.py \
              check-repository-hygiene.py \
              check-trnm-server.py \
              check-rust-foundation.py; do
              python3 "scripts/$check"
            done

            (
              cd runtime
              GOTOOLCHAIN=go1.26.5 go test ./... -count=1
              GOTOOLCHAIN=go1.26.5 go test -race ./... -count=1
              GOTOOLCHAIN=go1.26.5 go vet ./...
            )
            test -z "$(git status --porcelain)"
            printf '%s object=%s tree=%s result=pass\n' "$label" "$object" "$PRODUCT_TREE"
          done

      - name: Prove product refs remained unchanged
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_COMMIT"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | cut -f1)" = "$PRODUCT_HEAD"
          test "$(git ls-remote origin refs/pull/63/merge | cut -f1)" = "$PRODUCT_MERGE"
          printf 'ordinary_required_gate_credit=false\nindependent_acceptance=false\ngap_closed=false\n'
