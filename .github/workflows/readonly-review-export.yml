name: verify-live-base-to-head-transitions

on:
  push:
    branches: [tooling/readonly-review-export-arm-8fde7e81]

permissions:
  contents: read
  actions: read

env:
  BASE_COMMIT: d66c1b5b614a2a7b682c233fe2e7a19939b6976b
  PRODUCT_HEAD: 545569a4936f08d0eed0b79806e04239cbe8e835
  PRODUCT_TREE: 00ca7f813f5dcb1e46935cf6bc0121ca33888c7e
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02

jobs:
  base-to-head-transition-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Fetch exact tooling, base and head
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD

          for pair in "base:$BASE_COMMIT" "head:$PRODUCT_HEAD"; do
            label=${pair%%:*}; object=${pair#*:}
            git init "$GITHUB_WORKSPACE/$label"
            git -C "$GITHUB_WORKSPACE/$label" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
            git -C "$GITHUB_WORKSPACE/$label" fetch --no-tags --depth=1 origin "$object"
            git -C "$GITHUB_WORKSPACE/$label" checkout --detach FETCH_HEAD
            test "$(git -C "$GITHUB_WORKSPACE/$label" rev-parse HEAD)" = "$object"
          done
          test "$(git -C "$GITHUB_WORKSPACE/head" rev-parse HEAD^{tree})" = "$PRODUCT_TREE"

      - name: Execute real base-to-head transition policy without masking outcome
        id: transition
        shell: bash
        run: |
          set +e
          proof="$RUNNER_TEMP/live-transition-proof"
          mkdir -p "$proof"
          python3 "$GITHUB_WORKSPACE/head/scripts/status_transition_policy.py" \
            --previous-root "$GITHUB_WORKSPACE/base" \
            --current-root "$GITHUB_WORKSPACE/head" \
            > "$proof/report.json" 2> "$proof/stderr.txt"
          rc=$?
          printf '%s\n' "$rc" > "$proof/returncode.txt"
          printf 'returncode=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          cat "$proof/report.json" || true
          cat "$proof/stderr.txt" >&2 || true
          exit 0

      - name: Build retained diagnostic packet
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/live-transition-proof"
          git -C "$GITHUB_WORKSPACE/base" cat-file commit "$BASE_COMMIT" > "$proof/base-commit.txt"
          git -C "$GITHUB_WORKSPACE/head" cat-file commit "$PRODUCT_HEAD" > "$proof/head-commit.txt"
          git -C "$GITHUB_WORKSPACE/head" ls-remote origin refs/heads/main refs/heads/$PRODUCT_BRANCH > "$proof/live-refs.txt"
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'live-transition-proof'
          rc=int((root/'returncode.txt').read_text())
          identity={
            'schema':'trillionnium.live-status-transition-diagnostic.v1',
            'repository':'TrillionniumFoundation/TrillionniumGame',
            'base_commit':os.environ['BASE_COMMIT'],
            'head_commit':os.environ['PRODUCT_HEAD'],
            'head_tree':os.environ['PRODUCT_TREE'],
            'returncode':rc,
            'valid':rc==0,
            'producer':{key:os.environ.get(key) for key in ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB')},
            'claims':{'ordinary_required_gate_passed':False,'independently_accepted':False,'gap_closed':False},
            'limitations':['Diagnostic comparison only; GitHub event/base provenance and ordinary workflow admission remain separate.']}
          (root/'identity.json').write_text(json.dumps(identity,indent=2)+'\n')
          files={p.name:p.read_bytes() for p in root.iterdir() if p.is_file()}
          (root/'file-index.json').write_text(json.dumps([{'path':n,'size_bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()} for n,b in sorted(files.items())],indent=2)+'\n')
          files={p.name:p.read_bytes() for p in root.iterdir() if p.is_file()}
          with zipfile.ZipFile(root/'live-transition-diagnostic.zip','x',zipfile.ZIP_DEFLATED) as archive:
            for name,data in sorted(files.items()): archive.writestr(name,data)
          PY

      - name: Retain diagnostic whether pass or fail
        uses: ./tooling/publish

      - name: Reject illegal live transition or moved refs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.transition.outputs.returncode }}" = 0
          test "$(git -C "$GITHUB_WORKSPACE/head" ls-remote origin refs/heads/main | cut -f1)" = "$BASE_COMMIT"
          test "$(git -C "$GITHUB_WORKSPACE/head" ls-remote origin refs/heads/$PRODUCT_BRANCH | cut -f1)" = "$PRODUCT_HEAD"
