name: qualify-current-gap-scope-head

on:
  push:
    branches: [tooling/readonly-review-export-arm-8fde7e81]

permissions:
  contents: read
  actions: read

env:
  BASE_COMMIT: d66c1b5b614a2a7b682c233fe2e7a19939b6976b
  PRODUCT_HEAD: 33307fd643e3f450d4d3439f8560593ea214d060
  PRODUCT_TREE: 131eeb3f2aa67a61743aee39dec6c84dfb1e108b
  PRODUCT_MERGE: 44a8438e84c4158332af40eec720d3b22057504a
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
  GAP_SCOPE_TEST_BLOB: dd3c547e7b2032d9cf3f3d85dbce6890e9bb4dc6

jobs:
  current-source-and-merge-supplementary:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Fetch exact tooling and immutable product objects
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/tooling" rev-parse HEAD)" = "$GITHUB_SHA"

          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=2 origin "$PRODUCT_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=2 origin refs/pull/63/merge
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse FETCH_HEAD)" = "$PRODUCT_MERGE"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse "$PRODUCT_HEAD^{tree}")" = "$PRODUCT_TREE"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse "$PRODUCT_MERGE^{tree}")" = "$PRODUCT_TREE"
          test "$(git -C "$GITHUB_WORKSPACE/source" hash-object tests/control_plane/test_gap_register_scope_lock.py)" = "$GAP_SCOPE_TEST_BLOB"
          mapfile -t parents < <(git -C "$GITHUB_WORKSPACE/source" cat-file -p "$PRODUCT_MERGE" | sed -n 's/^parent //p')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$BASE_COMMIT"
          test "${parents[1]}" = "$PRODUCT_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" ls-remote origin refs/heads/$PRODUCT_BRANCH | cut -f1)" = "$PRODUCT_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" ls-remote origin refs/pull/63/merge | cut -f1)" = "$PRODUCT_MERGE"

      - name: Execute complete Python and control qualification on source and merge
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/gap-scope-proof"
          mkdir -p "$proof"
          for pair in "source:$PRODUCT_HEAD" "merge:$PRODUCT_MERGE"; do
            label=${pair%%:*}
            object=${pair#*:}
            git checkout --detach "$object"
            test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
            test "$(git hash-object tests/control_plane/test_gap_register_scope_lock.py)" = "$GAP_SCOPE_TEST_BLOB"
            python3 -m compileall -q scripts tools tests 2>&1 | tee "$proof/${label}-compileall.log"
            python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$proof/${label}-python.log"
            grep -Eq '^Ran [1-9][0-9]* tests in ' "$proof/${label}-python.log"
            grep -qx OK "$proof/${label}-python.log"
            for test_name in \
              test_repository_gap_scope_is_non_shrinkable \
              test_gap_removal_or_substitution_is_rejected \
              test_severity_external_dependency_and_policy_cannot_be_weakened \
              test_required_evidence_and_blocking_claims_cannot_shrink \
              test_close_criteria_denominator_and_per_gap_minimum_cannot_shrink \
              test_duplicate_keys_ids_criteria_and_evidence_are_rejected \
              test_required_aggregate_still_discovers_complete_python_suite; do
              grep -F "$test_name" "$proof/${label}-python.log"
            done
            {
              for check in \
                check-documentation-authority.py \
                check-plan.py \
                check-evidence-index.py \
                check-gap-register.py \
                derive-gap-status.py \
                derive-gates.py \
                check-status-transitions.py \
                check-workflow-action-policy.py \
                check-repository-hygiene.py \
                check-trnm-server.py \
                check-rust-foundation.py; do
                printf '\n=== %s ===\n' "$check"
                python3 "scripts/$check"
              done
            } 2>&1 | tee "$proof/${label}-controls.log"
            test -z "$(git status --porcelain)"
          done

      - name: Build bounded diagnostic packet
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/gap-scope-proof"
          git cat-file commit "$PRODUCT_HEAD" > "$proof/source-commit.txt"
          git cat-file commit "$PRODUCT_MERGE" > "$proof/merge-commit.txt"
          git ls-remote origin refs/heads/main refs/heads/$PRODUCT_BRANCH refs/pull/63/merge > "$proof/live-refs.txt"
          python3 - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "gap-scope-proof"
          counts = {}
          for label in ("source", "merge"):
              text = (root / f"{label}-python.log").read_text(errors="replace")
              match = re.search(r"^Ran ([1-9][0-9]*) tests in ", text, re.M)
              if not match or not re.search(r"^OK$", text, re.M):
                  raise RuntimeError(f"{label} Python summary missing")
              counts[label] = int(match.group(1))
          identity = {
              "schema": "trillionnium.gap-scope-supplementary.v1",
              "repository": "TrillionniumFoundation/TrillionniumGame",
              "source_commit": os.environ["PRODUCT_HEAD"],
              "source_tree": os.environ["PRODUCT_TREE"],
              "prospective_merge": os.environ["PRODUCT_MERGE"],
              "prospective_merge_tree": os.environ["PRODUCT_TREE"],
              "ordered_merge_parents": [os.environ["BASE_COMMIT"], os.environ["PRODUCT_HEAD"]],
              "gap_scope_test_blob": os.environ["GAP_SCOPE_TEST_BLOB"],
              "producer": {key: os.environ.get(key) for key in ("GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB")},
              "execution": {
                  "source_python_tests_passed": counts["source"],
                  "merge_python_tests_passed": counts["merge"],
                  "control_checks_per_object": 11,
                  "objects_checked": 2,
              },
              "claims": {
                  "supplementary_execution_observed": True,
                  "ordinary_required_gate_passed": False,
                  "independently_accepted": False,
                  "gap_closed": False,
                  "production_ready": False,
              },
              "limitations": [
                  "Read-only supplementary ARM execution; it cannot replace the manifest-required ordinary workflow collection.",
                  "No live database, Rust, Go, SDK differential, endurance, administrator read-back or independent acceptance credit is granted by this packet.",
                  "The gap-scope tests validate source semantics and do not establish that any close criterion is factually satisfied.",
              ],
          }
          (root / "identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          files = {p.name: p.read_bytes() for p in root.iterdir() if p.is_file()}
          index = [
              {"path": name, "size_bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
              for name, data in sorted(files.items())
          ]
          (root / "file-index.json").write_text(json.dumps(index, indent=2) + "\n")
          files = {p.name: p.read_bytes() for p in root.iterdir() if p.is_file()}
          with zipfile.ZipFile(root / "gap-scope-supplementary.zip", "x", zipfile.ZIP_DEFLATED) as archive:
              for name, data in sorted(files.items()):
                  archive.writestr(name, data)
          PY

      - name: Retain exact diagnostic packet
        uses: ./tooling/publish

      - name: Reject moved product identities
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_COMMIT"
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | cut -f1)" = "$PRODUCT_HEAD"
          test "$(git ls-remote origin refs/pull/63/merge | cut -f1)" = "$PRODUCT_MERGE"
          printf 'source=%s\nmerge=%s\ntree=%s\nordinary_required_gate_credit=false\n' "$PRODUCT_HEAD" "$PRODUCT_MERGE" "$PRODUCT_TREE"
