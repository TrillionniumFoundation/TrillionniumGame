name: readonly-review-export

on:
  push:
    branches: [tooling/readonly-review-export-arm-8fde7e81]

permissions:
  contents: read
  actions: read

jobs:
  acceptance-source-and-merge-supplementary:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Fetch fixed tooling and committed product objects without overlays
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/tooling" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE/tooling" hash-object build_probe.py)" = f6a3a513941e1db992601826f3a2c2e73b0f85a9
          test "$(git -C "$GITHUB_WORKSPACE/tooling" hash-object test_build_probe.py)" = d17e823f6067db961db9a0fa8c8bc4f84e4c107c
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=2 origin c66deb47298faa19164c7060cd0efa2584210e07
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=2 origin refs/pull/63/merge
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse FETCH_HEAD)" = 59d74c41d4ecd31b9e80bcea306003a5eb2df250
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = e3c7efed8d8f2be0780cfb3f0e80c1e67db1455d
      - name: Test the unchanged bounded subprocess runner
        shell: bash
        working-directory: tooling
        run: python3 -m unittest -v test_build_probe
      - name: Execute exact source and actual merge controls with credential-free test environments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,platform,re,sys,time,zipfile
          from pathlib import Path
          sys.path.insert(0,str(Path(os.environ['GITHUB_WORKSPACE'])/'tooling'))
          import build_probe as p
          p.HEAD='c66deb47298faa19164c7060cd0efa2584210e07'
          p.BASE='d66c1b5b614a2a7b682c233fe2e7a19939b6976b'
          p.MERGE='59d74c41d4ecd31b9e80bcea306003a5eb2df250'
          p.TREE='e3c7efed8d8f2be0780cfb3f0e80c1e67db1455d'
          source=Path(os.environ['GITHUB_WORKSPACE'])/'source'
          out=Path(os.environ['RUNNER_TEMP'])/'acceptance-proof'
          out.mkdir(exist_ok=False)
          env={k:os.environ[k] for k in ('PATH','HOME','USER','TMPDIR') if k in os.environ}
          rows=[]
          result={'schema':'trillionnium.execution-acceptance-supplementary.v1','source':p.HEAD,'base':p.BASE,'merge':p.MERGE,'tree':p.TREE,'platform':platform.platform(),'python':sys.version,'producer':{k:os.environ[k] for k in ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB')},'commands':rows,'complete':False,'claims':{'ordinary_required_gate_credit':False,'independent_acceptance':False,'live_database_credit':False,'gap_closed':False}}
          began=time.monotonic()
          try:
              for sha in (p.HEAD,p.MERGE):
                  (out/(sha+'.commit')).write_bytes(p.verify_object(source,sha))
              for label,sha in [('source',p.HEAD),('prospective',p.MERGE)]:
                  assert not p.git(source,'status','--porcelain').strip()
                  p.git(source,'checkout','--detach',sha)
                  assert p.git(source,'rev-parse','HEAD').decode().strip()==sha
                  schedule=[('compileall',['python3','-m','compileall','-q','scripts','tools','tests']),('python',['python3','-m','unittest','discover','-s','tests','-p','test_*.py','-v']),('acceptance',['python3','-m','unittest','tests.control_plane.test_execution_acceptance','-v'])]
                  checks=['check-documentation-authority.py','check-plan.py','check-evidence-index.py','check-gap-register.py','derive-gap-status.py','derive-gates.py','check-status-transitions.py','check-workflow-action-policy.py','check-repository-hygiene.py','check-trnm-server.py','check-rust-foundation.py']
                  schedule += [(x,['python3','scripts/'+x]) for x in checks]
                  for name,argv in schedule:
                      remaining=600-(time.monotonic()-began)
                      assert remaining>0
                      log=out/f'{len(rows):03d}-{label}-{name}.log'
                      row=p.command(argv,source,log,env,min(180,remaining))
                      row.update(object=sha,name=name);rows.append(row)
                      assert row['returncode']==0 and row['failure'] is None,name
                      text=log.read_text(errors='replace')
                      if name in ('python','acceptance'):
                          count=514 if name=='python' else 37
                          assert re.search(r'^Ran '+str(count)+r' tests in ',text,re.M)
                          assert re.search(r'^OK$',text,re.M)
                          row['reported_tests_passed']=count
                      assert sum(x['size_bytes'] for x in rows)<24*1024*1024
                  assert not p.git(source,'status','--porcelain').strip()
              assert len(rows)==28
              result['complete']=True
          except Exception as exc:
              result['failure_type']=type(exc).__name__
              result['failure']=str(exc)[:500]
          result['limitations']=['Supplementary ARM Python/control execution; not the 55 required external workflow set or independent review.','The scoped 37 tests are included in the 514-test corpus; repeated source/merge runs are not additional unique tests.','This lane performs no Rust, Go, live database, SDK, HA, capacity or endurance execution.']
          (out/'qualification.json').write_text(json.dumps(result,indent=2)+'\n')
          data={x.name:x.read_bytes() for x in out.iterdir() if x.is_file()}
          assert sum(map(len,data.values()))<25*1024*1024
          data['file-index.json']=(json.dumps([{'path':n,'size_bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()} for n,b in sorted(data.items())],indent=2)+'\n').encode()
          with zipfile.ZipFile(out/'acceptance-proof.zip','x',zipfile.ZIP_DEFLATED) as z:
              for n,b in sorted(data.items()):z.writestr(n,b)
          print(json.dumps(result))
          PY
      - name: Retain the complete bounded diagnostic packet
        uses: ./tooling/publish
      - name: Reject incomplete results and changed candidate refs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'acceptance-proof/qualification.json').read_text())
          assert q['complete'] is True and len(q['commands'])==28
          assert all(x['returncode']==0 and x['failure'] is None for x in q['commands'])
          refs=subprocess.run(['git','-C',os.environ['GITHUB_WORKSPACE']+'/source','ls-remote','origin','refs/heads/main','refs/heads/codex/branch-evidence-closure-2026-09-02','refs/pull/63/merge'],check=True,capture_output=True,text=True,timeout=30)
          observed={ref:sha for sha,ref in (line.split() for line in refs.stdout.splitlines())}
          assert observed=={'refs/heads/main':q['base'],'refs/heads/codex/branch-evidence-closure-2026-09-02':q['source'],'refs/pull/63/merge':q['merge']}
          print('Exact-source/merge acceptance regressions passed; no ordinary-gate substitution or independent acceptance.')
          PY
