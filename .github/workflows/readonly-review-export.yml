name: compute-gap-scope-fingerprint

on:
  push:
    branches: [tooling/readonly-review-export-arm-8fde7e81]

permissions:
  contents: read
  actions: read

env:
  PRODUCT_HEAD: 545569a4936f08d0eed0b79806e04239cbe8e835
  PRODUCT_TREE: 00ca7f813f5dcb1e46935cf6bc0121ca33888c7e
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02

jobs:
  gap-scope-fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact product source
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin "$PRODUCT_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = "$PRODUCT_TREE"

      - name: Compute immutable gap-definition projection
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/gap-scope-fingerprint"
          mkdir -p "$proof"
          python3 - <<'PY' | tee "$proof/summary.json"
          import hashlib,json
          from pathlib import Path
          root=json.loads(Path('docs/status/GAP_REGISTER.json').read_text())
          projection={
            'schema':root['schema'],
            'project_id':root['project_id'],
            'plan_version':root['plan_version'],
            'status_values':root['status_values'],
            'closure_policy':root['closure_policy'],
            'gaps':[]}
          fields=('id','severity','category','title','owner_role','blocking_claims','affected_paths','close_criteria','required_evidence_types','issue_refs')
          external=[]
          for gap in root['gaps']:
            projection['gaps'].append({key:gap[key] for key in fields})
            if gap.get('external_dependency') is not None:
              external.append(gap['id'])
          encoded=json.dumps(projection,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
          item={
            'schema':'trillionnium.gap-scope-fingerprint.v1',
            'projection_sha256':hashlib.sha256(encoded).hexdigest(),
            'projection_size_bytes':len(encoded),
            'gap_count':len(root['gaps']),
            'close_criteria_total':sum(len(gap['close_criteria']) for gap in root['gaps']),
            'external_dependency_gap_ids':external,
            'external_dependency_gap_ids_sha256':hashlib.sha256(json.dumps(sorted(external),separators=(',',':')).encode()).hexdigest(),
            'source_blob_sha256':hashlib.sha256(Path('docs/status/GAP_REGISTER.json').read_bytes()).hexdigest(),
            'claims':{'gap_closed':False,'accepted':False,'production_ready':False}}
          print(json.dumps(item,sort_keys=True,separators=(',',':')))
          (Path(__import__('os').environ['RUNNER_TEMP'])/'gap-scope-fingerprint/projection.json').write_text(json.dumps(projection,sort_keys=True,separators=(',',':'),ensure_ascii=False)+'\n')
          PY
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gap-scope-fingerprint'
          files={p.name:p.read_bytes() for p in root.iterdir() if p.is_file()}
          (root/'file-index.json').write_text(json.dumps([{'path':name,'size_bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()} for name,data in sorted(files.items())],indent=2)+'\n')
          files={p.name:p.read_bytes() for p in root.iterdir() if p.is_file()}
          with zipfile.ZipFile(root/'gap-scope-fingerprint.zip','x',zipfile.ZIP_DEFLATED) as archive:
            for name,data in sorted(files.items()): archive.writestr(name,data)
          PY

      - name: Retain exact fingerprint packet
        uses: ./tooling/publish

      - name: Reject moved source
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/$PRODUCT_BRANCH | cut -f1)" = "$PRODUCT_HEAD"
