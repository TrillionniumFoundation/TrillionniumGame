name: world-readonly-native-diagnostic
on:
  push:
    branches: [tooling/world-readonly-diagnostic-9a57222-20260905]
permissions:
  contents: read
  actions: read
jobs:
  exact-world-source-and-cli-diagnostic-not-acceptance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 38
    steps:
      - name: Bind diagnostic control, reviewed uploader and exact World source
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/tooling" rev-parse HEAD)" = "$GITHUB_SHA"
          git init "$GITHUB_WORKSPACE/uploader"
          git -C "$GITHUB_WORKSPACE/uploader" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/uploader" fetch --no-tags --depth=1 origin c2944df15702de77e8bbe549158019f84a53a38e
          git -C "$GITHUB_WORKSPACE/uploader" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/uploader" rev-parse HEAD^{tree})" = 6a3ef7308f778920163617d53d537f817ed36ea3
          test "$(git -C "$GITHUB_WORKSPACE/uploader" hash-object scripts/upload-actions-artifact.py)" = 8baac2cca878af822428831359ab00d15ab10b71
          git init "$GITHUB_WORKSPACE/trillionnium-world"
          git -C "$GITHUB_WORKSPACE/trillionnium-world" remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C "$GITHUB_WORKSPACE/trillionnium-world" fetch --no-tags --depth=1 origin 9a57222d1eacc7059e549df9c62a79046e8ae8ea
          git -C "$GITHUB_WORKSPACE/trillionnium-world" checkout -b fix/world-plan-v4-development-closure-20260831 FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/trillionnium-world" rev-parse HEAD^{tree})" = 57b03d5ae782ee9e1e338afd34842ad8dbb653c9
      - name: Export exact tracked World source with raw commit and tree
        shell: bash
        run: python3 tooling/world-diagnostic.py export "$GITHUB_WORKSPACE/trillionnium-world" "$RUNNER_TEMP/world-diagnostic"
      - name: Preserve source before running product commands
        uses: ./tooling/publish
        env:
          WORLD_DIAGNOSTIC_PACKET: world-source-9a57222
      - name: Execute bounded preflight and corrected-toolchain CLI diagnostics without credentials
        shell: bash
        run: python3 tooling/world-diagnostic.py run "$GITHUB_WORKSPACE/trillionnium-world" "$RUNNER_TEMP/world-diagnostic"
      - name: Preserve raw command results without qualification claims
        if: ${{ always() }}
        uses: ./tooling/publish
        env:
          WORLD_DIAGNOSTIC_PACKET: world-native-9a57222
      - name: Fail honestly when any selected diagnostic command failed or did not run
        if: ${{ always() }}
        shell: bash
        run: python3 tooling/world-diagnostic.py finish "$GITHUB_WORKSPACE/trillionnium-world" "$RUNNER_TEMP/world-diagnostic"
