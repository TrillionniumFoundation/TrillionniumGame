name: evidence-retention-diagnostic

on:
  push:
    branches: [tooling/session-response-loss-preflight-2026-09-06]

permissions:
  contents: read

env:
  EXPECTED_HEAD: 67523089ee750db5f6ee860b66071bc04dfc1521
  EXPECTED_TREE: 40f45e8a2dbea2f4ffdb0c1b7db229ad906ca60a
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
  PATCH_GZIP_BLOB: 6b7890b861cc6f0cde2f87a9acfff5aedd1cf456
  PATCH_GZIP_SHA256: b0f1a8a0a29e2ed855a6ce2ace8fc7edef8f6e1e67fc607fab1d3d470d0bc5c9
  PATCH_SHA256: 38a5fa31c5499fca933789052611f288ec1be0ce2cae5ff5e8b965945333d666

jobs:
  exact-retention-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact tooling and candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/tooling" "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin \
            https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/tooling" hash-object retention-patch/evidence-retention-v1.patch.gz)" = "$PATCH_GZIP_BLOB"
          test "$(sha256sum "$GITHUB_WORKSPACE/tooling/retention-patch/evidence-retention-v1.patch.gz" | cut -d' ' -f1)" = "$PATCH_GZIP_SHA256"

          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=128 origin \
            "refs/heads/${PRODUCT_BRANCH}"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

      - name: Apply and enumerate exact patch
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/evidence-retention-v1.patch"
          gzip -dc "$GITHUB_WORKSPACE/tooling/retention-patch/evidence-retention-v1.patch.gz" > "$patch"
          test "$(sha256sum "$patch" | cut -d' ' -f1)" = "$PATCH_SHA256"
          git apply --check "$patch"
          git apply "$patch"
          git diff --name-status | tee "$RUNNER_TEMP/changed-files.txt"
          test "$(git diff --name-only | wc -l | tr -d ' ')" -gt 0
          git diff --check

      - name: Execute focused retained-evidence tests
        shell: bash
        working-directory: source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          node --check .github/actions/upload-evidence/index.js
          python3 -m unittest -v tests.control_plane.test_evidence_retention_workflows
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-plan.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
