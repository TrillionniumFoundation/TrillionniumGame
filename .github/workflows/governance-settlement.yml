name: governance-settlement

on:
  push:
    branches: [tooling/gap-closure-audit-2026-09-07]
    paths:
      - '.github/workflows/governance-settlement.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  settle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_PR: '63'
      COMMAND_ISSUE: '7'
      EXPECTED_HEAD: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
      TOOLING_BRANCH: tooling/gap-closure-audit-2026-09-07
    steps:
      - name: Wait for governance producers and build settlement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/settlement"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ['TARGET_REPOSITORY']
          branch = os.environ['TOOLING_BRANCH']
          token = os.environ['GH_TOKEN']
          expected_head = os.environ['EXPECTED_HEAD']
          root = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'trillionnium-governance-settlement',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          wanted = {
              'effective-governance-readback',
              'monotonic-main-protection-reconcile',
              'governance-negative-rehearsal',
          }

          def call(method: str, path: str, body=None, allowed=()):
              raw = None if body is None else json.dumps(body, separators=(',', ':')).encode()
              request = urllib.request.Request(root + path, data=raw, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = response.read()
                      return response.status, json.loads(payload.decode()) if payload else None
              except urllib.error.HTTPError as error:
                  payload = error.read().decode('utf-8', errors='replace')
                  if error.code in allowed:
                      try:
                          value = json.loads(payload) if payload else None
                      except Exception:
                          value = {'message': payload[:1000]}
                      return error.code, value
                  raise SystemExit(f'{method} {path}: HTTP {error.code}: {payload[:2000]}')

          deadline = time.monotonic() + 20 * 60
          latest = {}
          while True:
              _, payload = call('GET', '/actions/runs?' + urllib.parse.urlencode({
                  'branch': branch,
                  'per_page': 100,
              }))
              for row in payload.get('workflow_runs', []):
                  name = row.get('name')
                  if name not in wanted:
                      continue
                  rank = (int(row.get('run_attempt') or 0), int(row.get('id') or 0))
                  old = latest.get(name)
                  old_rank = (
                      int(old.get('run_attempt') or 0), int(old.get('id') or 0)
                  ) if old else (-1, -1)
                  if old is None or rank > old_rank:
                      latest[name] = row
              if wanted.issubset(latest) and all(
                  latest[name].get('status') == 'completed' for name in wanted
              ):
                  break
              if time.monotonic() >= deadline:
                  break
              time.sleep(10)

          records = []
          for name in sorted(wanted):
              row = latest.get(name)
              if row is None:
                  records.append({'workflow': name, 'observed': False})
                  continue
              _, artifacts = call('GET', f"/actions/runs/{row['id']}/artifacts?per_page=100")
              records.append({
                  'workflow': name,
                  'observed': True,
                  'run_id': row['id'],
                  'run_attempt': row.get('run_attempt'),
                  'head_sha': row.get('head_sha'),
                  'status': row.get('status'),
                  'conclusion': row.get('conclusion'),
                  'artifacts': [{
                      'id': item.get('id'),
                      'name': item.get('name'),
                      'size_in_bytes': item.get('size_in_bytes'),
                      'digest': item.get('digest'),
                      'expired': item.get('expired'),
                  } for item in artifacts.get('artifacts', [])],
              })

          _, pull = call('GET', f"/pulls/{os.environ['TARGET_PR']}")
          if pull['head']['sha'] != expected_head:
              raise SystemExit('PR head moved while governance settlement was running')
          success = all(
              item.get('status') == 'completed'
              and item.get('conclusion') == 'success'
              and item.get('artifacts')
              for item in records
          )
          value = {
              'schema': 'trillionnium.governance-settlement.v1',
              'repository': repository,
              'pull_request': int(os.environ['TARGET_PR']),
              'base': pull['base']['sha'],
              'head': pull['head']['sha'],
              'prospective_merge': pull.get('merge_commit_sha'),
              'producer_results': records,
              'all_producers_success_with_artifacts': success,
              'independently_accepted': False,
              'gap_closed': False,
              'production_ready': False,
              'limitations': [
                  'Successful administrator readback/rehearsal remains subject to conflict-free governance review.',
                  'A missing administrator credential or API denial remains an external blocker, not a passing result.',
              ],
          }
          target = Path(os.environ['RUNNER_TEMP']) / 'settlement' / 'governance-settlement.json'
          target.write_text(json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n')

          lines = [
              '<!-- TRNM-GOVERNANCE-SETTLEMENT -->',
              '## Plan v3.1 governance settlement',
              '',
              f"Exact PR head: `{pull['head']['sha']}`",
              f"Actual prospective merge: `{pull.get('merge_commit_sha')}`",
              '',
              '| Producer | Run | Conclusion | Retained artifacts |',
              '| --- | ---: | --- | --- |',
          ]
          for item in records:
              artifacts = ', '.join(
                  f"`{row['id']}` `{row.get('digest')}`" for row in item.get('artifacts', [])
              ) or 'none'
              lines.append(
                  f"| `{item['workflow']}` | {item.get('run_id', 'missing')} | "
                  f"`{item.get('conclusion', item.get('status', 'missing'))}` | {artifacts} |"
              )
          lines += [
              '',
              f"All three producers terminal-success with retained artifacts: `{str(success).lower()}`",
              '',
              'This is not independent acceptance. No gap, production, compatibility, cutover or retirement credit is granted by this settlement.',
          ]
          body = '\n'.join(lines)

          for issue in (os.environ['TARGET_PR'], os.environ['COMMAND_ISSUE']):
              _, comments = call('GET', f'/issues/{issue}/comments?per_page=100')
              existing = next(
                  (row for row in reversed(comments) if '<!-- TRNM-GOVERNANCE-SETTLEMENT -->' in (row.get('body') or '')),
                  None,
              )
              if existing:
                  call('PATCH', f"/issues/comments/{existing['id']}", {'body': body})
              else:
                  call('POST', f'/issues/{issue}/comments', {'body': body})

          if success:
              call('POST', f"/pulls/{os.environ['TARGET_PR']}/requested_reviewers", {
                  'reviewers': ['Tomasrgbsf'],
              }, allowed=(422,))
          print(json.dumps({'success': success, 'records': records}, sort_keys=True))
          PY
          sha256sum "$RUNNER_TEMP/settlement/governance-settlement.json" \
            > "$RUNNER_TEMP/settlement/SHA256SUMS"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/governance-settlement.tar.gz" \
            -C "$RUNNER_TEMP/settlement" governance-settlement.json SHA256SUMS

      - name: Fetch current source for uploader
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${TARGET_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD

      - name: Retain governance settlement
        id: retained
        uses: ./source/.github/actions/upload-evidence
        with:
          name: governance-settlement-${{ env.EXPECTED_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governance-settlement.tar.gz
          mime_type: application/gzip

      - name: Verify receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained.outputs.artifact_id }}'
          test -n '${{ steps.retained.outputs.sha256 }}'
          test '${{ steps.retained.outputs.size_bytes }}' -gt 0
