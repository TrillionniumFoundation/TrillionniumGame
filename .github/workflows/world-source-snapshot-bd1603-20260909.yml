name: world-source-snapshot-bd1603-20260909

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-source-snapshot-bd1603-20260909-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_HEAD_SHA: bd1603ea6087f71ee1fe2d7940c729931105c25f
  WORLD_HEAD_TREE: 50f2b8d7a6fb75ad77210d3082a2362e4b210438

jobs:
  snapshot:
    name: world-source/snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch and verify exact World source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/world"
          rm -rf "$root"
          git init "$root"
          git -C "$root" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$root" fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$WORLD_HEAD_SHA"
          test "$(git -C "$root" rev-parse HEAD^{tree})" = "$WORLD_HEAD_TREE"
          test -z "$(git -C "$root" status --porcelain=v1 --untracked-files=all)"

      - name: Emit bounded content-addressed development snapshot
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/world"
          archive="$RUNNER_TEMP/world-authority-bd1603.tar.gz"
          git -C "$root" archive --format=tar "$WORLD_HEAD_SHA" \
            trillionnium/crates/world-authority \
            deploy/postgres/trnm-world-authority-cutover-v1.sql \
            docs/modules/world-authority \
            docs/protocol/trnm-world-http-api-v1.md \
            docs/protocol/trnm-world-websocket-v1.md \
            docs/protocol/trnm-world-error-catalog-v1.md \
            docs/security/trnm-world-service-identity-secrets-v1.md \
            docs/database/trnm-world-postgres-contract-v1.md \
            | gzip -n -9 > "$archive"
          size="$(wc -c < "$archive")"
          test "$size" -gt 0
          test "$size" -le 1048576
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'WORLD_SNAPSHOT_REPOSITORY=%s\n' "$WORLD_REPOSITORY"
          printf 'WORLD_SNAPSHOT_COMMIT=%s\n' "$WORLD_HEAD_SHA"
          printf 'WORLD_SNAPSHOT_TREE=%s\n' "$WORLD_HEAD_TREE"
          printf 'WORLD_SNAPSHOT_BYTES=%s\n' "$size"
          printf 'WORLD_SNAPSHOT_SHA256=%s\n' "$digest"
          printf 'WORLD_SNAPSHOT_RUNNER_REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
          printf 'WORLD_SNAPSHOT_RUNNER_COMMIT=%s\n' "$GITHUB_SHA"
          printf 'WORLD_SNAPSHOT_RUN_ID=%s\n' "$GITHUB_RUN_ID"
          printf 'WORLD_SNAPSHOT_PRODUCTION_AUTHORIZATION=not_granted\n'
          printf 'WORLD_SNAPSHOT_BASE64_BEGIN\n'
          base64 -w 76 "$archive"
          printf 'WORLD_SNAPSHOT_BASE64_END\n'
