name: outbox-final-attempt-reaper

on:
  pull_request:
    paths:
      - 'crates/trnm-persistence-pg/src/lib.rs'
      - 'crates/trnm-persistence-pg/src/outbox.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs'
      - 'scripts/ci-outbox-final-attempt-reaper.sh'
      - 'scripts/upload-actions-artifact.py'
      - 'tests/control_plane/test_actions_artifact_uploader.py'
      - 'scripts/check-workflow-action-policy.py'
      - 'tests/control_plane/test_workflow_action_policy.py'
      - 'docs/development/OUTBOX_FINAL_ATTEMPT_REAPER.md'
      - 'docs/development/OUTBOX_SPOOL_WORKER.md'
      - 'docs/development/PERSISTENCE_OUTBOX_CORE.md'
      - '.github/workflows/outbox-final-attempt-reaper.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-persistence-pg/src/lib.rs'
      - 'crates/trnm-persistence-pg/src/outbox.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs'
      - 'scripts/ci-outbox-final-attempt-reaper.sh'
      - 'scripts/upload-actions-artifact.py'
      - 'tests/control_plane/test_actions_artifact_uploader.py'
      - 'scripts/check-workflow-action-policy.py'
      - 'tests/control_plane/test_workflow_action_policy.py'
      - 'docs/development/OUTBOX_FINAL_ATTEMPT_REAPER.md'
      - 'docs/development/OUTBOX_SPOOL_WORKER.md'
      - 'docs/development/PERSISTENCE_OUTBOX_CORE.md'
      - '.github/workflows/outbox-final-attempt-reaper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outbox-final-attempt-reaper-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate bounded fail-closed source contract
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/ci-outbox-final-attempt-reaper.sh
          test -x scripts/upload-actions-artifact.py
          grep -q 'pub struct OutboxClaimBatch' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'claim_outbox_batch' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'reaped_dead_letters' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'TRNM_OUTBOX_TEST_FAIL_BEFORE_DELIVERY' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'TEST_FAIL_BEFORE_DELIVERY_EXIT_CODE: i32 = 71' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'dead_lettered: batch.reaped_dead_letters' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'crash-before-publish' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'crash-after-publish' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'possible_lost_effect_declared' scripts/ci-outbox-final-attempt-reaper.sh
          grep -Fq 'if "$worker_bin" run-once >"$scenario/worker-crash.stdout"' scripts/ci-outbox-final-attempt-reaper.sh
          grep -Fq 'actions/upload-artifact@043fb460e6257d1ca154e89a5e86196c74e480f8' .github/workflows/outbox-final-attempt-reaper.yml
          python3 -m py_compile scripts/upload-actions-artifact.py
          python3 -m unittest tests.control_plane.test_actions_artifact_uploader tests.control_plane.test_workflow_action_policy -v

  live-profile:
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        profile: [postgresql, cockroachdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - name: Load reviewed immutable database image
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = os.environ['PROFILE']
          row = json.loads(Path('config/database-test-images.json').read_text(encoding='utf-8'))['profiles'][profile]
          name = {'postgresql': 'TRNM_POSTGRES_IMAGE', 'cockroachdb': 'TRNM_COCKROACH_IMAGE'}[profile]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f"{name}={row['image']}\n")
          print(f"profile={profile}")
          print(f"image={row['image']}")
          PY
      - name: Execute both final-attempt process-failure boundaries
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          TRNM_EVIDENCE_ROOT: run/outbox-final-attempt-reaper
          TRNM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
        run: bash scripts/ci-outbox-final-attempt-reaper.sh "$PROFILE"
      - name: Prepare raw diagnostic archive
        if: always()
        id: archive
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          root="run/outbox-final-attempt-reaper/${PROFILE}"
          mkdir -p "$root"
          archive="run/outbox-final-attempt-reaper-${PROFILE}-${CANDIDATE_SHA}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$root" .
          archive_sha=$(sha256sum "$archive" | awk '{print $1}')
          artifact_name="outbox-final-attempt-reaper-${PROFILE}-${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'archive_sha256=%s\n' "$archive_sha"
          find "$root" -type f -print0 | sort -z | xargs -0 -r sha256sum
          {
            printf 'archive_path=%s\n' "$archive"
            printf 'archive_sha256=%s\n' "$archive_sha"
            printf 'artifact_name=%s\n' "$artifact_name"
          } >> "$GITHUB_OUTPUT"
          {
            printf '### Outbox final-attempt boundaries %s\n\n' "$PROFILE"
            printf -- '- candidate: `%s@%s`\n' "$CANDIDATE_REPOSITORY" "$CANDIDATE_SHA"
            printf -- '- run: `%s`\n' "$GITHUB_RUN_ID"
            printf -- '- raw archive SHA-256: `%s`\n' "$archive_sha"
            printf -- '- crash before publish may lose the external effect: `true`\n'
            printf -- '- compatibility credit: `false`\n'
            printf -- '- production ready: `false`\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw diagnostic archive
        if: always() && steps.archive.outcome == 'success'
        id: retain
        uses: actions/upload-artifact@043fb460e6257d1ca154e89a5e86196c74e480f8
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: ${{ steps.archive.outputs.archive_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
          include-hidden-files: false
      - name: Record retained artifact identity
        if: always() && steps.archive.outcome == 'success' && steps.retain.outcome == 'success'
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          RAW_ARCHIVE_SHA256: ${{ steps.archive.outputs.archive_sha256 }}
          ARTIFACT_ID: ${{ steps.retain.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.retain.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.retain.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$RAW_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          test -n "$ARTIFACT_URL"
          test -n "$ARTIFACT_DIGEST"
          {
            printf -- '- retained artifact ID: `%s`\n' "$ARTIFACT_ID"
            printf -- '- retained artifact URL: `%s`\n' "$ARTIFACT_URL"
            printf -- '- service artifact digest: `%s`\n' "$ARTIFACT_DIGEST"
            printf -- '- raw archive digest remains separately bound: `%s`\n' "$RAW_ARCHIVE_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
