name: outbox-final-attempt-reaper

on:
  pull_request:
    paths:
      - 'crates/trnm-persistence-pg/src/lib.rs'
      - 'crates/trnm-persistence-pg/src/outbox.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs'
      - 'migrations/MIGRATION_CHAIN.lock.json'
      - 'migrations/postgresql/0001_foundation_up.sql'
      - 'migrations/cockroachdb/0001_foundation_up.sql'
      - 'scripts/ci-outbox-final-attempt-reaper.sh'
      - 'scripts/check-migration-lock.py'
      - 'scripts/upload-actions-artifact.py'
      - 'scripts/emit-actions-log-artifact.py'
      - 'tests/control_plane/test_actions_artifact_uploader.py'
      - 'tests/control_plane/test_actions_log_artifact.py'
      - 'scripts/check-workflow-action-policy.py'
      - 'tests/control_plane/test_workflow_action_policy.py'
      - 'docs/development/OUTBOX_FINAL_ATTEMPT_REAPER.md'
      - 'docs/development/OUTBOX_SPOOL_WORKER.md'
      - 'docs/development/PERSISTENCE_OUTBOX_CORE.md'
      - '.github/workflows/outbox-final-attempt-reaper.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-persistence-pg/src/lib.rs'
      - 'crates/trnm-persistence-pg/src/outbox.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs'
      - 'migrations/MIGRATION_CHAIN.lock.json'
      - 'migrations/postgresql/0001_foundation_up.sql'
      - 'migrations/cockroachdb/0001_foundation_up.sql'
      - 'scripts/ci-outbox-final-attempt-reaper.sh'
      - 'scripts/check-migration-lock.py'
      - 'scripts/upload-actions-artifact.py'
      - 'scripts/emit-actions-log-artifact.py'
      - 'tests/control_plane/test_actions_artifact_uploader.py'
      - 'tests/control_plane/test_actions_log_artifact.py'
      - 'scripts/check-workflow-action-policy.py'
      - 'tests/control_plane/test_workflow_action_policy.py'
      - 'docs/development/OUTBOX_FINAL_ATTEMPT_REAPER.md'
      - 'docs/development/OUTBOX_SPOOL_WORKER.md'
      - 'docs/development/PERSISTENCE_OUTBOX_CORE.md'
      - '.github/workflows/outbox-final-attempt-reaper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outbox-final-attempt-reaper-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate bounded fail-closed source contract
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/ci-outbox-final-attempt-reaper.sh
          test -f scripts/emit-actions-log-artifact.py
          test -f migrations/MIGRATION_CHAIN.lock.json
          test -f migrations/postgresql/0001_foundation_up.sql
          test -f migrations/cockroachdb/0001_foundation_up.sql
          grep -q 'pub struct OutboxClaimBatch' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'claim_outbox_batch' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'reaped_dead_letters' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'TRNM_OUTBOX_TEST_FAIL_BEFORE_DELIVERY' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'TEST_FAIL_BEFORE_DELIVERY_EXIT_CODE: i32 = 71' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'dead_lettered: batch.reaped_dead_letters' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'crash-before-publish' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'crash-after-publish' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'possible_lost_effect_declared' scripts/ci-outbox-final-attempt-reaper.sh
          grep -Fq 'if "$worker_bin" run-once >"$scenario/worker-crash.stdout"' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'MIGRATION_CHAIN.lock.json' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'git.*hash-object' scripts/ci-outbox-final-attempt-reaper.sh
          grep -Fq 'AND state = 3 AND attempt = 1 AND lease_generation = 1' scripts/ci-outbox-final-attempt-reaper.sh
          grep -Fq 'owner_node IS NULL AND receipt_digest IS NULL' scripts/ci-outbox-final-attempt-reaper.sh
          grep -Fq 'c57f69b9f67ddf67d5d6a49b4527af2e17ad313bfbc2f8397b5f9120541be25a' scripts/ci-outbox-final-attempt-reaper.sh
          ! grep -q 'trnm_outbox_dead_letters' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'TRNM_LOG_ARTIFACT_BEGIN' scripts/emit-actions-log-artifact.py
          grep -q 'TRNM_LOG_ARTIFACT_END' scripts/emit-actions-log-artifact.py
          python3 scripts/check-migration-lock.py
          python3 -m py_compile scripts/upload-actions-artifact.py scripts/emit-actions-log-artifact.py
          python3 -m unittest \
            tests.control_plane.test_actions_artifact_uploader \
            tests.control_plane.test_actions_log_artifact \
            tests.control_plane.test_workflow_action_policy -v

  live-profile:
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        profile: [postgresql, cockroachdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - name: Load reviewed immutable database image
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = os.environ['PROFILE']
          row = json.loads(Path('config/database-test-images.json').read_text(encoding='utf-8'))['profiles'][profile]
          name = {'postgresql': 'TRNM_POSTGRES_IMAGE', 'cockroachdb': 'TRNM_COCKROACH_IMAGE'}[profile]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f"{name}={row['image']}\n")
          print(f"profile={profile}")
          print(f"image={row['image']}")
          PY
      - name: Execute both final-attempt process-failure boundaries
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          TRNM_EVIDENCE_ROOT: run/outbox-final-attempt-reaper
          TRNM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
        run: bash scripts/ci-outbox-final-attempt-reaper.sh "$PROFILE"
      - name: Seal and retain complete raw archive in bounded job log
        if: always()
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          root="run/outbox-final-attempt-reaper/${PROFILE}"
          mkdir -p "$root"
          archive="run/outbox-final-attempt-reaper-${PROFILE}-${CANDIDATE_SHA}.tar.gz"
          metadata="run/outbox-final-attempt-reaper-${PROFILE}-${CANDIDATE_SHA}.metadata.json"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$root" .
          artifact_name="outbox-final-attempt-reaper-${PROFILE}-${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/emit-actions-log-artifact.py \
            "$archive" \
            --name "$artifact_name" \
            --max-bytes 2097152 \
            --metadata-json "$metadata"
          python3 - "$metadata" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert metadata['schema'] == 'trillionnium.actions-log-artifact.v1'
          assert metadata['transport'] == 'github-actions-job-log-base64-v1'
          assert re.fullmatch(r'[0-9a-f]{64}', metadata['sha256'])
          assert 0 < metadata['size'] <= metadata['max_bytes'] == 2097152
          assert metadata['repository'] == os.environ['GITHUB_REPOSITORY']
          assert metadata['commit'] == os.environ['CANDIDATE_SHA']
          assert metadata['run_id'] == os.environ['GITHUB_RUN_ID']
          assert metadata['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert metadata['claims']['compatibility_credit'] is False
          assert metadata['claims']['production_ready'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(f"### Outbox final-attempt boundaries {os.environ['PROFILE']}\n\n")
              output.write(f"- candidate: `{metadata['repository']}@{metadata['commit']}`\n")
              output.write(f"- run/job: `{metadata['run_id']}/{metadata['job']}`\n")
              output.write(f"- transport: `{metadata['transport']}`\n")
              output.write(f"- envelope name: `{metadata['name']}`\n")
              output.write(f"- raw archive size: `{metadata['size']}`\n")
              output.write(f"- raw archive SHA-256: `{metadata['sha256']}`\n")
              output.write("- reconstruction: decode every `TRNM_LOG_ARTIFACT_B64` line between the unique begin/end markers in the downloadable job log\n")
              output.write("- crash before publish may lose the external effect: `true`\n")
              output.write("- compatibility credit: `false`\n")
              output.write("- production ready: `false`\n")
          PY
