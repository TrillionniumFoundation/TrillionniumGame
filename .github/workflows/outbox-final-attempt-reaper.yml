name: outbox-final-attempt-reaper

on:
  pull_request:
    paths:
      - 'crates/trnm-persistence-pg/src/outbox.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs'
      - 'scripts/ci-outbox-final-attempt-reaper.sh'
      - '.github/workflows/outbox-final-attempt-reaper.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-persistence-pg/src/outbox.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs'
      - 'scripts/ci-outbox-final-attempt-reaper.sh'
      - '.github/workflows/outbox-final-attempt-reaper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outbox-final-attempt-reaper-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate bounded fail-closed source contract
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'EXPIRED_ATTEMPT_EXHAUSTED_REASON' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'reap_expired_exhausted' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'state = 1 AND available_at_ms <= \$1 AND attempt >= \$2' \
            crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'outbox_reap_compare_and_swap_failed' \
            crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'duplicate_visible_effect_count' \
            scripts/ci-outbox-final-attempt-reaper.sh

  live-profile:
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        profile: [postgresql, cockroachdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - name: Load reviewed immutable database image
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = os.environ['PROFILE']
          row = json.loads(
              Path('config/database-test-images.json').read_text(encoding='utf-8')
          )['profiles'][profile]
          name = {
              'postgresql': 'TRNM_POSTGRES_IMAGE',
              'cockroachdb': 'TRNM_COCKROACH_IMAGE',
          }[profile]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f"{name}={row['image']}\n")
          print(f"profile={profile}")
          print(f"image={row['image']}")
          PY
      - name: Execute final-attempt process-failure profile
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          TRNM_EVIDENCE_ROOT: run/outbox-final-attempt-reaper
          TRNM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
        run: bash scripts/ci-outbox-final-attempt-reaper.sh "$PROFILE"
      - name: Seal deterministic diagnostic archive in run log
        if: always()
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          root="run/outbox-final-attempt-reaper/${PROFILE}"
          mkdir -p "$root"
          archive="run/outbox-final-attempt-reaper-${PROFILE}-${CANDIDATE_SHA}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$root" .
          sha256sum "$archive"
          find "$root" -type f -print0 | sort -z | xargs -0 -r sha256sum
          {
            printf '### Outbox final-attempt reaper %s\n\n' "$PROFILE"
            printf -- '- candidate: `%s@%s`\n' "$CANDIDATE_REPOSITORY" "$CANDIDATE_SHA"
            printf -- '- run: `%s`\n' "$GITHUB_RUN_ID"
            printf -- '- compatibility credit: `false`\n'
            printf -- '- production ready: `false`\n'
          } >>"$GITHUB_STEP_SUMMARY"
