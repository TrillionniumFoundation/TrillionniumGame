name: outbox-final-attempt-reaper

on:
  pull_request:
    paths:
      - 'crates/trnm-persistence-pg/src/lib.rs'
      - 'crates/trnm-persistence-pg/src/outbox.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs'
      - 'scripts/ci-outbox-final-attempt-reaper.sh'
      - 'scripts/emit-actions-log-artifact.py'
      - 'scripts/verify-actions-log-artifact.py'
      - 'scripts/verify-actions-log-artifact-github.py'
      - 'tests/control_plane/test_actions_log_artifact.py'
      - 'tests/control_plane/test_actions_log_verifier.py'
      - 'tests/control_plane/test_actions_log_github_adapter.py'
      - 'docs/development/OUTBOX_FINAL_ATTEMPT_REAPER.md'
      - 'docs/development/OUTBOX_SPOOL_WORKER.md'
      - 'docs/development/PERSISTENCE_OUTBOX_CORE.md'
      - '.github/workflows/outbox-final-attempt-reaper.yml'
      - '.github/workflows/trillionnium-game-merge-gate.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-persistence-pg/src/lib.rs'
      - 'crates/trnm-persistence-pg/src/outbox.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs'
      - 'scripts/ci-outbox-final-attempt-reaper.sh'
      - 'scripts/emit-actions-log-artifact.py'
      - 'scripts/verify-actions-log-artifact.py'
      - 'scripts/verify-actions-log-artifact-github.py'
      - 'tests/control_plane/test_actions_log_artifact.py'
      - 'tests/control_plane/test_actions_log_verifier.py'
      - 'tests/control_plane/test_actions_log_github_adapter.py'
      - 'docs/development/OUTBOX_FINAL_ATTEMPT_REAPER.md'
      - 'docs/development/OUTBOX_SPOOL_WORKER.md'
      - 'docs/development/PERSISTENCE_OUTBOX_CORE.md'
      - '.github/workflows/outbox-final-attempt-reaper.yml'
      - '.github/workflows/trillionnium-game-merge-gate.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: outbox-final-attempt-reaper-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    name: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate bounded fail-closed source and verifier contracts
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/ci-outbox-final-attempt-reaper.sh
          test -x scripts/emit-actions-log-artifact.py
          test -x scripts/verify-actions-log-artifact.py
          test -x scripts/verify-actions-log-artifact-github.py
          grep -q 'pub struct OutboxClaimBatch' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'claim_outbox_batch' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'reaped_dead_letters' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'TRNM_OUTBOX_TEST_FAIL_BEFORE_DELIVERY' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'TEST_FAIL_BEFORE_DELIVERY_EXIT_CODE: i32 = 71' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'dead_lettered: batch.reaped_dead_letters' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'crash-before-publish' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'crash-after-publish' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'possible_lost_effect_declared' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'migration_for' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'migration_blob_sha1' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'terminal_dead_letter_count' scripts/ci-outbox-final-attempt-reaper.sh
          grep -q 'github-actions-timestamped-v1' scripts/emit-actions-log-artifact.py
          grep -q 'closed-world job count mismatch' scripts/verify-actions-log-artifact.py
          grep -q 'discover-completed-run' scripts/verify-actions-log-artifact.py
          grep -q 'join(content.split())' scripts/verify-actions-log-artifact-github.py
          bash -n scripts/ci-outbox-final-attempt-reaper.sh
          python3 -m py_compile \
            scripts/emit-actions-log-artifact.py \
            scripts/verify-actions-log-artifact.py \
            scripts/verify-actions-log-artifact-github.py
          python3 -m unittest \
            tests.control_plane.test_actions_log_artifact \
            tests.control_plane.test_actions_log_verifier \
            tests.control_plane.test_actions_log_github_adapter -v

  live-profile:
    name: live-profile (${{ matrix.profile }})
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        profile: [postgresql, cockroachdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - name: Load reviewed immutable database image
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = os.environ['PROFILE']
          row = json.loads(Path('config/database-test-images.json').read_text(encoding='utf-8'))['profiles'][profile]
          name = {'postgresql': 'TRNM_POSTGRES_IMAGE', 'cockroachdb': 'TRNM_COCKROACH_IMAGE'}[profile]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f"{name}={row['image']}\n")
          print(f"profile={profile}")
          print(f"image={row['image']}")
          PY
      - name: Execute both final-attempt process-failure boundaries
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          TRNM_EVIDENCE_ROOT: run/outbox-final-attempt-reaper
          TRNM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
        run: bash scripts/ci-outbox-final-attempt-reaper.sh "$PROFILE"
      - name: Seal populated profile evidence into the retained job log
        if: always()
        id: retained_log
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          root="run/outbox-final-attempt-reaper/${PROFILE}"
          test -d "$root"
          python3 - "$root" "$PROFILE" <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          profile = sys.argv[2]
          commit = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()
          if commit != os.environ['CANDIDATE_SHA']:
              raise SystemExit('candidate commit mismatch while sealing evidence')

          images = json.loads(
              Path('config/database-test-images.json').read_text(encoding='utf-8')
          )['profiles']
          image = images[profile]['image']
          lock = json.loads(
              Path('migrations/MIGRATION_CHAIN.lock.json').read_text(encoding='utf-8')
          )
          row = lock['profiles'][profile]
          ordered = row['ordered_files']
          if len(ordered) != 1:
              raise SystemExit('profile migration lock is not singular')
          migration = ordered[0]['path']
          migration_blob = subprocess.check_output(
              ['git', 'hash-object', migration], text=True
          ).strip()
          if migration_blob != ordered[0]['git_blob_sha1']:
              raise SystemExit('migration blob changed while sealing evidence')

          result = {}
          for line in (root / 'result.env').read_text(encoding='utf-8').splitlines():
              key, value = line.split('=', 1)
              result[key] = value
          expected_result = {
              'status': 'passed',
              'profile': profile,
              'commit': commit,
          }
          if result != expected_result:
              raise SystemExit(f'profile result is not exact passed evidence: {result!r}')
          (root / 'result.env').write_text(
              f'status=passed\nprofile={profile}\ncommit={commit}\ntree={tree}\n',
              encoding='utf-8',
          )

          run_id = os.environ['GITHUB_RUN_ID']
          run_attempt = os.environ['GITHUB_RUN_ATTEMPT']
          identity = {
              'repository': os.environ['CANDIDATE_REPOSITORY'],
              'commit': commit,
              'tree': tree,
              'profile': profile,
              'image': image,
              'run_id': run_id,
              'run_attempt': run_attempt,
              'evidence_run_id': f'{run_id}-{run_attempt}-{profile}',
              'workflow': 'outbox-final-attempt-reaper',
              'workflow_path': '.github/workflows/outbox-final-attempt-reaper.yml',
              'job_key': 'live-profile',
              'job_name': f'live-profile ({profile})',
              'migration': migration,
              'migration_blob_sha1': migration_blob,
          }
          (root / 'identity.env').write_text(
              ''.join(f'{key}={value}\n' for key, value in identity.items()),
              encoding='utf-8',
          )

          manifest = root / 'files.sha256'
          manifest.unlink(missing_ok=True)
          files = []
          for path in root.rglob('*'):
              if path.is_symlink():
                  raise SystemExit(f'symlink is forbidden in evidence: {path}')
              if path.is_file():
                  files.append(path)
          if not files:
              raise SystemExit('profile evidence directory has no files')
          lines = []
          for path in sorted(files, key=lambda item: item.relative_to(root).as_posix()):
              relative = path.relative_to(root).as_posix()
              if '\n' in relative or '\r' in relative:
                  raise SystemExit('newline is forbidden in evidence path')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{relative}')
          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(
              json.dumps(
                  {
                      'profile': profile,
                      'commit': commit,
                      'tree': tree,
                      'file_count': len(files),
                  },
                  sort_keys=True,
              )
          )
          PY
          archive="run/outbox-final-attempt-reaper-${PROFILE}-${CANDIDATE_SHA}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$root" .
          archive_sha=$(sha256sum "$archive" | awk '{print $1}')
          artifact_name="outbox-final-attempt-reaper-${PROFILE}-${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/emit-actions-log-artifact.py \
            "$archive" \
            --name "$artifact_name" \
            --max-bytes 2097152 \
            --metadata-json "run/outbox-final-attempt-reaper-${PROFILE}-log-envelope.json"
          {
            printf '### Outbox final-attempt boundaries %s\n\n' "$PROFILE"
            printf -- '- candidate: `%s@%s`\n' "$CANDIDATE_REPOSITORY" "$CANDIDATE_SHA"
            printf -- '- run: `%s` attempt `%s`\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf -- '- archive SHA-256: `%s`\n' "$archive_sha"
            printf -- '- retained transport: `github-actions-job-log-base64-v1`\n'
            printf -- '- crash before publish may lose the external effect: `true`\n'
            printf -- '- compatibility credit: `false`\n'
            printf -- '- production ready: `false`\n'
          } >>"$GITHUB_STEP_SUMMARY"

  outbox-final-attempt-reaper:
    name: outbox-final-attempt-reaper
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [source-contract, live-profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Require every producer job to succeed
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          LIVE_RESULT: ${{ needs.live-profile.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$LIVE_RESULT" = success
      - name: Reconstruct and verify both completed profile job logs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/verify-actions-log-artifact-github.py \
            --repository "$CANDIDATE_REPOSITORY" \
            --head-sha "$CANDIDATE_SHA" \
            --current-run \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-directory run/verified-outbox-final-attempt-logs
