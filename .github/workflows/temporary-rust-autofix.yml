name: temporary-rust-autofix

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-rust-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install exact Rust formatter
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1
          rustfmt --version

      - name: Retire duplicate binary and format all Rust packages
        run: |
          set -euo pipefail
          rm -f crates/trnm-persistence-core/src/bin/trnm-server.rs
          cargo fmt --all
          for manifest in \
            crates/trnm-token-jwt-adapter/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml \
            crates/trnm-presence-router-v2/Cargo.toml \
            crates/trnm-server/Cargo.toml
          do
            cargo fmt --manifest-path "$manifest"
          done
          rm -f .github/workflows/temporary-rust-autofix.yml
          git diff --check

      - name: Commit self-cleaning repair
        run: |
          set -euo pipefail
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(ci): format exact Rust candidate and retire duplicate server"
          git push origin "HEAD:${GITHUB_REF_NAME}"
