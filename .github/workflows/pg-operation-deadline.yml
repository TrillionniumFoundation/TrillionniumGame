name: pg-operation-deadline

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'crates/trnm-persistence-pg/src/pool.rs'
      - 'crates/trnm-persistence-pg/src/pool_parts/**'
      - 'crates/trnm-persistence-pg/src/bin/trnm_server/app.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm_server/pool.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm_server/retry.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm_server/server.rs'
      - 'crates/trnm-persistence-pg/Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/check-pg-operation-deadline.py'
      - 'tests/control_plane/test_pg_cancellation_lifecycle.py'
      - '.github/workflows/pg-operation-deadline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-operation-deadline-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUST_TOOLCHAIN: 1.85.1

jobs:
  source-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup override set "$RUST_TOOLCHAIN"
      - name: Validate fail-closed source contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check-pg-operation-deadline.py
          python3 scripts/check-pg-operation-deadline.py --self-test
          python3 -m unittest discover -s tests/control_plane -p 'test_pg_cancellation_lifecycle.py' -v
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Run PostgreSQL library and server tests
        run: cargo test -p trnm-persistence-pg --all-targets --locked
      - name: Strict lint
        run: cargo clippy -p trnm-persistence-pg --all-targets -- -D warnings

  live-postgresql-cancellation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: trillionnium_nakama
          POSTGRES_PASSWORD: deadline_test_password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trillionnium_nakama"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TRNM_REQUIRE_LIVE_PG_DEADLINE: '1'
      TRNM_TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=postgres password=deadline_test_password dbname=trillionnium_nakama sslmode=disable
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Prove total deadline cancels blocking SQL
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p trnm-persistence-pg --locked --lib \
            pool::tests::live_deadline_cancels_blocking_query_and_keeps_pool_usable \
            -- --exact --nocapture | tee deadline-test.log
          grep -Eq '^test result: ok[.] 1 passed; 0 failed; 0 ignored;' deadline-test.log
      - name: Prove drain cancellation terminates in-flight SQL
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p trnm-persistence-pg --locked --lib \
            pool::tests::live_shutdown_cancels_inflight_query_and_preserves_connection_pool \
            -- --exact --nocapture | tee shutdown-test.log
          grep -Eq '^test result: ok[.] 1 passed; 0 failed; 0 ignored;' shutdown-test.log
      - name: Seal exact execution receipt in immutable job log
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          printf '%s\n' \
            'assertion=deadline_cancelled_blocking_sql' \
            'assertion=shutdown_cancelled_inflight_sql' \
            'assertion=connection_pool_reusable_after_cancel' \
            'assertion=cancelled_backend_not_recycled' \
            'transport=postgresql_plaintext_candidate' \
            'tls_cancellation_runtime_evidence=false' \
            'cockroachdb_runtime_evidence=false' \
            'production_ready=false'
