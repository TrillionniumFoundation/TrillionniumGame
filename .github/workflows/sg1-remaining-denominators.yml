name: trillionnium-game-sg1-remaining-denominators

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/denominator/**'
      - 'scripts/generate-remaining-denominators.py'
      - 'scripts/check-remaining-denominators.sh'
      - 'tests/denominator/test_remaining_denominators.py'
      - 'docs/COMPATIBILITY.md'
      - 'docs/TESTING_AND_EVIDENCE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - '.github/workflows/sg1-remaining-denominators.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-remaining-denominators-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-source-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate current denominator contract
        run: |
          set -euo pipefail
          grep -q '`DEN-CONSOLE`' docs/COMPATIBILITY.md
          grep -q '`DEN-METRICS`, `DEN-OPS`, `DEN-SDK`' docs/COMPATIBILITY.md
          grep -q '`DEN-PROVIDERS`, `DEN-IAP`' docs/COMPATIBILITY.md
      - name: Run parser and fail-closed tests
        run: bash scripts/check-remaining-denominators.sh
      - name: Fetch and independently verify complete Nakama source tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fetch-pinned-upstream.py \
            --repository heroiclabs/nakama \
            --revision d4d92f93f78bbbe62c7fc50a3f85c772ec121a09 \
            --tree f3c9cfc2726d5543da1564629170f35b98e3797d \
            --output run/upstream/nakama
      - name: Generate candidate set twice and require byte identity
        run: |
          set -euo pipefail
          python3 scripts/generate-remaining-denominators.py \
            --source-dir run/upstream/nakama \
            --output-dir run/candidate-a
          python3 scripts/generate-remaining-denominators.py \
            --source-dir run/upstream/nakama \
            --output-dir run/candidate-b
          diff -ru run/candidate-a run/candidate-b
      - name: Prove candidate cannot close SG1
        run: |
          set -euo pipefail
          if python3 scripts/generate-remaining-denominators.py \
              --source-dir run/upstream/nakama \
              --output-dir run/sg1-negative \
              --require-sg1; then
            echo 'candidate incorrectly received SG1 credit' >&2
            exit 1
          fi
      - name: Validate nonempty fail-closed outputs and restricted ACL boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          minimums = {
              'console-denominator.candidate.json': 50,
              'providers-denominator.candidate.json': 20,
              'iap-denominator.candidate.json': 20,
              'metrics-denominator.candidate.json': 5,
              'operations-denominator.candidate.json': 10,
          }
          root = Path('run/candidate-a')
          for name, minimum in minimums.items():
              value = json.loads((root / name).read_text())
              assert value['leaf_count'] >= minimum, (name, value['leaf_count'])
              assert value['unclassified_count'] == value['leaf_count']
              assert value['status'] == 'candidate-unclassified'
              assert value['sg1_eligible'] is False
              assert value['compatibility_credit'] is False
              assert value['production_ready'] is False
          console = json.loads((root / 'console-denominator.candidate.json').read_text())
          restricted = [item for item in console['manual_contracts'] if item['class'] == 'restricted_console_acl_source']
          assert len(restricted) == 1, restricted
          assert 'CheckACL' not in json.dumps(restricted)
          PY
      - name: Seal exact-head candidate evidence in immutable log
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/remaining-denominators-${CANDIDATE_SHA}.tar.gz \
            -C run/candidate-a .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/remaining-denominators-${CANDIDATE_SHA}.tar.gz
          find run/candidate-a -type f -print0 | sort -z | xargs -0 sha256sum
