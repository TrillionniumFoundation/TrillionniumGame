name: tmp-repair-operation-scope-patcher

on:
  push:
    branches:
      - ops/identity-auth-replay-fix-20260910
    paths:
      - .github/workflows/tmp-repair-operation-scope-patcher.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_BRANCH: ops/identity-auth-replay-fix-20260910
      EXPECTED_HEAD: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact helper head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Correct the exact helper end boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tmp-identity-auth-replay-fix-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = 'helper_end_marker = "\\n    fn ensure_receipt_capacity(\\n"'
          new = 'helper_end_marker = "\\n    fn ensure_receipt_capacity"'
          if text.count(old) != 1:
              raise SystemExit(f'exact boundary rule not found once: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Publish corrected helper workflow
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tmp-identity-auth-replay-fix-v2.yml
          git commit -m 'ci: correct identity patcher helper boundary'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
