name: reviewer-capacity-admission

on:
  push:
    branches: [tooling/reviewer-capacity-admission-2026-09-07]
    paths:
      - '.github/workflows/reviewer-capacity-admission.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  BASE_SHA: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
  BASE_BRANCH: codex/branch-evidence-closure-2026-09-02
  CANDIDATE_BRANCH: codex/reviewer-conflict-capacity-fix-2026-09-07
  PYTHONDONTWRITEBYTECODE: '1'
  GH_TOKEN: ${{ github.token }}

jobs:
  qualify-and-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact base and candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags origin \
            "$BASE_SHA" \
            "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/reviewer-capacity"
          candidate=$(git -C "$GITHUB_WORKSPACE/source" rev-parse refs/remotes/origin/reviewer-capacity)
          git -C "$GITHUB_WORKSPACE/source" merge-base --is-ancestor "$BASE_SHA" "$candidate"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach "$candidate"
          printf 'candidate=%s\ntree=%s\n' \
            "$candidate" "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})"

      - name: Enforce narrow semantic repair
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          docs/review/INDEPENDENT_REVIEW_MATRIX.json
          scripts/check-independent-review-matrix.py
          tests/control_plane/test_independent_review_matrix.py
          EOF
          )
          actual=$(git diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort)
          test "$actual" = "$expected"
          git diff --check "$BASE_SHA" HEAD
          grep -q 'candidate_conflicts_must_be_explicit' scripts/check-independent-review-matrix.py
          grep -q 'conflicted_assignment_cannot_satisfy_availability' scripts/check-independent-review-matrix.py
          grep -q 'blocked-reviewer-capacity' scripts/check-independent-review-matrix.py
          jq -e '
            .policy.candidate_conflicts_must_be_explicit == true and
            .policy.conflicted_assignment_cannot_satisfy_availability == true and
            .summary.all_required_reviews_available == false and
            .summary.available_domain_count == 0 and
            .summary.blocked_domain_count == (.domains | length) and
            .claim_boundary.assignment_is_acceptance == false and
            .claim_boundary.candidate_specific_availability == false and
            ([.domains[].assigned_reviewers[].conflicts[]?] | length) > 0
          ' docs/review/INDEPENDENT_REVIEW_MATRIX.json >/dev/null

      - name: Execute complete control corpus
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 scripts/check-independent-review-matrix.py | tee "$RUNNER_TEMP/review-matrix.json"
          jq -e '
            .status == "blocked-reviewer-capacity" and
            .all_required_reviews_available == false and
            .available_domains == 0 and
            .blocked_domains > 0 and
            .claim_boundary.assignment_is_acceptance == false
          ' "$RUNNER_TEMP/review-matrix.json" >/dev/null
          python3 -m unittest -v tests.control_plane.test_independent_review_matrix
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"
          test -z "$(git status --porcelain)"

      - name: Create or update the narrow Draft PR and request review
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H 'Accept: application/vnd.github+json' \
                   -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H 'X-GitHub-Api-Version: 2022-11-28')
          encoded_head=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('TrillionniumFoundation:codex/reviewer-conflict-capacity-fix-2026-09-07', safe=''))
          PY
          )
          prs=$(curl -fsSL "${headers[@]}" \
            "$api/pulls?state=open&head=${encoded_head}&base=${BASE_BRANCH}&per_page=20")
          count=$(jq 'length' <<<"$prs")
          if [[ "$count" -eq 0 ]]; then
            payload=$(jq -n \
              --arg title 'fix(governance): make reviewer capacity candidate-aware' \
              --arg head "$CANDIDATE_BRANCH" \
              --arg base "$BASE_BRANCH" \
              --arg body 'Separates redundant named routing from exact-candidate conflict-free reviewer availability. Existing candidate authors/evidence producers/admin mutators remain explicit conflicts; insufficient domains report blocked-reviewer-capacity. This is a narrow Draft control repair and grants no review, evidence, gap, compatibility or production credit.' \
              '{title:$title,head:$head,base:$base,body:$body,draft:true}')
            pr=$(curl -fsSL -X POST "${headers[@]}" "$api/pulls" -d "$payload")
          elif [[ "$count" -eq 1 ]]; then
            pr=$(jq '.[0]' <<<"$prs")
            number=$(jq -r '.number' <<<"$pr")
            curl -fsSL -X PATCH "${headers[@]}" "$api/pulls/$number" \
              -d '{"draft":true}' >/dev/null
          else
            echo "multiple open PRs for reviewer-capacity branch" >&2
            exit 1
          fi
          number=$(jq -r '.number' <<<"$pr")
          head=$(jq -r '.head.sha' <<<"$pr")
          expected=$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)
          test "$head" = "$expected"
          curl -fsSL -X POST "${headers[@]}" \
            "$api/pulls/$number/requested_reviewers" \
            -d '{"reviewers":["Tomasrgbsf"]}' >/dev/null
          curl -fsSL -X POST "${headers[@]}" "$api/issues/$number/comments" \
            -d "$(jq -n --arg body "Exact-head control qualification passed for $head. The change intentionally reports blocked-reviewer-capacity; assignment/request is not acceptance. Please review only the three-file control repair. No PR #63, main, gap, evidence or production state was changed." '{body:$body}')" >/dev/null
          printf 'pr=%s\nhead=%s\n' "$number" "$head"
