name: export-server-composition

on:
  push:
    branches: [tooling/export-server-composition-2026-09-07]
    paths:
      - '.github/workflows/export-server-composition.yml'

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build exact server packet
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          packet="$GITHUB_WORKSPACE/server-composition"
          mkdir -p "$packet"
          cp -a crates/trnm-server "$packet/"
          git show -s --format='commit=%H%ntree=%T%nparents=%P%nmessage=%s' > "$packet/identity.txt"
          (
            cd "$packet"
            find . -type f ! -name files.sha256 -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > files.sha256
            sha256sum --check files.sha256
          )
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$GITHUB_WORKSPACE" -czf "$GITHUB_WORKSPACE/server-composition.tar.gz" server-composition
      - name: Install native uploader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.github" "$GITHUB_WORKSPACE/scripts"
          cp -a "$GITHUB_WORKSPACE/source/.github/actions" "$GITHUB_WORKSPACE/.github/"
          cp "$GITHUB_WORKSPACE/source/scripts/upload-actions-artifact.py" "$GITHUB_WORKSPACE/scripts/"
      - name: Retain exact server packet
        id: upload
        uses: ./.github/actions/upload-evidence
        with:
          name: server-composition-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: server-composition.tar.gz
          mime_type: application/gzip
      - name: Verify receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.upload.outputs.artifact_id }}'
          test -n '${{ steps.upload.outputs.sha256 }}'
          test '${{ steps.upload.outputs.size_bytes }}' -gt 0
