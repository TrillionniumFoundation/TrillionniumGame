name: tmp-social-core-repair

on:
  push:
    branches:
      - ops/social-core-repair-20260909
    paths:
      - .github/workflows/tmp-social-core-repair.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: social-core-repair
  cancel-in-progress: false

jobs:
  repair-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
      FEATURE_BRANCH: feature/plan-v32-social-core-20260909
      SOURCE_BRANCH: ops/social-core-source-20260909
    steps:
      - name: Resolve product base and any existing feature head
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh pr view 150 --repo "$REPOSITORY" --json state,mergedAt,headRefName,headRefOid)"
          if test "$(jq -r '.mergedAt // empty' <<<"$payload")" != ''; then
            product_base=main
            product_base_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          elif test "$(jq -r '.state' <<<"$payload")" = OPEN; then
            product_base="$(jq -r '.headRefName' <<<"$payload")"
            product_base_sha="$(jq -r '.headRefOid' <<<"$payload")"
          else
            echo 'Plan v3.2 parent is neither open nor merged' >&2
            exit 1
          fi
          feature_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/${FEATURE_BRANCH}" --jq '.object.sha' 2>/dev/null || true)"
          if test -n "$feature_sha"; then
            checkout_sha="$feature_sha"
          else
            checkout_sha="$product_base_sha"
          fi
          echo "PRODUCT_BASE=$product_base" >> "$GITHUB_ENV"
          echo "PRODUCT_BASE_SHA=$product_base_sha" >> "$GITHUB_ENV"
          echo "FEATURE_SHA=$feature_sha" >> "$GITHUB_ENV"
          echo "CHECKOUT_SHA=$checkout_sha" >> "$GITHUB_ENV"
      - name: Fetch exact checkout and source workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$CHECKOUT_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CHECKOUT_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$SOURCE_BRANCH:refs/remotes/origin/social-source"
          git -C "$GITHUB_WORKSPACE" show refs/remotes/origin/social-source:.github/workflows/tmp-social-core-source.yml > /tmp/social-source.yml
      - name: Materialize or repair social source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from __future__ import annotations
          import subprocess
          from pathlib import Path

          root = Path('.')
          source_lines = Path('/tmp/social-source.yml').read_text(encoding='utf-8').splitlines()

          def extract_after(marker: str, terminator: str, *, start_at: int = 0) -> str:
              start = next(i for i in range(start_at, len(source_lines)) if marker in source_lines[i]) + 1
              end = next(i for i in range(start, len(source_lines)) if source_lines[i].strip() == terminator)
              values = source_lines[start:end]
              normalized = [line[10:] if line.startswith('          ') else line for line in values]
              return '\n'.join(normalized) + '\n'

          files = {
              'crates/trnm-social-core/Cargo.toml': ("cat > crates/trnm-social-core/Cargo.toml <<'TOML'", 'TOML'),
              'crates/trnm-social-core/src/lib.rs': ("cat > crates/trnm-social-core/src/lib.rs <<'RS'", 'RS'),
              'crates/trnm-social-core/README.md': ("cat > crates/trnm-social-core/README.md <<'MD'", 'MD'),
              'crates/trnm-social-core/testdata/domain-surface-v1.json': ("cat > crates/trnm-social-core/testdata/domain-surface-v1.json <<'JSON'", 'JSON'),
          }
          for relative, (marker, terminator) in files.items():
              target = root / relative
              if not target.exists():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(extract_after(marker, terminator), encoding='utf-8')

          registration_step = next(i for i, line in enumerate(source_lines) if '- name: Register package and component source' in line)
          registration = extract_after("python3 - <<'PY'", 'PY', start_at=registration_step)
          Path('/tmp/register-social.py').write_text(registration, encoding='utf-8')
          subprocess.run(['python3', '/tmp/register-social.py'], check=True)

          lib = root / 'crates/trnm-social-core/src/lib.rs'
          text = lib.read_text(encoding='utf-8')
          text = text.replace(
              ') -> impl ExactSizeIterator<Item = &ChatMessage> {',
              ') -> impl Iterator<Item = &ChatMessage> {',
          )
          text = text.replace(
              ') -> impl ExactSizeIterator<Item = &Notification> {',
              ') -> impl Iterator<Item = &Notification> {',
          )
          text = text.replace(
              'registry.group_messages(group(1)).len()',
              'registry.group_messages(group(1)).count()',
          )

          replacements = 0
          cursor = 0
          needle = 'candidate.commit('
          while True:
              start = text.find(needle, cursor)
              if start < 0:
                  break
              open_paren = text.find('(', start)
              depth = 0
              end = None
              in_string = False
              escaped = False
              for index in range(open_paren, len(text)):
                  char = text[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == '"':
                          in_string = False
                      continue
                  if char == '"':
                      in_string = True
                  elif char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  raise SystemExit('unbalanced candidate.commit call')
              line_start = text.rfind('\n', 0, start) + 1
              indent = text[line_start:start]
              call = text[start:end]
              replacement = (
                  '{\n'
                  + indent + '    let receipt = ' + call + '?;\n'
                  + indent + '    *self = candidate;\n'
                  + indent + '    Ok(receipt)\n'
                  + indent + '}'
              )
              text = text[:start] + replacement + text[end:]
              cursor = start + len(replacement)
              replacements += 1
          if replacements < 10:
              raise SystemExit(f'expected many candidate commit sites, repaired {replacements}')
          if 'candidate.commit(' in text:
              raise SystemExit('unrepaired candidate commit remains')
          lib.write_text(text, encoding='utf-8')
          PY
      - name: Validate atomicity source contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('crates/trnm-social-core/src/lib.rs').read_text(encoding='utf-8')
          if 'candidate.commit(' in text:
              raise SystemExit('candidate tail call still discards accepted state')
          accepted = text.count('*self = candidate;')
          if accepted < 10:
              raise SystemExit(f'candidate replacement count is too small: {accepted}')
          if 'impl ExactSizeIterator<Item = &ChatMessage>' in text:
              raise SystemExit('chat iterator still overclaims ExactSizeIterator')
          if 'impl ExactSizeIterator<Item = &Notification>' in text:
              raise SystemExit('notification iterator still overclaims ExactSizeIterator')
          PY
      - name: Build, test, lint and validate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --all
          cargo test --package trnm-social-core --all-targets
          cargo test --package trnm-social-core --all-targets --locked
          cargo clippy --package trnm-social-core --all-targets --locked -- -D warnings
          python3 -m json.tool crates/trnm-social-core/testdata/domain-surface-v1.json >/dev/null
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-plan.py
          git diff --check
      - name: Commit repaired source and create or update child PR
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock \
            crates/trnm-social-core \
            docs/status/MODULE_DOCUMENTATION.json \
            docs/development/RUST_PACKAGE_AUTHORITY.json \
            docs/status/IMPLEMENTATION_INVENTORY.json \
            docs/status/CURRENT_STATE.json
          git diff --cached --check
          git commit -m 'social: add atomic bounded graph group chat and notification core'
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse HEAD^{tree})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          if test -n "$FEATURE_SHA"; then
            git push --force-with-lease="refs/heads/${FEATURE_BRANCH}:${FEATURE_SHA}" origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          else
            git push --force-with-lease="refs/heads/${FEATURE_BRANCH}:" origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          fi
          existing="$(gh pr list --repo "$REPOSITORY" --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          cat > /tmp/body.md <<EOF
          Parent issue: #138

          Adds an atomic bounded social-domain source candidate for users, friend request/accept/remove, directional block, group roles and owner transfer, ordered direct/group messages, notifications, exact command receipts, revision and capacity fencing.

          ```text
          base_branch=${PRODUCT_BASE}
          base_commit=${PRODUCT_BASE_SHA}
          head_commit=${head_sha}
          head_tree=${head_tree}
          ```

          Accepted transitions are applied only after invariant validation of a bounded candidate; rejected transitions preserve the original registry. Public APIs, durable repositories, pagination/search/cursors, websocket fanout, hooks/defaults, official client/oracle differentials, load/fault/security evidence and independent acceptance remain open.

          ```text
          domain_source_candidate=true
          issue_138_source_complete=false
          compatibility_credit=false
          accepted_evidence=false
          production_ready=false
          all_gaps_closed=false
          ```
          EOF
          if test -z "$existing"; then
            url="$(gh pr create --repo "$REPOSITORY" --draft --base "$PRODUCT_BASE" --head "$FEATURE_BRANCH" \
              --title '[Plan v3.2][#138] Add atomic bounded social graph, group, chat and notification core' \
              --body-file /tmp/body.md)"
            number="${url##*/}"
          else
            number="$existing"
            gh pr edit "$number" --repo "$REPOSITORY" --base "$PRODUCT_BASE" --body-file /tmp/body.md
          fi
          gh issue comment 138 --repo "$REPOSITORY" --body \
            "Atomic social-domain source candidate is available in PR #${number} at exact head \`${head_sha}\`. The repair prevents validated clone state from being discarded and removes iterator trait overclaims. Full API/data/distributed/differential/review work remains open."
