name: outbox-state-model-preflight

on:
  push:
    branches: [codex/outbox-state-model-2026-09-06]
    paths:
      - '.github/workflows/outbox-state-model-preflight.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_PARENT: 7deee4377cff401854647151842c582f038feef1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact branch without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=3 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
            "$EXPECTED_PARENT" "$GITHUB_SHA"
          test -f "$GITHUB_WORKSPACE/crates/trnm-persistence-core/tests/outbox_state_model.rs"
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Format, test and strictly lint persistence core
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/trnm-persistence-core/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-persistence-core/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-persistence-core/Cargo.toml \
            --all-targets --locked -- -D warnings
      - name: Record zero-credit source receipt
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=%s\nhead=%s\ntree=%s\nparent=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$(git rev-parse HEAD^{tree})" "$EXPECTED_PARENT"
          printf 'property_model_executed=true\naccepted_evidence=false\ngap_closed=false\nproduction_ready=false\n'
