name: temporary-apply-main-governance-20260831

on:
  push:
    branches:
      - codex/apply-main-governance-2026-08-31

permissions:
  contents: write
  pull-requests: read
  issues: write
  actions: read

concurrency:
  group: temporary-apply-main-governance-20260831
  cancel-in-progress: true

jobs:
  apply-and-read-back:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TOKEN_TRILLIONNIUM: ${{ secrets.TRILLIONNIUM_GITHUB_ADMIN_TOKEN }}
      TOKEN_GITHUB_ADMIN: ${{ secrets.GITHUB_ADMIN_TOKEN }}
      TOKEN_GH_ADMIN: ${{ secrets.GH_ADMIN_TOKEN }}
      TOKEN_REPO_ADMIN: ${{ secrets.REPO_ADMIN_TOKEN }}
      TOKEN_ADMIN: ${{ secrets.ADMIN_TOKEN }}
      TOKEN_BUILTIN: ${{ github.token }}
    steps:
      - name: Apply exact main protection and verify readback
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          candidates = [
              ("TRILLIONNIUM_GITHUB_ADMIN_TOKEN", os.environ.get("TOKEN_TRILLIONNIUM", "")),
              ("GITHUB_ADMIN_TOKEN", os.environ.get("TOKEN_GITHUB_ADMIN", "")),
              ("GH_ADMIN_TOKEN", os.environ.get("TOKEN_GH_ADMIN", "")),
              ("REPO_ADMIN_TOKEN", os.environ.get("TOKEN_REPO_ADMIN", "")),
              ("ADMIN_TOKEN", os.environ.get("TOKEN_ADMIN", "")),
              ("github.token", os.environ.get("TOKEN_BUILTIN", "")),
          ]
          seen = set()
          candidates = [
              (name, token)
              for name, token in candidates
              if token and not (token in seen or seen.add(token))
          ]
          protection = {
              "required_status_checks": {
                  "strict": True,
                  "contexts": ["trillionnium-game-merge-gate"],
              },
              "enforce_admins": True,
              "required_pull_request_reviews": {
                  "dismissal_restrictions": {},
                  "dismiss_stale_reviews": True,
                  "require_code_owner_reviews": True,
                  "required_approving_review_count": 2,
                  "require_last_push_approval": True,
                  "bypass_pull_request_allowances": {},
              },
              "restrictions": None,
              "required_linear_history": True,
              "allow_force_pushes": False,
              "allow_deletions": False,
              "block_creations": False,
              "required_conversation_resolution": True,
              "lock_branch": False,
              "allow_fork_syncing": True,
          }

          def call(token, path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "trillionnium-governance-activation",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else None

          attempts = []
          selected = None
          readback = None
          for name, token in candidates:
              try:
                  status, _ = call(token, "/branches/main/protection", "PUT", protection)
                  status2, candidate = call(token, "/branches/main/protection")
                  attempts.append({"credential": name, "write_status": status, "read_status": status2})
                  selected = name
                  readback = candidate
                  break
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")[:500]
                  attempts.append({
                      "credential": name,
                      "write_status": error.code,
                      "message": body,
                  })

          result = {
              "repository": repo,
              "target": "main",
              "selected_credential": selected,
              "attempts": attempts,
              "verified": False,
          }
          if readback is not None:
              checks = readback.get("required_status_checks") or {}
              reviews = readback.get("required_pull_request_reviews") or {}
              expected = {
                  "strict_status_checks": checks.get("strict") is True,
                  "aggregate_check_present": "trillionnium-game-merge-gate" in checks.get("contexts", []),
                  "enforce_admins": (readback.get("enforce_admins") or {}).get("enabled") is True,
                  "dismiss_stale_reviews": reviews.get("dismiss_stale_reviews") is True,
                  "code_owner_reviews": reviews.get("require_code_owner_reviews") is True,
                  "two_approvals": reviews.get("required_approving_review_count", 0) >= 2,
                  "last_push_approval": reviews.get("require_last_push_approval") is True,
                  "linear_history": (readback.get("required_linear_history") or {}).get("enabled") is True,
                  "conversation_resolution": (readback.get("required_conversation_resolution") or {}).get("enabled") is True,
                  "force_push_disabled": (readback.get("allow_force_pushes") or {}).get("enabled") is False,
                  "deletion_disabled": (readback.get("allow_deletions") or {}).get("enabled") is False,
              }
              result["checks"] = expected
              result["verified"] = all(expected.values())

          with open("governance-attempt.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")

          builtin = os.environ.get("TOKEN_BUILTIN", "")
          comment_token = selected and dict(candidates).get(selected) or builtin
          if comment_token:
              if result["verified"]:
                  body = (
                      "Main branch protection was successfully written and independently read back "
                      f"by the governance activation run using credential source `{selected}`. "
                      "Verified: strict aggregate check, admin enforcement, stale-approval dismissal, "
                      "CODEOWNERS, two approvals, latest-push approval, linear history, conversation "
                      "resolution, and force-push/deletion denial. This closes only the external "
                      "protection-state subcondition; final gap closure still requires exact-head CI "
                      "and independent review."
                  )
              else:
                  compact = ", ".join(
                      f"{item['credential']}={item.get('write_status')}"
                      for item in attempts
                  ) or "no candidate credentials were available"
                  body = (
                      "Main branch protection activation remains fail-closed. The guarded run tried "
                      f"all available credential sources without exposing tokens: {compact}. "
                      "No success is claimed and the repository protection readback must remain an "
                      "open governance blocker."
                  )
              call(comment_token, "/issues/43/comments", "POST", {"body": body})

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Main governance activation\n")
              summary.write(f"- verified: `{str(result['verified']).lower()}`\n")
              summary.write(f"- selected credential: `{selected or 'none'}`\n")
              for attempt in attempts:
                  summary.write(
                      f"- `{attempt['credential']}` write status: `{attempt.get('write_status')}`\n"
                  )

          if not result["verified"]:
              raise SystemExit("main protection was not written and verified")
          PY

      - name: Delete temporary governance branch after verified activation
        if: success()
        run: |
          set -euo pipefail
          git init cleanup
          cd cleanup
          git remote add origin "https://x-access-token:${TOKEN_BUILTIN}@github.com/${REPOSITORY}.git"
          git push origin --delete "${GITHUB_REF_NAME}"
