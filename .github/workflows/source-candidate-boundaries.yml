name: source-candidate-boundaries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-candidate-boundaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  structured-claim-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate source-candidate promotion boundary
        run: |
          set -euo pipefail
          python3 scripts/check-source-candidate-boundaries.py \
            | tee source-candidate-boundaries.json
          jq -e '
            .status == "passed" and
            .candidate_count > 0 and
            .claims.structured_boundaries_valid == true and
            .claims.remote_verified == false and
            .claims.compatibility_credit == false and
            .claims.production_ready == false
          ' source-candidate-boundaries.json >/dev/null
