name: exact-head-evidence-snapshot

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: exact-head-evidence-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-exact-head-evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$HEAD_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Wait for and seal required exact-head workflow collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          repository = os.environ['GITHUB_REPOSITORY']
          head = os.environ['HEAD_SHA']
          token = os.environ['GH_TOKEN']
          pr_number = os.environ.get('PR_NUMBER', '')
          api_root = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'trillionnium-exact-head-evidence',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          required = [
              'trillionnium-game-merge-gate',
              'pgwire-vertical-slice',
              'database-backup-restore',
              'world-command-deployed-runtime-v1',
              'denominator-review-bundle',
              'repository-governance-contract',
              'pull-request-contract',
              'pr-candidate-body-sync',
              'pg-outbox-dispatch',
              'pg-query-deadline',
              'pg-pool-tls-operations',
              'server-concurrency-smoke',
          ]

          def request_json(
              url: str,
              *,
              method: str = 'GET',
              payload: dict[str, Any] | None = None,
          ) -> Any:
              data = None
              request_headers = dict(headers)
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
                  request_headers['Content-Type'] = 'application/json'
              request = urllib.request.Request(
                  url,
                  data=data,
                  headers=request_headers,
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode('utf-8'))

          def latest_runs() -> dict[str, dict[str, Any]]:
              encoded = urllib.parse.urlencode(
                  {'head_sha': head, 'per_page': 100, 'exclude_pull_requests': 'false'}
              )
              document = request_json(f'{api_root}/actions/runs?{encoded}')
              selected: dict[str, dict[str, Any]] = {}
              for run in document.get('workflow_runs', []):
                  if run.get('head_sha') != head:
                      continue
                  name = run.get('name')
                  if name not in required:
                      continue
                  prior = selected.get(name)
                  if prior is None or (run.get('created_at') or '') > (prior.get('created_at') or ''):
                      selected[name] = run
              return selected

          selected: dict[str, dict[str, Any]] = {}
          pending: list[str] = required
          for attempt in range(60):
              selected = latest_runs()
              pending = [
                  name
                  for name in required
                  if name not in selected
                  or selected[name].get('status') != 'completed'
              ]
              if not pending:
                  break
              print(
                  json.dumps(
                      {
                          'attempt': attempt + 1,
                          'head': head,
                          'pending': pending,
                      },
                      sort_keys=True,
                  ),
                  flush=True,
              )
              time.sleep(30)

          commit = request_json(f'{api_root}/git/commits/{head}')
          tree = commit.get('tree', {}).get('sha')
          workflows: list[dict[str, Any]] = []
          failures: list[str] = []
          for name in required:
              run = selected.get(name)
              if run is None:
                  failures.append(f'{name}:absent')
                  workflows.append({'name': name, 'status': 'absent'})
                  continue
              jobs_document = request_json(
                  f"{api_root}/actions/runs/{run['id']}/jobs?per_page=100"
              )
              jobs = jobs_document.get('jobs', [])
              job_rows = [
                  {
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'started_at': job.get('started_at'),
                      'completed_at': job.get('completed_at'),
                  }
                  for job in jobs
              ]
              if run.get('status') != 'completed' or run.get('conclusion') != 'success':
                  failures.append(
                      f"{name}:{run.get('status')}:{run.get('conclusion')}"
                  )
              if not jobs:
                  failures.append(f'{name}:empty-job-collection')
              for job in job_rows:
                  if job['status'] != 'completed' or job['conclusion'] != 'success':
                      failures.append(
                          f"{name}:{job['name']}:{job['status']}:{job['conclusion']}"
                      )
              workflows.append(
                  {
                      'name': name,
                      'run_id': run.get('id'),
                      'run_attempt': run.get('run_attempt'),
                      'event': run.get('event'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'created_at': run.get('created_at'),
                      'updated_at': run.get('updated_at'),
                      'jobs': job_rows,
                  }
              )

          manifest = {
              'schema': 'trillionnium.exact-head-workflow-evidence.v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'repository': repository,
              'pull_request': int(pr_number) if pr_number else None,
              'candidate': {'commit': head, 'tree': tree},
              'required_workflows': required,
              'workflows': workflows,
              'result': 'passed' if not failures else 'blocked',
              'failures': sorted(set(failures)),
              'claims': {
                  'exact_head_execution_collection_complete': not failures,
                  'independent_review_completed': False,
                  'compatibility_credit': False,
                  'production_credit': False,
                  'public_online': False,
                  'nakama_retired': False,
              },
          }
          canonical = json.dumps(
              manifest,
              sort_keys=True,
              separators=(',', ':'),
              ensure_ascii=False,
          ).encode('utf-8')
          digest = hashlib.sha256(canonical).hexdigest()
          manifest['sha256'] = digest
          Path('/tmp/exact-head-evidence.json').write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          marker = '<!-- trillionnium-exact-head-evidence -->'
          status = 'PASS' if not failures else 'BLOCKED'
          rows = [
              f'{marker}',
              '## Exact-head workflow evidence snapshot',
              '',
              f'- candidate commit: `{head}`',
              f'- candidate tree: `{tree}`',
              f'- manifest SHA-256: `{digest}`',
              f'- required collection: `{status}`',
              f'- workflow count: `{len(workflows)}/{len(required)}`',
              f'- independent review: `false`',
              f'- compatibility credit: `false`',
              f'- production credit: `false`',
              '',
              '| Workflow | Run | Status | Conclusion | Jobs |',
              '|---|---:|---|---|---:|',
          ]
          for row in workflows:
              rows.append(
                  f"| `{row['name']}` | `{row.get('run_id', 'absent')}` | "
                  f"`{row.get('status', 'absent')}` | "
                  f"`{row.get('conclusion', 'none')}` | `{len(row.get('jobs', []))}` |"
              )
          if failures:
              rows += ['', 'Failures:', '']
              rows.extend(f'- `{failure}`' for failure in sorted(set(failures)))
          rows += [
              '',
              'This machine snapshot records exact execution identity only. It is not an independent',
              'review, denominator lock, compatibility decision, production acceptance or retirement approval.',
          ]
          body = '\n'.join(rows)

          if pr_number:
              comments = request_json(
                  f'{api_root}/issues/{pr_number}/comments?per_page=100'
              )
              existing = next(
                  (
                      comment
                      for comment in comments
                      if marker in (comment.get('body') or '')
                      and comment.get('user', {}).get('type') == 'Bot'
                  ),
                  None,
              )
              if existing:
                  request_json(
                      f"{api_root}/issues/comments/{existing['id']}",
                      method='PATCH',
                      payload={'body': body},
                  )
              else:
                  request_json(
                      f'{api_root}/issues/{pr_number}/comments',
                      method='POST',
                      payload={'body': body},
                  )

          check_payload = {
              'name': 'exact-head-evidence-snapshot',
              'head_sha': head,
              'status': 'completed',
              'conclusion': 'success' if not failures else 'failure',
              'output': {
                  'title': f'Exact-head evidence {status}',
                  'summary': '\n'.join(rows[1:])[:65000],
              },
          }
          request_json(
              f'{api_root}/check-runs',
              method='POST',
              payload=check_payload,
          )
          print(json.dumps(manifest, sort_keys=True))
          if failures:
              raise SystemExit(1)
          PY

      - name: Verify sealed manifest is exact and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path('/tmp/exact-head-evidence.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          recorded = document.pop('sha256')
          canonical = json.dumps(
              document,
              sort_keys=True,
              separators=(',', ':'),
              ensure_ascii=False,
          ).encode('utf-8')
          assert hashlib.sha256(canonical).hexdigest() == recorded
          assert document['candidate']['commit'] == os.environ['HEAD_SHA']
          assert document['result'] == 'passed'
          assert document['claims']['independent_review_completed'] is False
          assert document['claims']['compatibility_credit'] is False
          assert document['claims']['production_credit'] is False
          PY
