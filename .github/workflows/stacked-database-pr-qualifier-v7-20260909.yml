name: stacked-database-pr-qualifier-v7-20260909

on:
  push:
    branches:
      - codex/plan-v32-controller-v2-2026-09-09
    paths:
      - .github/workflows/stacked-database-pr-qualifier-v7-20260909.yml
      - tools/qualify_stacked_database_pr_v3.sh

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        branch:
          - codex/postgresql-authority-storage-closure-2026-09-09
          - codex/postgresql-fault-recovery-closure-2026-09-09
          - codex/postgresql-semantic-recovery-closure-2026-09-09
          - codex/cockroachdb-semantic-recovery-closure-2026-09-09
          - codex/postgresql-recovery-barrier-closure-2026-09-09
          - codex/postgresql-connection-fault-closure-2026-09-09
          - codex/postgresql-primary-failover-closure-2026-09-09
          - codex/cockroachdb-node-failover-closure-2026-09-09
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    concurrency:
      group: stacked-database-pr-qualifier-${{ matrix.branch }}
      cancel-in-progress: true
    env:
      HEAD_BRANCH: ${{ matrix.branch }}
      EXPECTED_WORKFLOW_COUNT: "56"
    steps:
      - name: Fetch exact branch-discovered qualifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/controller"
          git init "$GITHUB_WORKSPACE/controller"
          git -C "$GITHUB_WORKSPACE/controller" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/controller" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/controller" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/controller" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Bind exact-head, prospective-merge and post-body fixed point
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/controller/tools/qualify_stacked_database_pr_v3.sh"
