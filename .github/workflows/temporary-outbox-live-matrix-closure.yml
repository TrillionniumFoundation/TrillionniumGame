name: temporary-outbox-live-matrix-closure

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-outbox-dispatch-closure
  cancel-in-progress: false

jobs:
  implement-prove-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Fetch exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Materialize live outbox matrix and immutable permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f crates/trnm-persistence-pg/src/outbox_dispatch.rs
          test -f crates/trnm-persistence-pg/src/outbox_worker.rs
          cat > crates/trnm-persistence-pg/tests/outbox_dispatch.rs <<'RUST'
          use std::env;
          use std::time::Duration;

          use postgres::{Client, NoTls};
          use trnm_contracts::{CommandId, Digest32};
          use trnm_persistence_pg::{
              CommitRequest, DatabaseProfile, EntityId, IntentId, IntentKind, NodeId,
              OutboxFailureOutcome, OutboxInput, OutboxLeasePolicy, PgRepository,
          };

          #[derive(Debug)]
          struct LiveConfig {
              database_url: String,
              profile: DatabaseProfile,
          }

          fn live_config() -> Option<LiveConfig> {
              let required = env::var("TRNM_OUTBOX_TEST_REQUIRED").ok().as_deref() == Some("1");
              let database_url = env::var("TRNM_OUTBOX_TEST_DATABASE_URL").ok();
              let profile = env::var("TRNM_OUTBOX_TEST_PROFILE").ok();
              match (database_url, profile.as_deref()) {
                  (Some(database_url), Some("postgresql")) => Some(LiveConfig {
                      database_url,
                      profile: DatabaseProfile::PostgreSql,
                  }),
                  (Some(database_url), Some("cockroachdb")) => Some(LiveConfig {
                      database_url,
                      profile: DatabaseProfile::CockroachDb,
                  }),
                  _ if required => panic!(
                      "TRNM_OUTBOX_TEST_REQUIRED=1 requires database URL and valid profile"
                  ),
                  _ => None,
              }
          }

          fn id16(value: u8) -> [u8; 16] {
              [value; 16]
          }

          fn digest(value: u8) -> Digest32 {
              Digest32::new([value; 32])
          }

          fn bootstrap_and_enqueue(
              repository: &mut PgRepository,
              entity_byte: u8,
              command_byte: u8,
              intent_byte: u8,
              available_at_ms: u64,
          ) -> IntentId {
              let entity = EntityId::new(id16(entity_byte));
              repository
                  .bootstrap_entity(entity, 1, digest(entity_byte.saturating_add(20)), 1)
                  .unwrap();
              let intent = IntentId::new(id16(intent_byte));
              let outcome = repository
                  .commit_command(&CommitRequest {
                      entity,
                      command: CommandId::new(id16(command_byte)),
                      fingerprint: digest(command_byte.saturating_add(30)),
                      expected_revision: 0,
                      authority_generation: 1,
                      next_state: digest(entity_byte.saturating_add(40)),
                      committed_at_ms: available_at_ms,
                      events: Vec::new(),
                      outbox: vec![OutboxInput {
                          id: intent,
                          kind: IntentKind::ExternalEffect,
                          payload: digest(intent_byte.saturating_add(50)),
                          available_at_ms,
                      }],
                  })
                  .unwrap();
              assert!(matches!(
                  outcome,
                  trnm_persistence_pg::CommitOutcome::Applied(_)
              ));
              intent
          }

          #[test]
          fn live_outbox_reclaim_completion_retry_and_dead_letter_are_fenced() {
              let Some(config) = live_config() else {
                  eprintln!("outbox live profile not requested; no remote evidence credit");
                  return;
              };
              let mut repository =
                  PgRepository::connect(&config.database_url, config.profile).unwrap();
              let owner_one = NodeId::new(id16(91));
              let owner_two = NodeId::new(id16(92));
              let policy = OutboxLeasePolicy::new(
                  16,
                  2,
                  Duration::from_millis(50),
                  digest(201),
              )
              .unwrap();

              let completed_intent =
                  bootstrap_and_enqueue(&mut repository, 1, 2, 3, 100);
              let first = repository
                  .lease_outbox(owner_one, 100, policy)
                  .unwrap();
              assert_eq!(first.leased.len(), 1);
              assert!(first.dead_lettered.is_empty());
              let stale_lease = first.leased[0].clone();
              assert_eq!(stale_lease.id, completed_intent);
              assert_eq!(stale_lease.attempt, 1);
              assert_eq!(stale_lease.lease_generation, 1);

              assert!(repository
                  .lease_outbox(owner_two, 149, policy)
                  .unwrap()
                  .leased
                  .is_empty());
              let reclaimed = repository
                  .lease_outbox(owner_two, 150, policy)
                  .unwrap();
              assert_eq!(reclaimed.leased.len(), 1);
              let active_lease = reclaimed.leased[0].clone();
              assert_eq!(active_lease.id, completed_intent);
              assert_eq!(active_lease.owner, owner_two);
              assert_eq!(active_lease.attempt, 2);
              assert_eq!(active_lease.lease_generation, 2);
              assert_eq!(
                  repository
                      .complete_outbox(&stale_lease, digest(210), 151)
                      .unwrap_err()
                      .reason(),
                  "stale_outbox_lease"
              );
              repository
                  .complete_outbox(&active_lease, digest(211), 151)
                  .unwrap();

              let dead_intent =
                  bootstrap_and_enqueue(&mut repository, 11, 12, 13, 200);
              let retry_lease = repository
                  .lease_outbox(owner_one, 200, policy)
                  .unwrap()
                  .leased
                  .remove(0);
              assert_eq!(retry_lease.id, dead_intent);
              assert_eq!(
                  repository
                      .fail_outbox(&retry_lease, digest(220), 201, 225, 2)
                      .unwrap(),
                  OutboxFailureOutcome::Retried {
                      available_at_ms: 225
                  }
              );
              assert!(repository
                  .lease_outbox(owner_two, 224, policy)
                  .unwrap()
                  .leased
                  .is_empty());
              let final_lease = repository
                  .lease_outbox(owner_two, 225, policy)
                  .unwrap()
                  .leased
                  .remove(0);
              assert_eq!(final_lease.attempt, 2);
              assert_eq!(
                  repository
                      .fail_outbox(&final_lease, digest(221), 226, 250, 2)
                      .unwrap(),
                  OutboxFailureOutcome::DeadLettered
              );

              let mut client = Client::connect(&config.database_url, NoTls).unwrap();
              let delivered = client
                  .query_one(
                      "SELECT state, attempt, lease_generation, owner_node, receipt_digest, \
                       dead_reason_digest FROM trnm_outbox WHERE intent_id = $1",
                      &[&completed_intent.as_bytes().as_slice()],
                  )
                  .unwrap();
              assert_eq!(delivered.get::<_, i16>(0), 2);
              assert_eq!(delivered.get::<_, i32>(1), 2);
              assert_eq!(delivered.get::<_, i64>(2), 2);
              assert!(delivered.get::<_, Option<Vec<u8>>>(3).is_none());
              assert_eq!(
                  delivered.get::<_, Option<Vec<u8>>>(4).unwrap(),
                  digest(211).as_bytes().as_slice()
              );
              assert!(delivered.get::<_, Option<Vec<u8>>>(5).is_none());

              let dead = client
                  .query_one(
                      "SELECT state, attempt, owner_node, receipt_digest, dead_reason_digest \
                       FROM trnm_outbox WHERE intent_id = $1",
                      &[&dead_intent.as_bytes().as_slice()],
                  )
                  .unwrap();
              assert_eq!(dead.get::<_, i16>(0), 3);
              assert_eq!(dead.get::<_, i32>(1), 2);
              assert!(dead.get::<_, Option<Vec<u8>>>(2).is_none());
              assert!(dead.get::<_, Option<Vec<u8>>>(3).is_none());
              assert_eq!(
                  dead.get::<_, Option<Vec<u8>>>(4).unwrap(),
                  digest(221).as_bytes().as_slice()
              );
              assert!(repository
                  .lease_outbox(owner_one, 10_000, policy)
                  .unwrap()
                  .leased
                  .is_empty());
          }
          RUST

          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')
          workflow_text = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in sorted((root / '.github/workflows').glob('*.yml'))
              if path.name != 'temporary-outbox-live-matrix-closure.yml'
          )

          def image(pattern: str, label: str) -> str:
              matches = sorted(set(re.findall(pattern, workflow_text)))
              if not matches:
                  raise SystemExit(f'no immutable {label} image reference found')
              return matches[0]

          postgres = image(
              r'(?:docker\.io/library/)?postgres(?::[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}',
              'PostgreSQL',
          )
          cockroach = image(
              r'(?:docker\.io/)?cockroachdb/cockroach(?::[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}',
              'CockroachDB',
          )

          permanent = f'''name: pg-outbox-dispatch

on:
  pull_request:
  push:
    branches:
      - main
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: read

jobs:
  postgresql-outbox-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact head without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{GITHUB_REPOSITORY}}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run PostgreSQL outbox lease/reclaim matrix
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          docker run -d --name trnm-outbox-postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55432:5432 \
            {postgres}
          for attempt in $(seq 1 90); do
            if docker exec trnm-outbox-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 90
            sleep 1
          done
          docker exec -i trnm-outbox-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < migrations/postgresql/0001_foundation_up.sql
          TRNM_OUTBOX_TEST_REQUIRED=1 \
          TRNM_OUTBOX_TEST_PROFILE=postgresql \
          TRNM_OUTBOX_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55432/postgres \
            cargo test --package trnm-persistence-pg --test outbox_dispatch --locked -- --nocapture

  cockroachdb-outbox-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact head without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{GITHUB_REPOSITORY}}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run CockroachDB outbox lease/reclaim matrix
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          docker run -d --name trnm-outbox-cockroach \
            -p 127.0.0.1:56257:26257 \
            {cockroach} \
            start-single-node --insecure --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 120); do
            if docker exec trnm-outbox-cockroach cockroach sql \
              --insecure --host=127.0.0.1:26257 --database=defaultdb \
              --execute='SELECT 1' >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 120
            sleep 1
          done
          docker exec -i trnm-outbox-cockroach cockroach sql \
            --insecure --host=127.0.0.1:26257 --database=defaultdb \
            < migrations/cockroachdb/0001_foundation_up.sql
          TRNM_OUTBOX_TEST_REQUIRED=1 \
          TRNM_OUTBOX_TEST_PROFILE=cockroachdb \
          TRNM_OUTBOX_TEST_DATABASE_URL='postgresql://root@127.0.0.1:56257/defaultdb?sslmode=disable' \
            cargo test --package trnm-persistence-pg --test outbox_dispatch --locked -- --nocapture

  pg-outbox-dispatch-gate:
    if: ${{{{ always() }}}}
    needs:
      - postgresql-outbox-dispatch
      - cockroachdb-outbox-dispatch
    runs-on: ubuntu-24.04
    steps:
      - name: Require both profiles
        shell: bash
        env:
          POSTGRESQL_RESULT: ${{{{ needs.postgresql-outbox-dispatch.result }}}}
          COCKROACHDB_RESULT: ${{{{ needs.cockroachdb-outbox-dispatch.result }}}}
        run: |
          set -euo pipefail
          test "$POSTGRESQL_RESULT" = success
          test "$COCKROACHDB_RESULT" = success
'''
          (root / '.github/workflows/pg-outbox-dispatch.yml').write_text(
              permanent,
              encoding='utf-8',
          )
          PY
          test -f .github/workflows/pg-outbox-dispatch.yml
          git diff --check

      - name: Prove PostgreSQL profile before commit
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_IMAGE="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = '\n'.join(p.read_text() for p in Path('.github/workflows').glob('*.yml'))
          values = sorted(set(re.findall(r'(?:docker\.io/library/)?postgres(?::[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}', text)))
          if not values:
              raise SystemExit(1)
          print(values[0])
          PY
          )"
          docker run -d --name trnm-outbox-postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55432:5432 \
            "$POSTGRES_IMAGE"
          for attempt in $(seq 1 90); do
            if docker exec trnm-outbox-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90
            sleep 1
          done
          docker exec -i trnm-outbox-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < migrations/postgresql/0001_foundation_up.sql
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          TRNM_OUTBOX_TEST_REQUIRED=1 \
          TRNM_OUTBOX_TEST_PROFILE=postgresql \
          TRNM_OUTBOX_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55432/postgres \
            cargo test --package trnm-persistence-pg --test outbox_dispatch --locked -- --nocapture
          docker rm -f trnm-outbox-postgres

      - name: Prove CockroachDB profile before commit
        shell: bash
        run: |
          set -euo pipefail
          COCKROACH_IMAGE="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = '\n'.join(p.read_text() for p in Path('.github/workflows').glob('*.yml'))
          values = sorted(set(re.findall(r'(?:docker\.io/)?cockroachdb/cockroach(?::[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}', text)))
          if not values:
              raise SystemExit(1)
          print(values[0])
          PY
          )"
          docker run -d --name trnm-outbox-cockroach \
            -p 127.0.0.1:56257:26257 \
            "$COCKROACH_IMAGE" \
            start-single-node --insecure --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 120); do
            if docker exec trnm-outbox-cockroach cockroach sql \
              --insecure --host=127.0.0.1:26257 --database=defaultdb \
              --execute='SELECT 1' >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 120
            sleep 1
          done
          docker exec -i trnm-outbox-cockroach cockroach sql \
            --insecure --host=127.0.0.1:26257 --database=defaultdb \
            < migrations/cockroachdb/0001_foundation_up.sql
          TRNM_OUTBOX_TEST_REQUIRED=1 \
          TRNM_OUTBOX_TEST_PROFILE=cockroachdb \
          TRNM_OUTBOX_TEST_DATABASE_URL='postgresql://root@127.0.0.1:56257/defaultdb?sslmode=disable' \
            cargo test --package trnm-persistence-pg --test outbox_dispatch --locked -- --nocapture
          docker rm -f trnm-outbox-cockroach

      - name: Validate full repository control plane
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check

      - name: Self-remove and push only from unchanged trigger head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-outbox-live-matrix-closure.yml
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test ! -e .github/workflows/temporary-outbox-live-matrix-closure.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "test(outbox): prove fenced dispatch on both PG-wire profiles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
