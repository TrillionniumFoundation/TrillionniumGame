name: temporary-server-concurrency-finalizer

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: trillionnium-plan-v3-single-writer
  cancel-in-progress: false

jobs:
  recover-verify-and-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Fetch quiet exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          sleep 90
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - name: Recover missing server source and permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          root = Path('.')
          server = root / 'crates/trnm-persistence-pg/src/bin/trnm_server/server.rs'
          config = root / 'crates/trnm-persistence-pg/src/bin/trnm_server/config.rs'
          permanent = root / '.github/workflows/server-concurrency-smoke.yml'
          source_ready = (
              server.is_file()
              and 'sync_channel::<TcpStream>' in server.read_text(encoding='utf-8')
              and 'TRNM_SERVER_WORKER_COUNT' in config.read_text(encoding='utf-8')
              and permanent.is_file()
          )
          if source_ready:
              raise SystemExit(0)
          original = root / '.github/workflows/temporary-server-concurrency-closure.yml'
          if not original.is_file():
              raise SystemExit('bounded server source incomplete and recovery payload absent')
          lines = original.read_text(encoding='utf-8').splitlines()

          def run_block(name: str) -> None:
              marker = f'      - name: {name}'
              try:
                  start = lines.index(marker)
              except ValueError as error:
                  raise SystemExit(f'missing recovery step: {name}') from error
              run = None
              for index in range(start + 1, len(lines)):
                  if lines[index].startswith('      - name: '):
                      break
                  if lines[index] == '        run: |':
                      run = index + 1
                      break
              if run is None:
                  raise SystemExit(f'missing run block: {name}')
              block = []
              for index in range(run, len(lines)):
                  line = lines[index]
                  if line.startswith('      - name: '):
                      break
                  if line and not line.startswith('          '):
                      raise SystemExit(f'noncanonical recovery indentation: {line!r}')
                  block.append(line[10:] if line else '')
              script = root / '.git' / ('recover-' + name.lower().replace(' ', '-') + '.sh')
              script.write_text('\n'.join(block) + '\n', encoding='utf-8')
              subprocess.run(['bash', str(script)], check=True)

          run_block('Replace the serial accept loop with bounded supervision')
          run_block('Generate exact-head process saturation workflow')
          PY
          test -f .github/workflows/server-concurrency-smoke.yml
          grep -q 'sync_channel::<TcpStream>' crates/trnm-persistence-pg/src/bin/trnm_server/server.rs
          grep -q 'TRNM_SERVER_WORKER_COUNT' crates/trnm-persistence-pg/src/bin/trnm_server/config.rs
          git diff --check

      - name: Ensure the permanent saturation probe closes requests cleanly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/server-concurrency-smoke.yml')
          source = path.read_text(encoding='utf-8')
          old = '''          for sock in blockers:
              sock.close()
          time.sleep(0.5)
'''
          new = '''          for sock in blockers:
              sock.sendall(b'\\r\\n')
          for sock in blockers:
              while sock.recv(4096):
                  pass
              sock.close()
          time.sleep(0.5)
'''
          if old in source:
              source = source.replace(old, new, 1)
          elif "sock.sendall(b'\\r\\n')" not in source:
              raise SystemExit(f'{path}: blocker cleanup anchor missing')
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Compile, test and strictly lint the source corpus
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo check --package trnm-persistence-pg --all-targets --locked
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --fix --allow-dirty --allow-staged \
            --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Prove queue saturation, recovery and graceful drain
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_IMAGE="$(grep -Eo '(docker.io/library/)?postgres(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' .github/workflows/server-concurrency-smoke.yml | head -1)"
          test -n "$POSTGRES_IMAGE"
          docker run -d --name trnm-server-concurrency-db \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55437:5432 "$POSTGRES_IMAGE"
          for attempt in $(seq 1 90); do
            if docker exec trnm-server-concurrency-db pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90; sleep 1
          done
          export TRNM_SERVER_DATABASE_URL=postgresql://postgres@127.0.0.1:55437/postgres
          export TRNM_SERVER_DATABASE_PROFILE=postgresql
          export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$GITHUB_SHA"
          export TRNM_SERVER_ADMIN_TOKEN=0123456789abcdefghijklmnopqrstuvwxyzABCDE
          export TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE=1
          export TRNM_SERVER_BIND=127.0.0.1:57350
          export TRNM_SERVER_WORKER_COUNT=2
          export TRNM_SERVER_CONNECTION_QUEUE_CAPACITY=4
          export TRNM_SERVER_READ_TIMEOUT_MS=5000
          cargo run --quiet --package trnm-persistence-pg --bin trnm-server -- migrate
          cargo run --quiet --package trnm-persistence-pg --bin trnm-server -- serve \
            > /tmp/trnm-server-concurrency.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; docker rm -f trnm-server-concurrency-db >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import concurrent.futures
          import socket
          import time

          address = ('127.0.0.1', 57350)
          for _ in range(200):
              try:
                  with socket.create_connection(address, timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.05)
          else:
              raise SystemExit('server did not become reachable')

          blockers = []
          for _ in range(6):
              sock = socket.create_connection(address, timeout=2)
              sock.sendall(b'GET /healthz HTTP/1.1\r\nHost: localhost\r\n')
              blockers.append(sock)
          time.sleep(0.3)
          with socket.create_connection(address, timeout=2) as sock:
              sock.sendall(
                  b'GET /healthz HTTP/1.1\r\nHost: localhost\r\n'
                  b'Connection: close\r\n\r\n'
              )
              payload = b''
              while True:
                  chunk = sock.recv(4096)
                  if not chunk:
                      break
                  payload += chunk
          if not payload.startswith(b'HTTP/1.1 503'):
              raise SystemExit(f'queue saturation did not return 503: {payload[:120]!r}')
          for sock in blockers:
              sock.sendall(b'\r\n')
          for sock in blockers:
              response = b''
              while True:
                  chunk = sock.recv(4096)
                  if not chunk:
                      break
                  response += chunk
              if not response.startswith(b'HTTP/1.1 200 OK'):
                  raise SystemExit(f'blocked health request failed: {response[:120]!r}')
              sock.close()
          time.sleep(0.5)

          def health(_):
              with socket.create_connection(address, timeout=3) as sock:
                  sock.sendall(
                      b'GET /healthz HTTP/1.1\r\nHost: localhost\r\n'
                      b'Connection: close\r\n\r\n'
                  )
                  data = b''
                  while True:
                      chunk = sock.recv(4096)
                      if not chunk:
                          break
                      data += chunk
              return data.split(b'\r\n', 1)[0]

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as executor:
              statuses = list(executor.map(health, range(64)))
          if any(status != b'HTTP/1.1 200 OK' for status in statuses):
              raise SystemExit(f'health recovery failed: {statuses!r}')

          with socket.create_connection(address, timeout=3) as sock:
              sock.sendall(
                  b'POST /-/drain HTTP/1.1\r\nHost: localhost\r\n'
                  b'Authorization: Bearer 0123456789abcdefghijklmnopqrstuvwxyzABCDE\r\n'
                  b'Content-Length: 0\r\nConnection: close\r\n\r\n'
              )
              response = sock.recv(4096)
          if not response.startswith(b'HTTP/1.1 200 OK'):
              raise SystemExit(f'drain failed: {response[:120]!r}')
          PY
          for attempt in $(seq 1 100); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              wait "$SERVER_PID"
              exit 0
            fi
            sleep 0.1
          done
          echo 'server failed to drain within 10 seconds' >&2
          cat /tmp/trnm-server-concurrency.log >&2
          exit 1

      - name: Delete every temporary writer and push unchanged-tip result
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) \
            -print -delete
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(server): add bounded connection supervision"
          git push origin "HEAD:${GITHUB_REF_NAME}"
