name: tmp-world-plan-v4-development-transfer

on:
  push:
    branches:
      - tmp/world-plan-v4-development-transfer-20260831
    paths:
      - .github/workflows/tmp-world-plan-v4-development-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-world-plan-v4-development-transfer
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Qualify immutable World Plan v4 source v13k
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "0"
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
          RUST_TOOLCHAIN: "1.98.0"
          WORLD_HEAD: "5605cfb8861aa923f69ff032ddbff7d035bccb0c"
          TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: "0"
        run: |
          set -euo pipefail
          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "${GITHUB_SHA}"

          git init world
          git -C world remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C world fetch --no-tags --depth=1 origin "${WORLD_HEAD}"
          git -C world checkout --detach FETCH_HEAD
          test "$(git -C world rev-parse HEAD)" = "${WORLD_HEAD}"

          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

          bash control/tmp/world-plan-v4-v8-patch/qualify-v13k.sh \
            "$GITHUB_WORKSPACE/world" \
            "$GITHUB_WORKSPACE/control" \
            "$GITHUB_WORKSPACE/export"

          patch_sha="$(sha256sum "$GITHUB_WORKSPACE/export/world-v13-source.patch" | awk '{print $1}')"
          test "$patch_sha" = ba49dba1e7fbf842f146ac399647e188faafcfbd5ce3ad17425ef88850e0199f
          printf 'qualified_patch_sha256=%s\n' "$patch_sha"
          cat "$GITHUB_WORKSPACE/export/identity.txt"

          printf 'TRNM_WORLD_V13K_MANIFEST_BEGIN\n'
          cat "$GITHUB_WORKSPACE/export/manifest.json"
          printf 'TRNM_WORLD_V13K_MANIFEST_END\n'

          git -C "$GITHUB_WORKSPACE/world" add -A
          candidate_tree="$(git -C "$GITHUB_WORKSPACE/world" write-tree)"
          test "$candidate_tree" = 5e613185f5a2abda42df371f3755e73667717309
          printf 'qualified_candidate_tree=%s\n' "$candidate_tree"

          tree_archive="$GITHUB_WORKSPACE/export/world-v13k-candidate-tree.tar.gz"
          git -C "$GITHUB_WORKSPACE/world" archive --format=tar "$candidate_tree" \
            | gzip -n -9 > "$tree_archive"
          test -s "$tree_archive"
          archive_sha="$(sha256sum "$tree_archive" | awk '{print $1}')"
          printf 'qualified_candidate_tree_archive_sha256=%s\n' "$archive_sha"
          printf '%s  %s\n' "$archive_sha" "$(basename "$tree_archive")" \
            >> "$GITHUB_WORKSPACE/export/SHA256SUMS"
          printf 'TRNM_WORLD_V13K_HASH_MANIFEST=PASS\n'

          mkdir -p "$GITHUB_WORKSPACE/.github/actions"
          cp -R \
            "$GITHUB_WORKSPACE/control/.github/actions/trnm-upload-artifact" \
            "$GITHUB_WORKSPACE/.github/actions/trnm-upload-artifact"

      - name: Upload immutable World v13k candidate evidence
        uses: ./.github/actions/trnm-upload-artifact
        with:
          name: world-v13k-source-candidate-${{ github.sha }}
          path: ${{ github.workspace }}/export
          if-no-files-found: error
          retention-days: "30"
          compression-level: "9"
          overwrite: "false"
          include-hidden-files: "false"
