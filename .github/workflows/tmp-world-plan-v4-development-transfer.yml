name: tmp-world-plan-v4-v8-arm

on:
  push:
    branches:
      - tmp/world-plan-v4-v8-arm-20260831
    paths:
      - .github/workflows/tmp-world-plan-v4-development-transfer.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-world-plan-v4-v8-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Qualify immutable World Plan v4 source
        shell: bash
        env:
          CARGO_TERM_COLOR: never
          CARGO_INCREMENTAL: "0"
          RUST_BACKTRACE: "1"
          RUST_TEST_THREADS: "1"
          RUST_TOOLCHAIN: "1.98.0"
          WORLD_HEAD: "5605cfb8861aa923f69ff032ddbff7d035bccb0c"
          TRNM_REQUIRE_SETTLEMENT_DATABASE_TEST: "0"
        run: |
          set -euo pipefail
          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "${GITHUB_SHA}"

          git init world
          git -C world remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C world fetch --no-tags --depth=1 origin "${WORLD_HEAD}"
          git -C world checkout --detach FETCH_HEAD
          test "$(git -C world rev-parse HEAD)" = "${WORLD_HEAD}"

          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

          cat > /tmp/repair-world-v8.py <<'PYREPAIR'
          from pathlib import Path
          import re
          import sys

          world = Path(sys.argv[1])

          campaign = world / "trillionnium/crates/trnm-campaign-core/src/lib.rs"
          campaign_source = campaign.read_text(encoding="utf-8")
          if "__atomic_inner" not in campaign_source:
              raise SystemExit("campaign atomicity helper drifted")
          campaign.write_text(
              campaign_source.replace("__atomic_inner", "_atomic_inner"),
              encoding="utf-8",
          )

          rts = world / "trillionnium/crates/trnm-rts-sim/src/lib.rs"
          rts_source = rts.read_text(encoding="utf-8")
          old_rts = (
              "        let error = assert_sim_error_preserves_state(&mut sim, |candidate| {\n"
              "            candidate.issue_order(build)\n"
              "        });\n"
              "        assert!(error.to_string().contains(\"field resources\"));\n"
          )
          new_rts = (
              "        let _error = assert_sim_error_preserves_state(&mut sim, |candidate| {\n"
              "            candidate.issue_order(build)\n"
              "        });\n"
          )
          if rts_source.count(old_rts) != 1:
              raise SystemExit("RTS state-preservation assertion drifted")
          rts.write_text(rts_source.replace(old_rts, new_rts, 1), encoding="utf-8")

          moderation = (
              world
              / "trillionnium/crates/trnm-game-server/src/bin/trnm-moderation-console.rs"
          )
          moderation_source = moderation.read_text(encoding="utf-8")
          exact_counts = {
              "use reqwest::blocking::Client;": 1,
              "fn run() -> Result<(), String> {": 1,
              ".send()\n": 10,
              "response.text().map_err": 10,
              "fn main() -> ExitCode {": 1,
              "match run() {": 1,
          }
          for token, expected in exact_counts.items():
              actual = moderation_source.count(token)
              if actual != expected:
                  raise SystemExit(
                      f"moderation async conversion drifted for {token!r}: "
                      f"expected {expected}, observed {actual}"
                  )
          moderation_source = moderation_source.replace(
              "use reqwest::blocking::Client;", "use reqwest::Client;", 1
          )
          moderation_source = moderation_source.replace(
              "fn run() -> Result<(), String> {",
              "async fn run() -> Result<(), String> {",
              1,
          )
          moderation_source, send_count = re.subn(
              r"(?m)^(\s*)\.send\(\)\n",
              lambda match: (
                  f"{match.group(1)}.send()\n{match.group(1)}.await\n"
              ),
              moderation_source,
          )
          if send_count != 10:
              raise SystemExit(
                  f"moderation send conversion expected 10, observed {send_count}"
              )
          moderation_source = moderation_source.replace(
              "response.text().map_err", "response.text().await.map_err"
          )
          moderation_source = moderation_source.replace(
              "fn main() -> ExitCode {",
              "#[tokio::main]\nasync fn main() -> ExitCode {",
              1,
          )
          moderation_source = moderation_source.replace(
              "match run() {", "match run().await {", 1
          )
          if "reqwest::blocking" in moderation_source:
              raise SystemExit("moderation console retained blocking reqwest authority")
          moderation.write_text(moderation_source, encoding="utf-8")
          PYREPAIR

          cp control/tmp/world-plan-v4-v8-patch/qualify-v8.sh /tmp/qualify-v8-fixed.sh
          python3 - <<'PY'
          from pathlib import Path

          script = Path('/tmp/qualify-v8-fixed.sh')
          text = script.read_text(encoding='utf-8')
          needle = 'git -C "$world" apply "$online_patch"\ncargo fmt --manifest-path "$manifest" --all\n'
          repair = (
              'git -C "$world" apply "$online_patch"\n'
              'python3 /tmp/repair-world-v8.py "$world"\n'
              'cargo fmt --manifest-path "$manifest" --all\n'
          )
          if text.count(needle) != 1:
              raise SystemExit('qualification insertion point drifted')
          script.write_text(text.replace(needle, repair, 1), encoding='utf-8')
          PY
          chmod +x /tmp/qualify-v8-fixed.sh
          bash -n /tmp/qualify-v8-fixed.sh

          bash /tmp/qualify-v8-fixed.sh \
            "$GITHUB_WORKSPACE/world" \
            "$GITHUB_WORKSPACE/control" \
            "$GITHUB_WORKSPACE/export"

      - name: Persist exact qualified export
        shell: bash
        env:
          CONTROL_BRANCH: tmp/world-plan-v4-v8-arm-20260831
          WORLD_SOURCE_HEAD: 5605cfb8861aa923f69ff032ddbff7d035bccb0c
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${CONTROL_BRANCH}"
          test -d export
          test -s export/world-v8-core.patch
          test -s export/identity.txt
          grep -Fxq "world_source_head=${WORLD_SOURCE_HEAD}" export/identity.txt

          destination="tmp/world-plan-v4-v8-qualified/${GITHUB_SHA}"
          test ! -e "control/${destination}"
          mkdir -p "control/${destination}"
          cp -a export/. "control/${destination}/"
          cat > "control/${destination}/relay-run.txt" <<EOF
          qualification_commit=${GITHUB_SHA}
          qualification_run_id=${GITHUB_RUN_ID}
          qualification_run_attempt=${GITHUB_RUN_ATTEMPT}
          qualification_job=${GITHUB_JOB}
          world_source_head=${WORLD_SOURCE_HEAD}
          runner_os=${RUNNER_OS}
          runner_arch=${RUNNER_ARCH}
          EOF

          rm -f "control/${destination}/SHA256SUMS"
          (
            cd "control/${destination}"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          git -C control config user.name "github-actions[bot]"
          git -C control config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C control add "${destination}"
          git -C control diff --cached --check
          git -C control commit -m "ci(game): persist qualified World v8 export ${GITHUB_SHA}"
          git -C control remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C control push origin "HEAD:${CONTROL_BRANCH}"
