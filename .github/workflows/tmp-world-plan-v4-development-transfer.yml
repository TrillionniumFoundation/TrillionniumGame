name: tmp-world-plan-v4-development-transfer

on:
  push:
    branches:
      - tmp/world-plan-v4-development-transfer-20260831
    paths:
      - .github/workflows/tmp-world-plan-v4-development-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tmp-world-plan-v4-development-transfer-20260831
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"
  RUST_TOOLCHAIN: "1.98.0"
  WORLD_HEAD: "5605cfb8861aa923f69ff032ddbff7d035bccb0c"
  CAMPAIGN_PATCH_SHA256: "e936d2b440ae4e76ef800b9a007a11bcda683942d1cdd0431ac25de92197a809"
  RTS_PATCH_SHA256: "ef6ffc3b163a0258aa64791059a16c8b386184f7ef7beddfdd4e2511233e9935"

jobs:
  verify-and-export:
    name: verify-and-export
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Fetch immutable control and World trees
        shell: bash
        run: |
          set -euo pipefail
          git init control
          git -C control remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C control fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git -C control checkout --detach FETCH_HEAD
          test "$(git -C control rev-parse HEAD)" = "${GITHUB_SHA}"

          git init world
          git -C world remote add origin https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C world fetch --no-tags --depth=1 origin "${WORLD_HEAD}"
          git -C world checkout --detach FETCH_HEAD
          test "$(git -C world rev-parse HEAD)" = "${WORLD_HEAD}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Reassemble exact v8 changes
        shell: bash
        run: |
          set -euo pipefail
          cat control/tmp/world-plan-v4-v8-patch/campaign.*.patchpart > /tmp/campaign-v8.patch
          cat control/tmp/world-plan-v4-v8-patch/rts.*.patchpart > /tmp/rts-v8.patch
          test "$(sha256sum /tmp/campaign-v8.patch | awk '{print $1}')" = "${CAMPAIGN_PATCH_SHA256}"
          test "$(sha256sum /tmp/rts-v8.patch | awk '{print $1}')" = "${RTS_PATCH_SHA256}"
          git -C world apply --check /tmp/campaign-v8.patch
          git -C world apply --check /tmp/rts-v8.patch

      - name: Materialize direct source and apply state-preservation changes
        shell: bash
        run: |
          set -euo pipefail
          manifest=world/trillionnium/Cargo.toml
          cargo check --manifest-path "$manifest" --locked -p trnm-game-server --lib
          generated="$(find world/trillionnium/target -type f -path '*/out/trnm_game_server_lib_generated.rs' -print | head -n 1)"
          test -n "${generated}"
          test -s "${generated}"
          cp "${generated}" /tmp/trnm_game_server_lib_generated.rs
          python3 - <<'PY'
          from pathlib import Path

          crate = Path("world/trillionnium/crates/trnm-game-server")
          wrapper_path = crate / "src/lib.rs"
          wrapper = wrapper_path.read_text(encoding="utf-8")
          marker = "// The full reviewed server body is generated from src/lib.rs.in by build.rs."
          if wrapper.count(marker) != 1:
              raise SystemExit("reviewed wrapper drifted")
          header = wrapper.split(marker, 1)[0].rstrip()
          generated = Path("/tmp/trnm_game_server_lib_generated.rs").read_text(encoding="utf-8")
          if "trnm_game_server_lib_generated.rs" in generated or "include!(concat!(" in generated:
              raise SystemExit("generated body retained recursive authority")
          wrapper_path.write_text(f"{header}\n\n{generated.lstrip()}", encoding="utf-8")

          cargo_path = crate / "Cargo.toml"
          cargo = cargo_path.read_text(encoding="utf-8")
          build_line = 'build = "build.rs"\n'
          if cargo.count(build_line) != 1:
              raise SystemExit("Cargo build declaration drifted")
          cargo_path.write_text(cargo.replace(build_line, "", 1), encoding="utf-8")

          cex_path = crate / "src/cex.rs"
          cex = cex_path.read_text(encoding="utf-8")
          old = (
              '            let host = url.host_str().unwrap_or_default();\n'
              '            let loopback = host.eq_ignore_ascii_case("localhost")\n'
              '                || host\n'
              '                    .parse::<IpAddr>()\n'
              '                    .is_ok_and(|address| address.is_loopback());\n'
          )
          new = (
              '            let host = url.host_str().unwrap_or_default();\n'
              "            let canonical_host = host.trim_start_matches('[').trim_end_matches(']').trim_end_matches('.');\n"
              '            let loopback = canonical_host.eq_ignore_ascii_case("localhost")\n'
              '                || canonical_host\n'
              '                    .parse::<IpAddr>()\n'
              '                    .is_ok_and(|address| address.is_loopback());\n'
          )
          if cex.count(old) == 1:
              cex_path.write_text(cex.replace(old, new, 1), encoding="utf-8")
          elif new not in cex:
              raise SystemExit("CEX loopback normalization drifted")

          toolchain = Path("world/rust-toolchain.toml")
          text = toolchain.read_text(encoding="utf-8")
          if 'channel = "stable"' in text:
              text = text.replace('channel = "stable"', 'channel = "1.98.0"', 1)
          if 'channel = "1.98.0"' not in text:
              raise SystemExit("Rust toolchain drifted")
          toolchain.write_text(text, encoding="utf-8")

          for obsolete in (crate / "build.rs", crate / "src/lib.rs.in"):
              if not obsolete.is_file():
                  raise SystemExit(f"missing obsolete source: {obsolete}")
              obsolete.unlink()
          PY
          git -C world apply /tmp/campaign-v8.patch
          git -C world apply /tmp/rts-v8.patch
          cargo fmt --manifest-path "$manifest" --all
          cargo fmt --manifest-path "$manifest" --all -- --check
          test ! -e world/trillionnium/crates/trnm-game-server/build.rs
          test ! -e world/trillionnium/crates/trnm-game-server/src/lib.rs.in
          ! grep -q '^build = "build.rs"$' world/trillionnium/crates/trnm-game-server/Cargo.toml
          ! grep -q 'trnm_game_server_lib_generated.rs' world/trillionnium/crates/trnm-game-server/src/lib.rs
          ! grep -q 'settle_pending_matches(&settlement_state' world/trillionnium/crates/trnm-game-server/src/lib.rs
          ! grep -q 'reconcile_economy(&state.cex' world/trillionnium/crates/trnm-game-server/src/lib.rs
          grep -q 'terminal settlement is owned by trnm-settlement-worker' world/trillionnium/crates/trnm-game-server/src/lib.rs
          git -C world diff --check

      - name: Run Campaign and RTS regression suites
        shell: bash
        run: |
          set -euo pipefail
          manifest=world/trillionnium/Cargo.toml
          cargo test --manifest-path "$manifest" --locked -p trnm-campaign-core --lib
          cargo test --manifest-path "$manifest" --locked -p trnm-rts-sim --lib

      - name: Compile and lint the direct-source boundary
        shell: bash
        run: |
          set -euo pipefail
          manifest=world/trillionnium/Cargo.toml
          cargo check --manifest-path "$manifest" --locked -p trnm-game-server --lib --bins
          cargo clippy --manifest-path "$manifest" --locked -p trnm-campaign-core -p trnm-rts-sim --all-targets -- -D warnings
          cargo clippy --manifest-path "$manifest" --locked -p trnm-game-server --lib --bins -- -D warnings

      - name: Seal exact tested source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/world/trillionnium/crates/trnm-game-server/src
          mkdir -p export/world/trillionnium/crates/trnm-campaign-core/src
          mkdir -p export/world/trillionnium/crates/trnm-rts-sim/src
          cp world/rust-toolchain.toml export/world/rust-toolchain.toml
          cp world/trillionnium/crates/trnm-game-server/Cargo.toml export/world/trillionnium/crates/trnm-game-server/Cargo.toml
          cp world/trillionnium/crates/trnm-game-server/src/lib.rs export/world/trillionnium/crates/trnm-game-server/src/lib.rs
          cp world/trillionnium/crates/trnm-game-server/src/cex.rs export/world/trillionnium/crates/trnm-game-server/src/cex.rs
          cp world/trillionnium/crates/trnm-campaign-core/src/lib.rs export/world/trillionnium/crates/trnm-campaign-core/src/lib.rs
          cp world/trillionnium/crates/trnm-rts-sim/src/lib.rs export/world/trillionnium/crates/trnm-rts-sim/src/lib.rs
          git -C world diff --binary > export/world-v8-core.patch
          printf '%s\n' \
            "world_source_head=${WORLD_HEAD}" \
            "qualification_head=${GITHUB_SHA}" \
            "rust_toolchain=${RUST_TOOLCHAIN}" \
            "campaign_patch_sha256=${CAMPAIGN_PATCH_SHA256}" \
            "rts_patch_sha256=${RTS_PATCH_SHA256}" \
            > export/identity.txt
          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/SHA256SUMS

      - name: Upload exact tested source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trnm-world-plan-v4-v8-core-${{ github.sha }}
          path: export/**
          if-no-files-found: error
          retention-days: 7
