name: tmp-fix-conformance-wave12

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-fix-conformance-wave12.yml

permissions:
  contents: write
  pull-requests: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  FEATURE_BRANCH: feature/plan-v32-conformance-core-20260909
  GH_TOKEN: ${{ github.token }}

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Wait for exact conformance branch
        shell: bash
        run: |
          set -euo pipefail
          head_sha=''
          for _ in $(seq 1 960); do
            head_sha="$(gh api "repos/${REPOSITORY}/branches/${FEATURE_BRANCH}" --jq '.commit.sha' 2>/dev/null || true)"
            test -n "$head_sha" && break
            sleep 20
          done
          test -n "$head_sha"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$head_sha"
          git -C "$GITHUB_WORKSPACE" checkout -B "$FEATURE_BRANCH" "$head_sha"

      - name: Apply exact-subject and symmetric-normalizer admission
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-conformance-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')

          old_case = '''    pub input_digest: Digest32,
    pub fixture_digest: Digest32,
    pub environment_digest: Digest32,
    pub leaf_ids: BTreeSet<LeafId>,
'''
          new_case = '''    pub input_digest: Digest32,
    pub fixture_digest: Digest32,
    pub environment_digest: Digest32,
    pub immutable_oracle: SourceIdentity,
    pub instrumented_oracle: Option<SourceIdentity>,
    pub candidate: SourceIdentity,
    pub leaf_ids: BTreeSet<LeafId>,
'''
          if old_case in text:
              text = text.replace(old_case, new_case, 1)
          elif new_case not in text:
              raise SystemExit('ConformanceCase identity fields anchor missing')

          old_assertion = '''        || self.executed > self.collected
        || accounted != self.executed
'''
          new_assertion = '''        || self.executed != self.collected
        || accounted != self.executed
'''
          if old_assertion in text:
              text = text.replace(old_assertion, new_assertion, 1)
          elif new_assertion not in text:
              raise SystemExit('assertion accounting anchor missing')

          normalizer_loop = '''        for normalizer in &observation.applied_normalizers {
            if !self.normalizers.contains_key(normalizer) {
                return Err(ConformanceError::new(
                    StableConformanceCode::FailedPrecondition,
                    "observation_normalizer_missing",
                    false,
                ));
            }
        }
'''
          subject_check = normalizer_loop + '''        let expected_subject = match observation.side {
            SubjectSide::ImmutableOracle => Some(&case.immutable_oracle),
            SubjectSide::InstrumentedOracle => case.instrumented_oracle.as_ref(),
            SubjectSide::Candidate => Some(&case.candidate),
        }
        .ok_or_else(|| ConformanceError::new(
            StableConformanceCode::FailedPrecondition,
            "observation_side_not_configured",
            false,
        ))?;
        if &observation.subject != expected_subject {
            return Err(ConformanceError::new(
                StableConformanceCode::Aborted,
                "observation_subject_identity_mismatch",
                false,
            ));
        }
'''
          if 'observation_subject_identity_mismatch' not in text:
              if normalizer_loop not in text:
                  raise SystemExit('normalizer admission anchor missing')
              text = text.replace(normalizer_loop, subject_check, 1)

          old_equal = '''            let equal = oracle.normalized_wire_digest == candidate.normalized_wire_digest
                && oracle.durable_state_digest == candidate.durable_state_digest
                && oracle.effect_digest == candidate.effect_digest
                && oracle.public_error_digest == candidate.public_error_digest;
'''
          new_equal = '''            let equal = oracle.normalized_wire_digest == candidate.normalized_wire_digest
                && oracle.durable_state_digest == candidate.durable_state_digest
                && oracle.effect_digest == candidate.effect_digest
                && oracle.public_error_digest == candidate.public_error_digest
                && oracle.applied_normalizers == candidate.applied_normalizers;
'''
          if old_equal in text:
              text = text.replace(old_equal, new_equal, 1)
          elif new_equal not in text:
              raise SystemExit('case equality anchor missing')

          old_constructor = '''                input_digest:digest(40), fixture_digest:digest(41), environment_digest:digest(42), leaf_ids:BTreeSet::from([leaf]), required_consumers:BTreeSet::from([consumer])'''
          new_constructor = '''                input_digest:digest(40), fixture_digest:digest(41), environment_digest:digest(42), immutable_oracle:source(50), instrumented_oracle:None, candidate:source(50), leaf_ids:BTreeSet::from([leaf]), required_consumers:BTreeSet::from([consumer])'''
          if old_constructor in text:
              text = text.replace(old_constructor, new_constructor, 1)
          elif new_constructor not in text:
              raise SystemExit('test case constructor anchor missing')

          test_anchor = '''    #[test]
    fn unknown_normalizer_and_wrong_consumer_fail_before_insert() {'''
          if 'fn wrong_subject_and_asymmetric_normalizers_block_equivalence()' not in text:
              addition = '''    #[test]
    fn wrong_subject_and_asymmetric_normalizers_block_equivalence() {
        let (mut registry, _, _, case, consumer) = registry();
        let mut wrong_subject = observation(
            1,
            case,
            consumer,
            SubjectSide::Candidate,
            1,
            70,
        );
        wrong_subject.subject = source(51);
        assert_eq!(
            registry.record_observation(wrong_subject).unwrap_err().reason(),
            "observation_subject_identity_mismatch"
        );

        let normalizer = NormalizerRule {
            id: id(9, NormalizerId::new),
            field_path: "$.elapsed_ms".to_owned(),
            class: ContractClass::NonContractualTiming,
            implementation_digest: digest(9),
        };
        registry.register_normalizer(normalizer.clone()).unwrap();
        let mut oracle = observation(
            2,
            case,
            consumer,
            SubjectSide::ImmutableOracle,
            1,
            70,
        );
        oracle.applied_normalizers.insert(normalizer.id);
        registry.record_observation(oracle).unwrap();
        registry
            .record_observation(observation(
                3,
                case,
                consumer,
                SubjectSide::Candidate,
                1,
                70,
            ))
            .unwrap();
        assert_eq!(
            registry.case_result(case, consumer).unwrap().status,
            CaseStatus::Diverged
        );
    }

'''
              if test_anchor not in text:
                  raise SystemExit('conformance test anchor missing')
              text = text.replace(test_anchor, addition + test_anchor, 1)

          assertion_anchor = '''    #[test]
    fn skipped_or_empty_assertions_never_enter_registry() {'''
          if 'fn partially_executed_assertion_collection_is_rejected()' not in text:
              addition = '''    #[test]
    fn partially_executed_assertion_collection_is_rejected() {
        let (mut registry, _, _, case, consumer) = registry();
        let mut partial = observation(
            1,
            case,
            consumer,
            SubjectSide::Candidate,
            1,
            1,
        );
        partial.assertions = AssertionCounts {
            collected: 2,
            executed: 1,
            passed: 1,
            failed: 0,
            skipped: 0,
        };
        assert_eq!(
            registry.record_observation(partial).unwrap_err().reason(),
            "assertion_counts_not_fully_passing"
        );
    }

'''
              if assertion_anchor not in text:
                  raise SystemExit('assertion test anchor missing')
              text = text.replace(assertion_anchor, addition + assertion_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Qualify and publish conformance repair
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fmt --all
          cargo test --package trnm-conformance-core --all-targets --locked
          cargo clippy --package trnm-conformance-core --all-targets --locked -- -D warnings
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/trnm-conformance-core/src/lib.rs
          git commit -m 'fix(compatibility): bind observations to exact subjects and normalizers'
          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          pr="$(gh pr list --repo "$REPOSITORY" --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          test -z "$pr" || gh pr comment "$pr" --repo "$REPOSITORY" --body \
            "Bound every observation to the registered exact oracle/candidate subject, required symmetric normalizer sets, and rejected partially executed assertion collections. Focused tests and strict Clippy passed in carrier run `${GITHUB_RUN_ID}`; exact-head checks must requalify the new source."
