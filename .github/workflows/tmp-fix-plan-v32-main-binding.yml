name: tmp-fix-plan-v32-main-binding

on:
  push:
    branches:
      - integration/plan-v32-final-2026-09-09
    paths:
      - .github/workflows/tmp-fix-plan-v32-main-binding.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tmp-fix-plan-v32-main-binding
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BRANCH: integration/plan-v32-final-2026-09-09
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact candidate and explicit main ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TrillionniumFoundation/TrillionniumGame'
          test "$GITHUB_REF_NAME" = "$BRANCH"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin main:refs/remotes/origin/main
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          echo "MAIN_COMMIT=$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/main)" >> "$GITHUB_ENV"
          echo "MAIN_TREE=$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/main^{tree})" >> "$GITHUB_ENV"
      - name: Locate the branch pull request
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if test -z "$number"; then
            number="$(gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$BRANCH" \
              --title 'Plan v3.2: converge canonical server and architecture truth' \
              --body 'Bootstrap body; the exact-object statement will be written after the verified commit.' \
              | sed -E 's#.*/([0-9]+)$#\1#')"
          fi
          test "$number" -gt 0
          echo "PR_NUMBER=$number" >> "$GITHUB_ENV"
      - name: Apply idempotent truth patch and exact base binding
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path

          root = Path('.')
          branch = os.environ['BRANCH']
          main_commit = os.environ['MAIN_COMMIT']
          main_tree = os.environ['MAIN_TREE']
          pr_number = int(os.environ['PR_NUMBER'])

          def replace_if_needed(path: str, old: str, new: str) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: authority wording is neither expected old nor expected new text')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          def save(path: str, value: object) -> None:
              (root / path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          replace_if_needed(
              'CURRENT_PLAN.md',
              '当前 canonical database-backed server 仍位于 `crates/trnm-persistence-pg`；`crates/trnm-server` 是受限 foundation executable。最终必须收敛到一个生产 composition root，并把 persistence、protocol、service 和 process lifecycle 分层。现有局部成功不能推导完整 Nakama parity。',
              '`crates/trnm-server` 是当前唯一默认第一方 `trnm-server` composition-root source candidate；`crates/trnm-persistence-pg/src/bin/trnm-server.rs` 仅在 `diagnostic-compat-server` feature 下构建为 `trnm-pg-compat-server`，是诊断兼容 harness，不是第二个生产权威。源码权威收敛不等于完整 Nakama parity、运行证据或生产批准。',
          )
          replace_if_needed(
              'README.md',
              'It now also contains a bounded first-party Rust HTTP/WebSocket/database vertical-slice candidate under `crates/trnm-persistence-pg`; that slice is an integration seam, not a complete Nakama server or a production topology.',
              'It now also contains one default first-party Rust composition-root candidate under `crates/trnm-server`, backed by the PostgreSQL/CockroachDB adapter in `crates/trnm-persistence-pg`; the feature-gated `trnm-pg-compat-server` target is a diagnostic compatibility harness, not a second production authority. This remains an integration seam, not a complete Nakama server or a production topology.',
          )
          replace_if_needed(
              'crates/trnm-server/README.md',
              '`crates/trnm-server` contains a candidate composition root assembled from the repository\'s reviewed persistence, session/JWT, gRPC, and realtime-wire components.\nIts non-authoritative package-local binary is named `trnm-server`.\nThe currently admitted canonical process remains `crates/trnm-persistence-pg/src/bin/trnm-server.rs` until a separate atomic authority-transfer change removes that duplicate entry point, updates every consumer, and receives exact-object review.\nThis source candidate does not by itself establish compatibility, durability, release, deployment, or production authority.',
