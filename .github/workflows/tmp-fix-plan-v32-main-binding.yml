              pg_readme.write_text(pg_text.replace(anchor, block + anchor, 1), encoding='utf-8')

          modules = json.loads((root / 'docs/status/MODULE_DOCUMENTATION.json').read_text(encoding='utf-8'))
          module_rows = {row['id']: row for row in modules['modules']}
          module_rows['trnm-server'].update(
              lifecycle='server-composition-root',
              maturity='canonical-composition-authority-source-candidate',
              authority='unique default first-party trnm-server composition authority source candidate',
          )
          module_rows['trnm-persistence-pg'].update(
              lifecycle='product-adapter-and-diagnostic-compatibility-harness',
              authority='authoritative PostgreSQL/CockroachDB adapter and feature-gated diagnostic compatibility harness',
          )
          save('docs/status/MODULE_DOCUMENTATION.json', modules)

          inventory = json.loads((root / 'docs/status/IMPLEMENTATION_INVENTORY.json').read_text(encoding='utf-8'))
          components = {row['id']: row for row in inventory['components']}
          pg = components['COMP-PERSISTENCE-PG']
          pg['kind'] = 'rust-persistence-adapter-and-feature-gated-diagnostic-harness'
          pg['status'] = 'authority-storage-database-adapter-source-candidate'
          pg['implemented'] = [
              'feature-gated trnm-pg-compat-server diagnostic check-config/migrate/serve harness'
              if item == 'trnm-server check-config/migrate/serve binary' else item
              for item in pg.get('implemented', [])
          ]
          server = components['COMP-TRNM-SERVER']
          server.update(
              path='crates/trnm-server',
              kind='canonical-first-party-rust-server-composition-source-candidate',
              status='http-grpc-websocket-session-database-source-candidate',
          )
          server['implemented'] = [
              'unique default first-party trnm-server composition root',
              'typed and redacted configuration with check-config/migrate/serve lifecycle',
              'bounded HTTP framing and stable public errors',
              'generated Nakama Healthcheck gRPC source',
              'bounded WebSocket JSON and protobuf envelope paths',
              'access-token and session-family source integration',
              'PostgreSQL/CockroachDB repository composition',
              'acknowledgement only after commit or exact receipt replay',
              'bounded connection admission drain retry and cancellation controls',
              'health readiness and low-cardinality metrics source paths',
          ]
          server['missing'] = [
              'complete Nakama HTTP gRPC and grpc-gateway surface',
              'complete RTAPI and distributed realtime lifecycle',
              'complete account social leaderboard tournament matchmaker and multiplayer domains',
              'complete Runtime Console provider and IAP surfaces',
              'production KMS/HSM HA PITR capacity and endurance evidence',
              'official SDK and immutable-oracle differential acceptance',
          ]
          save('docs/status/IMPLEMENTATION_INVENTORY.json', inventory)

          state = json.loads((root / 'docs/status/CURRENT_STATE.json').read_text(encoding='utf-8'))
          state['observed_at'] = '2026-09-09T05:15:00Z'
          authority = state['authority']
          authority['audited_main_commit'] = main_commit
          authority['audited_main_tree'] = main_tree
          authority['singular_main_target_pull_request'] = pr_number
          authority['candidate_branch'] = branch
          authority['candidate_commit'] = None
          authority['candidate_tree'] = None
          governance = state['repository_governance']
          governance['main_protected'] = True
          governance['required_checks_configured'] = True
          governance['required_aggregate_context'] = 'trillionnium-game-merge-gate'
          governance['status'] = 'source baseline admitted; complete administrative read-back and independent acceptance remain open'
          runtime = state['runtime_topology']
          runtime['rust_server_binary_present'] = True
          runtime['rust_server_binary_authority'] = 'crates/trnm-server/Cargo.toml::trnm-server'
          runtime['rust_server_stage'] = 'http-grpc-websocket-session-database-source-candidate'
          runtime['status'] = 'One default Rust composition authority exists; complete compatibility and production evidence remain open.'
          state['active_priority'] = [
              'qualify the main-rebound Plan v3.2 source and truth-convergence candidate',
              'obtain conflict-free specialist review and complete administration-scoped governance read-back',
              'independently accept retained exact-object evidence and a post-merge main packet',
              'classify and independently lock all D0-D8 denominator leaves and global SG1',
              'implement the complete API RTAPI Runtime Console provider IAP and product-domain surface',
              'complete KMS/HSM HA PITR capacity endurance migration canary cutover and retirement evidence',
          ]
          save('docs/status/CURRENT_STATE.json', state)

          active = json.loads((root / 'docs/governance/ACTIVE_BRANCHES.json').read_text(encoding='utf-8'))
          active['generated_at'] = '2026-09-09T05:15:00Z'
          active['active_branches'] = [
              {'name': 'main', 'role': 'protected-integration-authority', 'pull_request': None},
              {'name': branch, 'role': 'plan-v3.2-main-rebound-truth-convergence-candidate', 'pull_request': pr_number},
          ]
          active['claims'].update(
              active_line_declared=True,
              branch_cleanup_reviewed=False,
              branch_cleanup_executed=False,
              cleanup_complete=False,
              sg0_complete=False,
          )
          save('docs/governance/ACTIVE_BRANCHES.json', active)

          checker_path = root / 'scripts/check-single-server-authority.py'
          checker = checker_path.read_text(encoding='utf-8')
          if 'default server authority is not unique' not in checker or 'stale authority claim remains' not in checker:
              checker = '''#!/usr/bin/env python3
"""Enforce one default server composition authority across source and documentation."""
from __future__ import annotations
import argparse
import json
import tomllib
from pathlib import Path

class ValidationError(RuntimeError):
    pass

def require(condition: bool, message: str) -> None:
    if not condition:
        raise ValidationError(message)

def load_toml(path: Path) -> dict:
    with path.open("rb") as handle:
        value = tomllib.load(handle)
    require(isinstance(value, dict), f"{path}: TOML root must be a table")
    return value

def load_json(path: Path) -> dict:
    value = json.loads(path.read_text(encoding="utf-8"))
    require(isinstance(value, dict), f"{path}: JSON root must be an object")
    return value

def validate(root: Path, expected_main_commit: str | None = None, expected_main_tree: str | None = None) -> dict[str, str]:
    root = root.resolve()
    members = load_toml(root / "Cargo.toml").get("workspace", {}).get("members", [])
    require("crates/trnm-server" in members, "canonical server is not a root workspace member")
    require("crates/trnm-persistence-pg" in members, "persistence adapter is not a root workspace member")
    server = load_toml(root / "crates/trnm-server/Cargo.toml")
    require(server.get("bin") == [{"name": "trnm-server", "path": "src/main.rs"}], "canonical target contract changed")
    pg = load_toml(root / "crates/trnm-persistence-pg/Cargo.toml")
    require(pg.get("package", {}).get("autobins") is False, "persistence autobins must be disabled")
    require("diagnostic-compat-server" in pg.get("features", {}), "diagnostic feature is missing")
    diagnostic = [row for row in pg.get("bin", []) if row.get("name") == "trnm-pg-compat-server"]
    require(len(diagnostic) == 1, "exactly one diagnostic compatibility target is required")
    require(diagnostic[0].get("path") == "src/bin/trnm-server.rs", "diagnostic source path changed")
    require(diagnostic[0].get("required-features") == ["diagnostic-compat-server"], "diagnostic target is not feature gated")
    owners = []
    for manifest in sorted((root / "crates").glob("*/Cargo.toml")):
        for row in load_toml(manifest).get("bin", []):
            if row.get("name") == "trnm-server":
                owners.append(manifest.relative_to(root).as_posix())
    require(owners == ["crates/trnm-server/Cargo.toml"], f"default server authority is not unique: {owners}")
    expected = {
        "README.md": ("crates/trnm-server", "trnm-pg-compat-server", "not a second production authority"),
        "CURRENT_PLAN.md": ("唯一默认第一方 `trnm-server`", "trnm-pg-compat-server", "不是第二个生产权威"),
        "docs/ARCHITECTURE.md": ("only package allowed to publish the default `trnm-server`", "trnm-pg-compat-server"),
        "docs/DEVELOPMENT.md": ("only default server binary", "trnm-pg-compat-server"),
        "crates/trnm-server/README.md": ("unique default first-party `trnm-server`", "not a second default process"),
        "crates/trnm-persistence-pg/README.md": ("only default first-party server composition authority", "trnm-pg-compat-server"),
    }
    for relative, fragments in expected.items():
        text = (root / relative).read_text(encoding="utf-8")
        for fragment in fragments:
            require(fragment in text, f"{relative}: missing authority fragment: {fragment}")
    forbidden = {
        "CURRENT_PLAN.md": ("canonical database-backed server 仍位于 `crates/trnm-persistence-pg`",),
        "crates/trnm-server/README.md": (
            "non-authoritative package-local binary",
            "currently admitted canonical process remains `crates/trnm-persistence-pg",
            "persistence-owned canonical `trnm-server` entry point still exists",
        ),
    }
    for relative, fragments in forbidden.items():
        text = (root / relative).read_text(encoding="utf-8")
        for fragment in fragments:
            require(fragment not in text, f"{relative}: stale authority claim remains: {fragment}")
    modules = {row["id"]: row for row in load_json(root / "docs/status/MODULE_DOCUMENTATION.json")["modules"]}
    require("unique default first-party" in modules["trnm-server"]["authority"], "module registry demotes canonical server")
    require("diagnostic compatibility harness" in modules["trnm-persistence-pg"]["authority"], "module registry promotes diagnostic server")
    components = {row["id"]: row for row in load_json(root / "docs/status/IMPLEMENTATION_INVENTORY.json")["components"]}
    require(components["COMP-TRNM-SERVER"]["path"] == "crates/trnm-server", "inventory points at wrong server")
    require("canonical" in components["COMP-TRNM-SERVER"]["kind"], "inventory lacks canonical authority")
    require("diagnostic" in components["COMP-PERSISTENCE-PG"]["kind"], "persistence inventory lacks diagnostic boundary")
    state = load_json(root / "docs/status/CURRENT_STATE.json")
    require(state["runtime_topology"]["rust_server_binary_authority"] == "crates/trnm-server/Cargo.toml::trnm-server", "state points at wrong server")
    if expected_main_commit is not None:
        require(state["authority"]["audited_main_commit"] == expected_main_commit, "audited main commit is stale")
    if expected_main_tree is not None:
        require(state["authority"]["audited_main_tree"] == expected_main_tree, "audited main tree is stale")
    return {"canonical_manifest": owners[0], "diagnostic_target": "trnm-pg-compat-server"}

def main() -> int:
    parser = argparse.ArgumentParser()
    parser.add_argument("--root", type=Path, default=Path(__file__).resolve().parents[1])
    parser.add_argument("--expected-main-commit")
    parser.add_argument("--expected-main-tree")
    args = parser.parse_args()
    result = validate(args.root, args.expected_main_commit, args.expected_main_tree)
    print(f"single server authority valid: canonical={result['canonical_manifest']} diagnostic={result['diagnostic_target']}")
    return 0

if __name__ == "__main__":
    try:
        raise SystemExit(main())
    except ValidationError as error:
        print(f"single server authority invalid: {error}")
        raise SystemExit(1) from error
'''
