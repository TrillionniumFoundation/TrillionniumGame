          )
          replace_if_needed(
              'crates/trnm-server/README.md',
              'The persistence-owned canonical `trnm-server` entry point still exists, so this PR is an extraction/convergence candidate rather than an authority transfer.\nA later atomic change must leave exactly one first-party process entry point and must update package authority, workflow coverage, contracts, deployment references, and retained evidence together.',
              'The persistence-owned source file remains only as the explicitly feature-gated `trnm-pg-compat-server` diagnostic target. Any later removal or convergence of that harness must update package authority, workflow coverage, contracts, deployment references and retained evidence together without introducing a second default `trnm-server`.',
          )

          pg_readme = root / 'crates/trnm-persistence-pg/README.md'
          pg_text = pg_readme.read_text(encoding='utf-8')
          marker = 'The only default first-party server composition authority is `crates/trnm-server`.'
          if marker not in pg_text:
              anchor = '## Known gaps and exit criteria'
              if anchor not in pg_text:
                  raise SystemExit('persistence README lacks Known gaps section')
              block = (
                  '## Composition authority\n\n'
                  + marker
                  + ' This package owns database adapters and the feature-gated '
                    '`trnm-pg-compat-server` diagnostic compatibility harness; it does not own a second production process.\n\n'
