import importlib.util
import shutil
import tempfile
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]
CHECKER = ROOT / "scripts/check-single-server-authority.py"

def load_checker():
    spec = importlib.util.spec_from_file_location("single_server_authority", CHECKER)
    assert spec is not None and spec.loader is not None
    module = importlib.util.module_from_spec(spec)
    spec.loader.exec_module(module)
    return module

class SingleServerAuthorityTests(unittest.TestCase):
    def test_repository_truth_is_consistent(self) -> None:
        result = load_checker().validate(ROOT)
        self.assertEqual(result["canonical_manifest"], "crates/trnm-server/Cargo.toml")

    def fixture(self) -> tuple[tempfile.TemporaryDirectory, Path]:
        context = tempfile.TemporaryDirectory()
        target = Path(context.name) / "repo"
        shutil.copytree(ROOT, target, ignore=shutil.ignore_patterns(".git", "target", "__pycache__"))
        return context, target

    def test_stale_document_claim_is_rejected(self) -> None:
        module = load_checker()
        context, target = self.fixture()
        with context:
            plan = target / "CURRENT_PLAN.md"
            plan.write_text(plan.read_text(encoding="utf-8") + "\n当前 canonical database-backed server 仍位于 `crates/trnm-persistence-pg`\n", encoding="utf-8")
            with self.assertRaises(module.ValidationError):
                module.validate(target)

    def test_second_default_binary_is_rejected(self) -> None:
        module = load_checker()
        context, target = self.fixture()
        with context:
            manifest = target / "crates/trnm-persistence-pg/Cargo.toml"
            manifest.write_text(manifest.read_text(encoding="utf-8") + '\n[[bin]]\nname = "trnm-server"\npath = "src/bin/trnm-server.rs"\n', encoding="utf-8")
            with self.assertRaises(module.ValidationError):
                module.validate(target)

if __name__ == "__main__":
    unittest.main()
'''
