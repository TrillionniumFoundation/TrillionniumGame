name: native-rustfmt-repair

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29
    paths:
      - '.github/workflows/native-rustfmt-repair.yml'

permissions:
  contents: write

concurrency:
  group: native-rustfmt-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-current-feature-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'feat/plan-v3-gap-closure-2026-08-29'
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "refs/heads/${GITHUB_REF_NAME}"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Align current server status validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-status-transitions.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'require(server.get("status") == "source-candidate", "server inventory stage")':
                  'require(\n        server.get("status") == "http-websocket-source-candidate",\n        "server inventory stage",\n    )',
              'document.get("stage") == "http-database-vertical-source-candidate"':
                  'document.get("stage") == "http-websocket-database-vertical-source-candidate"',
              '"websocket_implemented",':
                  '"websocket_wire_compatible",\n        "websocket_protobuf_implemented",',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, got {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/check-status-transitions.py
      - name: Apply exact Rust formatting
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Commit and push only the generated repairs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-status-transitions.py crates
          git diff --cached --check
          git commit -m 'style(rust): apply 1.85.1 formatting and align server status'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
