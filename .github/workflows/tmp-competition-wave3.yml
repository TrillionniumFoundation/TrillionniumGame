      - name: Publish Draft candidate before qualification
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo generate-lockfile
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$FEATURE_BRANCH"
          git add Cargo.toml Cargo.lock crates docs tests scripts .github/CODEOWNERS
          git commit -m 'feat(competition): add deterministic leaderboard and scheduler core'
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse HEAD^{tree})"
          printf 'head_sha=%s\nhead_tree=%s\n' "$head_sha" "$head_tree" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          cat > "$RUNNER_TEMP/pr.md" <<EOF
          ## Scope

