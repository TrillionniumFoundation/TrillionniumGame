name: exact-sha-fetch-autofix

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29
    paths:
      - '.github/workflows/exact-sha-fetch-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exact-sha-fetch-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: feat/plan-v3-gap-closure-2026-08-29
      EXPECTED_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact feature head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "$EXPECTED_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          cd "$GITHUB_WORKSPACE"
      - name: Replace movable branch fetches with immutable candidate SHA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          changed = []
          for path in sorted(root.glob('*.y*ml')):
              if path.name == 'exact-sha-fetch-autofix.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('"refs/heads/${CANDIDATE_REF}"', '"${CANDIDATE_SHA}"')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())
          if not changed:
              raise SystemExit('no movable candidate branch fetches were found')
          print('\n'.join(changed))
          PY
      - name: Verify immutable fetch migration
        run: |
          set -euo pipefail
          if grep -R -nF 'refs/heads/${CANDIDATE_REF}' .github/workflows \
              --include='*.yml' --include='*.yaml' \
              --exclude='exact-sha-fetch-autofix.yml'; then
            echo 'movable candidate branch fetch remains' >&2
            exit 1
          fi
          grep -R -lF '"${CANDIDATE_SHA}"' .github/workflows \
            --include='*.yml' --include='*.yaml' \
            --exclude='exact-sha-fetch-autofix.yml' \
            | sort
          git diff --check
      - name: Commit verified mechanical migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'fix(ci): fetch immutable candidate SHA for reproducible reruns'
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${BRANCH}"
