name: world-command-deployed-runtime-v1

on:
  workflow_dispatch:
    inputs:
      world_publication_request_id:
        description: Exact checked-in World publication request identifier
        required: false
        type: string
      approved_main_sha:
        description: Exact protected-main commit approved for World publication
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - feature/game-world-command-deployed-runtime-v1
    paths:
      - 'runtime/internal/core/world_command.go'
      - 'runtime/internal/worldcommand/**'
      - 'runtime/world_command_*.go'
      - 'runtime/cmd/trnm-world-transition-fixture/**'
      - 'runtime/cmd/trnm-response-drop-proxy/**'
      - 'runtime/cmd/trnm-tls-fixture/**'
      - 'runtime/Dockerfile.faultlab'
      - 'runtime/main.go'
      - 'contracts/world-command-deployed-runtime-v1-status.json'
      - 'contracts/world-command-rpc-v1/**'
      - 'deploy/world-command-fault-lab/**'
      - 'docs/ARCHITECTURE.md'
      - 'docs/OPERATIONS_AND_RELEASE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'scripts/blackbox/world-command-fault.mjs'
      - 'scripts/check-world-command-deployed-runtime-v1.sh'
      - 'scripts/test-world-command-deployed-runtime-v1-negative.sh'
      - 'scripts/check-world-command-faultlab-postgres-binding.sh'
      - 'scripts/test-world-command-faultlab-postgres-binding-negative.sh'
      - 'scripts/check-world-command-prebuilt-fixture.sh'
      - 'scripts/check-world-command-deployed-runtime-v1-local.sh'
      - 'scripts/run-world-command-deployed-fault-lab.sh'
      - 'scripts/run-world-command-deployed-fault-lab-v2.sh'
      - 'scripts/run-world-command-deployed-fault-lab-v3.sh'
      - 'scripts/verify-world-command-storage-atomicity.py'
      - '.github/workflows/world-command-deployed-runtime-v1.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: world-command-deployed-runtime-v1-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: auto
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
          cd "$GITHUB_WORKSPACE"
          go version
          node --version
          docker version
      - name: Validate shell, Python and JavaScript entrypoints
        run: |
          set -euo pipefail
          bash -n scripts/check-world-command-deployed-runtime-v1.sh
          bash -n scripts/test-world-command-deployed-runtime-v1-negative.sh
          bash -n scripts/check-world-command-faultlab-postgres-binding.sh
          bash -n scripts/test-world-command-faultlab-postgres-binding-negative.sh
          bash -n scripts/check-world-command-prebuilt-fixture.sh
          bash -n scripts/check-world-command-deployed-runtime-v1-local.sh
          bash -n scripts/run-world-command-deployed-fault-lab.sh
          bash -n scripts/run-world-command-deployed-fault-lab-v2.sh
          bash -n scripts/run-world-command-deployed-fault-lab-v3.sh
          python3 -m py_compile scripts/verify-world-command-storage-atomicity.py
          node --check scripts/blackbox/world-command-fault.mjs
      - name: Verify deployed-runtime authority and storage boundary
        run: bash scripts/check-world-command-deployed-runtime-v1.sh
      - name: Verify canonical fault-lab bindings
        run: |
          set -euo pipefail
          bash scripts/check-world-command-faultlab-postgres-binding.sh
          bash scripts/test-world-command-faultlab-postgres-binding-negative.sh
          bash scripts/check-world-command-prebuilt-fixture.sh
      - name: Prove malicious deployed-runtime fixtures fail closed
        run: bash scripts/test-world-command-deployed-runtime-v1-negative.sh
      - name: Verify Go formatting, tests, race and vet
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l runtime)
          test -z "$unformatted" || {
            printf 'unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          }
          (cd runtime && go test ./... -count=1)
          (cd runtime && go test -race ./internal/worldcommand ./internal/worldtransition -count=1)
          (cd runtime && go vet ./...)
      - name: Build exact plugin and fault-lab binaries
        working-directory: runtime
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go build -trimpath -buildmode=plugin -o /tmp/backend.so .
          CGO_ENABLED=0 go build -trimpath -o /tmp/trnm-world-transition-fixture ./cmd/trnm-world-transition-fixture
          CGO_ENABLED=0 go build -trimpath -o /tmp/trnm-response-drop-proxy ./cmd/trnm-response-drop-proxy
          CGO_ENABLED=0 go build -trimpath -o /tmp/trnm-tls-fixture ./cmd/trnm-tls-fixture
          sha256sum /tmp/backend.so /tmp/trnm-world-transition-fixture \
            /tmp/trnm-response-drop-proxy /tmp/trnm-tls-fixture
      - name: Validate Compose overlay shape
        run: |
          set -euo pipefail
          test -f deploy/world-command-fault-lab/compose.yaml
          grep -q '^  postgres:' compose.yaml
          grep -q '^  nakama:' compose.yaml
          grep -q '^  world-fixture:' deploy/world-command-fault-lab/compose.yaml
          grep -q '^  response-drop-proxy:' deploy/world-command-fault-lab/compose.yaml

  isolated-deployed-fault-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    needs: source-contract
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
          cd "$GITHUB_WORKSPACE"
          go version
          docker version
      - name: Execute isolated PostgreSQL, Game and World HTTPS fault lab
        env:
          TRNM_WORLD_COMMAND_EVIDENCE_DIR: ${{ github.workspace }}/run/world-command-deployed-runtime-v1
        run: timeout 40m bash scripts/run-world-command-deployed-fault-lab-v2.sh
      - name: Validate exact-head evidence posture
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          jq -e '
            .contract_version == "trnm_game_world_command_deployed_fault_report_v1" and
            .repository == "TrillionniumFoundation/TrillionniumGame" and
            .repository_id == 1323087470 and
            .commit == env.EXPECTED_COMMIT and
            .environment == "isolated_single_host_postgresql_nakama_https_world_fixture" and
            .scenario_count == 5 and
            .all_passed == true and
            .authority.cutover_authorized == false and
            .authority.closed_online_promoted == false and
            .authority.public_online_enabled == false and
            .authority.public_player_market_enabled == false and
            (.limitations | length >= 5)
          ' run/world-command-deployed-runtime-v1/report.json >/dev/null
          test "$(find run/world-command-deployed-runtime-v1/scenarios -name atomicity.json | wc -l)" -eq 5
          find run/world-command-deployed-runtime-v1/scenarios -name atomicity.json -print0 \
            | xargs -0 -n1 jq -e '.atomicity_verified == true and .cutover_authorized == false and .public_online_enabled == false' >/dev/null
          sha256sum --check run/world-command-deployed-runtime-v1/SHA256SUMS
      - name: Seal exact deployed fault evidence in immutable job log
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/world-command-deployed-runtime-v1-${CANDIDATE_SHA}.tar.gz \
            -C run/world-command-deployed-runtime-v1 .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/world-command-deployed-runtime-v1-${CANDIDATE_SHA}.tar.gz
          cat run/world-command-deployed-runtime-v1/report.json
          cat run/world-command-deployed-runtime-v1/SHA256SUMS

  verify-world-publication-request:
    if: >-
      github.repository == 'TrillionniumFoundation/TrillionniumGame' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      inputs.world_publication_request_id == 'world-v13k-2026-09-08' &&
      inputs.approved_main_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REQUEST_PATH: .github/world-publication-requests/world-v13k-2026-09-08.json
      REQUEST_SHA256: a7222f31e7ec27e33f4f1d414525236ac21d2187404e78fe8098ad11b15867ae
      REQUEST_ID: world-v13k-2026-09-08
      WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
      WORLD_BRANCH: fix/world-plan-v4-development-closure-20260831
      WORLD_EXPECTED_HEAD: 010370c540a3a17e871b4b5349fc01ffe9502553
      IMPORTER_COMMIT: d8ab3164cbd573e642d98fbfb626fe551574c7e5
      IMPORTER_BLOB_SHA1: 5c21773242423b083f87ee0924474754646065d0
      QUALIFICATION_ARTIFACT_ID: "9780499701"
      QUALIFICATION_ARTIFACT_SHA256: 456a181bdc8f8aa248229b044db9eec4f52572ea3b20bca6492907db58d64ef5
      QUALIFIED_TREE: 5e613185f5a2abda42df371f3755e73667717309
    steps:
      - name: Fetch exact protected-main source without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum "$GITHUB_WORKSPACE/$REQUEST_PATH" | awk '{print $1}')" = \
            "$REQUEST_SHA256"

      - name: Validate immutable request and reviewed importer
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          request = json.loads(Path(os.environ["REQUEST_PATH"]).read_text())
          assert request["schema"] == "trillionnium.world-publication-request.v1"
          assert request["request_id"] == os.environ["REQUEST_ID"]
          assert request["source"]["artifact_id"] == int(os.environ["QUALIFICATION_ARTIFACT_ID"])
          assert request["source"]["artifact_zip_sha256"] == os.environ["QUALIFICATION_ARTIFACT_SHA256"]
          assert request["source"]["qualified_tree"] == os.environ["QUALIFIED_TREE"]
          assert request["importer"]["commit"] == os.environ["IMPORTER_COMMIT"]
          assert request["importer"]["git_blob_sha1"] == os.environ["IMPORTER_BLOB_SHA1"]
          assert request["target"]["repository"] == os.environ["WORLD_REPOSITORY"]
          assert request["target"]["branch"] == os.environ["WORLD_BRANCH"]
          assert request["target"]["expected_head"] == os.environ["WORLD_EXPECTED_HEAD"]
          assert request["target"]["write_count"] == 73
          assert request["target"]["deletion_count"] == 2
          assert request["target"]["force_update_allowed"] is False
          assert request["target"]["default_branch_write_allowed"] is False
          assert request["execution"]["trusted_workflow_ref"] == "refs/heads/main"
          assert request["execution"]["protected_environment"] == "world-source-publication"
          assert request["execution"]["candidate_controlled_code_allowed"] is False
          assert request["claims"]["request_is_publication"] is False
          assert request["claims"]["gap_closed"] is False
          PY
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/${WORLD_REPOSITORY}/${IMPORTER_COMMIT}/scripts/import-qualified-world-v13k.py" \
            --output /tmp/import-qualified-world-v13k.py
          test "$(git hash-object /tmp/import-qualified-world-v13k.py)" = \
            "$IMPORTER_BLOB_SHA1"
          python3 -m py_compile /tmp/import-qualified-world-v13k.py

      - name: Verify retained artifact and execute secret-free dry run
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${QUALIFICATION_ARTIFACT_ID}/zip" \
            --output /tmp/world-v13k-source-candidate.zip
          test "$(sha256sum /tmp/world-v13k-source-candidate.zip | awk '{print $1}')" = \
            "$QUALIFICATION_ARTIFACT_SHA256"
          python3 /tmp/import-qualified-world-v13k.py \
            --artifact-zip /tmp/world-v13k-source-candidate.zip \
            --repository "$WORLD_REPOSITORY" \
            --target-branch "$WORLD_BRANCH" \
            --result /tmp/world-v13k-dry-run.json
          python3 - <<'PY'
          import json
          value = json.load(open("/tmp/world-v13k-dry-run.json"))
          assert value["published"] is False
          assert value["qualified_tree"] == "5e613185f5a2abda42df371f3755e73667717309"
          assert value["file_count"] == 73
          assert value["deletion_count"] == 2
          PY

  publish-qualified-world-source:
    needs: verify-world-publication-request
    if: >-
      needs.verify-world-publication-request.result == 'success' &&
      github.repository == 'TrillionniumFoundation/TrillionniumGame' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      inputs.world_publication_request_id == 'world-v13k-2026-09-08' &&
      inputs.approved_main_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: world-source-publication
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TRNM_WORLD_IMPORT_TOKEN: ${{ secrets.TRNM_WORLD_ENV_IMPORT_TOKEN }}
      REQUEST_PATH: .github/world-publication-requests/world-v13k-2026-09-08.json
      REQUEST_SHA256: a7222f31e7ec27e33f4f1d414525236ac21d2187404e78fe8098ad11b15867ae
      WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
      WORLD_BRANCH: fix/world-plan-v4-development-closure-20260831
      WORLD_EXPECTED_HEAD: 010370c540a3a17e871b4b5349fc01ffe9502553
      IMPORTER_COMMIT: d8ab3164cbd573e642d98fbfb626fe551574c7e5
      IMPORTER_BLOB_SHA1: 5c21773242423b083f87ee0924474754646065d0
      QUALIFICATION_ARTIFACT_ID: "9780499701"
      QUALIFICATION_ARTIFACT_SHA256: 456a181bdc8f8aa248229b044db9eec4f52572ea3b20bca6492907db58d64ef5
      QUALIFIED_TREE: 5e613185f5a2abda42df371f3755e73667717309
    steps:
      - name: Re-fetch and rebind exact protected-main transaction
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TRNM_WORLD_IMPORT_TOKEN"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum "$GITHUB_WORKSPACE/$REQUEST_PATH" | awk '{print $1}')" = \
            "$REQUEST_SHA256"
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/${WORLD_REPOSITORY}/${IMPORTER_COMMIT}/scripts/import-qualified-world-v13k.py" \
            --output /tmp/import-qualified-world-v13k.py
          test "$(git hash-object /tmp/import-qualified-world-v13k.py)" = \
            "$IMPORTER_BLOB_SHA1"
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${QUALIFICATION_ARTIFACT_ID}/zip" \
            --output /tmp/world-v13k-source-candidate.zip
          test "$(sha256sum /tmp/world-v13k-source-candidate.zip | awk '{print $1}')" = \
            "$QUALIFICATION_ARTIFACT_SHA256"
          python3 /tmp/import-qualified-world-v13k.py \
            --artifact-zip /tmp/world-v13k-source-candidate.zip \
            --repository "$WORLD_REPOSITORY" \
            --target-branch "$WORLD_BRANCH" \
            --result /tmp/world-v13k-dry-run.json

      - name: Compare-and-swap exact World review branch
        shell: bash
        run: |
          set -euo pipefail
          test "$WORLD_BRANCH" != main
          test "$WORLD_BRANCH" != master
          python3 /tmp/import-qualified-world-v13k.py \
            --artifact-zip /tmp/world-v13k-source-candidate.zip \
            --repository "$WORLD_REPOSITORY" \
            --target-branch "$WORLD_BRANCH" \
            --expected-head "$WORLD_EXPECTED_HEAD" \
            --publish \
            --result /tmp/world-v13k-publication-receipt.json

      - name: Verify parent, tree and complete changed-path closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import importlib.util
          import json
          import os
          import sys
          import tempfile
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["TRNM_WORLD_IMPORT_TOKEN"]
          repository = os.environ["WORLD_REPOSITORY"]
          branch = os.environ["WORLD_BRANCH"]
          expected_head = os.environ["WORLD_EXPECTED_HEAD"]
          qualified_tree = os.environ["QUALIFIED_TREE"]
          receipt = json.loads(Path("/tmp/world-v13k-publication-receipt.json").read_text())
          assert receipt["published"] is True
          assert receipt["old_head"] == expected_head
          assert receipt["qualified_tree"] == qualified_tree
          assert receipt["repository"] == repository
          assert receipt["target_branch"] == branch
          assert receipt["file_count"] == 73
          assert receipt["deletion_count"] == 2

          spec = importlib.util.spec_from_file_location(
              "trusted_world_importer", "/tmp/import-qualified-world-v13k.py"
          )
          assert spec is not None and spec.loader is not None
          importer = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = importer
          spec.loader.exec_module(importer)
          with tempfile.TemporaryDirectory(prefix="world-v13k-readback-") as directory:
              _, records = importer.prepare(
                  Path("/tmp/world-v13k-source-candidate.zip"), Path(directory)
              )
          expected = {record["path"]: record for record in records}
          assert len(expected) == 75

          def api(path: str):
              request = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "trnm-trusted-world-publication-readback/v1",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          encoded_branch = urllib.parse.quote(branch, safe="")
          branch_value = api(f"/repos/{repository}/branches/{encoded_branch}")
          assert branch_value["commit"]["sha"] == receipt["new_head"]
          git_commit = api(f"/repos/{repository}/git/commits/{receipt['new_head']}")
          assert [row["sha"] for row in git_commit["parents"]] == [expected_head]
          assert git_commit["tree"]["sha"] == receipt["overlay_tree"]

          commit = api(
              f"/repos/{repository}/commits/{receipt['new_head']}?per_page=100&page=1"
          )
          files = commit["files"]
          assert len(files) == len(expected)
          observed_paths = {row["filename"] for row in files}
          assert observed_paths == set(expected)
          for row in files:
              record = expected[row["filename"]]
              if record["sha"] is None:
                  assert row["status"] == "removed"
              else:
                  assert row["status"] in {"added", "modified"}
                  assert row["sha"] == record["sha"]

          required_deletions = {
              "trillionnium/crates/trnm-game-server/build.rs",
              "trillionnium/crates/trnm-game-server/src/lib.rs.in",
          }
          assert {
              path for path, record in expected.items() if record["sha"] is None
          } == required_deletions
          print(json.dumps({
              "schema": "trillionnium.world-publication-receipt.v1",
              "trusted_main_sha": os.environ["GITHUB_SHA"],
              "request_sha256": os.environ["REQUEST_SHA256"],
              "old_head": expected_head,
              "new_head": receipt["new_head"],
              "overlay_tree": receipt["overlay_tree"],
              "qualified_tree": qualified_tree,
              "write_count": 73,
              "deletion_count": 2,
              "complete_path_readback": True,
              "force_update": False,
              "deployment_authorized": False,
          }, sort_keys=True))
          PY
