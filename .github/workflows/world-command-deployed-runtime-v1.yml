name: world-command-deployed-runtime-v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/internal/core/world_command.go'
      - 'runtime/internal/worldcommand/**'
      - 'runtime/world_command_*.go'
      - 'runtime/cmd/trnm-world-transition-fixture/**'
      - 'runtime/cmd/trnm-response-drop-proxy/**'
      - 'runtime/cmd/trnm-tls-fixture/**'
      - 'runtime/Dockerfile.faultlab'
      - 'runtime/main.go'
      - 'contracts/world-command-deployed-runtime-v1-status.json'
      - 'contracts/world-command-rpc-v1/**'
      - 'deploy/world-command-fault-lab/**'
      - 'docs/WORLD_COMMAND_DEPLOYED_RUNTIME_V1.md'
      - 'scripts/blackbox/world-command-fault.mjs'
      - 'scripts/check-world-command-deployed-runtime-v1.sh'
      - 'scripts/test-world-command-deployed-runtime-v1-negative.sh'
      - 'scripts/check-world-command-faultlab-postgres-binding.sh'
      - 'scripts/test-world-command-faultlab-postgres-binding-negative.sh'
      - 'scripts/check-world-command-deployed-runtime-v1-local.sh'
      - 'scripts/run-world-command-deployed-fault-lab.sh'
      - 'scripts/run-world-command-deployed-fault-lab-v2.sh'
      - 'scripts/verify-world-command-storage-atomicity.py'
      - '.github/workflows/world-command-deployed-runtime-v1.yml'
  push:
    branches:
      - main
      - feature/game-world-command-deployed-runtime-v1
    paths:
      - 'runtime/internal/core/world_command.go'
      - 'runtime/internal/worldcommand/**'
      - 'runtime/world_command_*.go'
      - 'runtime/cmd/trnm-world-transition-fixture/**'
      - 'runtime/cmd/trnm-response-drop-proxy/**'
      - 'runtime/cmd/trnm-tls-fixture/**'
      - 'runtime/Dockerfile.faultlab'
      - 'runtime/main.go'
      - 'contracts/world-command-deployed-runtime-v1-status.json'
      - 'contracts/world-command-rpc-v1/**'
      - 'deploy/world-command-fault-lab/**'
      - 'docs/WORLD_COMMAND_DEPLOYED_RUNTIME_V1.md'
      - 'scripts/blackbox/world-command-fault.mjs'
      - 'scripts/check-world-command-deployed-runtime-v1.sh'
      - 'scripts/test-world-command-deployed-runtime-v1-negative.sh'
      - 'scripts/check-world-command-faultlab-postgres-binding.sh'
      - 'scripts/test-world-command-faultlab-postgres-binding-negative.sh'
      - 'scripts/check-world-command-deployed-runtime-v1-local.sh'
      - 'scripts/run-world-command-deployed-fault-lab.sh'
      - 'scripts/run-world-command-deployed-fault-lab-v2.sh'
      - 'scripts/verify-world-command-storage-atomicity.py'
      - '.github/workflows/world-command-deployed-runtime-v1.yml'

permissions:
  contents: read

concurrency:
  group: world-command-deployed-runtime-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Validate shell and Python entrypoints
        run: |
          bash -n scripts/check-world-command-deployed-runtime-v1.sh
          bash -n scripts/test-world-command-deployed-runtime-v1-negative.sh
          bash -n scripts/check-world-command-faultlab-postgres-binding.sh
          bash -n scripts/test-world-command-faultlab-postgres-binding-negative.sh
          bash -n scripts/check-world-command-deployed-runtime-v1-local.sh
          bash -n scripts/run-world-command-deployed-fault-lab.sh
          bash -n scripts/run-world-command-deployed-fault-lab-v2.sh
          python3 -m py_compile scripts/verify-world-command-storage-atomicity.py
          node --check scripts/blackbox/world-command-fault.mjs

      - name: Verify deployed-runtime authority and storage boundary
        run: bash scripts/check-world-command-deployed-runtime-v1.sh

      - name: Verify canonical fault-lab PostgreSQL binding
        run: |
          bash scripts/check-world-command-faultlab-postgres-binding.sh
          bash scripts/test-world-command-faultlab-postgres-binding-negative.sh

      - name: Prove malicious deployed-runtime fixtures fail closed
        run: bash scripts/test-world-command-deployed-runtime-v1-negative.sh

      - name: Verify Go formatting
        run: |
          unformatted=$(gofmt -l runtime)
          test -z "$unformatted" || {
            printf 'unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          }

      - name: Run Go tests and vet
        working-directory: runtime
        run: |
          go test ./... -count=1
          go test -race ./internal/worldcommand ./internal/worldtransition -count=1
          go vet ./...

      - name: Build exact plugin and fault-lab binaries
        working-directory: runtime
        run: |
          CGO_ENABLED=1 go build -trimpath -buildmode=plugin -o /tmp/backend.so .
          CGO_ENABLED=0 go build -trimpath -o /tmp/trnm-world-transition-fixture ./cmd/trnm-world-transition-fixture
          CGO_ENABLED=0 go build -trimpath -o /tmp/trnm-response-drop-proxy ./cmd/trnm-response-drop-proxy
          CGO_ENABLED=0 go build -trimpath -o /tmp/trnm-tls-fixture ./cmd/trnm-tls-fixture

      - name: Validate Compose overlay shape
        run: |
          test -f deploy/world-command-fault-lab/compose.yaml
          grep -q '^  postgres:' compose.yaml
          grep -q '^  nakama:' compose.yaml
          grep -q '^  world-fixture:' deploy/world-command-fault-lab/compose.yaml
          grep -q '^  response-drop-proxy:' deploy/world-command-fault-lab/compose.yaml

  isolated-deployed-fault-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: source-contract
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up exact Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: runtime/go.mod
          cache: false

      - name: Execute isolated PostgreSQL + Game + World HTTPS fault lab
        env:
          TRNM_WORLD_COMMAND_EVIDENCE_DIR: ${{ github.workspace }}/run/world-command-deployed-runtime-v1
        run: timeout 40m bash scripts/run-world-command-deployed-fault-lab-v2.sh

      - name: Validate exact-head evidence posture
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          jq -e '
            .contract_version == "trnm_game_world_command_deployed_fault_report_v1" and
            .repository == "TrillionniumFoundation/TrillionniumGame" and
            .repository_id == 1323087470 and
            .commit == env.EXPECTED_COMMIT and
            .environment == "isolated_single_host_postgresql_nakama_https_world_fixture" and
            .scenario_count == 5 and
            .all_passed == true and
            .authority.cutover_authorized == false and
            .authority.closed_online_promoted == false and
            .authority.public_online_enabled == false and
            .authority.public_player_market_enabled == false and
            (.limitations | length >= 5)
          ' run/world-command-deployed-runtime-v1/report.json >/dev/null
          test "$(find run/world-command-deployed-runtime-v1/scenarios -name atomicity.json | wc -l)" -eq 5
          find run/world-command-deployed-runtime-v1/scenarios -name atomicity.json -print0 \
            | xargs -0 -n1 jq -e '.atomicity_verified == true and .cutover_authorized == false and .public_online_enabled == false' >/dev/null
          sha256sum --check run/world-command-deployed-runtime-v1/SHA256SUMS

      - name: Upload exact deployed fault evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-command-deployed-runtime-v1-${{ github.sha }}
          path: run/world-command-deployed-runtime-v1
          if-no-files-found: error
          retention-days: 30
