name: pr93-formal-source-audit

on:
  push:
    branches: [tooling/pr93-identity-and-ci-2026-09-06]
    paths:
      - '.github/workflows/pr93-formal-source-audit.yml'

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '93'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact live source and actual merge
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          curl -fsS "${auth[@]}" "${api}/pulls/${PR_NUMBER}" > "$RUNNER_TEMP/pr.json"
          head=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")
          base=$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")
          merge=$(jq -r '.merge_commit_sha // empty' "$RUNNER_TEMP/pr.json")
          test -n "$head" && test -n "$base" && test -n "$merge"
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=2 origin "$head" "$merge"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach "$head"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$head"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse "$merge^1")" = "$base"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse "$merge^2")" = "$head"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse "$merge^{tree}")" = "$(git -C "$GITHUB_WORKSPACE/source" rev-parse "$head^{tree}")"
          printf '%s\n' "$head" > "$RUNNER_TEMP/head"
          printf '%s\n' "$merge" > "$RUNNER_TEMP/merge"

      - name: Execute canonical controls and derive formal source state
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/controls"
          checks=(
            check-documentation-authority.py
            check-plan.py
            check-evidence-index.py
            check-gap-register.py
            derive-gap-status.py
            derive-gates.py
            check-status-transitions.py
            check-workflow-action-policy.py
            check-repository-hygiene.py
            check-trnm-server.py
            check-rust-foundation.py
          )
          for check in "${checks[@]}"; do
            python3 "scripts/$check" > "$RUNNER_TEMP/controls/${check}.log" 2>&1
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          from __future__ import annotations
          import json,os,re,sys
          from pathlib import Path
          temp=Path(sys.argv[1]); root=Path.cwd()
          gaps=json.loads((root/'docs/status/GAP_REGISTER.json').read_text())
          rows=gaps.get('gaps',[])
          evidence=json.loads((root/'docs/evidence/index.json').read_text())
          accepted=evidence.get('accepted_entry_count')
          if accepted is None:
              accepted=sum(1 for item in evidence.get('entries',[]) if item.get('accepted') is True)
          statuses={}
          for row in rows:statuses[row.get('status')]=statuses.get(row.get('status'),0)+1
          plan=(temp/'controls/check-plan.py.log').read_text(errors='replace')
          match=re.search(r'TrillionniumGame product gates:\s*(\d+) passed,\s*(\d+) open,\s*(\d+) blocked',plan)
          gates={'passed':int(match.group(1)),'open':int(match.group(2)),'blocked':int(match.group(3))} if match else None
          report={'schema':'trillionnium.pr93-formal-source-audit.v1','repository':os.environ['GITHUB_REPOSITORY'],'pull_request':93,'head':(temp/'head').read_text().strip(),'merge':(temp/'merge').read_text().strip(),'gap_count':len(rows),'close_criteria_count':sum(len(row.get('close_criteria',[])) for row in rows),'closed_gap_count':sum(row.get('status')=='closed' for row in rows),'gap_status_counts':statuses,'accepted_evidence_count':accepted,'product_gates':gates,'control_count':11,'controls_passed':True,'all_gaps_closed':bool(rows) and all(row.get('status')=='closed' for row in rows),'production_ready':False,'nakama_retired':False,'claim_boundary':'Controls passing means the source/control implementation is internally consistent; it does not manufacture retained evidence, independent review, external environment facts or production authority.'}
          (temp/'formal.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY

      - name: Add workflow/review observations and publish report
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          head=$(cat "$RUNNER_TEMP/head")
          curl -fsS "${auth[@]}" "${api}/actions/runs?head_sha=${head}&per_page=100" > "$RUNNER_TEMP/runs.json"
          jq -c '.workflow_runs|sort_by(.workflow_id,.run_attempt,.id)|group_by(.workflow_id)|map(last)' "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/latest.json"
          total=$(jq 'length' "$RUNNER_TEMP/latest.json")
          active=$(jq '[.[]|select(.status!="completed")]|length' "$RUNNER_TEMP/latest.json")
          failed=$(jq '[.[]|select(.status=="completed" and .conclusion!="success")]|length' "$RUNNER_TEMP/latest.json")
          success=$(jq '[.[]|select(.status=="completed" and .conclusion=="success")]|length' "$RUNNER_TEMP/latest.json")
          curl -fsS "${auth[@]}" "${api}/pulls/${PR_NUMBER}/reviews?per_page=100" > "$RUNNER_TEMP/reviews.json"
          author=$(curl -fsS "${auth[@]}" "${api}/pulls/${PR_NUMBER}" | jq -r '.user.login|ascii_downcase')
          approvals=$(jq --arg head "$head" --arg author "$author" '[sort_by(.submitted_at,.id)|group_by(.user.login|ascii_downcase)|map(last)[]|select(.user.type=="User" and .commit_id==$head and .state=="APPROVED" and (.user.login|ascii_downcase)!=$author and (.user.login|ascii_downcase)!="profhepta" and (.user.login|ascii_downcase)!="franksudoman")]|length' "$RUNNER_TEMP/reviews.json")
          jq --argjson workflow_total "$total" --argjson workflow_success "$success" --argjson workflow_active "$active" --argjson workflow_failed "$failed" --argjson approvals "$approvals" '. + {latest_workflow_count:$workflow_total,latest_workflow_success:$workflow_success,latest_workflow_active:$workflow_active,latest_workflow_failed:$workflow_failed,current_conflict_free_approvals:$approvals}' "$RUNNER_TEMP/formal.json" > "$RUNNER_TEMP/final.json"
          body=$(jq -r '"<!-- pr93-formal-source-audit -->\nFormal source audit for `"+.head+"` / merge `"+.merge+"`:\n```json\n"+(.|tostring)+"\n```\nThis report is fail-closed and creates no evidence, review, gap, compatibility, migration, cutover or production credit."' "$RUNNER_TEMP/final.json")
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl -fsS -X POST "${auth[@]}" --data-binary @"$RUNNER_TEMP/comment.json" "${api}/issues/${PR_NUMBER}/comments" >/dev/null
