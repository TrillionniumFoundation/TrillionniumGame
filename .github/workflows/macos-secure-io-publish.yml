name: macos-secure-io-publish

on:
  push:
    branches:
      - codex/macos-secure-io-publisher-2026-09-06

permissions:
  contents: write

concurrency:
  group: macos-secure-io-publish
  cancel-in-progress: false

jobs:
  macos-secure-io-publish:
    runs-on: macos-15-arm64
    timeout-minutes: 45
    env:
      PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
      EXPECTED_HEAD: 67523089ee750db5f6ee860b66071bc04dfc1521
      EXPECTED_TREE: 40f45e8a2dbea2f4ffdb0c1b7db229ad906ca60a
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Fetch exact unchanged product candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin \
            "refs/heads/${PRODUCT_BRANCH}"
          git -C "$GITHUB_WORKSPACE/source" checkout -b "$PRODUCT_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git -C "$GITHUB_WORKSPACE/source" ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"

      - name: Canonicalize only trusted root namespace aliases
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, observed {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          evidence = Path("scripts/evidence_admission.py")
          evidence_anchor = '''    absolute = path.absolute()
              need(absolute.anchor == os.sep and 1 < len(absolute.parts) <= MAX_PATH_COMPONENTS
                   and all(part not in (".", "..") for part in absolute.parts[1:]),
                   "noncanonical absolute evidence path")
          '''
          evidence_replacement = evidence_anchor + '''    # macOS exposes root-owned namespace aliases such as /var -> /private/var.
              # Resolve only that protected first directory entry; all caller-controlled
              # descendants remain descriptor-walked with O_NOFOLLOW.
              if len(absolute.parts) > 2:
                  root_alias = Path(os.sep) / absolute.parts[1]
                  try:
                      alias_metadata = root_alias.lstat()
                  except OSError as error:
                      raise AdmissionError("secure evidence file I/O failed") from error
                  if stat.S_ISLNK(alias_metadata.st_mode):
                      need(alias_metadata.st_uid == 0,
                           "noncanonical absolute evidence path")
                      canonical_root = Path(os.path.realpath(root_alias))
                      need(canonical_root.anchor == os.sep
                           and all(part not in (".", "..")
                                   for part in canonical_root.parts[1:]),
                           "noncanonical absolute evidence path")
                      absolute = canonical_root.joinpath(*absolute.parts[2:])
                      need(1 < len(absolute.parts) <= MAX_PATH_COMPONENTS
                           and all(part not in (".", "..")
                                   for part in absolute.parts[1:]),
                           "noncanonical absolute evidence path")
          '''
          replace_once(evidence, evidence_anchor, evidence_replacement)

          uploader = Path("scripts/upload-actions-artifact.py")
          uploader_anchor = '''    absolute = path.absolute()
              if (absolute.anchor != os.sep or not 1 < len(absolute.parts) <= MAX_PATH_COMPONENTS
                      or any(part in (".", "..") or "\\0" in part for part in absolute.parts[1:])):
                  raise ArtifactUploadError("artifact path is not canonical")
          '''
          uploader_replacement = uploader_anchor + '''    # Hosted macOS temp paths use root-owned aliases such as /var.
              # Resolve only the protected first directory entry and keep every
              # caller-controlled descendant under descriptor-relative no-follow I/O.
              if len(absolute.parts) > 2:
                  root_alias = Path(os.sep) / absolute.parts[1]
                  try:
                      alias_metadata = root_alias.lstat()
                  except OSError:
                      raise ArtifactUploadError("secure artifact file I/O failed") from None
                  if stat.S_ISLNK(alias_metadata.st_mode):
                      if alias_metadata.st_uid != 0:
                          raise ArtifactUploadError("artifact path is not canonical")
                      canonical_root = Path(os.path.realpath(root_alias))
                      if (canonical_root.anchor != os.sep
                              or any(part in (".", "..") or "\\0" in part
                                     for part in canonical_root.parts[1:])):
                          raise ArtifactUploadError("artifact path is not canonical")
                      absolute = canonical_root.joinpath(*absolute.parts[2:])
                      if (not 1 < len(absolute.parts) <= MAX_PATH_COMPONENTS
                              or any(part in (".", "..") or "\\0" in part
                                     for part in absolute.parts[1:])):
                          raise ArtifactUploadError("artifact path is not canonical")
          '''
          replace_once(uploader, uploader_anchor, uploader_replacement)
          PY
          test "$(git diff --name-only)" = $'scripts/evidence_admission.py\nscripts/upload-actions-artifact.py'
          git diff --check

      - name: Execute focused and complete control corpus on macOS
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 -m unittest -v \
            tests.control_plane.test_actions_artifact_protocol \
            tests.control_plane.test_actions_artifact_response_contract \
            tests.control_plane.test_actions_artifact_security \
            tests.control_plane.test_actions_artifact_uploader \
            tests.control_plane.test_evidence_admission \
            tests.control_plane.test_evidence_retained_io \
            tests.control_plane.test_execution_acceptance \
            tests.control_plane.test_gate_freshness
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-plan.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"
          test "$(git diff --name-only)" = $'scripts/evidence_admission.py\nscripts/upload-actions-artifact.py'

      - name: Commit and ordinary fast-forward push
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add scripts/evidence_admission.py scripts/upload-actions-artifact.py
          git diff --cached --check
          git commit -m "fix(control): support trusted macOS root path aliases"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${PRODUCT_BRANCH}"
