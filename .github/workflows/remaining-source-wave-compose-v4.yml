name: remaining-source-wave-compose-v4

on:
  push:
    branches: [tooling/remaining-source-wave-compose-v4-2026-09-06a]
    paths:
      - '.github/workflows/remaining-source-wave-compose-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remaining-source-wave-compose-v4
  cancel-in-progress: true

jobs:
  compose-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CANDIDATE_BRANCH: codex/branch-evidence-closure-2026-09-02
      OUTBOX_BRANCH: codex/outbox-property-coverage-2026-09-06
      SESSION_BRANCH: codex/session-revocation-fanout-2026-09-06
      REALTIME_BRANCH: codex/realtime-control-models-2026-09-06
      CRYPTO_BRANCH: codex/crypto-key-lifecycle-2026-09-06
      MIGRATION_BRANCH: codex/migration-fence-control-2026-09-06
      PRODUCT_BRANCH: codex/remaining-source-blockers-wave-v4-2026-09-06a
      BASELINE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TERM_COLOR: always
    steps:
      - name: Fetch exact source branches and wait for validated payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" config user.name 'Qian QI'
          git -C "$GITHUB_WORKSPACE" config user.email \
            '102159240+ProfHepta@users.noreply.github.com'

          fetch_all() {
            git -C "$GITHUB_WORKSPACE" fetch --no-tags --prune origin \
              "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/candidate" \
              "+refs/heads/${OUTBOX_BRANCH}:refs/remotes/origin/outbox" \
              "+refs/heads/${SESSION_BRANCH}:refs/remotes/origin/session" \
              "+refs/heads/${REALTIME_BRANCH}:refs/remotes/origin/realtime" \
              "+refs/heads/${CRYPTO_BRANCH}:refs/remotes/origin/crypto" \
              "+refs/heads/${MIGRATION_BRANCH}:refs/remotes/origin/migration"
            git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
              "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/product" \
              2>/dev/null || true
          }
          ready() {
            git -C "$GITHUB_WORKSPACE" cat-file -e \
              'refs/remotes/origin/outbox:crates/trnm-persistence-core/tests/outbox_state_model.rs' &&
            git -C "$GITHUB_WORKSPACE" cat-file -e \
              'refs/remotes/origin/session:crates/trnm-presence-router-v2/src/session_registry.rs' &&
            git -C "$GITHUB_WORKSPACE" cat-file -e \
              'refs/remotes/origin/realtime:crates/trnm-presence-router-v2/src/connection_actor.rs' &&
            git -C "$GITHUB_WORKSPACE" cat-file -e \
              'refs/remotes/origin/realtime:crates/trnm-presence-router-v2/src/reconnect_cursor.rs' &&
            git -C "$GITHUB_WORKSPACE" cat-file -e \
              'refs/remotes/origin/realtime:crates/trnm-presence-router-v2/src/disconnect_journal.rs' &&
            git -C "$GITHUB_WORKSPACE" cat-file -e \
              'refs/remotes/origin/crypto:crates/trnm-token-crypto-provider/src/key_epoch.rs' &&
            git -C "$GITHUB_WORKSPACE" cat-file -e \
              'refs/remotes/origin/crypto:crates/trnm-token-crypto-provider/src/signer_journal.rs' &&
            git -C "$GITHUB_WORKSPACE" cat-file -e \
              'refs/remotes/origin/migration:crates/trnm-persistence-core/src/migration_fence.rs'
          }

          for attempt in $(seq 1 60); do
            fetch_all
            if ready; then
              printf 'all validated source payloads present after attempt=%s\n' "$attempt"
              break
            fi
            if test "$attempt" -eq 60; then
              printf 'validated source payloads did not materialize\n' >&2
              exit 1
            fi
            sleep 20
          done

          for ref in candidate outbox session realtime crypto migration; do
            sha=$(git -C "$GITHUB_WORKSPACE" rev-parse "refs/remotes/origin/${ref}")
            tree=$(git -C "$GITHUB_WORKSPACE" rev-parse "refs/remotes/origin/${ref}^{tree}")
            printf '%s=%s tree=%s\n' "$ref" "$sha" "$tree"
          done
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
            "$BASELINE" refs/remotes/origin/candidate
          for ref in outbox session realtime crypto migration; do
            git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
              "$BASELINE" "refs/remotes/origin/${ref}"
          done

      - name: Compose one cumulative source line
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if git show-ref --verify --quiet refs/remotes/origin/product; then
            git checkout -b "$PRODUCT_BRANCH" refs/remotes/origin/product
            if ! git merge-base --is-ancestor refs/remotes/origin/candidate HEAD; then
              git merge --no-edit --no-ff refs/remotes/origin/candidate
            fi
          else
            git checkout -b "$PRODUCT_BRANCH" refs/remotes/origin/candidate
          fi

          merge_clean() {
            local ref="$1"
            if git merge-base --is-ancestor "refs/remotes/origin/${ref}" HEAD; then
              printf '%s already contained\n' "$ref"
              return 0
            fi
            git merge --no-edit --no-ff "refs/remotes/origin/${ref}"
          }

          merge_clean outbox
          merge_clean session

          if ! git merge-base --is-ancestor refs/remotes/origin/realtime HEAD; then
            if ! git merge --no-edit --no-ff refs/remotes/origin/realtime; then
              conflicts=$(git diff --name-only --diff-filter=U | LC_ALL=C sort)
              test "$conflicts" = 'crates/trnm-presence-router-v2/src/lib.rs'
              git checkout --ours crates/trnm-presence-router-v2/src/lib.rs
              python3 - <<'PY'
              from pathlib import Path
              path = Path('crates/trnm-presence-router-v2/src/lib.rs')
              text = path.read_text(encoding='utf-8')
              modules = ['connection_actor', 'disconnect_journal', 'reconnect_cursor']
              for module in modules:
                  if f'mod {module};' not in text:
                      marker = 'mod router;'
                      if marker not in text:
                          raise SystemExit(f'missing module insertion anchor for {module}')
                      text = text.replace(marker, f'mod {module};\n' + marker, 1)
              exports = '''

              pub use connection_actor::{
                  ConnectionActor, ConnectionActorConfig, ConnectionActorError,
                  ConnectionActorState, CorrelationId, InboundFrame, OutboundFrame, PendingRequest,
              };
              pub use disconnect_journal::{
                  DisconnectIntentId, DisconnectJournal, DisconnectJournalError,
                  DisconnectOperation, DisconnectReceipt, DisconnectRecord, DisconnectState,
                  LeaseToken, RetryDisposition, WorkerId,
              };
              pub use reconnect_cursor::{
                  ReconnectCursor, ReconnectEvent, ReconnectJournal, ReconnectJournalConfig,
                  ReconnectJournalError,
              };
              '''
              if 'pub use connection_actor::' not in text:
                  text = text.rstrip() + exports
              path.write_text(text, encoding='utf-8')
              PY
              git add crates/trnm-presence-router-v2/src/lib.rs
              git commit --no-edit
            fi
          fi

          merge_clean crypto
          merge_clean migration

          python3 - <<'PY'
          from pathlib import Path
          required = [
              'crates/trnm-persistence-core/tests/outbox_state_model.rs',
              'crates/trnm-persistence-core/src/migration_fence.rs',
              'crates/trnm-presence-router-v2/src/session_registry.rs',
              'crates/trnm-presence-router-v2/src/connection_actor.rs',
              'crates/trnm-presence-router-v2/src/reconnect_cursor.rs',
              'crates/trnm-presence-router-v2/src/disconnect_journal.rs',
              'crates/trnm-token-crypto-provider/src/key_epoch.rs',
              'crates/trnm-token-crypto-provider/src/signer_journal.rs',
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit(f'missing cumulative paths: {missing}')
          for path in required:
              if Path(path).stat().st_size == 0:
                  raise SystemExit(f'empty cumulative path: {path}')
          PY
          git status --short
          test -z "$(git status --porcelain)"

      - name: Validate complete affected source surface
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose

          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

          for manifest in \
            crates/trnm-persistence-core/Cargo.toml \
            crates/trnm-presence-router-v2/Cargo.toml \
            crates/trnm-token-crypto-provider/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done

          python3 -m compileall -q scripts tools tests
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-plan.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 scripts/check-status-transitions.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

          if test -f runtime/go.mod; then
            files=$(find runtime -type f -name '*.go' -print | sort)
            test -n "$files"
            test -z "$(printf '%s\n' "$files" | xargs gofmt -l)"
            (cd runtime && go test ./... -count=1)
            (cd runtime && go test -race ./... -count=1)
            (cd runtime && go vet ./...)
          fi
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Fast-forward cumulative wave branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          printf 'wave_head=%s\nwave_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Record source-only boundary
        shell: bash
        run: |
          printf '%s\n' \
            'cumulative_source_validated=true' \
            'independently_reviewed=false' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false' \
            'cutover_authorized=false' \
            'nakama_retired=false'
