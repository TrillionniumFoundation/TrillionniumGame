name: realtime-control-models-receipt-binding

on:
  push:
    branches: [tooling/realtime-control-models-preflight-2026-09-06]
    paths:
      - '.github/workflows/realtime-control-models-receipt-binding.yml'

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_BRANCH: codex/realtime-control-models-2026-09-06
      EXPECTED_BASE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact product branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=64 origin \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/product"
          git -C "$GITHUB_WORKSPACE" checkout -b "$PRODUCT_BRANCH" \
            refs/remotes/origin/product
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$RUNNER_TEMP/original-head"
          test -f crates/trnm-presence-router-v2/src/disconnect_journal.rs

      - name: Bind receipt to exact operation digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-presence-router-v2/src/disconnect_journal.rs')
          text = path.read_text(encoding='utf-8')
          if 'pub struct DisconnectReceipt' not in text:
              anchor = '''impl DisconnectOperation {
              pub fn validate(self) -> Result<Self, DisconnectJournalError> {
                  if self.socket_generation == 0 {
                      return Err(DisconnectJournalError::ZeroIdentifier(
                          "socket_generation",
                      ));
                  }
                  if self.operation_digest.iter().all(|byte| *byte == 0) {
                      return Err(DisconnectJournalError::ZeroDigest("operation_digest"));
                  }
                  Ok(self)
              }
          }
          '''
              addition = anchor + '''
          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct DisconnectReceipt {
              pub operation_digest: [u8; 32],
              pub receipt_digest: [u8; 32],
          }

          impl DisconnectReceipt {
              pub fn validate(self) -> Result<Self, DisconnectJournalError> {
                  if self.operation_digest.iter().all(|byte| *byte == 0) {
                      return Err(DisconnectJournalError::ZeroDigest("receipt.operation_digest"));
                  }
                  if self.receipt_digest.iter().all(|byte| *byte == 0) {
                      return Err(DisconnectJournalError::ZeroDigest("receipt.receipt_digest"));
                  }
                  Ok(self)
              }
          }
          '''
              if text.count(anchor) != 1:
                  raise SystemExit('disconnect operation anchor drift')
              text = text.replace(anchor, addition, 1)

              old = '''    pub fn reconcile_receipt(
                  &mut self,
                  id: DisconnectIntentId,
                  receipt: [u8; 32],
              ) -> Result<DisconnectRecord, DisconnectJournalError> {
                  if receipt.iter().all(|byte| *byte == 0) {
                      return Err(DisconnectJournalError::ZeroDigest("receipt"));
                  }
                  let current = self.require(id)?;
                  match current.state {
                      DisconnectState::Applied { receipt: existing } => {
                          if existing == receipt {
                              return Ok(current);
                          }
                          return Err(DisconnectJournalError::ReceiptMismatch(id));
                      }
                      DisconnectState::Dispatched { .. } | DisconnectState::Indeterminate => {}
                      DisconnectState::DeadLetter { .. } => return Err(DisconnectJournalError::Terminal(id)),
                      DisconnectState::Pending | DisconnectState::Leased { .. } => {
                          return Err(DisconnectJournalError::NotDispatched(id));
                      }
                  }
                  let next = DisconnectRecord {
                      state: DisconnectState::Applied { receipt },
                      ..current
                  };
                  self.records.insert(id, next);
                  Ok(next)
              }
          '''
              new = '''    pub fn reconcile_receipt(
                  &mut self,
                  id: DisconnectIntentId,
                  receipt: DisconnectReceipt,
              ) -> Result<DisconnectRecord, DisconnectJournalError> {
                  let receipt = receipt.validate()?;
                  let current = self.require(id)?;
                  if receipt.operation_digest != current.operation.operation_digest {
                      return Err(DisconnectJournalError::ConflictingIntent(id));
                  }
                  match current.state {
                      DisconnectState::Applied { receipt: existing } => {
                          if existing == receipt.receipt_digest {
                              return Ok(current);
                          }
                          return Err(DisconnectJournalError::ReceiptMismatch(id));
                      }
                      DisconnectState::Dispatched { .. } | DisconnectState::Indeterminate => {}
                      DisconnectState::DeadLetter { .. } => return Err(DisconnectJournalError::Terminal(id)),
                      DisconnectState::Pending | DisconnectState::Leased { .. } => {
                          return Err(DisconnectJournalError::NotDispatched(id));
                      }
                  }
                  let next = DisconnectRecord {
                      state: DisconnectState::Applied {
                          receipt: receipt.receipt_digest,
                      },
                      ..current
                  };
                  self.records.insert(id, next);
                  Ok(next)
              }
          '''
              if text.count(old) != 1:
                  raise SystemExit('receipt reconciliation anchor drift')
              text = text.replace(old, new, 1)
              text = text.replace(
                  'journal.reconcile_receipt(id(1), digest(44)).unwrap()',
                  'journal\n            .reconcile_receipt(\n                id(1),\n                DisconnectReceipt {\n                    operation_digest: digest(9),\n                    receipt_digest: digest(44),\n                },\n            )\n            .unwrap()',
              )
              text = text.replace(
                  'journal.reconcile_receipt(id(1), digest(45))',
                  'journal.reconcile_receipt(\n                id(1),\n                DisconnectReceipt {\n                    operation_digest: digest(9),\n                    receipt_digest: digest(45),\n                },\n            )',
              )
              marker = '''        assert_eq!(
                      journal.retry_before_dispatch(id(1), worker(1), token, digest(90)),
                      Err(DisconnectJournalError::AmbiguousCompletionRequiresReconciliation(
                          id(1)
                      ))
                  );
          '''
              regression = marker + '''        assert_eq!(
                      journal.reconcile_receipt(
                          id(1),
                          DisconnectReceipt {
                              operation_digest: digest(8),
                              receipt_digest: digest(44),
                          },
                      ),
                      Err(DisconnectJournalError::ConflictingIntent(id(1)))
                  );
          '''
              if text.count(marker) != 1:
                  raise SystemExit('receipt binding test anchor drift')
              text = text.replace(marker, regression, 1)
              path.write_text(text, encoding='utf-8')

          lib = Path('crates/trnm-presence-router-v2/src/lib.rs')
          source = lib.read_text(encoding='utf-8')
          source = source.replace(
              'DisconnectIntentId, DisconnectJournal, DisconnectJournalError, DisconnectOperation,\n    DisconnectRecord,',
              'DisconnectIntentId, DisconnectJournal, DisconnectJournalError, DisconnectOperation,\n    DisconnectReceipt, DisconnectRecord,',
          )
          lib.write_text(source, encoding='utf-8')
          PY

      - name: Normalize, test and strictly lint
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml
          git diff --check
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets --locked -- -D warnings

      - name: CAS fast-forward validated branch
        shell: bash
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add crates/trnm-presence-router-v2/src
          if git diff --cached --quiet; then
            printf 'source_already_current=true\nhead=%s\n' "$original"
            exit 0
          fi
          git commit -m 'fix(realtime): bind disconnect receipts to immutable operation'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${original}"
          printf 'old_head=%s\nnew_head=%s\ntree=%s\n' \
            "$original" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Preserve no-credit boundary
        shell: bash
        run: |
          printf '%s\n' \
            'source_candidate=true' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false'
