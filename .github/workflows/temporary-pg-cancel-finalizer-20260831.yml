name: temporary-pg-cancel-finalizer-20260831

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-pg-cancel-finalizer-20260831
  cancel-in-progress: false

jobs:
  apply-verify-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply idempotent patch and remove every transient
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/add-pg-cancel-watchdog.py
          python3 - <<'PY'
          from pathlib import Path
          retry = Path('crates/trnm-persistence-pg/src/bin/trnm_server/retry.rs')
          source = retry.read_text(encoding='utf-8')
          if 'pub fn execute<T>(\n' in source and '#[cfg(test)]\npub fn execute<T>(\n' not in source:
              source = source.replace('pub fn execute<T>(\n', '#[cfg(test)]\npub fn execute<T>(\n', 1)
              retry.write_text(source, encoding='utf-8')
          pool = Path('crates/trnm-persistence-pg/src/pool.rs')
          source = pool.read_text(encoding='utf-8')
          source = source.replace(
              '        let mut policy = PgPoolConfig::default();\n        policy.max_size = 0;\n',
              '        let policy = PgPoolConfig {\n            max_size: 0,\n            ..PgPoolConfig::default()\n        };\n',
          )
          source = source.replace(
              '        let mut policy = PgPoolConfig::default();\n        policy.min_idle = policy.max_size + 1;\n',
              '        let default = PgPoolConfig::default();\n        let policy = PgPoolConfig {\n            min_idle: default.max_size + 1,\n            ..default\n        };\n',
          )
          pool.write_text(source, encoding='utf-8')
          PY
          find .github/workflows -maxdepth 1 -type f -name 'temporary-*' -print -delete
          rm -f .github/tmp/add-pg-cancel-watchdog.py
          if [[ -d .github/tmp ]]; then
            find .github/tmp -type f -name 'pg-operations-patch.*' -print -delete
            find .github/tmp -depth -type d -empty -delete
          fi

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1

      - name: Verify all source gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in crates/trnm-token-jwt-adapter/Cargo.toml crates/trnm-presence-router-v2/Cargo.toml crates/trnm-server/Cargo.toml; do
            [[ -f "$manifest" ]] || continue
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          while IFS= read -r module; do
            directory=${module%/go.mod}
            (
              cd "$directory"
              test -z "$(gofmt -l .)"
              go test ./...
              go test -race ./...
              go vet ./...
            )
          done < <(find . -name go.mod -not -path './.git/*' -print | sed 's#^./##' | sort)

      - name: Commit only the verified product change
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'temporary-*' -print -quit)"
          test ! -e .github/tmp/add-pg-cancel-watchdog.py
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No change required.'
            exit 0
          fi
          git commit -m "feat(pg): cancel in-flight pooled operations at deadline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
