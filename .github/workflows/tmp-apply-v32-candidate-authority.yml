name: tmp-apply-v32-candidate-authority

on:
  push:
    branches:
      - integration/plan-v32-main-rebind-2026-09-09
    paths:
      - .github/workflows/tmp-apply-v32-candidate-authority.yml

permissions:
  contents: read

concurrency:
  group: tmp-apply-v32-candidate-authority
  cancel-in-progress: false

jobs:
  recover-verified-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact transport head
        shell: bash
        env:
          BRANCH: integration/plan-v32-main-rebind-2026-09-09
          BASE_COMMIT: 3c7de6cce1bb56cf06a4005ea6970979355344ca
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TrillionniumFoundation/TrillionniumGame'
          test "$GITHUB_REF_NAME" = "$BRANCH"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=16 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$BASE_COMMIT" HEAD

      - name: Recover exact patch and emit bounded transport
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          part0=.tmp/v32-candidate-authority/patch.gz.b64.part-00
          part1=.tmp/v32-candidate-authority/patch.gz.b64.part-01
          encoded="$RUNNER_TEMP/candidate-authority.patch.gz.b64"
          compressed="$RUNNER_TEMP/candidate-authority.patch.gz"
          patch="$RUNNER_TEMP/candidate-authority.patch"

          test "$(wc -c < "$part0")" -eq 12000
          test "$(wc -c < "$part1")" -eq 6224
          cat "$part0" "$part1" > "$encoded"
          printf '%s  %s\n' \
            a598d58dd80afa875ea5282475a0d13d07bb9e15bbcc66c4550473917b0a05d1 \
            "$encoded" | sha256sum -c -
          base64 --decode "$encoded" > "$compressed"

          PATCH_PATH="$patch" COMPRESSED_PATH="$compressed" python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import os
          from pathlib import Path
          import zlib

          raw = Path(os.environ["COMPRESSED_PATH"]).read_bytes()
          if len(raw) < 18 or raw[:4] != b"\x1f\x8b\x08\x00":
              raise SystemExit("unexpected gzip header")
          decoder = zlib.decompressobj(-zlib.MAX_WBITS)
          patch = decoder.decompress(raw[10:-8]) + decoder.flush()
          if not decoder.eof or decoder.unused_data or decoder.unconsumed_tail:
              raise SystemExit("deflate stream did not close exactly")
          digest = hashlib.sha256(patch).hexdigest()
          expected = "25c3872d8a07b7dd0057d046254f31fe5d985781e8315fcdeed664546ec173cf"
          if digest != expected:
              raise SystemExit(f"recovered patch digest mismatch: {digest}")
          Path(os.environ["PATCH_PATH"]).write_bytes(patch)
          encoded = base64.b64encode(patch).decode("ascii")
          print(f"recovered_patch_sha256={digest}")
          print(f"recovered_patch_bytes={len(patch)}")
          print("TRNM_PATCH_B64_BEGIN")
          for offset in range(0, len(encoded), 96):
              print(encoded[offset:offset + 96])
          print("TRNM_PATCH_B64_END")
          PY

          git apply --check "$patch"
          git apply "$patch"
          cat > "$RUNNER_TEMP/allowed-files" <<'EOF'
          docs/review/INDEPENDENT_REVIEW_MATRIX.json
          docs/roadmap/ARCHITECTURE_CLOSURE.json
          docs/roadmap/NEXT_MILESTONE.json
          docs/status/GAP_REGISTER.json
          scripts/check-independent-review-matrix.py
          scripts/check-plan-v3-extension.py
          scripts/check-status-transitions.py
          scripts/control_baselines/gap-register.v1.json
          scripts/gap_register_scope_policy.py
          scripts/status_transition_policy.py
          tests/control_plane/test_gap_register_scope_lock.py
          tests/control_plane/test_independent_review_matrix.py
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/allowed-files"
          LC_ALL=C sort -o "$RUNNER_TEMP/allowed-files" "$RUNNER_TEMP/allowed-files"
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual-patch-files"
          diff -u "$RUNNER_TEMP/allowed-files" "$RUNNER_TEMP/actual-patch-files"

          rm -f \
            .github/workflows/tmp-apply-v32-candidate-authority.yml \
            "$part0" \
            "$part1"
          rmdir .tmp/v32-candidate-authority 2>/dev/null || true
          rmdir .tmp 2>/dev/null || true
          git diff --check
          git diff --name-only | LC_ALL=C sort

      - name: Validate final tree without temporary carrier
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test ! -e .github/workflows/tmp-apply-v32-candidate-authority.yml
          test ! -e .tmp/v32-candidate-authority/patch.gz.b64.part-00
          test ! -e .tmp/v32-candidate-authority/patch.gz.b64.part-01
          python3 -m compileall -q scripts tests
          python3 scripts/gap_register_scope_policy.py
          python3 scripts/check-gap-register.py
          python3 scripts/check-independent-review-matrix.py
          python3 scripts/check-plan-v3-extension.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest -v \
            tests.control_plane.test_gap_register_scope_lock \
            tests.control_plane.test_gap_register \
            tests.control_plane.test_architecture_closure \
            tests.control_plane.test_independent_review_matrix \
            tests.control_plane.test_independent_review_domain_contract \
            tests.control_plane.test_independent_review_domain_integration \
            tests.control_plane.test_status_transition_policy \
            tests.control_plane.test_branch_inventory \
            tests.control_plane.test_workspace_convergence \
            tests.control_plane.test_required_workflow_source_contract \
            tests.control_plane.test_workflow_action_policy
