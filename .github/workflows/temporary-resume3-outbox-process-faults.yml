name: temporary-resume3-outbox-process-faults

on:
  push:
    branches:
      - codex/outbox-process-faults-2026-08-31

permissions:
  contents: write

concurrency:
  group: temporary-resume3-outbox-process-faults
  cancel-in-progress: false

jobs:
  repair-retry-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply process-fault slice and bounded database retry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temporary-outbox-process-faults.yml')
          source = workflow.read_text(encoding='utf-8')
          scenario = source.index("scenario2 = r'''", source.index("script = Path("))
          token = source.index('set +e', scenario)
          start = source.rfind('\n', scenario, token) + 1
          assertion = source.index('test "$crash_status" -eq 70', token)
          end = source.index('\n', assertion) + 1
          indent = source[start:token]
          replacement = (
              f'{indent}if "$worker_bin" run-once \\\n'
              f'{indent}  >"$evidence/worker-crash.stdout" \\\n'
              f'{indent}  2>"$evidence/worker-crash.stderr"; then\n'
              f'{indent}  echo \'expected post-delivery worker exit did not occur\' >&2\n'
              f'{indent}  exit 1\n'
              f'{indent}else\n'
              f'{indent}  crash_status=$?\n'
              f'{indent}fi\n'
              f'{indent}test "$crash_status" -eq 70\n'
          )
          source = source[:start] + replacement + source[end:]
          marker = "          python3 - <<'PY'\n"
          patch_start = source.index(marker) + len(marker)
          patch_end = source.index("\n          PY\n", patch_start)
          Path('/tmp/apply-outbox-process-faults.py').write_text(
              textwrap.dedent(source[patch_start:patch_end]) + '\n',
              encoding='utf-8',
          )
          PY
          python3 -m py_compile /tmp/apply-outbox-process-faults.py
          python3 /tmp/apply-outbox-process-faults.py

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs')
          source = path.read_text(encoding='utf-8')

          def replace(old: str, new: str, expected: int = 1) -> None:
              global source
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f'{path}: expected {expected} anchors, found {count} for {old!r}'
                  )
              source = source.replace(old, new, expected)

          replace(
              'use trnm_contracts::{Digest32, DomainError};\n',
              'use trnm_contracts::{Digest32, DomainError, RetryClass};\n',
          )
          replace(
              'const TEST_FAIL_AFTER_DELIVERY_EXIT_CODE: i32 = 70;\n',
              'const TEST_FAIL_AFTER_DELIVERY_EXIT_CODE: i32 = 70;\n'
              'const DATABASE_RETRY_MAX_ATTEMPTS: u8 = 5;\n'
              'const DATABASE_RETRY_INITIAL_BACKOFF_MS: u64 = 5;\n'
              'const DATABASE_RETRY_MAX_BACKOFF_MS: u64 = 100;\n',
          )
          signature = '''fn process_once(
              pool: &PgPool,
              sink: &SpoolSink,
              config: &WorkerConfig,
          ) -> Result<BatchReport, WorkerError> {
          '''
          attempt_signature = signature.replace('fn process_once(', 'fn process_once_attempt(')
          wrapper = '''fn process_once(
              pool: &PgPool,
              sink: &SpoolSink,
              config: &WorkerConfig,
          ) -> Result<BatchReport, WorkerError> {
              let mut attempt = 0_u8;
              let mut backoff_ms = DATABASE_RETRY_INITIAL_BACKOFF_MS;
              loop {
                  attempt = attempt.saturating_add(1);
                  match process_once_attempt(pool, sink, config) {
                      Ok(report) => return Ok(report),
                      Err(WorkerError::Domain(error))
                          if retryable_database_error(error.retry())
                              && attempt < DATABASE_RETRY_MAX_ATTEMPTS =>
                      {
                          eprintln!(
                              "trnm-outbox-worker retrying database unit code={} retry={:?} attempt={}",
                              error.code().as_str(),
                              error.retry(),
                              attempt,
                          );
                          thread::sleep(Duration::from_millis(backoff_ms));
                          backoff_ms = backoff_ms
                              .saturating_mul(2)
                              .min(DATABASE_RETRY_MAX_BACKOFF_MS);
                      }
                      Err(error) => return Err(error),
                  }
              }
          }

          const fn retryable_database_error(retry: RetryClass) -> bool {
              matches!(retry, RetryClass::SafeImmediate | RetryClass::SafeBackoff)
          }

          '''
          replace(signature, wrapper + attempt_signature)

          test_anchor = '''    #[test]
              fn post_delivery_failpoint_requires_two_explicit_guards() {
          '''
          test_block = '''    #[test]
              fn database_unit_retry_policy_is_bounded_and_classified() {
                  assert_eq!(DATABASE_RETRY_MAX_ATTEMPTS, 5);
                  assert!(DATABASE_RETRY_INITIAL_BACKOFF_MS > 0);
                  assert!(DATABASE_RETRY_INITIAL_BACKOFF_MS <= DATABASE_RETRY_MAX_BACKOFF_MS);
                  assert!(retryable_database_error(RetryClass::SafeImmediate));
                  assert!(retryable_database_error(RetryClass::SafeBackoff));
                  assert!(!retryable_database_error(RetryClass::Never));
                  assert!(!retryable_database_error(RetryClass::ResyncRequired));
              }

          '''
          replace(test_anchor, test_block + test_anchor)
          path.write_text(source, encoding='utf-8')

          docs = Path('docs/development/OUTBOX_SPOOL_WORKER.md')
          text = docs.read_text(encoding='utf-8')
          anchor = '''- Retry delay is deterministic per intent/owner/generation and lies between half and
            all of the capped exponential backoff.
          '''
          replacement = anchor + '''- A complete claim → durable spool → acknowledgement unit retries only explicit
            `SafeImmediate`/`SafeBackoff` database failures, with five attempts and a
            5–100 ms bounded exponential delay. Stable spool bytes make retries after a
            committed file write idempotent.
          '''
          if text.count(anchor) != 1:
              raise SystemExit(
                  f'{docs}: expected one retry paragraph, found {text.count(anchor)}'
              )
          docs.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

          rm -f \
            .github/workflows/temporary-outbox-process-faults.yml \
            .github/workflows/temporary-resume-outbox-process-faults.yml \
            .github/workflows/temporary-resume2-outbox-process-faults.yml \
            .github/workflows/temporary-resume3-outbox-process-faults.yml
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*outbox*' -print -quit)"
          git diff --check
          bash -n scripts/ci-outbox-spool-worker.sh

      - name: Validate complete source corpus
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-rust-package-inventory.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Execute PostgreSQL process-fault matrix
        shell: bash
        run: |
          set -euo pipefail
          TRNM_POSTGRES_IMAGE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('config/database-test-images.json').read_text())['profiles']['postgresql']['image'])
          PY
          )
          export TRNM_POSTGRES_IMAGE
          export TRNM_EVIDENCE_ROOT=/tmp/outbox-process-evidence
          export TRNM_RUN_ID="process-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-postgresql"
          bash scripts/ci-outbox-spool-worker.sh postgresql

      - name: Execute CockroachDB process-fault matrix
        shell: bash
        run: |
          set -euo pipefail
          TRNM_COCKROACH_IMAGE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('config/database-test-images.json').read_text())['profiles']['cockroachdb']['image'])
          PY
          )
          export TRNM_COCKROACH_IMAGE
          export TRNM_EVIDENCE_ROOT=/tmp/outbox-process-evidence
          export TRNM_RUN_ID="process-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cockroachdb"
          bash scripts/ci-outbox-spool-worker.sh cockroachdb

      - name: Commit only fully verified process-fault implementation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*outbox*' -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "test(outbox): prove process exit reclaim and claim exclusion"
          git push origin "HEAD:${GITHUB_REF_NAME}"
