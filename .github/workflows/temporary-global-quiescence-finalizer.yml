name: temporary-global-quiescence-finalizer

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-outbox-dispatch-closure
  cancel-in-progress: false

jobs:
  finalize-quiescent-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Fetch exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Require a quiet branch and complete source frontier
        shell: bash
        run: |
          set -euo pipefail
          sleep 45
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          if test "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA"; then
            echo "branch advanced; a later push will retrigger this finalizer"
            exit 0
          fi
          required=(
            crates/trnm-persistence-pg/src/outbox_dispatch.rs
            crates/trnm-persistence-pg/src/outbox_worker.rs
            crates/trnm-persistence-pg/tests/outbox_dispatch.rs
            .github/workflows/pg-outbox-dispatch.yml
          )
          missing=0
          for path in "${required[@]}"; do
            if ! test -f "$path"; then
              echo "waiting for source frontier: $path"
              missing=1
            fi
          done
          if test "$missing" = 1; then
            exit 0
          fi
          printf 'ready\n' > /tmp/quiescence-ready

      - name: Remove all temporary writers and validate
        if: ${{ hashFiles('/tmp/quiescence-ready') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) \
            -print -delete
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Push clean stable candidate
        if: ${{ hashFiles('/tmp/quiescence-ready') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore(ci): remove temporary gap-closure writers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
