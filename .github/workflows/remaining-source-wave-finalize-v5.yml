name: remaining-source-wave-finalize-v5

on:
  push:
    branches: [tooling/remaining-source-wave-compose-v4-2026-09-06a]
    paths:
      - '.github/workflows/remaining-source-wave-finalize-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remaining-source-wave-finalize-v5
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CANDIDATE_BRANCH: codex/branch-evidence-closure-2026-09-02
      OUTBOX_BRANCH: codex/outbox-property-coverage-2026-09-06
      SESSION_BRANCH: codex/session-revocation-fanout-2026-09-06
      REALTIME_BRANCH: codex/realtime-control-models-2026-09-06
      CRYPTO_BRANCH: codex/crypto-key-lifecycle-2026-09-06
      MIGRATION_BRANCH: codex/migration-fence-control-2026-09-06
      SERVER_BRANCH: codex/trnm-server-composition-root-2026-09-06
      PRODUCT_BRANCH: codex/remaining-source-blockers-wave-v4-2026-09-06a
      BASELINE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TERM_COLOR: always
    steps:
      - name: Fetch strengthened exact source heads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --prune origin \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/source/candidate" \
            "+refs/heads/${OUTBOX_BRANCH}:refs/remotes/source/outbox" \
            "+refs/heads/${SESSION_BRANCH}:refs/remotes/source/session" \
            "+refs/heads/${REALTIME_BRANCH}:refs/remotes/source/realtime" \
            "+refs/heads/${CRYPTO_BRANCH}:refs/remotes/source/crypto" \
            "+refs/heads/${MIGRATION_BRANCH}:refs/remotes/source/migration" \
            "+refs/heads/${SERVER_BRANCH}:refs/remotes/source/server"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags origin \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/source/product" \
            2>/dev/null || true
          for ref in candidate outbox session realtime crypto migration server; do
            sha=$(git -C "$GITHUB_WORKSPACE/source" rev-parse "refs/remotes/source/${ref}")
            tree=$(git -C "$GITHUB_WORKSPACE/source" rev-parse "refs/remotes/source/${ref}^{tree}")
            printf '%s=%s tree=%s\n' "$ref" "$sha" "$tree"
            git -C "$GITHUB_WORKSPACE/source" merge-base --is-ancestor \
              "$BASELINE" "refs/remotes/source/${ref}"
          done
          git -C "$GITHUB_WORKSPACE/source" cat-file -e \
            'refs/remotes/source/outbox:crates/trnm-persistence-core/tests/outbox_state_model.rs'
          git -C "$GITHUB_WORKSPACE/source" cat-file -e \
            'refs/remotes/source/session:crates/trnm-presence-router-v2/src/session_registry.rs'
          git -C "$GITHUB_WORKSPACE/source" show \
            'refs/remotes/source/realtime:crates/trnm-presence-router-v2/src/disconnect_journal.rs' \
            | grep -qF 'pub struct DisconnectReceipt'
          git -C "$GITHUB_WORKSPACE/source" show \
            'refs/remotes/source/realtime:crates/trnm-presence-router-v2/src/reconnect_cursor.rs' \
            | grep -qF 'CursorExpired'
          git -C "$GITHUB_WORKSPACE/source" show \
            'refs/remotes/source/crypto:crates/trnm-token-crypto-provider/src/key_domain.rs' \
            | grep -qF 'pub struct DomainKeyEpochRegistry'
          git -C "$GITHUB_WORKSPACE/source" show \
            'refs/remotes/source/crypto:crates/trnm-token-crypto-provider/src/signer_journal.rs' \
            | grep -qF 'pub key_domain: KeyDomain'
          git -C "$GITHUB_WORKSPACE/source" show \
            'refs/remotes/source/migration:crates/trnm-persistence-core/src/migration_fence.rs' \
            | grep -qF 'pub fn resume_after_rollback'
          git -C "$GITHUB_WORKSPACE/source" show \
            'refs/remotes/source/migration:crates/trnm-persistence-core/src/migration_fence.rs' \
            | grep -qF 'source_read_only_receipt'
          git -C "$GITHUB_WORKSPACE/source" show \
            'refs/remotes/source/server:crates/trnm-server/src/canonical_main.rs' \
            | grep -qF 'mod runtime;'

      - name: Merge current feature heads into one cumulative line
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/source/product; then
            git checkout -b "$PRODUCT_BRANCH" refs/remotes/source/product
          else
            git checkout -b "$PRODUCT_BRANCH" refs/remotes/source/candidate
          fi

          merge_ref() {
            local ref="$1"
            if git merge-base --is-ancestor "refs/remotes/source/${ref}" HEAD; then
              printf '%s already contained\n' "$ref"
              return 0
            fi
            git merge --no-edit --no-ff "refs/remotes/source/${ref}"
          }

          merge_ref candidate
          merge_ref outbox
          merge_ref session
          if ! git merge-base --is-ancestor refs/remotes/source/realtime HEAD; then
            if ! git merge --no-edit --no-ff refs/remotes/source/realtime; then
              conflicts=$(git diff --name-only --diff-filter=U | LC_ALL=C sort)
              test "$conflicts" = 'crates/trnm-presence-router-v2/src/lib.rs'
              git checkout --ours crates/trnm-presence-router-v2/src/lib.rs
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-presence-router-v2/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          for module in ('connection_actor', 'disconnect_journal', 'reconnect_cursor'):
              if f'mod {module};' not in text:
                  marker = 'mod router;'
                  if text.count(marker) != 1:
                      raise SystemExit(f'module anchor drift for {module}')
                  text = text.replace(marker, f'mod {module};\n' + marker, 1)
          exports = '''

          pub use connection_actor::{
              ConnectionActor, ConnectionActorConfig, ConnectionActorError,
              ConnectionActorState, CorrelationId, InboundFrame, OutboundFrame, PendingRequest,
          };
          pub use disconnect_journal::{
              DisconnectIntentId, DisconnectJournal, DisconnectJournalError,
              DisconnectOperation, DisconnectReceipt, DisconnectRecord, DisconnectState,
              LeaseToken, RetryDisposition, WorkerId,
          };
          pub use reconnect_cursor::{
              ReconnectCursor, ReconnectEvent, ReconnectJournal, ReconnectJournalConfig,
              ReconnectJournalError,
          };
          '''
          if 'pub use connection_actor::' not in text:
              text = text.rstrip() + exports
          elif 'DisconnectReceipt' not in text:
              text = text.replace(
                  'DisconnectOperation,',
                  'DisconnectOperation, DisconnectReceipt,',
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY
              git add crates/trnm-presence-router-v2/src/lib.rs
              git diff --cached --check
              git commit --no-edit
            fi
          fi
          merge_ref crypto
          merge_ref migration
          merge_ref server
          test -z "$(git status --porcelain)"

      - name: Validate root isolated workspaces and control plane
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in \
            crates/trnm-persistence-core/Cargo.toml \
            crates/trnm-presence-router-v2/Cargo.toml \
            crates/trnm-token-crypto-provider/Cargo.toml \
            crates/trnm-server/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          python3 -m compileall -q scripts tools tests
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-plan.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 scripts/check-status-transitions.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          if test -f runtime/go.mod; then
            files=$(find runtime -type f -name '*.go' -print | sort)
            test -n "$files"
            test -z "$(printf '%s\n' "$files" | xargs gofmt -l)"
            (cd runtime && go test ./... -count=1)
            (cd runtime && go test -race ./... -count=1)
            (cd runtime && go vet ./...)
          fi
          test -z "$(git status --porcelain)"

      - name: Publish cumulative source branch
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          printf 'wave_head=%s\nwave_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Preserve no-credit boundary
        shell: bash
        run: |
          printf '%s\n' \
            'cumulative_source_validated=true' \
            'independently_reviewed=false' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false' \
            'cutover_authorized=false' \
            'nakama_retired=false'
