name: exact-head-qualification-transport

on:
  push:
    branches:
      - codex/exact-head-qualification-transport-2026-09-08
    paths:
      - .github/workflows/exact-head-qualification-transport.yml

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: exact-head-qualification-transport
  cancel-in-progress: false

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/architecture-gap-closure-2026-09-08
      TARGET_PR: '116'
    steps:
      - name: Wait for converged target and fetch exact head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          deadline=$((SECONDS + 5400))
          while (( SECONDS < deadline )); do
            head=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/git/ref/heads/${TARGET_BRANCH//\//%2F}" | jq -r '.object.sha')
            cargo=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github.raw+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/contents/Cargo.toml?ref=${head}")
            server=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github.raw+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/contents/crates/trnm-server/Cargo.toml?ref=${head}")
            old_gate_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/contents/crates/trnm-token-jwt-adapter-gate/Cargo.toml?ref=${head}")
            compat_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/contents/crates/trnm-persistence-pg/src/bin/trnm-pg-compat-server.rs?ref=${head}")
            if [[ "$old_gate_status" == 404 && "$compat_status" == 200 ]] \
               && grep -Fq 'crates/trnm-token-jwt-provider-adapter' <<<"$cargo" \
               && grep -Fq 'name = "trnm-server"' <<<"$server"; then
              printf '%s\n' "$head" > "$RUNNER_TEMP/head.txt"
              break
            fi
            sleep 20
          done
          test -s "$RUNNER_TEMP/head.txt"
          head=$(cat "$RUNNER_TEMP/head.txt")
          pr_head=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/pulls/${TARGET_PR}" | jq -r '.head.sha')
          test "$pr_head" = "$head"

          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$head"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$head"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Wait for exact-head workflows and retry terminal failures once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          head=$(cat "$RUNNER_TEMP/head.txt")
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('docs/governance/REQUIRED_WORKFLOWS_V1.json').read_text())
          rows = manifest.get('workflows') or manifest.get('required_workflows') or manifest.get('families')
          if not isinstance(rows, list) or not rows:
              raise SystemExit('required workflow manifest has no rows')
          names=[]
          for row in rows:
              if isinstance(row, str):
                  names.append(row)
              elif isinstance(row, dict):
                  value = row.get('name') or row.get('workflow') or row.get('workflow_name') or row.get('path')
                  if not isinstance(value, str) or not value:
                      raise SystemExit(f'unresolved workflow row: {row!r}')
                  names.append(value)
          Path(__import__('os').environ['RUNNER_TEMP'], 'required-workflows.json').write_text(
              json.dumps(sorted(set(names))) + '\n'
          )
          PY

          retried="$RUNNER_TEMP/retried.txt"
          : > "$retried"
          deadline=$((SECONDS + 7200))
          while (( SECONDS < deadline )); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/actions/runs?head_sha=${head}&event=pull_request&per_page=100" \
              > "$RUNNER_TEMP/runs.json"
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          required=json.loads(Path(os.environ['RUNNER_TEMP'],'required-workflows.json').read_text())
          runs=json.loads(Path(os.environ['RUNNER_TEMP'],'runs.json').read_text()).get('workflow_runs',[])
          def keys(run):
              path=(run.get('path') or '').split('/')[-1]
              stem=path.rsplit('.',1)[0]
              return {run.get('name',''), path, stem}
          latest={}
          for requirement in required:
              candidates=[r for r in runs if requirement in keys(r) or requirement.split('/')[-1] in keys(r)]
              candidates.sort(key=lambda r:(r.get('run_number',0),r.get('run_attempt',0)),reverse=True)
              latest[requirement]=candidates[0] if candidates else None
          summary={'missing':[], 'active':[], 'success':[], 'failed':[], 'action_required':[]}
          for requirement,run in latest.items():
              if run is None:
                  summary['missing'].append(requirement); continue
              status=run.get('status'); conclusion=run.get('conclusion')
              if status!='completed': summary['active'].append({'requirement':requirement,'id':run['id'],'status':status})
              elif conclusion=='success': summary['success'].append({'requirement':requirement,'id':run['id']})
              elif conclusion=='action_required': summary['action_required'].append({'requirement':requirement,'id':run['id']})
              else: summary['failed'].append({'requirement':requirement,'id':run['id'],'conclusion':conclusion})
          Path(os.environ['RUNNER_TEMP'],'workflow-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          PY
            cat "$RUNNER_TEMP/workflow-summary.json"
            jq -r '.failed[].id' "$RUNNER_TEMP/workflow-summary.json" | while read -r run_id; do
              [[ -n "$run_id" ]] || continue
              if ! grep -Fxq "$run_id" "$retried"; then
                code=$(curl --silent --show-error --output "$RUNNER_TEMP/rerun-${run_id}.txt" --write-out '%{http_code}' \
                  -X POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "${api}/actions/runs/${run_id}/rerun-failed-jobs")
                [[ "$code" == 201 || "$code" == 202 ]] || { cat "$RUNNER_TEMP/rerun-${run_id}.txt" >&2; exit 1; }
                printf '%s\n' "$run_id" >> "$retried"
              fi
            done
            if jq -e '
              (.missing|length)==0 and (.active|length)==0 and
              (.failed|length)==0 and (.action_required|length)==0
            ' "$RUNNER_TEMP/workflow-summary.json" >/dev/null; then
              break
            fi
            sleep 20
          done
          jq -e '
            (.missing|length)==0 and (.active|length)==0 and
            (.failed|length)==0 and (.action_required|length)==0 and
            (.success|length)>0
          ' "$RUNNER_TEMP/workflow-summary.json" >/dev/null

      - name: Run closed exact-head collector and retain report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          head=$(cat "$RUNNER_TEMP/head.txt")
          mkdir -p run/exact-head-qualification
          output=$(python3 scripts/check-required-workflow-runs.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$head" \
            --current-run-id "$GITHUB_RUN_ID" \
            --manifest docs/governance/REQUIRED_WORKFLOWS_V1.json \
            --timeout-seconds 5400 \
            --poll-seconds 15 \
            --stable-polls 3)
          printf '%s\n' "$output" | tee run/exact-head-qualification/collector.log
          receipt=$(printf '%s\n' "$output" | tail -n 1)
          printf '%s\n' "$receipt" | jq -e 'type == "array" and length > 0' >/dev/null
          tree=$(git rev-parse HEAD^{tree})
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg head "$head" \
            --arg tree "$tree" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson workflows "$receipt" \
            '{schema:"trillionnium.exact-head-qualification-candidate.v1",repository:$repository,head:$head,tree:$tree,orchestrator_run_id:$run_id,orchestrator_run_attempt:$run_attempt,workflows:$workflows,claims:{native_workflows_terminal_success:true,independent_acceptance:false,accepted_evidence:false,gap_closed:false,production_ready:false}}' \
            > run/exact-head-qualification/report.json
          (
            cd run/exact-head-qualification
            sha256sum collector.log report.json > SHA256SUMS
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf - collector.log report.json SHA256SUMS | gzip -n > ../exact-head-qualification.tar.gz
          )
          python3 scripts/upload-actions-artifact.py \
            "exact-head-qualification-${head}" \
            run/exact-head-qualification.tar.gz \
            --mime-type application/gzip \
            | tee "$RUNNER_TEMP/artifact-receipt.json"

      - name: Post exact non-acceptance summary to candidate PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          head=$(cat "$RUNNER_TEMP/head.txt")
          tree=$(git rev-parse HEAD^{tree})
          artifact=$(tail -n 1 "$RUNNER_TEMP/artifact-receipt.json")
          body=$(jq -n \
            --arg head "$head" \
            --arg tree "$tree" \
            --arg run "$GITHUB_RUN_ID" \
            --arg artifact "$artifact" \
            '{body:("## Exact-head execution candidate\n\n```text\nhead " + $head + "\ntree " + $tree + "\norchestrator run " + $run + "\n```\n\nThe closed required-workflow collector found a non-empty terminal-success exact-head set and retained a bounded artifact. Artifact receipt:\n\n```json\n" + $artifact + "\n```\n\nThis is execution evidence only. It does not supply conflict-free human review, administrative acceptance, SG1 decisions, production KMS/HA/PITR/endurance, cutover, or retirement authority.\n\n```text\nindependent_acceptance=false\naccepted_evidence=false\nall_gaps_closed=false\nproduction_ready=false\n```" )}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" \
            -d "$body" >/dev/null

      - name: Delete qualification transport branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git push origin --delete codex/exact-head-qualification-transport-2026-09-08 >/dev/null 2>&1 || true
