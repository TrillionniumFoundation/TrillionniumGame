name: storage-http-api-controller-20260909

on:
  push:
    branches:
      - codex/plan-v32-controller-v2-2026-09-09
    paths:
      - .github/workflows/storage-http-api-controller-20260909.yml
      - tools/run_storage_http_transform.py
      - tools/storage_http_transform/**

permissions:
  contents: write
  issues: write

concurrency:
  group: storage-http-api-controller-20260909
  cancel-in-progress: true

jobs:
  compose-validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      TARGET_BRANCH: codex/v32-storage-public-api-2026-09-09
      TARGET_ISSUE: "139"
    steps:
      - name: Fetch exact controller and stable target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for name in controller target; do
            rm -rf "$GITHUB_WORKSPACE/$name"
            git init "$GITHUB_WORKSPACE/$name"
            git -C "$GITHUB_WORKSPACE/$name" remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          done
          git -C "$GITHUB_WORKSPACE/controller" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/controller" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/controller" rev-parse HEAD)" = "$GITHUB_SHA"

          previous=''
          stable=0
          for _ in $(seq 1 8); do
            current=$(git -C "$GITHUB_WORKSPACE/controller" ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
            test -n "$current"
            if [[ "$current" == "$previous" ]]; then
              stable=$((stable + 1))
            else
              previous=$current
              stable=1
            fi
            if [[ "$stable" -ge 2 ]]; then break; fi
            sleep 5
          done
          test "$stable" -ge 2
          printf '%s\n' "$previous" > "$RUNNER_TEMP/original-head"
          git -C "$GITHUB_WORKSPACE/target" fetch --no-tags origin "$previous"
          git -C "$GITHUB_WORKSPACE/target" checkout -b "$TARGET_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)" = "$previous"

      - name: Reconstruct and apply exact storage transform
        shell: bash
        run: |
          set -euo pipefail
          C="$GITHUB_WORKSPACE/controller"
          T="$GITHUB_WORKSPACE/target"
          python3 -m py_compile "$C/tools/run_storage_http_transform.py"
          python3 "$C/tools/run_storage_http_transform.py" "$T"
          git -C "$T" diff --check
          if git -C "$T" diff --name-only | grep -q '^\.github/workflows/'; then
            printf 'storage transform attempted a workflow mutation\n' >&2
            exit 1
          fi

      - name: Validate control plane, Rust, processes and Go
        shell: bash
        run: |
          set -euo pipefail
          T="$GITHUB_WORKSPACE/target"
          cd "$T"
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path crates/trnm-token-jwt-adapter-gate/Cargo.toml
          cargo generate-lockfile --manifest-path crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml

          cargo fmt --all
          cargo fmt --manifest-path crates/trnm-token-jwt-adapter-gate/Cargo.toml
          cargo fmt --manifest-path crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/trnm-token-jwt-adapter-gate/Cargo.toml -- --check
          cargo fmt --manifest-path crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml -- --check

          python3 scripts/check-schema-authority.py
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-production-crypto-paths.py
          python3 scripts/check-auth-provider-composition.py
          python3 scripts/check-single-server-authority.py
          python3 scripts/check-workspace-convergence.py
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -q

          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml; do
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          cargo test -p trnm-persistence-pg \
            --features diagnostic-compat-server \
            --bin trnm-pg-compat-server --locked
          cargo clippy -p trnm-persistence-pg \
            --features diagnostic-compat-server \
            --bin trnm-pg-compat-server --locked -- -D warnings
          bash scripts/check-rust-server-process.sh

          cd runtime
          test -z "$(gofmt -l .)"
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...

      - name: Publish only the fully validated source tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          T="$GITHUB_WORKSPACE/target"
          cd "$T"
          original=$(cat "$RUNNER_TEMP/original-head")
          remote=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test "$remote" = "$original"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            printf 'workflow path entered storage source commit\n' >&2
            exit 1
          fi
          git commit -m 'storage: add authenticated Nakama HTTP API source candidate'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          head=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${TARGET_ISSUE}/comments" \
            -f body="Storage HTTP phase-A source candidate passed complete control-plane/Python, root and isolated Rust all-target strict Clippy/process, diagnostic compatibility server, and Go race/vet before ordinary fast-forward publication to \`${head}\` (tree \`${tree}\`). This adds typed batch read/list/cursor persistence and authenticated HTTP read/write/delete/list composition. Generated storage gRPC, immutable create-time schema, official SDK/oracle differential, independent acceptance and all-gap closure remain separate false facts." >/dev/null
