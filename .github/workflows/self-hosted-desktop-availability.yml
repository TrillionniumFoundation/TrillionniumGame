name: Self-hosted desktop runner availability

on:
  workflow_dispatch:

# This workflow is deliberately manual-only, checks out no source, receives no
# token permission, accepts no user-controlled input, and targets one reviewed
# runner group plus one dedicated label. If either boundary is absent, the job
# remains queued rather than executing on a broader self-hosted fleet.
permissions: {}

concurrency:
  group: self-hosted-desktop-availability
  cancel-in-progress: false

jobs:
  runner-probe:
    name: Desktop runner probe
    runs-on:
      group: desktop
      labels: desktop
    timeout-minutes: 5
    steps:
      - name: Emit bounded acquisition receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = desktop
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          printf 'status=desktop-runner-acquired\nref=refs/heads/main\n'
