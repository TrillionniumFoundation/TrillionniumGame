name: pr190-rustfmt-export

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr190-rustfmt-export-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  TARGET_BRANCH: codex/engineering-contract-remediation-20260912
  TARGET_SHA: 74dfa6acc4cf8536a42b7875ec8c9e89916d393a

jobs:
  rustfmt-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact target without external actions
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git ls-remote "https://github.com/${TARGET_REPOSITORY}.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$TARGET_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${TARGET_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TARGET_SHA"

      - name: Install exact Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1
          rustfmt --version

      - name: Format exact workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --
          cargo fmt --all -- --check
          git diff --check

      - name: Build deterministic formatting packet
        shell: bash
        run: |
          set -euo pipefail
          root="run/pr190-rustfmt"
          mkdir -p "$root/crates/trnm-server/src/runtime"
          mkdir -p "$root/crates/trnm-persistence-pg/src/bin/trnm_server"
          cp crates/trnm-server/src/runtime/app.rs \
            "$root/crates/trnm-server/src/runtime/app.rs"
          cp crates/trnm-persistence-pg/src/bin/trnm_server/app.rs \
            "$root/crates/trnm-persistence-pg/src/bin/trnm_server/app.rs"
          (
            cd "$root"
            find crates -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "run/pr190-rustfmt-${TARGET_SHA}.tar.gz" \
            -C "$root" .
          test -s "run/pr190-rustfmt-${TARGET_SHA}.tar.gz"
          sha256sum "run/pr190-rustfmt-${TARGET_SHA}.tar.gz"

      - name: Retain formatting packet
        id: retained
        uses: ./.github/actions/upload-evidence
        with:
          name: pr190-rustfmt-${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/pr190-rustfmt-${{ env.TARGET_SHA }}.tar.gz
          mime_type: application/gzip

      - name: Verify retained formatting receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained.outputs.artifact_id }}'
          test -n '${{ steps.retained.outputs.sha256 }}'
          test '${{ steps.retained.outputs.size_bytes }}' -gt 0
          printf 'artifact_id=%s\nsha256=%s\nsize_bytes=%s\n' \
            '${{ steps.retained.outputs.artifact_id }}' \
            '${{ steps.retained.outputs.sha256 }}' \
            '${{ steps.retained.outputs.size_bytes }}'
