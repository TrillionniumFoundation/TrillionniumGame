name: world-transition-v1-go

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime/internal/worldtransition/**'
      - 'contracts/world-transition-v1-go-adapter-status.json'
      - 'docs/WORLD_TRANSITION_V1_GO_ADAPTER.md'
      - 'scripts/check-world-transition-v1-go.sh'
      - 'scripts/test-world-transition-v1-go-negative.sh'
      - '.github/workflows/world-transition-v1-go.yml'
  push:
    branches:
      - feature/nakama-authority-world-transition-v1
      - main
    paths:
      - 'runtime/internal/worldtransition/**'
      - 'contracts/world-transition-v1-go-adapter-status.json'
      - 'docs/WORLD_TRANSITION_V1_GO_ADAPTER.md'
      - 'scripts/check-world-transition-v1-go.sh'
      - 'scripts/test-world-transition-v1-go-negative.sh'
      - '.github/workflows/world-transition-v1-go.yml'

permissions:
  contents: read

concurrency:
  group: world-transition-v1-go-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  pure-go-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
          cd "$GITHUB_WORKSPACE"
          go version
      - name: Run focused Go transition gate
        run: bash scripts/check-world-transition-v1-go.sh
      - name: Prove forbidden capabilities and overclaims fail closed
        run: bash scripts/test-world-transition-v1-go-negative.sh
      - name: Run race detector
        working-directory: runtime
        run: go test -race ./internal/worldtransition -count=1
      - name: Record and seal exact source digests
        run: |
          set -euo pipefail
          mkdir -p run/world-transition-v1-go
          sha256sum \
            contracts/world-transition-v1-go-adapter-status.json \
            docs/WORLD_TRANSITION_V1_GO_ADAPTER.md \
            runtime/internal/worldtransition/*.go \
            > run/world-transition-v1-go/SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/world-transition-v1-go-${CANDIDATE_SHA}.tar.gz \
            -C run/world-transition-v1-go .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/world-transition-v1-go-${CANDIDATE_SHA}.tar.gz
          cat run/world-transition-v1-go/SHA256SUMS
