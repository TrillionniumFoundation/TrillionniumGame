name: world-v6-external-final-4de7cc-20260910

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v6-external-final-4de7cc-20260910-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_BASE_SHA: 0f6117a56263bcb5bf89e34b8bcda557a7da2e6d
  WORLD_HEAD_SHA: 4de7cc027116fc1345727a73b604c2f6cf991ca9
  WORLD_HEAD_TREE: 669360375ff589a2d864dedcc68b6407cc47b07d
  WORLD_MERGE_SHA: fe8ef11d86dfc0d2d58deef3d4dc4d6266344a08
  WORLD_MERGE_TREE: 669360375ff589a2d864dedcc68b6407cc47b07d
  WORLD_RUST_TOOLCHAIN: '1.98.1'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  TRNM_WORLD_POSTGRES_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94

jobs:
  qualify:
    name: world-v6/external-required
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Fetch and verify immutable World objects
        shell: bash
        run: |
          set -euo pipefail
          head_dir="$RUNNER_TEMP/world-head"
          merge_dir="$RUNNER_TEMP/world-merge"
          evidence_dir="$RUNNER_TEMP/world-v6-evidence"
          rm -rf "$head_dir" "$merge_dir" "$evidence_dir"
          mkdir -p "$evidence_dir/logs" "$evidence_dir/status"

          git init "$head_dir"
          git -C "$head_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$head_dir" fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C "$head_dir" checkout --detach FETCH_HEAD

          git init "$merge_dir"
          git -C "$merge_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$merge_dir" fetch --no-tags --depth=2 origin "$WORLD_MERGE_SHA"
          git -C "$merge_dir" checkout --detach FETCH_HEAD

          actual_head="$(git -C "$head_dir" rev-parse HEAD)"
          actual_head_tree="$(git -C "$head_dir" rev-parse 'HEAD^{tree}')"
          actual_merge="$(git -C "$merge_dir" rev-parse HEAD)"
          actual_merge_tree="$(git -C "$merge_dir" rev-parse 'HEAD^{tree}')"
          actual_parents="$(git -C "$merge_dir" show -s --format=%P HEAD)"

          test "$actual_head" = "$WORLD_HEAD_SHA"
          test "$actual_head_tree" = "$WORLD_HEAD_TREE"
          test "$actual_merge" = "$WORLD_MERGE_SHA"
          test "$actual_merge_tree" = "$WORLD_MERGE_TREE"
          test "$actual_parents" = "$WORLD_BASE_SHA $WORLD_HEAD_SHA"
          test -z "$(git -C "$head_dir" status --porcelain=v1 --untracked-files=no)"
          test -z "$(git -C "$merge_dir" status --porcelain=v1 --untracked-files=no)"

          {
            printf 'world_repository=%s\n' "$WORLD_REPOSITORY"
            printf 'world_base_sha=%s\n' "$WORLD_BASE_SHA"
            printf 'world_head_sha=%s\n' "$actual_head"
            printf 'world_head_tree=%s\n' "$actual_head_tree"
            printf 'world_merge_sha=%s\n' "$actual_merge"
            printf 'world_merge_tree=%s\n' "$actual_merge_tree"
            printf 'world_merge_parents=%s\n' "$actual_parents"
            printf 'production_authorization=not_granted\n'
          } | tee "$evidence_dir/tuple.txt"

      - name: Install pinned toolchain and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$WORLD_RUST_TOOLCHAIN" \
            --profile minimal --component rustfmt --component clippy
          rustup override set "$WORLD_RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config postgresql-client
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version
          psql --version
          docker version

      - name: Start isolated PostgreSQL databases
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f trnm-world-postgres >/dev/null 2>&1 || true
          docker run -d --rm --name trnm-world-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            "$TRNM_WORLD_POSTGRES_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec trnm-world-postgres pg_isready -U postgres -d postgres; then
              break
            fi
            test "$attempt" -lt 60
            sleep 1
          done
          docker exec trnm-world-postgres createdb -U postgres world_head
          docker exec trnm-world-postgres createdb -U postgres world_merge

      - name: Execute all eight qualification scopes
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/world-v6-evidence"
          failures=0

          run_scope() {
            local object="$1"
            local repository="$2"
            local scope="$3"
            local database="${4:-}"
            local label="${scope}-${object}"
            local log="$evidence_dir/logs/${label}.log"
            local status="$evidence_dir/status/${label}.txt"

            if [[ "$scope" == "package" ]]; then
              find "$repository" -type d -name '__pycache__' -prune -print0 |
                xargs -0 -r rm -rf
              find "$repository" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
            fi

            set +e
            if [[ -n "$database" ]]; then
              (
                cd "$repository"
                export PGDATABASE="$database"
                export TRNM_SETTLEMENT_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:5432/${database}"
                bash scripts/run-trnm-world-v6-qualification-v2.sh "$scope"
              ) 2>&1 | tee "$log"
            else
              (
                cd "$repository"
                bash scripts/run-trnm-world-v6-qualification-v2.sh "$scope"
              ) 2>&1 | tee "$log"
            fi
            local result="${PIPESTATUS[0]}"
            set -e

            if [[ "$result" -eq 0 ]]; then
              printf 'success\n' | tee "$status"
            else
              printf 'failure:%s\n' "$result" | tee "$status"
              ((failures += 1))
            fi
          }

          run_scope head "$RUNNER_TEMP/world-head" truth
          run_scope merge "$RUNNER_TEMP/world-merge" truth
          run_scope head "$RUNNER_TEMP/world-head" source
          run_scope merge "$RUNNER_TEMP/world-merge" source
          run_scope head "$RUNNER_TEMP/world-head" postgres world_head
          run_scope merge "$RUNNER_TEMP/world-merge" postgres world_merge
          run_scope head "$RUNNER_TEMP/world-head" package
          run_scope merge "$RUNNER_TEMP/world-merge" package

          {
            cat "$evidence_dir/tuple.txt"
            for label in \
              truth-head truth-merge source-head source-merge \
              postgres-head postgres-merge package-head package-merge; do
              printf '%s=%s\n' "$label" "$(cat "$evidence_dir/status/${label}.txt")"
            done
            printf 'runner_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'runner_commit=%s\n' "$GITHUB_SHA"
            printf 'runner_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'runner_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'failed_scope_count=%s\n' "$failures"
          } | tee "$evidence_dir/identity.txt"

          {
            printf '## World V6 exact-object qualification\n\n```text\n'
            cat "$evidence_dir/identity.txt"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

          test "$failures" -eq 0
          printf 'WORLD_V6_EXTERNAL_REQUIRED=PASS\n'

      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: docker rm -f trnm-world-postgres >/dev/null 2>&1 || true
