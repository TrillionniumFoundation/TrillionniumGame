name: world-v6-external-final-956462-20260909

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v6-external-final-956462-20260909-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_BASE_SHA: 0f6117a56263bcb5bf89e34b8bcda557a7da2e6d
  WORLD_HEAD_SHA: 956462f95675d3d4db89af03bc4b7cc8c9a3c975
  WORLD_HEAD_TREE: f428550e5cffcf0acb6c6461824290e828a875c7
  WORLD_MERGE_SHA: 36884e1f410ae198edac9fc7692d50f130a91450
  WORLD_MERGE_TREE: f428550e5cffcf0acb6c6461824290e828a875c7
  WORLD_RUST_TOOLCHAIN: '1.98.1'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '1'
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94

jobs:
  qualify:
    name: world-v6/external-required
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Fetch and verify immutable World tuple
        shell: bash
        run: |
          set -euo pipefail
          head_dir="$RUNNER_TEMP/world-head"
          merge_dir="$RUNNER_TEMP/world-merge"
          evidence_dir="$RUNNER_TEMP/world-v6-evidence"
          rm -rf "$head_dir" "$merge_dir" "$evidence_dir"
          mkdir -p "$evidence_dir/logs"

          git init "$head_dir"
          git -C "$head_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$head_dir" fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C "$head_dir" checkout --detach FETCH_HEAD

          git init "$merge_dir"
          git -C "$merge_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$merge_dir" fetch --no-tags --depth=2 origin "$WORLD_MERGE_SHA"
          git -C "$merge_dir" checkout --detach FETCH_HEAD

          actual_head="$(git -C "$head_dir" rev-parse HEAD)"
          actual_head_tree="$(git -C "$head_dir" rev-parse 'HEAD^{tree}')"
          actual_merge="$(git -C "$merge_dir" rev-parse HEAD)"
          actual_merge_tree="$(git -C "$merge_dir" rev-parse 'HEAD^{tree}')"
          actual_parents="$(git -C "$merge_dir" show -s --format=%P HEAD)"

          printf 'actual_head=%s\n' "$actual_head"
          printf 'actual_head_tree=%s\n' "$actual_head_tree"
          printf 'actual_merge=%s\n' "$actual_merge"
          printf 'actual_merge_tree=%s\n' "$actual_merge_tree"
          printf 'actual_merge_parents=%s\n' "$actual_parents"

          test "$actual_head" = "$WORLD_HEAD_SHA"
          test "$actual_head_tree" = "$WORLD_HEAD_TREE"
          test "$actual_merge" = "$WORLD_MERGE_SHA"
          test "$actual_merge_tree" = "$WORLD_MERGE_TREE"
          test "$actual_parents" = "$WORLD_BASE_SHA $WORLD_HEAD_SHA"
          test -z "$(git -C "$head_dir" status --porcelain=v1 --untracked-files=no)"
          test -z "$(git -C "$merge_dir" status --porcelain=v1 --untracked-files=no)"

      - name: Install pinned toolchain and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$WORLD_RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup override set "$WORLD_RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config postgresql-client
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version
          psql --version
          docker version

      - name: Start isolated PostgreSQL databases
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f trnm-world-postgres >/dev/null 2>&1 || true
          docker run -d --rm --name trnm-world-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            "$TRNM_WORLD_POSTGRES_CLIENT_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec trnm-world-postgres pg_isready -U postgres -d postgres; then
              break
            fi
            test "$attempt" -lt 60
            sleep 1
          done
          docker exec trnm-world-postgres createdb -U postgres world_head
          docker exec trnm-world-postgres createdb -U postgres world_merge
          psql -d postgres -Atqc "select datname from pg_database where datname in ('world_head','world_merge') order by datname"

      - name: Qualify head truth
        id: truth_head
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-head"
          bash scripts/run-trnm-world-v6-qualification-v2.sh truth 2>&1 | tee "$RUNNER_TEMP/world-v6-evidence/logs/truth-head.log"

      - name: Qualify merge truth
        id: truth_merge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-merge"
          bash scripts/run-trnm-world-v6-qualification-v2.sh truth 2>&1 | tee "$RUNNER_TEMP/world-v6-evidence/logs/truth-merge.log"

      - name: Qualify head source
        id: source_head
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-head"
          bash scripts/run-trnm-world-v6-qualification-v2.sh source 2>&1 | tee "$RUNNER_TEMP/world-v6-evidence/logs/source-head.log"

      - name: Qualify merge source
        id: source_merge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-merge"
          bash scripts/run-trnm-world-v6-qualification-v2.sh source 2>&1 | tee "$RUNNER_TEMP/world-v6-evidence/logs/source-merge.log"

      - name: Qualify head PostgreSQL
        id: postgres_head
        continue-on-error: true
        shell: bash
        env:
          PGDATABASE: world_head
          TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_head
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-head"
          bash scripts/run-trnm-world-v6-qualification-v2.sh postgres 2>&1 | tee "$RUNNER_TEMP/world-v6-evidence/logs/postgres-head.log"

      - name: Qualify merge PostgreSQL
        id: postgres_merge
        continue-on-error: true
        shell: bash
        env:
          PGDATABASE: world_merge
          TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/world_merge
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-merge"
          bash scripts/run-trnm-world-v6-qualification-v2.sh postgres 2>&1 | tee "$RUNNER_TEMP/world-v6-evidence/logs/postgres-merge.log"

      - name: Qualify head package
        id: package_head
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-head"
          bash scripts/run-trnm-world-v6-qualification-v2.sh package 2>&1 | tee "$RUNNER_TEMP/world-v6-evidence/logs/package-head.log"

      - name: Qualify merge package
        id: package_merge
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-merge"
          bash scripts/run-trnm-world-v6-qualification-v2.sh package 2>&1 | tee "$RUNNER_TEMP/world-v6-evidence/logs/package-merge.log"

      - name: Enforce all exact-tuple outcomes and emit immutable summary
        if: always()
        shell: bash
        env:
          TRUTH_HEAD: ${{ steps.truth_head.outcome }}
          TRUTH_MERGE: ${{ steps.truth_merge.outcome }}
          SOURCE_HEAD: ${{ steps.source_head.outcome }}
          SOURCE_MERGE: ${{ steps.source_merge.outcome }}
          POSTGRES_HEAD: ${{ steps.postgres_head.outcome }}
          POSTGRES_MERGE: ${{ steps.postgres_merge.outcome }}
          PACKAGE_HEAD: ${{ steps.package_head.outcome }}
          PACKAGE_MERGE: ${{ steps.package_merge.outcome }}
        run: |
          set -euo pipefail
          head_dir="$RUNNER_TEMP/world-head"
          merge_dir="$RUNNER_TEMP/world-merge"
          actual_head="$(git -C "$head_dir" rev-parse HEAD)"
          actual_head_tree="$(git -C "$head_dir" rev-parse 'HEAD^{tree}')"
          actual_merge="$(git -C "$merge_dir" rev-parse HEAD)"
          actual_merge_tree="$(git -C "$merge_dir" rev-parse 'HEAD^{tree}')"
          actual_parents="$(git -C "$merge_dir" show -s --format=%P HEAD)"

          {
            printf 'world_repository=%s\n' "$WORLD_REPOSITORY"
            printf 'world_base_sha=%s\n' "$WORLD_BASE_SHA"
            printf 'world_head_sha=%s\n' "$WORLD_HEAD_SHA"
            printf 'world_head_tree=%s\n' "$WORLD_HEAD_TREE"
            printf 'world_merge_sha=%s\n' "$WORLD_MERGE_SHA"
            printf 'world_merge_tree=%s\n' "$WORLD_MERGE_TREE"
            printf 'actual_head=%s\n' "$actual_head"
            printf 'actual_head_tree=%s\n' "$actual_head_tree"
            printf 'actual_merge=%s\n' "$actual_merge"
            printf 'actual_merge_tree=%s\n' "$actual_merge_tree"
            printf 'actual_merge_parents=%s\n' "$actual_parents"
            printf 'truth_head=%s\n' "$TRUTH_HEAD"
            printf 'truth_merge=%s\n' "$TRUTH_MERGE"
            printf 'source_head=%s\n' "$SOURCE_HEAD"
            printf 'source_merge=%s\n' "$SOURCE_MERGE"
            printf 'postgres_head=%s\n' "$POSTGRES_HEAD"
            printf 'postgres_merge=%s\n' "$POSTGRES_MERGE"
            printf 'package_head=%s\n' "$PACKAGE_HEAD"
            printf 'package_merge=%s\n' "$PACKAGE_MERGE"
            printf 'runner_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'runner_commit=%s\n' "$GITHUB_SHA"
            printf 'runner_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'runner_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'production_authorization=not_granted\n'
          } | tee "$RUNNER_TEMP/world-v6-evidence/identity.txt"

          {
            printf '## World V6 immutable qualification tuple\n\n```text\n'
            cat "$RUNNER_TEMP/world-v6-evidence/identity.txt"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for outcome in \
            "$TRUTH_HEAD" "$TRUTH_MERGE" \
            "$SOURCE_HEAD" "$SOURCE_MERGE" \
            "$POSTGRES_HEAD" "$POSTGRES_MERGE" \
            "$PACKAGE_HEAD" "$PACKAGE_MERGE"
          do
            if test "$outcome" != success; then
              failed=1
            fi
          done
          test "$actual_head" = "$WORLD_HEAD_SHA" || failed=1
          test "$actual_head_tree" = "$WORLD_HEAD_TREE" || failed=1
          test "$actual_merge" = "$WORLD_MERGE_SHA" || failed=1
          test "$actual_merge_tree" = "$WORLD_MERGE_TREE" || failed=1
          test "$actual_parents" = "$WORLD_BASE_SHA $WORLD_HEAD_SHA" || failed=1
          test "$failed" -eq 0
          printf 'WORLD_V6_EXTERNAL_REQUIRED=PASS\n'

      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: docker rm -f trnm-world-postgres >/dev/null 2>&1 || true
