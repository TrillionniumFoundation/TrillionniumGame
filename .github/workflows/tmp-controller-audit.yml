name: tmp-controller-audit

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-controller-audit.yml
      - .github/workflows/tmp-*.yml

permissions:
  contents: read
  issues: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  GH_TOKEN: ${{ github.token }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact controller source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Parse YAML and compile embedded Python
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mapfile -t workflows < <(find .github/workflows -maxdepth 1 -type f -name 'tmp-*.yml' -print | LC_ALL=C sort)
          test "${#workflows[@]}" -gt 0
          for workflow in "${workflows[@]}"; do
            ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV.fetch(0)), aliases: true)' "$workflow"
          done
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import textwrap
          from pathlib import Path

          root = Path('.github/workflows')
          failures = []
          names = {}
          python_blocks = 0
          files = sorted(root.glob('tmp-*.yml'))
          forbidden_literals = {
              'pull_request_target': 'untrusted pull_request_target execution',
              'secrets: inherit': 'implicit inherited secrets',
              'administration: write': 'administrator permission in product controller',
              'id-token: write': 'OIDC token permission without an approved provider workflow',
              'gh pr merge': 'controller self-merge',
              'gh pr review --approve': 'controller self-approval',
              'refs/heads/main': 'direct main ref mutation/reference in a temporary writer',
              'production_ready=true': 'manual production claim',
              'production_ready: true': 'manual production claim',
              'cutover_authorized=true': 'manual cutover claim',
              'cutover_authorized: true': 'manual cutover claim',
              'nakama_retired=true': 'manual retirement claim',
              'nakama_retired: true': 'manual retirement claim',
              'all_gaps_closed=true': 'manual gap-closure claim',
              'all_gaps_closed: true': 'manual gap-closure claim',
          }
          block_pattern = re.compile(
              r"python3\s+-\s+[^\n]*<<'PY'\n(.*?)\n\s*PY(?:\n|$)|"
              r"python3\s+-\s+<<'PY'\n(.*?)\n\s*PY(?:\n|$)|"
              r"python3\s+-\s+<<\"PY\"\n(.*?)\n\s*PY(?:\n|$)|"
              r"python3\s+-\s+[^\n]*<<\"PY\"\n(.*?)\n\s*PY(?:\n|$)",
              re.DOTALL,
          )
          simple_pattern = re.compile(
              r"python3\s+-\s+<<'PY'\n(.*?)\n\s*PY(?:\n|$)",
              re.DOTALL,
          )

          for path in files:
              text = path.read_text(encoding='utf-8')
              match = re.search(r'^name:\s*(\S.*)$', text, re.MULTILINE)
              if not match:
                  failures.append(f'{path}: workflow name missing')
              else:
                  name = match.group(1).strip()
                  if name in names:
                      failures.append(f'{path}: duplicate workflow name with {names[name]}: {name}')
                  names[name] = path

              if 'ops/product-wave1-carrier-20260909' not in text:
                  failures.append(f'{path}: controller trigger is not bound to the carrier branch')
              for literal, reason in forbidden_literals.items():
                  if literal in text:
                      # The audit workflow itself contains the deny-list as data.
                      if path.name == 'tmp-controller-audit.yml':
                          continue
                      failures.append(f'{path}: {reason}: {literal}')
              if re.search(r'git\s+push\s+--force(?!-with-lease)', text):
                  failures.append(f'{path}: unguarded force push')
              if re.search(r'git\s+push[^\n]*(?:HEAD:)?(?:refs/heads/)?main(?:\s|$)', text):
                  failures.append(f'{path}: direct main push')

              # Match all quoted PY heredocs and compile them after YAML indentation removal.
              for heredoc in re.finditer(r"python3[^\n]*<<'PY'\n(.*?)\n\s*PY(?:\n|$)", text, re.DOTALL):
                  source = textwrap.dedent(heredoc.group(1))
                  python_blocks += 1
                  try:
                      compile(source, f'{path}:python-block-{python_blocks}', 'exec')
                  except SyntaxError as exc:
                      failures.append(
                          f'{path}: embedded Python syntax error at block {python_blocks}: {exc}'
                      )

          if python_blocks == 0:
              failures.append('no embedded Python blocks discovered')
          if failures:
              raise SystemExit('controller audit failed:\n- ' + '\n- '.join(failures))
          print(f'controller audit passed: workflows={len(files)} python_blocks={python_blocks}')
          PY

      - name: Enforce controller boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ! grep -R --line-number --fixed-strings 'gh pr merge' .github/workflows/tmp-*.yml --exclude=tmp-controller-audit.yml
          ! grep -R --line-number --fixed-strings 'gh pr review --approve' .github/workflows/tmp-*.yml --exclude=tmp-controller-audit.yml
          ! grep -R --line-number --extended-regexp 'git push[[:space:]].*(refs/heads/)?main([[:space:]]|$)' .github/workflows/tmp-*.yml --exclude=tmp-controller-audit.yml
          printf 'Temporary product controllers are syntax-valid and preserve no-approval/no-merge/no-production-claim boundaries.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish failure only
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 129 --repo "$REPOSITORY" --body \
            "Temporary product-controller audit failed in run \`${GITHUB_RUN_ID}\`. No product integration or claim credit may proceed until the carrier definitions are repaired."
