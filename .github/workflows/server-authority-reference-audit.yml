name: server-authority-reference-audit

on:
  push:
    branches: [tooling/remaining-source-wave-v2-2026-09-06]
    paths:
      - '.github/workflows/server-authority-reference-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      BASE_SHA: 7deee4377cff401854647151842c582f038feef1
      OUTBOX_SHA: 4ce383a55d76a8b2b05827c5017b36f9789c02bd
      SESSION_SHA: 0d0f246a131902403202afcd28103f22af30c8a9
      REALTIME_SHA: 4a72ecdb9341faa9c5211b3479f58d075f75a7ba
      SERVER_SHA: 9ef64a8b93b52808bbbde0acaf74c382e6b4b15f
      HARDENING_SHA: f3e9476ff8b6d781b61ad35c135041eddddcfcff
    steps:
      - name: Assemble exact cumulative tree and enumerate stale authority references
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/source"
          rm -rf "$source"
          git init "$source"
          git -C "$source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$source" fetch --no-tags origin \
            "$BASE_SHA:refs/remotes/source/base" \
            "$OUTBOX_SHA:refs/remotes/source/outbox" \
            "$SESSION_SHA:refs/remotes/source/session" \
            "$REALTIME_SHA:refs/remotes/source/realtime" \
            "$SERVER_SHA:refs/remotes/source/server" \
            "$HARDENING_SHA:refs/remotes/source/hardening"
          git -C "$source" checkout --detach "$BASE_SHA"
          cd "$source"
          git diff --binary "$BASE_SHA" refs/remotes/source/outbox -- \
            crates/trnm-persistence-core/tests/outbox_state_model.rs | git apply --3way
          git diff --binary "$BASE_SHA" refs/remotes/source/session -- \
            crates/trnm-presence-router-v2 | git apply --3way
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml
          git show refs/remotes/source/hardening:tools/apply-session-registry-hardening.py.gz.b64 \
            | base64 -d | gzip -dc > "$RUNNER_TEMP/apply-hardening.py"
          python3 "$RUNNER_TEMP/apply-hardening.py" "$source"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/trnm-presence-router-v2/src/session_registry.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '#[derive(Clone, Debug)]\npub struct SessionRouteRegistry {',
              '#[derive(Clone, Debug, Default)]\npub struct SessionRouteRegistry {',
              1,
          )
          start = text.index('\nimpl Default for SessionRouteRegistry {')
          end = text.index('\nimpl SessionRouteRegistry {', start)
          path.write_text(text[:start] + '\n' + text[end:], encoding='utf-8')
          PY
          git diff --binary "$BASE_SHA" refs/remotes/source/realtime -- \
            crates/trnm-presence-router-v2/src/connection_actor.rs \
            crates/trnm-presence-router-v2/src/disconnect_journal.rs \
            crates/trnm-presence-router-v2/src/reconnect_cursor.rs | git apply --3way
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/trnm-presence-router-v2/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'mod router;\nmod session_registry;\nmod types;\n',
              'mod connection_actor;\nmod disconnect_journal;\nmod reconnect_cursor;\nmod router;\nmod session_registry;\nmod types;\n',
              1,
          )
          anchor = 'pub use router::{MutationDisposition, PresenceDelta, PresenceError, PresenceRouter};\n'
          exports = '''pub use connection_actor::{
              ConnectionActor, ConnectionActorConfig, ConnectionActorError, ConnectionActorState,
              CorrelationId, InboundFrame, OutboundFrame, PendingRequest,
          };
          pub use disconnect_journal::{
              DisconnectIntentId, DisconnectJournal, DisconnectJournalError, DisconnectOperation,
              DisconnectRecord, DisconnectState, LeaseToken, RetryDisposition, WorkerId,
          };
          pub use reconnect_cursor::{
              ReconnectCursor, ReconnectEvent, ReconnectJournal, ReconnectJournalConfig,
              ReconnectJournalError,
          };
          '''
          path.write_text(text.replace(anchor, exports + anchor, 1), encoding='utf-8')
          PY
          git diff --binary "$BASE_SHA" refs/remotes/source/server -- crates/trnm-server | git apply --3way
          sed -i 's/[[:space:]]\+$//' crates/trnm-server/README.md

          printf '%s\n' '=== OLD SERVER PATH REFERENCES ==='
          git grep -n -E 'crates/trnm-persistence-pg/src/bin/trnm-server\.rs|crates/trnm-persistence-pg/src/bin/trnm_server' -- . || true
          printf '%s\n' '=== FOUNDATION TARGET REFERENCES ==='
          git grep -n 'trnm-server-foundation' -- . || true
          printf '%s\n' '=== SERVER MANIFEST COMMAND REFERENCES ==='
          git grep -n -E 'trnm-persistence-pg/Cargo\.toml.*trnm-server|--bin trnm-server' -- .github scripts tests docs CONTRIBUTING.md README.md || true
          printf '%s\n' '=== AUTHORITY JSON REFERENCES ==='
          git grep -n -E 'temporary-composition-authority|foundation-prototype|foundation_prototype' -- docs scripts tests .github || true
