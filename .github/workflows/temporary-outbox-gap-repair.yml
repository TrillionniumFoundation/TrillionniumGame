name: temporary-outbox-gap-repair

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: temporary-outbox-gap-closure
  cancel-in-progress: false

jobs:
  repair-validate-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Normalize integration and remove every temporary outbox workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/trnm-persistence-pg/src/lib.rs')
          outbox = Path('crates/trnm-persistence-pg/src/outbox.rs')
          if not outbox.is_file():
              raise SystemExit('outbox implementation is missing')
          source = lib.read_text(encoding='utf-8')
          if 'mod outbox;' not in source:
              if 'mod pool;' in source:
                  source = source.replace('mod pool;\n', 'mod outbox;\nmod pool;\n', 1)
              else:
                  source = source.replace(
                      '#![forbid(unsafe_code)]\n\n',
                      '#![forbid(unsafe_code)]\n\nmod outbox;\n',
                      1,
                  )
          export = 'pub use outbox::{OutboxLease, OutboxRetryOutcome};\n'
          if export not in source:
              pool_export = 'pub use pool::{PgPool, PgPoolConfig, PgPoolSnapshot, PgTlsConfig};\n'
              if pool_export in source:
                  source = source.replace(pool_export, export + pool_export, 1)
              else:
                  source = source.replace('mod outbox;\n', 'mod outbox;\n\n' + export, 1)
          if 'from_database_value' not in source:
              old = '''impl IntentKind {
              const fn database_value(self) -> i16 {
                  self as i16
              }
          }
          '''
              new = '''impl IntentKind {
              const fn database_value(self) -> i16 {
                  self as i16
              }

              const fn from_database_value(value: i16) -> Option<Self> {
                  match value {
                      0 => Some(Self::Broadcast),
                      1 => Some(Self::SearchIndex),
                      2 => Some(Self::Notification),
                      3 => Some(Self::ExternalEffect),
                      4 => Some(Self::Completion),
                      _ => None,
                  }
              }
          }
          '''
              if old not in source:
                  raise SystemExit('IntentKind implementation anchor drifted')
              source = source.replace(old, new, 1)
          lib.write_text(source, encoding='utf-8')
          for path in Path('.github/workflows').glob('temporary-outbox-gap-*.yml'):
              path.unlink()
          PY
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-outbox-gap-*.yml' -print -quit)"
          git diff --check

      - name: Compile and apply only machine-safe formatting fixes
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo check --package trnm-persistence-pg --all-targets
          cargo clippy --package trnm-persistence-pg --all-targets --fix --allow-dirty --allow-staged -- -W clippy::all
          cargo fmt --all
          git diff --check

      - name: Execute strict source and control-plane gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit exact validated source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-outbox-gap-*.yml' -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(pg): add fenced outbox dispatch transitions"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record failure without granting closure credit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          body=$(cat <<EOF
          The temporary outbox integration lane failed for exact source head \`${GITHUB_SHA}\`.

          No gap, stage gate or compatibility claim was promoted. The workflow run is ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. A follow-up must inspect the failed step and push a new exact-head candidate; older-head success receives no credit.
          EOF
          )
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/42/comments" \
            -d "$(python3 -c 'import json,sys; print(json.dumps({"body":sys.stdin.read()}))' <<<"$body")" || true
