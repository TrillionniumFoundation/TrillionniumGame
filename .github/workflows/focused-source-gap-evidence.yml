name: focused-source-gap-evidence

on:
  push:
    branches: [tooling/gap-closure-audit-2026-09-07]
    paths:
      - '.github/workflows/focused-source-gap-evidence.yml'

permissions:
  contents: read
  issues: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_HEAD: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
      TARGET_TREE: 9d3ae2fadb2684f095855ecf16307376b55a440f
      TARGET_MERGE: 6965f95d03031156edc92cc862bd979ff87e9edb
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${TARGET_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin "$TARGET_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = "$TARGET_TREE"
          mkdir -p "$GITHUB_WORKSPACE/source/run/focused-gap-evidence/logs"

      - name: Validate identity and documentation authority
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          {
            python3 scripts/check-documentation-authority.py
            python3 scripts/check-plan.py
            python3 scripts/check-status-transitions.py
            python3 scripts/check-repository-hygiene.py
            python3 scripts/check-rust-package-inventory.py
            test "$(go env GOMOD)" = "$(pwd)/runtime/go.mod" || true
            (cd runtime && go list -m && go test ./... -count=1 && go vet ./...)
          } 2>&1 | tee run/focused-gap-evidence/logs/identity-docs.log

      - name: Validate JWT full-width length and provider gates
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          {
            for manifest in \
              crates/trnm-token-jwt-adapter/Cargo.toml \
              crates/trnm-token-jwt-adapter-gate/Cargo.toml \
              crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml \
              crates/trnm-token-crypto-provider/Cargo.toml \
              crates/trnm-token-jwt-provider-adapter/Cargo.toml; do
              cargo fmt --manifest-path "$manifest" -- --check
              cargo test --manifest-path "$manifest" --all-targets --locked
              cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
            done
          } 2>&1 | tee run/focused-gap-evidence/logs/crypto.log
          python3 - <<'PY'
          from pathlib import Path
          text='\n'.join(path.read_text(encoding='utf-8') for path in Path('crates/trnm-token-jwt-adapter').rglob('*.rs'))
          required=['256', '32']
          missing=[item for item in required if item not in text]
          if missing:
              raise SystemExit('JWT boundary source/test anchors missing: '+','.join(missing))
          PY

      - name: Prove live-database opt-out cannot earn remote credit
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          {
            python3 -m unittest discover -s tests -p 'test_*database*.py' -v
            python3 -m unittest discover -s tests -p 'test_*live*.py' -v
            python3 -m unittest tests.control_plane.test_workflow_gate_integrity -v
            python3 scripts/check-workflow-action-policy.py
            python3 scripts/check-required-workflow-runs.py --help >/dev/null
          } 2>&1 | tee run/focused-gap-evidence/logs/live-test-policy.log
          python3 - <<'PY'
          from pathlib import Path
          workflows='\n'.join(path.read_text(encoding='utf-8') for path in Path('.github/workflows').glob('*.yml'))
          anchors=['postgresql','cockroachdb','required','prospective']
          missing=[item for item in anchors if item not in workflows.lower()]
          if missing:
              raise SystemExit('required live-workflow anchors missing: '+','.join(missing))
          PY

      - name: Build per-gap exact packet
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os
          from pathlib import Path
          root=Path('run/focused-gap-evidence')
          entries=[]
          mapping={
            'GAP-P1-IDENTITY-001':['logs/identity-docs.log'],
            'GAP-P1-DOCS-001':['logs/identity-docs.log'],
            'GAP-P1-CRYPTO-002':['logs/crypto.log'],
            'GAP-P1-TEST-001':['logs/live-test-policy.log'],
          }
          for gap,paths in mapping.items():
              members=[]
              for value in paths:
                  raw=(root/value).read_bytes()
                  members.append({'path':value,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              entries.append({
                  'gap_id':gap,
                  'repository':os.environ['TARGET_REPOSITORY'],
                  'head':os.environ['TARGET_HEAD'],
                  'tree':os.environ['TARGET_TREE'],
                  'prospective_merge':os.environ['TARGET_MERGE'],
                  'members':members,
                  'accepted':False,
                  'gap_closed':False,
              })
          packet={
            'schema':'trillionnium.focused-source-gap-evidence.v1',
            'entries':entries,
            'limitations':[
              'This packet proves only the named source/test boundaries on the exact candidate.',
              'Independent role-appropriate review and ordinary evidence admission remain required.',
              'It grants no complete compatibility, production, public-online, cutover or retirement credit.',
            ],
          }
          (root/'packet.json').write_text(json.dumps(packet,sort_keys=True,separators=(',',':'))+'\n')
          PY
          (
            cd run/focused-gap-evidence
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf run/focused-source-gap-evidence-${TARGET_HEAD}.tar.gz \
            -C run/focused-gap-evidence .

      - name: Retain focused source-gap packet
        id: retained
        uses: ./source/.github/actions/upload-evidence
        with:
          name: focused-source-gap-evidence-${{ env.TARGET_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/run/focused-source-gap-evidence-${{ env.TARGET_HEAD }}.tar.gz
          mime_type: application/gzip

      - name: Publish focused review handoff
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ steps.retained.outputs.sha256 }}
          ARTIFACT_SIZE: ${{ steps.retained.outputs.size_bytes }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"; test -n "$ARTIFACT_SHA256"; test "$ARTIFACT_SIZE" -gt 0
          body=$(cat <<EOF
          ## Focused exact-head source-gap packet

          Head: \`$TARGET_HEAD\` / tree \`$TARGET_TREE\` / merge \`$TARGET_MERGE\`  
          Run: \`$GITHUB_RUN_ID\` / artifact \`$ARTIFACT_ID\` / \`$ARTIFACT_SHA256\` / \`$ARTIFACT_SIZE\` bytes

          Mapped gaps: \`GAP-P1-IDENTITY-001\`, \`GAP-P1-DOCS-001\`, \`GAP-P1-CRYPTO-002\`, \`GAP-P1-TEST-001\`. The packet contains named command logs and per-member digests. It remains unaccepted pending conflict-free role-appropriate review and evidence admission.
          EOF
          )
          for issue in 63 35 36; do
            curl --fail-with-body --silent --show-error -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$TARGET_REPOSITORY/issues/$issue/comments" \
              -d "$(jq -n --arg body "$body" '{body:$body}')" >/dev/null
          done
