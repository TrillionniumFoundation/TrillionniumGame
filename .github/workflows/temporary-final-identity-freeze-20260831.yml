name: temporary-final-identity-freeze-20260831

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-final-identity-freeze-20260831
  cancel-in-progress: false

jobs:
  verify-clean-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Materialize the final product tree before testing
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name 'temporary-*' -print -delete
          rm -f .github/tmp/add-readiness-probe.py .github/tmp/add-pg-cancel-watchdog.py
          if [[ -d .github/tmp ]]; then
            find .github/tmp -type f -name 'pg-operations-patch.*' -print -delete
            find .github/tmp -depth -type d -empty -delete
          fi
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'temporary-*' -print -quit)"
          git diff --check

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1

      - name: Verify complete Rust corpus
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in crates/trnm-token-jwt-adapter/Cargo.toml crates/trnm-presence-router-v2/Cargo.toml crates/trnm-server/Cargo.toml; do
            [[ -f "$manifest" ]] || continue
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done

      - name: Verify control-plane, Python and Go corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          while IFS= read -r module; do
            directory=${module%/go.mod}
            (
              cd "$directory"
              test -z "$(gofmt -l .)"
              go test ./...
              go test -race ./...
              go vet ./...
            )
          done < <(find . -name go.mod -not -path './.git/*' -print | sed 's#^./##' | sort)

      - name: Commit the clean final tree and bind PR identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trillionnium-gap-closure-bot'
          git config user.email 'gap-closure-bot@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: freeze clean exact-head candidate'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          final_sha=$(git rev-parse HEAD)
          final_tree=$(git rev-parse 'HEAD^{tree}')
          remote_sha=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          test "$remote_sha" = "$final_sha"
          cat >/tmp/pr-body.md <<EOF
          ## Plan-v3 gap-closure candidate

          This integration line is fail-closed and bound to one exact candidate.

          - base: `main`
          - branch: `${GITHUB_REF_NAME}`
          - exact head: `${final_sha}`
          - exact tree: `${final_tree}`
          - final-tree source corpus: root/standalone Rust format, tests and strict Clippy; Python plan/control-plane corpus; every Go module format, tests, race and vet — passed in run `${GITHUB_RUN_ID}` before this exact tree was pushed.

          ### Source remediation present

          - one production schema authority and two explicit database profiles;
          - transactional receipt/event/outbox commit and exact duplicate replay;
          - bounded PG connection pool, acquire/session/statement timeouts and retry jitter;
          - TLS verify-full profile with redacted identity material;
          - deadline-triggered PostgreSQL `CancelToken` watchdog for pooled operations;
          - live database-backed `/readyz` probe with generic public failure response;
          - administrator token redacted from both configuration and application `Debug` output;
          - bounded HTTP/WebSocket source slice, response-loss/restart and dual-profile test lanes;
          - exact-head evidence, denominator candidates and fail-closed gate derivation.

          ### Still required before any compatibility or production claim

          - active `main` ruleset/branch-protection API readback;
          - independent exact-head code, database, protocol, realtime and security review;
          - two independent reviews for every D0–D8 denominator plus a separate SG1 gate review;
          - legal disposition of restricted/manual contracts;
          - completion of mandatory HTTP/gRPC/realtime/runtime/Console/provider/IAP/SDK leaves;
          - accepted migration, HA, performance, security, endurance, canary, rollback and retirement evidence.

          No source presence, self-review, skipped/old-head run or workflow definition grants SG1–SG9, C1–C5, Nakama compatibility, production readiness, public-online, drop-in replacement or retirement credit.
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pr-body.md')
          lines=p.read_text().splitlines()
          indent=min((len(x)-len(x.lstrip()) for x in lines if x.strip()), default=0)
          p.write_text('\n'.join(x[indent:] for x in lines)+'\n')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          body=Path('/tmp/pr-body.md').read_text()
          Path('/tmp/pr-patch.json').write_text(json.dumps({'body':body,'draft':False}))
          PY
          curl --silent --show-error --fail \
            --request PATCH \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @/tmp/pr-patch.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/42" >/tmp/pr-readback.json
          curl --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data '{"reviewers":["ProfHepta"]}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/42/requested_reviewers" >/tmp/reviewer-readback.json || true
          python3 - "$final_sha" "$final_tree" <<'PY'
          import json,sys
          value=json.load(open('/tmp/pr-readback.json'))
          assert value['head']['sha']==sys.argv[1]
          assert value['draft'] is False
          assert sys.argv[1] in value.get('body','')
          assert sys.argv[2] in value.get('body','')
          print(json.dumps({'final_sha':sys.argv[1],'final_tree':sys.argv[2],'pr_identity_verified':True},sort_keys=True))
          PY
