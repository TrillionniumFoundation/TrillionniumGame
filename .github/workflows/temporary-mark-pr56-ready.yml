name: temporary-mark-pr56-ready

on:
  push:
    branches:
      - codex/websocket-persistent-lifecycle-2026-08-31

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-mark-pr56-ready
  cancel-in-progress: false

jobs:
  mark-ready-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact branch without external actions
        shell: bash
        env:
          BRANCH: codex/websocket-persistent-lifecycle-2026-08-31
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git -C "$GITHUB_WORKSPACE" checkout -B "$BRANCH" "origin/$BRANCH"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Mark exact pull request ready and read back state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node_id=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/56" --jq .node_id)
          test -n "$node_id"
          gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft headRefOid}}}' \
            -f id="$node_id" \
            --jq '.data.markPullRequestReadyForReview.pullRequest | select(.number == 56 and .isDraft == false and .headRefOid == env.GITHUB_SHA)'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/56" --jq .draft)" = false
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/56" --jq .head.sha)" = "$GITHUB_SHA"
      - name: Remove temporary execution surface and push clean head
        shell: bash
        env:
          BRANCH: codex/websocket-persistent-lifecycle-2026-08-31
        run: |
          set -euo pipefail
          git config user.name "trillionnium-pr-state-finalizer"
          git config user.email "pr-state-finalizer@users.noreply.github.com"
          git rm .github/workflows/temporary-mark-pr56-ready.yml
          git diff --cached --check
          git commit -m "ci: remove PR56 ready-state executor"
          git push origin "HEAD:refs/heads/${BRANCH}"
