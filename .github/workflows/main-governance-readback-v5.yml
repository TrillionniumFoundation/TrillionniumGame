name: main-governance-readback-v5

on:
  push:
    branches: [tooling/gap-closure-audit-2026-09-07]
    paths:
      - '.github/workflows/main-governance-readback-v5.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

env:
  CANDIDATE_HEAD: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
  CANDIDATE_TREE: 9d3ae2fadb2684f095855ecf16307376b55a440f
  BASE_HEAD: d66c1b5b614a2a7b682c233fe2e7a19939b6976b
  PROSPECTIVE_MERGE: 6965f95d03031156edc92cc862bd979ff87e9edb

jobs:
  collect-retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Collect exact governance and PR topology
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/governance-v5"
          mkdir -p "$packet"
          python3 - "$packet" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          packet = Path(sys.argv[1])
          token = os.environ["GH_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          owner, name = repository.split("/", 1)
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trillionnium-governance-readback-v5",
          }

          def request_json(url: str, *, payload: dict | None = None) -> tuple[int, object]:
              data = None if payload is None else json.dumps(payload, separators=(",", ":")).encode()
              request = urllib.request.Request(url, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw.decode()) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      value = json.loads(raw.decode()) if raw else None
                  except Exception:
                      value = {"message": raw.decode(errors="replace")[:2000]}
                  return error.code, value

          def save(name: str, status: int, value: object) -> None:
              (packet / f"{name}.http-status").write_text(f"{status}\n")
              (packet / f"{name}.json").write_text(
                  json.dumps(value, sort_keys=True, indent=2) + "\n"
              )

          api = f"https://api.github.com/repos/{repository}"
          for label, url in {
              "main-branch": f"{api}/branches/main",
              "main-protection": f"{api}/branches/main/protection",
              "rulesets": f"{api}/rulesets?includes_parents=true&per_page=100",
              "main-rules": f"{api}/rules/branches/main",
              "pr63": f"{api}/pulls/63",
              "pr63-reviews": f"{api}/pulls/63/reviews?per_page=100",
              "pr63-comments": f"{api}/pulls/63/comments?per_page=100",
          }.items():
              status, value = request_json(url)
              save(label, status, value)

          topology_query = """
          query($owner:String!,$name:String!,$pr:Int!){
            repository(owner:$owner,name:$name){
              pullRequest(number:$pr){
                id number state isDraft mergeable mergeStateStatus reviewDecision
                baseRefName baseRefOid headRefName headRefOid
                reviewThreads(first:100){
                  totalCount
                  nodes{
                    id isResolved isOutdated path line
                    comments(first:20){totalCount nodes{author{login} body createdAt}}
                  }
                }
                reviews(first:100){
                  totalCount
                  nodes{author{login} state submittedAt commit{oid}}
                }
              }
            }
          }
          """
          protection_query = """
          query($owner:String!,$name:String!){
            repository(owner:$owner,name:$name){
              id nameWithOwner
              defaultBranchRef{name target{... on Commit{oid}}}
              branchProtectionRules(first:100){
                totalCount
                nodes{
                  id pattern allowsDeletions allowsForcePushes dismissesStaleReviews
                  isAdminEnforced requiredApprovingReviewCount requiredStatusCheckContexts
                  requiresApprovingReviews requiresCodeOwnerReviews requiresCommitSignatures
                  requiresConversationResolution requiresLinearHistory requiresStatusChecks
                  requiresStrictStatusChecks restrictsPushes restrictsReviewDismissals
                  bypassForcePushAllowances(first:100){totalCount nodes{actor{__typename ... on User{login} ... on Team{slug organization{login}} ... on App{slug}}}}
                  bypassPullRequestAllowances(first:100){totalCount nodes{actor{__typename ... on User{login} ... on Team{slug organization{login}} ... on App{slug}}}}
                  pushAllowances(first:100){totalCount nodes{actor{__typename ... on User{login} ... on Team{slug organization{login}} ... on App{slug}}}}
                  reviewDismissalAllowances(first:100){totalCount nodes{actor{__typename ... on User{login} ... on Team{slug organization{login}} ... on App{slug}}}}
                }
              }
            }
          }
          """
          for label, query, variables in (
              ("graphql-pr63-topology", topology_query, {"owner": owner, "name": name, "pr": 63}),
              ("graphql-branch-protection", protection_query, {"owner": owner, "name": name}),
          ):
              status, value = request_json(
                  "https://api.github.com/graphql",
                  payload={"query": query, "variables": variables},
              )
              save(label, status, value)

          for ref in ("main", os.environ["CANDIDATE_HEAD"]):
              safe_ref = ref.replace("/", "_").replace(":", "_")
              for source_path in (".github/CODEOWNERS", "CODEOWNERS", "docs/CODEOWNERS"):
                  encoded_path = "/".join(urllib.parse.quote(part, safe="") for part in source_path.split("/"))
                  encoded_ref = urllib.parse.quote(ref, safe="")
                  status, value = request_json(f"{api}/contents/{encoded_path}?ref={encoded_ref}")
                  label = f"codeowners-{safe_ref}-{source_path.replace('/', '_')}"
                  save(label, status, value)

          pr_status = int((packet / "pr63.http-status").read_text())
          if pr_status != 200:
              raise SystemExit(f"PR #63 REST read failed with {pr_status}")
          pr = json.loads((packet / "pr63.json").read_text())
          expected = {
              "head": os.environ["CANDIDATE_HEAD"],
              "base": os.environ["BASE_HEAD"],
              "merge": os.environ["PROSPECTIVE_MERGE"],
          }
          observed = {
              "head": pr["head"]["sha"],
              "base": pr["base"]["sha"],
              "merge": pr["merge_commit_sha"],
          }
          if observed != expected:
              raise SystemExit(f"candidate identity drift: expected={expected} observed={observed}")

          topology = json.loads((packet / "graphql-pr63-topology.json").read_text())
          topology_pr = (((topology.get("data") or {}).get("repository") or {}).get("pullRequest") or {})
          threads = ((topology_pr.get("reviewThreads") or {}).get("nodes") or [])
          reviews = json.loads((packet / "pr63-reviews.json").read_text())
          protection = json.loads((packet / "graphql-branch-protection.json").read_text())
          protection_rules = ((((protection.get("data") or {}).get("repository") or {}).get("branchProtectionRules") or {}).get("nodes") or [])
          main_rules = [row for row in protection_rules if row.get("pattern") == "main"]
          readback = {
              "schema": "trillionnium.main-governance-access-readback.v5",
              "repository": repository,
              "candidate": {
                  "head": os.environ["CANDIDATE_HEAD"],
                  "tree": os.environ["CANDIDATE_TREE"],
                  "base": os.environ["BASE_HEAD"],
                  "prospective_merge": os.environ["PROSPECTIVE_MERGE"],
              },
              "rest": {
                  "main_summary_http": int((packet / "main-branch.http-status").read_text()),
                  "main_protection_http": int((packet / "main-protection.http-status").read_text()),
                  "rulesets_http": int((packet / "rulesets.http-status").read_text()),
                  "main_rules_http": int((packet / "main-rules.http-status").read_text()),
              },
              "graphql": {
                  "topology_http": int((packet / "graphql-pr63-topology.http-status").read_text()),
                  "protection_http": int((packet / "graphql-branch-protection.http-status").read_text()),
                  "main_rule_count": len(main_rules),
                  "main_rules": main_rules,
              },
              "pr63": {
                  "state": topology_pr.get("state"),
                  "is_draft": topology_pr.get("isDraft"),
                  "mergeable": topology_pr.get("mergeable"),
                  "merge_state_status": topology_pr.get("mergeStateStatus"),
                  "review_decision": topology_pr.get("reviewDecision"),
                  "head": topology_pr.get("headRefOid"),
                  "base": topology_pr.get("baseRefOid"),
                  "thread_count": len(threads),
                  "unresolved_current_threads": sum(
                      not row.get("isResolved") and not row.get("isOutdated") for row in threads
                  ),
                  "current_head_approved": sum(
                      row.get("state") == "APPROVED" and row.get("commit_id") == os.environ["CANDIDATE_HEAD"]
                      for row in reviews
                  ),
                  "current_head_changes_requested": sum(
                      row.get("state") == "CHANGES_REQUESTED" and row.get("commit_id") == os.environ["CANDIDATE_HEAD"]
                      for row in reviews
                  ),
              },
              "admin_token_secret_available": False,
              "negative_enforcement_rehearsal_executed": False,
              "independent_governance_acceptance_required": True,
              "accepted_evidence": False,
              "gap_closed": False,
              "production_ready": False,
          }
          (packet / "readback.json").write_text(json.dumps(readback, sort_keys=True, indent=2) + "\n")
          members = []
          for path in sorted(p for p in packet.rglob("*") if p.is_file() and p.name not in {"manifest.json", "files.sha256"}):
              raw = path.read_bytes()
              members.append({
                  "path": path.relative_to(packet).as_posix(),
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })
          (packet / "manifest.json").write_text(json.dumps({
              "schema": "trillionnium.main-governance-access-packet.v5",
              "repository": repository,
              "members": members,
              "accepted_evidence": False,
              "gap_closed": False,
              "production_ready": False,
          }, sort_keys=True, indent=2) + "\n")
          PY
          (cd "$packet" && find . -type f ! -path './files.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > files.sha256 && sha256sum --check files.sha256)
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP" -czf "$GITHUB_WORKSPACE/main-governance-readback-v5.tar.gz" governance-v5
          sha256sum "$GITHUB_WORKSPACE/main-governance-readback-v5.tar.gz" > "$GITHUB_WORKSPACE/main-governance-readback-v5.tar.gz.sha256"
          cp "$packet/readback.json" "$GITHUB_WORKSPACE/main-governance-readback-v5.json"

      - name: Install exact candidate uploader and transport
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/source" fetch --no-tags --depth=1 origin "$CANDIDATE_HEAD"
          git -C "$RUNNER_TEMP/source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git -C "$RUNNER_TEMP/source" rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          mkdir -p "$GITHUB_WORKSPACE/.github" "$GITHUB_WORKSPACE/scripts"
          cp -a "$RUNNER_TEMP/source/.github/actions" "$GITHUB_WORKSPACE/.github/"
          cp "$RUNNER_TEMP/source/scripts/upload-actions-artifact.py" "$GITHUB_WORKSPACE/scripts/"

      - name: Retain exact governance access packet
        id: upload
        uses: ./.github/actions/upload-evidence
        with:
          name: main-governance-readback-v5-${{ env.CANDIDATE_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: main-governance-readback-v5.tar.gz
          mime_type: application/gzip

      - name: Publish locator to governance issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n '${{ steps.upload.outputs.artifact_id }}'
          test -n '${{ steps.upload.outputs.sha256 }}'
          test '${{ steps.upload.outputs.size_bytes }}' -gt 0
          packet_digest=$(cut -d' ' -f1 main-governance-readback-v5.tar.gz.sha256)
          readback=$(jq -c . main-governance-readback-v5.json)
          body=$(cat <<EOF
          Exact PR #63 topology and governance access-boundary packet:

          - candidate: \`$CANDIDATE_HEAD\`, tree \`$CANDIDATE_TREE\`
          - base: \`$BASE_HEAD\`; prospective merge: \`$PROSPECTIVE_MERGE\`
          - run: \`$GITHUB_RUN_ID\`, attempt \`$GITHUB_RUN_ATTEMPT\`
          - artifact: \`${{ steps.upload.outputs.artifact_id }}\`
          - native receipt SHA-256: \`${{ steps.upload.outputs.sha256 }}\`
          - packet SHA-256: \`$packet_digest\`

          \`\`\`json
          $readback
          \`\`\`

          Full branch-protection administration and the harmless negative enforcement rehearsal remain blocked by the managed installation's administration boundary and the absence of a configured admin-token secret. This grants no governance, evidence, gap, compatibility or production credit without conflict-free acceptance.
          EOF
          )
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/7/comments" --raw-field body="$body"
