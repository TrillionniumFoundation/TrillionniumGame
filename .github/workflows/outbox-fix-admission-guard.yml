name: outbox-fix-admission-guard

on:
  push:
    branches: [tooling/outbox-evidence-sealing-staging-2026-09-07a]
    paths:
      - '.github/workflows/outbox-fix-admission-guard.yml'

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  FIX_BRANCH: fix/outbox-evidence-sealing-2026-09-07
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
  STAGING_BRANCH: tooling/outbox-evidence-sealing-staging-2026-09-07a

jobs:
  audit-review-admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve exact PR and verify base
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          head=$(curl -fsSL "${headers[@]}" "$api/git/ref/heads/${FIX_BRANCH//\//%2F}" | jq -r '.object.sha')
          encoded=$(python3 - <<PY
          import urllib.parse
          print(urllib.parse.quote('${GITHUB_REPOSITORY_OWNER}:${FIX_BRANCH}', safe=''))
          PY
          )
          prs=$(curl -fsSL "${headers[@]}" "$api/pulls?state=open&head=$encoded")
          number=$(jq -r '.[0].number // empty' <<<"$prs")
          test -n "$number"
          base=$(jq -r '.[0].base.ref' <<<"$prs")
          base_sha=$(jq -r '.[0].base.sha' <<<"$prs")
          product=$(curl -fsSL "${headers[@]}" "$api/git/ref/heads/${PRODUCT_BRANCH//\//%2F}" | jq -r '.object.sha')
          test "$base" = "$PRODUCT_BRANCH"
          test "$base_sha" = "$product"
          tree=$(curl -fsSL "${headers[@]}" "$api/git/commits/$head" | jq -r '.tree.sha')
          printf '%s\n' "$number" > "$RUNNER_TEMP/number"
          printf '%s\n' "$head" > "$RUNNER_TEMP/head"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/tree"
          printf '%s\n' "$product" > "$RUNNER_TEMP/product"

      - name: Wait for exact-head CI and retained artifacts
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          head=$(cat "$RUNNER_TEMP/head")
          deadline=$((SECONDS + 3600))
          while :; do
            curl -fsSL "${headers[@]}" "$api/actions/runs?head_sha=$head&per_page=100" > "$RUNNER_TEMP/runs.json"
            jq '[.workflow_runs|group_by(.workflow_id)[]|sort_by(.run_attempt,.id)|last]' "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/latest.json"
            active=$(jq '[.[]|select(.status!="completed")]|length' "$RUNNER_TEMP/latest.json")
            if [ "$active" = 0 ] && [ "$(jq 'length' "$RUNNER_TEMP/latest.json")" -gt 0 ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then break; fi
            sleep 30
          done
          total=$(jq 'length' "$RUNNER_TEMP/latest.json")
          success=$(jq '[.[]|select(.status=="completed" and .conclusion=="success")]|length' "$RUNNER_TEMP/latest.json")
          active=$(jq '[.[]|select(.status!="completed")]|length' "$RUNNER_TEMP/latest.json")
          failed=$(jq '[.[]|select(.status=="completed" and .conclusion!="success")]|length' "$RUNNER_TEMP/latest.json")
          aggregate=$(jq '[.[]|select(.name=="trillionnium-game-merge-gate" and .conclusion=="success")]|length' "$RUNNER_TEMP/latest.json")
          prospective=$(jq '[.[]|select(.name=="prospective-merge-gate" and .conclusion=="success")]|length' "$RUNNER_TEMP/latest.json")
          artifacts=0
          while IFS= read -r id; do
            count=$(curl -fsSL "${headers[@]}" "$api/actions/runs/$id/artifacts?per_page=100" | jq '[.artifacts[]|select(.expired==false and .size_in_bytes>0)]|length')
            if [ "$count" -gt 0 ]; then artifacts=$((artifacts+1)); fi
          done < <(jq -r '.[]|select(.conclusion=="success")|.id' "$RUNNER_TEMP/latest.json")
          jq -n --argjson total "$total" --argjson success "$success" --argjson active "$active" --argjson failed "$failed" --argjson aggregate "$aggregate" --argjson prospective "$prospective" --argjson artifacts "$artifacts" '{total:$total,success:$success,active:$active,failed:$failed,aggregate_success:$aggregate,prospective_success:$prospective,successful_artifact_runs:$artifacts}' > "$RUNNER_TEMP/ci.json"
          cat "$RUNNER_TEMP/ci.json"

      - name: Request review and read exact-head decisions
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          number=$(cat "$RUNNER_TEMP/number"); head=$(cat "$RUNNER_TEMP/head")
          jq -n '{reviewers:["Tomasrgbsf"]}' > "$RUNNER_TEMP/request.json"
          curl -sS -X POST "${headers[@]}" "$api/pulls/$number/requested_reviewers" --data-binary @"$RUNNER_TEMP/request.json" >/dev/null || true
          curl -fsSL "${headers[@]}" "$api/pulls/$number" > "$RUNNER_TEMP/pr.json"
          author=$(jq -r '.user.login|ascii_downcase' "$RUNNER_TEMP/pr.json")
          curl -fsSL "${headers[@]}" "$api/pulls/$number/reviews?per_page=100" > "$RUNNER_TEMP/reviews.json"
          jq --arg head "$head" --arg author "$author" 'map(select((.user.type|ascii_downcase)!="bot" and (.user.login|ascii_downcase)!=$author))|sort_by(.submitted_at,.id)|group_by(.user.login|ascii_downcase)|map(last)|{approvals:[.[]|select(.state=="APPROVED" and .commit_id==$head)],changes:[.[]|select(.state=="CHANGES_REQUESTED" and .commit_id==$head)]}' "$RUNNER_TEMP/reviews.json" > "$RUNNER_TEMP/review-state.json"
          query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved isOutdated}}}}}'
          jq -n --arg query "$query" --arg owner "$GITHUB_REPOSITORY_OWNER" --arg repo "${GITHUB_REPOSITORY#*/}" --argjson number "$number" '{query:$query,variables:{owner:$owner,repo:$repo,number:$number}}' > "$RUNNER_TEMP/graphql.json"
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' https://api.github.com/graphql --data-binary @"$RUNNER_TEMP/graphql.json" > "$RUNNER_TEMP/threads.json"
          approvals=$(jq '.approvals|length' "$RUNNER_TEMP/review-state.json"); changes=$(jq '.changes|length' "$RUNNER_TEMP/review-state.json"); unresolved=$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]|select(.isResolved==false and .isOutdated==false)]|length' "$RUNNER_TEMP/threads.json")
          jq -n --argjson approvals "$approvals" --argjson changes "$changes" --argjson unresolved "$unresolved" '{approvals:$approvals,changes_requested:$changes,unresolved_threads:$unresolved}' > "$RUNNER_TEMP/human.json"
          cat "$RUNNER_TEMP/human.json"

      - name: Open for review or perform ordinary exact-SHA merge
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          number=$(cat "$RUNNER_TEMP/number"); head=$(cat "$RUNNER_TEMP/head")
          ci_green=false
          if [ "$(jq -r '.active' "$RUNNER_TEMP/ci.json")" = 0 ] && [ "$(jq -r '.failed' "$RUNNER_TEMP/ci.json")" = 0 ] && [ "$(jq -r '.aggregate_success' "$RUNNER_TEMP/ci.json")" -ge 1 ] && [ "$(jq -r '.prospective_success' "$RUNNER_TEMP/ci.json")" -ge 1 ] && [ "$(jq -r '.successful_artifact_runs' "$RUNNER_TEMP/ci.json")" -ge 1 ]; then ci_green=true; fi
          approvals=$(jq -r '.approvals' "$RUNNER_TEMP/human.json"); changes=$(jq -r '.changes_requested' "$RUNNER_TEMP/human.json"); unresolved=$(jq -r '.unresolved_threads' "$RUNNER_TEMP/human.json")
          if [ "$ci_green" = true ] && [ "$changes" = 0 ]; then curl -fsSL -X PATCH "${headers[@]}" "$api/pulls/$number" -d '{"draft":false}' >/dev/null; fi
          merged=false
          if [ "$ci_green" = true ] && [ "$approvals" -ge 1 ] && [ "$changes" = 0 ] && [ "$unresolved" = 0 ]; then
            current=$(curl -fsSL "${headers[@]}" "$api/pulls/$number"|jq -r '.head.sha'); test "$current" = "$head"
            jq -n --arg sha "$head" --arg title 'ci(evidence): seal outbox retained artifacts before success' '{sha:$sha,merge_method:"squash",commit_title:$title}' > "$RUNNER_TEMP/merge.json"
            result=$(curl -fsSL -X PUT "${headers[@]}" "$api/pulls/$number/merge" --data-binary @"$RUNNER_TEMP/merge.json")
            test "$(jq -r '.merged' <<<"$result")" = true; merged=true
          fi
          jq -n --argjson ci_green "$ci_green" --argjson approvals "$approvals" --argjson changes "$changes" --argjson unresolved "$unresolved" --argjson merged "$merged" '{ci_green:$ci_green,approvals:$approvals,changes_requested:$changes,unresolved_threads:$unresolved,merged:$merged}' > "$RUNNER_TEMP/admission.json"
          cat "$RUNNER_TEMP/admission.json"

      - name: Persist result and reject false closure
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          number=$(cat "$RUNNER_TEMP/number"); head=$(cat "$RUNNER_TEMP/head"); tree=$(cat "$RUNNER_TEMP/tree"); product=$(cat "$RUNNER_TEMP/product")
          jq -n --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson pr "$number" --arg head "$head" --arg tree "$tree" --arg product "$product" --slurpfile ci "$RUNNER_TEMP/ci.json" --slurpfile human "$RUNNER_TEMP/human.json" --slurpfile admission "$RUNNER_TEMP/admission.json" '{schema:"trillionnium.outbox-fix-admission.v1",observed_at:$observed_at,pr:$pr,head:$head,tree:$tree,product_parent:$product,ci:$ci[0],human:$human[0],admission:$admission[0],claims:{accepted_evidence:false,gap_closed:false,production_ready:false}}' > "$RUNNER_TEMP/status.json"
          path='tooling/outbox-evidence-sealing/outbox-fix-admission.json'; old=$(curl -sS "${headers[@]}" "$api/contents/$path?ref=${STAGING_BRANCH//\//%2F}"); sha=$(jq -r '.sha//empty' <<<"$old"); content=$(base64 -w0 < "$RUNNER_TEMP/status.json"); jq -n --arg message 'tooling: persist outbox fix admission status' --arg content "$content" --arg branch "$STAGING_BRANCH" --arg sha "$sha" '{message:$message,content:$content,branch:$branch}+(if $sha=="" then {} else {sha:$sha} end)' > "$RUNNER_TEMP/write.json"; curl -fsSL -X PUT "${headers[@]}" "$api/contents/$path" --data-binary @"$RUNNER_TEMP/write.json" >/dev/null
          if [ "$(jq -r '.merged' "$RUNNER_TEMP/admission.json")" != true ]; then echo 'Outbox fix remains review/CI blocked; no false admission.' >&2; exit 1; fi
