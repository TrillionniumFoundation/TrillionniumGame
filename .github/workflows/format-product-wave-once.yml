name: format-product-wave-once

on:
  push:
    branches:
      - codex/plan-v31-product-gap-wave-2026-09-07

permissions:
  contents: write

concurrency:
  group: format-product-wave-once
  cancel-in-progress: false

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact branch without external actions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install exact Rust formatter
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1

      - name: Format affected Rust workspaces
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml
          cargo fmt --manifest-path crates/trnm-persistence-core/Cargo.toml
          git diff --check

      - name: Commit exact formatted successor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            crates/trnm-token-crypto-provider \
            crates/trnm-presence-router-v2 \
            crates/trnm-persistence-core; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            crates/trnm-token-crypto-provider \
            crates/trnm-presence-router-v2 \
            crates/trnm-persistence-core
          git commit -m "style(product-wave): apply rustfmt 1.85.1"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
