name: trillionnium-game-database-data-denominator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/denominator/sql_migration_surface.py'
      - 'scripts/generate-database-denominator.py'
      - 'scripts/check-database-denominator.sh'
      - 'tests/denominator/test_database_denominator.py'
      - 'docs/development/DATABASE_DATA_DENOMINATOR_IMPLEMENTATION.md'
      - '.github/workflows/sg1-database-data-denominator.yml'
  push:
    branches: [main]
    paths:
      - 'tools/denominator/sql_migration_surface.py'
      - 'scripts/generate-database-denominator.py'
      - 'scripts/check-database-denominator.sh'
      - 'tests/denominator/test_database_denominator.py'
      - 'docs/development/DATABASE_DATA_DENOMINATOR_IMPLEMENTATION.md'
      - '.github/workflows/sg1-database-data-denominator.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-database-denominator-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-database-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate SQL lexer, extractor and negative fixtures
        run: bash scripts/check-database-denominator.sh
      - name: Fetch and verify exact Nakama source tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fetch-pinned-upstream.py \
            --repository heroiclabs/nakama \
            --revision d4d92f93f78bbbe62c7fc50a3f85c772ec121a09 \
            --tree f3c9cfc2726d5543da1564629170f35b98e3797d \
            --output run/upstream/nakama
      - name: Generate exact candidates twice
        run: |
          set -euo pipefail
          python3 scripts/generate-database-denominator.py \
            --nakama-dir run/upstream/nakama \
            --output-dir run/candidate-a
          python3 scripts/generate-database-denominator.py \
            --nakama-dir run/upstream/nakama \
            --output-dir run/candidate-b
          diff -ru run/candidate-a run/candidate-b
      - name: Validate exact-source fail-closed candidate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          db = json.loads(Path('run/candidate-a/database-denominator.candidate.json').read_text())
          data = json.loads(Path('run/candidate-a/data-denominator.candidate.json').read_text())
          assert db['migration_file_count'] == 19, db['migration_file_count']
          assert db['leaf_count'] >= 100, db['leaf_count']
          assert data['leaf_count'] >= 40, data['leaf_count']
          assert db['counts_by_class'].get('db_table', 0) >= 10
          assert db['counts_by_class'].get('db_column', 0) >= 50
          assert db['counts_by_class'].get('db_index', 0) >= 5
          assert data['counts_by_class'].get('data_invariant_candidate', 0) >= 25
          for value in (db, data):
              assert value['unclassified_count'] == value['leaf_count']
              assert value['unreviewed_count'] == value['leaf_count']
              assert not any(value['claims'].values())
          PY
      - name: Prove candidates cannot close SG1
        run: |
          set -euo pipefail
          if python3 scripts/generate-database-denominator.py \
              --nakama-dir run/upstream/nakama \
              --output-dir run/sg1-negative \
              --require-sg1; then
            echo 'Database candidates incorrectly received SG1 credit' >&2
            exit 1
          fi
      - name: Seal exact-head candidate evidence in immutable log
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/database-data-denominator-${CANDIDATE_SHA}.tar.gz \
            -C run/candidate-a .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/database-data-denominator-${CANDIDATE_SHA}.tar.gz
          find run/candidate-a -type f -print0 | sort -z | xargs -0 sha256sum
