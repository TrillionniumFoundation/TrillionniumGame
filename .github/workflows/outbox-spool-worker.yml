name: outbox-spool-worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/database-test-images.json'
      - 'crates/trnm-contracts/**'
      - 'crates/trnm-persistence-pg/**'
      - 'crates/trnm-token-jwt-adapter/**'
      - 'migrations/**'
      - 'scripts/ci-outbox-spool-worker.sh'
      - 'docs/ARCHITECTURE.md'
      - 'docs/OPERATIONS_AND_RELEASE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - '.github/workflows/outbox-spool-worker.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/database-test-images.json'
      - 'crates/trnm-contracts/**'
      - 'crates/trnm-persistence-pg/**'
      - 'crates/trnm-token-jwt-adapter/**'
      - 'migrations/**'
      - 'scripts/ci-outbox-spool-worker.sh'
      - 'docs/ARCHITECTURE.md'
      - 'docs/OPERATIONS_AND_RELEASE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - '.github/workflows/outbox-spool-worker.yml'

permissions:
  contents: read

concurrency:
  group: outbox-spool-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate source and claim boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Outbox state is explicit' docs/ARCHITECTURE.md
          grep -q 'Crash-before-publish and crash-after-publish are separate failure boundaries' docs/OPERATIONS_AND_RELEASE.md
          bash -n scripts/ci-outbox-spool-worker.sh
          test -s crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'create_new(true)' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'hard_link' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'sync_all' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'claim_outbox' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'complete_outbox' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'retry_or_dead_letter_outbox' crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs
          grep -q 'compatibility_credit": False' scripts/ci-outbox-spool-worker.sh
          grep -q 'production_ready": False' scripts/ci-outbox-spool-worker.sh

  live-profile:
    strategy:
      fail-fast: false
      matrix:
        profile: [postgresql, cockroachdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Load reviewed immutable database image
        env:
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          profile = os.environ['PROFILE']
          value = json.loads(
              Path('config/database-test-images.json').read_text(encoding='utf-8')
          )
          row = value['profiles'][profile]
          patterns = {
              'postgresql': r'postgres@sha256:[0-9a-f]{64}',
              'cockroachdb': r'cockroachdb/cockroach@sha256:[0-9a-f]{64}',
          }
          image = row['image']
          if re.fullmatch(patterns[profile], image) is None:
              raise SystemExit(f'invalid immutable image for {profile}: {image!r}')
          environment_name = {
              'postgresql': 'TRNM_POSTGRES_IMAGE',
              'cockroachdb': 'TRNM_COCKROACH_IMAGE',
          }[profile]
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'{environment_name}={image}\n')
          print(f'profile={profile}')
          print(f'image={image}')
          print(row['version_output'])
          PY
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - name: Execute exact-image spool fault profile
        id: execute
        env:
          TRNM_EVIDENCE_ROOT: run/outbox-spool-worker
          TRNM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
        shell: bash
        run: bash scripts/ci-outbox-spool-worker.sh '${{ matrix.profile }}'
      - name: Seal deterministic diagnostic archive in the run log
        if: always()
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="run/outbox-spool-worker/${PROFILE}"
          mkdir -p "$evidence_root"
          archive="run/outbox-spool-worker-${PROFILE}-${CANDIDATE_SHA}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$evidence_root" .
          digest=$(sha256sum "$archive")
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\nprofile=%s\nexecution_outcome=%s\narchive=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID" \
            "$PROFILE" "$EXECUTION_OUTCOME" "$digest"
          find "$evidence_root" -type f -print0 | sort -z | xargs -0 -r sha256sum
          {
            printf '### Outbox spool worker %s\n\n' "$PROFILE"
            printf -- '- candidate: `%s@%s`\n' "$CANDIDATE_REPOSITORY" "$CANDIDATE_SHA"
            printf -- '- run: `%s`\n' "$GITHUB_RUN_ID"
            printf -- '- execution outcome: `%s`\n' "$EXECUTION_OUTCOME"
            printf -- '- deterministic archive: `%s`\n' "$digest"
            printf -- '- compatibility credit: `false`\n'
            printf -- '- production ready: `false`\n'
          } >>"$GITHUB_STEP_SUMMARY"
