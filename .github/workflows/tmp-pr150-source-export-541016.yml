name: tmp-pr150-source-export-541016

on:
  push:
    branches:
      - ops/pr150-source-export-541016-20260909
    paths:
      - .github/workflows/tmp-pr150-source-export-541016.yml

permissions:
  contents: read

concurrency:
  group: tmp-pr150-source-export-541016
  cancel-in-progress: false

jobs:
  export-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact immutable PR head
        shell: bash
        run: |
          set -euo pipefail
          target='541016f34f2dbaf7c2be10cd45afdd04223c49f2'
          tree='1c171f4731be313978c80555b5ad0f3af88be593'
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$target"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$target"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})" = "$tree"
      - name: Create bounded deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trillionnium-game-pr150-541016.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --exclude=.git \
            -cf - -C "$GITHUB_WORKSPACE" . | gzip -n > "$archive"
          test -s "$archive"
          test "$(stat -c %s "$archive")" -le 67108864
          sha256sum "$archive"
          printf 'SOURCE_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"
      - name: Upload exact source archive
        uses: ./.github/actions/upload-evidence
        with:
          name: pr150-source-541016
          path: ${{ env.SOURCE_ARCHIVE }}
          mime_type: application/gzip
