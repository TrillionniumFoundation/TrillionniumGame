name: world-source-bundle-291436-20260909

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-source-bundle-291436-20260909-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_BASE_SHA: 956462f95675d3d4db89af03bc4b7cc8c9a3c975
  WORLD_HEAD_SHA: 291436f450a1f281349a2281b7911faa8ff95c77
  WORLD_HEAD_TREE: fd6f81ce251e4cd6ba5ad725dcde8580f6ba6c11
  WORLD_MERGE_SHA: 20419da4c699494aa64965a38659b3514be75cd5
  WORLD_MERGE_TREE: fd6f81ce251e4cd6ba5ad725dcde8580f6ba6c11

jobs:
  bundle:
    name: world/source-bundle-291436
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch and verify immutable World tuple
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/world"
          rm -rf "$root"
          git init "$root"
          git -C "$root" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$root" fetch --no-tags origin "$WORLD_BASE_SHA" "$WORLD_HEAD_SHA" "$WORLD_MERGE_SHA"
          git -C "$root" checkout --detach "$WORLD_HEAD_SHA"
          test "$(git -C "$root" rev-parse HEAD)" = "$WORLD_HEAD_SHA"
          test "$(git -C "$root" rev-parse 'HEAD^{tree}')" = "$WORLD_HEAD_TREE"
          test "$(git -C "$root" rev-parse "$WORLD_MERGE_SHA^{tree}")" = "$WORLD_MERGE_TREE"
          test "$(git -C "$root" show -s --format=%P "$WORLD_MERGE_SHA")" = "$WORLD_BASE_SHA $WORLD_HEAD_SHA"
          test -z "$(git -C "$root" status --porcelain=v1 --untracked-files=no)"

      - name: Build deterministic source archive and bounded Git bundle
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/world"
          out="$RUNNER_TEMP/world-source-bundle-291436"
          rm -rf "$out"
          mkdir -p "$out"
          git -C "$root" archive \
            --format=tar.gz \
            --prefix=Trillionnium-World-291436/ \
            "$WORLD_HEAD_SHA" \
            -o "$out/Trillionnium-World-291436.tar.gz"
          git -C "$root" bundle create \
            "$out/Trillionnium-World-291436.bundle" \
            "$WORLD_BASE_SHA" "$WORLD_HEAD_SHA" "$WORLD_MERGE_SHA"
          {
            printf 'repository=%s\n' "$WORLD_REPOSITORY"
            printf 'base=%s\n' "$WORLD_BASE_SHA"
            printf 'head=%s\n' "$WORLD_HEAD_SHA"
            printf 'head_tree=%s\n' "$WORLD_HEAD_TREE"
            printf 'merge=%s\n' "$WORLD_MERGE_SHA"
            printf 'merge_tree=%s\n' "$WORLD_MERGE_TREE"
            printf 'merge_parents=%s\n' "$(git -C "$root" show -s --format=%P "$WORLD_MERGE_SHA")"
            printf 'production_authorization=not_granted\n'
          } > "$out/identity.txt"
          (cd "$out" && sha256sum * > SHA256SUMS)
          test -s "$out/Trillionnium-World-291436.tar.gz"
          test -s "$out/Trillionnium-World-291436.bundle"
          cat "$out/identity.txt"
          cat "$out/SHA256SUMS"

      - name: Upload exact World source bundle
        uses: actions/upload-artifact@v4
        with:
          name: Trillionnium-World-291436-source-bundle
          path: ${{ runner.temp }}/world-source-bundle-291436
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
