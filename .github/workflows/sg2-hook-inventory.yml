name: trillionnium-game-sg2-hook-inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/oracle-hook-inventory-policy.json'
      - 'contracts/oracle/instrumentation-site-inventory.v1.schema.json'
      - 'tools/oracle/hook_inventory.py'
      - 'scripts/oracle/generate-hook-inventory.py'
      - 'scripts/oracle/check-hook-inventory.sh'
      - 'tests/oracle/test_hook_inventory.py'
      - 'docs/development/ORACLE_INSTRUMENTATION_HOOK_INVENTORY.md'
      - '.github/workflows/sg2-hook-inventory.yml'

permissions:
  contents: read

concurrency:
  group: tg-sg2-hook-inventory-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "refs/heads/${CANDIDATE_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Run unit and static policy tests
        run: bash scripts/oracle/check-hook-inventory.sh
      - name: Fetch exact Nakama source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fetch-pinned-upstream.py \
            --repository heroiclabs/nakama \
            --revision d4d92f93f78bbbe62c7fc50a3f85c772ec121a09 \
            --tree f3c9cfc2726d5543da1564629170f35b98e3797d \
            --output run/upstream/nakama
      - name: Generate exact-source candidate
        run: |
          set -euo pipefail
          python3 scripts/oracle/generate-hook-inventory.py \
            --source run/upstream/nakama \
            --policy config/oracle-hook-inventory-policy.json \
            --output run/instrumentation-sites.json
      - name: Prove candidate remains fail-closed and seal evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          value = json.load(open('run/instrumentation-sites.json'))
          assert value['site_count'] > 0
          assert value['status'] == 'candidate-unreviewed'
          assert not any(value['claims'].values())
          assert all(site['patch_authorized'] is False for site in value['sites'])
          PY
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/instrumentation-sites.json
          cat run/instrumentation-sites.json
