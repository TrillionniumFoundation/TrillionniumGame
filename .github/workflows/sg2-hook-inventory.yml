name: trillionnium-game-sg2-hook-inventory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/oracle-hook-inventory-policy.json'
      - 'contracts/oracle/instrumentation-site-inventory.v1.schema.json'
      - 'tools/oracle/hook_inventory.py'
      - 'scripts/oracle/generate-hook-inventory.py'
      - 'scripts/oracle/check-hook-inventory.sh'
      - 'tests/oracle/test_hook_inventory.py'
      - 'docs/development/ORACLE_INSTRUMENTATION_HOOK_INVENTORY.md'
      - '.github/workflows/sg2-hook-inventory.yml'

permissions:
  contents: read

concurrency:
  group: tg-sg2-hook-inventory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: candidate
      - name: Checkout exact Nakama source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: heroiclabs/nakama
          ref: d4d92f93f78bbbe62c7fc50a3f85c772ec121a09
          path: upstream/nakama
          fetch-depth: 1
      - name: Run unit and static policy tests
        working-directory: candidate
        run: bash scripts/oracle/check-hook-inventory.sh
      - name: Generate exact-source candidate
        run: |
          python3 candidate/scripts/oracle/generate-hook-inventory.py \
            --source upstream/nakama \
            --policy candidate/config/oracle-hook-inventory-policy.json \
            --output run/instrumentation-sites.json
      - name: Prove candidate remains fail-closed
        run: |
          python3 - <<'PY'
          import json
          value = json.load(open('run/instrumentation-sites.json'))
          assert value['site_count'] > 0
          assert value['status'] == 'candidate-unreviewed'
          assert not any(value['claims'].values())
          assert all(site['patch_authorized'] is False for site in value['sites'])
          PY
      - name: Upload exact-head inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oracle-hook-inventory-${{ github.sha }}
          path: run/instrumentation-sites.json
          if-no-files-found: error
          retention-days: 30
