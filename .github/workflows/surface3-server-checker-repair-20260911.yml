name: surface3-server-checker-repair-20260911

on:
  push:
    branches:
      - ops/game-exact-source-snapshot-20260910
    paths:
      - .github/workflows/surface3-server-checker-repair-20260911.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: surface3-server-checker-repair-20260911
  cancel-in-progress: false

env:
  REPAIR_REVISION: '3'
  TARGET_BRANCH: feature/plan-v32-storage-api-core-20260910
  EXPECTED_HEAD: 115565ee4f5e809fc942919ba1bb634d83fcb869
  EXPECTED_TREE: 23de20a315d38239d8a9d67ff5a5b327778bde2c

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact driver and target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/driver"
          target="$RUNNER_TEMP/surface3"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git init "$driver"
          git -C "$driver" remote add origin "$remote"
          git -C "$driver" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$driver" checkout --detach FETCH_HEAD
          test "$(git -C "$driver" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m py_compile "$driver/tools/apply_surface3_checker_repair.py"

          git init "$target"
          git -C "$target" remote add origin "$remote"
          git -C "$target" fetch --no-tags origin "refs/heads/${TARGET_BRANCH}"
          git -C "$target" checkout -B "$TARGET_BRANCH" FETCH_HEAD
          test "$(git -C "$target" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$target" rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

          printf 'DRIVER_ROOT=%s\nTARGET_ROOT=%s\n' "$driver" "$target" >> "$GITHUB_ENV"

      - name: Apply and verify exact source-checker repair
        shell: bash
        run: |
          set -euo pipefail
          python3 "$DRIVER_ROOT/tools/apply_surface3_checker_repair.py" --root "$TARGET_ROOT"
          cd "$TARGET_ROOT"
          python3 -m py_compile \
            scripts/check-trnm-server.py \
            tests/control_plane/test_trnm_server_dependency_contract.py
          python3 scripts/check-trnm-server.py | tee "$RUNNER_TEMP/server-contract.json"
          jq -e '
            .status == "trnm-server-source-contract-passed" and
            .source_tests >= 100 and
            .cargo_executed_here == false and
            .live_database_executed_here == false and
            .compatibility_credit == false and
            .sg4_complete == false
          ' "$RUNNER_TEMP/server-contract.json" >/dev/null
          python3 -m unittest tests.control_plane.test_trnm_server_dependency_contract -v
          git diff --check

      - name: Commit and fast-forward Surface 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$TARGET_ROOT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Plan v3.2 checker repair'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add scripts/check-trnm-server.py tests/control_plane/test_trnm_server_dependency_contract.py
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(server): bind checker to split authority-storage tests' \
            -m 'Require the exact ordered four-part authority_storage include authority, scan every retained test part, and add hostile omission/order/substitution regressions. Preserve all Rust, database, evidence, compatibility and production boundaries.'
          new_head=$(git rev-parse HEAD)
          new_tree=$(git rev-parse HEAD^{tree})
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'repair_revision=%s\nold_head=%s\nnew_head=%s\nnew_tree=%s\nhistory_rewritten=false\n' \
            "$REPAIR_REVISION" "$EXPECTED_HEAD" "$new_head" "$new_tree" | tee "$GITHUB_STEP_SUMMARY"
