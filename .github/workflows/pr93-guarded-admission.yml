name: pr93-guarded-admission

on:
  push:
    branches: [tooling/pr93-identity-and-ci-2026-09-06]
    paths:
      - '.github/workflows/pr93-guarded-admission.yml'

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: pr93-guarded-admission
  cancel-in-progress: true

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      CHILD_PR: '93'
      PARENT_PR: '63'
      EXPECTED_BASE_BRANCH: codex/branch-evidence-closure-2026-09-02
    steps:
      - name: Wait for exact CI and conflict-free review, then use ordinary squash admission
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          ready=false
          : > "$RUNNER_TEMP/last.json"

          for poll in $(seq 1 180); do
            curl -fsS "${auth[@]}" "${api}/pulls/${CHILD_PR}" > "$RUNNER_TEMP/pr.json"
            state=$(jq -r '.state' "$RUNNER_TEMP/pr.json")
            merged=$(jq -r '.merged' "$RUNNER_TEMP/pr.json")
            if [ "$merged" = true ]; then
              printf 'child PR is already merged\n'
              exit 0
            fi
            test "$state" = open
            head=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")
            base=$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")
            base_ref=$(jq -r '.base.ref' "$RUNNER_TEMP/pr.json")
            author=$(jq -r '.user.login|ascii_downcase' "$RUNNER_TEMP/pr.json")
            draft=$(jq -r '.draft' "$RUNNER_TEMP/pr.json")
            mergeable=$(jq -r '.mergeable' "$RUNNER_TEMP/pr.json")
            test "$base_ref" = "$EXPECTED_BASE_BRANCH"
            live_base=$(curl -fsS "${auth[@]}" "${api}/git/ref/heads/$(jq -nr --arg value "$base_ref" '$value|@uri')" | jq -r '.object.sha')
            test "$base" = "$live_base"

            curl -fsS "${auth[@]}" "${api}/actions/runs?head_sha=${head}&per_page=100" > "$RUNNER_TEMP/runs.json"
            jq -c '.workflow_runs|sort_by(.workflow_id,.run_attempt,.id)|group_by(.workflow_id)|map(last)' "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/latest.json"
            total=$(jq 'length' "$RUNNER_TEMP/latest.json")
            active=$(jq '[.[]|select(.status!="completed")]|length' "$RUNNER_TEMP/latest.json")
            failed=$(jq '[.[]|select(.status=="completed" and .conclusion!="success")]|length' "$RUNNER_TEMP/latest.json")

            curl -fsS "${auth[@]}" "${api}/pulls/${CHILD_PR}/reviews?per_page=100" > "$RUNNER_TEMP/reviews.json"
            jq -c --arg head "$head" --arg author "$author" '
              sort_by(.submitted_at,.id)|group_by(.user.login|ascii_downcase)|map(last)
              |map(select(.user.type=="User" and .commit_id==$head and (.user.login|ascii_downcase)!=$author and (.user.login|ascii_downcase)!="profhepta" and (.user.login|ascii_downcase)!="franksudoman"))
            ' "$RUNNER_TEMP/reviews.json" > "$RUNNER_TEMP/current.json"
            approvals=$(jq '[.[]|select(.state=="APPROVED")]|length' "$RUNNER_TEMP/current.json")
            changes=$(jq '[.[]|select(.state=="CHANGES_REQUESTED")]|length' "$RUNNER_TEMP/current.json")

            owner=${GITHUB_REPOSITORY%/*}; repo=${GITHUB_REPOSITORY#*/}
            jq -n --arg owner "$owner" --arg repo "$repo" --argjson number "$CHILD_PR" '{query:"query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved isOutdated} pageInfo{hasNextPage}}}}}",variables:{owner:$owner,repo:$repo,number:$number}}' > "$RUNNER_TEMP/query.json"
            curl -fsS -X POST "${auth[@]}" --data-binary @"$RUNNER_TEMP/query.json" https://api.github.com/graphql > "$RUNNER_TEMP/threads.json"
            test "$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' "$RUNNER_TEMP/threads.json")" = false
            unresolved=$(jq '[.data.repository.pullRequest.reviewThreads.nodes[]|select(.isResolved==false and .isOutdated==false)]|length' "$RUNNER_TEMP/threads.json")

            jq -n --arg head "$head" --arg base "$base" --arg base_ref "$base_ref" --argjson draft "$draft" --arg mergeable "$mergeable" --argjson total "$total" --argjson active "$active" --argjson failed "$failed" --argjson approvals "$approvals" --argjson changes "$changes" --argjson unresolved "$unresolved" '{head:$head,base:$base,base_ref:$base_ref,draft:$draft,mergeable:$mergeable,workflow_total:$total,workflow_active:$active,workflow_failed:$failed,conflict_free_approvals:$approvals,changes_requested:$changes,unresolved_threads:$unresolved,ready:($draft==false and $mergeable=="true" and $total>0 and $active==0 and $failed==0 and $approvals>=1 and $changes==0 and $unresolved==0)}' > "$RUNNER_TEMP/last.json"
            cat "$RUNNER_TEMP/last.json"
            if jq -e '.ready==true' "$RUNNER_TEMP/last.json" >/dev/null; then
              ready=true
              break
            fi
            sleep 30
          done

          if [ "$ready" != true ]; then
            body=$(jq -r '"<!-- pr93-guarded-admission -->\nGuarded admission remained blocked:\n```json\n"+(.|tostring)+"\n```\nNo merge or bypass was attempted."' "$RUNNER_TEMP/last.json")
            jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
            curl -fsS -X POST "${auth[@]}" --data-binary @"$RUNNER_TEMP/comment.json" "${api}/issues/${CHILD_PR}/comments" >/dev/null
            exit 1
          fi

          head=$(jq -r '.head' "$RUNNER_TEMP/last.json")
          jq -n --arg sha "$head" '{sha:$sha,merge_method:"squash",commit_title:"feat: integrate remaining Plan v3.1 source blocker wave",commit_message:"Ordinary review-gated admission of PR #93. Exact source/merge CI and conflict-free review were re-read immediately before merge. This does not by itself close any gap or authorize production."}' > "$RUNNER_TEMP/merge-request.json"
          curl -fsS -X PUT "${auth[@]}" --data-binary @"$RUNNER_TEMP/merge-request.json" "${api}/pulls/${CHILD_PR}/merge" > "$RUNNER_TEMP/merge.json"
          jq -e '.merged==true and (.sha|length)==40' "$RUNNER_TEMP/merge.json" >/dev/null
          new_head=$(jq -r '.sha' "$RUNNER_TEMP/merge.json")
          live_base=$(curl -fsS "${auth[@]}" "${api}/git/ref/heads/$(jq -nr --arg value "$EXPECTED_BASE_BRANCH" '$value|@uri')" | jq -r '.object.sha')
          test "$live_base" = "$new_head"

          parent=$(curl -fsS "${auth[@]}" "${api}/pulls/${PARENT_PR}")
          test "$(jq -r '.head.sha' <<<"$parent")" = "$new_head"
          jq -n '{reviewers:["Tomasrgbsf"]}' > "$RUNNER_TEMP/parent-review.json"
          curl -fsS -X POST "${auth[@]}" --data-binary @"$RUNNER_TEMP/parent-review.json" "${api}/pulls/${PARENT_PR}/requested_reviewers" >/dev/null
          body="PR #${CHILD_PR} was admitted by ordinary exact-SHA squash after current CI, conflict-free review, and review-thread checks. New parent candidate head: \\`${new_head}\\`. All older #63 workflow and review results are stale; no gap or production credit transfers automatically."
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/parent-comment.json"
          curl -fsS -X POST "${auth[@]}" --data-binary @"$RUNNER_TEMP/parent-comment.json" "${api}/issues/${PARENT_PR}/comments" >/dev/null
