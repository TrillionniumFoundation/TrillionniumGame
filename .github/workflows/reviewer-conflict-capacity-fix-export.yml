name: reviewer-conflict-capacity-fix

on:
  push:
    branches: [tooling/reviewer-conflict-capacity-fix-2026-09-07]
    paths:
      - '.github/workflows/reviewer-conflict-capacity-fix-export.yml'

permissions:
  contents: write

env:
  TARGET_BASE: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
  TARGET_TREE: 9d3ae2fadb2684f095855ecf16307376b55a440f
  PRODUCT_BRANCH: codex/reviewer-conflict-capacity-fix-2026-09-07
  PATCH_SHA256: ae35363804785a48d44397b21033ed385e069be1c1379d2f27480bd2a6145345
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact tooling and candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/tooling" "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/tooling" rev-parse HEAD)" = "$GITHUB_SHA"

          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin "$TARGET_BASE"
          git -C "$GITHUB_WORKSPACE/source" checkout -b "$PRODUCT_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$TARGET_BASE"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = "$TARGET_TREE"

      - name: Apply exact digest-bound repair
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          payload="$GITHUB_WORKSPACE/tooling/tooling/reviewer-capacity-fix/reviewer-capacity.patch.gz.b64"
          test -s "$payload"
          base64 -d "$payload" > "$RUNNER_TEMP/reviewer-capacity.patch.gz"
          gzip -dc "$RUNNER_TEMP/reviewer-capacity.patch.gz" > "$RUNNER_TEMP/reviewer-capacity.patch"
          test "$(sha256sum "$RUNNER_TEMP/reviewer-capacity.patch" | cut -d' ' -f1)" = "$PATCH_SHA256"
          git apply --check "$RUNNER_TEMP/reviewer-capacity.patch"
          git apply "$RUNNER_TEMP/reviewer-capacity.patch"
          expected=$(cat <<'EOF'
          docs/review/INDEPENDENT_REVIEW_MATRIX.json
          scripts/check-independent-review-matrix.py
          tests/control_plane/test_independent_review_matrix.py
          EOF
          )
          test "$(git diff --name-only | LC_ALL=C sort)" = "$expected"
          git diff --check
          test "$(python3 scripts/check-independent-review-matrix.py | jq -r .status)" = blocked-reviewer-capacity

      - name: Execute complete control corpus
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tools tests
          python3 -m unittest -v tests.control_plane.test_independent_review_matrix
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 scripts/derive-gap-status.py
          python3 scripts/derive-gates.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-rust-foundation.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"
          expected=$(cat <<'EOF'
          docs/review/INDEPENDENT_REVIEW_MATRIX.json
          scripts/check-independent-review-matrix.py
          tests/control_plane/test_independent_review_matrix.py
          EOF
          )
          test "$(git diff --name-only | LC_ALL=C sort)" = "$expected"
          git diff --check

      - name: Publish exact tested source candidate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add docs/review/INDEPENDENT_REVIEW_MATRIX.json \
            scripts/check-independent-review-matrix.py \
            tests/control_plane/test_independent_review_matrix.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git commit -m 'fix(governance): compute conflict-free reviewer capacity'
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          printf 'product_head=%s\nproduct_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
