name: trillionnium-game-foundation-schema-profiles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'migrations/postgresql/**'
      - 'migrations/cockroachdb/**'
      - 'contracts/database/foundation-schema.v1.json'
      - 'scripts/check-foundation-schema.py'
      - 'tests/schema/**'
      - 'docs/development/FOUNDATION_SCHEMA_*.md'
      - 'docs/status/FOUNDATION_SCHEMA_STATUS.json'
      - '.github/workflows/w1-foundation-schema-profiles.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trillionnium-game-foundation-schema-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate static schema contracts and vectors
        run: |
          set -euo pipefail
          python3 scripts/check-foundation-schema.py
          python3 -m unittest discover -s tests/schema -p 'test_*.py' -v
          python3 -m compileall -q scripts tests/schema

  runtime-claim-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Prove broad runtime database claims remain false
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          status = json.load(open('docs/status/FOUNDATION_SCHEMA_STATUS.json'))
          claims = status['claims']
          assert claims['schema_equivalent'] is False
          assert claims['database_durable'] is False
          assert claims['migration_compatible'] is False
          assert claims['rollback_proven'] is False
          assert claims['ha_verified'] is False
          assert claims['sg4_complete'] is False
          assert claims['production_ready'] is False
          assert claims['public_online'] is False
          contract = json.load(open('contracts/database/foundation-schema.v1.json'))
          assert contract['profiles']['postgresql']['runtime_execution_verified'] is False
          assert contract['profiles']['cockroachdb']['runtime_execution_verified'] is False
          PY
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
