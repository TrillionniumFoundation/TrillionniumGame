name: world-pr104-rts-test-module-tranche-v2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pr104-rts-test-module-tranche-v2
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_SOURCE_SHA: '33339b28a6f53668672d1797109da6c7bf57db49'
  GAME_HELPER_SHA: '1d742ae0c520614f50c7bedcfe4907aeed625092'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: world-pr104/rts-test-module-tranche-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Fetch immutable World source and pinned helper
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          helper="$RUNNER_TEMP/game-helper"
          git init "$world"
          git -C "$world" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$world" fetch --no-tags --depth=2 origin "$WORLD_SOURCE_SHA"
          git -C "$world" checkout --detach FETCH_HEAD
          test "$(git -C "$world" rev-parse HEAD)" = "$WORLD_SOURCE_SHA"

          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GAME_HELPER_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GAME_HELPER_SHA"
          test -s "$helper/scripts/world-pr104-rts-test-module-transform.py"
          test -s "$helper/scripts/upload-actions-artifact.py"

      - name: Install pinned Rust and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'
          rustc --version --verbose
          cargo --version --verbose

      - name: Transform RTS nested tests and reconcile manifests
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          python3 "$RUNNER_TEMP/game-helper/scripts/world-pr104-rts-test-module-transform.py" \
            "$world" --source-sha "$WORLD_SOURCE_SHA"
          cargo fmt --manifest-path "$world/trillionnium/Cargo.toml" --all
          python3 - "$world" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest_path = root / "trillionnium/crates/trnm-rts-sim/src/lib_parts/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          base = manifest_path.parent.parent
          changed = {
              "lib_parts/tests/part_01.rs",
              "lib_parts/tests/rts_tests_01.rs",
              "lib_parts/tests/rts_tests_02.rs",
              "lib_parts/tests/rts_tests_03.rs",
          }
          seen = set()
          for field in ("parts", "nested_test_parts"):
              for record in manifest[field]:
                  if record["path"] in changed:
                      payload = (base / record["path"]).read_bytes()
                      record["bytes"] = len(payload)
                      record["sha256"] = hashlib.sha256(payload).hexdigest()
                      seen.add(record["path"])
          if seen != changed:
              raise SystemExit(f"manifest coverage drift: {seen} != {changed}")
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          git -C "$world" config user.name "World read-only qualification"
          git -C "$world" config user.email "world-read-only-qualification@invalid"
          git -C "$world" add \
            scripts/contracts/trnm-world-include-migrations-v1.json \
            trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/part_01.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_01.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_02.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_03.rs \
            trillionnium/crates/trnm-rts-sim/src/lib_parts/manifest.json
          GIT_AUTHOR_DATE='2026-09-10T00:00:00Z' \
          GIT_COMMITTER_DATE='2026-09-10T00:00:00Z' \
            git -C "$world" commit -m "test(world): migrate RTS test bodies to modules"
          test -z "$(git -C "$world" status --porcelain=v1)"
          printf 'WORLD_TRANSFORMED_HEAD=%s\n' "$(git -C "$world" rev-parse HEAD)"
          printf 'WORLD_TRANSFORMED_TREE=%s\n' "$(git -C "$world" rev-parse 'HEAD^{tree}')"

      - name: Qualify transformed exact source and truth
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          cd "$world"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all --check
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-rts-sim --all-targets --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml -p trnm-rts-sim --all-targets --locked -- -D warnings
          python3 scripts/check-trnm-world-include-boundaries.py
          bash scripts/run-trnm-world-v6-qualification-v2.sh truth
          bash scripts/run-trnm-world-v6-qualification-v2.sh source
          test -z "$(git status --porcelain=v1)"
          printf 'WORLD_RTS_TEST_MODULE_QUALIFICATION=PASS\n'

      - name: Build deterministic transformed-source artifact
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          packet="$world/run/world-rts-test-module-v2"
          archive="$RUNNER_TEMP/world-rts-test-module-v2.tar.gz"
          mkdir -p "$packet"
          paths=(
            scripts/contracts/trnm-world-include-migrations-v1.json
            trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/part_01.rs
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_01.rs
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_02.rs
            trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_03.rs
            trillionnium/crates/trnm-rts-sim/src/lib_parts/manifest.json
          )
          git -C "$world" diff --binary "$WORLD_SOURCE_SHA..HEAD" -- "${paths[@]}" > "$packet/candidate.patch"
          test -s "$packet/candidate.patch"
          {
            printf 'repository=%s\n' "$WORLD_REPOSITORY"
            printf 'source=%s\n' "$WORLD_SOURCE_SHA"
            printf 'candidate_commit=%s\n' "$(git -C "$world" rev-parse HEAD)"
            printf 'candidate_tree=%s\n' "$(git -C "$world" rev-parse 'HEAD^{tree}')"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'production_authorization=not_granted\n'
          } > "$packet/identity.txt"
          (
            cd "$world"
            sha256sum "${paths[@]}" \
              run/world-rts-test-module-v2/candidate.patch \
              run/world-rts-test-module-v2/identity.txt \
              > run/world-rts-test-module-v2/SHA256SUMS
          )
          tar --sort=name --format=gnu --mtime='UTC 2026-09-10' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$world" \
            "${paths[@]}" \
            run/world-rts-test-module-v2/candidate.patch \
            run/world-rts-test-module-v2/identity.txt \
            run/world-rts-test-module-v2/SHA256SUMS
          test -s "$archive"
          sha256sum "$archive"

      - name: Retain transformed-source artifact
        id: retained-world-rts-tranche
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/game-helper/scripts/upload-actions-artifact.py" \
            "world-rts-test-module-v2-${WORLD_SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/world-rts-test-module-v2.tar.gz" \
            --mime-type application/gzip

      - name: Emit retained artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.retained-world-rts-tranche.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ steps.retained-world-rts-tranche.outputs.sha256 }}
          ARTIFACT_SIZE: ${{ steps.retained-world-rts-tranche.outputs.size_bytes }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_SHA256"
          test -n "$ARTIFACT_SIZE"
          printf 'WORLD_RTS_TRANCHE_ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'WORLD_RTS_TRANCHE_ARTIFACT_SHA256=%s\n' "$ARTIFACT_SHA256"
          printf 'WORLD_RTS_TRANCHE_ARTIFACT_SIZE=%s\n' "$ARTIFACT_SIZE"
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
