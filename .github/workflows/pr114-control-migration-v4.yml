name: pr114-control-migration-v4

on:
  push:
    branches:
      - tooling/server-composition-preflight-2026-09-06
    paths:
      - .github/workflows/pr114-control-migration-v4.yml

permissions:
  contents: write

concurrency:
  group: pr114-control-migration-v4
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/server-composition-root-v2-2026-09-06
  TARGET_HEAD: c755e0ba2fdb91b42c13157cbebe1b9958dd4dac
  PAYLOAD_SHA256: 2205b127442506ac545913db79b6546dec158935c31f5fbc95f465606d0baed5
  PROCESS_SHA256: 5ff18bed2037e65500bd98827418793fd9094652bec7c72aa92d30e13201ce4f

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch and bind exact tooling inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          cp "$GITHUB_WORKSPACE/.pr114-control-payload/payload.b64" /tmp/pr114-payload.b64
          cp "$GITHUB_WORKSPACE/.pr114-control-payload/check-rust-server-process.sh" \
            /tmp/check-rust-server-process.sh
          cp "$GITHUB_WORKSPACE/.pr114-control-payload/migrate.py" /tmp/pr114-migrate.py
          test "$(sha256sum /tmp/pr114-payload.b64 | awk '{print $1}')" = "$PAYLOAD_SHA256"
          test "$(sha256sum /tmp/check-rust-server-process.sh | awk '{print $1}')" = "$PROCESS_SHA256"
          python3 -m py_compile /tmp/pr114-migrate.py

      - name: Fetch exact product candidate
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git -C "$GITHUB_WORKSPACE" ls-remote origin \
            "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$TARGET_HEAD"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$TARGET_HEAD"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TARGET_HEAD"

      - name: Apply exact fail-closed control migration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 /tmp/pr114-migrate.py \
            --payload /tmp/pr114-payload.b64 \
            --process-script /tmp/check-rust-server-process.sh
          git diff --check
          bash -n scripts/check-rust-server-process.sh
          python3 -m compileall -q scripts tools tests
          python3 scripts/check-rust-server-source-candidate.py
          python3 scripts/check-rust-server-vertical-slice.py
          python3 scripts/check-rust-server-slice.py

      - name: Execute complete control and product verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --manifest-path crates/trnm-server/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-server/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path crates/trnm-server/Cargo.toml \
            --all-targets --locked -- -D warnings
          TRNM_SERVER_SMOKE_ROOT=run/server-process-smoke \
            bash scripts/check-rust-server-process.sh
          grep -q '^status=passed$' run/server-process-smoke/result.txt
          grep -q '^process_ingress_verified=false$' run/server-process-smoke/result.txt
          grep -q '^database_durability_verified=false$' run/server-process-smoke/result.txt

      - name: Commit exact migration to unchanged product branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          actual="$(git diff --name-only | sort | paste -sd, -)"
          expected="contracts/server/rust-server-vertical-slice.v1.json,contracts/server/vertical-slice-v1.json,crates/trnm-server/Cargo.toml,crates/trnm-server/README.md,docs/status/RUST_SERVER_VERTICAL_SLICE_STATUS.json,scripts/check-rust-server-process.sh,scripts/check-rust-server-slice.py,scripts/check-rust-server-source-candidate.py,scripts/check-rust-server-vertical-slice.py,tests/control_plane/test_rust_server_slice.py"
          test "$actual" = "$expected"
          git config user.name trillionnium-server-bot
          git config user.email trillionnium-server-bot@users.noreply.github.com
          git add \
            crates/trnm-server/Cargo.toml \
            crates/trnm-server/README.md \
            contracts/server/vertical-slice-v1.json \
            contracts/server/rust-server-vertical-slice.v1.json \
            docs/status/RUST_SERVER_VERTICAL_SLICE_STATUS.json \
            scripts/check-rust-server-process.sh \
            scripts/check-rust-server-slice.py \
            scripts/check-rust-server-source-candidate.py \
            scripts/check-rust-server-vertical-slice.py \
            tests/control_plane/test_rust_server_slice.py
          git commit -m "fix(server): migrate controls to non-authoritative composition source"
          repaired="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain --untracked-files=no)"
          observed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$TARGET_HEAD"
          git push origin "${repaired}:refs/heads/${TARGET_BRANCH}"
