name: postgresql-recovery-barrier-controller-20260909

on:
  push:
    branches:
      - codex/plan-v32-controller-v2-2026-09-09
    paths:
      - .github/workflows/postgresql-recovery-barrier-controller-20260909.yml
      - tools/compose_postgresql_recovery_barrier.py
      - tools/run_postgresql_recovery_barrier_controller.sh

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: postgresql-recovery-barrier-controller-20260909
  cancel-in-progress: true

jobs:
  converge-and-prove-fixed-point:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      BASE_BRANCH: codex/cockroachdb-semantic-recovery-closure-2026-09-09
      TARGET_BRANCH: codex/postgresql-recovery-barrier-closure-2026-09-09
    steps:
      - name: Fetch exact controller source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/controller"
          git init "$GITHUB_WORKSPACE/controller"
          git -C "$GITHUB_WORKSPACE/controller" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/controller" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/controller" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/controller" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Execute PostgreSQL recovery barrier convergence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/controller/tools/run_postgresql_recovery_barrier_controller.sh"
