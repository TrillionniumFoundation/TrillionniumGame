name: exact-candidate-source-export

on:
  push:
    branches:
      - tooling/gap-closure-audit-2026-09-07

permissions:
  actions: write
  contents: read

concurrency:
  group: exact-candidate-source-export-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  TARGET_SHA: 88c02a417c7b0c64f27dc9f49e0b5e6317150964

jobs:
  export:
    name: export-exact-source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Fetch tooling commit and exact target without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" cat-file -t "$TARGET_SHA")" = commit

      - name: Build exact-source audit packet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/source-export/payload
          git archive --format=tar "$TARGET_SHA" \
            | gzip -n >"run/source-export/payload/TrillionniumGame-${TARGET_SHA}.tar.gz"
          git show -s --format='%H%n%T%n%P' "$TARGET_SHA" \
            >run/source-export/payload/git-identity.txt
          python3 - "$TARGET_REPOSITORY" "$TARGET_SHA" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          repository, target = sys.argv[1:]
          tree = subprocess.check_output(
              ["git", "rev-parse", f"{target}^{{tree}}"], text=True
          ).strip()
          payload = {
              "schema": "trillionnium.exact-source-export.v1",
              "repository": repository,
              "target_sha": target,
              "target_tree": tree,
              "workflow_sha": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "claims": {
                  "accepted_evidence": False,
                  "gap_closed": False,
                  "production_ready": False,
              },
          }
          Path("run/source-export/payload/identity.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd run/source-export/payload
            sha256sum TrillionniumGame-*.tar.gz git-identity.txt identity.json \
              >SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "run/exact-source-${TARGET_SHA}.tar.gz" \
            -C run/source-export payload

      - name: Retain exact-source audit packet
        id: source-packet
        uses: ./.github/actions/upload-evidence
        with:
          name: exact-source-${{ env.TARGET_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/exact-source-${{ env.TARGET_SHA }}.tar.gz
          mime_type: application/gzip

      - name: Verify upload receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.source-packet.outputs.artifact_id }}'
          test -n '${{ steps.source-packet.outputs.sha256 }}'
          test '${{ steps.source-packet.outputs.size_bytes }}' -gt 0
          printf 'artifact_id=%s\nsha256=%s\nsize_bytes=%s\n' \
            '${{ steps.source-packet.outputs.artifact_id }}' \
            '${{ steps.source-packet.outputs.sha256 }}' \
            '${{ steps.source-packet.outputs.size_bytes }}'
