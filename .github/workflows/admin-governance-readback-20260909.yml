name: admin-governance-readback-20260909

on:
  push:
    branches:
      - codex/admin-governance-readback-2026-09-09
    paths:
      - .github/workflows/admin-governance-readback-20260909.yml

permissions:
  actions: read
  contents: write
  pull-requests: read
  issues: write

jobs:
  readback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: codex/architecture-gap-closure-2026-09-08
      TARGET_PR: "116"
    steps:
      - name: Fetch exact governance authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/target"
          git init "$GITHUB_WORKSPACE/target"
          git -C "$GITHUB_WORKSPACE/target" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/target" fetch --no-tags --depth=1 origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git -C "$GITHUB_WORKSPACE/target" checkout --detach \
            "refs/remotes/origin/${TARGET_BRANCH}"
          git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD > "$RUNNER_TEMP/candidate-head"

      - name: Read back branch protection, rulesets and PR enforcement
        working-directory: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from typing import Any

          repository=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GITHUB_TOKEN']
          pr_number=int(os.environ['TARGET_PR'])
          head=(Path(os.environ['RUNNER_TEMP'])/'candidate-head').read_text().strip()
          base=f'https://api.github.com/repos/{repository}'

          def call(path: str) -> tuple[Any | None, dict[str, Any] | None]:
              request=urllib.request.Request(
                  base+path,
                  headers={
                      'Accept':'application/vnd.github+json',
                      'Authorization':f'Bearer {token}',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'User-Agent':'trillionnium-governance-readback',
                  },
              )
              try:
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read()
                  return (None if not raw else json.loads(raw),None)
              except urllib.error.HTTPError as error:
                  return None,{
                      'status':error.code,
                      'reason':error.reason,
                      'body':error.read().decode(errors='replace')[:2000],
                  }

          endpoints={
              'repository':'',
              'main_branch':'/branches/main',
              'main_protection':'/branches/main/protection',
              'rulesets':'/rulesets',
              'effective_rules':'/rules/branches/main',
              'pull_request':f'/pulls/{pr_number}',
              'reviews':f'/pulls/{pr_number}/reviews?per_page=100',
              'review_comments':f'/pulls/{pr_number}/comments?per_page=100',
              'issue_comments':f'/issues/{pr_number}/comments?per_page=100',
          }
          values={}
          errors={}
          for name,path in endpoints.items():
              value,error=call(path)
              values[name]=value
              if error is not None: errors[name]=error

          pr=values.get('pull_request') or {}
          if pr.get('head',{}).get('sha') != head:
              raise SystemExit('candidate moved during governance readback')
          branch=values.get('main_branch') or {}
          protection=values.get('main_protection') or {}
          status_checks=protection.get('required_status_checks') or {}
          reviews=protection.get('required_pull_request_reviews') or {}
          restrictions=protection.get('restrictions')
          required_contexts=status_checks.get('contexts') or []
          required_checks=status_checks.get('checks') or []
          context_names=set(required_contexts)
          for row in required_checks:
              if isinstance(row,dict) and isinstance(row.get('context'),str):
                  context_names.add(row['context'])

          readback={
              'schema':'trillionnium.github-admin-readback-candidate.v1',
              'repository':repository,
              'candidate_head':head,
              'pull_request':pr_number,
              'endpoint_errors':errors,
              'observed':{
                  'main_protected':branch.get('protected') is True,
                  'required_status_checks_strict':status_checks.get('strict') is True,
                  'required_aggregate_context':'trillionnium-game-merge-gate' in context_names,
                  'required_approving_review_count':reviews.get('required_approving_review_count'),
                  'dismiss_stale_reviews':reviews.get('dismiss_stale_reviews'),
                  'require_code_owner_reviews':reviews.get('require_code_owner_reviews'),
                  'require_last_push_approval':reviews.get('require_last_push_approval'),
                  'enforce_admins':(protection.get('enforce_admins') or {}).get('enabled'),
                  'required_conversation_resolution':(protection.get('required_conversation_resolution') or {}).get('enabled'),
                  'required_linear_history':(protection.get('required_linear_history') or {}).get('enabled'),
                  'allow_force_pushes':(protection.get('allow_force_pushes') or {}).get('enabled'),
                  'allow_deletions':(protection.get('allow_deletions') or {}).get('enabled'),
                  'block_creations':(protection.get('block_creations') or {}).get('enabled'),
                  'restrictions':restrictions,
                  'ruleset_count':len(values.get('rulesets') or []),
                  'effective_rule_count':len(values.get('effective_rules') or []),
                  'pr_draft':pr.get('draft'),
                  'pr_mergeable':pr.get('mergeable'),
                  'pr_mergeable_state':pr.get('mergeable_state'),
                  'review_count':len(values.get('reviews') or []),
              },
              'negative_rehearsal':{
                  'executed':False,
                  'accepted':False,
                  'reason':'A destructive main push/force-push/deletion was not attempted. Harmless ordinary-path negative PR evidence remains required.',
              },
              'claims':{
                  'full_admin_readback_available':'main_protection' not in errors and 'rulesets' not in errors,
                  'desired_policy_equals_effective_policy':False,
                  'independent_acceptance':False,
                  'gap_closed':False,
                  'administrator_bypass':False,
              },
          }
          output=Path('run/governance/admin-readback.json')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps(readback,indent=2,sort_keys=True)+'\n')
          print(json.dumps({
              'endpoint_errors':errors,
              'observed':readback['observed'],
              'claims':readback['claims'],
          },sort_keys=True))
          PY
          sha256sum run/governance/admin-readback.json > run/governance/admin-readback.json.sha256

      - name: Publish readback result to the stacked PR
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          packet=run/governance/admin-readback.json
          head=$(jq -r '.candidate_head' "$packet")
          available=$(jq -r '.claims.full_admin_readback_available' "$packet")
          errors=$(jq -c '.endpoint_errors' "$packet")
          observed=$(jq -c '.observed' "$packet")
          digest=$(sha256sum "$packet" | awk '{print $1}')
          body=$(cat <<EOF
          Administration-scoped governance readback for \`$head\`:

          \`\`\`text
          full_admin_readback_available=$available
          packet_sha256=$digest
          independent_acceptance=false
          negative_no_bypass_rehearsal_accepted=false
          gap_closed=false
          administrator_bypass=false
          \`\`\`

          Endpoint errors: \`$errors\`

          Observed policy: \`$observed\`
          EOF
          )
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" \
            -f body="$body" >/dev/null

      - name: Emit bounded packet in retained native logs
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/admin-governance-readback.tar.gz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C run/governance \
            admin-readback.json admin-readback.json.sha256
          if [[ -x scripts/emit-actions-log-artifact.py ]]; then
            python3 scripts/emit-actions-log-artifact.py \
              "$archive" \
              --name "admin-governance-readback-$(cat "$RUNNER_TEMP/candidate-head")-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --max-bytes 4194304 \
              --metadata-json "$RUNNER_TEMP/admin-readback-envelope.json"
          else
            sha256sum "$archive"
          fi

      - name: Delete readback controller branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/target" push origin \
            --delete codex/admin-governance-readback-2026-09-09
