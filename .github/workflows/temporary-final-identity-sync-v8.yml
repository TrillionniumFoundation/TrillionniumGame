name: temporary-final-identity-sync-v8

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-final-identity-sync-v8
  cancel-in-progress: false

jobs:
  clean-push-and-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Remove every temporary executor and push final source head
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-gap-closure-executor-v5.yml \
            .github/workflows/temporary-gap-closure-rescue-v6.yml \
            .github/workflows/temporary-final-clean-head-v7.yml \
            .github/workflows/temporary-final-identity-sync-v8.yml
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          git commit -m "ci: finalize exact-head identity synchronization"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          printf 'FINAL_SHA=%s\n' "$(git rev-parse HEAD)" >>"$GITHUB_ENV"
          printf 'FINAL_TREE=%s\n' "$(git rev-parse HEAD^{tree})" >>"$GITHUB_ENV"
      - name: Bind PR body and reviewer request to final head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['FINAL_SHA']
          tree=os.environ['FINAL_TREE']
          token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}'
          def req(method,url,body=None):
              data=None if body is None else json.dumps(body).encode()
              r=urllib.request.Request(url,data=data,method=method,headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
                  'User-Agent':'trillionnium-final-identity-sync',
              })
              try:
                  with urllib.request.urlopen(r,timeout=45) as x:
                      raw=x.read(); return x.status,json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  return e.code,{'message':e.read().decode(errors='replace')}
          code,pr=req('GET',api+'/pulls/42')
          if code!=200 or pr['head']['sha']!=sha:
              raise SystemExit(f'final PR head mismatch: {code} {pr}')
          exact=(
              '## Exact candidate\n\n'
              f'- base: `main@{pr["base"]["sha"]}`\n'
              f'- head: `{sha}`\n'
              f'- tree: `{tree}`\n\n'
              'Only terminal checks, reviews and governance readback bound to this exact '
              'candidate may receive closure credit.\n'
          )
          body=pr.get('body') or ''
          pattern=re.compile(r'## Exact candidate\n.*?(?=\n## |\Z)',re.S)
          body=pattern.sub(exact.rstrip(),body) if pattern.search(body) else exact+'\n'+body
          pcode,_=req('PATCH',api+'/pulls/42',{'body':body,'draft':False})
          if pcode!=200:
              raise SystemExit(f'PR body update failed: {pcode}')
          rcode,_=req('POST',api+'/pulls/42/requested_reviewers',{'reviewers':['ProfHepta']})
          if rcode not in {200,201,422}:
              raise SystemExit(f'reviewer request failed: {rcode}')
          print(json.dumps({'final_sha':sha,'final_tree':tree,'pr_body_synced':True,'reviewer_requested':True},sort_keys=True))
          PY
