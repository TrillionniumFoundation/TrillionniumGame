name: temporary-outbox-gap-closure

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-outbox-gap-closure
  cancel-in-progress: false

jobs:
  integrate-validate-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Integrate outbox module and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          outbox = root / 'crates/trnm-persistence-pg/src/outbox.rs'
          lib = root / 'crates/trnm-persistence-pg/src/lib.rs'
          workflow = root / '.github/workflows/temporary-outbox-gap-closure.yml'
          if not outbox.is_file():
              raise SystemExit('staged outbox module is missing')
          source = lib.read_text(encoding='utf-8')

          if 'mod outbox;' not in source:
              if 'mod pool;' in source:
                  source = source.replace('mod pool;\n', 'mod outbox;\nmod pool;\n', 1)
              else:
                  source = source.replace(
                      '#![forbid(unsafe_code)]\n\n',
                      '#![forbid(unsafe_code)]\n\nmod outbox;\n',
                      1,
                  )
          if 'pub use outbox::{OutboxLease, OutboxRetryOutcome};' not in source:
              marker = 'pub use pool::{PgPool, PgPoolConfig, PgPoolSnapshot, PgTlsConfig};\n'
              export = 'pub use outbox::{OutboxLease, OutboxRetryOutcome};\n'
              if marker in source:
                  source = source.replace(marker, export + marker, 1)
              else:
                  source = source.replace('mod outbox;\n', 'mod outbox;\n\n' + export, 1)

          if 'from_database_value' not in source:
              old = '''impl IntentKind {
              const fn database_value(self) -> i16 {
                  self as i16
              }
          }
          '''
              new = '''impl IntentKind {
              const fn database_value(self) -> i16 {
                  self as i16
              }

              const fn from_database_value(value: i16) -> Option<Self> {
                  match value {
                      0 => Some(Self::Broadcast),
                      1 => Some(Self::SearchIndex),
                      2 => Some(Self::Notification),
                      3 => Some(Self::ExternalEffect),
                      4 => Some(Self::Completion),
                      _ => None,
                  }
              }
          }
          '''
              if old not in source:
                  raise SystemExit('IntentKind implementation anchor drifted')
              source = source.replace(old, new, 1)

          lib.write_text(source, encoding='utf-8')
          workflow.unlink()
          PY
          test ! -e .github/workflows/temporary-outbox-gap-closure.yml
          git diff --check

      - name: Validate Rust and control-plane contracts
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py

      - name: Commit exact validated source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-outbox-gap-closure.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(pg): add fenced outbox dispatch transitions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
