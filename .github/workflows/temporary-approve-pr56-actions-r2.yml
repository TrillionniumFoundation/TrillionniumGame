name: temporary-approve-pr56-actions-r2

on:
  push:
    branches:
      - codex/approve-pr56-actions-r2-2026-08-31

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: temporary-approve-pr56-actions-r2
  cancel-in-progress: false

env:
  TARGET_PR: '56'
  TARGET_SHA: 1f04eacc2d2c7f49d56450eba0cc744319830ca1
  CONTROL_BRANCH: codex/approve-pr56-actions-r2-2026-08-31

jobs:
  approve-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact control branch without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "+refs/heads/${CONTROL_BRANCH}:refs/remotes/origin/${CONTROL_BRANCH}"
          git -C "$GITHUB_WORKSPACE" checkout -B "$CONTROL_BRANCH" "origin/$CONTROL_BRANCH"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Approve only action-required runs for the frozen PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" --jq .head.sha)" = "$TARGET_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" --jq .draft)" = false
          mapfile -t run_ids < <(
            gh api --method GET --paginate "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f head_sha="$TARGET_SHA" -f event=pull_request -f per_page=100 \
              --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id'
          )
          test "${#run_ids[@]}" -ge 1
          printf 'approving %s exact-head workflow runs\n' "${#run_ids[@]}"
          for run_id in "${run_ids[@]}"; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" >/dev/null
            printf 'approved run=%s\n' "$run_id"
          done
          for _ in $(seq 1 30); do
            remaining=$(
              gh api --method GET --paginate "repos/${GITHUB_REPOSITORY}/actions/runs" \
                -f head_sha="$TARGET_SHA" -f event=pull_request -f per_page=100 \
                --jq '[.workflow_runs[] | select(.conclusion == "action_required")] | length' \
                | awk '{sum += $1} END {print sum + 0}'
            )
            if test "$remaining" = 0; then
              exit 0
            fi
            sleep 2
          done
          echo 'approved runs did not leave action_required state' >&2
          exit 1
      - name: Remove temporary control surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trillionnium-actions-approver"
          git config user.email "actions-approver@users.noreply.github.com"
          git rm .github/workflows/temporary-approve-pr56-actions-r2.yml
          git diff --cached --check
          git commit -m "ci: remove final PR56 Actions approval executor"
          git push origin "HEAD:refs/heads/${CONTROL_BRANCH}"
