name: migration-fence-patch-v2

on:
  push:
    branches: [tooling/migration-fence-patch-2026-09-06]
    paths:
      - '.github/workflows/migration-fence-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCT_BRANCH: codex/migration-fence-control-2026-09-06
      TOOLING_BRANCH: tooling/migration-fence-patch-2026-09-06
      EXPECTED_BASE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact product and source template
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=32 origin \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/product" \
            "+refs/heads/${TOOLING_BRANCH}:refs/remotes/origin/tooling"
          git -C "$GITHUB_WORKSPACE" checkout -b "$PRODUCT_BRANCH" \
            refs/remotes/origin/product
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$RUNNER_TEMP/original-head"
          git -C "$GITHUB_WORKSPACE" show \
            refs/remotes/origin/tooling:.github/workflows/migration-fence-patch.yml \
            > "$RUNNER_TEMP/source-template.yml"

      - name: Extract corrected module and register it
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/source-template.yml" <<'PY'
          from pathlib import Path
          import re
          import sys
          import textwrap

          template = Path(sys.argv[1]).read_text(encoding='utf-8')
          match = re.search(
              r"cat > crates/trnm-persistence-core/src/migration_fence\.rs <<'RS'\n(.*?)\n          RS",
              template,
              flags=re.S,
          )
          if match is None:
              raise SystemExit('migration source template missing')
          source = textwrap.dedent(match.group(1)) + '\n'
          source = source.replace(
              '#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub struct MigrationCursor(u64);',
              '#[derive(Clone, Copy, Debug, Eq, Ord, PartialEq, PartialOrd)]\npub struct MigrationCursor(u64);',
              1,
          )
          if 'Ord, PartialEq, PartialOrd' not in source:
              raise SystemExit('cursor ordering correction was not applied')
          destination = Path('crates/trnm-persistence-core/src/migration_fence.rs')
          destination.write_text(source, encoding='utf-8')

          path = Path('crates/trnm-persistence-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          block = '''

          mod migration_fence;

          pub use migration_fence::{
              AuthorityMode, FenceEpoch, MigrationCursor, MigrationDigest, MigrationFence,
              MigrationFenceError, MigrationFenceSnapshot, MigrationIdentity, MigrationPhase,
          };
          '''
          if 'mod migration_fence;' not in text:
              path.write_text(text.rstrip() + textwrap.dedent(block), encoding='utf-8')
          PY

      - name: Normalize and validate exact source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          git add -N crates/trnm-persistence-core/src/migration_fence.rs
          cargo fmt --manifest-path crates/trnm-persistence-core/Cargo.toml
          observed=$(git diff --name-only | LC_ALL=C sort)
          expected=$(cat <<'EOF'
          crates/trnm-persistence-core/src/lib.rs
          crates/trnm-persistence-core/src/migration_fence.rs
          EOF
          )
          test "$observed" = "$expected"
          git diff --check
          cargo fmt --manifest-path crates/trnm-persistence-core/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-persistence-core/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-persistence-core/Cargo.toml \
            --all-targets --locked -- -D warnings

      - name: CAS fast-forward validated product branch
        shell: bash
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add crates/trnm-persistence-core/src
          git commit -m 'feat(data): add monotonic migration and cutover fence'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${original}"
          printf 'old_head=%s\nnew_head=%s\ntree=%s\n' \
            "$original" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Preserve claim boundary
        shell: bash
        run: |
          printf '%s\n' \
            'source_candidate=true' \
            'migration_executed=false' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false' \
            'cutover_authorized=false' \
            'nakama_retired=false'
