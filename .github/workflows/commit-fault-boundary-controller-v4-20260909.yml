name: commit-fault-boundary-controller-v4-20260909

on:
  push:
    branches:
      - codex/plan-v32-controller-v2-2026-09-09
    paths:
      - .github/workflows/commit-fault-boundary-controller-v4-20260909.yml
      - tools/compose_commit_fault_boundaries.py
      - tools/compose_commit_fault_boundaries_v2.py
      - tools/run_commit_fault_boundary_controller.sh
      - tools/run_commit_fault_boundary_controller_v2.sh

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: commit-fault-boundary-controller-20260909
  cancel-in-progress: true

jobs:
  converge-and-prove-fixed-point:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      TARGET_BRANCH: codex/postgresql-fault-recovery-closure-2026-09-09
      BASE_BRANCH: codex/postgresql-authority-storage-closure-2026-09-09
    steps:
      - name: Fetch exact controller source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/controller"
          git init "$GITHUB_WORKSPACE/controller"
          git -C "$GITHUB_WORKSPACE/controller" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/controller" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/controller" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/controller" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Execute exact-tree dual-profile convergence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/controller/tools/run_commit_fault_boundary_controller_v2.sh"
