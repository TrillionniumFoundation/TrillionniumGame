name: tmp-social-core-qualified-source-v5

on:
  push:
    branches:
      - feature/plan-v32-social-core-20260909
    paths:
      - .github/workflows/tmp-social-core-qualified-source-v5.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: tmp-social-core-qualified-source-v5
  cancel-in-progress: false

jobs:
  execute-bound-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
      FEATURE_BRANCH: feature/plan-v32-social-core-20260909
      EXPECTED_BASE_SHA: 541016f34f2dbaf7c2be10cd45afdd04223c49f2
      BASE_BRANCH: integration/plan-v32-main-rebind-2026-09-09
      GENERATOR_REF: ops/social-core-source-20260909
      V2_REF: cfe6e4831fcc88556194cadc167fe517025276a3
      V3_REF: b2a62b190ecc1251ea444e1e7c327512de07a88a
      V4_REF: 79fcfa45fbd0077989b964753768f463bbfbd9ea
    steps:
      - name: Extract immutable v4 execution steps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/contents/.github/workflows/tmp-social-core-qualified-source-v4.yml?ref=${V4_REF}" \
            --jq .content | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/social-v4.yml"
          ruby -ryaml -e '
            document = YAML.safe_load(File.read(ARGV[0]), aliases: true)
            steps = document.fetch("jobs").fetch("rebuild-qualify-and-publish").fetch("steps")
            names = [
              "Extract and repair reusable v3 steps",
              "Prepare reusable scripts",
              "Reset and reconstruct from exact parent",
              "Prove atomic state commit",
              "Validate package workspace and control plane",
              "Publish clean source branch"
            ]
            names.each_with_index do |name, index|
              step = steps.find { |entry| entry["name"] == name }
              abort("missing v4 step: #{name}") unless step && step["run"]
              File.write(ARGV[index + 1], step.fetch("run"))
            end
          ' "$RUNNER_TEMP/social-v4.yml" \
            "$RUNNER_TEMP/v4-extract.sh" \
            "$RUNNER_TEMP/v4-prepare.sh" \
            "$RUNNER_TEMP/v4-reset.sh" \
            "$RUNNER_TEMP/v4-prove.sh" \
            "$RUNNER_TEMP/v4-validate.sh" \
            "$RUNNER_TEMP/v4-publish.sh"
      - name: Prepare reusable scripts and repair parent-shell cwd
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/v4-extract.sh"
          bash "$RUNNER_TEMP/v4-prepare.sh"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/home/runner/work/_temp/reset-reconstruct.sh")
          text = path.read_text(encoding="utf-8")
          old = '''bash "$RUNNER_TEMP/generate-social.sh"
          rm -f .github/workflows/tmp-social-core-qualified-source-v3.yml
          git add -A
          '''
          new = '''bash "$RUNNER_TEMP/generate-social.sh"
          cd "$GITHUB_WORKSPACE"
          rm -f .github/workflows/tmp-social-core-qualified-source-v3.yml
          git add -A
          '''
          if text.count(old) != 1:
              raise SystemExit("social post-generator cwd anchor drifted")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Reconstruct source from exact parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/v4-reset.sh"
      - name: Replace notification argument fanout with typed input
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/trnm-social-core/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          notification_marker = '''          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct Notification {
          '''
          input_type = '''          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct NotificationInput {
              recipient: UserId,
              notification: NotificationId,
              subject: String,
              body: Vec<u8>,
          }

          impl NotificationInput {
              #[must_use]
              pub fn new(
                  recipient: UserId,
                  notification: NotificationId,
                  subject: String,
                  body: Vec<u8>,
              ) -> Self {
                  Self {
                      recipient,
                      notification,
                      subject,
                      body,
                  }
              }
          }

          '''
          if text.count(notification_marker) != 1:
              raise SystemExit("notification type insertion marker drifted")
          text = text.replace(notification_marker, input_type + notification_marker, 1)

          old_signature = '''              pub fn create_notification(
                  &mut self,
                  command: CommandId,
                  fingerprint: Fingerprint,
                  actor: UserId,
                  recipient: UserId,
                  notification: NotificationId,
                  subject: String,
                  body: Vec<u8>,
              ) -> Result<SocialReceipt, SocialError> {
          '''
          new_signature = '''              pub fn create_notification(
                  &mut self,
                  command: CommandId,
                  fingerprint: Fingerprint,
                  actor: UserId,
                  input: NotificationInput,
              ) -> Result<SocialReceipt, SocialError> {
                  let NotificationInput {
                      recipient,
                      notification,
                      subject,
                      body,
                  } = input;
          '''
          if text.count(old_signature) != 1:
              raise SystemExit("create_notification signature drifted")
          text = text.replace(old_signature, new_signature, 1)

          def split_arguments(payload: str) -> list[str]:
              arguments: list[str] = []
              start = 0
              paren = bracket = brace = angle = 0
              in_string = False
              escaped = False
              for index, char in enumerate(payload):
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False
                      continue
                  if char == '"':
                      in_string = True
                  elif char == '(':
                      paren += 1
                  elif char == ')':
                      paren -= 1
                  elif char == '[':
                      bracket += 1
                  elif char == ']':
                      bracket -= 1
                  elif char == '{':
                      brace += 1
                  elif char == '}':
                      brace -= 1
                  elif char == '<':
                      angle += 1
                  elif char == '>' and angle:
                      angle -= 1
                  elif char == ',' and not (paren or bracket or brace or angle):
                      arguments.append(payload[start:index].strip())
                      start = index + 1
              tail = payload[start:].strip()
              if tail:
                  arguments.append(tail)
              return arguments

          needle = ".create_notification("
          cursor = 0
          rewritten = 0
          while True:
              start = text.find(needle, cursor)
              if start < 0:
                  break
              open_paren = start + len(needle) - 1
              depth = 0
              in_string = False
              escaped = False
              end = None
              for index in range(open_paren, len(text)):
                  char = text[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False
                      continue
                  if char == '"':
                      in_string = True
                  elif char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          end = index
                          break
              if end is None:
                  raise SystemExit("unbalanced create_notification call")
              payload = text[open_paren + 1:end]
              args = split_arguments(payload)
              if len(args) != 7:
                  raise SystemExit(f"expected seven notification call arguments, got {len(args)}")
              line_start = text.rfind("\n", 0, start) + 1
              indent = text[line_start:start]
              replacement = (
                  ".create_notification(\n"
                  + indent + "    " + args[0] + ",\n"
                  + indent + "    " + args[1] + ",\n"
                  + indent + "    " + args[2] + ",\n"
                  + indent + "    NotificationInput::new(\n"
                  + indent + "        " + args[3] + ",\n"
                  + indent + "        " + args[4] + ",\n"
                  + indent + "        " + args[5] + ",\n"
                  + indent + "        " + args[6] + ",\n"
                  + indent + "    ),\n"
                  + indent + ")"
              )
              text = text[:start] + replacement + text[end + 1:]
              cursor = start + len(replacement)
              rewritten += 1
          if rewritten != 3:
              raise SystemExit(f"expected three notification test calls, rewrote {rewritten}")
          if "recipient: UserId,\n                  notification:" in text:
              raise SystemExit("old notification argument fanout remains")
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          git add -A
          git diff --cached --check
      - name: Prove atomic source semantics
        shell: bash
        run: bash "$RUNNER_TEMP/v4-prove.sh"
      - name: Validate all source and control contracts
        shell: bash
        run: bash "$RUNNER_TEMP/v4-validate.sh"
      - name: Publish clean source branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/v4-publish.sh"
