name: world-pr104-ci-consolidation-qualification-v2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pr104-ci-consolidation-qualification-v2
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_SOURCE_SHA: '33339b28a6f53668672d1797109da6c7bf57db49'
  GAME_HELPER_SHA: '897c49157042e9be727c22c9f420ad623776ba84'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: world-pr104/ci-consolidation-v2
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Fetch immutable World source and transformation helper
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          helper="$RUNNER_TEMP/game-helper"
          git init "$world"
          git -C "$world" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$world" fetch --no-tags --depth=2 origin "$WORLD_SOURCE_SHA"
          git -C "$world" checkout --detach FETCH_HEAD
          test "$(git -C "$world" rev-parse HEAD)" = "$WORLD_SOURCE_SHA"
          test -z "$(git -C "$world" status --porcelain=v1)"

          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GAME_HELPER_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GAME_HELPER_SHA"
          test -s "$helper/scripts/world-pr104-ci-consolidation-transform.py"
          test -s "$helper/scripts/world-pr104-ci-consolidation-parent-count-fix.py"

      - name: Apply closed-world workflow consolidation
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          python3 "$RUNNER_TEMP/game-helper/scripts/world-pr104-ci-consolidation-transform.py" "$world"
          python3 "$RUNNER_TEMP/game-helper/scripts/world-pr104-ci-consolidation-parent-count-fix.py" "$world"
          git -C "$world" diff --check
          python3 -m py_compile \
            "$world/scripts/check-trnm-world-ci-integrity.py" \
            "$world/scripts/test-trnm-world-ci-integrity.py"
          git -C "$world" status --short

      - name: Run CI integrity production path and hostile regressions
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          cd "$world"
          python3 scripts/check-trnm-world-ci-integrity.py --workflows-only
          python3 scripts/test-trnm-world-ci-integrity.py
          python3 scripts/check-trnm-world-ci-integrity.py
          printf 'WORLD_CI_CONSOLIDATION_STATIC=PASS\n'

      - name: Install pinned Rust and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'

      - name: Run complete World truth and source qualification
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          cd "$world"
          bash scripts/run-trnm-world-v6-qualification-v2.sh truth
          bash scripts/run-trnm-world-v6-qualification-v2.sh source
          git diff --check
          printf 'WORLD_CI_CONSOLIDATION_QUALIFICATION=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
