name: world-pr104-ci-consolidation-qualification-v3

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pr104-ci-consolidation-qualification-v3
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_SOURCE_SHA: '33339b28a6f53668672d1797109da6c7bf57db49'
  GAME_HELPER_SHA: '897c49157042e9be727c22c9f420ad623776ba84'
  ARTIFACT_ACTION_SHA: '9f60c03eb542ac208c11ed2c4dc484ddbc1c28eb'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: world-pr104/ci-consolidation-v3
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Fetch immutable World source, transformation helper and artifact action
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          helper="$RUNNER_TEMP/game-helper"
          action_source="$RUNNER_TEMP/artifact-action"

          git init "$world"
          git -C "$world" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$world" fetch --no-tags --depth=2 origin "$WORLD_SOURCE_SHA"
          git -C "$world" checkout --detach FETCH_HEAD
          test "$(git -C "$world" rev-parse HEAD)" = "$WORLD_SOURCE_SHA"
          test -z "$(git -C "$world" status --porcelain=v1)"

          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GAME_HELPER_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GAME_HELPER_SHA"
          test -s "$helper/scripts/world-pr104-ci-consolidation-transform.py"
          test -s "$helper/scripts/world-pr104-ci-consolidation-parent-count-fix.py"

          git init "$action_source"
          git -C "$action_source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$action_source" fetch --no-tags --depth=1 origin "$ARTIFACT_ACTION_SHA"
          git -C "$action_source" checkout --detach FETCH_HEAD
          test "$(git -C "$action_source" rev-parse HEAD)" = "$ARTIFACT_ACTION_SHA"
          test -s "$action_source/.github/actions/immutable-upload-artifact/action.yml"
          test -s "$action_source/.github/actions/immutable-upload-artifact/main.js"
          mkdir -p "$GITHUB_WORKSPACE/.github/actions"
          cp -R "$action_source/.github/actions/immutable-upload-artifact" \
            "$GITHUB_WORKSPACE/.github/actions/immutable-upload-artifact"

      - name: Apply and commit closed-world workflow consolidation
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          python3 "$RUNNER_TEMP/game-helper/scripts/world-pr104-ci-consolidation-transform.py" "$world"
          python3 "$RUNNER_TEMP/game-helper/scripts/world-pr104-ci-consolidation-parent-count-fix.py" "$world"
          rm -rf "$world/scripts/__pycache__"
          git -C "$world" diff --check
          python3 -m py_compile \
            "$world/scripts/check-trnm-world-ci-integrity.py" \
            "$world/scripts/test-trnm-world-ci-integrity.py"
          rm -rf "$world/scripts/__pycache__"
          git -C "$world" config user.name "World read-only qualification"
          git -C "$world" config user.email "world-read-only-qualification@invalid"
          git -C "$world" add -A
          GIT_AUTHOR_DATE='2026-09-10T00:00:00Z' \
          GIT_COMMITTER_DATE='2026-09-10T00:00:00Z' \
            git -C "$world" commit -m "ci(world): consolidate unique workflow context ownership"
          test -z "$(git -C "$world" status --porcelain=v1)"
          printf 'WORLD_TRANSFORMED_HEAD=%s\n' "$(git -C "$world" rev-parse HEAD)"
          printf 'WORLD_TRANSFORMED_TREE=%s\n' "$(git -C "$world" rev-parse 'HEAD^{tree}')"

      - name: Run CI integrity production path and hostile regressions
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          cd "$world"
          python3 scripts/check-trnm-world-ci-integrity.py --workflows-only
          python3 scripts/test-trnm-world-ci-integrity.py
          python3 scripts/check-trnm-world-ci-integrity.py
          test -z "$(git status --porcelain=v1)"
          printf 'WORLD_CI_CONSOLIDATION_STATIC=PASS\n'

      - name: Install pinned Rust and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config
          test "$(rustc --version | awk '{print $2}')" = '1.98.1'

      - name: Run complete World truth and source qualification
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          cd "$world"
          bash scripts/run-trnm-world-v6-qualification-v2.sh truth
          bash scripts/run-trnm-world-v6-qualification-v2.sh source
          test -z "$(git status --porcelain=v1)"
          printf 'WORLD_CI_CONSOLIDATION_QUALIFICATION=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'

      - name: Build deterministic binary-safe patch artifact
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          packet="$RUNNER_TEMP/world-ci-consolidation-v3"
          archive="$RUNNER_TEMP/world-ci-consolidation-v3.tar.gz"
          mkdir -p "$packet"
          git -C "$world" diff --binary "$WORLD_SOURCE_SHA..HEAD" > "$packet/candidate.patch"
          test -s "$packet/candidate.patch"
          {
            printf 'repository=%s\n' "$WORLD_REPOSITORY"
            printf 'source=%s\n' "$WORLD_SOURCE_SHA"
            printf 'candidate_commit=%s\n' "$(git -C "$world" rev-parse HEAD)"
            printf 'candidate_tree=%s\n' "$(git -C "$world" rev-parse 'HEAD^{tree}')"
            printf 'workflow_count=6\n'
            printf 'context_count=10\n'
            printf 'production_authorization=not_granted\n'
          } > "$packet/identity.txt"
          sha256sum "$packet/candidate.patch" "$packet/identity.txt" > "$packet/SHA256SUMS"
          tar --sort=name --format=gnu --mtime='UTC 2026-09-10' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C "$packet" candidate.patch identity.txt SHA256SUMS
          sha256sum "$archive" | tee "$RUNNER_TEMP/world-ci-consolidation-v3.sha256"

      - name: Retain qualified CI consolidation patch
        id: retained-ci-consolidation
        uses: ./.github/actions/immutable-upload-artifact
        with:
          name: world-ci-consolidation-v3-${{ env.WORLD_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/world-ci-consolidation-v3.tar.gz
            ${{ runner.temp }}/world-ci-consolidation-v3.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Emit retained artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.retained-ci-consolidation.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.retained-ci-consolidation.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          printf 'WORLD_CI_CONSOLIDATION_ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'WORLD_CI_CONSOLIDATION_ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
