name: world-pr127-live-complete-ownership

on:
  push:
    branches:
      - ops/world-pr104-game-server-runtime-modules-20260910
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pr127-live-complete-ownership
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_PULL_REQUEST: '127'
  COMMON_HELPER_SHA: 'b02fef9a86b77c8babd19a7dd469081095ea2e90'
  STACK_HELPER_SHA: '3aa075564891e4f7abba57c682dafc9f6b06c7b2'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: world-pr127/live-complete-ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Resolve live World PR head and fetch exact sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${WORLD_REPOSITORY}/pulls/${WORLD_PULL_REQUEST}"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > "$RUNNER_TEMP/world-pr.json"
          python3 - "$RUNNER_TEMP/world-pr.json" "$GITHUB_ENV" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          head = value['head']['sha']
          if not re.fullmatch(r'[0-9a-f]{40}', head):
              raise SystemExit('invalid World PR head')
          if value['head']['repo']['full_name'] != 'TrillionniumFoundation/Trillionnium-World':
              raise SystemExit('unexpected World PR head repository')
          if value['state'] != 'open' or value['merged']:
              raise SystemExit('World PR is not an open unmerged candidate')
          with Path(sys.argv[2]).open('a', encoding='utf-8') as stream:
              stream.write(f'WORLD_SOURCE_SHA={head}\n')
              stream.write(f'WORLD_BASE_SHA={value["base"]["sha"]}\n')
              stream.write(f'WORLD_HEAD_REF={value["head"]["ref"]}\n')
          print(f'WORLD_SOURCE_SHA={head}')
          PY

          clone_exact() {
            local directory="$1"
            local remote="$2"
            local revision="$3"
            git init -q "$directory"
            git -C "$directory" remote add origin "$remote"
            git -C "$directory" fetch -q --no-tags --depth=2 origin "$revision"
            git -C "$directory" checkout -q --detach FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          }
          world_source="$(python3 -c 'import json; print(json.load(open("'"$RUNNER_TEMP/world-pr.json"'"))["head"]["sha"])')"
          clone_exact "$RUNNER_TEMP/world" \
            "https://github.com/${WORLD_REPOSITORY}.git" "$world_source"
          clone_exact "$RUNNER_TEMP/common" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$COMMON_HELPER_SHA"
          clone_exact "$RUNNER_TEMP/stack" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$STACK_HELPER_SHA"
          clone_exact "$RUNNER_TEMP/driver" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          for path in \
            scripts/world-pr127-cumulative-modules-transform.py \
            scripts/world-pr127-campaign-runtime-driver.py \
            scripts/world-pr127-settlement-worker-modules-transform.py; do
            test -s "$RUNNER_TEMP/driver/$path"
          done
          rm -rf "$GITHUB_WORKSPACE/.github/actions/upload-evidence"
          mkdir -p "$GITHUB_WORKSPACE/.github/actions" "$GITHUB_WORKSPACE/scripts"
          cp -R "$RUNNER_TEMP/common/.github/actions/upload-evidence" \
            "$GITHUB_WORKSPACE/.github/actions/"
          cp "$RUNNER_TEMP/common/scripts/upload-actions-artifact.py" \
            "$GITHUB_WORKSPACE/scripts/"

      - name: Install Rust 1.98.1 and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal --component rustfmt,clippy
          rustup default "$RUSTUP_TOOLCHAIN"
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.list.save
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config
          test "$(rustc --version | awk '{print $2}')" = "$RUSTUP_TOOLCHAIN"

      - name: Transform all classified active ownership seams
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          driver="$RUNNER_TEMP/driver/scripts"
          python3 "$driver/world-pr127-cumulative-modules-transform.py" \
            "$world" \
            --common-helper "$RUNNER_TEMP/common" \
            --stack-helper "$RUNNER_TEMP/stack" \
            --source-sha "$WORLD_SOURCE_SHA"
          python3 "$driver/world-pr127-campaign-runtime-driver.py" \
            "$world" \
            --stack-helper "$RUNNER_TEMP/stack" \
            --completed-commit "$WORLD_SOURCE_SHA"
          python3 "$driver/world-pr127-settlement-worker-modules-transform.py" \
            "$world" --completed-commit "$WORLD_SOURCE_SHA"

          cargo fmt --manifest-path "$world/trillionnium/Cargo.toml" --all
          python3 - "$world" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          root = Path(sys.argv[1])
          for manifest_path in (
              root / 'trillionnium/crates/trnm-campaign-core/src/lib_parts/manifest.json',
              root / 'trillionnium/crates/trnm-rts-sim/src/lib_parts/manifest.json',
              root / 'trillionnium/crates/trnm-game-server/src/lib_parts/manifest.json',
          ):
              value = json.loads(manifest_path.read_text(encoding='utf-8'))
              source_root = manifest_path.parent.parent
              seen = 0
              for field in ('parts', 'nested_test_parts'):
                  records = value.get(field, [])
                  if not isinstance(records, list):
                      raise SystemExit(f'{manifest_path}: {field} is not a list')
                  for record in records:
                      target = source_root / record['path']
                      payload = target.read_bytes()
                      record['bytes'] = len(payload)
                      record['sha256'] = hashlib.sha256(payload).hexdigest()
                      seen += 1
              if seen == 0:
                  raise SystemExit(f'empty manifest: {manifest_path}')
              manifest_path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY

          boundary="$(cd "$world" && python3 scripts/check-trnm-world-include-boundaries.py)"
          printf '%s\n' "$boundary"
          grep -F 'active_migration=0' <<<"$boundary"
          grep -F 'completed_migration=54' <<<"$boundary"
          grep -F 'frozen_legacy=11' <<<"$boundary"

          git -C "$world" config user.name 'World qualification'
          git -C "$world" config user.email 'world-qualification@invalid'
          git -C "$world" add -A
          test -n "$(git -C "$world" diff --cached --name-only)"
          GIT_AUTHOR_DATE='2026-09-11T00:00:00Z' \
          GIT_COMMITTER_DATE='2026-09-11T00:00:00Z' \
            git -C "$world" commit -m \
              'refactor(world): complete active Rust ownership modules'
          test -z "$(git -C "$world" status --porcelain=v1 --untracked-files=no)"

          packet="$RUNNER_TEMP/world-live-complete-ownership"
          mkdir -p "$packet"
          git -C "$world" diff --binary "$WORLD_SOURCE_SHA..HEAD" \
            > "$packet/candidate.patch"
          git -C "$world" diff --name-only "$WORLD_SOURCE_SHA..HEAD" \
            | LC_ALL=C sort > "$packet/changed-paths.txt"
          git -C "$world" diff --name-status "$WORLD_SOURCE_SHA..HEAD" \
            > "$packet/changed-status.txt"
          test -s "$packet/candidate.patch"
          test -s "$packet/changed-paths.txt"
          test -z "$(git -C "$world" diff --diff-filter=D --name-only "$WORLD_SOURCE_SHA..HEAD")"
          tar --sort=name --format=gnu --mtime='UTC 2026-09-11' \
            --owner=0 --group=0 --numeric-owner \
            -cf "$packet/candidate-files.tar" -C "$world" \
            -T "$packet/changed-paths.txt"
          gzip -n "$packet/candidate-files.tar"
          {
            printf 'world_repository=%s\n' "$WORLD_REPOSITORY"
            printf 'world_pull_request=%s\n' "$WORLD_PULL_REQUEST"
            printf 'world_source=%s\n' "$WORLD_SOURCE_SHA"
            printf 'world_base=%s\n' "$WORLD_BASE_SHA"
            printf 'candidate_commit=%s\n' "$(git -C "$world" rev-parse HEAD)"
            printf 'candidate_tree=%s\n' "$(git -C "$world" rev-parse 'HEAD^{tree}')"
            printf 'completed_migration_total=54\n'
            printf 'remaining_active_seams=0\n'
            printf 'frozen_legacy_seams=11\n'
            printf 'qualification=pending\n'
            printf 'production_authorization=not_granted\n'
          } > "$packet/identity.txt"
          (cd "$packet" && sha256sum \
            candidate.patch candidate-files.tar.gz changed-paths.txt \
            changed-status.txt identity.txt > SHA256SUMS)
          tar --sort=name --format=gnu --mtime='UTC 2026-09-11' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/world-live-complete-ownership-unqualified.tar.gz" \
            -C "$RUNNER_TEMP" world-live-complete-ownership

      - name: Retain exact unqualified candidate
        uses: ./.github/actions/upload-evidence
        with:
          name: world-live-complete-ownership-unqualified-${{ env.WORLD_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/world-live-complete-ownership-unqualified.tar.gz
          mime_type: application/gzip

      - name: Run Rust format tests and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          cargo fmt --manifest-path "$world/trillionnium/Cargo.toml" --all --check
          cargo test --manifest-path "$world/trillionnium/Cargo.toml" \
            -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server \
            --all-targets --locked
          cargo clippy --manifest-path "$world/trillionnium/Cargo.toml" \
            -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server \
            --all-targets --locked -- -D warnings

      - name: Run complete World truth and source qualification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          boundary="$(python3 scripts/check-trnm-world-include-boundaries.py)"
          printf '%s\n' "$boundary"
          grep -F 'active_migration=0' <<<"$boundary"
          grep -F 'completed_migration=54' <<<"$boundary"
          grep -F 'frozen_legacy=11' <<<"$boundary"
          bash scripts/run-trnm-world-v6-qualification-v2.sh truth
          bash scripts/run-trnm-world-v6-qualification-v2.sh source
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          printf 'WORLD_LIVE_COMPLETE_OWNERSHIP=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'

      - name: Seal qualified candidate
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/world-live-complete-ownership"
          python3 - "$packet/identity.txt" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          if text.count('qualification=pending') != 1:
              raise SystemExit('candidate identity qualification marker drift')
          path.write_text(text.replace('qualification=pending', 'qualification=qualified'), encoding='utf-8')
          PY
          (cd "$packet" && sha256sum \
            candidate.patch candidate-files.tar.gz changed-paths.txt \
            changed-status.txt identity.txt > SHA256SUMS)
          tar --sort=name --format=gnu --mtime='UTC 2026-09-11' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/world-live-complete-ownership-qualified.tar.gz" \
            -C "$RUNNER_TEMP" world-live-complete-ownership

      - name: Upload qualified candidate
        uses: ./.github/actions/upload-evidence
        with:
          name: world-live-complete-ownership-qualified-${{ env.WORLD_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/world-live-complete-ownership-qualified.tar.gz
          mime_type: application/gzip

      - name: Package qualification diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/world-live-complete-ownership-diagnostics"
          mkdir -p "$diagnostics"
          cp "$RUNNER_TEMP/world-pr.json" "$diagnostics/world-pr.json" || true
          {
            printf 'world_source=%s\n' "${WORLD_SOURCE_SHA:-unresolved}"
            printf 'game_driver=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'production_authorization=not_granted\n'
          } > "$diagnostics/run.txt"
          (cd "$diagnostics" && find . -type f ! -name SHA256SUMS \
            -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          tar --sort=name --format=gnu --mtime='UTC 2026-09-11' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/world-live-complete-ownership-diagnostics.tar.gz" \
            -C "$RUNNER_TEMP" world-live-complete-ownership-diagnostics

      - name: Upload qualification diagnostics
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: world-live-complete-ownership-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/world-live-complete-ownership-diagnostics.tar.gz
          mime_type: application/gzip
