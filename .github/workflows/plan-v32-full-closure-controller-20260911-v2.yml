name: plan-v32-full-closure-controller-20260911-v2

on:
  push:
    branches:
      - ops/game-exact-source-snapshot-20260910
    paths:
      - .github/workflows/plan-v32-full-closure-controller-20260911-v2.yml
      - tools/run_plan_v32_full_closure_controller.py
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: plan-v32-full-closure-controller-20260911-v2
  cancel-in-progress: false

jobs:
  close-repository-controlled-blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact controller source without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$GITHUB_WORKSPACE/tools/run_plan_v32_full_closure_controller.py"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustc +1.85.1 --version --verbose
          cargo +1.85.1 --version --verbose
          printf 'RUSTUP_TOOLCHAIN=1.85.1\n' >> "$GITHUB_ENV"

      - name: Execute exact-object closure controller
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 -m py_compile tools/run_plan_v32_full_closure_controller.py
          python3 tools/run_plan_v32_full_closure_controller.py
