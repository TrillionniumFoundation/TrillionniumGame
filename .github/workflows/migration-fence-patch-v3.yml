name: migration-fence-patch-v3

on:
  push:
    branches: [tooling/migration-fence-patch-2026-09-06]
    paths:
      - '.github/workflows/migration-fence-patch-v3.yml'

permissions:
  contents: write

concurrency:
  group: migration-fence-patch-v3
  cancel-in-progress: true

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_BRANCH: codex/migration-fence-control-2026-09-06
      TOOLING_BRANCH: tooling/migration-fence-patch-2026-09-06
      EXPECTED_BASE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch product branch and canonical template
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/product"
          git init "$GITHUB_WORKSPACE/product"
          git -C "$GITHUB_WORKSPACE/product" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/product" fetch --no-tags --depth=64 origin \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/source/product" \
            "+refs/heads/${TOOLING_BRANCH}:refs/remotes/source/tooling"
          git -C "$GITHUB_WORKSPACE/product" checkout -b "$PRODUCT_BRANCH" \
            refs/remotes/source/product
          git -C "$GITHUB_WORKSPACE/product" merge-base --is-ancestor \
            "$EXPECTED_BASE" HEAD
          git -C "$GITHUB_WORKSPACE/product" rev-parse HEAD \
            > "$RUNNER_TEMP/original-head"
          git -C "$GITHUB_WORKSPACE/product" show \
            refs/remotes/source/tooling:.github/workflows/migration-fence-patch.yml \
            > "$RUNNER_TEMP/source-template.yml"

      - name: Build corrected monotonic state machine
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/source-template.yml" <<'PY'
          from pathlib import Path
          import re
          import sys
          import textwrap

          template = Path(sys.argv[1]).read_text(encoding='utf-8')
          match = re.search(
              r"cat > crates/trnm-persistence-core/src/migration_fence\.rs <<'RS'\n(.*?)\n          RS",
              template,
              flags=re.S,
          )
          if match is None:
              raise SystemExit('migration source template missing')
          source = textwrap.dedent(match.group(1)) + '\n'
          source = source.replace(
              '#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub struct MigrationCursor(u64);',
              '#[derive(Clone, Copy, Debug, Eq, Ord, PartialEq, PartialOrd)]\npub struct MigrationCursor(u64);',
              1,
          )
          source = source.replace(
              '    pub cutover_receipt: Option<MigrationDigest>,\n    pub retirement_receipt: Option<MigrationDigest>,',
              '    pub cutover_receipt: Option<MigrationDigest>,\n    pub source_read_only_receipt: Option<MigrationDigest>,\n    pub rollback_receipt: Option<MigrationDigest>,\n    pub retirement_receipt: Option<MigrationDigest>,',
              1,
          )
          source = source.replace(
              '                cutover_receipt: None,\n                retirement_receipt: None,',
              '                cutover_receipt: None,\n                source_read_only_receipt: None,\n                rollback_receipt: None,\n                retirement_receipt: None,',
              1,
          )
          source = source.replace(
              'self.require_phase("ShadowVerified or RolledBack", |phase| {\n            matches!(phase, MigrationPhase::ShadowVerified | MigrationPhase::RolledBack)\n        })?;',
              'self.require_phase("ShadowVerified", |phase| {\n            phase == MigrationPhase::ShadowVerified\n        })?;',
              1,
          )
          source = source.replace(
              '        self.state.cutover_receipt = Some(receipt);\n        self.state.phase = MigrationPhase::SourceReadOnly;',
              '        self.state.source_read_only_receipt = Some(receipt);\n        self.state.phase = MigrationPhase::SourceReadOnly;',
              1,
          )
          source = source.replace(
              '        self.state.fence_epoch = Some(rollback_epoch);\n        self.state.cutover_receipt = Some(rollback_receipt);\n        self.state.phase = MigrationPhase::RolledBack;',
              '        self.state.fence_epoch = Some(rollback_epoch);\n        self.state.rollback_receipt = Some(rollback_receipt);\n        self.state.phase = MigrationPhase::RolledBack;',
              1,
          )
          marker = '''    pub fn rollback(
          '''
          method = '''    pub fn resume_after_rollback(
              &mut self,
              source_cursor: MigrationCursor,
          ) -> Result<(), MigrationFenceError> {
              self.require_phase("RolledBack", |phase| {
                  phase == MigrationPhase::RolledBack
              })?;
              if source_cursor < self.state.source_cursor {
                  return Err(MigrationFenceError::CursorRegression {
                      side: "source",
                      current: self.state.source_cursor.get(),
                      received: source_cursor.get(),
                  });
              }
              self.state.source_cursor = source_cursor;
              self.state.target_cursor = MigrationCursor::new(0);
              self.state.semantic_digest = None;
              self.state.cutover_receipt = None;
              self.state.source_read_only_receipt = None;
              self.state.retirement_receipt = None;
              self.state.phase = MigrationPhase::CatchingUp;
              Ok(())
          }

          '''
          if marker not in source:
              raise SystemExit('rollback method marker missing')
          source = source.replace(marker, method + marker, 1)
          old_test = '''        assert_eq!(fence.authority_mode(), AuthorityMode::SourceOnly);
                  assert_eq!(fence.snapshot().phase, MigrationPhase::RolledBack);
              }
          '''
          new_test = '''        assert_eq!(fence.authority_mode(), AuthorityMode::SourceOnly);
                  assert_eq!(fence.snapshot().phase, MigrationPhase::RolledBack);
                  assert!(matches!(
                      fence.activate_write_fence(FenceEpoch::new(6).unwrap(), digest(12)),
                      Err(MigrationFenceError::InvalidPhase { .. })
                  ));
                  fence
                      .resume_after_rollback(MigrationCursor::new(12))
                      .unwrap();
                  fence.advance_target(MigrationCursor::new(12)).unwrap();
                  fence.verify_shadow(digest(13), digest(13)).unwrap();
                  fence
                      .activate_write_fence(FenceEpoch::new(6).unwrap(), digest(12))
                      .unwrap();
              }
          '''
          if old_test not in source:
              raise SystemExit('rollback regression anchor missing')
          source = source.replace(old_test, new_test, 1)
          destination = Path('crates/trnm-persistence-core/src/migration_fence.rs')
          destination.write_text(source, encoding='utf-8')

          path = Path('crates/trnm-persistence-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          block = '''

          mod migration_fence;

          pub use migration_fence::{
              AuthorityMode, FenceEpoch, MigrationCursor, MigrationDigest, MigrationFence,
              MigrationFenceError, MigrationFenceSnapshot, MigrationIdentity, MigrationPhase,
          };
          '''
          if 'mod migration_fence;' not in text:
              path.write_text(text.rstrip() + textwrap.dedent(block), encoding='utf-8')
          PY

      - name: Normalize and validate exact source
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          git add -N crates/trnm-persistence-core/src/migration_fence.rs
          cargo fmt --manifest-path crates/trnm-persistence-core/Cargo.toml
          git diff --check
          cargo fmt --manifest-path crates/trnm-persistence-core/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-persistence-core/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-persistence-core/Cargo.toml \
            --all-targets --locked -- -D warnings

      - name: CAS fast-forward validated product branch
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add crates/trnm-persistence-core/src
          if git diff --cached --quiet; then
            printf 'source_already_current=true\nhead=%s\n' "$original"
            exit 0
          fi
          git diff --cached --check
          git commit -m 'feat(data): require post-rollback revalidation and distinct receipts'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${original}"
          printf 'old_head=%s\nnew_head=%s\ntree=%s\n' \
            "$original" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Preserve claim boundary
        shell: bash
        run: |
          printf '%s\n' \
            'source_candidate=true' \
            'migration_executed=false' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false' \
            'cutover_authorized=false' \
            'nakama_retired=false'
