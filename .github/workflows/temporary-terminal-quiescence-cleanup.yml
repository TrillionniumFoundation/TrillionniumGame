name: temporary-terminal-quiescence-cleanup

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: terminal-gap-closure-cleanup
  cancel-in-progress: false

jobs:
  clean-and-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Fetch exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Wait for a quiet tip
        id: quiet
        shell: bash
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          sleep 90
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          if test "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA"; then
            echo 'branch advanced; newer push owns cleanup'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Record frontier and remove every temporary workflow
        if: steps.quiet.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          required = {
              'outbox_dispatch': 'crates/trnm-persistence-pg/src/outbox_dispatch.rs',
              'outbox_worker': 'crates/trnm-persistence-pg/src/outbox_worker.rs',
              'outbox_live_test': 'crates/trnm-persistence-pg/tests/outbox_dispatch.rs',
              'outbox_permanent_workflow': '.github/workflows/pg-outbox-dispatch.yml',
          }
          present = {name: (root / path).is_file() for name, path in required.items()}
          missing = [required[name] for name, value in present.items() if not value]
          document = {
              'schema': 'trillionnium.outbox-closure-frontier.v1',
              'observed_at': datetime.now(timezone.utc).isoformat(),
              'source_frontier': present,
              'missing': missing,
              'status': 'source-frontier-complete' if not missing else 'source-frontier-partial',
              'claim_boundary': {
                  'compatibility_credit': False,
                  'production_credit': False,
                  'independent_review_completed': False,
                  'endurance_completed': False,
              },
          }
          path = root / 'docs/status/OUTBOX_CLOSURE_FRONTIER.json'
          path.write_text(
              json.dumps(document, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          for workflow in (root / '.github/workflows').glob('temporary-*.y*ml'):
              workflow.unlink()
          PY
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          git diff --check

      - name: Validate all retained source
        if: steps.quiet.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Push terminal clean head
        if: steps.quiet.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "chore(ci): freeze terminal gap-closure candidate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
