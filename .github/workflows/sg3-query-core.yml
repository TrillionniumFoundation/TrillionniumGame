name: trillionnium-game-query-core

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'NOTICE'
      - 'crates/trnm-query-core/**'
      - 'contracts/query/**'
      - 'scripts/check-query-core.py'
      - 'scripts/check-rust-foundation.py'
      - 'scripts/fetch-query-upstream.py'
      - 'tests/query/**'
      - 'docs/DEVELOPMENT.md'
      - 'docs/COMPATIBILITY.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'docs/status/QUERY_CORE_STATUS.json'
      - '.github/workflows/sg3-query-core.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-query-core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract-reference-and-source-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate Rust foundation and query contracts
        run: |
          set -euo pipefail
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-storage-core.py
          python3 scripts/check-query-core.py
      - name: Execute independent query vectors
        run: python3 -m unittest discover -s tests/query -p 'test_*.py' -v
      - name: Verify exact public upstream query sources
        run: python3 scripts/fetch-query-upstream.py --output run/query-upstream
      - name: Seal source-lock evidence in the immutable job log
        run: |
          set -euo pipefail
          test -s run/query-upstream/evidence.json
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/query-upstream-${CANDIDATE_SHA}.tar.gz \
            -C run/query-upstream .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/query-upstream-${CANDIDATE_SHA}.tar.gz
          cat run/query-upstream/evidence.json

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Format
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --workspace --all-targets --locked
      - name: Strict lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
