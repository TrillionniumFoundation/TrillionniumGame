name: temporary-outbox-dispatch-finalizer

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-outbox-dispatch-closure
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Fetch exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Recover implementation when needed and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          module = root / 'crates/trnm-persistence-pg/src/outbox_dispatch.rs'
          lib = root / 'crates/trnm-persistence-pg/src/lib.rs'

          if not module.is_file():
              primary = root / '.github/workflows/temporary-outbox-dispatch-closure.yml'
              if not primary.is_file():
                  raise SystemExit('outbox source absent and recovery payload unavailable')
              workflow_text = primary.read_text(encoding='utf-8')
              start_marker = "          cat > /tmp/outbox_dispatch.rs <<'RUST'\n"
              end_marker = "          RUST\n\n          python3 - <<'PY'"
              start = workflow_text.find(start_marker)
              end = workflow_text.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit('outbox recovery payload markers missing')
              payload = workflow_text[start + len(start_marker):end]
              lines = []
              for line in payload.splitlines():
                  if line and not line.startswith('          '):
                      raise SystemExit(f'outbox source indentation drift: {line!r}')
                  lines.append(line[10:] if line else '')
              module.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          text = lib.read_text(encoding='utf-8')
          if 'mod outbox_dispatch;' not in text:
              marker = '#![forbid(unsafe_code)]\n\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'{lib}: source anchor missing or ambiguous')
              text = text.replace(marker, marker + 'mod outbox_dispatch;\n\n', 1)
          export = (
              'pub use outbox_dispatch::{\n'
              '    LeasedOutboxIntent, OutboxFailureOutcome, OutboxIntentState, OutboxLeaseBatch,\n'
              '    OutboxLeasePolicy,\n'
              '};\n\n'
          )
          if 'pub use outbox_dispatch::' not in text:
              text = text.replace('mod outbox_dispatch;\n\n', 'mod outbox_dispatch;\n\n' + export, 1)
          lib.write_text(text, encoding='utf-8')

          doc = root / 'docs/development/PG_OUTBOX_DISPATCH_SOURCE_CANDIDATE.md'
          if not doc.is_file():
              doc.write_text(
                  '''# PG outbox dispatch source candidate

Status: `source-candidate`. Compatibility, durability, production and retirement credit remain false.

The authoritative PG-wire repository exposes bounded ordered leasing, expired-lease node-failure
reclaim, owner plus lease-generation fencing, completion/retry/dead-letter atomic transitions and
fail-closed attempt exhaustion. Remaining work includes the background dispatcher, external-effect
adapters, acknowledgement reconciliation, both-profile fault injection, node-loss/endurance proof,
metrics/SLO integration and independent data-integrity review.
''',
                  encoding='utf-8',
              )

          inventory_path = root / 'docs/status/IMPLEMENTATION_INVENTORY.json'
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          for component in inventory.get('components', []):
              if component.get('id') in {'COMP-PERSISTENCE-PG', 'COMP-TRNM-SERVER'}:
                  fact = 'generation-fenced PG outbox lease, reclaim, complete, retry and dead-letter source API'
                  implemented = component.setdefault('implemented', [])
                  if fact not in implemented:
                      implemented.append(fact)
                  missing = component.setdefault('missing', [])
                  if 'outbox delivery worker' in missing:
                      missing.remove('outbox delivery worker')
                  remaining = (
                      'background outbox delivery loop, external-effect adapter, reconciliation and '
                      'both-profile node-loss/endurance evidence'
                  )
                  if remaining not in missing:
                      missing.append(remaining)
          inventory_path.write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          roadmap_path = root / 'docs/roadmap/NEXT_MILESTONE.json'
          roadmap = json.loads(roadmap_path.read_text(encoding='utf-8'))
          for item in roadmap.get('items', []):
              if item.get('id') == 'TG-V3-024' and item.get('status') in {'planned', 'ready', 'blocked'}:
                  item['status'] = 'in-progress'
          roadmap_path.write_text(
              json.dumps(roadmap, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          current_path = root / 'docs/status/CURRENT_STATE.json'
          current = json.loads(current_path.read_text(encoding='utf-8'))
          current.setdefault('implementation', {})[
              'pg_outbox_generation_fenced_dispatch_source_candidate'
          ] = True
          current_path.write_text(
              json.dumps(current, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          for name in (
              'temporary-outbox-dispatch-closure.yml',
              'temporary-outbox-dispatch-rescue.yml',
              'temporary-outbox-dispatch-finalizer.yml',
          ):
              path = root / '.github/workflows' / name
              if path.is_file():
                  path.unlink()
          PY
          test -f crates/trnm-persistence-pg/src/outbox_dispatch.rs
          test ! -e .github/workflows/temporary-outbox-dispatch-closure.yml
          test ! -e .github/workflows/temporary-outbox-dispatch-rescue.yml
          test ! -e .github/workflows/temporary-outbox-dispatch-finalizer.yml
          git diff --check

      - name: Full source validation
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo check --package trnm-persistence-pg --all-targets --locked
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --fix --allow-dirty --allow-staged \
            --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Push only from unchanged trigger head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-outbox-dispatch-*.yml' -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(outbox): add generation-fenced PG dispatch transitions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
