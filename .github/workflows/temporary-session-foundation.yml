name: temporary-session-foundation

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-session-foundation-v4
  cancel-in-progress: false

jobs:
  patch-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Apply deterministic session-foundation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/tmp/apply-session-foundation.py')
          source = path.read_text(encoding='utf-8')
          start_marker = 'for checker in (\n'
          end_marker = '\nreplace_exact(\n    "scripts/check-trnm-server.py",\n    \'\'\'REQUIRED_FILES'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0 or source.find(start_marker, start + 1) >= 0:
              raise SystemExit('ambiguous dependency-patch loop in session patch')
          replacement = '''replace_exact(
              "scripts/check-rust-foundation.py",
              \'\'\'    "crates/trnm-persistence-pg": {
                  "native-tls": "=0.2.18",
                  "postgres": "=0.19.14",
                  "postgres-native-tls": "=0.5.3",
                  "r2d2": "=0.8.10",
                  "r2d2_postgres": "=0.18.2",
                  "trnm-contracts": {"path": "../trnm-contracts"},
              },
          \'\'\',
              \'\'\'    "crates/trnm-persistence-pg": {
                  "native-tls": "=0.2.18",
                  "postgres": "=0.19.14",
                  "postgres-native-tls": "=0.5.3",
                  "r2d2": "=0.8.10",
                  "r2d2_postgres": "=0.18.2",
                  "trnm-contracts": {"path": "../trnm-contracts"},
                  "trnm-session-core": {"path": "../trnm-session-core"},
                  "trnm-token-jwt-adapter": {"path": "../trnm-token-jwt-adapter"},
              },
          \'\'\',
          )

          replace_exact(
              "scripts/check-trnm-server.py",
              \'\'\'        "trnm-contracts": {"path": "../trnm-contracts"},
          \'\'\',
              \'\'\'        "trnm-contracts": {"path": "../trnm-contracts"},
                  "trnm-session-core": {"path": "../trnm-session-core"},
                  "trnm-token-jwt-adapter": {"path": "../trnm-token-jwt-adapter"},
          \'\'\',
          )
          '''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
          python3 -m py_compile .github/tmp/apply-session-foundation.py
          python3 .github/tmp/apply-session-foundation.py

          python3 - <<'PY'
          from pathlib import Path

          session = Path('crates/trnm-persistence-pg/src/session.rs')
          source = session.read_text(encoding='utf-8')
          old_import = '''use trnm_contracts::{Digest32, DomainError, RetryClass, StableCode, UserId};
          use trnm_session_core::{RefreshTokenId, RevocationReason, SessionFamilyId};
          '''
          new_import = '''use trnm_contracts::{
              Digest32, DomainError, RefreshTokenId, RetryClass, SessionFamilyId, StableCode, UserId,
          };
          use trnm_session_core::RevocationReason;
          '''
          if source.count(old_import) != 1:
              raise SystemExit('session source import anchor mismatch')
          source = source.replace(old_import, new_import, 1)
          replacements = {
              'RevocationReason::Compromised': 'RevocationReason::CredentialReset',
              'RevocationReason::ReplayDetected': 'RevocationReason::RefreshReplay',
              'RevocationReason::Administrative': 'RevocationReason::Administrator',
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          expired_arm = '''        RevocationReason::Expired => Err(invalid("expired_revocation_reason_not_persisted")),
          '''
          if source.count(expired_arm) != 1:
              raise SystemExit('expired revocation arm anchor mismatch')
          source = source.replace(expired_arm, '', 1)

          needle = 'revocation_reason_code(RevocationReason::Expired)'
          if source.count(needle) != 1:
              raise SystemExit('expired revocation test call mismatch')
          call = source.index(needle)
          assertion_start = source.rfind('        assert_eq!(', 0, call)
          assertion_end = source.find('        );\n', call)
          if assertion_start < 0 or assertion_end < 0:
              raise SystemExit('expired revocation assertion boundaries missing')
          assertion_end += len('        );\n')
          source = source[:assertion_start] + source[assertion_end:]
          session.write_text(source, encoding='utf-8')

          auth = Path('crates/trnm-persistence-pg/src/bin/trnm_server/auth.rs')
          source = auth.read_text(encoding='utf-8')
          old_import = '''use trnm_contracts::{Digest32, DomainError, RetryClass, StableCode, UserId};
          use trnm_session_core::{RefreshTokenId, SessionFamilyId};
          '''
          new_import = '''use trnm_contracts::{
              Digest32, DomainError, RefreshTokenId, RetryClass, SessionFamilyId, StableCode, UserId,
          };
          '''
          if source.count(old_import) != 1:
              raise SystemExit('auth source import anchor mismatch')
          auth.write_text(source.replace(old_import, new_import, 1), encoding='utf-8')

          checker = Path('scripts/check-trnm-server.py')
          source = checker.read_text(encoding='utf-8')
          if source.count('RevocationReason::ReplayDetected') != 1:
              raise SystemExit('server checker replay marker mismatch')
          checker.write_text(
              source.replace(
                  'RevocationReason::ReplayDetected',
                  'RevocationReason::RefreshReplay',
                  1,
              ),
              encoding='utf-8',
          )
          PY
          rm .github/tmp/apply-session-foundation.py
          test ! -e .github/workflows/temporary-session-foundation.yml
          git diff --check
          python3 -m json.tool docs/status/TRNM_SERVER_STATUS.json >/dev/null
          python3 -m json.tool docs/roadmap/NEXT_MILESTONE.json >/dev/null

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1

      - name: Resolve root lock and validate all root targets
        shell: bash
        run: |
          set -euo pipefail
          cargo check --package trnm-persistence-pg --all-targets
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Validate isolated JWT adapter after public digest export
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/trnm-token-jwt-adapter/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-token-jwt-adapter/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path crates/trnm-token-jwt-adapter/Cargo.toml --all-targets --locked -- -D warnings

      - name: Validate plan and Python control corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check

      - name: Commit validated source and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-session-foundation.yml
          test ! -e .github/tmp/apply-session-foundation.py
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(session): add JWT and refresh-family foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
