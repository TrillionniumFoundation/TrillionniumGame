name: architecture-convergence-transport-b

on:
  push:
    branches:
      - codex/architecture-convergence-transport-b-2026-09-08
    paths:
      - .github/workflows/architecture-convergence-transport-b.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: architecture-convergence-transport
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/architecture-gap-closure-2026-09-08
    steps:
      - name: Fetch current target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          target_head=$(git -C "$GITHUB_WORKSPACE" rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          git -C "$GITHUB_WORKSPACE" checkout --detach "$target_head"
          printf '%s\n' "$target_head" > "$RUNNER_TEMP/target-before.txt"

      - name: Apply convergence or recognize completed state
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ ! -e crates/trnm-token-jwt-adapter-gate/Cargo.toml \
                && ! -e crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml \
                && -e crates/trnm-persistence-pg/src/bin/trnm-pg-compat-server.rs ]] \
             && grep -Fq 'name = "trnm-server"' crates/trnm-server/Cargo.toml; then
            touch "$RUNNER_TEMP/already-converged"
            exit 0
          fi

          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/TrillionniumFoundation/TrillionniumGame/codex/architecture-convergence-transport-a-2026-09-08/.github/workflows/architecture-convergence-transport.yml' \
            > "$RUNNER_TEMP/source-workflow.yml"
          python3 - <<'PY'
          from pathlib import Path
          source = Path(__import__('os').environ['RUNNER_TEMP']) / 'source-workflow.yml'
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          block = lines[start:end]
          indentation = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          script = '\n'.join(line[indentation:] for line in block) + '\n'
          target = Path(__import__('os').environ['RUNNER_TEMP']) / 'converge.py'
          target.write_text(script, encoding='utf-8')
          PY
          python3 "$RUNNER_TEMP/converge.py"

          python3 - <<'PY'
          from pathlib import Path

          codeowners = Path('.github/CODEOWNERS')
          if codeowners.exists():
              codeowners.write_text(
                  ''.join(
                      line for line in codeowners.read_text(encoding='utf-8').splitlines(keepends=True)
                      if 'trnm-token-jwt-adapter-gate' not in line
                  ),
                  encoding='utf-8',
              )

          test = Path('tests/control_plane/test_crypto_path_authority.py')
          if test.exists():
              text = test.read_text(encoding='utf-8')
              text = text.replace(
                  'self.assertFalse(summary["all_active_crypto_paths_reviewed_provider_backed"])',
                  'self.assertTrue(summary["all_active_crypto_paths_reviewed_provider_backed"])',
              )
              text = text.replace(
                  'self.assertFalse(summary["private_compatibility_implementation_removed"])',
                  'self.assertTrue(summary["private_compatibility_implementation_removed"])',
              )
              test.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Generate root lock and format
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ -e "$RUNNER_TEMP/already-converged" ]]; then exit 0; fi
          rm -f Cargo.lock
          cargo generate-lockfile
          cargo fmt --all
          git diff --check

      - name: Run repository control plane
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run complete Rust validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Go validation
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/runtime"
          test -z "$(find . -type f -name '*.go' -print0 | sort -z | xargs -0 gofmt -l)"
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...

      - name: Publish atomically when target is unchanged
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ -e "$RUNNER_TEMP/already-converged" ]]; then
            echo 'target already contains the converged source'
            exit 0
          fi
          test ! -e .github/workflows/architecture-source-export-one-shot.yml
          test ! -e .github/workflows/architecture-test-name-one-shot.yml
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          before=$(cat "$RUNNER_TEMP/target-before.txt")
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$before"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: converge workspace server and crypto authority'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Clean transport refs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          for branch in \
            codex/architecture-convergence-transport-2026-09-08 \
            codex/architecture-convergence-transport-v2-2026-09-08 \
            codex/architecture-convergence-transport-v3-2026-09-08 \
            codex/architecture-convergence-transport-v4-2026-09-08 \
            codex/architecture-convergence-transport-v5-2026-09-08 \
            codex/architecture-convergence-transport-v6-2026-09-08 \
            codex/architecture-convergence-transport-final-2026-09-08 \
            codex/architecture-convergence-transport-run-2026-09-08 \
            codex/architecture-convergence-transport-exec-2026-09-08 \
            codex/architecture-convergence-transport-only-2026-09-08 \
            codex/architecture-convergence-transport-go-2026-09-08 \
            codex/architecture-convergence-transport-workflow-2026-09-08 \
            codex/architecture-convergence-transport-z-2026-09-08 \
            codex/architecture-convergence-transport-x-2026-09-08 \
            codex/architecture-convergence-transport-y-2026-09-08 \
            codex/architecture-convergence-transport-a-2026-09-08 \
            codex/architecture-convergence-transport-b-2026-09-08
          do
            git push origin --delete "$branch" >/dev/null 2>&1 || true
          done
