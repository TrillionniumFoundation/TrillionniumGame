name: World V4 direct-source conformance export

on:
  push:
    branches:
      - evidence/world-v4-direct-source-export-20260830
    paths:
      - '.github/workflows/world-v4-direct-source-export-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v4-direct-source-export-${{ github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_COMMIT: cb662abffce882aaeed8ec30402e889ba235d786
  WORLD_TREE: 7a9be1f6859f5f57e4262b047e7b0243d384b9c2
  WORLD_TEMPLATE_BLOB: 8882f47db55ca5993329594901c828c6faf325a8
  RUST_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  export:
    name: world-v4-direct-source/export-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout evidence definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Revalidate Nakama repository boundary
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/project-preflight.sh
          test -z "$(git status --porcelain)"

      - name: Checkout exact World candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.WORLD_REPOSITORY }}
          ref: ${{ env.WORLD_COMMIT }}
          path: trillionnium-world
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable World identity and boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C trillionnium-world rev-parse HEAD)" = "$WORLD_COMMIT"
          test "$(git -C trillionnium-world rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"
          test -z "$(git -C trillionnium-world status --porcelain)"
          (cd trillionnium-world && bash scripts/project-preflight.sh --audit)

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustc "+$RUST_TOOLCHAIN" --version --verbose
          cargo "+$RUST_TOOLCHAIN" --version --verbose

      - name: Materialize ordinary directly compiled source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/trillionnium-world"
          CRATE="$ROOT/trillionnium/crates/trnm-game-server"
          EXPORT="$PWD/world-v4-direct-source-export"
          GENERATED="$EXPORT/generated"
          mkdir -p "$GENERATED"

          original_blob="$(git -C "$ROOT" hash-object trillionnium/crates/trnm-game-server/src/lib.rs.in)"
          test "$original_blob" = "$WORLD_TEMPLATE_BLOB"
          printf 'repository=%s\ncommit=%s\ntree=%s\ntemplate_blob=%s\nrust_toolchain=%s\n' \
            "$WORLD_REPOSITORY" "$WORLD_COMMIT" "$WORLD_TREE" "$original_blob" "$RUST_TOOLCHAIN" \
            > "$EXPORT/identity.txt"

          rustc "+$RUST_TOOLCHAIN" --edition=2021 "$CRATE/build.rs" -o "$EXPORT/materialize-game-server"
          (
            cd "$CRATE"
            OUT_DIR="$GENERATED" CARGO_MANIFEST_DIR="$CRATE" "$EXPORT/materialize-game-server"
          )

          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('trillionnium-world').resolve()
          crate = root / 'trillionnium/crates/trnm-game-server'
          export = Path('world-v4-direct-source-export').resolve()
          template_path = crate / 'src/lib.rs.in'
          generated_path = export / 'generated/trnm_game_server_lib_generated.rs'
          template = template_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          generated = generated_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          marker = 'use axum::extract::DefaultBodyLimit;\n'
          assert template.count(marker) == 1, 'reviewed source header marker drifted'
          assert generated.startswith(marker), 'generated body marker drifted'
          direct = template[: template.index(marker)] + generated
          direct, replacements = re.subn(
              r'include_str!\(concat!\(::std::env!\("CARGO_MANIFEST_DIR"\), "/migrations/([^"]+)"\)\)',
              r'include_str!("../migrations/\1")',
              direct,
          )
          assert replacements >= 19, f'expected migration include rewrites, observed {replacements}'

          required = [
              'const MIGRATION_V16:',
              'const MIGRATION_V17:',
              'const MIGRATION_V18:',
              'const MIGRATION_V19:',
              '(16, "0016_online_settlement_outbox_v1", MIGRATION_V16)',
              '"0017_online_settlement_worker_runtime_v1"',
              '"0018_online_settlement_operator_controls_v1"',
              '"0019_online_settlement_quarantine_v1"',
              'terminal settlement is owned by trnm-settlement-worker; in-process settlement is prohibited',
          ]
          forbidden = [
              'include!(concat!(env!("OUT_DIR")',
              'trnm_game_server_lib_generated.rs',
              'reconcile_economy(&state.cex',
              'settle_pending_matches(&settlement_state',
          ]
          for needle in required:
              assert needle in direct, f'direct source omitted {needle}'
          for needle in forbidden:
              assert needle not in direct, f'direct source retained {needle}'

          direct_path = crate / 'src/lib.rs'
          direct_path.write_text(direct, encoding='utf-8', newline='\n')
          template_path.unlink()
          (crate / 'build.rs').unlink()

          cargo_path = crate / 'Cargo.toml'
          cargo = cargo_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          cargo, count = re.subn(r'(?m)^build = "build\.rs"\n', '', cargo)
          assert count == 1, f'Cargo build declaration replacements: {count}'
          cargo_path.write_text(cargo, encoding='utf-8', newline='\n')

          boundary = r'''use std::path::Path;

          const GAME_SERVER_ENTRYPOINT: &str = include_str!("../src/lib.rs");
          const SETTLEMENT_WORKER_ENTRYPOINT: &str = include_str!("../src/settlement_worker.rs");
          const SETTLEMENT_WORKER_LEGACY: &str = include_str!("../src/settlement_worker_legacy.rs");
          const SETTLEMENT_WORKER_RUNTIME_V2: &str =
              include_str!("../src/settlement_worker_runtime_v2.rs");

          #[test]
          fn game_server_is_direct_source_and_does_not_execute_terminal_economy_settlement() {
              let crate_root = Path::new(env!("CARGO_MANIFEST_DIR"));
              assert!(!crate_root.join("build.rs").exists());
              assert!(!crate_root.join("src/lib.rs.in").exists());
              assert!(!GAME_SERVER_ENTRYPOINT.contains("OUT_DIR"));
              assert!(!GAME_SERVER_ENTRYPOINT.contains("trnm_game_server_lib_generated.rs"));
              assert!(!GAME_SERVER_ENTRYPOINT.contains("reconcile_economy(&state.cex"));
              assert!(!GAME_SERVER_ENTRYPOINT.contains("settle_pending_matches(&settlement_state"));
              assert!(GAME_SERVER_ENTRYPOINT.contains(
                  "terminal settlement is owned by trnm-settlement-worker; in-process settlement is prohibited"
              ));
          }

          #[test]
          fn both_direct_runtime_entrypoints_register_the_complete_settlement_migration_chain() {
              assert!(!SETTLEMENT_WORKER_ENTRYPOINT.contains("OUT_DIR"));
              assert!(!SETTLEMENT_WORKER_ENTRYPOINT.contains("trnm_settlement_worker_generated.rs"));
              let worker = format!("{SETTLEMENT_WORKER_LEGACY}\n{SETTLEMENT_WORKER_RUNTIME_V2}");
              for marker in [
                  "0016_online_settlement_outbox_v1",
                  "0017_online_settlement_worker_runtime_v1",
                  "0018_online_settlement_operator_controls_v1",
                  "0019_online_settlement_quarantine_v1",
              ] {
                  assert!(GAME_SERVER_ENTRYPOINT.contains(marker), "direct game server lost {marker}");
                  assert!(worker.contains(marker), "direct settlement worker lost {marker}");
              }
          }

          #[test]
          fn directly_compiled_migration_includes_are_source_relative() {
              for source in [
                  GAME_SERVER_ENTRYPOINT,
                  SETTLEMENT_WORKER_LEGACY,
                  SETTLEMENT_WORKER_RUNTIME_V2,
              ] {
                  assert!(source.contains("include_str!(\"../migrations/"));
                  assert!(!source.contains("CARGO_MANIFEST_DIR"));
              }
          }
          '''
          boundary = re.sub(r'(?m)^          ', '', boundary).lstrip()
          boundary_path = crate / 'tests/settlement_game_server_boundary.rs'
          boundary_path.write_text(boundary, encoding='utf-8', newline='\n')

          worker_path = crate / 'tests/settlement_worker_contract.rs'
          worker = worker_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          worker, count = re.subn(
              r'const BUILD_SCRIPT: &str = include_str!\("\.\./build\.rs"\);\n',
              '',
              worker,
          )
          assert count == 1, f'worker build-script const replacements: {count}'
          replacement = r'''#[test]
          fn settlement_worker_is_directly_compiled_from_reviewed_modules() {
              assert!(WORKER_WRAPPER.contains("settlement_worker_legacy.rs"));
              assert!(WORKER_WRAPPER.contains("settlement_worker_runtime_v2.rs"));
              assert!(WORKER_WRAPPER.contains("run_v2 as run"));
              assert!(!WORKER_WRAPPER.contains("OUT_DIR"));
              assert!(!WORKER_WRAPPER.contains("trnm_settlement_worker_generated.rs"));

              let crate_root = PathBuf::from(env!("CARGO_MANIFEST_DIR"));
              assert!(!crate_root.join("build.rs").exists(), "semantic build script must stay removed");
              assert!(!crate_root.join("src/lib.rs.in").exists(), "game-server template authority must stay removed");
              assert!(!crate_root.join("src/settlement_worker.rs.in").exists(), "worker template authority must stay removed");
          }
          '''
          replacement = re.sub(r'(?m)^          ', '', replacement)
          worker, count = re.subn(
              r'#\[test\]\nfn settlement_worker_is_directly_compiled_from_reviewed_modules\(\) \{.*?\n\}\n(?=\n#\[test\])',
              replacement.rstrip() + '\n',
              worker,
              count=1,
              flags=re.S,
          )
          assert count == 1, f'worker direct-source test replacements: {count}'
          assert 'include_str!("../build.rs")' not in worker
          assert 'BUILD_SCRIPT' not in worker
          worker_path.write_text(worker, encoding='utf-8', newline='\n')
          PY

          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 "$CRATE/src/lib.rs"
          rustfmt "+$RUST_TOOLCHAIN" --edition 2021 \
            "$CRATE/tests/settlement_game_server_boundary.rs" \
            "$CRATE/tests/settlement_worker_contract.rs"

          git -C "$ROOT" diff --binary -- \
            trillionnium/crates/trnm-game-server/Cargo.toml \
            trillionnium/crates/trnm-game-server/build.rs \
            trillionnium/crates/trnm-game-server/src/lib.rs \
            trillionnium/crates/trnm-game-server/src/lib.rs.in \
            trillionnium/crates/trnm-game-server/tests/settlement_game_server_boundary.rs \
            trillionnium/crates/trnm-game-server/tests/settlement_worker_contract.rs \
            > "$EXPORT/direct-source.patch"
          test -s "$EXPORT/direct-source.patch"
          cp "$CRATE/src/lib.rs" "$EXPORT/lib.rs"
          cp "$CRATE/Cargo.toml" "$EXPORT/Cargo.toml"
          cp "$CRATE/tests/settlement_game_server_boundary.rs" "$EXPORT/settlement_game_server_boundary.rs"
          cp "$CRATE/tests/settlement_worker_contract.rs" "$EXPORT/settlement_worker_contract.rs"
          git -C "$ROOT" hash-object "$CRATE/src/lib.rs" > "$EXPORT/lib.rs.git-blob"

      - name: Validate directly compiled World source
        working-directory: trillionnium-world/trillionnium
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$RUST_TOOLCHAIN" fmt --all -- --check
          cargo "+$RUST_TOOLCHAIN" check -p trnm-game-server --lib --locked
          cargo "+$RUST_TOOLCHAIN" test -p trnm-game-server --lib --locked
          cargo "+$RUST_TOOLCHAIN" test -p trnm-game-server --test settlement_game_server_boundary --locked
          cargo "+$RUST_TOOLCHAIN" test -p trnm-game-server --test settlement_worker_contract --locked
          cargo "+$RUST_TOOLCHAIN" test -p trnm-game-server --test settlement_fault_model --locked
          cargo "+$RUST_TOOLCHAIN" clippy -p trnm-game-server --all-targets --locked -- -D warnings
          printf 'passed\n' > "$GITHUB_WORKSPACE/world-v4-direct-source-export/validation-status.txt"

      - name: Record failed validation without hiding artifacts
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p world-v4-direct-source-export
          printf 'failed\n' > world-v4-direct-source-export/validation-status.txt

      - name: Bind immutable artifact hashes
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p world-v4-direct-source-export
          (
            cd world-v4-direct-source-export
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
              | LC_ALL=C sort \
              | xargs -r sha256sum \
              > SHA256SUMS
          )

      - name: Upload exact direct-source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-v4-direct-source-${{ env.WORLD_COMMIT }}
          path: world-v4-direct-source-export/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
