name: World V4 direct-source conformance export

on:
  push:
    branches:
      - evidence/world-v4-direct-source-export-20260830
    paths:
      - '.github/workflows/world-v4-direct-source-export-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove hosted runner startup
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_started=true\n'
