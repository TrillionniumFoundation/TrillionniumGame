name: World V4 direct-source conformance export

on:
  push:
    branches:
      - evidence/world-v4-direct-source-export-20260830
    paths:
      - '.github/workflows/world-v4-direct-source-export-evidence.yml'
      - 'scripts/world_v4_direct_source_export.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout evidence definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Revalidate Nakama project boundary
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/project-preflight.sh
          test -z "$(git status --porcelain)"

      - name: Checkout exact World candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TrillionniumFoundation/Trillionnium-World
          ref: cb662abffce882aaeed8ec30402e889ba235d786
          path: trillionnium-world
          fetch-depth: 1
          persist-credentials: false

      - name: Export deterministic direct-source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/world_v4_direct_source_export.py \
            --repo trillionnium-world \
            --output world-v4-direct-source-export

      - name: Upload immutable direct-source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-v4-direct-source-cb662abf
          path: world-v4-direct-source-export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
