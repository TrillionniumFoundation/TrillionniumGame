name: World V4 direct-source conformance export

on:
  push:
    branches:
      - evidence/world-v4-direct-source-export-20260830
    paths:
      - '.github/workflows/world-v4-direct-source-export-evidence.yml'
      - 'scripts/world_v4_direct_source_export.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-v4-direct-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact evidence definition without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)"
          python3 - "$GITHUB_WORKSPACE/PROJECT_BOUNDARY.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              boundary = json.load(stream)
          assert boundary["project_id"] == "trillionnium-game"
          assert boundary["repository_id"] == 1323087470
          assert boundary["current_repository"] == "TrillionniumFoundation/TrillionniumGame"
          assert boundary["lane"] == "game-backend-platform"
          assert "world-gameplay-rules" in boundary["does_not_own"]
          assert "cross-repository-release-orchestration" in boundary["does_not_own"]
          PY

      - name: Install World preflight runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      - name: Fetch exact World candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          WORLD="$RUNNER_TEMP/trillionnium-world"
          rm -rf "$WORLD"
          git init "$WORLD"
          git -C "$WORLD" remote add origin \
            https://github.com/TrillionniumFoundation/Trillionnium-World.git
          git -C "$WORLD" fetch --no-tags --depth=1 origin \
            cb662abffce882aaeed8ec30402e889ba235d786
          git -C "$WORLD" checkout --detach FETCH_HEAD
          test "$(git -C "$WORLD" rev-parse HEAD)" = \
            cb662abffce882aaeed8ec30402e889ba235d786
          test "$(git -C "$WORLD" rev-parse 'HEAD^{tree}')" = \
            7a9be1f6859f5f57e4262b047e7b0243d384b9c2
          test -z "$(git -C "$WORLD" status --porcelain)"

      - name: Revalidate exact World project boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/trillionnium-world"
          bash scripts/project-preflight.sh --audit

      - name: Export deterministic direct-source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/world_v4_direct_source_export.py" \
            --repo "$RUNNER_TEMP/trillionnium-world" \
            --output "$RUNNER_TEMP/world-v4-direct-source-export"

      - name: Persist non-authoritative hash-bound evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/evidence/world-v4-direct-source-cb662abf"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$RUNNER_TEMP/world-v4-direct-source-export/." "$DEST/"
          cat > "$DEST/NON_AUTHORITATIVE_EVIDENCE.md" <<'EOF'
          # Non-authoritative World direct-source evidence

          This directory is a deterministic export from the exact immutable World
          commit and tree recorded in `identity.txt`. It is transport evidence only.
          It does not transfer World gameplay ownership to TrillionniumGame, does
          not grant source verification or release credit, and must not be executed
          as a canonical World source tree. The authoritative candidate remains the
          World pull request and must receive independent exact-head validation.
          EOF
          (
            cd "$DEST"
            sha256sum NON_AUTHORITATIVE_EVIDENCE.md >> SHA256SUMS
          )
          git -C "$GITHUB_WORKSPACE" config user.name github-actions[bot]
          git -C "$GITHUB_WORKSPACE" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$GITHUB_WORKSPACE" add "evidence/world-v4-direct-source-cb662abf"
          git -C "$GITHUB_WORKSPACE" commit -m \
            'evidence(nakama): persist immutable World direct-source export'
          git -C "$GITHUB_WORKSPACE" remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" push origin \
            HEAD:refs/heads/evidence/world-v4-direct-source-export-20260830
