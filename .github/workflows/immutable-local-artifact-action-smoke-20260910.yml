name: immutable-local-artifact-action-smoke-v1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: immutable-local-artifact-action/smoke-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Materialize exact workflow source for the local action
        shell: bash
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$GITHUB_WORKSPACE/.github/actions/immutable-upload-artifact/action.yml"
          test -s "$GITHUB_WORKSPACE/.github/actions/immutable-upload-artifact/main.js"
          printf 'immutable local artifact action smoke\n' > "$RUNNER_TEMP/smoke.txt"
          sha256sum "$RUNNER_TEMP/smoke.txt" > "$RUNNER_TEMP/smoke.sha256"

      - name: Upload smoke artifact through verified local action
        id: upload
        uses: ./.github/actions/immutable-upload-artifact
        with:
          name: immutable-local-artifact-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/smoke.txt
            ${{ runner.temp }}/smoke.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Verify action outputs
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          printf 'IMMUTABLE_LOCAL_ARTIFACT_ACTION=PASS\n'
          printf 'ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
