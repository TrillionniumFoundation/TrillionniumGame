name: crypto-key-lifecycle-patch-v2

on:
  push:
    branches:
      - tooling/crypto-key-lifecycle-patch-2026-09-06
    paths:
      - '.github/workflows/crypto-key-lifecycle-patch-v2.yml'

permissions:
  contents: write

concurrency:
  group: crypto-key-lifecycle-patch-v2
  cancel-in-progress: true

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCT_BRANCH: codex/crypto-key-lifecycle-2026-09-06
      TOOLING_BRANCH: tooling/crypto-key-lifecycle-patch-2026-09-06
      EXPECTED_BASE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact product branch and committed source template
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/product"
          git init "$GITHUB_WORKSPACE/product"
          git -C "$GITHUB_WORKSPACE/product" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/product" fetch --no-tags --depth=32 origin \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/source/product" \
            "+refs/heads/${TOOLING_BRANCH}:refs/remotes/source/tooling"
          git -C "$GITHUB_WORKSPACE/product" checkout -b "$PRODUCT_BRANCH" \
            refs/remotes/source/product
          git -C "$GITHUB_WORKSPACE/product" merge-base --is-ancestor \
            "$EXPECTED_BASE" HEAD
          git -C "$GITHUB_WORKSPACE/product" rev-parse HEAD \
            > "$RUNNER_TEMP/original-head"
          git -C "$GITHUB_WORKSPACE/product" show \
            refs/remotes/source/tooling:.github/workflows/crypto-key-lifecycle-patch.yml \
            > "$RUNNER_TEMP/source-template.yml"

      - name: Extract exact source and register modules
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/source-template.yml" <<'PY'
          from pathlib import Path
          import re
          import sys
          import textwrap

          template = Path(sys.argv[1]).read_text(encoding="utf-8")
          outputs = {
              "crates/trnm-token-crypto-provider/src/key_epoch.rs":
                  r"cat > crates/trnm-token-crypto-provider/src/key_epoch\.rs <<'RS'\n(.*?)\n          RS",
              "crates/trnm-token-crypto-provider/src/signer_journal.rs":
                  r"cat > crates/trnm-token-crypto-provider/src/signer_journal\.rs <<'RS'\n(.*?)\n          RS",
          }
          for destination, pattern in outputs.items():
              match = re.search(pattern, template, flags=re.S)
              if match is None:
                  raise SystemExit(f"missing source template for {destination}")
              path = Path(destination)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(textwrap.dedent(match.group(1)) + "\n", encoding="utf-8")

          path = Path("crates/trnm-token-crypto-provider/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          if "mod key_epoch;" not in text:
              text = text.rstrip() + "\n\nmod key_epoch;\nmod signer_journal;\n\n"
              text += "pub use key_epoch::{\n"
              text += "    KeyEpoch, KeyEpochError, KeyEpochRecord, KeyEpochRegistry, KeyEpochState, KeyId,\n"
              text += "};\n"
              text += "pub use signer_journal::{\n"
              text += "    SignerJournal, SignerJournalError, SigningOperationId, SigningOperationRecord,\n"
              text += "    SigningOperationState, SigningRequest,\n"
              text += "};\n"
          path.write_text(text, encoding="utf-8")
          PY

      - name: Normalize and validate exact source
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          git add -N \
            crates/trnm-token-crypto-provider/src/key_epoch.rs \
            crates/trnm-token-crypto-provider/src/signer_journal.rs
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml
          observed=$(git diff --name-only | LC_ALL=C sort)
          expected=$(cat <<'EOF'
          crates/trnm-token-crypto-provider/src/key_epoch.rs
          crates/trnm-token-crypto-provider/src/lib.rs
          crates/trnm-token-crypto-provider/src/signer_journal.rs
          EOF
          )
          test "$observed" = "$expected"
          git diff --check
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-token-crypto-provider/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-token-crypto-provider/Cargo.toml \
            --all-targets --locked -- -D warnings

      - name: CAS fast-forward validated product branch
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add crates/trnm-token-crypto-provider/src
          git diff --cached --check
          git commit -m 'feat(crypto): add key epoch and signer reconciliation controls'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${original}"
          printf 'old_head=%s\nnew_head=%s\ntree=%s\n' \
            "$original" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Preserve claim boundary
        shell: bash
        run: |
          printf '%s\n' \
            'source_candidate=true' \
            'real_key_material_used=false' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false'
