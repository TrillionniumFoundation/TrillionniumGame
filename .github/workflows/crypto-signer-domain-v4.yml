name: crypto-signer-domain-v4

on:
  push:
    branches: [tooling/crypto-key-lifecycle-patch-2026-09-06]
    paths:
      - '.github/workflows/crypto-signer-domain-v4.yml'

permissions:
  contents: write

concurrency:
  group: crypto-signer-domain-v4
  cancel-in-progress: true

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PRODUCT_BRANCH: codex/crypto-key-lifecycle-2026-09-06
      EXPECTED_BASE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact domain and signer source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/product"
          git init "$GITHUB_WORKSPACE/product"
          git -C "$GITHUB_WORKSPACE/product" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          for attempt in $(seq 1 75); do
            git -C "$GITHUB_WORKSPACE/product" fetch --no-tags --prune origin \
              "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/source/product"
            if git -C "$GITHUB_WORKSPACE/product" cat-file -e \
                'refs/remotes/source/product:crates/trnm-token-crypto-provider/src/key_domain.rs' \
                2>/dev/null && \
               git -C "$GITHUB_WORKSPACE/product" cat-file -e \
                'refs/remotes/source/product:crates/trnm-token-crypto-provider/src/signer_journal.rs' \
                2>/dev/null; then
              printf 'domain and signer source present after attempt=%s\n' "$attempt"
              break
            fi
            if test "$attempt" -eq 75; then
              printf 'domain/signer source did not materialize\n' >&2
              exit 1
            fi
            sleep 20
          done
          git -C "$GITHUB_WORKSPACE/product" checkout -b "$PRODUCT_BRANCH" \
            refs/remotes/source/product
          git -C "$GITHUB_WORKSPACE/product" merge-base --is-ancestor \
            "$EXPECTED_BASE" HEAD
          git -C "$GITHUB_WORKSPACE/product" rev-parse HEAD \
            > "$RUNNER_TEMP/original-head"

      - name: Bind signer request to canonical key domain
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-token-crypto-provider/src/signer_journal.rs')
          text = path.read_text(encoding='utf-8')
          if 'use super::KeyDomain;' not in text:
              marker = 'use std::fmt;\n'
              if text.count(marker) != 1:
                  raise SystemExit('signer import marker drift')
              text = text.replace(marker, marker + '\nuse super::KeyDomain;\n', 1)

          old = '''pub struct SigningRequest {
              pub operation_id: SigningOperationId,
              pub key_epoch: u64,
              pub payload_digest: [u8; 32],
          }'''
          new = '''pub struct SigningRequest {
              pub operation_id: SigningOperationId,
              pub key_domain: KeyDomain,
              pub key_epoch: u64,
              pub payload_digest: [u8; 32],
          }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'pub key_domain: KeyDomain' not in text:
              raise SystemExit('signing request anchor drift')

          old_fixture = '''SigningRequest {
                      operation_id: operation(value),
                      key_epoch: u64::from(value),
                      payload_digest: [value; 32],
                  }'''
          new_fixture = '''SigningRequest {
                      operation_id: operation(value),
                      key_domain: KeyDomain::Authority,
                      key_epoch: u64::from(value),
                      payload_digest: [value; 32],
                  }'''
          if old_fixture in text:
              text = text.replace(old_fixture, new_fixture, 1)
          elif 'key_domain: KeyDomain::Authority' not in text:
              raise SystemExit('signing request fixture drift')

          anchor = '''        assert_eq!(journal.record(operation(1)), Some(original));
              }
          '''
          addition = '''        assert_eq!(journal.record(operation(1)), Some(original));

                  let mut cross_domain = request(1);
                  cross_domain.key_domain = KeyDomain::Socket;
                  assert_eq!(
                      journal.prepare(cross_domain),
                      Err(SignerJournalError::ConflictingOperation(operation(1)))
                  );
                  assert_eq!(journal.record(operation(1)), Some(original));
              }
          '''
          if anchor in text and 'cross_domain.key_domain' not in text:
              text = text.replace(anchor, addition, 1)
          elif 'cross_domain.key_domain' not in text:
              raise SystemExit('cross-domain regression anchor drift')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Normalize, test and strictly lint
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml
          git diff --check
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-token-crypto-provider/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-token-crypto-provider/Cargo.toml \
            --all-targets --locked -- -D warnings
          grep -qF 'pub key_domain: KeyDomain' \
            crates/trnm-token-crypto-provider/src/signer_journal.rs
          grep -qF 'cross_domain.key_domain = KeyDomain::Socket' \
            crates/trnm-token-crypto-provider/src/signer_journal.rs

      - name: CAS fast-forward validated branch
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add crates/trnm-token-crypto-provider/src
          if git diff --cached --quiet; then
            printf 'source_already_current=true\nhead=%s\n' "$original"
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix(crypto): bind signing operations to canonical key domain'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${original}"
          printf 'old_head=%s\nnew_head=%s\ntree=%s\n' \
            "$original" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Preserve claim boundary
        shell: bash
        run: |
          printf '%s\n' \
            'source_candidate=true' \
            'real_key_material_used=false' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false'
