name: inspect-pr57-lifecycle-payload

on:
  push:
    branches:
      - codex/grpc-healthcheck-source-2026-08-31
    paths:
      - '.github/workflows/exact-source-snapshot.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Decode and print lifecycle patch functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import base64
          import hashlib
          import re
          import zlib
          from pathlib import Path

          path = Path('scripts/temporary-close-pr57-review-blockers.py')
          wrapper = path.read_text(encoding='utf-8')
          match = re.search(
              r'PAYLOAD_SHA256 = "([0-9a-f]{64})".*?base64\.b85decode\("""(.*?)"""\)\)',
              wrapper,
              flags=re.DOTALL,
          )
          if match is None:
              raise SystemExit('payload wrapper not recognized')
          expected, encoded = match.groups()
          payload = zlib.decompress(base64.b85decode(encoded))
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'digest mismatch expected={expected} actual={actual}')
          source = payload.decode('utf-8')
          tree = ast.parse(source, filename=str(path))
          needles = {
              'SharedDrain',
              'server app shared state',
              'app private drain state remains',
              'admit_realtime_dispatch',
              'handle_admitted',
          }
          selected = []
          for node in tree.body:
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  continue
              text = ast.unparse(node)
              if any(needle in text for needle in needles):
                  selected.append((getattr(node, 'name', '<anonymous>'), text))
          if not selected:
              raise SystemExit('no lifecycle patch function found')
          print(f'PAYLOAD_SHA256={actual}')
          for name, text in selected:
              print(f'===== BEGIN {name} =====')
              print(text)
              print(f'===== END {name} =====')
          calls = []
          for node in tree.body:
              if isinstance(node, ast.Expr) and isinstance(node.value, ast.Call):
                  target = node.value.func
                  if isinstance(target, ast.Name):
                      calls.append(target.id)
                  elif isinstance(target, ast.Attribute):
                      calls.append(target.attr)
          print('TOP_LEVEL_CALLS=' + ','.join(calls))
          PY
