name: server-composition-preflight

on:
  push:
    branches:
      - tooling/server-composition-preflight-2026-09-06
    paths:
      - '.github/workflows/server-composition-preflight.yml'
  pull_request:
    branches:
      - codex/server-composition-root-2026-09-06
    paths:
      - '.github/workflows/server-composition-preflight.yml'

permissions:
  contents: read

concurrency:
  group: server-composition-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PARENT: 7deee4377cff401854647151842c582f038feef1
      EXPECTED_PRODUCT_COMMIT: 0fc8e03c32095bbaca6cd850426d6b3ea22696ab
      EXPECTED_PRODUCT_TREE: c8a4a85f675894466a12e4e067726c0ac8b2aa4a
      EXPECTED_ACTION_METADATA_BLOB: e73421d4a2025995bc37cf079e9d96b25519bf29
      EXPECTED_ACTION_IMPLEMENTATION_BLOB: 2a04f3852784d07c339b671750464bc9f228a0c2
    steps:
      - name: Authenticate tooling diff and materialize exact product tree
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPOSITORY"
          test "${#SOURCE_SHA}" -eq 40
          tooling="$RUNNER_TEMP/server-composition-tooling"
          rm -rf "$tooling" "$GITHUB_WORKSPACE"

          git init "$tooling"
          git -C "$tooling" remote add origin \
            "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C "$tooling" fetch --no-tags --depth=32 origin \
            "$SOURCE_SHA" "$EXPECTED_PRODUCT_COMMIT" "$EXPECTED_PARENT"
          git -C "$tooling" checkout --detach "$SOURCE_SHA"
          test "$(git -C "$tooling" rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C "$tooling" rev-parse "$EXPECTED_PRODUCT_COMMIT^{tree}")" = \
            "$EXPECTED_PRODUCT_TREE"
          git -C "$tooling" merge-base --is-ancestor \
            "$EXPECTED_PARENT" "$EXPECTED_PRODUCT_COMMIT"
          git -C "$tooling" merge-base --is-ancestor \
            "$EXPECTED_PRODUCT_COMMIT" "$SOURCE_SHA"

          changed=$(git -C "$tooling" diff --name-only \
            "$EXPECTED_PRODUCT_COMMIT..$SOURCE_SHA")
          test "$changed" = '.github/workflows/server-composition-preflight.yml' || {
            printf 'tooling head modifies non-workflow product input:\n%s\n' "$changed" >&2
            exit 1
          }

          python3 - <<'PY'
          import sys

          allowed = {'.github/workflows/server-composition-preflight.yml'}

          def accepts(paths):
              return set(paths) == allowed and len(paths) == 1

          assert accepts(['.github/workflows/server-composition-preflight.yml'])
          assert not accepts([
              '.github/workflows/server-composition-preflight.yml',
              'crates/trnm-server/src/main.rs',
          ])
          assert not accepts([
              '.github/workflows/server-composition-preflight.yml',
              '.github/actions/upload-evidence/index.js',
          ])
          assert not accepts([])
          print('tooling-drift-negative-corpus=pass')
          PY

          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "$EXPECTED_PRODUCT_COMMIT"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          test -f crates/trnm-server/src/runtime/server.rs
          test -f crates/trnm-server/proto/nakama-healthcheck.proto
          test "$(git hash-object .github/actions/upload-evidence/action.yml)" = \
            "$EXPECTED_ACTION_METADATA_BLOB"
          test "$(git hash-object .github/actions/upload-evidence/index.js)" = \
            "$EXPECTED_ACTION_IMPLEMENTATION_BLOB"
          printf 'product_commit=%s\nproduct_tree=%s\naction_metadata=%s\naction_implementation=%s\n' \
            "$EXPECTED_PRODUCT_COMMIT" "$EXPECTED_PRODUCT_TREE" \
            "$EXPECTED_ACTION_METADATA_BLOB" "$EXPECTED_ACTION_IMPLEMENTATION_BLOB"

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_COMMIT"
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Generate exact standalone lockfile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_PRODUCT_TREE"
          rm -f crates/trnm-server/Cargo.lock
          cargo generate-lockfile --manifest-path crates/trnm-server/Cargo.toml
          test -s crates/trnm-server/Cargo.lock
          cargo metadata --manifest-path crates/trnm-server/Cargo.toml \
            --locked --format-version 1 > run-server-metadata.json
          sha256sum crates/trnm-server/Cargo.lock run-server-metadata.json

      - name: Retain generated lockfile through exact product uploader
        id: lockfile
        uses: ./.github/actions/upload-evidence
        with:
          name: server-composition-lock-${{ env.EXPECTED_PRODUCT_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: crates/trnm-server/Cargo.lock
          mime_type: text/plain

      - name: Verify generated lockfile receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_COMMIT"
          test -n '${{ steps.lockfile.outputs.artifact_id }}'
          test -n '${{ steps.lockfile.outputs.sha256 }}'
          test '${{ steps.lockfile.outputs.size_bytes }}' -gt 0
          printf 'artifact_id=%s\nsha256=%s\nsize=%s\n' \
            '${{ steps.lockfile.outputs.artifact_id }}' \
            '${{ steps.lockfile.outputs.sha256 }}' \
            '${{ steps.lockfile.outputs.size_bytes }}'

      - name: Format, test and strictly lint canonical server
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_COMMIT"
          cargo fmt --manifest-path crates/trnm-server/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-server/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-server/Cargo.toml \
            --all-targets --locked -- -D warnings

      - name: Exercise typed configuration entrypoint
        shell: bash
        env:
          TRNM_SERVER_DATABASE_URL: postgresql://candidate:secret@127.0.0.1/trnm
          TRNM_SERVER_DATABASE_PROFILE: postgresql
          TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE: '1'
          TRNM_SERVER_SCHEMA_SOURCE_COMMIT: ${{ env.EXPECTED_PRODUCT_COMMIT }}
          TRNM_SERVER_ADMIN_TOKEN: candidate-admin-token-with-sufficient-length
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_COMMIT"
          cargo run --quiet --manifest-path crates/trnm-server/Cargo.toml \
            --locked --bin trnm-server -- check-config > check-config.out
          grep -q 'trnm-server configuration:' check-config.out
          grep -q '<redacted>' check-config.out
          ! grep -q 'candidate-admin-token' check-config.out
          ! grep -q 'candidate:secret' check-config.out

      - name: Record zero-credit source receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_COMMIT"
          printf '%s\n' \
            'canonical_server_source_executed=true' \
            'execution_tree_equals_product_tree=true' \
            'product_uploader_blobs_verified=true' \
            'tooling_drift_negative_corpus=true' \
            'old_persistence_binary_removed=false' \
            'control_plane_reconciled=false' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false'
