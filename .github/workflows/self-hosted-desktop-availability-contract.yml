name: self-hosted-desktop-availability-contract

on:
  pull_request:
    paths:
      - '.github/workflows/self-hosted-desktop-availability.yml'
      - '.github/workflows/self-hosted-desktop-availability-contract.yml'
      - 'scripts/check-self-hosted-desktop-availability.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/self-hosted-desktop-availability.yml'
      - '.github/workflows/self-hosted-desktop-availability-contract.yml'
      - 'scripts/check-self-hosted-desktop-availability.py'

permissions:
  contents: read

concurrency:
  group: self-hosted-desktop-availability-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Compile the validator
        run: python3 -m py_compile scripts/check-self-hosted-desktop-availability.py
      - name: Prove the exact probe is fail closed
        run: python3 scripts/check-self-hosted-desktop-availability.py --self-test
