name: temporary-gap-diagnostics

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-gap-diagnostics
  cancel-in-progress: false

jobs:
  repair-and-diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Repair pinned-tree diagnostic API drift
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/upstream/diagnose_pinned_tree.py")
          source = path.read_text(encoding="utf-8")

          old_imports = "import sys\nimport tempfile\nfrom pathlib import Path, PurePosixPath\n"
          new_imports = (
              "import sys\n"
              "import tempfile\n"
              "import urllib.error\n"
              "import urllib.request\n"
              "from pathlib import Path, PurePosixPath\n"
          )
          if source.count(old_imports) != 1:
              raise SystemExit("diagnostic import anchor drift")
          source = source.replace(old_imports, new_imports, 1)

          old_archive_import = '''from tools.upstream.pinned_archive import (  # noqa: E402
              SourceArchiveError,
              extract_github_tarball,
              git_blob_sha1_bytes,
              http_bytes,
              normalize_gitlink_map,
          )
          '''
          new_archive_import = '''from tools.upstream.pinned_archive import (  # noqa: E402
              SourceArchiveError,
              extract_github_tarball,
              git_blob_sha1_bytes,
          )
          '''
          if source.count(old_archive_import) != 1:
              raise SystemExit("diagnostic archive import anchor drift")
          source = source.replace(old_archive_import, new_archive_import, 1)

          anchor = '''class DiagnosticError(RuntimeError):
              """Raised when the mismatch itself cannot be diagnosed safely."""


          def require(condition: bool, message: str) -> None:
          '''
          replacement = '''class DiagnosticError(RuntimeError):
              """Raised when the mismatch itself cannot be diagnosed safely."""


          def http_bytes(
              url: str,
              *,
              token: str | None,
              timeout_seconds: int = 120,
              max_bytes: int = 512 * 1024 * 1024,
          ) -> bytes:
              """Fetch bounded HTTPS diagnostic input without weakening strict verification."""
              require(url.startswith("https://"), f"non-HTTPS diagnostic URL: {url}")
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "TrillionniumGame-pinned-tree-diagnostic/1",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  response = urllib.request.urlopen(request, timeout=timeout_seconds)
              except (urllib.error.URLError, TimeoutError) as error:
                  raise DiagnosticError(f"diagnostic download failed: {error}") from error
              chunks: list[bytes] = []
              size = 0
              with response:
                  resolved_url = response.geturl()
                  require(
                      resolved_url.startswith("https://"),
                      f"diagnostic redirect resolved to non-HTTPS URL: {resolved_url}",
                  )
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      size += len(chunk)
                      require(size <= max_bytes, f"diagnostic response exceeds {max_bytes} bytes")
                      chunks.append(chunk)
              return b"".join(chunks)


          def normalize_gitlink_map(value: dict[str, str]) -> dict[PurePosixPath, bytes]:
              """Convert a validated profile gitlink map into local tree-hash material."""
              require(isinstance(value, dict), "gitlink map must be an object")
              result: dict[PurePosixPath, bytes] = {}
              for path_text, commit in value.items():
                  require(isinstance(path_text, str) and path_text, "gitlink path is invalid")
                  require(
                      isinstance(commit, str)
                      and len(commit) == 40
                      and commit != "0" * 40
                      and all(character in "0123456789abcdef" for character in commit),
                      f"gitlink commit is invalid: {path_text}",
                  )
                  path = PurePosixPath(path_text)
                  require(
                      not path.is_absolute()
                      and path.parts
                      and all(part not in {"", ".", ".."} for part in path.parts)
                      and path.as_posix() == path_text,
                      f"gitlink path is not canonical: {path_text!r}",
                  )
                  require(path not in result, f"duplicate gitlink path: {path_text}")
                  result[path] = bytes.fromhex(commit)
              return result


          def require(condition: bool, message: str) -> None:
          '''
          if source.count(anchor) != 1:
              raise SystemExit("diagnostic helper anchor drift")
          source = source.replace(anchor, replacement, 1)

          old_extract = '''    with tempfile.TemporaryDirectory(prefix="trnm-tree-diagnostic-") as temporary:
              destination = Path(temporary) / "source"
              extracted_root = extract_github_tarball(archive, destination)
              observed_tree, observed = local_inventory(extracted_root, links)
              expected = expected_inventory(repository, expected_tree, token=token)
              differences = compare(expected, observed)
          '''
          new_extract = '''    with tempfile.TemporaryDirectory(prefix="trnm-tree-diagnostic-") as temporary:
              temporary_root = Path(temporary)
              archive_path = temporary_root / "source.tar.gz"
              archive_path.write_bytes(archive)
              destination = temporary_root / "source"
              extract_github_tarball(archive_path, destination)
              observed_tree, observed = local_inventory(destination, links)
              expected = expected_inventory(repository, expected_tree, token=token)
              differences = compare(expected, observed)
          '''
          if source.count(old_extract) != 1:
              raise SystemExit("diagnostic extraction anchor drift")
          source = source.replace(old_extract, new_extract, 1)

          path.write_text(source, encoding="utf-8")
          PY
          python3 -m py_compile tools/upstream/diagnose_pinned_tree.py

      - name: Install exact Rust diagnostics
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          rustc --version
          cargo --version

      - name: Run source and build diagnostics
        id: diagnostics
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -m unittest discover -s tests/upstream -p 'test_*.py' -v
          upstream_status=$?
          python3 tools/upstream/diagnose_pinned_tree.py \
            --registry config/sdk-source-snapshots.json \
            --profile cpp \
            --limit 20
          sdk_status=$?
          cargo fmt --all -- --check
          format_status=$?
          cargo test --workspace --all-targets --locked
          test_status=$?
          cargo clippy --workspace --all-targets --locked -- -D warnings
          clippy_status=$?
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python_status=$?
          printf 'upstream=%s sdk=%s format=%s test=%s clippy=%s python=%s\n' \
            "$upstream_status" "$sdk_status" "$format_status" "$test_status" \
            "$clippy_status" "$python_status"
          exit $((upstream_status || sdk_status || format_status || test_status || clippy_status || python_status))

      - name: Commit repaired source and remove temporary workflow
        if: always()
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-gap-diagnostics.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "fix(upstream): repair bounded pinned-tree diagnostics"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
