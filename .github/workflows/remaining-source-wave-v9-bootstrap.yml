name: remaining-source-wave-v9-bootstrap

on:
  push:
    branches: [tooling/remaining-source-wave-v8-2026-09-07]
    paths:
      - '.github/workflows/remaining-source-wave-v9-bootstrap.yml'

permissions:
  contents: write
  actions: read

env:
  SOURCE_BASE_SHA: 7deee4377cff401854647151842c582f038feef1
  PLAN_HEAD_SHA: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
  OUTBOX_SHA: 4ce383a55d76a8b2b05827c5017b36f9789c02bd
  SESSION_SHA: 0d0f246a131902403202afcd28103f22af30c8a9
  REALTIME_SHA: 4a72ecdb9341faa9c5211b3479f58d075f75a7ba
  CRYPTO_SHA: 72b63dcca4de879f04771b3987f8d4964756cf56
  MIGRATION_SHA: 35f992f79fd4878e20de2db46c1641fae9b77562
  SERVER_SHA: 9ef64a8b93b52808bbbde0acaf74c382e6b4b15f
  HARDENING_SHA: f3e9476ff8b6d781b61ad35c135041eddddcfcff
  PRODUCT_BRANCH: codex/remaining-source-blockers-wave-v9-2026-09-07
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  compose-validate-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Derive reviewed v7 sequence and fetch exact surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${PRODUCT_BRANCH}")"
          tooling="$RUNNER_TEMP/tooling-bootstrap"
          rm -rf "$tooling" "$GITHUB_WORKSPACE/source"
          git init "$tooling"
          git -C "$tooling" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$tooling" rev-parse HEAD)" = "$GITHUB_SHA"
          rewrite="$tooling/scripts/tooling/rewrite-remaining-source-wave-v7.py"
          source_workflow="$tooling/.github/workflows/remaining-source-wave-v5-bootstrap.yml"
          repin="$tooling/tools/repin-canonical-server-wave-v9.py"
          for path in \
            "$rewrite" \
            "$source_workflow" \
            "$repin" \
            "$tooling/tools/apply-canonical-server-authority-v5.py" \
            "$tooling/tools/apply-canonical-server-authority-v6.py" \
            "$tooling/tools/apply-canonical-server-authority-v7.py"; do
            test -f "$path"
          done
          python3 -m py_compile \
            "$rewrite" "$repin" \
            "$tooling/tools/apply-canonical-server-authority-v5.py" \
            "$tooling/tools/apply-canonical-server-authority-v6.py" \
            "$tooling/tools/apply-canonical-server-authority-v7.py"
          python3 "$rewrite" "$source_workflow" "$RUNNER_TEMP"
          for number in 1 2 3 4 5 6 7; do bash -n "$RUNNER_TEMP/v7-${number}.sh"; done
          bash "$RUNNER_TEMP/v7-1.sh"
          set -a
          source "$GITHUB_ENV"
          set +a
          test "$PLAN_SHA" = "$PLAN_HEAD_SHA"
          test "$PLAN_REF" = codex/branch-evidence-closure-2026-09-02
          bash "$RUNNER_TEMP/v7-2.sh"
          printf 'TOOLING_ROOT=%s\n' "$tooling" >> "$GITHUB_ENV"

      - name: Compose source waves and migrate canonical server authority
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/v7-3.sh"

      - name: Atomically repin reviewed gap and workflow identities
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 "$TOOLING_ROOT/tools/repin-canonical-server-wave-v9.py" "$GITHUB_WORKSPACE/source"
          python3 scripts/check-gap-register.py
          python3 -m unittest -v \
            tests.control_plane.test_required_workflow_source_contract \
            tests.control_plane.test_workflow_manifest_overlay
          python3 scripts/check-plan.py

      - name: Normalize and validate every product surface
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          for number in 4 5 6; do bash "$RUNNER_TEMP/v7-${number}.sh"; done
          git diff --check
          python3 scripts/check-gap-register.py
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-evidence-index.py
          python3 scripts/derive-gates.py
          python3 -m unittest -v \
            tests.control_plane.test_required_workflow_source_contract \
            tests.control_plane.test_workflow_manifest_overlay

      - name: Commit validated source and attempt ordinary publication
        id: commit
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'refactor(server): converge canonical authority and repin closed identities'
          commit=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          printf 'commit=%s\ntree=%s\n' "$commit" "$tree" | tee "$GITHUB_WORKSPACE/v9-identity.env"
          git format-patch --stdout "$PLAN_SHA"..HEAD > "$GITHUB_WORKSPACE/v9.patch"
          git bundle create "$GITHUB_WORKSPACE/v9.bundle" HEAD "$PLAN_SHA"
          set +e
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}" \
            > "$GITHUB_WORKSPACE/v9-push.log" 2>&1
          push_status=$?
          set -e
          printf 'push_status=%s\n' "$push_status" | tee -a "$GITHUB_WORKSPACE/v9-identity.env"
          cat "$GITHUB_WORKSPACE/v9-push.log"
          remote=$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')
          if [[ "$push_status" -eq 0 ]]; then
            test "$remote" = "$commit"
            echo 'publication=ordinary-fast-forward' | tee -a "$GITHUB_WORKSPACE/v9-identity.env"
          else
            test -z "$remote"
            echo 'publication=validated-commit-object-awaiting-admin-ref-create' | tee -a "$GITHUB_WORKSPACE/v9-identity.env"
          fi

      - name: Install exact validated candidate uploader
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.github" "$GITHUB_WORKSPACE/scripts"
          cp -a "$GITHUB_WORKSPACE/source/.github/actions" "$GITHUB_WORKSPACE/.github/"
          cp "$GITHUB_WORKSPACE/source/scripts/upload-actions-artifact.py" "$GITHUB_WORKSPACE/scripts/"

      - name: Retain exact validated v9 source bundle
        id: upload
        uses: ./.github/actions/upload-evidence
        with:
          name: remaining-source-wave-v9-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: v9.bundle
          mime_type: application/octet-stream

      - name: Verify retained packet receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.upload.outputs.artifact_id }}'
          test -n '${{ steps.upload.outputs.sha256 }}'
          test '${{ steps.upload.outputs.size_bytes }}' -gt 0
          cat v9-identity.env
