name: tmp-branch-disposition-audit

on:
  push:
    branches:
      - ops/branch-disposition-audit-20260909
    paths:
      - .github/workflows/tmp-branch-disposition-audit.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: branch-disposition-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
      FEATURE_BRANCH: governance/branch-disposition-current-20260909
    steps:
      - name: Fetch current main and every branch ref
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --filter=blob:none origin main:refs/remotes/origin/main
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
          git -C "$GITHUB_WORKSPACE" checkout --detach refs/remotes/origin/main
          echo "MAIN_COMMIT=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_TREE=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          gh api --paginate --slurp "repos/${REPOSITORY}/branches?per_page=100" > /tmp/branches-pages.json
          gh pr list --repo "$REPOSITORY" --state open --limit 500 \
            --json number,headRefName,baseRefName,isDraft,title > /tmp/open-prs.json
      - name: Generate conservative disposition manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import subprocess
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.')
          pages = json.loads(Path('/tmp/branches-pages.json').read_text(encoding='utf-8'))
          branches_api = [item for page in pages for item in page]
          open_pr_rows = json.loads(Path('/tmp/open-prs.json').read_text(encoding='utf-8'))
          open_prs = {row['headRefName']: row for row in open_pr_rows}
          main_commit = os.environ['MAIN_COMMIT']
          main_tree = os.environ['MAIN_TREE']

          refs = {}
          completed = subprocess.run(
              ['git', 'for-each-ref', '--format=%(refname:strip=3)\t%(objectname)', 'refs/remotes/origin'],
              check=True,
              text=True,
              stdout=subprocess.PIPE,
          )
          for line in completed.stdout.splitlines():
              name, sha = line.split('\t', 1)
              if name == 'HEAD':
                  continue
              refs[name] = sha

          api_by_name = {row['name']: row for row in branches_api}
          if set(refs) != set(api_by_name):
              missing_git = sorted(set(api_by_name) - set(refs))
              missing_api = sorted(set(refs) - set(api_by_name))
              raise SystemExit(f'branch inventory mismatch: missing_git={missing_git} missing_api={missing_api}')
          if refs.get('main') != main_commit:
              raise SystemExit('main moved during branch inventory')

          by_tip: dict[str, list[str]] = defaultdict(list)
          for name, sha in refs.items():
              by_tip[sha].append(name)
          for names in by_tip.values():
              names.sort()

          def ancestor_of_main(sha: str) -> bool:
              return subprocess.run(
                  ['git', 'merge-base', '--is-ancestor', sha, main_commit],
                  check=False,
              ).returncode == 0

          def canonical_score(name: str) -> tuple[int, str]:
              row = api_by_name[name]
              if name == 'main':
                  return (0, name)
              if row.get('protected'):
                  return (1, name)
              if name in open_prs:
                  return (2, name)
              if name.startswith('archive/'):
                  return (3, name)
              if name.startswith(('integration/plan-v32-', 'feature/plan-v32-')):
                  return (4, name)
              return (5, name)

          result = []
          for name in sorted(refs):
              sha = refs[name]
              api = api_by_name[name]
              group = by_tip[sha]
              canonical = min(group, key=canonical_score)
              merged = ancestor_of_main(sha)
              pr = open_prs.get(name)
              protected = bool(api.get('protected'))
              archive = name.startswith('archive/')
              reasons = []
              disposition = 'preserve'

              if name == 'main':
                  reasons.append('default integration authority')
              if protected:
                  reasons.append('protected branch')
              if pr is not None:
                  reasons.append(f"open pull request #{pr['number']}")
              if archive:
                  reasons.append('archive/evidence namespace')

              hard_preserve = name == 'main' or protected or pr is not None or archive
              if not hard_preserve:
                  if len(group) > 1 and canonical != name:
                      disposition = 'candidate-delete-duplicate-tip'
                      reasons.append(f'identical tip retained by {canonical}')
                  elif merged:
                      disposition = 'candidate-delete-merged'
                      reasons.append('tip is an ancestor of exact audited main')
                  else:
                      disposition = 'manual-review-unmerged'
                      reasons.append('tip is not an ancestor of exact audited main')
              elif len(group) > 1:
                  reasons.append(f'duplicate tip group canonical={canonical}')

              result.append({
                  'name': name,
                  'commit': sha,
                  'protected': protected,
                  'open_pull_request': pr['number'] if pr is not None else None,
                  'open_pull_request_base': pr['baseRefName'] if pr is not None else None,
                  'open_pull_request_draft': pr['isDraft'] if pr is not None else None,
                  'ancestor_of_main': merged,
                  'duplicate_tip_count': len(group),
                  'duplicate_tip_canonical': canonical,
                  'disposition': disposition,
                  'reasons': reasons,
              })

          counts: dict[str, int] = defaultdict(int)
          for row in result:
              counts[row['disposition']] += 1

          manifest = {
              'schema': 'trillionnium.branch-disposition-current.v1',
              'project_id': 'trillionnium-game',
              'plan_version': 3,
              'observed_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'repository': os.environ['REPOSITORY'],
              'main_commit': main_commit,
              'main_tree': main_tree,
              'policy': {
                  'delete_executed': False,
                  'independent_review_required': True,
                  'before_and_after_manifests_required': True,
                  'open_pr_head_deletion_allowed': False,
                  'protected_branch_deletion_allowed': False,
                  'archive_branch_deletion_allowed': False,
                  'unmerged_unique_tip_auto_deletion_allowed': False,
                  'candidate_classes': [
                      'candidate-delete-duplicate-tip',
                      'candidate-delete-merged',
                  ],
              },
              'summary': {
                  'branch_count': len(result),
                  'open_pr_head_count': len(open_prs),
                  'protected_count': sum(row['protected'] for row in result),
                  'duplicate_tip_group_count': sum(len(names) > 1 for names in by_tip.values()),
                  'disposition_counts': dict(sorted(counts.items())),
                  'deletion_executed': False,
              },
              'branches': result,
              'claim_boundary': {
                  'inventory_complete_for_observed_main': True,
                  'deletion_reviewed': False,
                  'deletion_executed': False,
                  'cleanup_complete': False,
                  'sg0_complete': False,
                  'compatibility_credit': False,
                  'production_ready': False,
              },
          }
          target = root / 'docs/governance/BRANCH_DISPOSITION_CURRENT.json'
          target.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          authority_path = root / 'docs/DOCUMENTATION_AUTHORITY.json'
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          docs = authority['machine_control_documents']
          relative = 'docs/governance/BRANCH_DISPOSITION_CURRENT.json'
          if relative not in docs:
              insert = docs.index('docs/governance/ACTIVE_BRANCHES.json') + 1
              docs.insert(insert, relative)
          authority_path.write_text(json.dumps(authority, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Add bounded manifest validator
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cat > scripts/check-branch-disposition-current.py <<'PY'
          #!/usr/bin/env python3
          """Validate the conservative branch-disposition snapshot without deleting refs."""
          from __future__ import annotations

          import argparse
          import json
          import re
          from collections import Counter
          from pathlib import Path

          SHA = re.compile(r'^[0-9a-f]{40}$')
          DELETE_CLASSES = {'candidate-delete-duplicate-tip', 'candidate-delete-merged'}

          class ValidationError(RuntimeError):
              pass

          def require(value: bool, message: str) -> None:
              if not value:
                  raise ValidationError(message)

          def validate(root: Path) -> dict[str, int]:
              path = root / 'docs/governance/BRANCH_DISPOSITION_CURRENT.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              require(data.get('schema') == 'trillionnium.branch-disposition-current.v1', 'unexpected schema')
              require(data.get('repository') == 'TrillionniumFoundation/TrillionniumGame', 'unexpected repository')
              require(SHA.fullmatch(data.get('main_commit', '')) is not None, 'invalid main commit')
              require(SHA.fullmatch(data.get('main_tree', '')) is not None, 'invalid main tree')
              policy = data.get('policy', {})
              require(policy.get('delete_executed') is False, 'audit must not execute deletion')
              require(policy.get('independent_review_required') is True, 'independent review must remain required')
              rows = data.get('branches')
              require(isinstance(rows, list) and rows, 'branch rows are required')
              names = [row.get('name') for row in rows]
              require(all(isinstance(name, str) and name for name in names), 'invalid branch name')
              require(len(names) == len(set(names)), 'duplicate branch row')
              require(names == sorted(names), 'branches must be sorted')
              by_name = {row['name']: row for row in rows}
              require('main' in by_name, 'main row missing')
              require(by_name['main']['commit'] == data['main_commit'], 'main identity mismatch')
              require(by_name['main']['disposition'] == 'preserve', 'main must be preserved')
              for row in rows:
                  require(SHA.fullmatch(row.get('commit', '')) is not None, f"{row['name']}: invalid commit")
                  disposition = row.get('disposition')
                  require(disposition in DELETE_CLASSES | {'preserve', 'manual-review-unmerged'}, f"{row['name']}: invalid disposition")
                  reasons = row.get('reasons')
                  require(isinstance(reasons, list) and reasons, f"{row['name']}: reasons required")
                  if disposition in DELETE_CLASSES:
                      require(row.get('protected') is False, f"{row['name']}: protected delete candidate")
                      require(row.get('open_pull_request') is None, f"{row['name']}: open PR delete candidate")
                      require(not row['name'].startswith('archive/'), f"{row['name']}: archive delete candidate")
                      require(row['name'] != 'main', 'main delete candidate')
                      if disposition == 'candidate-delete-merged':
                          require(row.get('ancestor_of_main') is True, f"{row['name']}: merged candidate is not ancestor")
                      else:
                          canonical = row.get('duplicate_tip_canonical')
                          require(canonical in by_name and canonical != row['name'], f"{row['name']}: duplicate canonical missing")
                          require(by_name[canonical]['commit'] == row['commit'], f"{row['name']}: duplicate tip differs")
              observed = Counter(row['disposition'] for row in rows)
              summary = data.get('summary', {})
              require(summary.get('branch_count') == len(rows), 'branch summary stale')
              require(summary.get('disposition_counts') == dict(sorted(observed.items())), 'disposition summary stale')
              claims = data.get('claim_boundary', {})
              for key in ('deletion_reviewed', 'deletion_executed', 'cleanup_complete', 'sg0_complete', 'compatibility_credit', 'production_ready'):
                  require(claims.get(key) is False, f'{key} must remain false')
              authority = json.loads((root / 'docs/DOCUMENTATION_AUTHORITY.json').read_text(encoding='utf-8'))
              require('docs/governance/BRANCH_DISPOSITION_CURRENT.json' in authority.get('machine_control_documents', []), 'manifest is not registered')
              return {'branches': len(rows), 'delete_candidates': sum(observed[key] for key in DELETE_CLASSES)}

          def main() -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument('--root', type=Path, default=Path(__file__).resolve().parents[1])
              result = validate(parser.parse_args().root)
              print(f"branch disposition valid: branches={result['branches']} candidates={result['delete_candidates']}")
              return 0

          if __name__ == '__main__':
              try:
                  raise SystemExit(main())
              except ValidationError as error:
                  print(f'branch disposition invalid: {error}')
                  raise SystemExit(1) from error
          PY
          chmod +x scripts/check-branch-disposition-current.py
      - name: Validate audit without deleting any branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/check-branch-disposition-current.py
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 -m json.tool docs/governance/BRANCH_DISPOSITION_CURRENT.json >/dev/null
          git diff --check
      - name: Commit audit and open review PR
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOCUMENTATION_AUTHORITY.json \
            docs/governance/BRANCH_DISPOSITION_CURRENT.json \
            scripts/check-branch-disposition-current.py
          git diff --cached --check
          git commit -m 'governance: add exact branch disposition audit'
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse HEAD^{tree})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          existing_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/${FEATURE_BRANCH}" --jq '.object.sha' 2>/dev/null || true)"
          if test -n "$existing_sha"; then
            git push --force-with-lease="refs/heads/${FEATURE_BRANCH}:${existing_sha}" origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          else
            git push --force-with-lease="refs/heads/${FEATURE_BRANCH}:" origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          fi
          counts="$(python3 - <<'PY'
          import json
          value=json.load(open('docs/governance/BRANCH_DISPOSITION_CURRENT.json'))
          summary=value['summary']
          print(f"branches={summary['branch_count']} open_pr_heads={summary['open_pr_head_count']} protected={summary['protected_count']} duplicate_groups={summary['duplicate_tip_group_count']} dispositions={summary['disposition_counts']}")
          PY
          )"
          cat > /tmp/body.md <<EOF
          ## Scope

          Exact branch disposition audit against current `main`.

          ```text
          main_commit=${MAIN_COMMIT}
          main_tree=${MAIN_TREE}
          head_commit=${head_sha}
          head_tree=${head_tree}
          ${counts}
          ```

          The manifest preserves `main`, protected branches, every open-PR head and all `archive/*` refs. Automatic candidates are limited to refs already merged into exact main or refs with an identical retained tip. Unique unmerged refs remain manual review.

          No branch is deleted by this change. Deletion requires independent review, an approved candidate set, an execution workflow with exact expected tips, and an after-manifest.

          ```text
          deletion_reviewed=false
          deletion_executed=false
          cleanup_complete=false
          sg0_complete=false
          compatibility_credit=false
          production_ready=false
          ```
          EOF
          existing="$(gh pr list --repo "$REPOSITORY" --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if test -z "$existing"; then
            url="$(gh pr create --repo "$REPOSITORY" --draft --base main --head "$FEATURE_BRANCH" \
              --title 'governance: audit exact branch disposition without deleting refs' \
              --body-file /tmp/body.md)"
            number="${url##*/}"
          else
            number="$existing"
            gh pr edit "$number" --repo "$REPOSITORY" --body-file /tmp/body.md
          fi
          gh api --method POST "repos/${REPOSITORY}/pulls/${number}/requested_reviewers" -f 'reviewers[]=Tomasrgbsf' >/dev/null || true
