name: temporary-master-runtime-closure

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temporary-master-runtime-closure
  cancel-in-progress: true

jobs:
  finalize-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Cancel every obsolete temporary workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          current_run = int(os.environ['GITHUB_RUN_ID'])
          current_sha = os.environ['GITHUB_SHA']
          base = os.environ['GITHUB_API_URL']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'trillionnium-master-runtime-closure',
          }
          request = urllib.request.Request(
              f'{base}/repos/{repo}/actions/runs?branch=feat/plan-v3-gap-closure-2026-08-29&per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get('workflow_runs', [])
          for run in runs:
              run_id = int(run['id'])
              name = str(run.get('name', ''))
              if run_id == current_run or run.get('status') == 'completed':
                  continue
              if not name.startswith('temporary-'):
                  continue
              if run.get('head_sha') == current_sha and name == 'temporary-master-runtime-closure':
                  continue
              cancel = urllib.request.Request(
                  f'{base}/repos/{repo}/actions/runs/{run_id}/cancel',
                  data=b'',
                  method='POST',
                  headers=headers,
              )
              try:
                  urllib.request.urlopen(cancel, timeout=30).read()
              except urllib.error.HTTPError as error:
                  if error.code not in (403, 409, 422):
                      raise
          PY

      - name: Fetch the exact latest branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_REF_NAME"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Materialize the authoritative runtime source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import shutil
          from pathlib import Path

          root = Path('.')
          staged = root / '.github/tmp/runtime-closure'
          required = {
              'outbox.rs': root / 'crates/trnm-persistence-pg/src/outbox.rs',
              'cancel.rs': root / 'crates/trnm-persistence-pg/src/cancel.rs',
              'pool.rs': root / 'crates/trnm-persistence-pg/src/pool.rs',
              'server-pool.rs': root / 'crates/trnm-persistence-pg/src/bin/trnm_server/pool.rs',
              'retry.rs': root / 'crates/trnm-persistence-pg/src/bin/trnm_server/retry.rs',
              'outbox-runtime.rs': root / 'crates/trnm-persistence-pg/tests/outbox_runtime.rs',
          }
          missing = [name for name in required if not (staged / name).is_file()]
          if missing:
              raise SystemExit(f'missing staged runtime files: {missing}')
          for source_name, destination in required.items():
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(staged / source_name, destination)

          cancel = required['cancel.rs']
          value = cancel.read_text(encoding='utf-8').replace(
              'pub(crate) fn cancellation_watchdog_panicked()',
              'pub fn cancellation_watchdog_panicked()',
          )
          cancel.write_text(value, encoding='utf-8')

          cargo = root / 'crates/trnm-persistence-pg/Cargo.toml'
          cargo_text = cargo.read_text(encoding='utf-8')
          dependency_lines = {
              'native-tls': 'native-tls = "=0.2.18"',
              'postgres-native-tls': 'postgres-native-tls = "=0.5.3"',
              'r2d2': 'r2d2 = "=0.8.10"',
              'r2d2_postgres': 'r2d2_postgres = "=0.18.2"',
          }
          if '[dependencies]' not in cargo_text:
              raise SystemExit('persistence-pg manifest lacks [dependencies]')
          insertion = []
          for name, line in dependency_lines.items():
              if re.search(rf'(?m)^{re.escape(name)}\s*=', cargo_text) is None:
                  insertion.append(line)
          if insertion:
              cargo_text = cargo_text.replace(
                  '[dependencies]\n',
                  '[dependencies]\n' + '\n'.join(insertion) + '\n',
                  1,
              )
          cargo.write_text(cargo_text, encoding='utf-8')

          lib = root / 'crates/trnm-persistence-pg/src/lib.rs'
          source = lib.read_text(encoding='utf-8')
          header = '#![forbid(unsafe_code)]\n\n'
          if header not in source:
              raise SystemExit('persistence-pg crate header drifted')
          module_block = 'mod cancel;\nmod outbox;\nmod pool;\n\n'
          source = re.sub(
              r'(?s)^#!\[forbid\(unsafe_code\)\]\n\n(?:mod (?:cancel|outbox|pool);\n)*\n?',
              header + module_block,
              source,
              count=1,
          )
          export_block = (
              'pub use cancel::{cancellation_watchdog_panicked, PgCancelHandle};\n'
              'pub use outbox::{\n'
              '    OutboxLease, OutboxRecord, OutboxRetryOutcome, OutboxState,\n'
              '};\n'
              'pub use pool::{PgPool, PgPoolConfig, PgPoolSnapshot, PgTlsConfig};\n\n'
          )
          source = re.sub(
              r'(?s)(?:pub use cancel::\{.*?\};\n)?(?:pub use outbox::\{.*?\};\n)?(?:pub use pool::\{.*?\};\n)?\n*',
              export_block,
              source,
              count=1,
          )
          repository_pattern = re.compile(
              r'pub struct PgRepository \{\n\s*profile: DatabaseProfile,\n\s*client: [^\n]+,\n(?:\s*cancel_transport: [^\n]+,\n)?\}',
          )
          replacement = (
              'pub struct PgRepository {\n'
              '    profile: DatabaseProfile,\n'
              '    client: pool::ClientHandle,\n'
              '    cancel_transport: cancel::CancelTransport,\n'
              '}'
          )
          source, count = repository_pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit('PgRepository structure anchor drifted')
          connect_pattern = re.compile(
              r'let client = Client::connect\(database_url, NoTls\)\.map_err\(map_postgres_error\)\?;\n\s*Ok\(Self \{.*?\}\)',
              re.S,
          )
          connect_replacement = (
              'let client = Client::connect(database_url, NoTls).map_err(map_postgres_error)?;\n'
              '        Ok(Self {\n'
              '            profile,\n'
              '            client: pool::ClientHandle::direct(client),\n'
              '            cancel_transport: cancel::CancelTransport::Plain,\n'
              '        })'
          )
          source, count = connect_pattern.subn(connect_replacement, source, count=1)
          if count != 1:
              raise SystemExit('PgRepository::connect anchor drifted')

          intent_start = source.find('impl IntentKind {')
          if intent_start < 0:
              raise SystemExit('IntentKind implementation is missing')
          index = source.find('{', intent_start)
          depth = 0
          intent_end = None
          for position in range(index, len(source)):
              if source[position] == '{':
                  depth += 1
              elif source[position] == '}':
                  depth -= 1
                  if depth == 0:
                      intent_end = position + 1
                      break
          if intent_end is None:
              raise SystemExit('IntentKind implementation is unbalanced')
          intent_impl = '''impl IntentKind {
              const fn database_value(self) -> i16 {
                  self as i16
              }

              pub(crate) const fn from_database_value(value: i16) -> Option<Self> {
                  match value {
                      0 => Some(Self::Broadcast),
                      1 => Some(Self::SearchIndex),
                      2 => Some(Self::Notification),
                      3 => Some(Self::ExternalEffect),
                      4 => Some(Self::Completion),
                      _ => None,
                  }
              }
          }'''
          source = source[:intent_start] + intent_impl + source[intent_end:]
          lib.write_text(source, encoding='utf-8')

          app = root / 'crates/trnm-persistence-pg/src/bin/trnm_server/app.rs'
          source = app.read_text(encoding='utf-8')
          start_candidates = [
              source.find('#[derive(Clone, Copy, Debug, Default, Eq, PartialEq)]\npub struct RepositoryOperationalMetrics'),
              source.find('pub trait Repository:'),
          ]
          start = next((value for value in start_candidates if value >= 0), -1)
          end = source.find('impl Repository for PgRepository')
          if start < 0 or end < 0 or start >= end:
              raise SystemExit('Repository trait section anchor drifted')
          trait_block = '''#[derive(Clone, Copy, Debug, Default, Eq, PartialEq)]
          pub struct RepositoryOperationalMetrics {
              pub pool_max_size: u64,
              pub pool_connections: u64,
              pub pool_idle_connections: u64,
              pub pool_acquire_attempts: u64,
              pub pool_acquire_failures: u64,
              pub pool_session_policy_failures: u64,
              pub retry_attempts: u64,
              pub retries: u64,
              pub retry_exhausted: u64,
              pub retry_sleep_milliseconds: u64,
              pub deadline_watchdogs: u64,
              pub deadline_cancellations: u64,
              pub deadline_cancel_failures: u64,
          }

          pub trait Repository: std::fmt::Debug {
              fn bootstrap_entity(
                  &mut self,
                  entity: EntityId,
                  authority_generation: u64,
                  state: Digest32,
                  updated_at_ms: u64,
              ) -> Result<EntityHead, DomainError>;

              fn commit_command(&mut self, request: &CommitRequest) -> Result<CommitOutcome, DomainError>;

              fn operational_metrics(&self) -> RepositoryOperationalMetrics {
                  RepositoryOperationalMetrics::default()
              }
          }

          '''
          source = source[:start] + trait_block + source[end:]

          signature = '    fn metrics_response(&self) -> Response {'
          function_start = source.find(signature)
          if function_start < 0:
              raise SystemExit('metrics_response function is missing')
          brace = source.find('{', function_start)
          depth = 0
          function_end = None
          for position in range(brace, len(source)):
              if source[position] == '{':
                  depth += 1
              elif source[position] == '}':
                  depth -= 1
                  if depth == 0:
                      function_end = position + 1
                      break
          if function_end is None:
              raise SystemExit('metrics_response function is unbalanced')
          metrics_function = '''    fn metrics_response(&self) -> Response {
              let ready = u8::from(!self.draining);
              let repository = self.repository.operational_metrics();
              let body = format!(
                  concat!(
                      "# TYPE trnm_server_requests_total counter\n",
                      "trnm_server_requests_total {}\n",
                      "# TYPE trnm_server_successes_total counter\n",
                      "trnm_server_successes_total {}\n",
                      "# TYPE trnm_server_input_failures_total counter\n",
                      "trnm_server_input_failures_total {}\n",
                      "# TYPE trnm_server_domain_failures_total counter\n",
                      "trnm_server_domain_failures_total {}\n",
                      "# TYPE trnm_server_bootstraps_total counter\n",
                      "trnm_server_bootstraps_total {}\n",
                      "# TYPE trnm_server_commands_applied_total counter\n",
                      "trnm_server_commands_applied_total {}\n",
                      "# TYPE trnm_server_command_replays_total counter\n",
                      "trnm_server_command_replays_total {}\n",
                      "# TYPE trnm_server_drain_requests_total counter\n",
                      "trnm_server_drain_requests_total {}\n",
                      "# TYPE trnm_server_ready gauge\n",
                      "trnm_server_ready {}\n",
                      "# TYPE trnm_server_database_pool_max_size gauge\n",
                      "trnm_server_database_pool_max_size {}\n",
                      "# TYPE trnm_server_database_pool_connections gauge\n",
                      "trnm_server_database_pool_connections {}\n",
                      "# TYPE trnm_server_database_pool_idle_connections gauge\n",
                      "trnm_server_database_pool_idle_connections {}\n",
                      "# TYPE trnm_server_database_pool_acquire_attempts_total counter\n",
                      "trnm_server_database_pool_acquire_attempts_total {}\n",
                      "# TYPE trnm_server_database_pool_acquire_failures_total counter\n",
                      "trnm_server_database_pool_acquire_failures_total {}\n",
                      "# TYPE trnm_server_database_session_policy_failures_total counter\n",
                      "trnm_server_database_session_policy_failures_total {}\n",
                      "# TYPE trnm_server_database_retry_attempts_total counter\n",
                      "trnm_server_database_retry_attempts_total {}\n",
                      "# TYPE trnm_server_database_retries_total counter\n",
                      "trnm_server_database_retries_total {}\n",
                      "# TYPE trnm_server_database_retry_exhausted_total counter\n",
                      "trnm_server_database_retry_exhausted_total {}\n",
                      "# TYPE trnm_server_database_retry_sleep_milliseconds_total counter\n",
                      "trnm_server_database_retry_sleep_milliseconds_total {}\n",
                      "# TYPE trnm_server_database_deadline_watchdogs_total counter\n",
                      "trnm_server_database_deadline_watchdogs_total {}\n",
                      "# TYPE trnm_server_database_deadline_cancellations_total counter\n",
                      "trnm_server_database_deadline_cancellations_total {}\n",
                      "# TYPE trnm_server_database_deadline_cancel_failures_total counter\n",
                      "trnm_server_database_deadline_cancel_failures_total {}\n",
                  ),
                  self.metrics.requests,
                  self.metrics.successes,
                  self.metrics.input_failures,
                  self.metrics.domain_failures,
                  self.metrics.bootstraps,
                  self.metrics.commands_applied,
                  self.metrics.command_replays,
                  self.metrics.drain_requests,
                  ready,
                  repository.pool_max_size,
                  repository.pool_connections,
                  repository.pool_idle_connections,
                  repository.pool_acquire_attempts,
                  repository.pool_acquire_failures,
                  repository.pool_session_policy_failures,
                  repository.retry_attempts,
                  repository.retries,
                  repository.retry_exhausted,
                  repository.retry_sleep_milliseconds,
                  repository.deadline_watchdogs,
                  repository.deadline_cancellations,
                  repository.deadline_cancel_failures,
              );
              Response::text(200, body)
          }'''
          source = source[:function_start] + metrics_function + source[function_end:]
          app.write_text(source, encoding='utf-8')

          module = root / 'crates/trnm-persistence-pg/src/bin/trnm_server/mod.rs'
          source = module.read_text(encoding='utf-8')
          if 'pub(crate) mod pool;' not in source:
              anchor = 'pub(crate) mod json;\n'
              if anchor not in source:
                  raise SystemExit('server module anchor drifted')
              source = source.replace(anchor, anchor + 'pub(crate) mod pool;\n', 1)
          module.write_text(source, encoding='utf-8')

          server = root / 'crates/trnm-persistence-pg/src/bin/trnm_server/server.rs'
          source = server.read_text(encoding='utf-8')
          source = source.replace('use trnm_persistence_pg::PgRepository;\n\n', '')
          source = source.replace('use super::app::App;', 'use super::app::{App, Repository};')
          source = source.replace(
              'pub fn serve(config: &ServerConfig, repository: PgRepository) -> Result<(), ServerError> {',
              'pub fn serve<R: Repository>(config: &ServerConfig, repository: R) -> Result<(), ServerError> {',
          )
          server.write_text(source, encoding='utf-8')

          schema = root / 'crates/trnm-persistence-pg/src/bin/trnm_server/schema.rs'
          schema_text = schema.read_text(encoding='utf-8')
          for marker in ('PooledRepository', 'build_pool', 'PgPool'):
              if marker not in schema_text:
                  raise SystemExit(f'schema composition lacks required marker: {marker}')

          workflow_text = '\n'.join(
              path.read_text(encoding='utf-8', errors='replace')
              for path in (root / '.github/workflows').glob('*.yml')
              if not path.name.startswith('temporary-')
          )
          postgres_images = re.findall(
              r'postgres(?::[^@\s"\']+)?@sha256:[0-9a-f]{64}',
              workflow_text,
          )
          cockroach_images = re.findall(
              r'cockroachdb/cockroach(?::[^@\s"\']+)?@sha256:[0-9a-f]{64}',
              workflow_text,
          )
          if not postgres_images or not cockroach_images:
              raise SystemExit('immutable PostgreSQL/CockroachDB image identity not found')
          postgres_image = postgres_images[0]
          cockroach_image = cockroach_images[0]
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'POSTGRES_IMAGE={postgres_image}\n')
              handle.write(f'COCKROACH_IMAGE={cockroach_image}\n')

          permanent = root / '.github/workflows/pg-outbox-fault.yml'
          permanent.write_text(
              f'''name: pg-outbox-fault

          on:
            pull_request:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: pg-outbox-fault-${{{{ github.event.pull_request.number || github.ref }}}}
            cancel-in-progress: true

          jobs:
            postgresql-outbox:
              runs-on: ubuntu-24.04
              timeout-minutes: 35
              env:
                CANDIDATE_SHA: ${{{{ github.event.pull_request.head.sha || github.sha }}}}
                DATABASE_URL: postgresql://trnm:trnm@127.0.0.1:55432/trnm?sslmode=disable
                TRNM_SERVER_DATABASE_URL: postgresql://trnm:trnm@127.0.0.1:55432/trnm?sslmode=disable
                TRNM_SERVER_DATABASE_PROFILE: postgresql
                TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE: "1"
                TRNM_SERVER_ADMIN_TOKEN: outbox_fault_admin_token_0123456789abcdef
                TRNM_LIVE_TEST_REQUIRED: "1"
                TRNM_PG_TEST_URL: postgresql://trnm:trnm@127.0.0.1:55432/trnm?sslmode=disable
                TRNM_PG_TEST_PROFILE: postgresql
              steps:
                - name: Fetch exact candidate
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf "$GITHUB_WORKSPACE"
                    git init "$GITHUB_WORKSPACE"
                    git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{GITHUB_REPOSITORY}}.git"
                    git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
                    git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
                    test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
                - name: Execute PostgreSQL outbox crash matrix
                  shell: bash
                  run: |
                    set -euo pipefail
                    trap 'docker rm -f trnm-outbox-postgres >/dev/null 2>&1 || true' EXIT
                    rustup toolchain install 1.85.1 --profile minimal
                    rustup override set 1.85.1
                    docker run -d --name trnm-outbox-postgres \
                      -e POSTGRES_USER=trnm -e POSTGRES_PASSWORD=trnm -e POSTGRES_DB=trnm \
                      -p 127.0.0.1:55432:5432 {postgres_image}
                    for attempt in $(seq 1 90); do
                      docker exec trnm-outbox-postgres pg_isready -U trnm -d trnm && break
                      test "$attempt" -lt 90
                      sleep 1
                    done
                    export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$CANDIDATE_SHA"
                    cargo run --package trnm-persistence-pg --bin trnm-server --locked -- migrate
                    cargo test --package trnm-persistence-pg --test outbox_runtime --locked -- --nocapture

            cockroachdb-outbox:
              runs-on: ubuntu-24.04
              timeout-minutes: 35
              env:
                CANDIDATE_SHA: ${{{{ github.event.pull_request.head.sha || github.sha }}}}
                DATABASE_URL: postgresql://root@127.0.0.1:26257/trnm?sslmode=disable
                TRNM_SERVER_DATABASE_URL: postgresql://root@127.0.0.1:26257/trnm?sslmode=disable
                TRNM_SERVER_DATABASE_PROFILE: cockroachdb
                TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE: "1"
                TRNM_SERVER_ADMIN_TOKEN: outbox_fault_admin_token_0123456789abcdef
                TRNM_LIVE_TEST_REQUIRED: "1"
                TRNM_PG_TEST_URL: postgresql://root@127.0.0.1:26257/trnm?sslmode=disable
                TRNM_PG_TEST_PROFILE: cockroachdb
              steps:
                - name: Fetch exact candidate
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf "$GITHUB_WORKSPACE"
                    git init "$GITHUB_WORKSPACE"
                    git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{GITHUB_REPOSITORY}}.git"
                    git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
                    git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
                    test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
                - name: Execute CockroachDB outbox crash matrix
                  shell: bash
                  run: |
                    set -euo pipefail
                    trap 'docker rm -f trnm-outbox-cockroach >/dev/null 2>&1 || true' EXIT
                    rustup toolchain install 1.85.1 --profile minimal
                    rustup override set 1.85.1
                    docker run -d --name trnm-outbox-cockroach \
                      -p 127.0.0.1:26257:26257 {cockroach_image} \
                      start-single-node --insecure --listen-addr=0.0.0.0:26257 \
                      --http-addr=0.0.0.0:8080
                    for attempt in $(seq 1 90); do
                      docker exec trnm-outbox-cockroach cockroach sql --insecure \
                        --host=127.0.0.1:26257 -e 'SELECT 1' >/dev/null 2>&1 && break
                      test "$attempt" -lt 90
                      sleep 1
                    done
                    docker exec trnm-outbox-cockroach cockroach sql --insecure \
                      --host=127.0.0.1:26257 -e 'CREATE DATABASE IF NOT EXISTS trnm'
                    export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$CANDIDATE_SHA"
                    cargo run --package trnm-persistence-pg --bin trnm-server --locked -- migrate
                    cargo test --package trnm-persistence-pg --test outbox_runtime --locked -- --nocapture
          ''',
              encoding='utf-8',
          )

          protocol = root / 'docs/development/OUTBOX_DISPATCH_PROTOCOL.md'
          protocol.write_text(
              '''# Transactional outbox dispatch protocol

          Status: source candidate. Compatibility, durability, production and retirement credit remain false until exact-head profile evidence and independent review are accepted.

          The PG-wire repository exposes bounded claim, completion, retry and dead-letter transitions. Every mutation is fenced by intent identity, owner node, attempt, lease generation and exact lease expiry. A worker that has lost or exceeded its lease cannot complete or reschedule an intent. Claim increments both attempt and generation atomically. Pending or expired leased rows at the attempt ceiling are atomically converted to dead-letter state during the next claim scan, preventing a crash after the final delivery attempt from stranding an invisible lease.

          Successful completion clears ownership and stores a non-zero receipt digest. Retry clears ownership and schedules an explicit next-available timestamp. Dead-letter clears ownership and stores a stable reason digest. State inspection exposes only typed pending, leased, delivered and dead-letter records.

          The dual-profile fault test proves the declared subset on fresh PostgreSQL and CockroachDB databases: initial claim, explicit retry, generation fencing, simulated worker crash at the attempt ceiling, automatic dead-letter reclaim, successful receipt completion, and persistence across repository reconnection. The server pool additionally holds the checked-out connection until its cancellation watchdog exits, preventing a late cancel request from targeting a later borrower.

          Remaining closure requirements include a real external-effect dispatcher and reconciliation adapter, node-loss/endurance/load evidence, TLS rotation and expiry faults, independently accepted database/protocol/security review, and later SG4/SG8 production evidence.
          ''',
              encoding='utf-8',
          )

          for path in (root / '.github/workflows').glob('temporary-*.yml'):
              path.unlink()
          shutil.rmtree(staged, ignore_errors=True)
          parent = staged.parent
          if parent.is_dir() and not any(parent.iterdir()):
              parent.rmdir()
          PY
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -print -quit)"
          test ! -d .github/tmp/runtime-closure
          git diff --check

      - name: Execute strict local source gates
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/runtime-closure-validation.log) 2>&1
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo check --package trnm-persistence-pg --all-targets
          cargo clippy --package trnm-persistence-pg --all-targets --fix --allow-dirty --allow-staged -- -W clippy::all
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Execute PostgreSQL outbox crash matrix before commit
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/runtime-closure-validation.log) 2>&1
          trap 'docker rm -f trnm-master-postgres >/dev/null 2>&1 || true' EXIT
          docker run -d --name trnm-master-postgres \
            -e POSTGRES_USER=trnm -e POSTGRES_PASSWORD=trnm -e POSTGRES_DB=trnm \
            -p 127.0.0.1:55432:5432 "$POSTGRES_IMAGE"
          for attempt in $(seq 1 90); do
            docker exec trnm-master-postgres pg_isready -U trnm -d trnm && break
            test "$attempt" -lt 90
            sleep 1
          done
          export TRNM_SERVER_DATABASE_URL='postgresql://trnm:trnm@127.0.0.1:55432/trnm?sslmode=disable'
          export TRNM_SERVER_DATABASE_PROFILE='postgresql'
          export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$GITHUB_SHA"
          export TRNM_SERVER_ADMIN_TOKEN='outbox_fault_admin_token_0123456789abcdef'
          export TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE='1'
          export TRNM_LIVE_TEST_REQUIRED='1'
          export TRNM_PG_TEST_URL="$TRNM_SERVER_DATABASE_URL"
          export TRNM_PG_TEST_PROFILE='postgresql'
          cargo run --package trnm-persistence-pg --bin trnm-server --locked -- migrate
          cargo test --package trnm-persistence-pg --test outbox_runtime --locked -- --nocapture

      - name: Execute CockroachDB outbox crash matrix before commit
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/runtime-closure-validation.log) 2>&1
          trap 'docker rm -f trnm-master-cockroach >/dev/null 2>&1 || true' EXIT
          docker run -d --name trnm-master-cockroach \
            -p 127.0.0.1:26257:26257 "$COCKROACH_IMAGE" \
            start-single-node --insecure --listen-addr=0.0.0.0:26257 \
            --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 90); do
            docker exec trnm-master-cockroach cockroach sql --insecure \
              --host=127.0.0.1:26257 -e 'SELECT 1' >/dev/null 2>&1 && break
            test "$attempt" -lt 90
            sleep 1
          done
          docker exec trnm-master-cockroach cockroach sql --insecure \
            --host=127.0.0.1:26257 -e 'CREATE DATABASE IF NOT EXISTS trnm'
          export TRNM_SERVER_DATABASE_URL='postgresql://root@127.0.0.1:26257/trnm?sslmode=disable'
          export TRNM_SERVER_DATABASE_PROFILE='cockroachdb'
          export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$GITHUB_SHA"
          export TRNM_SERVER_ADMIN_TOKEN='outbox_fault_admin_token_0123456789abcdef'
          export TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE='1'
          export TRNM_LIVE_TEST_REQUIRED='1'
          export TRNM_PG_TEST_URL="$TRNM_SERVER_DATABASE_URL"
          export TRNM_PG_TEST_PROFILE='cockroachdb'
          cargo run --package trnm-persistence-pg --bin trnm-server --locked -- migrate
          cargo test --package trnm-persistence-pg --test outbox_runtime --locked -- --nocapture

      - name: Reject stale writers and push the clean exact source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -print -quit)"
          test ! -d .github/tmp/runtime-closure
          git diff --check
          git config user.name 'trillionnium-gap-closure-bot'
          git config user.email 'gap-closure-bot@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(pg): close outbox crash and cancellation source gaps'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record exact failure without promoting any claim
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          log = pathlib.Path('/tmp/runtime-closure-validation.log')
          tail = ''
          if log.is_file():
              tail = '\n'.join(log.read_text(encoding='utf-8', errors='replace').splitlines()[-80:])
          body = (
              f"Master runtime closure failed for exact source head `{os.environ['GITHUB_SHA']}`. "
              f"No gap, stage gate or compatibility claim was promoted. Run: "
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}\n\nLast validation lines:\n```text\n{tail}\n```"
          )
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/issues/42/comments",
              data=json.dumps({'body': body}).encode(),
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'trillionnium-master-runtime-closure',
              },
          )
          try:
              urllib.request.urlopen(request, timeout=30).read()
          except Exception:
              pass
          PY
