name: repository-governance-contract

on:
  pull_request:
    paths:
      - 'scripts/apply-repository-governance.sh'
      - 'docs/governance/REPOSITORY_GOVERNANCE_APPLY.md'
      - '.github/CODEOWNERS'
      - '.github/workflows/trillionnium-game-merge-gate.yml'
      - '.github/workflows/repository-governance-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/apply-repository-governance.sh'
      - 'docs/governance/REPOSITORY_GOVERNANCE_APPLY.md'
      - '.github/CODEOWNERS'
      - '.github/workflows/trillionnium-game-merge-gate.yml'
      - '.github/workflows/repository-governance-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  fail-closed-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate shell syntax and immutable identifiers
        run: |
          set -euo pipefail
          bash -n scripts/apply-repository-governance.sh
          grep -q 'TrillionniumFoundation/TrillionniumGame' scripts/apply-repository-governance.sh
          grep -q 'repository_id=1323087470' scripts/apply-repository-governance.sh
          grep -q 'required_context=trillionnium-game-merge-gate' scripts/apply-repository-governance.sh
          grep -q 'TRNM_EXPECTED_MAIN' scripts/apply-repository-governance.sh
          grep -q 'completed.*successful' docs/governance/REPOSITORY_GOVERNANCE_APPLY.md
      - name: Prove mutation cannot run without confirmation
        run: |
          set -euo pipefail
          if env -u TRNM_GOVERNANCE_CONFIRM \
            TRNM_EXPECTED_MAIN=0000000000000000000000000000000000000000 \
            bash scripts/apply-repository-governance.sh run/governance/negative; then
            echo 'governance mutation ran without explicit confirmation' >&2
            exit 1
          fi
