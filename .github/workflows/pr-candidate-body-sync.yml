name: pr-candidate-body-sync

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-candidate-body-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synchronize-candidate-identity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Fetch exact pull-request head without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$HEAD_SHA"

      - name: Replace only the machine-owned identity block
        shell: bash
        run: |
          set -euo pipefail
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          export TREE_SHA
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          number = os.environ['PR_NUMBER']
          token = os.environ['GH_TOKEN']
          head = os.environ['HEAD_SHA']
          tree = os.environ['TREE_SHA']
          base = os.environ['BASE_SHA']
          api = f'https://api.github.com/repos/{repository}/pulls/{number}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'trillionnium-pr-candidate-body-sync',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          request = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.loads(response.read().decode('utf-8'))
          body = pull.get('body') or ''
          start = '<!-- trillionnium-candidate-identity:start -->'
          end = '<!-- trillionnium-candidate-identity:end -->'
          block = f'''{start}
## Machine-synchronized exact candidate identity

- repository: `{repository}`
- pull request: `#{number}`
- base commit: `{base}`
- head commit: `{head}`
- head tree: `{tree}`
- branch: `{pull['head']['ref']}`

Any later push invalidates prior exact-head execution evidence. CI success, independent
review, compatibility and production credit remain separate and are not asserted by this block.
{end}'''
          if start in body or end in body:
              if body.count(start) != 1 or body.count(end) != 1:
                  raise SystemExit('candidate identity markers are malformed or ambiguous')
              begin = body.index(start)
              finish = body.index(end, begin) + len(end)
              body = body[:begin].rstrip() + '\n\n' + block + '\n\n' + body[finish:].lstrip()
          else:
              body = block + '\n\n' + body
          payload = json.dumps({'body': body}).encode('utf-8')
          update = urllib.request.Request(
              api,
              data=payload,
              headers={**headers, 'Content-Type': 'application/json'},
              method='PATCH',
          )
          with urllib.request.urlopen(update, timeout=30) as response:
              updated = json.loads(response.read().decode('utf-8'))
          if updated.get('head', {}).get('sha') != head:
              raise SystemExit('pull-request head changed during body synchronization')
          if block not in (updated.get('body') or ''):
              raise SystemExit('candidate identity block did not persist')
          print(json.dumps({'pull_request': int(number), 'head': head, 'tree': tree, 'status': 'synchronized'}, sort_keys=True))
          PY
