name: trillionnium-game-sg2-instrumented-build-contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/oracle-instrumentation-policy.json'
      - 'contracts/oracle/instrumented-build-manifest.v1.schema.json'
      - 'tools/oracle/build_provenance.py'
      - 'scripts/oracle/verify-instrumented-build.py'
      - 'scripts/oracle/check-instrumented-build-contract.sh'
      - 'tests/oracle/test_instrumented_build_provenance.py'
      - 'docs/development/INSTRUMENTED_ORACLE_BUILD_PROVENANCE.md'
      - '.github/workflows/sg2-instrumented-build-contract.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-instrumented-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  provenance-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate provenance and malicious-input contracts
        run: bash scripts/oracle/check-instrumented-build-contract.sh
      - name: Prove no approved build artifact is bundled
        run: |
          set -euo pipefail
          test ! -e run/instrumented-build.approved.json
          test ! -e oracle/instrumented/image.lock.json
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
