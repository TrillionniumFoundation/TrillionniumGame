name: trillionnium-game-sg1-denominator-review-lock

on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read

concurrency:
  group: tg-sg1-review-lock-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  review-lock-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate current review authority
        run: |
          set -euo pipefail
          grep -q 'SG1 remains incomplete until every family and the global bundle are independently accepted and locked' docs/COMPATIBILITY.md
          grep -q 'Automation, implementation authors, generated summaries and PR prose cannot provide independent acceptance' docs/TESTING_AND_EVIDENCE.md
      - name: Run fail-closed review lock tests
        run: bash scripts/check-denominator-review-lock.sh
      - name: Assert policy cannot self-close SG1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          policy = json.load(open('config/denominator-review-policy.json'))
          assert policy['self_approval_allowed'] is False
          assert policy['remote_evidence_required_for_lock'] is True
          assert policy['global_sg1_requires_independent_gate_review'] is True
          assert len(policy['required_denominators']) == 14
          PY
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
