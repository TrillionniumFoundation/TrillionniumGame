name: remaining-source-wave-v5-bootstrap

on:
  push:
    branches: [tooling/remaining-source-wave-v2-2026-09-06]
    paths:
      - '.github/workflows/remaining-source-wave-v5-bootstrap.yml'
      - 'tools/apply-canonical-server-authority-v4.py'
      - 'tools/apply-canonical-server-authority-v5.py'

permissions:
  contents: write

concurrency:
  group: remaining-source-wave-v5-bootstrap
  cancel-in-progress: true

jobs:
  compose-validate-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      SOURCE_BASE_SHA: 7deee4377cff401854647151842c582f038feef1
      OUTBOX_SHA: 4ce383a55d76a8b2b05827c5017b36f9789c02bd
      SESSION_SHA: 0d0f246a131902403202afcd28103f22af30c8a9
      REALTIME_SHA: 4a72ecdb9341faa9c5211b3479f58d075f75a7ba
      SERVER_SHA: 9ef64a8b93b52808bbbde0acaf74c382e6b4b15f
      HARDENING_SHA: f3e9476ff8b6d781b61ad35c135041eddddcfcff
      PRODUCT_BRANCH: codex/remaining-source-blockers-wave-v5-2026-09-07
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Resolve latest singular Plan integration identity
        shell: bash
        run: |
          set -euo pipefail
          plan_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/63" --jq '.head.sha')
          plan_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/63" --jq '.head.ref')
          extended_base=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/92" --jq '.base.sha')
          extended_head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/92" --jq '.head.sha')
          test -n "$plan_sha" && test -n "$plan_ref"
          test -n "$extended_base" && test -n "$extended_head"
          printf 'PLAN_SHA=%s\nPLAN_REF=%s\nEXTENDED_BASE=%s\nEXTENDED_HEAD=%s\n' \
            "$plan_sha" "$plan_ref" "$extended_base" "$extended_head" >> "$GITHUB_ENV"

      - name: Fetch exact immutable source surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/tooling"
          git init "$RUNNER_TEMP/tooling"
          git -C "$RUNNER_TEMP/tooling" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tooling" rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$RUNNER_TEMP/tooling/tools/apply-canonical-server-authority-v4.py"
          test -f "$RUNNER_TEMP/tooling/tools/apply-canonical-server-authority-v5.py"

          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags origin \
            "$PLAN_SHA:refs/remotes/source/plan" \
            "$SOURCE_BASE_SHA:refs/remotes/source/source-base" \
            "$OUTBOX_SHA:refs/remotes/source/outbox" \
            "$SESSION_SHA:refs/remotes/source/session" \
            "$REALTIME_SHA:refs/remotes/source/realtime" \
            "$SERVER_SHA:refs/remotes/source/server" \
            "$HARDENING_SHA:refs/remotes/source/hardening" \
            "$EXTENDED_BASE:refs/remotes/source/extended-base" \
            "$EXTENDED_HEAD:refs/remotes/source/extended-head"
          git -C "$GITHUB_WORKSPACE/source" checkout -b "$PRODUCT_BRANCH" "$PLAN_SHA"
          for ref in outbox session realtime server hardening; do
            git -C "$GITHUB_WORKSPACE/source" merge-base --is-ancestor \
              "$SOURCE_BASE_SHA" "refs/remotes/source/$ref"
          done

      - name: Compose reviewed waves and atomically converge server authority
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            test -n "$path" || continue
            case "$path" in
              .github/workflows/*|tools/apply-*|crates/trnm-persistence-core/tests/outbox_state_model.rs|crates/trnm-presence-router-v2/*|crates/trnm-server/*)
                continue
                ;;
            esac
            if git cat-file -e "$EXTENDED_HEAD:$path" 2>/dev/null; then
              git checkout "$EXTENDED_HEAD" -- "$path"
            else
              git rm -r --ignore-unmatch -- "$path"
            fi
          done < <(git diff --name-only "$EXTENDED_BASE" "$EXTENDED_HEAD")

          git checkout "$OUTBOX_SHA" -- crates/trnm-persistence-core/tests/outbox_state_model.rs
          git checkout "$SESSION_SHA" -- crates/trnm-presence-router-v2

          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml
          git show "$HARDENING_SHA:tools/apply-session-registry-hardening.py.gz.b64" \
            | base64 -d | gzip -dc > "$RUNNER_TEMP/apply-session-hardening.py"
          python3 -m py_compile "$RUNNER_TEMP/apply-session-hardening.py"
          python3 "$RUNNER_TEMP/apply-session-hardening.py" "$PWD"

          git checkout "$REALTIME_SHA" -- \
            crates/trnm-presence-router-v2/src/connection_actor.rs \
            crates/trnm-presence-router-v2/src/disconnect_journal.rs \
            crates/trnm-presence-router-v2/src/reconnect_cursor.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/trnm-presence-router-v2/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          anchor = 'mod router;\nmod session_registry;\nmod types;\n'
          if 'mod connection_actor;' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('realtime module anchor drift')
              text = text.replace(
                  anchor,
                  'mod connection_actor;\nmod disconnect_journal;\nmod reconnect_cursor;\n' + anchor,
                  1,
              )
          export_anchor = 'pub use router::{MutationDisposition, PresenceDelta, PresenceError, PresenceRouter};\n'
          exports = (
              'pub use connection_actor::{\n'
              '    ConnectionActor, ConnectionActorConfig, ConnectionActorError, ConnectionActorState,\n'
              '    CorrelationId, InboundFrame, OutboundFrame, PendingRequest,\n};\n'
              'pub use disconnect_journal::{\n'
              '    DisconnectIntentId, DisconnectJournal, DisconnectJournalError, DisconnectOperation,\n'
              '    DisconnectRecord, DisconnectState, LeaseToken, RetryDisposition, WorkerId,\n};\n'
              'pub use reconnect_cursor::{\n'
              '    ReconnectCursor, ReconnectEvent, ReconnectJournal, ReconnectJournalConfig,\n'
              '    ReconnectJournalError,\n};\n'
          )
          if 'pub use connection_actor::' not in text:
              if text.count(export_anchor) != 1:
                  raise SystemExit('realtime export anchor drift')
              text = text.replace(export_anchor, exports + export_anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git checkout "$SERVER_SHA" -- crates/trnm-server
          python3 "$RUNNER_TEMP/tooling/tools/apply-canonical-server-authority-v5.py" \
            "$PWD" "$RUNNER_TEMP/tooling/tools"
          test ! -e crates/trnm-persistence-pg/src/bin/trnm-server.rs
          test ! -e crates/trnm-persistence-pg/src/bin/trnm_server
          test -f crates/trnm-server/src/runtime/retry_atomicity.rs
          test -f scripts/trnm_server_authority.py

      - name: Normalize every Rust workspace and text contract
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/trnm-server/Cargo.toml
          cargo fmt --all
          python3 - <<'PY'
          import json
          from pathlib import Path
          authority = json.loads(Path('docs/development/RUST_PACKAGE_AUTHORITY.json').read_text())
          manifests = [row['manifest'] for row in authority['isolated_workspaces']]
          Path('/tmp/isolated-manifests').write_text('\n'.join(manifests) + '\n')
          PY
          while IFS= read -r manifest; do
            cargo fmt --manifest-path "$manifest"
          done < /tmp/isolated-manifests
          find . -path './.git' -prune -o -type f \
            \( -name '*.md' -o -name '*.json' -o -name '*.py' -o -name '*.sh' -o -name '*.rs' -o -name '*.toml' \) \
            -print0 | xargs -0 sed -i 's/[[:space:]]\+$//'
          git add -A
          test -s crates/trnm-server/Cargo.lock
          grep -q '^version = 4$' crates/trnm-server/Cargo.lock
          git diff --cached --check

      - name: Validate root and all isolated Rust workspaces
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          while IFS= read -r manifest; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done < /tmp/isolated-manifests
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-rust-server-slice.py
          python3 scripts/check-rust-server-source-candidate.py
          bash scripts/check-rust-server-process.sh

      - name: Validate Go and the complete Plan control plane
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          files=$(find runtime -type f -name '*.go' -print | sort)
          test -n "$files"
          test -z "$(printf '%s\n' "$files" | xargs gofmt -l)"
          (cd runtime && go test ./... -count=1 && go test -race ./... -count=1 && go vet ./...)
          python3 -m compileall -q scripts tools tests
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-module-docs.py
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 scripts/check-derived-gates.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"

      - name: Publish one ordinary fast-forward source candidate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'refactor(server): converge canonical Plan v3.1 authority controls'
          test -z "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}")"
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          printf 'product_head=%s\nproduct_tree=%s\nchanged_paths=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            "$(git diff --name-only "$PLAN_SHA" HEAD | wc -l | tr -d ' ')"
