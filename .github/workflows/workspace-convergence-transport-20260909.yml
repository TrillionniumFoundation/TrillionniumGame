name: workspace-convergence-transport-20260909

on:
  push:
    branches:
      - codex/workspace-convergence-transport-2026-09-09
    paths:
      - .github/workflows/workspace-convergence-transport-20260909.yml

permissions:
  contents: write

concurrency:
  group: workspace-convergence-transport-20260909
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_BRANCH: codex/architecture-gap-closure-2026-09-08
    steps:
      - name: Fetch current target without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/target"
          git init "$GITHUB_WORKSPACE/target"
          git -C "$GITHUB_WORKSPACE/target" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/target" fetch --no-tags origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git -C "$GITHUB_WORKSPACE/target" checkout -b "$TARGET_BRANCH" \
            "refs/remotes/origin/${TARGET_BRANCH}"
          git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD > "$RUNNER_TEMP/original-head"

      - name: Converge long-lived Rust packages into one workspace
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import textwrap
          from pathlib import Path
          from typing import Any

          root = Path('.')
          long_lived = [
              'trnm-contracts',
              'trnm-authority-core',
              'trnm-session-core',
              'trnm-storage-core',
              'trnm-persistence-core',
              'trnm-persistence-pg',
              'trnm-canonical-core',
              'trnm-transport-core',
              'trnm-token-core',
              'trnm-presence-core',
              'trnm-query-core',
              'trnm-token-jwt-adapter',
              'trnm-presence-router-v2',
              'trnm-server',
              'trnm-persistence-runtime-policy',
              'trnm-realtime-wire',
              'trnm-storage-nakama-version',
              'trnm-token-crypto-provider',
              'trnm-token-jwt-provider-adapter',
          ]
          gates = [
              'trnm-token-jwt-adapter-gate',
              'trnm-token-jwt-adapter-gate-v2',
          ]
          members = [f'crates/{name}' for name in long_lived]
          excludes = [f'crates/{name}' for name in gates]

          cargo_path = root / 'Cargo.toml'
          cargo = cargo_path.read_text(encoding='utf-8')
          workspace = '[workspace]\n' + 'members = [\n' + ''.join(
              f'  "{path}",\n' for path in members
          ) + ']\nexclude = [\n' + ''.join(
              f'  "{path}",\n' for path in excludes
          ) + ']\nresolver = "2"\n\n'
          replaced, count = re.subn(
              r'(?s)\[workspace\]\n.*?(?=\[workspace\.package\])',
              workspace,
              cargo,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'root workspace block replacement count={count}')
          cargo_path.write_text(replaced, encoding='utf-8')

          for name in long_lived:
              manifest = root / f'crates/{name}/Cargo.toml'
              text = manifest.read_text(encoding='utf-8')
              text = re.sub(r'(?m)^\[workspace\][ \t]*\n?', '', text)
              manifest.write_text(text, encoding='utf-8')
              nested_lock = manifest.parent / 'Cargo.lock'
              if nested_lock.exists():
                  nested_lock.unlink()
              readme = manifest.parent / 'README.md'
              if readme.exists():
                  readme_text = readme.read_text(encoding='utf-8')
                  readme_text = readme_text.replace(
                      'Workspace class: `isolated`',
                      'Workspace class: `root`',
                  )
                  readme.write_text(readme_text, encoding='utf-8')

          registry_path = root / 'docs/status/MODULE_DOCUMENTATION.json'
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          rows = registry['modules']
          for row in rows:
              row['workspace'] = 'isolated' if row['id'] in gates else 'root'
          summary = registry['summary']
          summary['module_count'] = len(rows)
          summary['documented_count'] = len(rows)
          summary['root_workspace_count'] = len(long_lived)
          summary['isolated_workspace_count'] = len(gates)
          summary['undocumented_count'] = 0
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=False) + '\n',
              encoding='utf-8',
          )

          def row_identity(value: dict[str, Any]) -> str:
              return ' '.join(
                  str(value.get(key, ''))
                  for key in ('id', 'name', 'path', 'manifest', 'cargo_manifest')
              )

          def rewrite(value: Any) -> Any:
              if isinstance(value, list):
                  return [rewrite(item) for item in value]
              if not isinstance(value, dict):
                  return value
              identity = row_identity(value)
              if 'crates/trnm-' in identity or identity.startswith('trnm-'):
                  isolated = any(name in identity for name in gates)
                  for key in ('workspace', 'workspace_class', 'workspace_kind'):
                      if key in value:
                          value[key] = 'isolated' if isolated else 'root'
                  for key in ('lockfile', 'cargo_lock', 'lock_path'):
                      if key in value:
                          value[key] = (
                              f"crates/{next(name for name in gates if name in identity)}/Cargo.lock"
                              if isolated
                              else 'Cargo.lock'
                          )
              for key, item in list(value.items()):
                  value[key] = rewrite(item)
              for key in ('package_count', 'module_count', 'documented_count', 'total_packages'):
                  if key in value and isinstance(value[key], int):
                      value[key] = len(long_lived) + len(gates)
              for key in ('root_workspace_count', 'root_package_count', 'workspace_member_count'):
                  if key in value and isinstance(value[key], int):
                      value[key] = len(long_lived)
              for key in ('isolated_workspace_count', 'isolated_package_count'):
                  if key in value and isinstance(value[key], int):
                      value[key] = len(gates)
              if 'undocumented_count' in value and isinstance(value['undocumented_count'], int):
                  value['undocumented_count'] = 0
              return value

          for relative in (
              'docs/development/RUST_PACKAGE_AUTHORITY.json',
              'docs/status/COMPONENT_DOCUMENTATION.json',
          ):
              path = root / relative
              if path.exists():
                  payload = rewrite(json.loads(path.read_text(encoding='utf-8')))
                  path.write_text(
                      json.dumps(payload, indent=2, sort_keys=False) + '\n',
                      encoding='utf-8',
                  )

          development_path = root / 'docs/DEVELOPMENT.md'
          development = development_path.read_text(encoding='utf-8')
          old = (
              'The repository also contains intentionally isolated Cargo workspaces. '
              'The aggregate merge gate discovers the package authority and runs format, '
              'all-target tests and strict Clippy for every isolated workspace. A root-workspace '
              'pass alone is not whole-repository coverage.'
          )
          new = (
              'All long-lived Rust products and adapters are members of the root Cargo workspace. '
              'Only the two temporary JWT differential gate packages remain isolated until their '
              'accepted retirement packet is available. The aggregate merge gate runs the root '
              'workspace and both temporary gates; a root-workspace pass alone does not retire a gate.'
          )
          if old in development:
              development = development.replace(old, new, 1)
          development_path.write_text(development, encoding='utf-8')

          checker_path = root / 'scripts/check-workspace-convergence.py'
          checker_path.write_text(textwrap.dedent(f'''\
          #!/usr/bin/env python3
          from __future__ import annotations

          import json
          import tomllib
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          LONG_LIVED = {long_lived!r}
          GATES = {gates!r}
          EXPECTED_MEMBERS = {{f"crates/{{name}}" for name in LONG_LIVED}}
          EXPECTED_EXCLUDES = {{f"crates/{{name}}" for name in GATES}}

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          root_manifest = tomllib.loads((ROOT / "Cargo.toml").read_text(encoding="utf-8"))
          workspace = root_manifest["workspace"]
          require(set(workspace["members"]) == EXPECTED_MEMBERS, "root workspace members are stale")
          require(set(workspace["exclude"]) == EXPECTED_EXCLUDES, "root workspace exclusions are stale")
          for name in LONG_LIVED:
              crate = ROOT / "crates" / name
              text = (crate / "Cargo.toml").read_text(encoding="utf-8")
              require("[workspace]" not in text, f"{{name}} still declares a nested workspace")
              require(not (crate / "Cargo.lock").exists(), f"{{name}} still has a nested lockfile")
          for name in GATES:
              crate = ROOT / "crates" / name
              require(crate.is_dir(), f"temporary gate {{name}} is missing before accepted retirement")
              require("[workspace]" in (crate / "Cargo.toml").read_text(encoding="utf-8"), f"{{name}} must remain isolated")
          registry = json.loads((ROOT / "docs/status/MODULE_DOCUMENTATION.json").read_text(encoding="utf-8"))
          rows = {{row["id"]: row for row in registry["modules"]}}
          require(set(rows) == set(LONG_LIVED + GATES), "module registry package set is stale")
          require(all(rows[name]["workspace"] == "root" for name in LONG_LIVED), "long-lived module workspace metadata is stale")
          require(all(rows[name]["workspace"] == "isolated" for name in GATES), "gate workspace metadata is stale")
          summary = registry["summary"]
          require(summary["root_workspace_count"] == len(LONG_LIVED), "root workspace summary is stale")
          require(summary["isolated_workspace_count"] == len(GATES), "isolated workspace summary is stale")
          print("workspace convergence validation passed")
          '''), encoding='utf-8')
          checker_path.chmod(0o755)

          test_path = root / 'tests/control_plane/test_workspace_convergence.py'
          test_path.write_text(textwrap.dedent('''\
          from __future__ import annotations

          import subprocess
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]

          class WorkspaceConvergenceTest(unittest.TestCase):
              def test_repository_checker(self) -> None:
                  subprocess.run(
                      ["python3", "scripts/check-workspace-convergence.py"],
                      cwd=ROOT,
                      check=True,
                  )

          if __name__ == "__main__":
              unittest.main()
          '''), encoding='utf-8')

          merge_gate_path = root / '.github/workflows/trillionnium-game-merge-gate.yml'
          merge_gate = merge_gate_path.read_text(encoding='utf-8')
          anchor = (
              '      - name: Validate complete Rust package and target inventory\n'
              '        run: python3 scripts/check-rust-package-inventory.py\n'
          )
          step = (
              '      - name: Validate converged Rust workspace topology\n'
              '        run: python3 scripts/check-workspace-convergence.py\n'
          )
          if step not in merge_gate:
              if anchor not in merge_gate:
                  raise SystemExit('workspace merge-gate anchor missing')
              merge_gate = merge_gate.replace(anchor, anchor + step, 1)
          compile_anchor = '            scripts/check-rust-package-inventory.py \\\n'
          compile_line = '            scripts/check-workspace-convergence.py \\\n'
          if compile_line not in merge_gate:
              if compile_anchor not in merge_gate:
                  raise SystemExit('workspace compile anchor missing')
              merge_gate = merge_gate.replace(compile_anchor, compile_anchor + compile_line, 1)
          merge_gate_path.write_text(merge_gate, encoding='utf-8')
          PY
          git diff --check
          python3 scripts/check-workspace-convergence.py

      - name: Refresh one root lockfile and run complete validation
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo metadata --format-version 1 --no-deps >/dev/null
          cargo fmt --all
          cargo fmt --all -- --check
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-workspace-convergence.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          (
            cd runtime
            test -z "$(gofmt -l .)"
            go test ./... -count=1
            go test -race ./... -count=1
            go vet ./...
          )
          git diff --check

      - name: Publish only a tested fast-forward commit
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          test "$(git rev-parse HEAD)" = "$original"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'build: converge long-lived Rust crates into one workspace'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Delete transport branch after successful publication
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/target" push origin \
            --delete codex/workspace-convergence-transport-2026-09-09
