name: pr57-staging-validation

on:
  push:
    branches:
      - codex/pr57-batch-staging-2026-08-31-a
    paths:
      - '.github/workflows/z-pr57-staging-validation.yml'

permissions:
  contents: read

concurrency:
  group: pr57-staging-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_REPOSITORY: ${{ github.repository }}
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Fetch exact staging candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Remove staging-only validator from the product view
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/z-pr57-staging-validation.yml

      - name: Validate workflow, shell and Python contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -c 'import tomllib; print("tomllib=available")'
          bash -n scripts/ci-outbox-final-attempt-reaper.sh
          bash -n scripts/ci-trnm-server-live.sh
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-migration-lock.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/audit-workflow-pins.py --fail-on-mutable
          python3 scripts/check-gap-register.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-plan.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-schema-authority.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-trnm-server.py
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |path| YAML.safe_load(File.read(path), aliases: true); puts "yaml-ok=#{path}" }'
          git diff --check

      - name: Validate exact new evidence/readiness markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'trillionnium.actions-log-artifact.v2' scripts/emit-actions-log-artifact.py
          grep -q 'github-actions-timestamped-v1' scripts/emit-actions-log-artifact.py
          grep -q '/actions/jobs/{job_id}/logs' scripts/verify-actions-log-artifact.py
          grep -q 'verify-retained-logs' .github/workflows/outbox-final-attempt-reaper.yml
          grep -q 'actions: read' .github/workflows/outbox-final-attempt-reaper.yml
          ! grep -R -n -E '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+[^.]' .github/workflows
          grep -q 'pg_postmaster_start_time' scripts/ci-trnm-server-live.sh
          grep -q 'TRNM_POSTGRES_STABLE_PROBES' scripts/ci-trnm-server-live.sh
          grep -q 'stable_database_readiness=true' scripts/ci-trnm-server-live.sh
          grep -q 'database-readiness.env' .github/workflows/trnm-server-live.yml
          test ! -e .github/workflows/z-pr57-staging-validation.yml
