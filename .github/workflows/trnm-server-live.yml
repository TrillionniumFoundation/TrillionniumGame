name: trnm-server-live

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/schema_source_selection.py'
      - 'scripts/schema_evidence_binding.py'
      - 'scripts/capture-schema-source-selection.py'
      - 'contracts/database/source-execution-evidence.v1.json'
      - 'tests/control_plane/test_schema_source_selection.py'
      - 'tests/control_plane/test_schema_evidence_binding.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/trnm-contracts/**'
      - 'crates/trnm-server/**'
      - 'crates/trnm-persistence-pg/**'
      - 'migrations/**'
      - 'scripts/check-trnm-server.py'
      - 'scripts/materialize-pinned-storage-upstream.py'
      - 'scripts/ci-trnm-server-live.sh'
      - 'scripts/accounts-capture-diagnostic.py'
      - 'scripts/accounts-typed-diagnostic.py'
      - 'tests/control_plane/test_accounts_typed_diagnostic.py'
      - 'tests/control_plane/test_accounts_capture_diagnostic.py'
      - 'scripts/print-server-live-failure.py'
      - 'scripts/trnm-server-live-client.py'
      - 'scripts/wait-postgres-final-ready.py'
      - 'tests/control_plane/test_postgres_final_ready.py'
      - 'tests/control_plane/test_storage_list_live_contract.py'
      - 'docs/ARCHITECTURE.md'
      - 'docs/DEVELOPMENT.md'
      - 'docs/OPERATIONS_AND_RELEASE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'docs/status/TRNM_SERVER_STATUS.json'
      - 'scripts/upload-actions-artifact.py'
      - '.github/actions/upload-evidence/**'
      - '.github/workflows/trnm-server-live.yml'

permissions:
  contents: read

concurrency:
  group: trnm-server-live-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    name: trnm-server-source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate source and harness contracts
        run: |
          set -euo pipefail
          python3 scripts/check-trnm-server.py
          python3 -m py_compile \
            scripts/check-trnm-server.py \
            scripts/print-server-live-failure.py \
            scripts/trnm-server-live-client.py \
            scripts/wait-postgres-final-ready.py
          python3 -m unittest \
            tests.control_plane.test_postgres_final_ready \
            tests.control_plane.test_storage_list_live_contract \
            tests.control_plane.test_accounts_capture_diagnostic \
            tests.control_plane.test_accounts_typed_diagnostic -v
          bash -n scripts/ci-trnm-server-live.sh

  live-profile:
    name: trnm-server-live-${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [postgresql, cockroachdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Execute live process, wire, restart and database contract
        env:
          TRNM_EVIDENCE_ROOT: run/server-live
          TRNM_RUN_ID: ${{ github.run_id }}-${{ matrix.profile }}
          TRNM_ACCOUNTS_CAPTURE_DIAGNOSTIC: "1"
        run: bash scripts/ci-trnm-server-live.sh '${{ matrix.profile }}'
      - name: Verify disposable Accounts catalog packet and container removal
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          status=0
          python3 scripts/accounts-capture-diagnostic.py seal --profile "$PROFILE" \
            --output "run/accounts-capture/$PROFILE" || status=$?
          (cd "run/accounts-capture/$PROFILE" && sha256sum -c SHA256SUMS)
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "run/accounts-capture-$PROFILE.tar.gz" -C "run/accounts-capture/$PROFILE" .
          sha256sum "run/accounts-capture-$PROFILE.tar.gz"
          exit "$status"
      - name: Retain separate raw Accounts catalog diagnostic
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: accounts-capture-${{ matrix.profile }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/accounts-capture-${{ matrix.profile }}.tar.gz
          mime_type: application/gzip
      - name: Verify disposable Accounts internal typed packet and removal
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          status=0
          python3 scripts/accounts-typed-diagnostic.py seal --profile "$PROFILE" \
            --output "run/accounts-typed/$PROFILE" || status=$?
          (cd "run/accounts-typed/$PROFILE" && sha256sum -c SHA256SUMS)
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "run/accounts-typed-$PROFILE.tar.gz" -C "run/accounts-typed/$PROFILE" .
          sha256sum "run/accounts-typed-$PROFILE.tar.gz"
          exit "$status"
      - name: Retain separate Accounts internal typed diagnostic
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: accounts-typed-${{ matrix.profile }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/accounts-typed-${{ matrix.profile }}.tar.gz
          mime_type: application/gzip
      - name: Seal exact-head evidence packet
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          evidence="run/server-live/${PROFILE}"
          test -s "$evidence/SHA256SUMS"
          test -s "$evidence/summary.json"
          python3 scripts/check-trnm-server.py --live-packet "$evidence" \
            --profile "$PROFILE" --commit "$CANDIDATE_SHA" --tree "$(git rev-parse HEAD^{tree})"
          sha256sum --check "$evidence/SHA256SUMS"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('run/server-live') / os.environ['PROFILE']
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          assert summary['profile'] == os.environ['PROFILE']
          for field in (
              'check_config',
              'fresh_migration',
              'nakama_client_list_projection',
              'storage_occ_precedence',
              'raw_version_conditions',
              'storage_timestamps',
              'schema_upgrade',
              'storage_jsonb_v3_projection',
              'storage_native_jsonb', 'storage_v4_acl', 'storage_v4_import',
              'health_ready',
              'unauthenticated_mutation_rejected',
              'http_bootstrap_commit_duplicate_conflict',
              'websocket_json_commit',
              'response_loss_exact_receipt_replay',
              'authenticated_drain',
              'process_restart_exact_receipt_replay',
          ):
              assert summary[field] is True, (field, summary[field])
          assert type(summary['schema_v3_extra_cases']) is int and summary['schema_v3_extra_cases'] == 41
          assert summary['schema_v3_case_families'] == {
              'shapes': 8, 'illegal_legacy': 9, 'catalog_drift': 6,
              'partial_resume': 3, 'metadata_validation': 9, 'opaque_history': 6,
          }
          assert all(type(value) is int for value in summary['schema_v3_case_families'].values())
          for field in ('schema_version', 'storage_writer_epoch', 'authoritative_migrations_count'):
              assert type(summary[field]) is int and summary[field] == 4
          assert summary['entity_revision'] == 3
          assert summary['event_sequence'] == 3
          assert summary['command_receipts'] == 3
          assert summary['events'] == 3
          assert summary['outbox_intents'] == 3
          assert summary['production_pitr'] is False
          assert summary['multi_node'] is False
          assert summary['wire_compatible'] is False
          assert summary['production_ready'] is False
          PY
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "run/trnm-server-live-${PROFILE}.tar.gz" -C "$evidence" .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\nprofile=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$PROFILE"
          stat -c 'evidence_size_bytes=%s' "run/trnm-server-live-${PROFILE}.tar.gz"
          sha256sum "run/trnm-server-live-${PROFILE}.tar.gz"
          cat "$evidence/summary.json"
          cat "$evidence/database-assertions.txt"
          cat "$evidence/SHA256SUMS"
      - name: Retain exact-head live profile packet
        id: retained-live-profile
        uses: ./.github/actions/upload-evidence
        with:
          name: trnm-server-live-${{ matrix.profile }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/trnm-server-live-${{ matrix.profile }}.tar.gz
          mime_type: application/gzip
      - name: Verify retained live profile receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained-live-profile.outputs.artifact_id }}'
          test '${{ steps.retained-live-profile.outputs.sha256 }}' != ''
          test '${{ steps.retained-live-profile.outputs.size_bytes }}' -gt 0
          printf 'profile=%s artifact_id=%s sha256=%s size_bytes=%s\n' \
            '${{ matrix.profile }}' \
            '${{ steps.retained-live-profile.outputs.artifact_id }}' \
            '${{ steps.retained-live-profile.outputs.sha256 }}' \
            '${{ steps.retained-live-profile.outputs.size_bytes }}'

  trnm-server-live:
    name: trnm-server-live
    if: always()
    needs: [source-contract, live-profile]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject missing, skipped, cancelled or failed profiles
        env:
          SOURCE_CONTRACT: ${{ needs.source-contract.result }}
          LIVE_PROFILE: ${{ needs.live-profile.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_CONTRACT" = success
          test "$LIVE_PROFILE" = success
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
