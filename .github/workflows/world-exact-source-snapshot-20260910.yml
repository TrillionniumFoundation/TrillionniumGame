name: world-exact-source-snapshot-20260910

on:
  push:
    branches:
      - ops/world-exact-source-snapshot-20260910
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-exact-source-snapshot-20260910
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_SOURCE_SHA: '33339b28a6f53668672d1797109da6c7bf57db49'
  GAME_UPLOADER_SHA: '425ee015d53800f3e2c2936f97ded9cdbacf7f14'

jobs:
  snapshot:
    name: world-exact-source-snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact World source and pinned uploader
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          helper="$RUNNER_TEMP/game-helper"

          git init "$world"
          git -C "$world" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$world" fetch --no-tags --depth=1 origin "$WORLD_SOURCE_SHA"
          git -C "$world" checkout --detach FETCH_HEAD
          test "$(git -C "$world" rev-parse HEAD)" = "$WORLD_SOURCE_SHA"

          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GAME_UPLOADER_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GAME_UPLOADER_SHA"
          test -s "$helper/scripts/upload-actions-artifact.py"

      - name: Build deterministic exact-source archive
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          archive="$RUNNER_TEMP/Trillionnium-World-${WORLD_SOURCE_SHA}.tar.gz"
          identity="$RUNNER_TEMP/Trillionnium-World-${WORLD_SOURCE_SHA}.identity.txt"

          git -C "$world" archive \
            --format=tar \
            --prefix="Trillionnium-World-${WORLD_SOURCE_SHA}/" \
            "$WORLD_SOURCE_SHA" | gzip -n -9 > "$archive"
          test -s "$archive"
          {
            printf 'repository=%s\n' "$WORLD_REPOSITORY"
            printf 'source=%s\n' "$WORLD_SOURCE_SHA"
            printf 'tree=%s\n' "$(git -C "$world" rev-parse "${WORLD_SOURCE_SHA}^{tree}")"
            printf 'archive_sha256=%s\n' "$(sha256sum "$archive" | awk '{print $1}')"
            printf 'archive_bytes=%s\n' "$(stat -c %s "$archive")"
            printf 'production_authorization=not_granted\n'
          } > "$identity"
          cat "$identity"

      - name: Retain exact source archive
        id: source-artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/game-helper/scripts/upload-actions-artifact.py" \
            "world-exact-source-${WORLD_SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/Trillionnium-World-${WORLD_SOURCE_SHA}.tar.gz" \
            "$RUNNER_TEMP/Trillionnium-World-${WORLD_SOURCE_SHA}.identity.txt" \
            --mime-type application/gzip

      - name: Emit artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.source-artifact.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ steps.source-artifact.outputs.sha256 }}
          ARTIFACT_SIZE: ${{ steps.source-artifact.outputs.size_bytes }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_SHA256"
          test -n "$ARTIFACT_SIZE"
          printf 'WORLD_SOURCE_ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'WORLD_SOURCE_ARTIFACT_SHA256=%s\n' "$ARTIFACT_SHA256"
          printf 'WORLD_SOURCE_ARTIFACT_SIZE=%s\n' "$ARTIFACT_SIZE"
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
