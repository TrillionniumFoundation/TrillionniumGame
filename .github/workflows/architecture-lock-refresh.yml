name: architecture-lock-refresh-one-shot

on:
  push:
    branches:
      - codex/architecture-gap-closure-2026-09-08
    paths:
      - .github/workflows/architecture-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: architecture-lock-refresh-one-shot
  cancel-in-progress: false

jobs:
  refresh-locks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact branch head without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TrillionniumFoundation/TrillionniumGame'
          test "$GITHUB_REF_NAME" = 'codex/architecture-gap-closure-2026-09-08'
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Generate only the root and layered-server lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.1 generate-lockfile
          cargo +1.85.1 generate-lockfile --manifest-path crates/trnm-server/Cargo.toml
          git diff --exit-code -- . ':!Cargo.lock' ':!crates/trnm-server/Cargo.lock'
          git diff --check
          git status --short
          test -n "$(git status --short Cargo.lock crates/trnm-server/Cargo.lock)"
      - name: Commit generated lockfiles to this feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/trnm-server/Cargo.lock
          git commit -m 'chore(lock): regenerate provider composition locks'
          git push origin HEAD:refs/heads/codex/architecture-gap-closure-2026-09-08
