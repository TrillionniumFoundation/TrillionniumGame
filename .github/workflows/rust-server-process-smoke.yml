name: rust-server-process-smoke

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'crates/trnm-server/**'
      - 'scripts/check-rust-server-process.sh'
      - 'contracts/server/vertical-slice-v1.json'
      - 'docs/DEVELOPMENT.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - '.github/workflows/rust-server-process-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-server-process-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  bounded-process-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate current foundation process boundary
        run: |
          set -euo pipefail
          grep -q 'Standalone foundation source and process' docs/DEVELOPMENT.md
          grep -q 'temporary split is not the target architecture' docs/ARCHITECTURE.md
          python3 scripts/check-rust-server-source-candidate.py
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - name: Execute bounded process ingress and drain
        env:
          TRNM_SERVER_SMOKE_ROOT: run/server-process-smoke
        run: bash scripts/check-rust-server-process.sh
      - name: Record exact-head diagnostic digest (no artifact credit)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target='run/server-process-smoke'
          test -e "$target"
          manifest="$RUNNER_TEMP/diagnostic-SHA256SUMS"
          if [[ -d "$target" ]]; then
            mapfile -d '' files < <(find "$target" -type f -print0 | sort -z)
            test "${#files[@]}" -gt 0
            sha256sum "${files[@]}" | tee "$manifest"
          else
            sha256sum "$target" | tee "$manifest"
          fi
          printf '### Diagnostic evidence only\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'This job did not upload a persistent artifact and grants no compatibility or production credit.\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$manifest" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
