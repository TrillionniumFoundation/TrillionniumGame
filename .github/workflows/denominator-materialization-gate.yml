name: denominator-materialization-gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-denominator-materialization.py'
      - 'tests/control_plane/test_denominator_materialization.py'
      - 'docs/COMPATIBILITY.md'
      - 'docs/TESTING_AND_EVIDENCE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'manifests/upstream/candidates/**'
      - 'manifests/upstream/review-requests/**'
      - 'manifests/upstream/denominator-review-worklist.json'
      - 'manifests/upstream/denominator-review-packet.draft.json'
      - '.github/workflows/denominator-materialization-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check-denominator-materialization.py'
      - 'tests/control_plane/test_denominator_materialization.py'
      - 'docs/COMPATIBILITY.md'
      - 'docs/TESTING_AND_EVIDENCE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'manifests/upstream/candidates/**'
      - 'manifests/upstream/review-requests/**'
      - 'manifests/upstream/denominator-review-worklist.json'
      - 'manifests/upstream/denominator-review-packet.draft.json'
      - '.github/workflows/denominator-materialization-gate.yml'

permissions:
  contents: read

concurrency:
  group: denominator-materialization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  fail-closed-materialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate current review and evidence authority
        run: |
          set -euo pipefail
          grep -q 'Every mandatory leaf records' docs/COMPATIBILITY.md
          grep -q 'Automation, implementation authors, generated summaries and PR prose cannot provide independent acceptance' docs/TESTING_AND_EVIDENCE.md
      - name: Require complete committed review input
        run: |
          set -euo pipefail
          python3 scripts/check-denominator-materialization.py \
            --require-present --require-review-ready \
            | tee denominator-materialization-result.json
          jq -e '
            .source == "committed-review-worklist" and
            .materialized_denominator_count == 14 and
            .leaf_count_total > 0 and
            .proposal_classified_count == .leaf_count_total and
            .owner_bound_count == .leaf_count_total and
            .task_bound_count == .leaf_count_total and
            .test_bound_count == .leaf_count_total and
            .independent_review_completed == false and
            .claims.sg1_eligible == false and
            .claims.compatibility_credit == false and
            .claims.production_ready == false
          ' denominator-materialization-result.json >/dev/null
      - name: Run materialization regression tests
        run: python3 -m unittest tests.control_plane.test_denominator_materialization -v
      - name: Prove review-ready input still cannot grant SG1
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-denominator-materialization.py --require-review-ready >/dev/null
          if python3 scripts/check-denominator-review-bundle.py --require-sg1; then
            echo 'review-ready proposals incorrectly granted SG1' >&2
            exit 1
          fi
          echo 'review input is complete; independent acceptance and reviewed locks remain mandatory'
