name: codex-security-log-legacy-smoke-fix

on:
  push:
    branches:
      - ops/security-log-legacy-smoke-fix-2026-09-08

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'TrillionniumFoundation/TrillionniumGame'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_BRANCH: codex/branch-evidence-closure-2026-09-02
      TARGET_SHA: 9b9a06bc3923d5c834eed335965eaccf44dc7bb9
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Fetch helper and immutable target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" fetch --no-tags origin "$GITHUB_SHA" "$TARGET_SHA"
          git -C "$GITHUB_WORKSPACE" show "$GITHUB_SHA:scripts/codex-security-log-legacy-smoke-fix.py" > /tmp/codex-security-log-legacy-smoke-fix.py
          remote_head="$(git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$TARGET_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$TARGET_BRANCH" "$TARGET_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$TARGET_SHA"
          git -C "$GITHUB_WORKSPACE" config user.name "ProfHepta"
          git -C "$GITHUB_WORKSPACE" config user.email "102159240+ProfHepta@users.noreply.github.com"

      - name: Apply exact legacy and smoke repair
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/codex-security-log-legacy-smoke-fix.py
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "crates/trnm-persistence-pg/src/bin/trnm-server.rs"
          test "${changed[1]}" = "crates/trnm-persistence-pg/src/bin/trnm_server/server.rs"
          test "${changed[2]}" = "scripts/check-rust-server-process.sh"
          git diff --check
          test "$(git grep -F 'configuration: {config:?}' -- crates/trnm-server crates/trnm-persistence-pg || true)" = ""
          test "$(git grep -F 'migration profile=' -- crates/trnm-server crates/trnm-persistence-pg || true)" = ""
          test "$(git grep -F 'grpc_bind={:?}' -- crates/trnm-server crates/trnm-persistence-pg || true)" = ""

      - name: Validate control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-trnm-server.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests/control_plane -p 'test_*.py' -v

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate every Rust target and the real process smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          bash scripts/check-rust-server-process.sh

      - name: Publish one source-only fast-forward commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add crates/trnm-persistence-pg/src/bin/trnm-server.rs crates/trnm-persistence-pg/src/bin/trnm_server/server.rs scripts/check-rust-server-process.sh
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 3
          test "${staged[0]}" = "crates/trnm-persistence-pg/src/bin/trnm-server.rs"
          test "${staged[1]}" = "crates/trnm-persistence-pg/src/bin/trnm_server/server.rs"
          test "${staged[2]}" = "scripts/check-rust-server-process.sh"
          git commit -m "fix(security): align legacy operator output and smoke contract"
          new_head="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P "$new_head")" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" push origin "HEAD:refs/heads/$TARGET_BRANCH"
