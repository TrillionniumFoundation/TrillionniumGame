name: trillionnium-game-transport-error-core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/trnm-transport-core/**'
      - 'contracts/protocol/transport-error-*.json'
      - 'scripts/check-transport-core.py'
      - 'tests/protocol/test_transport_error_vectors.py'
      - 'docs/development/TRANSPORT_ERROR_CORE.md'
      - 'docs/status/TRANSPORT_ERROR_STATUS.json'
      - '.github/workflows/w2-transport-error-core.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-and-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/check-transport-core.py
      - run: python3 -m unittest discover -s tests/protocol -p 'test_transport_error_vectors.py' -v
      - run: python3 -m compileall -q scripts tests/protocol

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
