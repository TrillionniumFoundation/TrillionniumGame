name: jwt-provider-adapter-source

on:
  pull_request:
    paths:
      - 'crates/trnm-token-crypto-provider/**'
      - 'crates/trnm-token-jwt-adapter/**'
      - 'crates/trnm-token-jwt-provider-adapter/**'
      - 'contracts/security/jwt-crypto-provider-v1.json'
      - 'contracts/security/jwt-provider-adapter-v1.json'
      - 'docs/adr/ADR-0002-JWT-CRYPTO-PROVIDER.md'
      - 'docs/security/JWT_PROVIDER_ADAPTER_V1.md'
      - '.github/workflows/jwt-provider-adapter-source.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-token-crypto-provider/**'
      - 'crates/trnm-token-jwt-adapter/**'
      - 'crates/trnm-token-jwt-provider-adapter/**'
      - 'contracts/security/jwt-crypto-provider-v1.json'
      - 'contracts/security/jwt-provider-adapter-v1.json'
      - 'docs/adr/ADR-0002-JWT-CRYPTO-PROVIDER.md'
      - 'docs/security/JWT_PROVIDER_ADAPTER_V1.md'
      - '.github/workflows/jwt-provider-adapter-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jwt-provider-adapter-source-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  authenticate-before-claims:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate structured claim boundary
        run: |
          set -euo pipefail
          jq -e '
            .status == "source-candidate" and
            .claims.source_candidate == true and
            .claims.provider_authentication_boundary_exists == true and
            .claims.production_provider_exists == false and
            .claims.full_claim_compatibility_verified == false and
            .claims.security_review_accepted == false and
            .claims.production_ready == false
          ' contracts/security/jwt-provider-adapter-v1.json >/dev/null
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format
        run: cargo fmt --manifest-path crates/trnm-token-jwt-provider-adapter/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/trnm-token-jwt-provider-adapter/Cargo.toml --all-targets --locked
      - name: Strict lint
        run: cargo clippy --manifest-path crates/trnm-token-jwt-provider-adapter/Cargo.toml --all-targets --locked -- -D warnings
