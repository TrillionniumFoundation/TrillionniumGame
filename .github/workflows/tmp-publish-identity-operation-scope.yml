name: tmp-publish-identity-operation-scope

on:
  push:
    branches:
      - ops/identity-auth-replay-fix-20260910
    paths:
      - .github/workflows/tmp-publish-identity-operation-scope.yml

permissions:
  contents: write

concurrency:
  group: publish-identity-operation-scope-20260910
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_BRANCH: feature/plan-v32-identity-core-20260909
      EXPECTED_TARGET_HEAD: 4ef337a1a279252f9d81f8a9dbbb85d280ff03f9
      HELPER_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact helper and target objects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$HELPER_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$EXPECTED_TARGET_HEAD"
          git -C "$GITHUB_WORKSPACE" show \
            "$HELPER_SHA:scripts/tmp-identity-operation-scope-patch.py" \
            > "$RUNNER_TEMP/identity-operation-scope-patch.py"
          git -C "$GITHUB_WORKSPACE" show \
            "$HELPER_SHA:scripts/tmp-receipt-operation-scope.rs" \
            > "$RUNNER_TEMP/receipt_operation_scope.rs"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$EXPECTED_TARGET_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"

      - name: Apply exact operation-scope repair
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/identity-operation-scope-patch.py"
          mkdir -p crates/trnm-identity-core/tests
          cp "$RUNNER_TEMP/receipt_operation_scope.rs" \
            crates/trnm-identity-core/tests/receipt_operation_scope.rs
          cargo fmt --all
          git diff --check
          actual="$(git status --short --untracked-files=all | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            crates/trnm-identity-core/README.md \
            crates/trnm-identity-core/src/lib.rs \
            crates/trnm-identity-core/tests/receipt_operation_scope.rs | sort)"
          test "$actual" = "$expected"

      - name: Execute focused and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --all -- --check
          cargo test --package trnm-identity-core --all-targets --locked
          cargo clippy --package trnm-identity-core --all-targets --locked -- -D warnings
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-plan.py
          python3 -m unittest discover -s tests/control_plane -p 'test_*.py' -v
          git diff --check

      - name: Commit and fast-forward exact target branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_TARGET_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/trnm-identity-core/README.md \
            crates/trnm-identity-core/src/lib.rs \
            crates/trnm-identity-core/tests/receipt_operation_scope.rs
          git diff --cached --check
          git commit -m 'fix(identity): scope receipt replay to exact operation'
          new_head="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse HEAD^{tree})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'published_head=%s\npublished_tree=%s\n' "$new_head" "$new_tree" >> "$GITHUB_STEP_SUMMARY"
