name: world-pr127-qualified-blob-carrier-20260911

on:
  push:
    branches:
      - ops/world-pr127-qualified-blob-carrier-20260911

permissions:
  contents: write

concurrency:
  group: world-pr127-qualified-blob-carrier-20260911
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_SOURCE_SHA: '6581d8b3750c74379308308ddb2c7200d6cd3678'
  QUALIFICATION_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  QUALIFICATION_RUN_ID: '34548553107'
  EXPECTED_CANDIDATE_TREE: '122522de6ded37887864e53e597d85b38ef985cd'
  DRIVER_SHA: 'f99b359db09f64229a67048a7b7b279a529157ec'
  COMMON_HELPER_SHA: 'b02fef9a86b77c8babd19a7dd469081095ea2e90'
  STACK_HELPER_SHA: '3aa075564891e4f7abba57c682dafc9f6b06c7b2'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  materialize:
    if: ${{ github.event.head_commit.message != 'chore(world): materialize qualified candidate blobs [carrier]' }}
    name: world-pr127/qualified-blob-carrier
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Wait for exact qualification run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${QUALIFICATION_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}"
          for attempt in $(seq 1 180); do
            response="$RUNNER_TEMP/qualification-run.json"
            curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$endpoint" > "$response"
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$response")"
            conclusion="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("conclusion") or "")' "$response")"
            printf 'qualification_status=%s conclusion=%s attempt=%s\n' "$status" "$conclusion" "$attempt"
            if test "$status" = completed; then
              test "$conclusion" = success
              exit 0
            fi
            sleep 15
          done
          echo 'qualification run did not settle inside the bounded wait' >&2
          exit 1

      - name: Fetch exact World and transform sources
        shell: bash
        run: |
          set -euo pipefail
          clone_exact() {
            local directory="$1"
            local remote="$2"
            local revision="$3"
            git init -q "$directory"
            git -C "$directory" remote add origin "$remote"
            git -C "$directory" fetch -q --no-tags --depth=2 origin "$revision"
            git -C "$directory" checkout -q --detach FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          }
          clone_exact "$RUNNER_TEMP/world" \
            "https://github.com/${WORLD_REPOSITORY}.git" "$WORLD_SOURCE_SHA"
          clone_exact "$RUNNER_TEMP/common" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$COMMON_HELPER_SHA"
          clone_exact "$RUNNER_TEMP/stack" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$STACK_HELPER_SHA"
          clone_exact "$RUNNER_TEMP/driver" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$DRIVER_SHA"

          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal --component rustfmt
          rustup default "$RUSTUP_TOOLCHAIN"

          world="$RUNNER_TEMP/world"
          driver="$RUNNER_TEMP/driver/scripts"
          python3 "$driver/world-pr127-cumulative-modules-transform.py" \
            "$world" \
            --common-helper "$RUNNER_TEMP/common" \
            --stack-helper "$RUNNER_TEMP/stack" \
            --source-sha "$WORLD_SOURCE_SHA"
          python3 "$driver/world-pr127-campaign-runtime-driver.py" \
            "$world" \
            --stack-helper "$RUNNER_TEMP/stack" \
            --completed-commit "$WORLD_SOURCE_SHA"
          python3 "$driver/world-pr127-settlement-worker-modules-transform.py" \
            "$world" --completed-commit "$WORLD_SOURCE_SHA"
          cargo fmt --manifest-path "$world/trillionnium/Cargo.toml" --all

          python3 - "$world" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys

          root = Path(sys.argv[1])
          for manifest_path in (
              root / 'trillionnium/crates/trnm-campaign-core/src/lib_parts/manifest.json',
              root / 'trillionnium/crates/trnm-rts-sim/src/lib_parts/manifest.json',
              root / 'trillionnium/crates/trnm-game-server/src/lib_parts/manifest.json',
          ):
              value = json.loads(manifest_path.read_text(encoding='utf-8'))
              source_root = manifest_path.parent.parent
              for field in ('parts', 'nested_test_parts'):
                  for record in value.get(field, []):
                      payload = (source_root / record['path']).read_bytes()
                      record['bytes'] = len(payload)
                      record['sha256'] = hashlib.sha256(payload).hexdigest()
              manifest_path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY

          boundary="$(cd "$world" && python3 scripts/check-trnm-world-include-boundaries.py)"
          grep -F 'active_migration=0' <<<"$boundary"
          grep -F 'completed_migration=54' <<<"$boundary"
          grep -F 'frozen_legacy=11' <<<"$boundary"
          git -C "$world" config user.name 'World qualified blob carrier'
          git -C "$world" config user.email 'world-qualified-blob-carrier@invalid'
          git -C "$world" add -A
          GIT_AUTHOR_DATE='2026-09-11T00:00:00Z' \
          GIT_COMMITTER_DATE='2026-09-11T00:00:00Z' \
            git -C "$world" commit -q -m 'refactor(world): complete active Rust ownership modules'
          actual_tree="$(git -C "$world" rev-parse 'HEAD^{tree}')"
          printf 'candidate_tree=%s\n' "$actual_tree"
          test "$actual_tree" = "$EXPECTED_CANDIDATE_TREE"

      - name: Commit exact candidate bytes to carrier branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          carrier="$RUNNER_TEMP/carrier"
          git clone -q --branch "$GITHUB_REF_NAME" --single-branch \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$carrier"
          cd "$carrier"
          rm -rf world-candidate
          mkdir -p world-candidate
          git -C "$world" diff --name-only "$WORLD_SOURCE_SHA..HEAD" \
            | LC_ALL=C sort > world-candidate/changed-paths.txt
          test "$(wc -l < world-candidate/changed-paths.txt)" -eq 66
          tar -cf - -C "$world" -T world-candidate/changed-paths.txt \
            | tar -xf - -C world-candidate
          {
            printf 'world_source=%s\n' "$WORLD_SOURCE_SHA"
            printf 'candidate_commit=%s\n' "$(git -C "$world" rev-parse HEAD)"
            printf 'candidate_tree=%s\n' "$(git -C "$world" rev-parse 'HEAD^{tree}')"
            printf 'qualification_run_id=%s\n' "$QUALIFICATION_RUN_ID"
            printf 'qualification=success\n'
            printf 'production_authorization=not_granted\n'
          } > world-candidate/identity.txt
          find world-candidate -type f -print0 | sort -z | xargs -0 sha256sum \
            > world-candidate/SHA256SUMS
          git config user.name 'World qualified blob carrier'
          git config user.email 'world-qualified-blob-carrier@invalid'
          git add world-candidate
          git commit -m 'chore(world): materialize qualified candidate blobs [carrier]'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraHeader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:${GITHUB_REF_NAME}"
          printf 'WORLD_QUALIFIED_BLOB_CARRIER=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
