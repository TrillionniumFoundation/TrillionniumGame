name: codex-governance-packet-custody-r3

on:
  push:
    branches:
      - ops/governance-readback-packet-2026-09-08

permissions:
  contents: write

concurrency:
  group: codex-governance-packet-custody-r3
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'TrillionniumFoundation/TrillionniumGame' &&
      github.ref_name == 'ops/governance-readback-packet-2026-09-08' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_PARENT: 883c297ae350f88be04b9350e77aada3b2dd7d5d
      TARGET_BRANCH: ops/governance-readback-packet-2026-09-08
    steps:
      - name: Fetch exact temporary repair object
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin \
            "+${GITHUB_SHA}:refs/remotes/origin/repair"
          git -C "$GITHUB_WORKSPACE" checkout --detach refs/remotes/origin/repair
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          actual=$(git diff --name-only "$EXPECTED_PARENT" HEAD | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/codex-governance-packet-custody-r3.yml' \
            'scripts/codex-harden-governance-packet-final-seal.py' | sort)
          test "$actual" = "$expected"
          test -f scripts/codex-apply-governance-packet-custody-r3.py

      - name: Build clean source-only candidate commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/codex-apply-governance-packet-custody-r3.py
          python3 scripts/codex-harden-governance-packet-final-seal.py
          python3 -m py_compile \
            scripts/capture-repository-governance-readback.py \
            tests/control_plane/test_capture_repository_governance_readback.py
          python3 -m unittest -v \
            tests/control_plane/test_capture_repository_governance_readback.py
          rm -f \
            .github/workflows/codex-governance-packet-custody-r3.yml \
            scripts/codex-apply-governance-packet-custody-r3.py \
            scripts/codex-harden-governance-packet-final-seal.py
          git add -A
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/codex-governance-packet-custody-r3.yml' \
            'scripts/capture-repository-governance-readback.py' \
            'scripts/codex-apply-governance-packet-custody-r3.py' \
            'scripts/codex-harden-governance-packet-final-seal.py' \
            'tests/control_plane/test_capture_repository_governance_readback.py' | sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(governance): pin packet custody and trusted check identity'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/codex-governance-packet-custody-r3.yml
          test ! -e scripts/codex-apply-governance-packet-custody-r3.py
          test ! -e scripts/codex-harden-governance-packet-final-seal.py

      - name: Qualify the exact clean final tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -z "$(git status --porcelain)"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-workflow-action-policy.py
          git diff --exit-code

      - name: Publish the qualified source-only commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          actual=$(git diff --name-only "$GITHUB_SHA" HEAD | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/codex-governance-packet-custody-r3.yml' \
            'scripts/capture-repository-governance-readback.py' \
            'scripts/codex-apply-governance-packet-custody-r3.py' \
            'scripts/codex-harden-governance-packet-final-seal.py' \
            'tests/control_plane/test_capture_repository_governance_readback.py' | sort)
          test "$actual" = "$expected"
          basic=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${basic}" \
            push origin "HEAD:refs/heads/${TARGET_BRANCH}"
