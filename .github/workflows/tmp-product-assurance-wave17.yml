                "retirement_artifact_wrong_stage",
                false,
            ));
        }
'''
              record = record.replace(anchor, check + anchor, 1)
              text = text[:record_start] + record + text[record_end:]

          for_update_start = text.index('    fn for_update(')
          for_update_end = text.index('    fn replay(', for_update_start)
          for_update = text[for_update_start:for_update_end]
          if 'cutover_plan_retired' not in for_update:
              marker = '        if state.revision != expected_revision {'
              check = '''        if state.stage == CutoverStage::Retired {
            return Err(CutoverError::new(
                StableCutoverCode::FailedPrecondition,
                "cutover_plan_retired",
                false,
            ));
        }
'''
              for_update = for_update.replace(marker, check + marker, 1)
              text = text[:for_update_start] + for_update + text[for_update_end:]

          transition_start = text.index('fn validate_transition(')
          transition_end = text.index('fn writer_allowed(', transition_start)
          transition = text[transition_start:transition_end]
          retired_start = transition.index('(CutoverStage::NakamaReadOnly, CutoverStage::Retired)')
          retired_end = transition.index('            _ => false,', retired_start)
          retired = transition[retired_start:retired_end]
          if 'rehearsal(state, CutoverStage::NakamaReadOnly, CutoverStage::RustPrimary)' not in retired:
              marker = '                    clean_window(state, CutoverStage::NakamaReadOnly)\n'
              retired = retired.replace(
                  marker,
                  marker
                  + '                        && rehearsal(\n'
                  + '                            state,\n'
                  + '                            CutoverStage::NakamaReadOnly,\n'
                  + '                            CutoverStage::RustPrimary,\n'
                  + '                        )\n',
                  1,
              )
              transition = transition[:retired_start] + retired + transition[retired_end:]
              text = text[:transition_start] + transition + text[transition_end:]

          tests_start = text.index('#[cfg(test)]\nmod tests {')
          tests = text[tests_start:]
          tests = tests.replace('subject_digest: digest(3),', 'subject: subject(),')
          tests = tests.replace('wrong.subject_digest = digest(9);', 'wrong.subject = SubjectIdentity { tree: digest(9), ..subject() };')
          if 'fn premature_retirement_artifact_and_retired_mutation_are_rejected()' not in tests:
              anchor = tests.index('    #[test]\n    fn exact_command_replay_does_not_repeat_mutation()')
              test = '''    #[test]
    fn premature_retirement_artifact_and_retired_mutation_are_rejected() {
        let mut registry = registry();
        assert_eq!(
            registry
                .record_artifact(
                    command(30),
                    plan().id,
                    1,
                    artifact(30, EvidenceKind::Retirement),
                )
                .unwrap_err()
                .reason(),
            "retirement_artifact_wrong_stage"
        );
        let state = registry.plans.get_mut(&plan().id).unwrap();
        state.stage = CutoverStage::Retired;
        state.revision = 2;
        assert_eq!(
            registry
                .assign_cohort(
                    command(31),
                    plan().id,
                    2,
                    id(31, CohortId::new),
                    Writer::Rust,
                )
                .unwrap_err()
                .reason(),
            "cutover_plan_retired"
        );
    }

'''
              tests = tests[:anchor] + test + tests[anchor:]
          text = text[:tests_start] + tests
          path.write_text(text, encoding='utf-8')

          # Extend the repository-wide hardening contract.
          checker = Path('scripts/check-plan-v32-product-hardening.py')
          check = checker.read_text(encoding='utf-8')
          check = check.replace(
              '"dispatch_owners", "OutcomeAuthenticator", "provider_receipt_reused"',
              '"dispatch_owners", "OutcomeAuthenticator", "provider_receipt_reused", "terminal_operation_capacity_reserved", "provider_receipt_capacity_reserved"',
          )
          check = check.replace(
              '"oracle.applied_normalizers == candidate.applied_normalizers", "self.executed != self.collected"',
              '"oracle.applied_normalizers == candidate.applied_normalizers", "self.executed != self.collected", "instrumented_equivalent"',
          )
          check = check.replace(
              '"MAX_ASSERTIONS_PER_ATTEMPT as u64"',
              '"MAX_ASSERTIONS_PER_ATTEMPT as u64", "self.recovery_point_ms < packet.backup_started_at_ms"',
          )
          check = check.replace(
              '"self.p99_latency_us < self.p95_latency_us"',
              '"self.p99_latency_us < self.p95_latency_us", "basis_points_ceil", "basis_points_floor"',
          )
          check = check.replace(
              '"plan.subject.tree", "rollback_authority_shape",',
              '"self.subject != plan.subject", "rollback_authority_shape",',
          )
          check = check.replace(
              '"cutover_error_rate_invalid"',
              '"cutover_error_rate_invalid", "retirement_artifact_wrong_stage", "cutover_plan_retired", "basis_points_ceil"',
          )
          checker.write_text(check, encoding='utf-8')
          PY

      - name: Update assurance state without promoting claims
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/status/CURRENT_STATE.json')
          state = json.loads(path.read_text())
          state.setdefault('implementation', {})['product_assurance_v2_source_candidate'] = True
          for key in ('wire_compatible','behavior_compatible','data_migration_compatible','operationally_replaceable','supported_full_replacement','production_ready','public_online','nakama_retired'):
              state.setdefault('claims', {})[key] = False
          path.write_text(json.dumps(state, indent=2) + '\n')
          PY

      - name: Publish and fully qualify assurance v2
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo generate-lockfile
          cargo fmt --all
          python3 scripts/check-plan-v32-product-hardening.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$FEATURE_BRANCH"
          git add Cargo.toml Cargo.lock crates docs scripts tests
          git commit -m 'fix(assurance): enforce terminal capacity oracle and retirement invariants'
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse HEAD^{tree})"
          printf 'head_sha=%s\nhead_tree=%s\n' "$head_sha" "$head_tree" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          cat > "$RUNNER_TEMP/pr.md" <<EOF
          ## Scope

          Second-layer Plan v3.2 source assurance stacked on Wave 16.

          \`\`\`text
          base branch   ${BASE_BRANCH}
          base commit   ${{ steps.base.outputs.base_sha }}
          head branch   ${FEATURE_BRANCH}
          head commit   ${head_sha}
          head tree     ${head_tree}
          \`\`\`

          Adds KMS terminal/receipt reservation, immutable↔instrumented oracle equivalence, bounded PITR recovery point, conservative endurance/cutover error rates, full cutover subject identity, staged retirement evidence and terminal retired-state immutability.

          This is source assurance only. External provider/oracle/HA/endurance/governance/human evidence remains mandatory and false until independently produced.
          EOF
          gh pr create --repo "$REPOSITORY" --draft --base "$BASE_BRANCH" --head "$FEATURE_BRANCH" --title '[Plan v3.2][Wave 17] Enforce terminal, oracle and retirement invariants' --body-file "$RUNNER_TEMP/pr.md" --reviewer Tomasrgbsf --reviewer Franksudoman

          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in crates/trnm-token-jwt-adapter-gate/Cargo.toml crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml; do
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-workspace-convergence.py
          python3 scripts/check-plan.py
          python3 scripts/check-plan-v32-product-hardening.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code

      - name: Publish result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPOSITORY" --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          test -z "$pr" || gh pr comment "$pr" --repo "$REPOSITORY" --body "Wave 17 assurance carrier: \`${{ job.status }}\`, run \`${GITHUB_RUN_ID}\`, source \`${{ steps.publish.outputs.head_sha }}\`. No external or production claim is promoted."
          gh issue comment 129 --repo "$REPOSITORY" --body "Second-layer product assurance carrier finished with status \`${{ job.status }}\` in run \`${GITHUB_RUN_ID}\`. #129 remains open pending exact-head CI, independent review and real evidence."
