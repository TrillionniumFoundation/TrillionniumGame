name: tmp-product-assurance-wave17

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-product-assurance-wave17.yml

permissions:
  checks: read
  contents: write
  pull-requests: write
  issues: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  BASE_BRANCH: feature/plan-v32-product-hardening-20260909
  FEATURE_BRANCH: feature/plan-v32-product-assurance-v2-20260909
  GH_TOKEN: ${{ github.token }}

jobs:
  assure:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Wait for stable Wave 16 exact head
        id: base
        shell: bash
        run: |
          set -euo pipefail
          head=''
          stable=0
          for _ in $(seq 1 1080); do
            current="$(gh api "repos/${REPOSITORY}/branches/${BASE_BRANCH}" --jq '.commit.sha' 2>/dev/null || true)"
            if test -z "$current"; then sleep 20; continue; fi
            if test "$current" != "$head"; then head="$current"; stable=0; fi
            payload="$(gh api "repos/${REPOSITORY}/commits/${head}/check-runs?per_page=100" 2>/dev/null || echo '{"check_runs":[]}')"
            canonical="$(jq -c 'reduce .check_runs[] as $run ({}; if .[$run.name] == null or ((.[$run.name].started_at // "") < ($run.started_at // "")) then .[$run.name] = $run else . end) | [.[]]' <<<"$payload")"
            total="$(jq 'length' <<<"$canonical")"
            pending="$(jq '[.[]|select(.status!="completed")]|length' <<<"$canonical")"
            failed="$(jq '[.[]|select(.status=="completed" and (.conclusion!="success" and .conclusion!="neutral" and .conclusion!="skipped"))]|length' <<<"$canonical")"
            aggregate="$(jq '[.[]|select(.name=="trillionnium-game-merge-gate" and .status=="completed" and .conclusion=="success")]|length' <<<"$canonical")"
            if test "$total" -gt 0 && test "$pending" -eq 0 && test "$failed" -eq 0 && test "$aggregate" -gt 0; then stable=$((stable+1)); else stable=0; fi
            if test "$failed" -gt 0 && test "$pending" -eq 0; then
              gh issue comment 129 --repo "$REPOSITORY" --body "Wave 16 head \`${head}\` has terminal failures; Wave 17 was not created."
              exit 1
            fi
            if test "$stable" -ge 2; then printf 'base_sha=%s\n' "$head" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 20
          done
          echo 'Wave 16 never reached stable aggregate success.' >&2
          exit 1

      - name: Fetch exact assurance base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=4 origin '${{ steps.base.outputs.base_sha }}'
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = '${{ steps.base.outputs.base_sha }}'

      - name: Apply second-layer correctness repairs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(relative: str) -> tuple[Path, str]:
              path = Path(relative)
              if not path.is_file():
                  raise SystemExit(f'missing required source: {relative}')
              return path, path.read_text(encoding='utf-8')

          # KMS: every accepted operation reserves its possible terminal and receipt slot.
          path, text = read('crates/trnm-kms-provider-adapter/src/lib.rs')
          prepare_start = text.index('    pub fn prepare(')
          prepare_end = text.index('    pub fn dispatch(', prepare_start)
          prepare = text[prepare_start:prepare_end]
          if 'terminal_operation_capacity_reserved' not in prepare:
              anchor = '        if self.active_count >= self.limits.active_operations {'
              if anchor not in prepare:
                  raise SystemExit('KMS active-capacity anchor missing')
              reservation = '''        let terminal_reservations = self
            .terminal_count
            .checked_add(self.active_count)
            .ok_or_else(|| KmsError::new(
                StableKmsCode::Internal,
                "terminal_reservation_overflow",
                false,
            ))?;
        if terminal_reservations >= self.limits.terminal_operations {
            return Err(KmsError::new(
                StableKmsCode::ResourceExhausted,
                "terminal_operation_capacity_reserved",
                false,
            ));
        }
        let receipt_reservations = self
            .receipt_owners
            .len()
            .checked_add(self.active_count)
            .ok_or_else(|| KmsError::new(
                StableKmsCode::Internal,
                "receipt_reservation_overflow",
                false,
            ))?;
        if receipt_reservations >= self.limits.provider_receipts {
            return Err(KmsError::new(
                StableKmsCode::ResourceExhausted,
                "provider_receipt_capacity_reserved",
                false,
            ));
        }
