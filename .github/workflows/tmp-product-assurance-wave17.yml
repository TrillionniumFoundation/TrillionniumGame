          mandatory = '''    fn instrumented_equivalent(&self, case: CaseId, consumer: ConsumerId) -> bool {
        let mut completed = 0_u8;
        let mut digest = None;
        for attempt in 1..=REQUIRED_REPEAT_RUNS {
            let immutable = self.observations.get(&(
                case,
                consumer,
                SubjectSide::ImmutableOracle,
                attempt,
            ));
            let instrumented = self.observations.get(&(
                case,
                consumer,
                SubjectSide::InstrumentedOracle,
                attempt,
            ));
            let (Some(immutable), Some(instrumented)) = (immutable, instrumented) else {
                continue;
            };
            let equal = immutable.normalized_wire_digest == instrumented.normalized_wire_digest
                && immutable.durable_state_digest == instrumented.durable_state_digest
                && immutable.effect_digest == instrumented.effect_digest
                && immutable.public_error_digest == instrumented.public_error_digest
                && immutable.applied_normalizers == instrumented.applied_normalizers;
            if !equal
                || digest.is_some_and(|value| {
                    value != instrumented.normalized_wire_digest
                })
            {
                return false;
            }
            digest = Some(instrumented.normalized_wire_digest);
            completed += 1;
        }
        completed == REQUIRED_REPEAT_RUNS
    }

    pub fn mandatory_coverage_complete(&self, profile: &Profile) -> bool {
        let mandatory = self
            .leaves
            .values()
            .filter(|leaf| leaf.mandatory && &leaf.profile == profile)
            .collect::<Vec<_>>();
        !mandatory.is_empty()
            && mandatory.iter().all(|leaf| {
                leaf.implementation_digest.is_some()
                    && self.cases.get(&leaf.test_case).is_some_and(|case| {
                        case.instrumented_oracle.is_some()
                            && case.required_consumers.iter().all(|consumer| {
                                self.case_result(case.id, *consumer).is_ok_and(|result| {
                                    result.status == CaseStatus::ReproducibleEquivalent
                                }) && self.instrumented_equivalent(case.id, *consumer)
                            })
                    })
            })
    }
