    #[test]
    fn contractual_fields_cannot_be_normalized() {
        for class in [
            ContractClass::Identity,
            ContractClass::Authorization,
            ContractClass::Money,
            ContractClass::RevisionGenerationSequence,
            ContractClass::Version,
            ContractClass::Cursor,
            ContractClass::PublicError,
            ContractClass::DurableEffect,
            ContractClass::Payload,
        ] {
            let rule = NormalizerRule {
                id: id(1, NormalizerId::new),
                field_path: "$.field".to_owned(),
                class,
                implementation_digest: digest(1),
            };
            assert_eq!(
                rule.validate().unwrap_err().reason(),
                "contractual_field_normalization_forbidden"
            );
        }
    }

    #[test]
    fn partial_assertion_collection_is_rejected() {
        let (mut registry, _, _, case, consumer) = registry();
        let mut partial = observation(
            1,
            case,
            consumer,
            SubjectSide::Candidate,
            1,
            1,
        );
        partial.assertions = AssertionCounts {
            collected: 2,
            executed: 1,
            passed: 1,
            failed: 0,
            skipped: 0,
        };
        assert_eq!(
            registry.record_observation(partial).unwrap_err().reason(),
            "assertion_counts_not_fully_passing"
        );
    }

    #[test]
    fn ten_exact_triplets_are_required_for_complete_coverage() {
        let (mut registry, profile, _, case, consumer) = registry();
        for attempt in 1..REQUIRED_REPEAT_RUNS {
            record_triplet(&mut registry, case, consumer, attempt, 80);
        }
        assert!(!registry.mandatory_coverage_complete(&profile));
        record_triplet(
            &mut registry,
            case,
            consumer,
            REQUIRED_REPEAT_RUNS,
            80,
        );
        assert_eq!(
            registry.case_result(case, consumer).unwrap().status,
            CaseStatus::ReproducibleEquivalent
        );
        assert!(registry.mandatory_coverage_complete(&profile));
    }

    #[test]
    fn instrumented_oracle_difference_blocks_profile_coverage() {
        let (mut registry, profile, _, case, consumer) = registry();
        for attempt in 1..=REQUIRED_REPEAT_RUNS {
            registry
                .record_observation(observation(
                    attempt,
                    case,
                    consumer,
                    SubjectSide::ImmutableOracle,
                    attempt,
                    80,
                ))
                .unwrap();
            registry
                .record_observation(observation(
                    attempt + 20,
                    case,
                    consumer,
                    SubjectSide::InstrumentedOracle,
                    attempt,
                    if attempt == 5 { 81 } else { 80 },
                ))
                .unwrap();
            registry
                .record_observation(observation(
                    attempt + 40,
                    case,
                    consumer,
                    SubjectSide::Candidate,
                    attempt,
                    80,
                ))
                .unwrap();
        }
        assert_eq!(
            registry.case_result(case, consumer).unwrap().status,
            CaseStatus::ReproducibleEquivalent
        );
        assert!(!registry.mandatory_coverage_complete(&profile));
    }

    #[test]
    fn durable_or_effect_difference_blocks_candidate_equivalence() {
        let (mut registry, _, _, case, consumer) = registry();
        let immutable = observation(
            1,
            case,
            consumer,
            SubjectSide::ImmutableOracle,
            1,
            80,
        );
        let instrumented = observation(
            21,
            case,
            consumer,
            SubjectSide::InstrumentedOracle,
            1,
            80,
        );
        let mut candidate = observation(
            41,
            case,
            consumer,
            SubjectSide::Candidate,
            1,
            80,
        );
        candidate.effect_digest = digest(99);
        registry.record_observation(immutable).unwrap();
        registry.record_observation(instrumented).unwrap();
        registry.record_observation(candidate).unwrap();
        assert_eq!(
            registry.case_result(case, consumer).unwrap().status,
            CaseStatus::Diverged
        );
    }

    #[test]
    fn repeated_normalized_hash_drift_is_divergence() {
        let (mut registry, _, _, case, consumer) = registry();
        record_triplet(&mut registry, case, consumer, 1, 80);
        record_triplet(&mut registry, case, consumer, 2, 81);
        assert_eq!(
            registry.case_result(case, consumer).unwrap().status,
            CaseStatus::Diverged
        );
    }

