                case,
                consumer,
                SubjectSide::InstrumentedOracle,
                1,
                80,
            ))
            .unwrap();
        registry
            .record_observation(observation(
                42,
                case,
                consumer,
                SubjectSide::Candidate,
                1,
                80,
            ))
            .unwrap();
        assert_eq!(
            registry.case_result(case, consumer).unwrap().status,
            CaseStatus::Diverged
        );
    }
}
