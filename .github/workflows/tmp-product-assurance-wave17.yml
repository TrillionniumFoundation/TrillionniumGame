    fn observation(
        byte: u8,
        case: CaseId,
        consumer: ConsumerId,
        side: SubjectSide,
        attempt: u8,
        normalized: u8,
    ) -> Observation {
        let subject = match side {
            SubjectSide::ImmutableOracle => source(50),
            SubjectSide::InstrumentedOracle => source(55),
            SubjectSide::Candidate => source(60),
        };
        Observation {
            id: id(byte, ObservationId::new),
            case,
            consumer,
            side,
            attempt,
            subject,
            raw_wire_digest: digest(byte),
            normalized_wire_digest: digest(normalized),
            durable_state_digest: digest(70),
            effect_digest: digest(71),
            public_error_digest: digest(72),
            applied_normalizers: BTreeSet::new(),
            assertions: counts(),
