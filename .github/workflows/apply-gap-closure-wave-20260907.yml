name: apply-gap-closure-wave-20260907

on:
  push:
    branches:
      - tooling/outbox-evidence-sealing-assets-2026-09-07a
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-gap-closure-wave-20260907
  cancel-in-progress: false

env:
  BASE_SHA: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
  TARGET_BRANCH: tooling/outbox-evidence-sealing-assets-2026-09-07a

jobs:
  materialize-validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch current review surface without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "$GITHUB_SHA" "$BASE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Materialize conservative classification and reviewer blockers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply-gap-closure-wave-20260907.py "$GITHUB_WORKSPACE"
          jq -e '
            .family_count == 14 and
            .leaf_count == 10173 and
            .unclassified_count == 0 and
            .accepted == false and
            .gap_closed == false and
            .sg1_credit == false and
            .production_ready == false
          ' docs/status/DENOMINATOR_CLASSIFICATION_CANDIDATE.json >/dev/null
          jq -e '
            .eligible_reviewer_count == 1 and
            .policy_minimum_eligible_reviewers == 2 and
            .capacity_satisfied == false and
            (.domains | length) == 6 and
            all(.domains[]; .status == "blocked-reviewer-capacity" and .accepted == false)
          ' docs/status/REVIEWER_CAPACITY.json >/dev/null

      - name: Run complete Python and control-plane validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          python3 scripts/check-status-transitions.py
          python3 scripts/derive-gates.py
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py

      - name: Publish one fast-forward review commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The workflow is a temporary executor, not product source.
          rm -f .github/workflows/apply-gap-closure-wave-20260907.yml
          rm -f tools/apply-gap-closure-wave-20260907.py
          rm -f \
            tooling/outbox-evidence-sealing/RELEASE_TRANSFER.md \
            tooling/outbox-evidence-sealing/TRANSFER_ATTEMPT.md \
            tooling/outbox-evidence-sealing/TRANSFER_DEBUG.md
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          tree=$(git write-tree)
          commit=$(printf '%s\n' \
            'control-plane: materialize conservative scope and reviewer blockers' \
            | git commit-tree "$tree" -p "$GITHUB_SHA")
          git push origin "$commit:refs/heads/$TARGET_BRANCH"
          printf 'published_commit=%s\n' "$commit"
