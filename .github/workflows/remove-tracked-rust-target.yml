name: remove-tracked-rust-target

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29
    paths:
      - '.github/workflows/remove-tracked-rust-target.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remove-tracked-rust-target-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: feat/plan-v3-gap-closure-2026-08-29
      EXPECTED_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact feature head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          cd "$GITHUB_WORKSPACE"
      - name: Remove tracked Cargo build outputs and harden ignore policy
        shell: bash
        run: |
          set -euo pipefail
          test -d crates/trnm-server/target
          git rm -r crates/trnm-server/target
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.gitignore')
          lines = path.read_text(encoding='utf-8').splitlines()
          if '**/target/' not in lines:
              lines.insert(1, '**/target/')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          test -z "$(git ls-files '*/target/*' '**/target/*')"
          git diff --check
      - name: Commit cleanup without modifying workflow definitions
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat -- .gitignore crates/trnm-server/target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore crates/trnm-server/target
          git commit -m 'chore(rust): remove tracked build outputs'
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${BRANCH}"
