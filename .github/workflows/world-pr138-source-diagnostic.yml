name: World PR138 exact-source diagnostic

on:
  push:
    branches: [ops/world-pr138-source-diagnostic-20260912]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pr138-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  WORLD_HEAD: 544cbc94b409de77722c9d354aec91c19c0d6f58
  WORLD_TREE: 56c88f3b3e33e46d5f3300fc46fbdcfbb23bad10
  COMMON_HELPER_SHA: b02fef9a86b77c8babd19a7dd469081095ea2e90
  RUSTUP_TOOLCHAIN: 1.98.1
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'
  PRODUCTION_AUTHORIZATION: not_granted

jobs:
  world-diagnostic:
    name: world-pr138-source-diagnostic-not-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Materialize and retain the exact unmodified World source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/TrillionniumGame
          mkdir -p inputs evidence .github/actions scripts
          git init -q "$RUNNER_TEMP/common"
          git -C "$RUNNER_TEMP/common" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$RUNNER_TEMP/common" fetch -q --no-tags --depth=1 origin "$COMMON_HELPER_SHA"
          git -C "$RUNNER_TEMP/common" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/common" rev-parse HEAD)" = "$COMMON_HELPER_SHA"
          cp -R "$RUNNER_TEMP/common/.github/actions/upload-evidence" .github/actions/
          cp "$RUNNER_TEMP/common/scripts/upload-actions-artifact.py" scripts/
          git clone --quiet --no-checkout --single-branch \
            --branch fix/world-priority-execution-20260912 \
            https://github.com/TrillionniumFoundation/Trillionnium-World.git "$RUNNER_TEMP/world"
          git -C "$RUNNER_TEMP/world" checkout --quiet --detach "$WORLD_HEAD"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse HEAD)" = "$WORLD_HEAD"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"
          test -z "$(git -C "$RUNNER_TEMP/world" status --porcelain=v1 --untracked-files=no)"
          git -C "$RUNNER_TEMP/world" bundle create "$GITHUB_WORKSPACE/inputs/world-source.bundle" HEAD
          git -C "$RUNNER_TEMP/world" bundle verify "$GITHUB_WORKSPACE/inputs/world-source.bundle"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          item = {key: os.environ[key] for key in ('WORLD_HEAD','WORLD_TREE','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT')}
          item.update(schema='world_source_diagnostic_v1', target_repository='TrillionniumFoundation/Trillionnium-World',
                      source_modified=False, repository_native_admission=False,
                      independent_acceptance=False, production_authorization='not_granted')
          Path('inputs/identity.json').write_text(json.dumps(item, indent=2)+'\n')
          PY
          sha256sum inputs/world-source.bundle inputs/identity.json > inputs/SHA256SUMS
          tar -czf source-inputs.tar.gz inputs
          test "$(stat -c %s source-inputs.tar.gz)" -le 67108864

      - name: Retain source input independently of later test outcomes
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-input-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: source-inputs.tar.gz
          mime_type: application/gzip

      - name: Install exact diagnostic toolchain
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml postgresql-client
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          test "$(rustc --version | awk '{print $2}')" = "$RUSTUP_TOOLCHAIN"
          test "$(psql -Atqc 'show server_version_num')" = 160004
          rustc --version --verbose > evidence/rustc.txt
          cargo --version --verbose > evidence/cargo.txt
          psql -Atqc 'select version()' > evidence/postgres.txt

      - name: Execute full-checkout Python and settlement source regressions
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          python3 scripts/run-trnm-world-recorded-command.py \
            --log "$GITHUB_WORKSPACE/evidence/source.log" \
            --metadata "$GITHUB_WORKSPACE/evidence/source.json" \
            --require-source-binding --expected-commit "$WORLD_HEAD" --expected-tree "$WORLD_TREE" \
            --timeout-seconds 1800 -- bash -euo pipefail -c '
              python3 -B -m unittest discover -s scripts -p "test_trnm_world_priority_*.py" -v
              bash scripts/test-trnm-settlement-transaction-boundary-negative.sh
              python3 scripts/check-trnm-settlement-transaction-boundary.py full
              bash scripts/run-trnm-world-v6-qualification-v2.sh truth
            '

      - name: Check World authority Rust formatting without changing source
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          python3 scripts/run-trnm-world-recorded-command.py --require-source-binding \
            --expected-commit "$WORLD_HEAD" --expected-tree "$WORLD_TREE" \
            --log "$GITHUB_WORKSPACE/evidence/rust-format.log" --metadata "$GITHUB_WORKSPACE/evidence/rust-format.json" \
            --timeout-seconds 300 -- cargo fmt --manifest-path trillionnium/crates/world-authority/Cargo.toml --all -- --check

      - name: Run all World authority crate targets
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          python3 scripts/run-trnm-world-recorded-command.py --require-source-binding \
            --expected-commit "$WORLD_HEAD" --expected-tree "$WORLD_TREE" \
            --log "$GITHUB_WORKSPACE/evidence/rust-test.log" --metadata "$GITHUB_WORKSPACE/evidence/rust-test.json" \
            --timeout-seconds 1200 -- cargo test --manifest-path trillionnium/crates/world-authority/Cargo.toml --workspace --all-targets --locked

      - name: Check strict World authority Clippy
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          python3 scripts/run-trnm-world-recorded-command.py --require-source-binding \
            --expected-commit "$WORLD_HEAD" --expected-tree "$WORLD_TREE" \
            --log "$GITHUB_WORKSPACE/evidence/clippy.log" --metadata "$GITHUB_WORKSPACE/evidence/clippy.json" \
            --timeout-seconds 1200 -- cargo clippy --manifest-path trillionnium/crates/world-authority/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Execute real disposable PostgreSQL cutover contracts
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          python3 scripts/run-trnm-world-recorded-command.py --require-source-binding \
            --expected-commit "$WORLD_HEAD" --expected-tree "$WORLD_TREE" \
            --log "$GITHUB_WORKSPACE/evidence/postgres.log" --metadata "$GITHUB_WORKSPACE/evidence/postgres.json" \
            --timeout-seconds 600 -- bash scripts/run-trnm-world-authority-postgres-check.sh

      - name: Retain portable public Rust diagnostic inputs
        id: sdk
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk/toolchain" sdk-inputs
          toolchain="$(dirname "$(dirname "$(rustup which --toolchain "$RUSTUP_TOOLCHAIN" rustc)")")"
          cp -a "$toolchain/bin" "$toolchain/lib" "$RUNNER_TEMP/sdk/toolchain/"
          for file in COPYRIGHT LICENSE-APACHE LICENSE-MIT; do
            test ! -f "$toolchain/$file" || cp "$toolchain/$file" "$RUNNER_TEMP/sdk/toolchain/"
          done
          tar -czf sdk-inputs/toolchain.tar.gz -C "$RUNNER_TEMP/sdk" toolchain
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          directories=()
          for name in registry/cache registry/src registry/index; do
            test ! -d "$cargo_home/$name" || directories+=("$name")
          done
          if test "${#directories[@]}" -gt 0; then
            tar -czf sdk-inputs/public-crate-cache.tar.gz -C "$cargo_home" "${directories[@]}"
          fi
          cp evidence/rustc.txt evidence/cargo.txt sdk-inputs/
          sha256sum sdk-inputs/* > sdk-inputs/SHA256SUMS
          tar -cf "$RUNNER_TEMP/sdk-inputs.tar" sdk-inputs
          test "$(stat -c %s "$RUNNER_TEMP/sdk-inputs.tar")" -le 805306368
          split -b 48M -d -a 2 "$RUNNER_TEMP/sdk-inputs.tar" sdk-inputs/sdk.part-
          python3 - <<'PYSDK'
          import hashlib, json, os
          from pathlib import Path
          parts = sorted(Path('sdk-inputs').glob('sdk.part-*'))
          assert 1 <= len(parts) <= 16
          records = []
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for index, path in enumerate(parts):
                  data = path.read_bytes()
                  assert 0 < len(data) <= 48 * 1024 * 1024
                  records.append(dict(name=path.name, size_bytes=len(data), sha256=hashlib.sha256(data).hexdigest()))
                  output.write(f'part_{index:02}=true\n')
          Path('evidence/sdk-parts.json').write_text(json.dumps(records, indent=2)+'\n')
          PYSDK

      - name: Retain bounded public tool input part 00
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_00 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-00-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-00
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 01
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_01 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-01-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-01
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 02
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_02 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-02-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-02
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 03
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_03 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-03-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-03
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 04
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_04 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-04-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-04
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 05
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_05 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-05-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-05
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 06
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_06 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-06-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-06
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 07
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_07 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-07-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-07
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 08
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_08 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-08-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-08
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 09
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_09 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-09-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-09
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 10
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_10 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-10-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-10
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 11
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_11 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-11-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-11
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 12
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_12 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-12-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-12
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 13
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_13 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-13-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-13
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 14
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_14 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-14-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-14
          mime_type: application/octet-stream

      - name: Retain bounded public tool input part 15
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' && steps.sdk.outputs.part_15 == 'true' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-sdk-15-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: sdk-inputs/sdk.part-15
          mime_type: application/octet-stream

      - name: Seal available diagnostic records on every outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf 'production_authorization=not_granted\nrepository_native_admission=false\nindependent_acceptance=false\n' > evidence/limitations.txt
          find evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > evidence/SHA256SUMS
          tar -czf diagnostics.tar.gz evidence
          test "$(stat -c %s diagnostics.tar.gz)" -le 67108864

      - name: Upload success and failure diagnostics
        if: ${{ always() && steps.source.outcome == 'success' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-pr138-diagnostics-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: diagnostics.tar.gz
          mime_type: application/gzip
