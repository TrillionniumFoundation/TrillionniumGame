name: world-p0-diagnostic-58f76a-20260910

on:
  push:
    branches:
      - ops/world-p0-diagnostic-58f76a-20260910

permissions:
  contents: read

concurrency:
  group: world-p0-diagnostic-58f76a-20260910
  cancel-in-progress: false

jobs:
  p0_diagnostic:
    name: world-p0/exact-source-diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
      WORLD_COMMIT: 58f76a6100bade6e148a56bd429eff34f8a255cd
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Fetch exact World source and diagnostic helper
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          helper="$RUNNER_TEMP/helper"
          rm -rf "$world" "$helper"
          git init "$world"
          git -C "$world" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$world" fetch --no-tags --depth=1 origin "$WORLD_COMMIT"
          git -C "$world" checkout --detach FETCH_HEAD
          test "$(git -C "$world" rev-parse HEAD)" = "$WORLD_COMMIT"
          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$helper/scripts/instrument-world-p0.py"
          test -z "$(git -C "$world" status --porcelain=v1 --untracked-files=no)"

      - name: Instrument exact test in the temporary clone
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/helper/scripts/instrument-world-p0.py" \
            "$RUNNER_TEMP/world/trillionnium/crates/trnm-game-server/tests/p0_boundary_contract.rs"
          git -C "$RUNNER_TEMP/world" diff --check

      - name: Execute only the captured-receipt boundary test
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          cd "$RUNNER_TEMP/world"
          cargo test \
            --manifest-path trillionnium/Cargo.toml \
            -p trnm-game-server \
            --test p0_boundary_contract \
            settlement_external_io_is_not_owned_by_a_database_transaction_function \
            --locked -- --exact --nocapture
