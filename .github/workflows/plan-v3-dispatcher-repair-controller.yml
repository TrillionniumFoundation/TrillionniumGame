name: plan-v3-dispatcher-repair-controller

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: plan-v3-dispatcher-repair-controller
  cancel-in-progress: true

jobs:
  repair-dispatcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Wait for runtime finalizer
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          if find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -print -quit | grep -q .; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for path in \
            crates/trnm-persistence-pg/src/outbox.rs \
            crates/trnm-persistence-pg/src/cancel.rs \
            crates/trnm-persistence-pg/src/pool.rs \
            crates/trnm-persistence-pg/src/bin/trnm_server/pool.rs \
            crates/trnm-persistence-pg/tests/outbox_runtime.rs \
            .github/workflows/pg-outbox-fault.yml; do
            test -f "$path"
          done
          if [ ! -f crates/trnm-persistence-pg/src/dispatcher.rs ]; then
            test -f .github/tmp/dispatcher-closure/dispatcher-v2.rs
          fi
          if [ ! -f crates/trnm-persistence-pg/tests/dispatcher_runtime.rs ]; then
            test -f .github/tmp/dispatcher-closure/dispatcher-runtime.rs
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          text = '\n'.join(
              path.read_text(encoding='utf-8', errors='replace')
              for path in Path('.github/workflows').glob('*.yml')
              if not path.name.startswith('plan-v3-dispatcher-')
          )
          postgres = re.findall(r"postgres(?::[^@\s\"']+)?@sha256:[0-9a-f]{64}", text)
          cockroach = re.findall(r"cockroachdb/cockroach(?::[^@\s\"']+)?@sha256:[0-9a-f]{64}", text)
          if not postgres or not cockroach:
              raise SystemExit('immutable database images missing')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'POSTGRES_IMAGE={postgres[0]}\n')
              handle.write(f'COCKROACH_IMAGE={cockroach[0]}\n')
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Repair and normalize dispatcher source
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import shutil
          from pathlib import Path

          root = Path('.')
          staged = root / '.github/tmp/dispatcher-closure'
          dispatcher = root / 'crates/trnm-persistence-pg/src/dispatcher.rs'
          runtime = root / 'crates/trnm-persistence-pg/tests/dispatcher_runtime.rs'
          if not dispatcher.is_file():
              shutil.copyfile(staged / 'dispatcher-v2.rs', dispatcher)
          if not runtime.is_file():
              shutil.copyfile(staged / 'dispatcher-runtime.rs', runtime)

          source = dispatcher.read_text(encoding='utf-8')
          if 'values: Vec<u64>,' in source:
              source = source.replace(
                  'mod tests {\n    use super::*;\n',
                  'mod tests {\n    use std::collections::VecDeque;\n\n    use super::*;\n',
                  1,
              )
              source = source.replace('values: Vec<u64>,', 'values: VecDeque<u64>,', 1)
              old = '''            Ok(self.values.remove(0))
          '''
              new = '''            self.values.pop_front().ok_or_else(|| {
                      DomainError::new(
                          StableCode::Internal,
                          "fake_clock_exhausted",
                          RetryClass::Never,
                      )
                  })
          '''
              if old not in source:
                  raise SystemExit('fake clock remove-first anchor drifted')
              source = source.replace(old, new, 1)
              source = source.replace(
                  'FakeClock { values: vec![1, 2] }',
                  'FakeClock {\n                values: VecDeque::from([1, 2]),\n            }',
              )
          dispatcher.write_text(source, encoding='utf-8')

          lib = root / 'crates/trnm-persistence-pg/src/lib.rs'
          source = lib.read_text(encoding='utf-8')
          header = '#![forbid(unsafe_code)]\n\n'
          if not source.startswith(header):
              raise SystemExit('persistence-pg crate header drifted')
          body = source[len(header):]
          lines = body.splitlines(keepends=True)
          normalized: list[str] = []
          skip_export = False
          for line in lines:
              stripped = line.strip()
              if stripped in {'mod cancel;', 'mod dispatcher;', 'mod outbox;', 'mod pool;'}:
                  continue
              if not skip_export and any(
                  stripped.startswith(f'pub use {name}::')
                  for name in ('cancel', 'dispatcher', 'outbox', 'pool')
              ):
                  skip_export = ';' not in stripped
                  continue
              if skip_export:
                  if ';' in stripped:
                      skip_export = False
                  continue
              normalized.append(line)
          body = ''.join(normalized).lstrip('\n')
          prefix = (
              'mod cancel;\nmod dispatcher;\nmod outbox;\nmod pool;\n\n'
              'pub use cancel::{cancellation_watchdog_panicked, PgCancelHandle};\n'
              'pub use dispatcher::{\n'
              '    DeliveryFailure, DeliveryFailureClass, DispatchClock, DispatchConfig,\n'
              '    DispatchReport, OutboxDispatcher, OutboxRepository, OutboxSink,\n'
              '    SystemDispatchClock,\n'
              '};\n'
              'pub use outbox::{\n'
              '    OutboxLease, OutboxRecord, OutboxRetryOutcome, OutboxState,\n'
              '};\n'
              'pub use pool::{PgPool, PgPoolConfig, PgPoolSnapshot, PgTlsConfig};\n\n'
          )
          lib.write_text(header + prefix + body, encoding='utf-8')

          workflow = root / '.github/workflows/pg-outbox-fault.yml'
          text = workflow.read_text(encoding='utf-8')
          outbox_command = (
              'cargo test --package trnm-persistence-pg --test outbox_runtime '
              '--locked -- --nocapture'
          )
          dispatcher_command = (
              'cargo test --package trnm-persistence-pg --test dispatcher_runtime '
              '--locked -- --nocapture'
          )
          if dispatcher_command not in text:
              count = text.count(outbox_command)
              if count != 2:
                  raise SystemExit(f'expected two outbox commands, found {count}')
              text = text.replace(
                  outbox_command,
                  outbox_command + '\n          ' + dispatcher_command,
              )
          workflow.write_text(text, encoding='utf-8')

          protocol = root / 'docs/development/OUTBOX_DISPATCH_PROTOCOL.md'
          text = protocol.read_text(encoding='utf-8') if protocol.is_file() else ''
          marker = '## Reconcile-before-deliver dispatcher'
          if marker not in text:
              addition = '''

## Reconcile-before-deliver dispatcher

`OutboxDispatcher` claims a bounded batch, supplies `IntentId` as the external idempotency key, and asks the sink to reconcile before issuing delivery. A previously accepted external receipt therefore completes the durable row without repeating the effect. Retryable and terminal sink failures have distinct transition policies, while stale owner/generation/expiry failures are counted and never overwrite a newer lease.

The exact-head dual-profile matrix exercises reconciliation, successful delivery, retry scheduling, terminal dead-lettering, and reconnect durability on PostgreSQL and CockroachDB. This is source and profile evidence for the declared subset only; a production provider sink, multi-node endurance, independent database/protocol/security acceptance and later SG4/SG8 evidence remain mandatory.
'''
              protocol.write_text(text.rstrip() + addition, encoding='utf-8')

          inventory_path = root / 'docs/status/IMPLEMENTATION_INVENTORY.json'
          if inventory_path.is_file():
              document = json.loads(inventory_path.read_text(encoding='utf-8'))
              for component in document.get('components', []):
                  if component.get('id') not in {'COMP-PERSISTENCE-PG', 'COMP-TRNM-SERVER'}:
                      continue
                  implemented = component.setdefault('implemented', [])
                  fact = 'generation-fenced outbox dispatcher with reconcile-before-deliver idempotency'
                  if fact not in implemented:
                      implemented.append(fact)
                  missing = component.setdefault('missing', [])
                  if 'outbox delivery worker' in missing:
                      missing.remove('outbox delivery worker')
                  remaining = 'production external-effect sink, multi-node endurance and independently accepted reconciliation evidence'
                  if remaining not in missing:
                      missing.append(remaining)
              inventory_path.write_text(
                  json.dumps(document, indent=2, ensure_ascii=False) + '\n',
                  encoding='utf-8',
              )

          state_path = root / 'docs/status/CURRENT_STATE.json'
          if state_path.is_file():
              state = json.loads(state_path.read_text(encoding='utf-8'))
              state.setdefault('implementation', {})['outbox_dispatcher_source_candidate'] = True
              state_path.write_text(
                  json.dumps(state, indent=2, ensure_ascii=False) + '\n',
                  encoding='utf-8',
              )

          roadmap_path = root / 'docs/roadmap/NEXT_MILESTONE.json'
          if roadmap_path.is_file():
              roadmap = json.loads(roadmap_path.read_text(encoding='utf-8'))
              for item in roadmap.get('items', []):
                  if item.get('id') == 'TG-V3-024' and item.get('status') == 'blocked':
                      item['status'] = 'source-candidate'
              roadmap_path.write_text(
                  json.dumps(roadmap, indent=2, ensure_ascii=False) + '\n',
                  encoding='utf-8',
              )

          for name in (
              'plan-v3-dispatcher-source-controller.yml',
              'plan-v3-dispatcher-repair-controller.yml',
          ):
              path = root / '.github/workflows' / name
              if path.is_file():
                  path.unlink()
          shutil.rmtree(staged, ignore_errors=True)
          parent = staged.parent
          if parent.is_dir() and not any(parent.iterdir()):
              parent.rmdir()
          PY
          test ! -e .github/workflows/plan-v3-dispatcher-source-controller.yml
          test ! -e .github/workflows/plan-v3-dispatcher-repair-controller.yml
          test ! -d .github/tmp/dispatcher-closure
          git diff --check

      - name: Execute strict source gates
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/dispatcher-repair.log) 2>&1
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo fix --package trnm-persistence-pg --all-targets --allow-dirty --allow-staged
          cargo clippy --package trnm-persistence-pg --all-targets --fix \
            --allow-dirty --allow-staged -- -W clippy::all
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Execute PostgreSQL dispatcher matrix
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/dispatcher-repair.log) 2>&1
          trap 'docker rm -f trnm-repair-postgres >/dev/null 2>&1 || true' EXIT
          docker run -d --name trnm-repair-postgres \
            -e POSTGRES_USER=trnm -e POSTGRES_PASSWORD=trnm -e POSTGRES_DB=trnm \
            -p 127.0.0.1:55432:5432 "$POSTGRES_IMAGE"
          for attempt in $(seq 1 90); do
            docker exec trnm-repair-postgres pg_isready -U trnm -d trnm && break
            test "$attempt" -lt 90
            sleep 1
          done
          export TRNM_SERVER_DATABASE_URL='postgresql://trnm:trnm@127.0.0.1:55432/trnm?sslmode=disable'
          export TRNM_SERVER_DATABASE_PROFILE='postgresql'
          export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$GITHUB_SHA"
          export TRNM_SERVER_ADMIN_TOKEN='dispatcher_admin_token_0123456789abcdef'
          export TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE='1'
          export TRNM_LIVE_TEST_REQUIRED='1'
          export TRNM_PG_TEST_URL="$TRNM_SERVER_DATABASE_URL"
          export TRNM_PG_TEST_PROFILE='postgresql'
          cargo run --package trnm-persistence-pg --bin trnm-server --locked -- migrate
          cargo test --package trnm-persistence-pg \
            --test outbox_runtime --test dispatcher_runtime --locked -- --nocapture

      - name: Execute CockroachDB dispatcher matrix
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/dispatcher-repair.log) 2>&1
          trap 'docker rm -f trnm-repair-cockroach >/dev/null 2>&1 || true' EXIT
          docker run -d --name trnm-repair-cockroach \
            -p 127.0.0.1:26257:26257 "$COCKROACH_IMAGE" \
            start-single-node --insecure --listen-addr=0.0.0.0:26257 \
            --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 90); do
            docker exec trnm-repair-cockroach cockroach sql --insecure \
              --host=127.0.0.1:26257 -e 'SELECT 1' >/dev/null 2>&1 && break
            test "$attempt" -lt 90
            sleep 1
          done
          docker exec trnm-repair-cockroach cockroach sql --insecure \
            --host=127.0.0.1:26257 -e 'CREATE DATABASE IF NOT EXISTS trnm'
          export TRNM_SERVER_DATABASE_URL='postgresql://root@127.0.0.1:26257/trnm?sslmode=disable'
          export TRNM_SERVER_DATABASE_PROFILE='cockroachdb'
          export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$GITHUB_SHA"
          export TRNM_SERVER_ADMIN_TOKEN='dispatcher_admin_token_0123456789abcdef'
          export TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE='1'
          export TRNM_LIVE_TEST_REQUIRED='1'
          export TRNM_PG_TEST_URL="$TRNM_SERVER_DATABASE_URL"
          export TRNM_PG_TEST_PROFILE='cockroachdb'
          cargo run --package trnm-persistence-pg --bin trnm-server --locked -- migrate
          cargo test --package trnm-persistence-pg \
            --test outbox_runtime --test dispatcher_runtime --locked -- --nocapture

      - name: Reject stale writers and commit clean dispatcher source
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test ! -e .github/workflows/plan-v3-dispatcher-source-controller.yml
          test ! -e .github/workflows/plan-v3-dispatcher-repair-controller.yml
          test ! -d .github/tmp/dispatcher-closure
          git diff --check
          git config user.name 'trillionnium-gap-closure-bot'
          git config user.email 'gap-closure-bot@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(outbox): add idempotent reconcile-before-deliver dispatcher'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record failure without claim promotion
        if: failure() && steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          log = pathlib.Path('/tmp/dispatcher-repair.log')
          tail = ''
          if log.is_file():
              tail = '\n'.join(log.read_text(encoding='utf-8', errors='replace').splitlines()[-160:])
          body = (
              f"Dispatcher repair controller failed for exact head `{os.environ['GITHUB_SHA']}`. "
              f"No gap, stage gate, durability or compatibility claim was promoted. Run: "
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}\n\n```text\n{tail}\n```"
          )
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/issues/42/comments",
              data=json.dumps({'body': body}).encode(), method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'trillionnium-dispatcher-repair-controller',
              },
          )
          try:
              urllib.request.urlopen(request, timeout=30).read()
          except Exception:
              pass
          PY
