name: monotonic-main-protection-reconcile

on:
  push:
    branches: [tooling/gap-closure-audit-2026-09-07]
    paths:
      - '.github/workflows/monotonic-main-protection-reconcile.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_BRANCH: main
      EXPECTED_MAIN: d66c1b5b614a2a7b682c233fe2e7a19939b6976b
      ADMIN_TOKEN: ${{ secrets.TRNM_GITHUB_ADMIN_TOKEN || secrets.TRNM_ADMIN_TOKEN || secrets.GH_ADMIN_TOKEN || secrets.GITHUB_ADMIN_TOKEN || secrets.ADMIN_TOKEN }}
    steps:
      - name: Require separately administered credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_TOKEN" || {
            echo 'No separately administered GitHub token is configured under an approved secret name.' >&2
            exit 78
          }

      - name: Read, monotonically strengthen and verify main protection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/governance"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          repository = os.environ['TARGET_REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          expected_main = os.environ['EXPECTED_MAIN']
          token = os.environ['ADMIN_TOKEN']
          root = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'trillionnium-protection-reconcile',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(method: str, path: str, body=None):
              data = None if body is None else json.dumps(body, separators=(',', ':')).encode()
              call = urllib.request.Request(root + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(call, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw.decode()) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read().decode('utf-8', errors='replace')
                  raise SystemExit(f'{method} {path}: HTTP {error.code}: {raw[:2000]}')

          _, branch_value = request('GET', f'/branches/{branch}')
          observed_main = branch_value['commit']['sha']
          if observed_main != expected_main:
              raise SystemExit(f'main drift: {observed_main} != {expected_main}')
          _, before = request('GET', f'/branches/{branch}/protection')

          status = before.get('required_status_checks') or {}
          contexts = set(status.get('contexts') or [])
          for row in status.get('checks') or []:
              context = row.get('context')
              if context:
                  contexts.add(context)
          contexts.add('trillionnium-game-merge-gate')

          reviews = before.get('required_pull_request_reviews') or {}
          dismissal = reviews.get('dismissal_restrictions') or {}
          restrictions = before.get('restrictions')

          payload = {
              'required_status_checks': {
                  'strict': True,
                  'contexts': sorted(contexts),
              },
              'enforce_admins': True,
              'required_pull_request_reviews': {
                  'dismissal_restrictions': {
                      'users': [row['login'] for row in dismissal.get('users') or []],
                      'teams': [row['slug'] for row in dismissal.get('teams') or []],
                  },
                  'dismiss_stale_reviews': True,
                  'require_code_owner_reviews': True,
                  'required_approving_review_count': max(
                      1, int(reviews.get('required_approving_review_count') or 0)
                  ),
                  'require_last_push_approval': True,
              },
              'restrictions': None if restrictions is None else {
                  'users': [row['login'] for row in restrictions.get('users') or []],
                  'teams': [row['slug'] for row in restrictions.get('teams') or []],
                  'apps': [row['slug'] for row in restrictions.get('apps') or []],
              },
              'required_linear_history': True,
              'allow_force_pushes': False,
              'allow_deletions': False,
              'block_creations': bool((before.get('block_creations') or {}).get('enabled')),
              'required_conversation_resolution': True,
              'lock_branch': bool((before.get('lock_branch') or {}).get('enabled')),
              'allow_fork_syncing': bool((before.get('allow_fork_syncing') or {}).get('enabled')),
          }
          request('PUT', f'/branches/{branch}/protection', payload)
          _, after = request('GET', f'/branches/{branch}/protection')

          after_status = after.get('required_status_checks') or {}
          after_contexts = set(after_status.get('contexts') or [])
          after_contexts.update(
              row.get('context') for row in after_status.get('checks') or [] if row.get('context')
          )
          after_reviews = after.get('required_pull_request_reviews') or {}
          checks = {
              'main_unchanged': observed_main == expected_main,
              'required_gate_present': 'trillionnium-game-merge-gate' in after_contexts,
              'strict_status_checks': bool(after_status.get('strict')),
              'admins_enforced': bool((after.get('enforce_admins') or {}).get('enabled')),
              'stale_reviews_dismissed': bool(after_reviews.get('dismiss_stale_reviews')),
              'code_owner_review_required': bool(after_reviews.get('require_code_owner_reviews')),
              'last_push_approval_required': bool(after_reviews.get('require_last_push_approval')),
              'approval_count_positive': int(after_reviews.get('required_approving_review_count') or 0) >= 1,
              'conversation_resolution_required': bool(
                  (after.get('required_conversation_resolution') or {}).get('enabled')
              ),
              'force_push_disabled': not bool((after.get('allow_force_pushes') or {}).get('enabled')),
              'branch_deletion_disabled': not bool((after.get('allow_deletions') or {}).get('enabled')),
              'linear_history_required': bool((after.get('required_linear_history') or {}).get('enabled')),
          }
          if not all(checks.values()):
              failed = [name for name, passed in checks.items() if not passed]
              raise SystemExit('protection readback failed: ' + ', '.join(failed))

          redacted = {
              'schema': 'trillionnium.main-protection-readback.v1',
              'repository': repository,
              'branch': branch,
              'main': observed_main,
              'checks': checks,
              'required_status_contexts': sorted(after_contexts),
              'required_approving_review_count': after_reviews.get('required_approving_review_count'),
              'before_summary': {
                  'required_status_contexts': sorted(contexts),
                  'required_approving_review_count': reviews.get('required_approving_review_count'),
              },
              'actor_scope': 'administrator-mutator-and-observer',
              'independently_accepted': False,
              'gap_closed': False,
              'limitations': [
                  'The administrator who changed/read back this policy cannot independently accept it.',
                  'A separate harmless negative enforcement rehearsal and conflict-free governance review remain required.',
              ],
          }
          target = Path(os.environ['RUNNER_TEMP']) / 'governance' / 'main-protection-readback.json'
          target.write_text(json.dumps(redacted, sort_keys=True, separators=(',', ':')) + '\n')
          print(json.dumps(checks, sort_keys=True))
          PY
          sha256sum "$RUNNER_TEMP/governance/main-protection-readback.json" \
            > "$RUNNER_TEMP/governance/SHA256SUMS"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/main-protection-readback.tar.gz" \
            -C "$RUNNER_TEMP/governance" main-protection-readback.json SHA256SUMS

      - name: Fetch exact source for native uploader
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${TARGET_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin \
            88c02a417c7b0c64f27dc9f49e0b5e6317150964
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD

      - name: Retain protection readback
        id: retained
        uses: ./source/.github/actions/upload-evidence
        with:
          name: main-protection-readback-${{ env.EXPECTED_MAIN }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/main-protection-readback.tar.gz
          mime_type: application/gzip

      - name: Verify receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained.outputs.artifact_id }}'
          test -n '${{ steps.retained.outputs.sha256 }}'
          test '${{ steps.retained.outputs.size_bytes }}' -gt 0
