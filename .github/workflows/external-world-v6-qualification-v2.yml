name: external-world-v6-qualification-v2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-world-v6-qualification-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_BASE_SHA: 0f6117a56263bcb5bf89e34b8bcda557a7da2e6d
  WORLD_HEAD_SHA: e2c2962981df6c420de764fcb11f626463245f98
  WORLD_MERGE_REF: refs/pull/104/merge
  WORLD_MERGE_SHA: 0d01195f6fe882597399638bbd843b779331c436
  WORLD_RUST_TOOLCHAIN: '1.98.1'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: postgres
  TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
  TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94

jobs:
  qualify:
    name: world-v6/${{ matrix.scope }}-head-and-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        scope: [truth, source, postgres, package]
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Fetch and verify exact World objects
        shell: bash
        run: |
          set -euo pipefail
          head_dir="$RUNNER_TEMP/world-head"
          merge_dir="$RUNNER_TEMP/world-merge"
          rm -rf "$head_dir" "$merge_dir"
          git init "$head_dir"
          git -C "$head_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$head_dir" fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C "$head_dir" checkout --detach FETCH_HEAD
          git init "$merge_dir"
          git -C "$merge_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$merge_dir" fetch --no-tags --depth=2 origin "$WORLD_MERGE_REF"
          git -C "$merge_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$head_dir" rev-parse HEAD)" = "$WORLD_HEAD_SHA"
          test "$(git -C "$merge_dir" rev-parse HEAD)" = "$WORLD_MERGE_SHA"
          test "$(git -C "$merge_dir" rev-parse HEAD^1)" = "$WORLD_BASE_SHA"
          test "$(git -C "$merge_dir" rev-parse HEAD^2)" = "$WORLD_HEAD_SHA"
          test -z "$(git -C "$head_dir" status --porcelain=v1 --untracked-files=no)"
          test -z "$(git -C "$merge_dir" status --porcelain=v1 --untracked-files=no)"
          git -C "$head_dir" show -s --format='world_head_commit=%H%nworld_head_tree=%T'
          git -C "$merge_dir" show -s --format='world_merge_commit=%H%nworld_merge_tree=%T%nworld_merge_parents=%P'

      - name: Install pinned World toolchain
        if: matrix.scope != 'truth'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$WORLD_RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup override set "$WORLD_RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config postgresql-client
          rustc --version --verbose
          cargo --version --verbose
          psql --version

      - name: Qualify exact World head
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-head"
          bash scripts/run-trnm-world-v6-qualification-v2.sh "${{ matrix.scope }}"

      - name: Qualify actual World prospective merge
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-merge"
          bash scripts/run-trnm-world-v6-qualification-v2.sh "${{ matrix.scope }}"

      - name: Assemble immutable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/external-evidence/${{ matrix.scope }}"
          mkdir -p "$out/head" "$out/merge"
          if test -d "$RUNNER_TEMP/world-head/run/world-v6-v2/${{ matrix.scope }}"; then
            cp -R "$RUNNER_TEMP/world-head/run/world-v6-v2/${{ matrix.scope }}/." "$out/head/"
          fi
          if test -d "$RUNNER_TEMP/world-merge/run/world-v6-v2/${{ matrix.scope }}"; then
            cp -R "$RUNNER_TEMP/world-merge/run/world-v6-v2/${{ matrix.scope }}/." "$out/merge/"
          fi
          {
            printf 'world_repository=%s\n' "$WORLD_REPOSITORY"
            printf 'world_base_sha=%s\n' "$WORLD_BASE_SHA"
            printf 'world_head_sha=%s\n' "$WORLD_HEAD_SHA"
            printf 'world_merge_sha=%s\n' "$WORLD_MERGE_SHA"
            printf 'scope=%s\n' "${{ matrix.scope }}"
            printf 'external_runner_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'external_runner_commit=%s\n' "$GITHUB_SHA"
            printf 'external_runner_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'production_authorization=not_granted\n'
          } > "$out/attestation.txt"
          find "$out" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$out/SHA256SUMS"

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-world-v6-${{ matrix.scope }}-${{ env.WORLD_HEAD_SHA }}-${{ env.WORLD_MERGE_SHA }}-${{ github.run_attempt }}
          path: external-evidence/${{ matrix.scope }}/**
          if-no-files-found: warn
          retention-days: 30
