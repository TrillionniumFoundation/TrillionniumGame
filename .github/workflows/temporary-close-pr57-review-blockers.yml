name: temporary-close-pr57-review-blockers

on:
  push:
    branches:
      - tmp/pr57-finalizer-20260831

permissions:
  contents: read

concurrency:
  group: temporary-close-pr57-review-blockers
  cancel-in-progress: true

jobs:
  inspect-reviewed-payload:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Print exact reviewed patch_app AST
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          import base64
          import hashlib
          import re
          import zlib
          from pathlib import Path

          wrapper = Path("scripts/temporary-close-pr57-review-blockers.py").read_text(encoding="utf-8")
          match = re.search(
              r'PAYLOAD_SHA256 = "([0-9a-f]{64})".*?base64\.b85decode\("""(.*?)"""\)\)',
              wrapper,
              flags=re.DOTALL,
          )
          if match is None:
              raise SystemExit("payload wrapper not recognized")
          expected, encoded = match.groups()
          payload = zlib.decompress(base64.b85decode(encoded))
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"payload digest mismatch: {expected} != {actual}")
          tree = ast.parse(payload.decode("utf-8"))
          matches = []
          for node in tree.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  constants = {
                      child.value
                      for child in ast.walk(node)
                      if isinstance(child, ast.Constant) and isinstance(child.value, str)
                  }
                  if any("app shared drain field" in value for value in constants):
                      matches.append(node)
          if len(matches) != 1:
              raise SystemExit(f"expected one patch_app function, found {len(matches)}")
          print("=== PATCH_APP_AST_BEGIN ===")
          print(ast.unparse(matches[0]))
          print("=== PATCH_APP_AST_END ===")
          PY
