name: temporary-close-pr57-review-blockers

on:
  push:
    branches:
      - codex/grpc-healthcheck-source-2026-08-31

permissions:
  contents: write

concurrency:
  group: temporary-close-pr57-review-blockers
  cancel-in-progress: true

jobs:
  patch-validate-commit:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Select a repository-supported Python runtime
        shell: bash
        run: |
          set -euo pipefail
          candidates="$({
            for name in python3.13 python3.12 python3.11; do
              command -v "$name" 2>/dev/null || true
            done
            find /opt/hostedtoolcache/Python -type f -path '*/x64/bin/python' -perm -111 \
              -print 2>/dev/null | sort -Vr || true
          } | awk 'NF && !seen[$0]++')"
          test -n "$candidates" || {
            echo 'Python >= 3.11 is required; no candidate interpreter was found.' >&2
            exit 1
          }
          selected=''
          while IFS= read -r candidate; do
            test -x "$candidate" || continue
            version="$($candidate -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
            major="${version%%.*}"
            minor="${version#*.}"
            if (( major > 3 || (major == 3 && minor >= 11) )); then
              selected="$(realpath "$candidate")"
              break
            fi
          done <<< "$candidates"
          test -n "$selected" || {
            echo 'Python >= 3.11 is required; discovered interpreters were too old.' >&2
            printf '%s\n' "$candidates" >&2
            exit 1
          }
          "$selected" --version
          "$selected" -c 'import tomllib; print("tomllib=available")'
          printf 'PYTHON_BIN=%s\n' "$selected" >> "$GITHUB_ENV"

      - name: Apply all current exact-head review repairs
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" scripts/temporary-dedupe-server-shared-state.py
          "$PYTHON_BIN" scripts/temporary-close-pr57-review-blockers.py
          "$PYTHON_BIN" - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-persistence-pg/src/bin/trnm_server/app.rs')
          text = path.read_text(encoding='utf-8')
          old = "    #[must_use]\n    pub(crate) fn with_shared_metrics(\n"
          new = "    #[cfg(test)]\n    #[must_use]\n    pub(crate) fn with_shared_metrics(\n"
          if text.count(old) != 1:
              raise SystemExit(
                  f'test-only shared metrics constructor: expected one match, got {text.count(old)}'
              )
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          "$PYTHON_BIN" scripts/temporary-close-pr57-outbox-evidence.py
          rm \
            .github/workflows/temporary-close-pr57-review-blockers.yml \
            .github/workflows/exact-source-snapshot.yml \
            scripts/temporary-prepatch-app-drain.py \
            scripts/temporary-dedupe-server-shared-state.py \
            scripts/temporary-close-pr57-review-blockers.py \
            scripts/temporary-close-pr57-outbox-evidence.py

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Format and validate final source candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          "$PYTHON_BIN" -m compileall -q scripts tools tests
          "$PYTHON_BIN" -m unittest discover -s tests -p 'test_*.py' -v
          "$PYTHON_BIN" scripts/check-gap-register.py
          "$PYTHON_BIN" scripts/check-evidence-index.py
          "$PYTHON_BIN" scripts/check-plan.py
          "$PYTHON_BIN" scripts/check-status-transitions.py
          "$PYTHON_BIN" scripts/check-schema-authority.py
          "$PYTHON_BIN" scripts/check-workflow-action-policy.py
          "$PYTHON_BIN" scripts/check-repository-hygiene.py
          "$PYTHON_BIN" scripts/check-rust-package-inventory.py
          "$PYTHON_BIN" scripts/check-rust-foundation.py
          "$PYTHON_BIN" scripts/check-trnm-server.py
          "$PYTHON_BIN" scripts/check-source-candidate-boundaries.py
          bash scripts/check-api-rtapi-denominator.sh
          bash -n scripts/ci-outbox-final-attempt-reaper.sh
          test -x scripts/upload-actions-artifact.py
          "$PYTHON_BIN" -m unittest tests.control_plane.test_actions_artifact_uploader -v
          files=$(find runtime -type f -name '*.go' -print | sort)
          test -n "$files"
          unformatted=$(printf '%s\n' "$files" | xargs gofmt -l)
          test -z "$unformatted" || { printf '%s\n' "$unformatted" >&2; exit 1; }
          (cd runtime && go test ./... -count=1 && go test -race ./... -count=1 && go vet ./...)
          git diff --check
          test ! -e .github/workflows/temporary-close-pr57-review-blockers.yml
          test ! -e .github/workflows/exact-source-snapshot.yml
          test ! -e scripts/temporary-prepatch-app-drain.py
          test ! -e scripts/temporary-dedupe-server-shared-state.py
          test ! -e scripts/temporary-close-pr57-review-blockers.py
          test ! -e scripts/temporary-close-pr57-outbox-evidence.py

      - name: Commit exact validated source
        shell: bash
        env:
          TARGET_BRANCH: codex/grpc-healthcheck-source-2026-08-31
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --short)"
          git commit -m 'fix(server): close exact-head review blockers'
          git push origin "HEAD:${TARGET_BRANCH}"
