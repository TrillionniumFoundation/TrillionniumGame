name: pr93-v3-branch-cleanup

on:
  push:
    branches: [tooling/pr93-v3-branch-cleanup-2026-09-06]
    paths:
      - '.github/workflows/pr93-v3-branch-cleanup.yml'

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  prove-archive-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 7deee4377cff401854647151842c582f038feef1
      V3_BRANCH: codex/remaining-source-blockers-wave-v3-2026-09-06
      V2_BRANCH: codex/remaining-source-blockers-wave-v2-2026-09-06
      EXTENDED_BRANCH: codex/remaining-source-blockers-wave-2026-09-06
      PR_NUMBER: '93'
    steps:
      - name: Prove composition and remove only archived redundant branch refs
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          repo="$GITHUB_WORKSPACE/repo"
          rm -rf "$repo"
          git init "$repo"
          git -C "$repo" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$repo" fetch --no-tags origin \
            "$BASE_SHA" \
            "refs/heads/${V3_BRANCH}:refs/remotes/origin/v3" \
            "refs/heads/${V2_BRANCH}:refs/remotes/origin/v2" \
            "refs/heads/${EXTENDED_BRANCH}:refs/remotes/origin/extended"
          v3=$(git -C "$repo" rev-parse refs/remotes/origin/v3)
          v2=$(git -C "$repo" rev-parse refs/remotes/origin/v2)
          extended=$(git -C "$repo" rev-parse refs/remotes/origin/extended)
          for sha in "$v3" "$v2" "$extended"; do
            git -C "$repo" merge-base --is-ancestor "$BASE_SHA" "$sha"
          done

          # v2 is exact authority for every path it changed.
          while IFS= read -r path; do
            test "$(git -C "$repo" ls-tree "$v3" -- "$path")" = \
                 "$(git -C "$repo" ls-tree "$v2" -- "$path")"
          done < <(git -C "$repo" diff --name-only "$BASE_SHA" "$v2")

          # Extended-only paths must be exact. For overlap, v2 intentionally
          # supersedes the extended entry and v3 must equal v2.
          while IFS= read -r path; do
            ext_entry=$(git -C "$repo" ls-tree "$extended" -- "$path")
            v3_entry=$(git -C "$repo" ls-tree "$v3" -- "$path")
            if git -C "$repo" diff --quiet "$BASE_SHA" "$v2" -- "$path"; then
              test "$v3_entry" = "$ext_entry"
            else
              test "$v3_entry" = "$(git -C "$repo" ls-tree "$v2" -- "$path")"
            fi
          done < <(git -C "$repo" diff --name-only "$BASE_SHA" "$extended")

          : > "$RUNNER_TEMP/summary.tsv"
          for spec in "${V2_BRANCH}:${v2}" "${EXTENDED_BRANCH}:${extended}"; do
            branch=${spec%%:*}; tip=${spec#*:}
            encoded=$(jq -nr --arg value "$branch" '$value|@uri')
            curl -fsS "${auth[@]}" "${api}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${encoded}&per_page=100" > "$RUNNER_TEMP/open.json"
            test "$(jq 'length' "$RUNNER_TEMP/open.json")" -eq 0
            safe=$(printf '%s' "$branch" | tr '/' '-')
            tag="archive/${safe}-${tip:0:12}-2026-09-06"
            jq -n --arg ref "refs/tags/${tag}" --arg sha "$tip" '{ref:$ref,sha:$sha}' > "$RUNNER_TEMP/tag.json"
            response=$(curl -sS -w '\n%{http_code}' -X POST "${auth[@]}" --data-binary @"$RUNNER_TEMP/tag.json" "${api}/git/refs")
            status=${response##*$'\n'}
            test "$status" = 201 || test "$status" = 422
            curl -fsS "${auth[@]}" "${api}/git/ref/tags/$(jq -nr --arg value "$tag" '$value|@uri')" | jq -e --arg sha "$tip" '.object.sha==$sha' >/dev/null
            curl -fsS -X DELETE "${auth[@]}" "${api}/git/refs/heads/${encoded}" >/dev/null
            test "$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "${api}/git/ref/heads/${encoded}")" = 404
            printf '%s\t%s\t%s\n' "$branch" "$tip" "$tag" >> "$RUNNER_TEMP/summary.tsv"
          done

          body=$(python3 - "$RUNNER_TEMP/summary.tsv" "$v3" <<'PY'
          from pathlib import Path
          import sys
          rows=[]
          for line in Path(sys.argv[1]).read_text().splitlines():
              branch,tip,tag=line.split('\t')
              rows.append(f"- `{branch}` @ `{tip}` → `{tag}`")
          print("<!-- pr93-v3-branch-cleanup -->\nVerified exact/superseding path containment in v3 wave `"+sys.argv[2]+"`, archived each old exact tip, and removed the redundant refs:\n"+"\n".join(rows)+"\n\nNo source, evidence, review, gap, compatibility or production credit is created by branch cleanup.")
          PY
          )
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl -fsS -X POST "${auth[@]}" --data-binary @"$RUNNER_TEMP/comment.json" "${api}/issues/${PR_NUMBER}/comments" >/dev/null
