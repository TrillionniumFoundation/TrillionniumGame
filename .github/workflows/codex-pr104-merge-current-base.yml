name: codex-pr104-merge-current-base

on:
  push:
    branches:
      - codex/realtime-recovery-wave-2026-09-07

permissions:
  contents: write

jobs:
  merge-current-base:
    if: github.repository == 'TrillionniumFoundation/TrillionniumGame'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      TARGET_BRANCH: codex/realtime-recovery-wave-2026-09-07
      BASE_SHA: b373e672056f920af259266235a2962ac638a3a0
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - name: Fetch exact realtime head and crypto base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            fetch --no-tags origin "$GITHUB_SHA" "$BASE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$TARGET_BRANCH" "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" cat-file -t "$BASE_SHA")" = commit
          git config user.name "ProfHepta"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"

      - name: Merge base and resolve only the actual document conflict
        shell: bash
        env:
          GIT_MERGE_AUTOEDIT: no
        run: |
          set -euo pipefail
          set +e
          git merge --no-commit --no-ff "$BASE_SHA"
          status=$?
          set -e
          test "$status" -eq 1
          test "$(git rev-parse MERGE_HEAD)" = "$BASE_SHA"
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          test "${#conflicts[@]}" -eq 1
          test "${conflicts[0]}" = "crates/trnm-presence-router-v2/README.md"
          python3 scripts/codex-pr104-merge-current-base-r2.py
          git add crates/trnm-presence-router-v2/README.md
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Materialize final source-only merge tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/codex-pr104-merge-current-base.py
          rm -f scripts/codex-pr104-merge-current-base-r2.py
          rm -f .github/workflows/codex-pr104-merge-current-base.yml
          git add -A
          test -f .git/MERGE_HEAD
          git diff --cached --check

      - name: Validate complete control and Python corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1

      - name: Validate realtime and crypto workspaces
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            crates/trnm-presence-router-v2/Cargo.toml \
            crates/trnm-token-crypto-provider/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done

      - name: Publish non-force merge commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          original_head="$GITHUB_SHA"
          git commit -m "merge(realtime): absorb authenticated crypto base"
          merged_head="$(git rev-parse HEAD)"
          mapfile -t parents < <(git show -s --format=%P "$merged_head" | tr ' ' '\n')
          test "${#parents[@]}" -eq 2
          test "${parents[0]}" = "$original_head"
          test "${parents[1]}" = "$BASE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$merged_head"
          test -z "$(git status --porcelain)"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
