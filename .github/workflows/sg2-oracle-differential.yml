name: trillionnium-game-oracle-differential

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/oracle/differential.py'
      - 'scripts/oracle/compare-differential.py'
      - 'scripts/oracle/emit-synthetic-differential-corpus.py'
      - 'scripts/oracle/check-differential-engine.sh'
      - 'tests/oracle/test_differential.py'
      - 'docs/evidence/schemas/oracle-observation-v1.schema.json'
      - 'docs/development/ORACLE_DIFFERENTIAL_ENGINE.md'
      - '.github/workflows/sg2-oracle-differential.yml'
  push:
    branches: [main]
    paths:
      - 'tools/oracle/differential.py'
      - 'scripts/oracle/compare-differential.py'
      - 'scripts/oracle/emit-synthetic-differential-corpus.py'
      - 'scripts/oracle/check-differential-engine.sh'
      - 'tests/oracle/test_differential.py'
      - 'docs/evidence/schemas/oracle-observation-v1.schema.json'
      - 'docs/development/ORACLE_DIFFERENTIAL_ENGINE.md'
      - '.github/workflows/sg2-oracle-differential.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-oracle-differential-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  synthetic-differential-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "refs/heads/${CANDIDATE_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Run differential engine unit and negative tests
        run: bash scripts/oracle/check-differential-engine.sh
      - name: Emit exact-head zero-divergence synthetic corpus
        run: |
          set -euo pipefail
          python3 scripts/oracle/emit-synthetic-differential-corpus.py \
            --output-dir run/equivalent
          python3 scripts/oracle/compare-differential.py \
            --input-dir run/equivalent \
            --normalizers config/oracle-normalizers.json \
            --output run/equivalent-evidence.json
      - name: Emit and require rejection of a P0 corpus
        run: |
          set -euo pipefail
          python3 scripts/oracle/emit-synthetic-differential-corpus.py \
            --output-dir run/divergent \
            --database-divergence
          if python3 scripts/oracle/compare-differential.py \
              --input-dir run/divergent \
              --normalizers config/oracle-normalizers.json \
              --output run/divergent-evidence.json; then
            echo 'P0 corpus incorrectly passed' >&2
            exit 1
          fi
      - name: Seal exact-head differential contract evidence
        run: |
          set -euo pipefail
          test -s run/equivalent-evidence.json
          test -s run/divergent-evidence.json
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/equivalent-evidence.json run/divergent-evidence.json
          cat run/equivalent-evidence.json
          cat run/divergent-evidence.json
