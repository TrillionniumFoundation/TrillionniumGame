name: temporary-finalize-grpc-health

on:
  push:
    branches:
      - codex/grpc-healthcheck-source-2026-08-31

permissions:
  contents: write

concurrency:
  group: temporary-finalize-grpc-health
  cancel-in-progress: false

jobs:
  integrate-validate-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch exact branch without external actions
        shell: bash
        env:
          BRANCH: codex/grpc-healthcheck-source-2026-08-31
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git -C "$GITHUB_WORKSPACE" checkout -B "$BRANCH" "origin/$BRANCH"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply reviewed integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/temporary-finalize-grpc-health.py
          python3 scripts/temporary-finalize-grpc-health.py
      - name: Generate lockfile and format source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo check --package trnm-persistence-pg --all-targets
          cargo fmt --all
      - name: Remove temporary execution surface before validation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-finalize-grpc-health.yml
          git rm scripts/temporary-finalize-grpc-health.py
      - name: Validate exact clean tree
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .claims.grpc_healthcheck_source_candidate == true and
            .claims.full_nakama_grpc_implemented == false and
            .claims.grpc_gateway_implemented == false and
            .claims.compatibility_credit == false and
            .claims.production_ready == false
          ' contracts/grpc/nakama-healthcheck-v1.json >/dev/null
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-plan.py
          python3 scripts/check-source-candidate-boundaries.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Commit only verified integration outputs
        shell: bash
        env:
          BRANCH: codex/grpc-healthcheck-source-2026-08-31
        run: |
          set -euo pipefail
          git config user.name "trillionnium-grpc-finalizer"
          git config user.email "grpc-finalizer@users.noreply.github.com"
          git status --porcelain=v1 | sed 's/^...//' > /tmp/actual-paths
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/temporary-finalize-grpc-health.yml|\
              scripts/temporary-finalize-grpc-health.py|\
              Cargo.lock|\
              crates/trnm-persistence-pg/build.rs|\
              crates/trnm-persistence-pg/src/bin/trnm_server/config.rs|\
              crates/trnm-persistence-pg/src/bin/trnm_server/grpc.rs|\
              crates/trnm-persistence-pg/src/bin/trnm_server/server.rs|\
              docs/status/TRNM_SERVER_STATUS.json|\
              scripts/check-rust-foundation.py|\
              scripts/check-trnm-server.py) ;;
              *) echo "unexpected finalizer output: $path" >&2; exit 1 ;;
            esac
          done < /tmp/actual-paths
          for required in \
            .github/workflows/temporary-finalize-grpc-health.yml \
            scripts/temporary-finalize-grpc-health.py \
            Cargo.lock \
            crates/trnm-persistence-pg/src/bin/trnm_server/config.rs \
            crates/trnm-persistence-pg/src/bin/trnm_server/server.rs \
            docs/status/TRNM_SERVER_STATUS.json \
            scripts/check-rust-foundation.py \
            scripts/check-trnm-server.py; do
            grep -Fxq "$required" /tmp/actual-paths
          done
          git add -A
          git diff --cached --check
          git commit -m "ci(grpc): seal generated Healthcheck source candidate"
          git push origin "HEAD:refs/heads/${BRANCH}"
