name: tmp-export-product-assurance-v2

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-export-product-assurance-v2.yml

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  SOURCE_BRANCH: feature/plan-v32-product-assurance-v2-20260909
  GH_TOKEN: ${{ github.token }}

jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Wait for stable exact source object
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          head=''
          stable=0
          for _ in $(seq 1 1080); do
            current="$(gh api "repos/${REPOSITORY}/branches/${SOURCE_BRANCH}" --jq '.commit.sha' 2>/dev/null || true)"
            if test -z "$current"; then sleep 20; continue; fi
            if test "$current" != "$head"; then head="$current"; stable=0; fi
            payload="$(gh api "repos/${REPOSITORY}/commits/${head}/check-runs?per_page=100" 2>/dev/null || echo '{"check_runs":[]}')"
            canonical="$(jq -c 'reduce .check_runs[] as $run ({}; if .[$run.name] == null or ((.[$run.name].started_at // "") < ($run.started_at // "")) then .[$run.name] = $run else . end) | [.[]]' <<<"$payload")"
            total="$(jq 'length' <<<"$canonical")"
            pending="$(jq '[.[]|select(.status!="completed")]|length' <<<"$canonical")"
            failed="$(jq '[.[]|select(.status=="completed" and (.conclusion!="success" and .conclusion!="neutral" and .conclusion!="skipped"))]|length' <<<"$canonical")"
            aggregate="$(jq '[.[]|select(.name=="trillionnium-game-merge-gate" and .status=="completed" and .conclusion=="success")]|length' <<<"$canonical")"
            if test "$total" -gt 0 && test "$pending" -eq 0 && test "$failed" -eq 0 && test "$aggregate" -gt 0; then stable=$((stable+1)); else stable=0; fi
            if test "$stable" -ge 2; then
              tree="$(gh api "repos/${REPOSITORY}/git/commits/${head}" --jq '.tree.sha')"
              printf 'head=%s\ntree=%s\n' "$head" "$tree" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Fetch and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin '${{ steps.subject.outputs.head }}'
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = '${{ steps.subject.outputs.head }}'
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})" = '${{ steps.subject.outputs.tree }}'

      - name: Construct deterministic source packet
        id: packet
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/product-assurance-${{ steps.subject.outputs.head }}"
          mkdir -p "$packet"
          git -C "$GITHUB_WORKSPACE" archive \
            --format=tar \
            --prefix="TrillionniumGame-${{ steps.subject.outputs.head }}/" \
            '${{ steps.subject.outputs.head }}' \
            | gzip -n > "$packet/source.tar.gz"
          test -s "$packet/source.tar.gz"
          test "$(stat -c %s "$packet/source.tar.gz")" -le 134217728
          python3 - "$packet" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          packet = Path(sys.argv[1])
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          source = packet / 'source.tar.gz'
          source_digest = hashlib.sha256(source.read_bytes()).hexdigest()
          tracked = subprocess.check_output(
              ['git', '-C', str(workspace), 'ls-files', '-z']
          ).split(b'\0')
          tracked = [item.decode('utf-8') for item in tracked if item]
          crates = sorted(
              path.parent.relative_to(workspace).as_posix()
              for path in workspace.glob('crates/*/Cargo.toml')
          )
          manifest = {
              'schema': 'trillionnium.product-assurance-source-packet.v1',
              'repository': os.environ['REPOSITORY'],
              'branch': os.environ['SOURCE_BRANCH'],
              'commit': os.environ['SOURCE_HEAD'],
              'tree': os.environ['SOURCE_TREE'],
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'workflow_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'source_archive': {
                  'name': source.name,
                  'bytes': source.stat().st_size,
                  'sha256': source_digest,
              },
              'tracked_file_count': len(tracked),
              'tracked_path_list_sha256': hashlib.sha256(
                  ('\n'.join(tracked) + '\n').encode('utf-8')
              ).hexdigest(),
              'crate_count': len(crates),
              'crates': crates,
              'claim_boundary': {
                  'source_qualification_only': True,
                  'independent_acceptance': False,
                  'accepted_evidence': False,
                  'production_ready': False,
                  'cutover_authorized': False,
                  'nakama_retired': False,
              },
          }
          (packet / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
        env:
          SOURCE_HEAD: ${{ steps.subject.outputs.head }}
          SOURCE_TREE: ${{ steps.subject.outputs.tree }}
          REPOSITORY: ${{ env.REPOSITORY }}
          SOURCE_BRANCH: ${{ env.SOURCE_BRANCH }}
          printf '%s  %s\n' \
            "$(sha256sum "$packet/source.tar.gz" | awk '{print $1}')" source.tar.gz \
            "$(sha256sum "$packet/manifest.json" | awk '{print $1}')" manifest.json \
            > "$packet/SHA256SUMS"
          (cd "$packet" && sha256sum --check SHA256SUMS)
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/product-assurance-packet.tgz" -C "$packet" .
          test -s "$RUNNER_TEMP/product-assurance-packet.tgz"
          printf 'packet=%s\n' "$RUNNER_TEMP/product-assurance-packet.tgz" >> "$GITHUB_OUTPUT"

      - name: Upload retained diagnostic packet
        id: upload
        uses: ./.github/actions/upload-evidence
        with:
          name: product-assurance-source-${{ steps.subject.outputs.head }}
          path: ${{ steps.packet.outputs.packet }}
          mime_type: application/gzip

      - name: Publish exact packet identity
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPOSITORY" --head "$SOURCE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          body="Exact source packet retained for \`${{ steps.subject.outputs.head }}\` / tree \`${{ steps.subject.outputs.tree }}\` in run \`${GITHUB_RUN_ID}\`. Artifact ID \`${{ steps.upload.outputs.artifact_id }}\`, SHA-256 \`${{ steps.upload.outputs.sha256 }}\`, bytes \`${{ steps.upload.outputs.size_bytes }}\`. This is unaccepted diagnostic source evidence only."
          test -z "$pr" || gh pr comment "$pr" --repo "$REPOSITORY" --body "$body"
          gh issue comment 129 --repo "$REPOSITORY" --body "$body"
