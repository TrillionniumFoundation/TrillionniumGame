name: trillionnium-game-merge-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trillionnium-game-merge-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  GOTOOLCHAIN: auto
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  control-plane:
    name: control-plane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_REF"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate plan, status, gates and schema authority
        run: python3 scripts/check-plan.py
      - name: Validate repository-native workflow action policy
        run: python3 scripts/check-workflow-action-policy.py
      - name: Reject tracked build, runtime and secret-like outputs
        run: python3 scripts/check-repository-hygiene.py
      - name: Validate complete Rust package and target inventory
        run: python3 scripts/check-rust-package-inventory.py
      - name: Validate Rust server source contract
        run: python3 scripts/check-trnm-server.py
      - name: Compile control scripts
        run: |
          python3 -m py_compile \
            scripts/check-plan.py \
            scripts/check-status-transitions.py \
            scripts/derive-gates.py \
            scripts/check-schema-authority.py \
            scripts/check-workflow-action-policy.py \
            scripts/check-repository-hygiene.py \
            scripts/check-rust-package-inventory.py \
            scripts/check-trnm-server.py

  rust-workspace:
    name: rust-workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Recheck package coverage before Cargo execution
        run: python3 scripts/check-rust-package-inventory.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test all libraries, binaries and integration targets
        run: cargo test --workspace --all-targets --locked
      - name: Strict lint all libraries, binaries and integration targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  isolated-rust:
    name: isolated-rust (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: token-jwt-adapter
            manifest: crates/trnm-token-jwt-adapter/Cargo.toml
          - component: token-jwt-adapter-gate
            manifest: crates/trnm-token-jwt-adapter-gate/Cargo.toml
          - component: token-jwt-adapter-gate-v2
            manifest: crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
          - component: presence-router-v2
            manifest: crates/trnm-presence-router-v2/Cargo.toml
          - component: trnm-server-foundation
            manifest: crates/trnm-server/Cargo.toml
          - component: persistence-runtime-policy
            manifest: crates/trnm-persistence-runtime-policy/Cargo.toml
          - component: realtime-wire
            manifest: crates/trnm-realtime-wire/Cargo.toml
          - component: storage-nakama-version
            manifest: crates/trnm-storage-nakama-version/Cargo.toml
          - component: token-crypto-provider
            manifest: crates/trnm-token-crypto-provider/Cargo.toml
          - component: token-jwt-provider-adapter
            manifest: crates/trnm-token-jwt-provider-adapter/Cargo.toml
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format
        run: cargo fmt --manifest-path '${{ matrix.manifest }}' -- --check
      - name: Test
        run: cargo test --manifest-path '${{ matrix.manifest }}' --all-targets --locked
      - name: Strict lint
        run: cargo clippy --manifest-path '${{ matrix.manifest }}' --all-targets --locked -- -D warnings

  python-contracts:
    name: python-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Compile Python sources
        run: python3 -m compileall -q scripts tools tests
      - name: Run Python test corpus
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run API and realtime denominator contract
        run: bash scripts/check-api-rtapi-denominator.sh

  legacy-go-migration-input:
    name: legacy-go-migration-input
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Record Go toolchain
        run: go version
      - name: Verify formatting
        run: |
          set -euo pipefail
          files=$(find runtime -type f -name '*.go' -print | sort)
          test -n "$files"
          unformatted=$(printf '%s\n' "$files" | xargs gofmt -l)
          test -z "$unformatted" || { printf '%s\n' "$unformatted" >&2; exit 1; }
      - name: Test, race and vet
        working-directory: runtime
        run: |
          set -euo pipefail
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...

  external-world-v6:
    name: external-world-v6 (${{ matrix.scope }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        scope: [truth, source, postgres, package]
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
      WORLD_BASE_SHA: 0f6117a56263bcb5bf89e34b8bcda557a7da2e6d
      WORLD_HEAD_SHA: d0eb45783db1273dfbd9a8f3c72c281381c2e29b
      WORLD_MERGE_SHA: 7b8429636d454ab258584d9281a06c689423137b
      RUST_TOOLCHAIN: '1.98.1'
      RUSTUP_TOOLCHAIN: '1.98.1'
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    steps:
      - name: Fetch and verify exact World head and merge objects
        shell: bash
        run: |
          set -euo pipefail
          rm -rf world-head world-merge
          git init world-head
          git -C world-head remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C world-head fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C world-head checkout --detach FETCH_HEAD
          git init world-merge
          git -C world-merge remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C world-merge fetch --no-tags --depth=2 origin "refs/pull/104/merge"
          git -C world-merge checkout --detach FETCH_HEAD
          test "$(git -C world-head rev-parse HEAD)" = "$WORLD_HEAD_SHA"
          test "$(git -C world-merge rev-parse HEAD)" = "$WORLD_MERGE_SHA"
          test "$(git -C world-merge rev-parse HEAD^1)" = "$WORLD_BASE_SHA"
          test "$(git -C world-merge rev-parse HEAD^2)" = "$WORLD_HEAD_SHA"
      - name: Install World pinned Rust and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config postgresql-client
          rustc --version --verbose
          cargo --version --verbose
          psql --version
      - name: Qualify exact World head
        shell: bash
        run: |
          set -euo pipefail
          cd world-head
          bash scripts/run-trnm-world-v6-qualification-v2.sh "${{ matrix.scope }}"
      - name: Qualify actual World prospective merge
        shell: bash
        run: |
          set -euo pipefail
          cd world-merge
          bash scripts/run-trnm-world-v6-qualification-v2.sh "${{ matrix.scope }}"
      - name: Emit immutable external qualification attestation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="external-world-v6/${{ matrix.scope }}"
          mkdir -p "$out/head" "$out/merge"
          if test -d "world-head/run/world-v6-v2/${{ matrix.scope }}"; then
            cp -R "world-head/run/world-v6-v2/${{ matrix.scope }}/." "$out/head/"
          fi
          if test -d "world-merge/run/world-v6-v2/${{ matrix.scope }}"; then
            cp -R "world-merge/run/world-v6-v2/${{ matrix.scope }}/." "$out/merge/"
          fi
          {
            printf 'world_repository=%s\n' "$WORLD_REPOSITORY"
            printf 'world_base_sha=%s\n' "$WORLD_BASE_SHA"
            printf 'world_head_sha=%s\n' "$WORLD_HEAD_SHA"
            printf 'world_merge_sha=%s\n' "$WORLD_MERGE_SHA"
            printf 'scope=%s\n' "${{ matrix.scope }}"
            printf 'external_runner_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'external_runner_commit=%s\n' "$GITHUB_SHA"
            printf 'external_runner_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'production_authorization=not_granted\n'
          } > "$out/attestation.txt"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"

  trillionnium-game-merge-gate:
    name: trillionnium-game-merge-gate
    if: always()
    needs:
      - control-plane
      - rust-workspace
      - isolated-rust
      - python-contracts
      - legacy-go-migration-input
      - external-world-v6
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject missing, skipped, cancelled or failed lanes
        env:
          CONTROL_PLANE: ${{ needs.control-plane.result }}
          RUST_WORKSPACE: ${{ needs.rust-workspace.result }}
          ISOLATED_RUST: ${{ needs.isolated-rust.result }}
          PYTHON_CONTRACTS: ${{ needs.python-contracts.result }}
          LEGACY_GO: ${{ needs.legacy-go-migration-input.result }}
          EXTERNAL_WORLD_V6: ${{ needs.external-world-v6.result }}
        run: |
          set -euo pipefail
          test "$CONTROL_PLANE" = success
          test "$RUST_WORKSPACE" = success
          test "$ISOLATED_RUST" = success
          test "$PYTHON_CONTRACTS" = success
          test "$LEGACY_GO" = success
          test "$EXTERNAL_WORLD_V6" = success
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
