name: trillionnium-game-merge-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: trillionnium-game-merge-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  GOTOOLCHAIN: auto
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  control-plane:
    name: control-plane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_REF"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate plan, status, gates and schema authority
        run: python3 scripts/check-plan.py
      - name: Validate repository-native workflow action and syntax policy
        run: python3 scripts/check-workflow-action-policy.py
      - name: Reject tracked build, runtime and secret-like outputs
        run: python3 scripts/check-repository-hygiene.py
      - name: Validate complete Rust package and target inventory
        run: python3 scripts/check-rust-package-inventory.py
      - name: Validate Rust server source contract
        run: python3 scripts/check-trnm-server.py
      - name: Validate closed required-workflow manifest JSON
        run: python3 -m json.tool docs/governance/REQUIRED_WORKFLOWS_V1.json >/dev/null
      - name: Compile control scripts
        run: |
          python3 -m py_compile \
            scripts/check-plan.py \
            scripts/check-status-transitions.py \
            scripts/derive-gates.py \
            scripts/check-schema-authority.py \
            scripts/check-workflow-action-policy.py \
            scripts/check-required-workflow-runs.py \
            scripts/check-repository-hygiene.py \
            scripts/check-rust-package-inventory.py \
            scripts/check-trnm-server.py
      - name: Exercise workflow integrity regressions
        run: python3 -m unittest tests.control_plane.test_workflow_gate_integrity -v

  rust-workspace:
    name: rust-workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Recheck package coverage before Cargo execution
        run: python3 scripts/check-rust-package-inventory.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test all libraries, binaries and integration targets
        run: cargo test --workspace --all-targets --locked
      - name: Strict lint all libraries, binaries and integration targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  isolated-rust:
    name: isolated-rust (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: token-jwt-adapter
            manifest: crates/trnm-token-jwt-adapter/Cargo.toml
          - component: token-jwt-adapter-gate
            manifest: crates/trnm-token-jwt-adapter-gate/Cargo.toml
          - component: token-jwt-adapter-gate-v2
            manifest: crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
          - component: presence-router-v2
            manifest: crates/trnm-presence-router-v2/Cargo.toml
          - component: trnm-server-foundation
            manifest: crates/trnm-server/Cargo.toml
          - component: persistence-runtime-policy
            manifest: crates/trnm-persistence-runtime-policy/Cargo.toml
          - component: realtime-wire
            manifest: crates/trnm-realtime-wire/Cargo.toml
          - component: storage-nakama-version
            manifest: crates/trnm-storage-nakama-version/Cargo.toml
          - component: token-crypto-provider
            manifest: crates/trnm-token-crypto-provider/Cargo.toml
          - component: token-jwt-provider-adapter
            manifest: crates/trnm-token-jwt-provider-adapter/Cargo.toml
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format
        run: cargo fmt --manifest-path '${{ matrix.manifest }}' -- --check
      - name: Test
        run: cargo test --manifest-path '${{ matrix.manifest }}' --all-targets --locked
      - name: Strict lint
        run: cargo clippy --manifest-path '${{ matrix.manifest }}' --all-targets --locked -- -D warnings

  python-contracts:
    name: python-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Compile Python sources
        run: python3 -m compileall -q scripts tools tests
      - name: Run Python test corpus
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run API and realtime denominator contract
        run: bash scripts/check-api-rtapi-denominator.sh

  legacy-go-migration-input:
    name: legacy-go-migration-input
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Record Go toolchain
        run: go version
      - name: Verify formatting
        run: |
          set -euo pipefail
          files=$(find runtime -type f -name '*.go' -print | sort)
          test -n "$files"
          unformatted=$(printf '%s\n' "$files" | xargs gofmt -l)
          test -z "$unformatted" || { printf '%s\n' "$unformatted" >&2; exit 1; }
      - name: Test, race and vet
        working-directory: runtime
        run: |
          set -euo pipefail
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...

  external-workflow-collection:
    name: external-workflow-collection
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Require and materialize the closed exact-head PR workflow set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p run/merge-gate
          output=$(python3 scripts/check-required-workflow-runs.py \
            --repository "$CANDIDATE_REPOSITORY" \
            --head-sha "$CANDIDATE_SHA" \
            --current-run-id "$GITHUB_RUN_ID" \
            --manifest docs/governance/REQUIRED_WORKFLOWS_V1.json \
            --timeout-seconds 3000 \
            --poll-seconds 10 \
            --stable-polls 3)
          printf '%s\n' "$output"
          receipt=$(printf '%s\n' "$output" | tail -n 1)
          printf '%s\n' "$receipt" | jq -e 'type == "array" and length > 0' >/dev/null
          jq -n \
            --arg repository "$CANDIDATE_REPOSITORY" \
            --arg head "$CANDIDATE_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson workflows "$receipt" \
            '{schema:"trillionnium.required-workflow-retained-collection.v1",repository:$repository,head:$head,run_id:$run_id,run_attempt:$run_attempt,workflows:$workflows,claims:{accepted_evidence:false,gap_closed:false,production_ready:false}}' \
            > run/merge-gate/external-workflow-collection.json
          jq -e '.workflows | length > 0 and all(.jobs > 0 and .run_id > 0 and .run_attempt > 0 and (.definition_blob_sha1 | length) == 40)' \
            run/merge-gate/external-workflow-collection.json >/dev/null
          sha256sum run/merge-gate/external-workflow-collection.json \
            > run/merge-gate/SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/required-workflow-collection-${CANDIDATE_SHA}.tar.gz \
            -C run/merge-gate external-workflow-collection.json SHA256SUMS
      - name: Retain exact source-head workflow collection
        id: retained-workflow-collection
        uses: ./.github/actions/upload-evidence
        with:
          name: required-workflow-collection-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/required-workflow-collection-${{ env.CANDIDATE_SHA }}.tar.gz
          mime_type: application/gzip
      - name: Verify retained workflow collection receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained-workflow-collection.outputs.artifact_id }}'
          test '${{ steps.retained-workflow-collection.outputs.sha256 }}' != ''
          test '${{ steps.retained-workflow-collection.outputs.size_bytes }}' -gt 0

  trillionnium-game-merge-gate:
    name: trillionnium-game-merge-gate
    if: always()
    needs:
      - control-plane
      - rust-workspace
      - isolated-rust
      - python-contracts
      - legacy-go-migration-input
      - external-workflow-collection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject missing, skipped, cancelled or failed lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTROL_PLANE: ${{ needs.control-plane.result }}
          RUST_WORKSPACE: ${{ needs.rust-workspace.result }}
          ISOLATED_RUST: ${{ needs.isolated-rust.result }}
          PYTHON_CONTRACTS: ${{ needs.python-contracts.result }}
          LEGACY_GO: ${{ needs.legacy-go-migration-input.result }}
          EXTERNAL_WORKFLOWS: ${{ needs.external-workflow-collection.result }}
        run: |
          set -euo pipefail
          test "$CONTROL_PLANE" = success
          test "$RUST_WORKSPACE" = success
          test "$ISOLATED_RUST" = success
          test "$PYTHON_CONTRACTS" = success
          test "$LEGACY_GO" = success
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$EXTERNAL_WORKFLOWS" = success
          else
            test "$EXTERNAL_WORKFLOWS" = skipped
          fi
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
      - name: Fetch exact candidate for retained aggregate receipt
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Build aggregate gate receipt
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTROL_PLANE: ${{ needs.control-plane.result }}
          RUST_WORKSPACE: ${{ needs.rust-workspace.result }}
          ISOLATED_RUST: ${{ needs.isolated-rust.result }}
          PYTHON_CONTRACTS: ${{ needs.python-contracts.result }}
          LEGACY_GO: ${{ needs.legacy-go-migration-input.result }}
          EXTERNAL_WORKFLOWS: ${{ needs.external-workflow-collection.result }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/merge-gate
          jq -n \
            --arg repository "$CANDIDATE_REPOSITORY" \
            --arg head "$CANDIDATE_SHA" \
            --arg event "$EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg control_plane "$CONTROL_PLANE" \
            --arg rust_workspace "$RUST_WORKSPACE" \
            --arg isolated_rust "$ISOLATED_RUST" \
            --arg python_contracts "$PYTHON_CONTRACTS" \
            --arg legacy_go "$LEGACY_GO" \
            --arg external_workflows "$EXTERNAL_WORKFLOWS" \
            '{schema:"trillionnium.merge-gate-retained-receipt.v1",repository:$repository,head:$head,event:$event,run_id:$run_id,run_attempt:$run_attempt,lanes:{control_plane:$control_plane,rust_workspace:$rust_workspace,isolated_rust:$isolated_rust,python_contracts:$python_contracts,legacy_go:$legacy_go,external_workflows:$external_workflows},claims:{accepted_evidence:false,gap_closed:false,production_ready:false}}' \
            > run/merge-gate/final-gate-receipt.json
          if [[ "$EVENT_NAME" == pull_request ]]; then
            jq -e '.lanes | to_entries | all(.value == "success")' \
              run/merge-gate/final-gate-receipt.json >/dev/null
          else
            jq -e '.lanes.control_plane == "success" and .lanes.rust_workspace == "success" and .lanes.isolated_rust == "success" and .lanes.python_contracts == "success" and .lanes.legacy_go == "success" and .lanes.external_workflows == "skipped"' \
              run/merge-gate/final-gate-receipt.json >/dev/null
          fi
          sha256sum run/merge-gate/final-gate-receipt.json \
            > run/merge-gate/final-SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/merge-gate-final-${CANDIDATE_SHA}.tar.gz \
            -C run/merge-gate final-gate-receipt.json final-SHA256SUMS
      - name: Retain stable aggregate gate receipt
        id: retained-merge-gate
        uses: ./.github/actions/upload-evidence
        with:
          name: merge-gate-final-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/merge-gate-final-${{ env.CANDIDATE_SHA }}.tar.gz
          mime_type: application/gzip
      - name: Verify retained aggregate receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained-merge-gate.outputs.artifact_id }}'
          test '${{ steps.retained-merge-gate.outputs.sha256 }}' != ''
          test '${{ steps.retained-merge-gate.outputs.size_bytes }}' -gt 0
