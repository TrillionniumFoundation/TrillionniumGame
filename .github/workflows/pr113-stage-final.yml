name: pr113-stage-validated-final-blobs

on:
  push:
    branches:
      - ops/trusted-world-v13k-publisher-plan-v31-2026-09-08
    paths:
      - .github/workflows/pr113-stage-final.yml

permissions:
  contents: write

concurrency:
  group: pr113-stage-validated-final-blobs
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ops/trusted-world-v13k-publisher-plan-v31-2026-09-08
    steps:
      - name: Fetch exact branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          observed="$(git -C "$GITHUB_WORKSPACE" ls-remote origin \
            "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD

      - name: Generate and validate the exact final tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from __future__ import annotations

          import textwrap
          from pathlib import Path

          source = Path('.github/workflows/pr113-integrator-expression-repair.yml').read_text()
          marker = '      - name: Materialize final registered trusted publisher\n'
          section = source.index(marker)
          command = source.index("          python3 - <<'PY'\n", section)
          start = command + len("          python3 - <<'PY'\n")
          end_marker = "\n          PY\n\n      - name: Validate exact final source"
          end = source.index(end_marker, start)
          program = textwrap.dedent(source[start:end])
          namespace = {'__name__': '__main__'}
          exec(compile(program, '<pr113-final-generator>', 'exec'), namespace)

          workflow = Path('.github/workflows/world-command-deployed-runtime-v1.yml')
          value = workflow.read_text(encoding='utf-8').rstrip('\n') + '\n'
          workflow.write_text(value, encoding='utf-8')

          for temporary in (
              '.github/workflows/pr113-eof-repair.yml',
              '.github/workflows/pr113-stage-final.yml',
          ):
              path = Path(temporary)
              if not path.exists():
                  raise SystemExit(f'missing temporary workflow: {temporary}')
              path.unlink()
          PY
          git diff --check
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          test ! -e .github/workflows/trusted-world-v13k-publisher.yml
          test ! -e .github/workflows/pr113-trusted-world-integrator.yml
          test ! -e .github/workflows/pr113-integrator-expression-repair.yml
          test ! -e .github/workflows/pr113-eof-repair.yml
          test ! -e .github/workflows/pr113-stage-final.yml

      - name: Preserve validated blobs without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p .pr113-staging
          cp .github/workflows/world-command-deployed-runtime-v1.yml \
            .pr113-staging/world-command-deployed-runtime-v1.yml
          cp docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json \
            .pr113-staging/REQUIRED_WORKFLOWS_OVERLAY_V1.json
          git checkout HEAD -- \
            .github/workflows/world-command-deployed-runtime-v1.yml \
            docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json \
            .github/workflows/trusted-world-v13k-publisher.yml \
            .github/workflows/pr113-trusted-world-integrator.yml \
            .github/workflows/pr113-integrator-expression-repair.yml \
            .github/workflows/pr113-eof-repair.yml \
            .github/workflows/pr113-stage-final.yml
          actual="$(git status --short | awk '{print $2}' | sort | paste -sd, -)"
          expected=".pr113-staging/REQUIRED_WORKFLOWS_OVERLAY_V1.json,.pr113-staging/world-command-deployed-runtime-v1.yml"
          test "$actual" = "$expected"
          git config user.name trillionnium-governance-bot
          git config user.email trillionnium-governance-bot@users.noreply.github.com
          git add .pr113-staging
          git commit -m "tooling: stage validated trusted publisher blobs"
          staged="$(git rev-parse HEAD)"
          observed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git push origin "${staged}:refs/heads/${TARGET_BRANCH}"
