name: grpc-health-source

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'crates/trnm-persistence-pg/build.rs'
      - 'crates/trnm-persistence-pg/Cargo.toml'
      - 'crates/trnm-persistence-pg/proto/**'
      - 'crates/trnm-persistence-pg/src/bin/trnm_server/config.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm_server/error.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm_server/grpc.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm_server/mod.rs'
      - 'crates/trnm-persistence-pg/src/bin/trnm_server/server.rs'
      - 'contracts/grpc/nakama-healthcheck-v1.json'
      - 'docs/ARCHITECTURE.md'
      - 'docs/COMPATIBILITY.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'docs/status/TRNM_SERVER_STATUS.json'
      - 'scripts/check-rust-foundation.py'
      - 'scripts/check-trnm-server.py'
      - 'Cargo.lock'
      - '.github/workflows/grpc-health-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grpc-health-source-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  generated-healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CANDIDATE_REPOSITORY}"
          test -n "${CANDIDATE_SHA}"
          rm -rf "${GITHUB_WORKSPACE}"
          git init "${GITHUB_WORKSPACE}"
          git -C "${GITHUB_WORKSPACE}" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "${GITHUB_WORKSPACE}" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "${GITHUB_WORKSPACE}" checkout --detach FETCH_HEAD
          test "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" = "${CANDIDATE_SHA}"
      - name: Validate pinned upstream and claim boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'The current gRPC implementation represents only the pinned Nakama `Healthcheck' docs/ARCHITECTURE.md
          grep -q 'A Healthcheck source implementation' docs/COMPATIBILITY.md
          jq -e '
            .status == "source-candidate" and
            .upstream.repository == "heroiclabs/nakama" and
            .upstream.commit == "d4d92f93f78bbbe62c7fc50a3f85c772ec121a09" and
            .upstream.path == "apigrpc/apigrpc.proto" and
            .upstream.blob == "1cc63aae1aaa5dc56ede9c9d0b6f9a95ff91361c" and
            .upstream.package == "nakama.api" and
            .upstream.service == "Nakama" and
            .upstream.method == "Healthcheck" and
            .candidate.method_path == "/nakama.api.Nakama/Healthcheck" and
            .candidate.same_process_as_http_server == true and
            .toolchain.tonic == "0.14.5" and
            .toolchain.prost == "0.14.3" and
            .claims.official_method_signature_pinned == true and
            .claims.generated_rust_bindings_source_candidate == true and
            .claims.grpc_healthcheck_source_candidate == true and
            .claims.full_nakama_grpc_implemented == false and
            .claims.grpc_gateway_implemented == false and
            .claims.wire_differential_accepted == false and
            .claims.compatibility_credit == false and
            .claims.production_ready == false
          ' contracts/grpc/nakama-healthcheck-v1.json >/dev/null
          grep -Fq 'package nakama.api;' crates/trnm-persistence-pg/proto/nakama-healthcheck.proto
          grep -Fq 'rpc Healthcheck (google.protobuf.Empty) returns (google.protobuf.Empty);' \
            crates/trnm-persistence-pg/proto/nakama-healthcheck.proto
          grep -Fq 'pub const HEALTHCHECK_METHOD_PATH: &str = "/nakama.api.Nakama/Healthcheck";' \
            crates/trnm-persistence-pg/src/bin/trnm_server/grpc.rs
          grep -Fq 'tonic_prost_build::configure()' crates/trnm-persistence-pg/build.rs
          grep -Fq 'TRNM_SERVER_GRPC_BIND' crates/trnm-persistence-pg/src/bin/trnm_server/config.rs
          grep -Fq 'grpc::spawn' crates/trnm-persistence-pg/src/bin/trnm_server/server.rs
          grep -Fq 'grpc::join' crates/trnm-persistence-pg/src/bin/trnm_server/server.rs
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test generated service and process integration
        run: cargo test --package trnm-persistence-pg --bin trnm-server --locked
      - name: Strict lint generated service and process integration
        run: cargo clippy --package trnm-persistence-pg --bin trnm-server --locked -- -D warnings
      - name: Recheck source contracts
        run: |
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-trnm-server.py
