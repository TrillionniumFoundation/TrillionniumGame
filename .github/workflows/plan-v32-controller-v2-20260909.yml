name: plan-v32-controller-v2-20260909

on:
  push:
    branches:
      - codex/plan-v32-controller-v2-2026-09-09
    paths:
      - .github/workflows/plan-v32-controller-v2-20260909.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: plan-v32-final-controller
  cancel-in-progress: false

jobs:
  final-source-convergence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      TARGET_BRANCH: codex/architecture-gap-closure-2026-09-08
      TARGET_PR: "116"
    steps:
      - name: Fetch controller sources and optional provider migration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/controller" "$GITHUB_WORKSPACE/provider" "$GITHUB_WORKSPACE/target"
          git init "$GITHUB_WORKSPACE/controller"
          git -C "$GITHUB_WORKSPACE/controller" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/controller" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/controller" checkout --detach FETCH_HEAD
          test -f "$GITHUB_WORKSPACE/controller/tools/plan_v32_converge.py"
          python3 -m py_compile "$GITHUB_WORKSPACE/controller/tools/plan_v32_converge.py"

          git init "$GITHUB_WORKSPACE/provider"
          git -C "$GITHUB_WORKSPACE/provider" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$GITHUB_WORKSPACE/provider" fetch --no-tags --depth=1 origin \
            refs/heads/codex/provider-composition-transport-2026-09-09; then
            git -C "$GITHUB_WORKSPACE/provider" checkout --detach FETCH_HEAD
            test -f "$GITHUB_WORKSPACE/provider/tools/compose_crypto_provider.py"
            python3 -m py_compile "$GITHUB_WORKSPACE/provider/tools/compose_crypto_provider.py"
            printf 'true\n' > "$RUNNER_TEMP/provider-available"
          else
            printf 'false\n' > "$RUNNER_TEMP/provider-available"
          fi

      - name: Wait until the target head is stable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous=''
          stable=0
          for _ in $(seq 1 30); do
            current=$(git -C "$GITHUB_WORKSPACE/controller" ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
            test -n "$current"
            if [[ "$current" == "$previous" ]]; then
              stable=$((stable + 1))
            else
              previous=$current
              stable=1
            fi
            if [[ "$stable" -ge 6 ]]; then break; fi
            sleep 30
          done
          test "$stable" -ge 6
          printf '%s\n' "$previous" > "$RUNNER_TEMP/original-head"

      - name: Clone exact target and apply idempotent convergence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(cat "$RUNNER_TEMP/original-head")
          git init "$GITHUB_WORKSPACE/target"
          git -C "$GITHUB_WORKSPACE/target" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/target" fetch --no-tags origin "$head"
          git -C "$GITHUB_WORKSPACE/target" checkout -b "$TARGET_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD)" = "$head"
          python3 "$GITHUB_WORKSPACE/controller/tools/plan_v32_converge.py" \
            "$GITHUB_WORKSPACE/target"
          if [[ "$(cat "$RUNNER_TEMP/provider-available")" == true ]]; then
            python3 "$GITHUB_WORKSPACE/provider/tools/compose_crypto_provider.py" \
              "$GITHUB_WORKSPACE/target"
          fi
          git -C "$GITHUB_WORKSPACE/target" diff --check

      - name: Resolve exact dependencies
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo generate-lockfile
          for manifest in \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml; do
            cargo generate-lockfile --manifest-path "$manifest"
          done
          cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/metadata.json"

      - name: Run complete control-plane validation
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/control.log") 2>&1
          python3 scripts/check-production-crypto-paths.py
          python3 scripts/check-jwt-rustcrypto-backend.py
          python3 scripts/check-workspace-convergence.py
          python3 scripts/check-single-server-authority.py
          if [[ -x scripts/check-auth-provider-composition.py ]]; then
            python3 scripts/check-auth-provider-composition.py
          fi
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-trnm-server.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -q

      - name: Run complete Rust validation
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/rust.log") 2>&1
          cargo fmt --all
          for manifest in \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml; do
            cargo fmt --manifest-path "$manifest"
          done
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml; do
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          cargo test -p trnm-persistence-pg --features diagnostic-compat-server \
            --bin trnm-pg-compat-server --locked
          cargo clippy -p trnm-persistence-pg --features diagnostic-compat-server \
            --bin trnm-pg-compat-server --locked -- -D warnings
          bash scripts/check-rust-server-process.sh

      - name: Run Go test, race and vet
        working-directory: target/runtime
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/go.log") 2>&1
          test -z "$(gofmt -l .)"
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...

      - name: Publish one ordinary fast-forward commit
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          remote=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test "$remote" = "$original"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            printf '%s\n' "$original" > "$RUNNER_TEMP/published-head"
          else
            git commit -m 'architecture: finalize Plan v3.2 source convergence'
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
            git rev-parse HEAD > "$RUNNER_TEMP/published-head"
          fi

      - name: Record exact successful source state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(cat "$RUNNER_TEMP/published-head")
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" \
            -f body="Final serial Plan v3.2 source convergence passed control-plane, Rust all-target strict Clippy, process smoke and Go race/vet at \`$head\`. This is source-candidate evidence only: independent acceptance, complete product parity, production infrastructure and all-gap closure remain false." >/dev/null

      - name: Record deterministic failure without modifying target
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head" 2>/dev/null || printf unknown)
          {
            printf 'Final serial Plan v3.2 controller failed closed; target was not force-updated.\n\n```text\nhead=%s\n' "$original"
            for name in control rust go; do
              file="$RUNNER_TEMP/${name}.log"
              if [[ -f "$file" ]]; then
                printf '\n=== %s tail ===\n' "$name"
                tail -n 100 "$file"
              fi
            done
            printf '\n```\n'
          } > "$RUNNER_TEMP/v2-failure.md"
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" \
            -f body="$(tail -c 60000 "$RUNNER_TEMP/v2-failure.md")" >/dev/null

      - name: Delete all source transport branches after success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            codex/architecture-convergence-transport-2026-09-08 \
            codex/workspace-convergence-transport-2026-09-09 \
            codex/final-convergence-transport-2026-09-09 \
            codex/jwt-rustcrypto-transport-2026-09-09 \
            codex/single-server-transport-2026-09-09 \
            codex/provider-composition-transport-2026-09-09 \
            codex/plan-v32-controller-2026-09-09 \
            codex/plan-v32-controller-v2-2026-09-09; do
            git -C "$GITHUB_WORKSPACE/target" push origin --delete "$branch" || true
          done
