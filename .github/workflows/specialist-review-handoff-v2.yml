name: specialist-review-handoff-v2

on:
  push:
    branches: [tooling/governance-readback-v2-2026-09-07]
    paths:
      - '.github/workflows/specialist-review-handoff-v2.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_PR: '63'
      TARGET_HEAD: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
      TARGET_TREE: 9d3ae2fadb2684f095855ecf16307376b55a440f
      TARGET_MERGE: 6965f95d03031156edc92cc862bd979ff87e9edb
    steps:
      - name: Build current exact-head evidence inventory and route specialist decisions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, urllib.error, urllib.parse, urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          api = f'https://api.github.com/repos/{repository}'
          token = os.environ['GH_TOKEN']
          target_pr = int(os.environ['TARGET_PR'])
          target_head = os.environ['TARGET_HEAD']
          target_tree = os.environ['TARGET_TREE']
          target_merge = os.environ['TARGET_MERGE']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'trillionnium-specialist-review-handoff-v2',
          }

          def call(url, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
                      return response.status, json.loads(raw.decode('utf-8')) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      value = json.loads(raw.decode('utf-8')) if raw else None
                  except Exception:
                      value = {'message': raw.decode('utf-8', errors='replace')[:2000]}
                  return error.code, value

          pcode, pr = call(api + f'/pulls/{target_pr}')
          if pcode != 200 or not isinstance(pr, dict):
              raise SystemExit(f'cannot read PR: HTTP {pcode}')
          if (pr.get('head') or {}).get('sha') != target_head or pr.get('merge_commit_sha') != target_merge:
              raise SystemExit('target tuple moved')
          ccode, commit = call(api + f'/git/commits/{target_head}')
          if ccode != 200 or ((commit or {}).get('tree') or {}).get('sha') != target_tree:
              raise SystemExit('target tree mismatch')

          rcode, run_payload = call(api + f'/actions/runs?head_sha={target_head}&per_page=100')
          if rcode != 200 or not isinstance(run_payload, dict):
              raise SystemExit(f'cannot read current-head runs: HTTP {rcode}')
          latest = {}
          for row in run_payload.get('workflow_runs', []):
              key = int(row.get('workflow_id') or 0)
              rank = (int(row.get('run_attempt') or 0), int(row.get('id') or 0))
              previous = latest.get(key)
              old = (int(previous.get('run_attempt') or 0), int(previous.get('id') or 0)) if previous else (-1, -1)
              if previous is None or rank > old:
                  latest[key] = row
          non_success = [
              row for row in latest.values()
              if row.get('status') != 'completed' or row.get('conclusion') != 'success'
          ]
          artifacts = []
          for row in sorted(latest.values(), key=lambda item: str(item.get('name') or '')):
              acode, payload = call(api + f"/actions/runs/{row['id']}/artifacts?per_page=100")
              if acode != 200 or not isinstance(payload, dict):
                  continue
              for artifact in payload.get('artifacts', []):
                  artifacts.append({
                      'workflow': row.get('name'), 'run_id': row.get('id'),
                      'run_attempt': row.get('run_attempt'), 'artifact_id': artifact.get('id'),
                      'name': artifact.get('name'), 'size_in_bytes': artifact.get('size_in_bytes'),
                      'digest': artifact.get('digest'), 'expired': artifact.get('expired'),
                      'expires_at': artifact.get('expires_at'),
                  })

          packet = {
              'schema': 'trillionnium.specialist-review-handoff.v2',
              'target': {
                  'repository': repository, 'pull_request': target_pr,
                  'base': (pr.get('base') or {}).get('sha'), 'head': target_head,
                  'tree': target_tree, 'prospective_merge': target_merge,
              },
              'workflow_summary': {
                  'latest_family_count': len(latest), 'non_success_count': len(non_success),
                  'latest': [
                      {'workflow_id': row.get('workflow_id'), 'name': row.get('name'),
                       'run_id': row.get('id'), 'attempt': row.get('run_attempt'),
                       'status': row.get('status'), 'conclusion': row.get('conclusion')}
                      for row in sorted(latest.values(), key=lambda item: str(item.get('name') or ''))
                  ],
              },
              'artifacts': artifacts,
              'claims': {
                  'review_requested_is_acceptance': False,
                  'accepted_evidence': False,
                  'gap_closed': False,
                  'production_ready': False,
              },
          }
          domains = [
              {
                  'issue': 35, 'name': 'Security / cryptography',
                  'gaps': ['GAP-P0-CRYPTO-001', 'GAP-P1-CRYPTO-002', 'GAP-P1-PG-001'],
                  'questions': [
                      'Are JWT parsing, algorithm selection, exact signature length, key-domain separation, epoch rotation/revocation and provider failure semantics acceptable for this exact tuple?',
                      'Do the retained malformed/fuzz/security packets and dependency boundary support an explicit ACCEPT or REQUEST_CHANGES decision?',
                  ],
              },
              {
                  'issue': 36, 'name': 'Database / data integrity / compatibility QA',
                  'gaps': ['GAP-P0-DATA-001', 'GAP-P1-PG-001', 'GAP-P1-TEST-001'],
                  'questions': [
                      'Do PostgreSQL and CockroachDB packets bind the authoritative migration digest and prove distinct live, timeout, cancellation, retry and response-loss behavior?',
                      'Are retained profile artifacts internally reproducible and sufficient for a current-tuple specialist decision?',
                  ],
              },
              {
                  'issue': 47, 'name': 'Outbox durability',
                  'gaps': ['GAP-P1-OUTBOX-001'],
                  'questions': [
                      'Does attempt exhaustion perform one atomic terminal transition without stranded leases?',
                      'Do crash-before-publish and crash-after-publish packets, stale-owner/property vectors and sealed member digests support acceptance?',
                  ],
              },
              {
                  'issue': 48, 'name': 'SRE / operations',
                  'gaps': ['GAP-P0-SERVER-001', 'GAP-P1-PG-001'],
                  'questions': [
                      'Are bounded startup/readiness/drain, request deadlines, pool/cancellation and live profile behavior operationally acceptable for the current scope?',
                      'Which HA/PITR/capacity/endurance facts remain external blockers rather than source defects?',
                  ],
              },
              {
                  'issue': 46, 'name': 'Compatibility denominator / global SG1',
                  'gaps': ['GAP-P0-SCOPE-001', 'GAP-P1-STORAGE-001'],
                  'questions': [
                      'Are all denominator families and leaves reproducible, non-shrinking and independently classified?',
                      'Does the exact bundle merit a separate global SG1 acceptance, or which concrete leaves remain unresolved?',
                  ],
              },
              {
                  'issue': 7, 'name': 'Program governance / whole-candidate admission',
                  'gaps': ['GAP-P0-CI-001', 'GAP-P0-GOV-001', 'GAP-P0-PR-001', 'GAP-P0-PLAN-001', 'GAP-P0-EVIDENCE-001', 'GAP-P1-DOCS-001', 'GAP-P1-BRANCH-001', 'GAP-P1-REVIEW-001'],
                  'questions': [
                      'Does the authenticated protection/ruleset read-back and harmless negative rehearsal meet the governance closure criteria?',
                      'After all specialist decisions, is the unchanged exact tuple eligible for a fresh whole-PR APPROVE through the ordinary protected path?',
                  ],
              },
          ]
          artifact_lines = [
              f"- `{row['workflow']}` run `{row['run_id']}` attempt `{row['run_attempt']}` → artifact `{row['artifact_id']}` `{row['name']}`, `{row['size_in_bytes']}` bytes, `{row['digest']}`, expired=`{str(row['expired']).lower()}`"
              for row in artifacts
          ]
          for domain in domains:
              marker = f"<!-- TRNM-SPECIALIST-HANDOFF-V2:{domain['issue']} -->"
              lines = [
                  marker,
                  f"## Exact-head specialist handoff — {domain['name']}",
                  '',
                  f'- PR/base/head/tree/merge: `#{target_pr}` / `{packet["target"]["base"]}` / `{target_head}` / `{target_tree}` / `{target_merge}`',
                  f"- latest required workflow families: `{len(latest)}`; non-success: `{len(non_success)}`",
                  f"- mapped gaps: `{', '.join(domain['gaps'])}`",
                  '',
                  '### Decision questions',
              ]
              lines.extend(f'- {question}' for question in domain['questions'])
              lines += ['', '### Current retained artifacts']
              lines.extend(artifact_lines or ['- No retained artifact was discoverable; this remains blocking.'])
              lines += [
                  '',
                  'Please record an explicit exact-tuple `ACCEPT` or `REQUEST_CHANGES` decision with limitations. A request, comment, source presence or CI success is not acceptance. This handoff creates no evidence/gap/production credit.',
              ]
              body = '\n'.join(lines)
              ic, comments = call(api + f"/issues/{domain['issue']}/comments?per_page=100")
              existing = []
              if ic == 200 and isinstance(comments, list):
                  existing = [row for row in comments if marker in str(row.get('body') or '') and (row.get('user') or {}).get('login') == 'github-actions[bot]']
              if existing:
                  call(api + f"/issues/comments/{existing[-1]['id']}", method='PATCH', body={'body': body})
              else:
                  call(api + f"/issues/{domain['issue']}/comments", method='POST', body={'body': body})

          call(api + f'/pulls/{target_pr}/requested_reviewers', method='POST', body={'reviewers': ['Tomasrgbsf']})
          print(json.dumps(packet, sort_keys=True))
          if non_success:
              raise SystemExit(f'current tuple has {len(non_success)} non-success workflow families')
          if not artifacts:
              raise SystemExit('no retained current-head artifacts were discoverable')
          PY
