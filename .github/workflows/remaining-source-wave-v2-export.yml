name: remaining-source-wave-v3-export

on:
  push:
    branches: [tooling/remaining-source-wave-v2-2026-09-06]
    paths:
      - '.github/workflows/remaining-source-wave-v2-export.yml'

permissions:
  contents: write

concurrency:
  group: remaining-source-wave-v3-export
  cancel-in-progress: true

jobs:
  compose-validate-export:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      BASE_SHA: 7deee4377cff401854647151842c582f038feef1
      OUTBOX_SHA: 4ce383a55d76a8b2b05827c5017b36f9789c02bd
      SESSION_SHA: 0d0f246a131902403202afcd28103f22af30c8a9
      REALTIME_SHA: 4a72ecdb9341faa9c5211b3479f58d075f75a7ba
      SERVER_SHA: 4c6abde65938ceb97b706111b95f6878e64375d5
      HARDENING_SHA: f3e9476ff8b6d781b61ad35c135041eddddcfcff
      PRODUCT_BRANCH: codex/remaining-source-blockers-wave-v3-2026-09-06
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact source surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags origin \
            "$BASE_SHA:refs/remotes/source/base" \
            "$OUTBOX_SHA:refs/remotes/source/outbox" \
            "$SESSION_SHA:refs/remotes/source/session" \
            "$REALTIME_SHA:refs/remotes/source/realtime" \
            "$SERVER_SHA:refs/remotes/source/server" \
            "$HARDENING_SHA:refs/remotes/source/hardening"
          git -C "$GITHUB_WORKSPACE/source" checkout -b "$PRODUCT_BRANCH" "$BASE_SHA"
          for ref in outbox session realtime server hardening; do
            git -C "$GITHUB_WORKSPACE/source" merge-base --is-ancestor \
              "$BASE_SHA" "refs/remotes/source/$ref"
          done

      - name: Compose exact source diffs and apply reviewed session hardening
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git diff --binary "$BASE_SHA" refs/remotes/source/outbox -- \
            crates/trnm-persistence-core/tests/outbox_state_model.rs \
            | git apply --index --3way
          git diff --binary "$BASE_SHA" refs/remotes/source/session -- \
            crates/trnm-presence-router-v2 \
            | git apply --index --3way

          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml
          git show refs/remotes/source/hardening:tools/apply-session-registry-hardening.py.gz.b64 \
            | base64 -d | gzip -dc > "$RUNNER_TEMP/apply-session-registry-hardening.py"
          python3 -m py_compile "$RUNNER_TEMP/apply-session-registry-hardening.py"
          python3 "$RUNNER_TEMP/apply-session-registry-hardening.py" "$PWD"

          git diff --binary "$BASE_SHA" refs/remotes/source/realtime -- \
            crates/trnm-presence-router-v2/src/connection_actor.rs \
            crates/trnm-presence-router-v2/src/disconnect_journal.rs \
            crates/trnm-presence-router-v2/src/reconnect_cursor.rs \
            | git apply --index --3way
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/trnm-presence-router-v2/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          module_anchor = 'mod router;\nmod session_registry;\nmod types;\n'
          module_replacement = (
              'mod connection_actor;\nmod disconnect_journal;\nmod reconnect_cursor;\n'
              'mod router;\nmod session_registry;\nmod types;\n'
          )
          if text.count(module_anchor) != 1:
              raise SystemExit('module anchor drift')
          text = text.replace(module_anchor, module_replacement, 1)
          export_anchor = 'pub use router::{MutationDisposition, PresenceDelta, PresenceError, PresenceRouter};\n'
          exports = (
              'pub use connection_actor::{\n'
              '    ConnectionActor, ConnectionActorConfig, ConnectionActorError, ConnectionActorState,\n'
              '    CorrelationId, InboundFrame, OutboundFrame, PendingRequest,\n};\n'
              'pub use disconnect_journal::{\n'
              '    DisconnectIntentId, DisconnectJournal, DisconnectJournalError, DisconnectOperation,\n'
              '    DisconnectRecord, DisconnectState, LeaseToken, RetryDisposition, WorkerId,\n};\n'
              'pub use reconnect_cursor::{\n'
              '    ReconnectCursor, ReconnectEvent, ReconnectJournal, ReconnectJournalConfig,\n'
              '    ReconnectJournalError,\n};\n'
          )
          if text.count(export_anchor) != 1:
              raise SystemExit('export anchor drift')
          path.write_text(text.replace(export_anchor, exports + export_anchor, 1), encoding='utf-8')
          PY

          git diff --binary "$BASE_SHA" refs/remotes/source/server -- crates/trnm-server \
            | git apply --index --3way
          sed -i 's/[[:space:]]\+$//' crates/trnm-server/README.md
          test -f crates/trnm-persistence-core/tests/outbox_state_model.rs
          test -f crates/trnm-presence-router-v2/src/session_registry.rs
          test -f crates/trnm-presence-router-v2/src/connection_actor.rs
          test -f crates/trnm-presence-router-v2/src/disconnect_journal.rs
          test -f crates/trnm-presence-router-v2/src/reconnect_cursor.rs
          test -f crates/trnm-server/src/runtime/server.rs
          test -f crates/trnm-server/src/runtime/retry_atomicity.rs
          git add -A
          git diff --cached --check

      - name: Generate canonical standalone server lock and normalize formatting
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path crates/trnm-server/Cargo.toml
          cargo fmt --all
          for manifest in \
            crates/trnm-persistence-core/Cargo.toml \
            crates/trnm-presence-router-v2/Cargo.toml \
            crates/trnm-server/Cargo.toml; do
            cargo fmt --manifest-path "$manifest"
          done
          git add -A
          test -s crates/trnm-server/Cargo.lock
          grep -q '^version = 4$' crates/trnm-server/Cargo.lock
          git diff --cached --check

      - name: Validate root and isolated Rust surfaces
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in \
            crates/trnm-persistence-core/Cargo.toml \
            crates/trnm-presence-router-v2/Cargo.toml \
            crates/trnm-server/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          TRNM_SERVER_DATABASE_URL='postgresql://candidate:secret@127.0.0.1/trnm' \
          TRNM_SERVER_DATABASE_PROFILE=postgresql \
          TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE=1 \
          TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$BASE_SHA" \
          TRNM_SERVER_ADMIN_TOKEN='candidate-admin-token-with-sufficient-length' \
          cargo run --quiet --manifest-path crates/trnm-server/Cargo.toml --locked \
            --bin trnm-server -- check-config > "$RUNNER_TEMP/check-config.log"
          grep -q 'trnm-server configuration:' "$RUNNER_TEMP/check-config.log"
          grep -q '<redacted>' "$RUNNER_TEMP/check-config.log"
          ! grep -Eq '(candidate-admin-token|candidate:secret|BEGIN PRIVATE KEY)' \
            "$RUNNER_TEMP/check-config.log"

      - name: Validate Go runtime and complete control plane
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          files=$(find runtime -type f -name '*.go' -print | sort)
          test -n "$files"
          test -z "$(printf '%s\n' "$files" | xargs gofmt -l)"
          (cd runtime && go test ./... -count=1 && go test -race ./... -count=1 && go vet ./...)
          python3 -m compileall -q scripts tools tests
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"

      - name: Commit and publish exact cumulative candidate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "feat: integrate remaining Plan v3.1 source blocker wave"
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          test -z "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}")"
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          printf 'product_head=%s\nproduct_tree=%s\nchanged_paths=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^{tree})" \
            "$(git diff --name-only "$BASE_SHA" HEAD | wc -l | tr -d ' ')"
