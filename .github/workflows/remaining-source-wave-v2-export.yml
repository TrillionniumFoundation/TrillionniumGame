name: remaining-source-wave-v2-export

on:
  push:
    branches: [tooling/remaining-source-wave-v2-2026-09-06]
    paths:
      - '.github/workflows/remaining-source-wave-v2-export.yml'

permissions:
  contents: write

jobs:
  compose-validate-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_SHA: 7deee4377cff401854647151842c582f038feef1
      OUTBOX_BRANCH: codex/outbox-property-coverage-2026-09-06
      SESSION_BRANCH: codex/session-registry-hardening-v2-2026-09-06
      SERVER_BRANCH: codex/server-composition-root-2026-09-06
      PRODUCT_BRANCH: codex/remaining-source-blockers-wave-v2-2026-09-06
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact source surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags origin \
            "$BASE_SHA" \
            "refs/heads/${OUTBOX_BRANCH}:refs/remotes/origin/outbox" \
            "refs/heads/${SESSION_BRANCH}:refs/remotes/origin/session" \
            "refs/heads/${SERVER_BRANCH}:refs/remotes/origin/server"
          git -C "$GITHUB_WORKSPACE/source" checkout -b "$PRODUCT_BRANCH" "$BASE_SHA"
          for ref in outbox session server; do
            git -C "$GITHUB_WORKSPACE/source" merge-base --is-ancestor \
              "$BASE_SHA" "refs/remotes/origin/$ref"
          done
          printf 'base=%s\noutbox=%s\nsession=%s\nserver=%s\n' \
            "$BASE_SHA" \
            "$(git -C "$GITHUB_WORKSPACE/source" rev-parse refs/remotes/origin/outbox)" \
            "$(git -C "$GITHUB_WORKSPACE/source" rev-parse refs/remotes/origin/session)" \
            "$(git -C "$GITHUB_WORKSPACE/source" rev-parse refs/remotes/origin/server)"

      - name: Apply exact child diffs to one linear candidate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git diff --binary "$BASE_SHA" refs/remotes/origin/outbox -- \
            crates/trnm-persistence-core/tests/outbox_state_model.rs \
            | git apply --index --3way
          git diff --binary "$BASE_SHA" refs/remotes/origin/session -- \
            crates/trnm-presence-router-v2 \
            | git apply --index --3way
          git diff --binary "$BASE_SHA" refs/remotes/origin/server \
            | git apply --index --3way
          test -f crates/trnm-persistence-core/tests/outbox_state_model.rs
          test -f crates/trnm-presence-router-v2/src/session_registry.rs
          test -f crates/trnm-server/src/runtime/server.rs
          test ! -e crates/trnm-persistence-pg/src/bin/trnm-server.rs
          test ! -e crates/trnm-persistence-pg/src/bin/trnm_server
          git diff --cached --check

      - name: Generate canonical standalone server lock
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo generate-lockfile --manifest-path crates/trnm-server/Cargo.toml
          git add crates/trnm-server/Cargo.lock
          test -s crates/trnm-server/Cargo.lock
          grep -q '^version = 4$' crates/trnm-server/Cargo.lock

      - name: Validate root and isolated Rust surfaces
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in \
            crates/trnm-persistence-core/Cargo.toml \
            crates/trnm-presence-router-v2/Cargo.toml \
            crates/trnm-server/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          cargo run --quiet --manifest-path crates/trnm-server/Cargo.toml --locked \
            --bin trnm-server -- check-config 2>&1 | tee "$RUNNER_TEMP/check-config.log" || true
          ! grep -E '(postgres://|password=|BEGIN PRIVATE KEY|TRNM_SERVER_ADMIN_TOKEN=)' \
            "$RUNNER_TEMP/check-config.log"

      - name: Validate Go runtime and complete control plane
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          files=$(find runtime -type f -name '*.go' -print | sort)
          test -n "$files"
          test -z "$(printf '%s\n' "$files" | xargs gofmt -l)"
          (cd runtime && go test ./... -count=1 && go test -race ./... -count=1 && go vet ./...)
          python3 -m compileall -q scripts tools tests
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"

      - name: Commit and publish exact cumulative candidate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "feat: integrate remaining Plan v3.1 source blocker wave"
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          printf 'product_head=%s\nproduct_tree=%s\nchanged_paths=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^{tree})" \
            "$(git diff --name-only "$BASE_SHA" HEAD | wc -l | tr -d ' ')"
