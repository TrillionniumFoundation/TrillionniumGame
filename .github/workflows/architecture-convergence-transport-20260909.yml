name: architecture-convergence-transport-20260909

on:
  push:
    branches:
      - codex/architecture-convergence-transport-2026-09-08
    paths:
      - .github/workflows/architecture-convergence-transport-20260909.yml

permissions:
  contents: write

concurrency:
  group: architecture-convergence-transport-20260909
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/architecture-gap-closure-2026-09-08
    steps:
      - name: Fetch target branch with exact write identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/target"
          git init "$GITHUB_WORKSPACE/target"
          git -C "$GITHUB_WORKSPACE/target" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/target" fetch --no-tags origin \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git -C "$GITHUB_WORKSPACE/target" checkout -b "$TARGET_BRANCH" \
            "refs/remotes/origin/${TARGET_BRANCH}"
          git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD | tee "$RUNNER_TEMP/original-head"
          git -C "$GITHUB_WORKSPACE/target" rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/original-tree"

      - name: Apply production crypto and temporary-workflow convergence
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')

          # One-shot source transport served its purpose and must never remain in
          # the candidate that receives ordinary PR workflow credit.
          for relative in (
              '.github/workflows/architecture-source-export-one-shot.yml',
              '.github/workflows/architecture-test-name-one-shot.yml',
          ):
              (root / relative).unlink(missing_ok=True)

          app_path = root / 'crates/trnm-persistence-pg/src/bin/trnm_server/app.rs'
          app = app_path.read_text(encoding='utf-8')
          app = re.sub(
              r'\nfn constant_time_eq\(left: &\[u8\], right: &\[u8\]\) -> bool \{.*?\n\}\n\nconst fn http_status',
              '\nconst fn http_status',
              app,
              count=1,
              flags=re.S,
          )
          if 'constant_time_eq(' in app:
              app = app.replace('constant_time_eq(', 'memcmp::eq(')
          if 'memcmp::eq(' in app and 'use openssl::memcmp;' not in app:
              marker = 'use std::sync::{Arc, Mutex};\n'
              if marker not in app:
                  raise SystemExit('app import anchor missing')
              app = app.replace(marker, 'use openssl::memcmp;\n' + marker, 1)
          if 'fn constant_time_eq' in app:
              raise SystemExit('custom app comparison helper remains')
          app_path.write_text(app, encoding='utf-8')

          worker_path = root / 'crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs'
          worker = worker_path.read_text(encoding='utf-8')
          worker = worker.replace('use trnm_token_jwt_adapter::sha256_digest;\n', '')
          if 'use openssl::sha::sha256;' not in worker:
              marker = 'use trnm_contracts::{Digest32, DomainError, RetryClass};\n'
              if marker not in worker:
                  raise SystemExit('outbox import anchor missing')
              worker = worker.replace(marker, 'use openssl::sha::sha256;\n\n' + marker, 1)
          worker = worker.replace('sha256_digest(', 'sha256(')
          worker = worker.replace('if constant_time_eq(&actual, expected) {', 'if actual == expected {')
          worker = re.sub(
              r'\nfn constant_time_eq\(left: &\[u8\], right: &\[u8\]\) -> bool \{.*?\n\}\n\n#\[cfg\(test\)\]',
              '\n#[cfg(test)]',
              worker,
              count=1,
              flags=re.S,
          )
          for forbidden in ('trnm_token_jwt_adapter::sha256_digest', 'fn constant_time_eq'):
              if forbidden in worker:
                  raise SystemExit(f'outbox private primitive remains: {forbidden}')
          worker_path.write_text(worker, encoding='utf-8')

          authority_path = root / 'docs/development/CRYPTO_PATH_AUTHORITY.json'
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          providers = {row['id']: row for row in authority['approved_primitive_providers']}
          provider = providers['PROVIDER-OPENSSL-HMAC-SHA256']
          operation = 'SHA-256 for durable spool receipts, retry jitter and failure-reason digests'
          if operation not in provider['operations']:
              provider['operations'].append(operation)
          paths = {row['id']: row for row in authority['path_classifications']}
          outbox = paths['CRYPTO-PATH-ACTIVE-OUTBOX-DIGEST']
          outbox.update({
              'classification': 'active-durable-spool-reviewed-primitive-source-candidate',
              'implementation': 'openssl::sha::sha256 plus ordinary equality for public deterministic spool bytes',
              'primitive_provider': 'PROVIDER-OPENSSL-HMAC-SHA256',
              'private_primitive_reachable': False,
              'required_acceptance': 'Retain byte-stability, fault and independent data-integrity/security evidence for the exact candidate.',
          })
          outbox.pop('required_remediation', None)
          summary = authority['summary']
          summary['all_active_crypto_paths_reviewed_provider_backed'] = True
          summary['production_key_provider_accepted'] = False
          summary['private_compatibility_implementation_removed'] = False
          summary['gap_closed'] = False
          summary['production_ready'] = False
          authority_path.write_text(
              json.dumps(authority, indent=2, sort_keys=False) + '\n',
              encoding='utf-8',
          )

          checker = root / 'scripts/check-production-crypto-paths.py'
          checker.write_text('''#!/usr/bin/env python3
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          APP = ROOT / "crates/trnm-persistence-pg/src/bin/trnm_server/app.rs"
          WORKER = ROOT / "crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs"
          AUTHORITY = ROOT / "docs/development/CRYPTO_PATH_AUTHORITY.json"

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          app = APP.read_text(encoding="utf-8")
          worker = WORKER.read_text(encoding="utf-8")
          require("fn constant_time_eq" not in app, "custom app comparison helper is forbidden")
          require("memcmp::eq(" in app, "app must use OpenSSL constant-time comparison")
          require("fn constant_time_eq" not in worker, "custom outbox comparison helper is forbidden")
          require("trnm_token_jwt_adapter::sha256_digest" not in worker, "outbox must not reach private JWT SHA")
          require("openssl::sha::sha256" in worker, "outbox must use reviewed SHA-256 provider")
          authority = json.loads(AUTHORITY.read_text(encoding="utf-8"))
          rows = {row["id"]: row for row in authority["path_classifications"]}
          outbox = rows["CRYPTO-PATH-ACTIVE-OUTBOX-DIGEST"]
          require(outbox["private_primitive_reachable"] is False, "outbox authority is stale")
          require(outbox["primitive_provider"] == "PROVIDER-OPENSSL-HMAC-SHA256", "outbox provider is stale")
          require(authority["summary"]["gap_closed"] is False, "source checks cannot close the security gap")
          print("production crypto path validation passed")
          ''').write_text if False else None
          # Dedent separately to avoid YAML indentation becoming Python source indentation.
          import textwrap
          checker.write_text(textwrap.dedent('''\
          #!/usr/bin/env python3
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          APP = ROOT / "crates/trnm-persistence-pg/src/bin/trnm_server/app.rs"
          WORKER = ROOT / "crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs"
          AUTHORITY = ROOT / "docs/development/CRYPTO_PATH_AUTHORITY.json"

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          app = APP.read_text(encoding="utf-8")
          worker = WORKER.read_text(encoding="utf-8")
          require("fn constant_time_eq" not in app, "custom app comparison helper is forbidden")
          require("memcmp::eq(" in app, "app must use OpenSSL constant-time comparison")
          require("fn constant_time_eq" not in worker, "custom outbox comparison helper is forbidden")
          require("trnm_token_jwt_adapter::sha256_digest" not in worker, "outbox must not reach private JWT SHA")
          require("openssl::sha::sha256" in worker, "outbox must use reviewed SHA-256 provider")
          authority = json.loads(AUTHORITY.read_text(encoding="utf-8"))
          rows = {row["id"]: row for row in authority["path_classifications"]}
          outbox = rows["CRYPTO-PATH-ACTIVE-OUTBOX-DIGEST"]
          require(outbox["private_primitive_reachable"] is False, "outbox authority is stale")
          require(outbox["primitive_provider"] == "PROVIDER-OPENSSL-HMAC-SHA256", "outbox provider is stale")
          require(authority["summary"]["gap_closed"] is False, "source checks cannot close the security gap")
          print("production crypto path validation passed")
          '''), encoding='utf-8')
          checker.chmod(0o755)

          test_path = root / 'tests/control_plane/test_production_crypto_paths.py'
          test_path.write_text(textwrap.dedent('''\
          from __future__ import annotations

          import subprocess
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]

          class ProductionCryptoPathsTest(unittest.TestCase):
              def test_repository_checker(self) -> None:
                  subprocess.run(
                      ["python3", "scripts/check-production-crypto-paths.py"],
                      cwd=ROOT,
                      check=True,
                  )

          if __name__ == "__main__":
              unittest.main()
          '''), encoding='utf-8')

          merge_gate_path = root / '.github/workflows/trillionnium-game-merge-gate.yml'
          merge_gate = merge_gate_path.read_text(encoding='utf-8')
          step_anchor = (
              '      - name: Validate Rust server source contract\n'
              '        run: python3 scripts/check-trnm-server.py\n'
          )
          step = (
              '      - name: Validate production cryptographic paths\n'
              '        run: python3 scripts/check-production-crypto-paths.py\n'
          )
          if step not in merge_gate:
              if step_anchor not in merge_gate:
                  raise SystemExit('merge gate step anchor missing')
              merge_gate = merge_gate.replace(step_anchor, step_anchor + step, 1)
          compile_anchor = '            scripts/check-trnm-server.py\n'
          compile_line = '            scripts/check-production-crypto-paths.py\n'
          if compile_line not in merge_gate:
              if compile_anchor not in merge_gate:
                  raise SystemExit('merge gate compile anchor missing')
              merge_gate = merge_gate.replace(compile_anchor, compile_anchor + compile_line, 1)
          merge_gate_path.write_text(merge_gate, encoding='utf-8')
          PY
          git diff --check
          python3 scripts/check-production-crypto-paths.py
          python3 -m unittest tests.control_plane.test_production_crypto_paths -v

      - name: Run control-plane and language validation
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-rust-package-inventory.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          (
            cd runtime
            gofmt -w .
            test -z "$(gofmt -l .)"
            go test ./... -count=1
            go test -race ./... -count=1
            go vet ./...
          )
          git diff --check
          test -z "$(git status --porcelain | awk '$1 == "??" && $2 ~ /(^|\/)target\//')"

      - name: Commit and fast-forward the target candidate
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          test "$(git rev-parse HEAD)" = "$original"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'security: remove private primitives from active process paths'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          git rev-parse HEAD | tee "$RUNNER_TEMP/published-head"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/published-tree"

      - name: Remove the transport branch after successful publication
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/target" push origin \
            --delete codex/architecture-convergence-transport-2026-09-08
