name: plan-v32-social-bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: plan-v32-social-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize-social-core:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/plan-v32-social-core-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch the exact social surface head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$GITHUB_WORKSPACE" config --local \
            http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin \
            "+refs/heads/${GITHUB_HEAD_REF}:refs/remotes/origin/${GITHUB_HEAD_REF}"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_HEAD_REF" \
            "refs/remotes/origin/${GITHUB_HEAD_REF}"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Verify and materialize the bounded payload
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          archive="$RUNNER_TEMP/plan-v32-social-bootstrap.tar.gz"
          payload="$RUNNER_TEMP/plan-v32-social-bootstrap.tar.gz.b64"
          : > "$payload"
          for part in tools/plan-v32-social-bootstrap.tar.gz.b64.part-*; do
            test -f "$part"
            cat "$part" >> "$payload"
          done
          base64 --decode "$payload" > "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = \
            '61fe88f25be9bf83f53392b14d78e5ec65c1e937eb81f6433b0f68acb72d0384'
          actual="$(tar -tzf "$archive" | grep -v '/$' | LC_ALL=C sort)"
          expected="$(cat <<'FILES'
          crates/trnm-social-core/Cargo.toml
          crates/trnm-social-core/README.md
          crates/trnm-social-core/src/lib.rs
          tools/plan-v32-social-existing.patch
          FILES
          )"
          test "$actual" = "$expected"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE" --no-same-owner
          git apply --check tools/plan-v32-social-existing.patch
          git apply tools/plan-v32-social-existing.patch
          rm -f \
            .github/workflows/plan-v32-social-bootstrap.yml \
            tools/plan-v32-social-bootstrap.tar.gz.b64.part-* \
            tools/plan-v32-social-existing.patch

      - name: Validate the materialized source candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --package trnm-social-core --all-targets --locked
          cargo clippy --package trnm-social-core --all-targets --locked -- -D warnings
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-workspace-convergence.py
          python3 -m unittest \
            tests.control_plane.test_documentation_authority -v
          git diff --check

      - name: Commit the clean social surface
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test ! -e .github/workflows/plan-v32-social-bootstrap.yml
          test -z "$(find tools -maxdepth 1 -name 'plan-v32-social-bootstrap.tar.gz.b64.part-*' -print -quit)"
          test ! -e tools/plan-v32-social-existing.patch
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'social: add bounded social domain core'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
