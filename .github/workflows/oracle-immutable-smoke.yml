name: trillionnium-game-immutable-oracle

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'oracle/immutable/**'
      - 'config/oracle-normalizers.json'
      - 'tools/oracle/**'
      - 'scripts/oracle/**'
      - 'tests/oracle/**'
      - 'scripts/upload-actions-artifact.py'
      - '.github/actions/upload-evidence/**'
      - 'docs/COMPATIBILITY.md'
      - 'docs/TESTING_AND_EVIDENCE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - '.github/workflows/oracle-immutable-smoke.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-oracle-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  immutable-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
          cd "$GITHUB_WORKSPACE"
          docker version
      - name: Validate current oracle authority
        run: |
          set -euo pipefail
          grep -q 'immutable oracle.*unmodified official Nakama artifact' docs/COMPATIBILITY.md
          grep -q 'A result earns credit only for the exact candidate' docs/TESTING_AND_EVIDENCE.md
          bash scripts/oracle/check-immutable-oracle.sh
      - name: Run digest-pinned immutable Nakama oracle
        env:
          TRNM_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/oracle/run-immutable-smoke.sh run/immutable-oracle
      - name: Revalidate and seal emitted evidence
        run: |
          set -euo pipefail
          python3 scripts/oracle/render-immutable-evidence.py \
            --lock oracle/immutable/oracle-lock.json \
            --compose oracle/immutable/compose.yml \
            --normalizers config/oracle-normalizers.json \
            --facts run/immutable-oracle/runtime-facts.json \
            --output run/immutable-oracle/evidence.revalidated.json
          cmp run/immutable-oracle/evidence.json run/immutable-oracle/evidence.revalidated.json
          python3 scripts/oracle/capture-auth-reference.py --verify \
            --facts run/immutable-oracle/runtime-facts.json \
            --output run/immutable-oracle/auth-reference
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/immutable-oracle-${CANDIDATE_SHA}.tar.gz \
            -C run/immutable-oracle .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/immutable-oracle-${CANDIDATE_SHA}.tar.gz
          find run/immutable-oracle -type f -print0 | sort -z | xargs -0 sha256sum
      - name: Retain synthetic reference diagnostic packet
        id: retain-reference
        uses: ./.github/actions/upload-evidence
        with:
          name: immutable-auth-reference-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/immutable-oracle-${{ env.CANDIDATE_SHA }}.tar.gz
      - name: Record reference retention receipt
        env:
          ARTIFACT_ID: ${{ steps.retain-reference.outputs.artifact_id }}
          ARTIFACT_SHA256: ${{ steps.retain-reference.outputs.sha256 }}
          ARTIFACT_BYTES: ${{ steps.retain-reference.outputs.size_bytes }}
        run: |
          set -euo pipefail
          python3 - <<'PY_RECEIPT'
          import hashlib, os
          from pathlib import Path
          path = Path('run/immutable-oracle-' + os.environ['CANDIDATE_SHA'] + '.tar.gz')
          assert os.environ['ARTIFACT_ID'].isascii() and os.environ['ARTIFACT_ID'].isdigit()
          assert int(os.environ['ARTIFACT_ID']) > 0
          assert os.environ['ARTIFACT_SHA256'] == hashlib.sha256(path.read_bytes()).hexdigest()
          assert int(os.environ['ARTIFACT_BYTES']) == path.stat().st_size
          print('diagnostic artifact_id=' + os.environ['ARTIFACT_ID'])
          print('diagnostic sha256=' + os.environ['ARTIFACT_SHA256'])
          print('compatibility_credit=false; download verification and independent acceptance pending')
          PY_RECEIPT
