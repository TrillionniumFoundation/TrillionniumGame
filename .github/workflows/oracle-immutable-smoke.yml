name: trillionnium-game-immutable-oracle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'oracle/immutable/**'
      - 'config/oracle-normalizers.json'
      - 'tools/oracle/**'
      - 'scripts/oracle/**'
      - 'tests/oracle/**'
      - 'docs/development/IMMUTABLE_ORACLE_BOOTSTRAP.md'
      - '.github/workflows/oracle-immutable-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'oracle/immutable/**'
      - 'config/oracle-normalizers.json'
      - 'tools/oracle/**'
      - 'scripts/oracle/**'
      - 'tests/oracle/**'
      - 'docs/development/IMMUTABLE_ORACLE_BOOTSTRAP.md'
      - '.github/workflows/oracle-immutable-smoke.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-oracle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate static oracle and normalizer contracts
        run: bash scripts/oracle/check-immutable-oracle.sh
      - name: Run digest-pinned immutable Nakama oracle
        env:
          TRNM_CANDIDATE_COMMIT: ${{ github.sha }}
        run: scripts/oracle/run-immutable-smoke.sh run/immutable-oracle
      - name: Revalidate emitted evidence
        run: |
          python3 scripts/oracle/render-immutable-evidence.py \
            --lock oracle/immutable/oracle-lock.json \
            --compose oracle/immutable/compose.yml \
            --normalizers config/oracle-normalizers.json \
            --facts run/immutable-oracle/runtime-facts.json \
            --output run/immutable-oracle/evidence.revalidated.json
          cmp run/immutable-oracle/evidence.json run/immutable-oracle/evidence.revalidated.json
      - name: Upload exact-head immutable oracle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: immutable-oracle-${{ github.sha }}
          path: run/immutable-oracle
          if-no-files-found: error
          retention-days: 30
