name: temporary-fix-outbox-reclaim-idempotency

on:
  push:
    branches:
      - codex/outbox-spool-worker-2026-08-31

permissions:
  contents: write

concurrency:
  group: temporary-fix-outbox-reclaim-idempotency
  cancel-in-progress: false

jobs:
  repair-test-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Make durable spool bytes lease-independent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs')
          source = path.read_text(encoding='utf-8')
          start = source.index('fn spool_record(lease: &OutboxLease) -> Vec<u8> {')
          end = source.index('\nfn prepare_temporary_file(', start)
          replacement = r'''fn spool_record(lease: &OutboxLease) -> Vec<u8> {
              format!(
                  "{{\"schema\":\"trillionnium.outbox-spool.v1\",\"intent_id\":\"{}\",\"entity_id\":\"{}\",\"command_id\":\"{}\",\"kind\":\"{}\",\"payload_digest\":\"{}\"}}\n",
                  encode_hex(lease.id.as_bytes()),
                  encode_hex(lease.entity.as_bytes()),
                  encode_hex(lease.command.as_bytes()),
                  intent_kind_name(lease.kind),
                  encode_hex(lease.payload.as_bytes()),
              )
              .into_bytes()
          }
          '''
          source = source[:start] + replacement + source[end:]

          anchor = '''    #[test]
              fn conflicting_existing_receipt_fails_closed() {
          '''
          test = r'''    #[test]
              fn lease_reclaim_preserves_stable_spool_bytes_and_receipt() {
                  let directory = temporary_directory("reclaim");
                  let sink = SpoolSink::new(directory.clone()).unwrap();
                  let original = lease();
                  let mut reclaimed = original;
                  reclaimed.attempt = original.attempt + 1;
                  reclaimed.lease_generation = original.lease_generation + 1;
                  reclaimed.owner = NodeId::new([6; 16]);
                  reclaimed.lease_expires_at_ms = original.lease_expires_at_ms + 60_000;

                  let original_receipt = sink.deliver(&original).unwrap();
                  let reclaimed_receipt = sink.deliver(&reclaimed).unwrap();
                  assert_eq!(original_receipt, reclaimed_receipt);

                  let final_path = directory.join(format!(
                      "{}.json",
                      encode_hex(original.id.as_bytes())
                  ));
                  let content = String::from_utf8(fs::read(final_path).unwrap()).unwrap();
                  assert!(!content.contains("attempt"));
                  assert!(!content.contains("lease_generation"));
                  assert!(!content.contains("owner_node"));
                  assert!(!content.contains("lease_expires_at_ms"));
                  fs::remove_dir_all(directory).unwrap();
              }

          '''
          if source.count(anchor) != 1:
              raise SystemExit(f'expected one test anchor, found {source.count(anchor)}')
          source = source.replace(anchor, test + anchor, 1)
          path.write_text(source, encoding='utf-8')

          docs = Path('docs/development/OUTBOX_SPOOL_WORKER.md')
          text = docs.read_text(encoding='utf-8')
          old = (
              'The final filename is the lowercase intent ID and the\n'
              'receipt digest is SHA-256 over the exact final bytes.\n'
          )
          new = (
              'The final filename is the lowercase intent ID and the receipt digest is SHA-256 over\n'
              'the exact final bytes. Final bytes contain only stable intent identity and payload\n'
              'fields; attempt, lease generation, owner and expiry are deliberately excluded so a\n'
              'post-write/pre-ack crash can be reclaimed without creating a false conflict.\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one documentation anchor, found {text.count(old)}')
          docs.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/temporary-fix-outbox-reclaim-idempotency.yml
          git diff --check

      - name: Format and validate exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-rust-package-inventory.py

      - name: Commit only verified idempotency repair
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-fix-outbox-reclaim-idempotency.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(outbox): keep spool receipts stable across lease reclaim"
          git push origin "HEAD:${GITHUB_REF_NAME}"
