name: codex-pr104-verifier-receipt-budget

on:
  push:
    branches:
      - codex/realtime-recovery-wave-2026-09-07

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'TrillionniumFoundation/TrillionniumGame'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact repair head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: codex/realtime-recovery-wave-2026-09-07
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$TARGET_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply deterministic source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/codex-pr104-verifier-receipt-budget.py

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1

      - name: Format and test isolated realtime workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml
          cargo test --manifest-path crates/trnm-presence-router-v2/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path crates/trnm-presence-router-v2/Cargo.toml --all-targets --locked -- -D warnings

      - name: Remove repair-only tooling and publish source commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: codex/realtime-recovery-wave-2026-09-07
        run: |
          set -euo pipefail
          rm -f scripts/codex-pr104-verifier-receipt-budget.py
          rm -f .github/workflows/codex-pr104-verifier-receipt-budget.yml
          git config user.name "ProfHepta"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(realtime): bound verifier receipt memory per epoch"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
