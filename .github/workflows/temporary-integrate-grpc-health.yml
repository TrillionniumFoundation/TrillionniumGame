name: temporary-integrate-grpc-health

on:
  push:
    branches:
      - codex/grpc-healthcheck-source-2026-08-31

permissions:
  contents: write

concurrency:
  group: temporary-integrate-grpc-health
  cancel-in-progress: true

jobs:
  integrate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Apply reviewed integration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temporary-integrate-grpc-health.py
      - name: Format and validate integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo test --package trnm-persistence-pg --bin trnm-server --locked
          cargo clippy --package trnm-persistence-pg --bin trnm-server --locked -- -D warnings
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-trnm-server.py
      - name: Commit integrated source
        shell: bash
        env:
          TARGET_BRANCH: codex/grpc-healthcheck-source-2026-08-31
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/trnm-persistence-pg/src/bin/trnm_server/config.rs \
            crates/trnm-persistence-pg/src/bin/trnm_server/server.rs \
            scripts/check-trnm-server.py \
            scripts/check-rust-foundation.py \
            docs/status/TRNM_SERVER_STATUS.json \
            contracts/grpc/nakama-healthcheck-v1.json \
            .github/workflows/grpc-health-source.yml
          git commit -m 'feat(grpc): integrate health listener into server lifecycle'
          git push origin "HEAD:${TARGET_BRANCH}"
