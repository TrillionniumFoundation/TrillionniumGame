name: temporary-integrate-grpc-health

on:
  push:
    branches:
      - codex/grpc-healthcheck-source-2026-08-31

permissions:
  contents: write

concurrency:
  group: temporary-integrate-grpc-health
  cancel-in-progress: true

jobs:
  integrate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Integrate configuration, lifecycle and machine contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          config_path = Path("crates/trnm-persistence-pg/src/bin/trnm_server/config.rs")
          config = config_path.read_text()
          config = replace_once(
              config,
              "pub struct ServerConfig {\n    pub bind: SocketAddr,\n",
              "pub struct ServerConfig {\n    pub bind: SocketAddr,\n    pub grpc_bind: Option<SocketAddr>,\n",
              "config struct",
          )
          config = replace_once(
              config,
              '.field("bind", &self.bind)\n            .field("database_url", &"<redacted>")',
              '.field("bind", &self.bind)\n            .field("grpc_bind", &self.grpc_bind)\n            .field("database_url", &"<redacted>")',
              "config debug",
          )
          config = replace_once(
              config,
              '''        if !bind.ip().is_loopback() && !allow_non_loopback {
            return Err(ServerError::Configuration(
                "non_loopback_bind_requires_explicit_opt_in",
            ));
        }

        let database_url = required(&lookup, "TRNM_SERVER_DATABASE_URL", "database_url_missing")?;
''',
              '''        if !bind.ip().is_loopback() && !allow_non_loopback {
            return Err(ServerError::Configuration(
                "non_loopback_bind_requires_explicit_opt_in",
            ));
        }
        let grpc_bind = lookup("TRNM_SERVER_GRPC_BIND")
            .map(|value| {
                value
                    .parse::<SocketAddr>()
                    .map_err(|_| ServerError::Configuration("grpc_bind_address_invalid"))
            })
            .transpose()?;
        if let Some(grpc_bind) = grpc_bind {
            if !grpc_bind.ip().is_loopback() && !allow_non_loopback {
                return Err(ServerError::Configuration(
                    "grpc_non_loopback_bind_requires_explicit_opt_in",
                ));
            }
            if grpc_bind == bind {
                return Err(ServerError::Configuration(
                    "http_and_grpc_bind_must_differ",
                ));
            }
        }

        let database_url = required(&lookup, "TRNM_SERVER_DATABASE_URL", "database_url_missing")?;
''',
              "config parse",
          )
          config = replace_once(
              config,
              "            Self {\n                bind,\n                database_url,\n",
              "            Self {\n                bind,\n                grpc_bind,\n                database_url,\n",
              "config construction",
          )
          config = replace_once(
              config,
              "        assert!(config.bind.ip().is_loopback());\n        assert_eq!(config.max_request_bytes, 128 * 1024);",
              "        assert!(config.bind.ip().is_loopback());\n        assert!(config.grpc_bind.is_none());\n        assert_eq!(config.max_request_bytes, 128 * 1024);",
              "config default test",
          )
          config = replace_once(
              config,
              '''    #[test]
    fn verify_full_tls_is_secure_by_default_and_material_is_paired() {
''',
              '''    #[test]
    fn grpc_bind_is_optional_distinct_and_public_bind_requires_opt_in() {
        let mut values = base();
        values.insert(
            "TRNM_SERVER_GRPC_BIND".to_owned(),
            "127.0.0.1:7351".to_owned(),
        );
        let (_, config) = load(&values).unwrap();
        assert_eq!(
            config.grpc_bind,
            Some("127.0.0.1:7351".parse::<SocketAddr>().unwrap())
        );

        values.insert(
            "TRNM_SERVER_GRPC_BIND".to_owned(),
            "127.0.0.1:7350".to_owned(),
        );
        assert!(matches!(
            load(&values),
            Err(ServerError::Configuration("http_and_grpc_bind_must_differ"))
        ));

        values.insert(
            "TRNM_SERVER_GRPC_BIND".to_owned(),
            "0.0.0.0:7351".to_owned(),
        );
        assert!(matches!(
            load(&values),
            Err(ServerError::Configuration(
                "grpc_non_loopback_bind_requires_explicit_opt_in"
            ))
        ));
        values.insert(
            "TRNM_SERVER_ALLOW_NON_LOOPBACK".to_owned(),
            "1".to_owned(),
        );
        assert!(load(&values).is_ok());
    }

    #[test]
    fn verify_full_tls_is_secure_by_default_and_material_is_paired() {
''',
              "config grpc test",
          )
          config_path.write_text(config)

          server_path = Path("crates/trnm-persistence-pg/src/bin/trnm_server/server.rs")
          server = server_path.read_text()
          server = replace_once(
              server,
              "use super::error::ServerError;\nuse super::http::{read_request, Request, Response};",
              "use super::error::ServerError;\nuse super::grpc;\nuse super::http::{read_request, Request, Response};",
              "server import",
          )
          server = replace_once(
              server,
              "    let worker_failed = Arc::new(AtomicBool::new(false));\n    let metrics = SharedAppMetrics::default();\n    let mut workers = Vec::with_capacity(worker_count);",
              "    let worker_failed = Arc::new(AtomicBool::new(false));\n    let metrics = SharedAppMetrics::default();\n    let grpc_worker = grpc::spawn(\n        config.grpc_bind,\n        Arc::clone(&draining),\n        Arc::clone(&worker_failed),\n    )?;\n    let mut workers = Vec::with_capacity(worker_count);",
              "server spawn",
          )
          server = replace_once(
              server,
              '''        "trnm-server source candidate listening on {} profile={} workers={} queue_capacity={}",
        config.bind,
        config.database_profile.metadata_value(),
        worker_count,
        queue_capacity,
''',
              '''        "trnm-server source candidate listening on {} grpc_bind={:?} profile={} workers={} queue_capacity={}",
        config.bind,
        config.grpc_bind,
        config.database_profile.metadata_value(),
        worker_count,
        queue_capacity,
''',
              "server diagnostic",
          )
          server = replace_once(
              server,
              '''    let accept_result = accept_loop(&listener, &sender, config, &draining, &worker_failed);
    drop(sender);
    let join_result = join_workers(workers);
    accept_result?;
    join_result?;
    eprintln!("trnm-server source candidate drained");
''',
              '''    let accept_result = accept_loop(&listener, &sender, config, &draining, &worker_failed);
    draining.store(true, Ordering::Release);
    drop(sender);
    let join_result = join_workers(workers);
    let grpc_join_result = grpc::join(grpc_worker);
    accept_result?;
    join_result?;
    grpc_join_result?;
    eprintln!("trnm-server source candidate drained");
''',
              "server join",
          )
          server_path.write_text(server)

          checker_path = Path("scripts/check-trnm-server.py")
          checker = checker_path.read_text()
          checker = replace_once(
              checker,
              '    MODULE_ROOT / "error.rs",\n    MODULE_ROOT / "http.rs",',
              '    MODULE_ROOT / "error.rs",\n    MODULE_ROOT / "grpc.rs",\n    MODULE_ROOT / "http.rs",',
              "server checker files",
          )
          checker = replace_once(
              checker,
              '''        "postgres-native-tls": "=0.5.3",
        "r2d2": "=0.8.10",
''',
              '''        "postgres-native-tls": "=0.5.3",
        "prost": "=0.14.3",
        "r2d2": "=0.8.10",
''',
              "server checker prost",
          )
          checker = replace_once(
              checker,
              '''        "r2d2_postgres": "=0.18.2",
        "trnm-contracts": {"path": "../trnm-contracts"},
''',
              '''        "r2d2_postgres": "=0.18.2",
        "tokio": {"version": "=1.53.1", "features": ["rt", "time"]},
        "tonic": {"version": "=0.14.5", "features": ["transport"]},
        "tonic-prost": "=0.14.5",
        "trnm-contracts": {"path": "../trnm-contracts"},
''',
              "server checker tonic",
          )
          checker = replace_once(
              checker,
              '''    if manifest.get("dependencies") != expected_dependencies:
        fail("server candidate changed the reviewed persistence dependency boundary")

    sources = {
''',
              '''    if manifest.get("dependencies") != expected_dependencies:
        fail("server candidate changed the reviewed persistence dependency boundary")
    expected_build_dependencies = {
        "prost-build": "=0.14.3",
        "prost-types": "=0.14.3",
        "protoc-bin-vendored": "=3.2.0",
        "tonic-build": "=0.14.5",
        "tonic-prost-build": "=0.14.5",
    }
    if manifest.get("build-dependencies") != expected_build_dependencies:
        fail("server candidate changed the reviewed protobuf build dependency boundary")

    sources = {
''',
              "server checker build deps",
          )
          checker = replace_once(
              checker,
              '    "shared_codec_rejects_encoding_mismatch",\n',
              '    "shared_codec_rejects_encoding_mismatch",\n    "grpc_bind_is_optional_distinct_and_public_bind_requires_opt_in",\n    "official_healthcheck_method_path_is_exact",\n    "generated_service_returns_an_empty_response",\n    "generated_client_reaches_the_http2_healthcheck_path",\n',
              "server checker tests",
          )
          checker = replace_once(
              checker,
              '            "TRNM_SERVER_ALLOW_NON_LOOPBACK",\n',
              '            "TRNM_SERVER_ALLOW_NON_LOOPBACK",\n            "TRNM_SERVER_GRPC_BIND",\n',
              "server checker config marker",
          )
          checker = replace_once(
              checker,
              '''        "crates/trnm-persistence-pg/src/bin/trnm_server/http.rs": [
''',
              '''        "crates/trnm-persistence-pg/src/bin/trnm_server/grpc.rs": [
            "/nakama.api.Nakama/Healthcheck",
            "NakamaServer::new",
            "serve_with_shutdown",
            "worker_failed.store(true",
        ],
        "crates/trnm-persistence-pg/src/bin/trnm_server/http.rs": [
''',
              "server checker grpc markers",
          )
          checker = replace_once(
              checker,
              '            "websocket::serve_once",\n',
              '            "websocket::serve_once",\n            "grpc::spawn",\n            "grpc::join",\n',
              "server checker lifecycle markers",
          )
          checker = replace_once(
              checker,
              '    if test_count < 53:\n        fail(f"expected at least 53 server/session/pool source tests, got {test_count}")',
              '    if test_count < 57:\n        fail(f"expected at least 57 server/session/pool/grpc source tests, got {test_count}")',
              "server checker threshold",
          )
          checker = replace_once(
              checker,
              '        "session_http_source_candidate",\n',
              '        "session_http_source_candidate",\n        "grpc_healthcheck_source_candidate",\n',
              "server checker source claim",
          )
          checker_path.write_text(checker)

          foundation_path = Path("scripts/check-rust-foundation.py")
          foundation = foundation_path.read_text()
          foundation = replace_once(
              foundation,
              '''        "postgres-native-tls": "=0.5.3",
        "r2d2": "=0.8.10",
''',
              '''        "postgres-native-tls": "=0.5.3",
        "prost": "=0.14.3",
        "r2d2": "=0.8.10",
''',
              "foundation prost",
          )
          foundation = replace_once(
              foundation,
              '''        "r2d2_postgres": "=0.18.2",
        "trnm-contracts": {"path": "../trnm-contracts"},
''',
              '''        "r2d2_postgres": "=0.18.2",
        "tokio": {"version": "=1.53.1", "features": ["rt", "time"]},
        "tonic": {"version": "=0.14.5", "features": ["transport"]},
        "tonic-prost": "=0.14.5",
        "trnm-contracts": {"path": "../trnm-contracts"},
''',
              "foundation tonic",
          )
          foundation_path.write_text(foundation)

          status_path = Path("docs/status/TRNM_SERVER_STATUS.json")
          status = json.loads(status_path.read_text())
          implemented = status["implemented_source"]
          item = "optional same-process generated Nakama Healthcheck gRPC listener with shared drain and worker-failure lifecycle"
          if item not in implemented:
              implemented.append(item)
          status["claims"]["grpc_healthcheck_source_candidate"] = True
          status["claims"]["grpc_implemented"] = False
          status_path.write_text(json.dumps(status, indent=2) + "\n")

          contract_path = Path("contracts/grpc/nakama-healthcheck-v1.json")
          contract = json.loads(contract_path.read_text())
          contract["candidate"]["runtime_config"] = "ServerConfig.grpc_bind"
          contract["candidate"]["runtime_spawn"] = "server::serve -> grpc::spawn"
          contract["candidate"]["runtime_join"] = "server::serve -> grpc::join"
          contract_path.write_text(json.dumps(contract, indent=2) + "\n")

          workflow_path = Path(".github/workflows/grpc-health-source.yml")
          workflow = workflow_path.read_text()
          workflow = replace_once(
              workflow,
              "          grep -Fq 'tonic_prost_build::configure()' crates/trnm-persistence-pg/build.rs\n",
              "          grep -Fq 'tonic_prost_build::configure()' crates/trnm-persistence-pg/build.rs\n          grep -Fq 'TRNM_SERVER_GRPC_BIND' crates/trnm-persistence-pg/src/bin/trnm_server/config.rs\n          grep -Fq 'grpc::spawn' crates/trnm-persistence-pg/src/bin/trnm_server/server.rs\n          grep -Fq 'grpc::join' crates/trnm-persistence-pg/src/bin/trnm_server/server.rs\n",
              "grpc workflow runtime assertions",
          )
          workflow_path.write_text(workflow)
          PY
      - name: Format and validate integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo test --package trnm-persistence-pg --bin trnm-server --locked
          cargo clippy --package trnm-persistence-pg --bin trnm-server --locked -- -D warnings
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-trnm-server.py
      - name: Commit integrated source
        shell: bash
        env:
          TARGET_BRANCH: codex/grpc-healthcheck-source-2026-08-31
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/trnm-persistence-pg/src/bin/trnm_server/config.rs \
            crates/trnm-persistence-pg/src/bin/trnm_server/server.rs \
            scripts/check-trnm-server.py \
            scripts/check-rust-foundation.py \
            docs/status/TRNM_SERVER_STATUS.json \
            contracts/grpc/nakama-healthcheck-v1.json \
            .github/workflows/grpc-health-source.yml
          git commit -m 'feat(grpc): integrate health listener into server lifecycle'
          git push origin "HEAD:${TARGET_BRANCH}"
