name: temporary-integrate-grpc-health

on:
  push:
    branches:
      - codex/grpc-healthcheck-source-2026-08-31

permissions:
  contents: write

concurrency:
  group: temporary-integrate-grpc-health
  cancel-in-progress: true

jobs:
  integrate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        env:
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Apply reviewed integration and protocol patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.temporary-integrate-grpc-health.py.b64.part* \
            | base64 --decode > /tmp/temporary-integrate-grpc-health.py
          python3 -m py_compile /tmp/temporary-integrate-grpc-health.py
          python3 /tmp/temporary-integrate-grpc-health.py
          git rm --force \
            scripts/temporary-integrate-grpc-health.py \
            scripts/.temporary-integrate-grpc-health.py.b64.part* \
            .github/workflows/temporary-integrate-grpc-health.yml
          test ! -e scripts/temporary-integrate-grpc-health.py
          test ! -e .github/workflows/temporary-integrate-grpc-health.yml
          test -z "$(git ls-files | grep -E '(^|/)(temporary-|temp-)' || true)"

      - name: Format and validate clean integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-trnm-server.py
          git diff --check

      - name: Commit stable self-cleaned source
        shell: bash
        env:
          TARGET_BRANCH: codex/grpc-healthcheck-source-2026-08-31
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git ls-files | grep -E '(^|/)(temporary-|temp-)' || true)"
          git commit -m 'feat(server): integrate gRPC health and harden WebSocket negotiation'
          git push origin "HEAD:${TARGET_BRANCH}"
