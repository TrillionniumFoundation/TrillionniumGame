name: exact-source-snapshot-export

on:
  push:
    branches: [tooling/source-snapshot-7deee-2026-09-06]
    paths:
      - '.github/workflows/exact-source-snapshot-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: 7deee4377cff401854647151842c582f038feef1
      EXPECTED_TREE: bdb32193d39ab549e265e9dfb9fcd6fa1abab3d6
      PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
    steps:
      - name: Fetch exact unchanged candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "$EXPECTED_HEAD"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git -C "$GITHUB_WORKSPACE" ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"

      - name: Build deterministic source snapshot
        id: build
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/source-snapshot"
          archive="$RUNNER_TEMP/TrillionniumGame-${EXPECTED_HEAD}.tar.gz"
          rm -rf "$packet" "$archive"
          mkdir -p "$packet"
          git -C "$GITHUB_WORKSPACE" archive \
            --format=tar \
            --prefix="TrillionniumGame-${EXPECTED_HEAD}/" \
            "$EXPECTED_HEAD" | gzip -n > "$archive"
          test -s "$archive"
          printf 'repository=%s\nbranch=%s\ncommit=%s\ntree=%s\n' \
            "$GITHUB_REPOSITORY" "$PRODUCT_BRANCH" "$EXPECTED_HEAD" "$EXPECTED_TREE" \
            > "$packet/IDENTITY.env"
          git -C "$GITHUB_WORKSPACE" ls-tree -r -l "$EXPECTED_HEAD" \
            > "$packet/LS_TREE.txt"
          sha256sum "$archive" > "$packet/SHA256SUMS"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'size=%s\n' "$(stat -c '%s' "$archive")" >> "$GITHUB_OUTPUT"
          cat "$packet/IDENTITY.env"
          cat "$packet/SHA256SUMS"

      - name: Retain exact source snapshot
        id: retained-source
        uses: ./.github/actions/upload-evidence
        with:
          name: source-snapshot-${{ env.EXPECTED_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.archive }}
          mime_type: application/gzip

      - name: Verify source snapshot receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained-source.outputs.artifact_id }}'
          test '${{ steps.retained-source.outputs.sha256 }}' = '${{ steps.build.outputs.sha256 }}'
          test '${{ steps.retained-source.outputs.size_bytes }}' = '${{ steps.build.outputs.size }}'
          printf 'artifact_id=%s\nsha256=%s\nsize_bytes=%s\n' \
            '${{ steps.retained-source.outputs.artifact_id }}' \
            '${{ steps.retained-source.outputs.sha256 }}' \
            '${{ steps.retained-source.outputs.size_bytes }}'
          printf 'Source snapshot is read-only tooling evidence and grants no acceptance or gap credit.\n'
