name: temporary-qualify-plan-v3-reconcile

on:
  push:
    branches:
      - codex/plan-v3-post-merge-reconcile-2026-08-31
    paths:
      - .github/workflows/temporary-qualify-plan-v3-reconcile.yml

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: temporary-qualify-plan-v3-reconcile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze-qualify-and-route-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Fetch exact branch without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B codex/plan-v3-post-merge-reconcile-2026-08-31 FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate the reconciled source tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/temporary-plan-v3-reconcile.py
          test ! -e .github/workflows/temporary-plan-v3-reconcile.yml
          test ! -e .github/workflows/temporary-finalize-plan-v3-reconcile.yml
          grep -q 'fn next_claim_attempt' crates/trnm-persistence-pg/src/outbox.rs
          grep -q 'exhausted_attempt_reclaimed_without_increment' scripts/ci-outbox-spool-worker.sh
          grep -q 'evidence_credit' scripts/check-evidence-index.py
          python3 scripts/check-plan.py
          python3 scripts/check-gap-register.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-status-transitions.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          register = json.loads(Path('docs/status/GAP_REGISTER.json').read_text())
          rows = {row['id']: row for row in register['gaps']}
          expected = {
              'GAP-P0-CI-001', 'GAP-P0-GOV-001', 'GAP-P0-PR-001',
              'GAP-P0-PLAN-001', 'GAP-P1-IDENTITY-001',
              'GAP-P1-TEST-001', 'GAP-P1-DOCS-001',
          }
          assert all(rows[value]['status'] == 'closed' for value in expected)
          assert rows['GAP-P1-OUTBOX-001']['status'] == 'in-progress'
          index = json.loads(Path('docs/evidence/index.json').read_text())
          accepted = [row for row in index['entries'] if row.get('status') == 'accepted']
          assert len(accepted) >= 4
          assert all(row.get('compatibility_credit') is False for row in accepted)
          PY

      - name: Remove finalizer and freeze exact product head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-qualify-plan-v3-reconcile.yml
          test -z "$(find .github/workflows scripts -type f -name 'temporary-*' -print -quit)"
          git diff --check
          git config user.name 'trillionnium-plan-qualifier'
          git config user.email 'plan-qualifier@users.noreply.github.com'
          git add -A
          git commit -m 'chore(plan): freeze exact reconciliation qualification head'
          git push origin HEAD:codex/plan-v3-post-merge-reconcile-2026-08-31
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Bind PR 54 to the exact frozen head and tree
        shell: bash
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          body=$(cat <<EOF
          ## Repository and plan linkage

          Repository: \`TrillionniumFoundation/TrillionniumGame\`

          Plan version: **v3**. This is the single post-merge reconciliation line after protected merge of PR #42. It records exact evidence already independently accepted and adds a new source/fault candidate for exhausted outbox lease recovery.

          ## Exact candidate

          - base branch: \`main\`
          - head commit: \`${head}\`
          - head tree: \`${tree}\`
          - branch: \`codex/plan-v3-post-merge-reconcile-2026-08-31\`
          - temporary workflows remaining: \`0\`

          Any source push invalidates this identity, workflow collection, candidate manifest and approval.

          ## Scope and authoritative gap movement

          - Repair the evidence-index \`entries\` key mismatch across validators.
          - Validate accepted evidence rows against their manifest repository/commit/tree and independent review.
          - Index the accepted PR #42 exact-head CI/review record and protected-main readback without granting compatibility credit.
          - Close only \`GAP-P0-CI-001\`, \`GAP-P0-GOV-001\`, \`GAP-P0-PR-001\`, \`GAP-P0-PLAN-001\`, \`GAP-P1-IDENTITY-001\`, \`GAP-P1-TEST-001\`, and \`GAP-P1-DOCS-001\`.
          - Reclaim an expired outbox lease at or above the configured attempt ceiling without incrementing the attempt, while advancing the fencing generation.
          - Prove final-attempt durable-write/pre-ack process-exit recovery on PostgreSQL and CockroachDB.
          - Reject \`lock_timeout > statement_timeout\`.

          ## Candidate manifest and exact-head execution

          The candidate manifest must bind this repository, exact commit/tree, run/job IDs, immutable database images, migration digest, artifacts, limitations and reviewer identity. Construction/finalizer runs do not count as merge evidence. This unchanged head must obtain its own non-empty terminal successful aggregate and dedicated fault workflows.

          An empty, skipped, cancelled, absent, neutral, action-required, failed, timed-out, or older-head result receives no credit.

          ## Independent review

          A new independent review of this exact head is mandatory. It must verify evidence identity binding, legitimacy of the seven closed control gaps, exhausted-attempt reclaim, generation fencing, dual-profile fault evidence, timeout ordering and the unchanged fail-closed claim ceiling.

          Self-merge is prohibited. The author, automation identity, previous #42 approval and generated manifest cannot substitute for the new exact-head approval.

          ## Remaining authoritative boundary

          \`GAP-P0-EVIDENCE-001\`, \`GAP-P0-DATA-001\`, \`GAP-P0-SERVER-001\`, \`GAP-P0-CRYPTO-001\`, \`GAP-P0-SCOPE-001\`, \`GAP-P1-CRYPTO-002\`, \`GAP-P1-OUTBOX-001\`, \`GAP-P1-STORAGE-001\`, \`GAP-P1-PG-001\`, \`GAP-P1-BRANCH-001\`, \`GAP-P1-REVIEW-001\` and all downstream parity/operational gaps remain evidence-bound.

          ## Claim boundary

          - production-ready = false
          - public-online = false
          - drop-in replacement = false
          - nakama retired = false

          No SG1-SG9, C1-C5, complete Nakama compatibility, production, public-online, cutover, supported replacement or retirement credit is claimed.
          EOF
          )
          jq -n --arg body "$body" '{body:$body}' \
            | curl --fail-with-body --silent --show-error \
                -X PATCH \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/54" \
                -d @- >/dev/null
          printf 'FINAL_HEAD=%s\nFINAL_TREE=%s\n' "$head" "$tree" >>"$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Wait for and qualify the exact-head workflow set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          head = os.environ['FINAL_HEAD']
          required = {
              'trillionnium-game-merge-gate',
              'pull-request-contract',
              'trillionnium-game-plan-contract',
              'candidate-identity-manifest',
              'source-candidate-boundaries',
              'outbox-spool-worker',
              'pgwire-vertical-slice',
              'database-backup-restore',
          }
          rerunnable = {'trillionnium-game-merge-gate', 'pull-request-contract'}
          rerun_attempted = set()

          def request(url, method='GET'):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'trillionnium-plan-qualifier',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response) if response.length != 0 else None

          deadline = time.monotonic() + 45 * 60
          latest = {}
          while time.monotonic() < deadline:
              data = request(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={head}&per_page=100')
              latest = {}
              for run in data.get('workflow_runs', []):
                  name = run.get('name')
                  if name not in required:
                      continue
                  prior = latest.get(name)
                  if prior is None or int(run.get('run_attempt', 1)) >= int(prior.get('run_attempt', 1)):
                      latest[name] = run
              missing = required - latest.keys()
              pending = {
                  name for name, run in latest.items()
                  if run.get('status') != 'completed'
              }
              failures = {
                  name: run for name, run in latest.items()
                  if run.get('status') == 'completed' and run.get('conclusion') != 'success'
              }
              if failures and not pending and not missing:
                  triggered = False
                  for name, run in failures.items():
                      if name in rerunnable and name not in rerun_attempted:
                          try:
                              request(
                                  f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/rerun-failed-jobs",
                                  method='POST',
                              )
                              rerun_attempted.add(name)
                              triggered = True
                          except urllib.error.HTTPError as error:
                              print(f'rerun rejected name={name} status={error.code}', flush=True)
                  if triggered:
                      time.sleep(20)
                      continue
                  raise SystemExit(
                      'exact-head workflow failure: ' +
                      ', '.join(f"{name}={run.get('conclusion')}#{run.get('id')}" for name, run in sorted(failures.items()))
                  )
              if not missing and not pending and not failures:
                  break
              print(
                  'waiting exact-head workflows '
                  f'missing={sorted(missing)} pending={sorted(pending)} '
                  f'failures={sorted(failures)}',
                  flush=True,
              )
              time.sleep(20)
          else:
              raise SystemExit('timed out waiting for exact-head workflow qualification')

          result = {
              name: {
                  'id': latest[name]['id'],
                  'run_attempt': latest[name].get('run_attempt'),
                  'status': latest[name].get('status'),
                  'conclusion': latest[name].get('conclusion'),
                  'head_sha': latest[name].get('head_sha'),
              }
              for name in sorted(required)
          }
          assert all(row['head_sha'] == head for row in result.values())
          assert all(row['conclusion'] == 'success' for row in result.values())
          with open('exact-head-qualification.json', 'w', encoding='utf-8') as output:
              json.dump({'head': head, 'workflows': result}, output, sort_keys=True, indent=2)
              output.write('\n')
          print(json.dumps(result, sort_keys=True))
          PY
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Record qualification and route new exact-head review
        shell: bash
        run: |
          set -euo pipefail
          summary=$(jq -c '.workflows' exact-head-qualification.json)
          body=$(cat <<EOF
          Exact-head qualification completed for \`${FINAL_HEAD}\` / tree \`${FINAL_TREE}\`.

          Required workflow map: \`${summary}\`

          All listed runs are non-empty, terminal, successful, and bound to the unchanged final head. This is execution evidence only; independent review and every remaining compatibility/operational gap stay fail closed.
          EOF
          )
          jq -n --arg body "$body" '{body:$body}' \
            | curl --fail-with-body --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/54/comments" \
                -d @- >/dev/null
          jq -n '{reviewers:["ProfHepta"]}' \
            | curl --fail-with-body --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/54/requested_reviewers" \
                -d @- >/dev/null
        env:
          GITHUB_TOKEN: ${{ github.token }}
