name: temporary-pg-operations-gap

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-pg-operations-gap-v6
  cancel-in-progress: false

jobs:
  patch-lock-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Patch composition and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/pg-operations-patch.*.b64 \
            | tr -d '\n' \
            | base64 -d > /tmp/patch-pg-operations.py
          python3 -m py_compile /tmp/patch-pg-operations.py
          python3 /tmp/patch-pg-operations.py
          python3 - <<'PY'
          from pathlib import Path

          retry = Path('crates/trnm-persistence-pg/src/bin/trnm_server/retry.rs')
          source = retry.read_text(encoding='utf-8')
          old = 'pub fn execute<T>(\n'
          new = '#[cfg(test)]\npub fn execute<T>(\n'
          if source.count(old) != 1:
              raise SystemExit(
                  f'{retry}: expected one execute helper, found {source.count(old)}'
              )
          retry.write_text(source.replace(old, new, 1), encoding='utf-8')

          pool = Path('crates/trnm-persistence-pg/src/pool.rs')
          source = pool.read_text(encoding='utf-8')
          old = '''        let mut policy = PgPoolConfig::default();
                  policy.max_size = 0;
                  assert_eq!(
                      policy.validate().unwrap_err().reason(),
                      "database_pool_policy_invalid"
                  );

                  let mut policy = PgPoolConfig::default();
                  policy.min_idle = policy.max_size + 1;
                  assert_eq!(
                      policy.validate().unwrap_err().reason(),
                      "database_pool_policy_invalid"
                  );
          '''
          new = '''        let policy = PgPoolConfig {
                      max_size: 0,
                      ..PgPoolConfig::default()
                  };
                  assert_eq!(
                      policy.validate().unwrap_err().reason(),
                      "database_pool_policy_invalid"
                  );

                  let default = PgPoolConfig::default();
                  let policy = PgPoolConfig {
                      min_idle: default.max_size + 1,
                      ..default
                  };
                  assert_eq!(
                      policy.validate().unwrap_err().reason(),
                      "database_pool_policy_invalid"
                  );
          '''
          if source.count(old) != 1:
              raise SystemExit(
                  f'{pool}: expected one pool-policy test anchor, found {source.count(old)}'
              )
          pool.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/tmp/pg-operations-patch.*.b64
          test ! -e .github/workflows/temporary-pg-operations-gap.yml
          git diff --check

      - name: Resolve lock and validate source corpus
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo check --package trnm-persistence-pg --all-targets
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit validated operational controls
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-pg-operations-gap.yml
          test -z "$(find .github/tmp -name 'pg-operations-patch.*.b64' -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(pg): add bounded pool tls and jitter controls"
          git push origin "HEAD:${GITHUB_REF_NAME}"
