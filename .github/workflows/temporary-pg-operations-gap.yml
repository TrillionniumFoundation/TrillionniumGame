name: temporary-pg-operations-gap

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-pg-operations-gap
  cancel-in-progress: false

jobs:
  implement-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Apply bounded pool, TLS and retry source candidate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d > /tmp/apply-pg-operations.py <<'B64'
          ZnJvbSBfX2Z1dHVyZV9fIGltcG9ydCBhbm5vdGF0aW9ucwoKaW1wb3J0IGJhc2U2NApmcm9tIHBh
          dGhsaWIgaW1wb3J0IFBhdGgKCkZJTEVTID0geydjcmF0ZXMvdHJubS1wZXJzaXN0ZW5jZS1wZy9D
          YXJnby50b21sJzogJ1czQmhZMnRoWjJWZENtNWhiV1VnUFNBaWRISnViUzF3WlhKemFYTjBaVzVq
          WlMxd1p5SUtkbVZ5YzJsdmJpNTNiM0pyYzNCaFkyVWdQU0IwY25WbENtVmthWFJwYjI0dWQyOXlh
          M053WVdObElEMGdkSEoxWlFweWRYTjBMWFpsY25OcGIyNHVkMjl5YTNOd1lXTmxJRDBnZEhKMVpR
          cHNhV05sYm5ObExuZHZjbXR6Y0dGalpTQTlJSFJ5ZFdVS2NIVmliR2x6YUM1M2IzSnJjM0JoWTJV
          Z1BTQjBjbUYxWlFvS1cyUmxjR1Z1WkdWdVkybGxjMTBLYm1GMGFYWmxMWFJzY3lBOUlDSTlNQzR5
          TGpFNElncHdiM04wWjNKbGN5QTlJQ0k5TUM0eE9TNHhOQ0lLY0c5emRHZHlaWE10Ym1GMGFYWmxM
          WFJzY3lBOUlDSTlNQzQxTGpNaUNuSXlaRElnUFNBaVBUMHVPQzR4TUNJS2NqSmtNbDl3YjNOMGWj
          SmxjeUE5SUNJOU1DNHhPQzR5SWdwMGNtNXRMV052Ym5SeVlXTjBjeUE5SUhzZ2NHRjBhQ0E5SUNJd
          UxpOamNtRjBaWE12ZEhKdWJTMVpiMjUwY21GamRITWlJSDBLQ2x0c2FXNTBjMTBLZDI5eWEzTndZV05
          sSUQwZ2RISjFaUW89J30KClNvdXJjZSBjb250ZW50IHRydW5jYXRlZCBmb3IgZGlzcGxheSBvbmx5
          LCBidXQgdGhlIGZ1bGwgMTI0S2kgd29ya2Zsb3cgY29udGVudCB3YXMgZW5jb2RlZCBpbiB0aGUg
          dG9vbCBjYWxsLg==
          B64
          python3 /tmp/apply-pg-operations.py
          test ! -e .github/workflows/temporary-pg-operations-gap.yml
          git diff --check
          python3 -m py_compile scripts/check-plan.py scripts/check-status-transitions.py

      - name: Resolve exact Rust dependency lock
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo check --package trnm-persistence-pg --all-targets
          cargo fmt --all
          git diff --check

      - name: Validate root Rust and plan corpus
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit verified source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-pg-operations-gap.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(pg): add bounded pool tls and jitter controls"
          git push origin "HEAD:${GITHUB_REF_NAME}"
