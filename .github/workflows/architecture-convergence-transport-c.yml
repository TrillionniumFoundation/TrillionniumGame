name: architecture-convergence-transport-c

on:
  push:
    branches:
      - codex/architecture-convergence-transport-c-2026-09-08
    paths:
      - .github/workflows/architecture-convergence-transport-c.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: architecture-convergence-transport
  cancel-in-progress: false

jobs:
  conservative-convergence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/architecture-gap-closure-2026-09-08
    steps:
      - name: Fetch current target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          head=$(git -C "$GITHUB_WORKSPACE" rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          git -C "$GITHUB_WORKSPACE" checkout --detach "$head"
          printf '%s\n' "$head" > "$RUNNER_TEMP/target-before.txt"

      - name: Apply conservative structural convergence
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ ! -e crates/trnm-token-jwt-adapter-gate/Cargo.toml \
                && ! -e crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml \
                && -e crates/trnm-persistence-pg/src/bin/trnm-pg-compat-server.rs ]] \
             && grep -Fq 'name = "trnm-server"' crates/trnm-server/Cargo.toml; then
            touch "$RUNNER_TEMP/already-converged"
            exit 0
          fi

          cp crates/trnm-token-jwt-adapter/Cargo.toml "$RUNNER_TEMP/jwt-Cargo.toml"
          cp crates/trnm-token-jwt-adapter/src/sha256.rs "$RUNNER_TEMP/jwt-sha256.rs"
          cp docs/development/CRYPTO_PATH_AUTHORITY.json "$RUNNER_TEMP/crypto-authority.json"
          cp tests/control_plane/test_crypto_path_authority.py "$RUNNER_TEMP/crypto-test.py"

          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/TrillionniumFoundation/TrillionniumGame/codex/architecture-convergence-transport-a-2026-09-08/.github/workflows/architecture-convergence-transport.yml' \
            > "$RUNNER_TEMP/source-workflow.yml"
          python3 - <<'PY'
          from pathlib import Path
          import os
          source = Path(os.environ['RUNNER_TEMP']) / 'source-workflow.yml'
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          block = lines[start:end]
          indentation = min(len(line) - len(line.lstrip()) for line in block if line.strip())
          (Path(os.environ['RUNNER_TEMP']) / 'converge.py').write_text(
              '\n'.join(line[indentation:] for line in block) + '\n', encoding='utf-8'
          )
          PY
          python3 "$RUNNER_TEMP/converge.py"

          cp "$RUNNER_TEMP/jwt-sha256.rs" crates/trnm-token-jwt-adapter/src/sha256.rs
          cp "$RUNNER_TEMP/crypto-authority.json" docs/development/CRYPTO_PATH_AUTHORITY.json
          cp "$RUNNER_TEMP/crypto-test.py" tests/control_plane/test_crypto_path_authority.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path(__import__('os').environ['RUNNER_TEMP']) / 'jwt-Cargo.toml'
          text = source.read_text(encoding='utf-8')
          text = re.sub(r'(?m)^\[workspace\]\s*\n?', '', text)
          Path('crates/trnm-token-jwt-adapter/Cargo.toml').write_text(text, encoding='utf-8')

          codeowners = Path('.github/CODEOWNERS')
          codeowners.write_text(
              ''.join(line for line in codeowners.read_text(encoding='utf-8').splitlines(keepends=True)
                      if 'trnm-token-jwt-adapter-gate' not in line),
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Generate one lockfile and format
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ -e "$RUNNER_TEMP/already-converged" ]]; then exit 0; fi
          rm -f Cargo.lock
          cargo generate-lockfile
          cargo fmt --all
          git diff --check

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          exec > >(tee "$RUNNER_TEMP/validation.log") 2>&1
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cd runtime
          test -z "$(find . -type f -name '*.go' -print0 | sort -z | xargs -0 gofmt -l)"
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...

      - name: Publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ -e "$RUNNER_TEMP/already-converged" ]]; then exit 0; fi
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          before=$(cat "$RUNNER_TEMP/target-before.txt")
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$before"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: converge Rust workspace and server authority'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report deterministic failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/validation.log"
          if [[ ! -s "$log" ]]; then echo 'validation failed before combined log creation' > "$log"; fi
          tail -c 50000 "$log" > "$RUNNER_TEMP/tail.log"
          body=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'tail.log').read_text(encoding='utf-8', errors='replace')
          print(json.dumps({'body': 'Architecture convergence transport failed closed. No target ref was updated.\n\n```text\n' + text + '\n```'}))
          PY
          )
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/116/comments" \
            -d "$body" >/dev/null

      - name: Clean transport refs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          for branch in \
            codex/architecture-convergence-transport-a-2026-09-08 \
            codex/architecture-convergence-transport-b-2026-09-08 \
            codex/architecture-convergence-transport-c-2026-09-08
          do
            git push origin --delete "$branch" >/dev/null 2>&1 || true
          done
