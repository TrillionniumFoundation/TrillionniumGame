name: pr100-canonical-contract-repair-v2

on:
  push:
    branches:
      - codex/reviewer-conflict-capacity-fix-2026-09-07
    paths:
      - scripts/one_shot_pr100_canonical_contract_repair.py
      - .github/workflows/pr100-canonical-contract-repair-v2.yml

permissions:
  contents: write

concurrency:
  group: pr100-canonical-contract-repair-v2
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/reviewer-conflict-capacity-fix-2026-09-07

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact source branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          observed="$(git -C "$GITHUB_WORKSPACE" ls-remote origin \
            "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply fail-closed canonical contract repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/one_shot_pr100_canonical_contract_repair.py
          git diff --check
          actual="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u | paste -sd, -
          )"
          expected=".github/workflows/plan-contract.yml,.github/workflows/pr100-canonical-contract-repair-v2.yml,.github/workflows/prospective-merge-gate.yml,scripts/check-independent-review-domain-contract.py,scripts/check-independent-review-matrix.py,scripts/check-plan.py,scripts/one_shot_pr100_canonical_contract_repair.py,tests/control_plane/test_independent_review_domain_integration.py"
          test "$actual" = "$expected"

      - name: Execute canonical governance controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check-independent-review-domain-contract.py \
            scripts/check-independent-review-matrix.py \
            scripts/check-plan.py \
            tests/control_plane/test_independent_review_domain_contract.py \
            tests/control_plane/test_independent_review_domain_integration.py \
            tests/control_plane/test_independent_review_matrix.py
          python3 scripts/check-independent-review-domain-contract.py
          python3 scripts/check-independent-review-matrix.py
          python3 scripts/check-plan.py
          python3 -m unittest \
            tests.control_plane.test_independent_review_domain_contract \
            tests.control_plane.test_independent_review_domain_integration \
            tests.control_plane.test_independent_review_matrix -v
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Commit exact tested repair without force
        shell: bash
        run: |
          set -euo pipefail
          git config user.name trillionnium-governance-bot
          git config user.email trillionnium-governance-bot@users.noreply.github.com
          git add -A
          git commit -m "fix(governance): bind canonical review-domain ownership"
          observed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
