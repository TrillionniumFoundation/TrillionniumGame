name: pr100-canonical-contract-repair-v3

on:
  push:
    branches:
      - codex/reviewer-conflict-capacity-fix-2026-09-07
    paths:
      - scripts/one_shot_pr100_canonical_contract_repair_v3.py
      - .github/workflows/pr100-canonical-contract-repair-v2.yml

permissions:
  contents: write

concurrency:
  group: pr100-canonical-contract-repair-v3
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/reviewer-conflict-capacity-fix-2026-09-07

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact source branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          observed="$(git -C "$GITHUB_WORKSPACE" ls-remote origin \
            "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD

      - name: Apply canonical contract repair without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/one_shot_pr100_canonical_contract_repair_v3.py
          git diff --check
          actual="$(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u | paste -sd, -
          )"
          expected="scripts/check-independent-review-domain-contract.py,scripts/check-independent-review-matrix.py,scripts/check-plan.py,tests/control_plane/test_independent_review_domain_integration.py"
          test "$actual" = "$expected"

      - name: Validate final hypothetical tree and publish source-only commit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check-independent-review-domain-contract.py \
            scripts/check-independent-review-matrix.py \
            scripts/check-plan.py \
            tests/control_plane/test_independent_review_domain_contract.py \
            tests/control_plane/test_independent_review_domain_integration.py \
            tests/control_plane/test_independent_review_matrix.py
          python3 scripts/check-independent-review-domain-contract.py
          python3 scripts/check-independent-review-matrix.py
          python3 scripts/check-plan.py
          python3 -m unittest \
            tests.control_plane.test_independent_review_domain_contract \
            tests.control_plane.test_independent_review_domain_integration \
            tests.control_plane.test_independent_review_matrix -v

          git config user.name trillionnium-governance-bot
          git config user.email trillionnium-governance-bot@users.noreply.github.com
          git add \
            scripts/check-independent-review-domain-contract.py \
            scripts/check-independent-review-matrix.py \
            scripts/check-plan.py \
            tests/control_plane/test_independent_review_domain_integration.py
          git commit -m "fix(governance): bind canonical review-domain ownership"
          source_commit="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"

          rm -f \
            .github/workflows/pr100-canonical-contract-repair-v2.yml \
            scripts/one_shot_pr100_canonical_contract_repair.py \
            scripts/one_shot_pr100_canonical_contract_repair_v3.py
          git add -A
          git commit -m "test(governance): materialize final cleanup tree"
          python3 -m unittest discover -s tests -p 'test_*.py'
          git diff --check HEAD^^
          git reset --hard "$source_commit"

          observed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git push origin "${source_commit}:refs/heads/${TARGET_BRANCH}"
