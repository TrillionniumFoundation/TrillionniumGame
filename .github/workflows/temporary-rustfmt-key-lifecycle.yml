name: temporary-rustfmt-key-lifecycle

on:
  push:
    branches:
      - codex/plan-v3-combined-source-2026-09-03
    paths:
      - .github/workflows/temporary-rustfmt-key-lifecycle.yml
      - crates/trnm-token-crypto-provider/src/lifecycle.rs

permissions:
  contents: write

concurrency:
  group: temporary-rustfmt-key-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-publish-tooling-only-blob:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact source branch without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: codex/plan-v3-combined-source-2026-09-03
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "refs/heads/${SOURCE_BRANCH}"
          git -C "$GITHUB_WORKSPACE" checkout -B "$SOURCE_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install exact Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1

      - name: Format only the lifecycle source and publish one tooling commit
        shell: bash
        env:
          SOURCE_BRANCH: codex/plan-v3-combined-source-2026-09-03
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml
          changed=$(git diff --name-only)
          test "$changed" = 'crates/trnm-token-crypto-provider/src/lifecycle.rs'
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml -- --check
          git config user.name 'trillionnium-rustfmt-tooling'
          git config user.email 'rustfmt-tooling@users.noreply.github.com'
          git add crates/trnm-token-crypto-provider/src/lifecycle.rs
          git commit -m 'tooling: rustfmt key lifecycle source'
          git push origin "HEAD:refs/heads/${SOURCE_BRANCH}"
