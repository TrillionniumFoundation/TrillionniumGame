name: temporary-session-http-integration

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-session-http-integration
  cancel-in-progress: false

jobs:
  implement-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Apply session HTTP integration and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          payload = """"""
          script = zlib.decompress(base64.b64decode(payload))
          Path("/tmp/apply-session-http.py").write_bytes(script)
          PY
          python3 -m py_compile /tmp/apply-session-http.py
          python3 /tmp/apply-session-http.py
          test ! -e .github/workflows/temporary-session-http-integration.yml
          git diff --check

      - name: Validate Rust and control-plane corpus
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-trnm-server.py
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-denominator-materialization.py --require-present --require-review-ready
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit validated session HTTP source candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-session-http-integration.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(session): integrate access refresh and logout HTTP"
          git push origin "HEAD:${GITHUB_REF_NAME}"
