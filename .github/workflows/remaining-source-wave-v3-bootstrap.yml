name: remaining-source-wave-v3-bootstrap

on:
  push:
    branches: [tooling/remaining-source-wave-v2-2026-09-06]
    paths:
      - '.github/workflows/remaining-source-wave-v3-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: remaining-source-wave-v3-bootstrap
  cancel-in-progress: true

jobs:
  resume-validate-export:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      BASE_SHA: 7deee4377cff401854647151842c582f038feef1
      OUTBOX_SHA: 4ce383a55d76a8b2b05827c5017b36f9789c02bd
      SESSION_SHA: 0d0f246a131902403202afcd28103f22af30c8a9
      REALTIME_SHA: 4a72ecdb9341faa9c5211b3479f58d075f75a7ba
      SERVER_SHA: 9ef64a8b93b52808bbbde0acaf74c382e6b4b15f
      HARDENING_SHA: f3e9476ff8b6d781b61ad35c135041eddddcfcff
      PRODUCT_BRANCH: codex/remaining-source-blockers-wave-v3-2026-09-06
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Replay reviewed steps with one lint-only normalization
        shell: bash
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/tooling"
          rm -rf "$tooling"
          git init "$tooling"
          git -C "$tooling" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$tooling" rev-parse HEAD)" = "$GITHUB_SHA"

          python3 - "$tooling/.github/workflows/remaining-source-wave-v2-export.yml" "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          lines = source.read_text(encoding='utf-8').splitlines()
          scripts = []
          index = 0
          while index < len(lines):
              if lines[index] != '        run: |':
                  index += 1
                  continue
              index += 1
              body = []
              while index < len(lines):
                  line = lines[index]
                  if line and not line.startswith('          '):
                      break
                  body.append(line[10:] if line.startswith('          ') else '')
                  index += 1
              scripts.append('\n'.join(body) + '\n')
          if len(scripts) != 6:
              raise SystemExit(f'expected six reviewed scripts, observed {len(scripts)}')
          for number, body in enumerate(scripts, 1):
              (target / f'cumulative-{number}.sh').write_text(body, encoding='utf-8')
          PY

          bash "$RUNNER_TEMP/cumulative-1.sh"
          (cd "$GITHUB_WORKSPACE/source" && bash "$RUNNER_TEMP/cumulative-2.sh")

          python3 - "$GITHUB_WORKSPACE/source/crates/trnm-presence-router-v2/src/session_registry.rs" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          anchor = '#[derive(Clone, Debug)]\npub struct SessionRouteRegistry {'
          if text.count(anchor) != 1:
              raise SystemExit(f'derive anchor count={text.count(anchor)}')
          text = text.replace(
              anchor,
              '#[derive(Clone, Debug, Default)]\npub struct SessionRouteRegistry {',
              1,
          )
          pattern = re.compile(
              r'\nimpl Default for SessionRouteRegistry \{\n'
              r'    fn default\(\) -> Self \{\n'
              r'        Self \{.*?\n'
              r'        \}\n'
              r'    \}\n'
              r'\}\n',
              re.S,
          )
          text, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'manual Default count={count}')
          path.write_text(text, encoding='utf-8')
          PY

          for number in 3 4 5 6; do
            (cd "$GITHUB_WORKSPACE/source" && bash "$RUNNER_TEMP/cumulative-${number}.sh")
          done
