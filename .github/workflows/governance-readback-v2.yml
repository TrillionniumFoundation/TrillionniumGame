name: governance-readback-v2

on:
  push:
    branches: [tooling/governance-readback-v2-2026-09-07]
    paths:
      - '.github/workflows/governance-readback-v2.yml'
      - '.github/actions/upload-evidence/**'
      - 'scripts/capture-governance-readback.py'
      - 'scripts/upload-actions-artifact.py'

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  TARGET_PR: '63'
  TARGET_HEAD: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
  TARGET_TREE: 9d3ae2fadb2684f095855ecf16307376b55a440f
  TARGET_BASE: d66c1b5b614a2a7b682c233fe2e7a19939b6976b
  ADMIN_TOKEN: ${{ secrets.TRNM_GITHUB_ADMIN_TOKEN || secrets.TRNM_GITHUB_GOVERNANCE_TOKEN || secrets.GH_ADMIN_TOKEN }}

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact tooling and target source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/tooling" "$GITHUB_WORKSPACE/source"

          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 \
            origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/tooling" rev-parse HEAD)" = \
            "$GITHUB_SHA"

          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${TARGET_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 \
            origin "$TARGET_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = \
            "$TARGET_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = \
            "$TARGET_TREE"

      - name: Capture exact server-side governance state
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/scripts/capture-governance-readback.py \
            --output source/run/governance-readback
          (
            cd source/run/governance-readback
            sha256sum governance-readback.json result.env > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "source/run/governance-readback-${TARGET_HEAD}.tar.gz" \
            -C source/run/governance-readback \
            governance-readback.json result.env SHA256SUMS

      - name: Retain governance readback packet
        id: packet
        if: always()
        uses: ./tooling/.github/actions/upload-evidence
        with:
          name: governance-readback-${{ env.TARGET_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/run/governance-readback-${{ env.TARGET_HEAD }}.tar.gz
          mime_type: application/gzip

      - name: Verify retained receipt and fail closed on incomplete readback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.packet.outputs.artifact_id }}'
          test -n '${{ steps.packet.outputs.sha256 }}'
          test '${{ steps.packet.outputs.size_bytes }}' -gt 0
          grep -qx 'readback_complete=true' \
            source/run/governance-readback/result.env
          grep -qx 'configuration_matches_required_minimum=true' \
            source/run/governance-readback/result.env
