name: trillionnium-game-runtime-denominator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/denominator/**'
      - 'scripts/generate-runtime-denominator.py'
      - 'scripts/check-runtime-denominator.sh'
      - 'tests/denominator/test_runtime*.py'
      - 'docs/COMPATIBILITY.md'
      - 'docs/TESTING_AND_EVIDENCE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - '.github/workflows/sg1-runtime-denominator.yml'
  push:
    branches: [main]
    paths:
      - 'tools/denominator/**'
      - 'scripts/generate-runtime-denominator.py'
      - 'scripts/check-runtime-denominator.sh'
      - 'tests/denominator/test_runtime*.py'
      - 'docs/COMPATIBILITY.md'
      - 'docs/TESTING_AND_EVIDENCE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - '.github/workflows/sg1-runtime-denominator.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-runtime-denominator-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-runtime-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate current Runtime denominator contract
        run: |
          set -euo pipefail
          grep -q '`DEN-RUNTIME`' docs/COMPATIBILITY.md
          grep -q 'Runtime modules receive explicit capabilities' docs/ARCHITECTURE.md
      - name: Validate extractors and negative fixtures
        run: bash scripts/check-runtime-denominator.sh
      - name: Fetch and verify exact upstream trees
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fetch-pinned-upstream.py \
            --repository heroiclabs/nakama \
            --revision d4d92f93f78bbbe62c7fc50a3f85c772ec121a09 \
            --tree f3c9cfc2726d5543da1564629170f35b98e3797d \
            --output run/upstream/nakama
          python3 scripts/fetch-pinned-upstream.py \
            --repository heroiclabs/nakama-common \
            --revision 449b77ecc8789aa466c36b67f6e498033dfcd9c5 \
            --tree c6a7b9796b9c2a6b5118c74e5f213963a5001f14 \
            --output run/upstream/nakama-common
      - name: Generate exact Runtime candidate twice
        run: |
          set -euo pipefail
          python3 scripts/generate-runtime-denominator.py \
            --nakama-dir run/upstream/nakama \
            --common-dir run/upstream/nakama-common \
            --output-dir run/candidate-a
          python3 tools/denominator/typescript_runtime_surface.py \
            --common-dir run/upstream/nakama-common \
            --output-dir run/candidate-a
          python3 scripts/generate-runtime-denominator.py \
            --nakama-dir run/upstream/nakama \
            --common-dir run/upstream/nakama-common \
            --output-dir run/candidate-b
          python3 tools/denominator/typescript_runtime_surface.py \
            --common-dir run/upstream/nakama-common \
            --output-dir run/candidate-b
          diff -ru run/candidate-a run/candidate-b
      - name: Validate nonempty fail-closed surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('run/candidate-a/runtime-denominator.candidate.json').read_text())
          assert manifest['leaf_count'] >= 250, manifest['leaf_count']
          assert manifest['adapter_file_count'] >= 10, manifest['adapter_file_count']
          counts = manifest['counts_by_class']
          assert counts.get('go_interface_method', 0) >= 40, counts
          assert counts.get('typescript_interface_member', 0) >= 40, counts
          assert counts.get('runtime_adapter_file', 0) >= 10, counts
          assert manifest['typescript_interface_pass']['member_count'] == counts['typescript_interface_member']
          assert manifest['unclassified_count'] == manifest['leaf_count']
          assert manifest['unreviewed_count'] == manifest['leaf_count']
          assert not any(manifest['claims'].values())
          PY
      - name: Prove candidate cannot close SG1
        run: |
          set -euo pipefail
          if python3 scripts/generate-runtime-denominator.py \
              --nakama-dir run/upstream/nakama \
              --common-dir run/upstream/nakama-common \
              --output-dir run/sg1-negative \
              --require-sg1; then
            echo 'Runtime candidate incorrectly received SG1 credit' >&2
            exit 1
          fi
      - name: Seal exact-head candidate evidence in immutable log
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/runtime-denominator-${CANDIDATE_SHA}.tar.gz \
            -C run/candidate-a .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/runtime-denominator-${CANDIDATE_SHA}.tar.gz
          find run/candidate-a -type f -print0 | sort -z | xargs -0 sha256sum
