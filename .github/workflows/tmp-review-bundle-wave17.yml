name: tmp-review-bundle-wave17

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-review-bundle-wave17.yml

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  BASE_BRANCH: feature/plan-v32-product-hardening-20260909
  HEAD_BRANCH: feature/plan-v32-product-assurance-v2-20260909
  GH_TOKEN: ${{ github.token }}

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Wait for stable exact review subject
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          head=''
          stable=0
          for _ in $(seq 1 1080); do
            current="$(gh api "repos/${REPOSITORY}/branches/${HEAD_BRANCH}" --jq '.commit.sha' 2>/dev/null || true)"
            if test -z "$current"; then sleep 20; continue; fi
            if test "$current" != "$head"; then head="$current"; stable=0; fi
            payload="$(gh api "repos/${REPOSITORY}/commits/${head}/check-runs?per_page=100" 2>/dev/null || echo '{"check_runs":[]}')"
            canonical="$(jq -c 'reduce .check_runs[] as $run ({}; if .[$run.name] == null or ((.[$run.name].started_at // "") < ($run.started_at // "")) then .[$run.name] = $run else . end) | [.[]]' <<<"$payload")"
            total="$(jq 'length' <<<"$canonical")"
            pending="$(jq '[.[]|select(.status!="completed")]|length' <<<"$canonical")"
            failed="$(jq '[.[]|select(.status=="completed" and (.conclusion!="success" and .conclusion!="neutral" and .conclusion!="skipped"))]|length' <<<"$canonical")"
            aggregate="$(jq '[.[]|select(.name=="trillionnium-game-merge-gate" and .status=="completed" and .conclusion=="success")]|length' <<<"$canonical")"
            if test "$total" -gt 0 && test "$pending" -eq 0 && test "$failed" -eq 0 && test "$aggregate" -gt 0; then stable=$((stable+1)); else stable=0; fi
            if test "$stable" -ge 2; then
              base="$(gh api "repos/${REPOSITORY}/branches/${BASE_BRANCH}" --jq '.commit.sha')"
              tree="$(gh api "repos/${REPOSITORY}/git/commits/${head}" --jq '.tree.sha')"
              printf 'base=%s\nhead=%s\ntree=%s\n' "$base" "$head" "$tree" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Fetch exact base and head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin '${{ steps.subject.outputs.base }}' '${{ steps.subject.outputs.head }}'
          git -C "$GITHUB_WORKSPACE" checkout --detach '${{ steps.subject.outputs.head }}'
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})" = '${{ steps.subject.outputs.tree }}'

      - name: Build deterministic review bundle
        id: packet
        shell: bash
        env:
          REVIEW_BASE: ${{ steps.subject.outputs.base }}
          REVIEW_HEAD: ${{ steps.subject.outputs.head }}
          REVIEW_TREE: ${{ steps.subject.outputs.tree }}
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/review-bundle"
          mkdir -p "$packet"
          git -C "$GITHUB_WORKSPACE" diff --binary --full-index "$REVIEW_BASE..$REVIEW_HEAD" > "$packet/changes.patch"
          git -C "$GITHUB_WORKSPACE" diff --name-status "$REVIEW_BASE..$REVIEW_HEAD" > "$packet/changed-paths.tsv"
          git -C "$GITHUB_WORKSPACE" log --reverse --format='%H%x09%T%x09%P%x09%s' "$REVIEW_BASE..$REVIEW_HEAD" > "$packet/commits.tsv"
          cargo metadata --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --no-deps --format-version=1 > "$packet/cargo-metadata.json"
          cp "$GITHUB_WORKSPACE/docs/status/MODULE_DOCUMENTATION.json" "$packet/module-documentation.json"
          cp "$GITHUB_WORKSPACE/scripts/check-plan-v32-product-hardening.py" "$packet/product-hardening-checker.py"
          python3 "$GITHUB_WORKSPACE/scripts/check-plan-v32-product-hardening.py" > "$packet/hardening-result.txt"
          gh api "repos/${REPOSITORY}/commits/${REVIEW_HEAD}/check-runs?per_page=100" > "$packet/check-runs.json"
          python3 - "$packet" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          packet = Path(sys.argv[1])
          members = {}
          for path in sorted(packet.iterdir()):
              if path.name in {'SHA256SUMS', 'manifest.json'}:
                  continue
              data = path.read_bytes()
              members[path.name] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          manifest = {
              'schema': 'trillionnium.independent-review-bundle.v1',
              'repository': os.environ['REPOSITORY'],
              'base': os.environ['REVIEW_BASE'],
              'head': os.environ['REVIEW_HEAD'],
              'tree': os.environ['REVIEW_TREE'],
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'workflow_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'members': members,
              'claim_boundary': {
                  'review_input_only': True,
                  'independent_review_decision': False,
                  'accepted_evidence': False,
                  'production_ready': False,
              },
          }
          (packet / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          (cd "$packet" && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS && sha256sum --check SHA256SUMS)
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/wave17-review-bundle.tgz" -C "$packet" .
          printf 'path=%s\n' "$RUNNER_TEMP/wave17-review-bundle.tgz" >> "$GITHUB_OUTPUT"

      - name: Upload review bundle
        id: upload
        uses: ./.github/actions/upload-evidence
        with:
          name: wave17-review-${{ steps.subject.outputs.head }}
          path: ${{ steps.packet.outputs.path }}
          mime_type: application/gzip

      - name: Request exact-object review
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$REPOSITORY" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty')"
          test -n "$pr"
          gh pr edit "$pr" --repo "$REPOSITORY" --add-reviewer Tomasrgbsf --add-reviewer Franksudoman
          gh pr comment "$pr" --repo "$REPOSITORY" --body \
            "Exact review bundle for base \`${{ steps.subject.outputs.base }}\`, head \`${{ steps.subject.outputs.head }}\`, tree \`${{ steps.subject.outputs.tree }}\`: artifact \`${{ steps.upload.outputs.artifact_id }}\`, SHA-256 \`${{ steps.upload.outputs.sha256 }}\`, bytes \`${{ steps.upload.outputs.size_bytes }}\`. This bundle is review input only and does not contain an approval decision."
