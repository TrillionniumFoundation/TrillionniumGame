name: temporary-session-foundation-library

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-session-foundation-library
  cancel-in-progress: false

jobs:
  finalize-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Move session auth foundation to public library boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/tmp/finalize-session-foundation.py
          python3 .github/tmp/finalize-session-foundation.py
          test ! -e .github/workflows/temporary-session-foundation.yml
          test ! -e .github/workflows/temporary-session-foundation-library.yml
          test ! -e .github/tmp/apply-session-foundation.py
          test ! -e .github/tmp/finalize-session-foundation.py
          test ! -e crates/trnm-persistence-pg/src/bin/trnm_server/auth.rs
          test -e crates/trnm-persistence-pg/src/auth.rs
          git diff --check
          python3 -m json.tool docs/status/TRNM_SERVER_STATUS.json >/dev/null
          python3 -m json.tool docs/roadmap/NEXT_MILESTONE.json >/dev/null

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1

      - name: Resolve root lock and validate every root target
        shell: bash
        run: |
          set -euo pipefail
          cargo check --package trnm-persistence-pg --all-targets
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Validate isolated JWT adapter after digest export
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/trnm-token-jwt-adapter/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-token-jwt-adapter/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path crates/trnm-token-jwt-adapter/Cargo.toml --all-targets --locked -- -D warnings

      - name: Validate plan, policy and Python control corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check

      - name: Commit only the fully validated source candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-session-foundation.yml
          test ! -e .github/workflows/temporary-session-foundation-library.yml
          test ! -e .github/tmp/apply-session-foundation.py
          test ! -e .github/tmp/finalize-session-foundation.py
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(session): add JWT and refresh-family foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
