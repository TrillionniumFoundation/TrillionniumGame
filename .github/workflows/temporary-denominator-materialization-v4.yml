name: temporary-denominator-materialization-v4

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-denominator-materialization-v4
  cancel-in-progress: false

jobs:
  materialize-review-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Execute repository-native denominator candidate workflows
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_REF: ${{ github.ref_name }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import copy
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from typing import Any

          ROOT = Path.cwd()
          WORKFLOWS = ROOT / ".github/workflows"
          RUN = ROOT / "run/denominator-materialization"
          RAW = ROOT / "manifests/upstream/candidates/raw"
          CLASSIFIED = ROOT / "manifests/upstream/candidates/classified"
          STATUS = ROOT / "docs/status/DENOMINATOR_MATERIALIZATION.json"
          REVIEW_JSON = ROOT / "manifests/upstream/denominator-review-packet.draft.json"
          REVIEW_MD = ROOT / "docs/review/DENOMINATOR_REVIEW_PACKET.md"
          EXPECTED = {
              "DEN-SOURCE", "DEN-API", "DEN-RTAPI", "DEN-CONSOLE",
              "DEN-RUNTIME", "DEN-CONFIG", "DEN-CLI", "DEN-DB",
              "DEN-DATA", "DEN-METRICS", "DEN-OPS", "DEN-PROVIDERS",
              "DEN-IAP", "DEN-SDK",
          }

          def canonical(value: Any) -> bytes:
              return json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def write_json(path: Path, value: Any) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(
                  json.dumps(value, indent=2, ensure_ascii=False, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          def denominator_id(value: Any) -> str | None:
              if not isinstance(value, dict):
                  return None
              for key in ("denominator", "denominator_id", "id"):
                  candidate = value.get(key)
                  if candidate in EXPECTED:
                      return str(candidate)
              return None

          def extract_run_blocks(path: Path) -> list[str]:
              lines = path.read_text(encoding="utf-8").splitlines()
              output: list[str] = []
              index = 0
              while index < len(lines):
                  match = re.match(r"^(\s*)run:\s*[|>][-+]?\s*$", lines[index])
                  if not match:
                      index += 1
                      continue
                  parent_indent = len(match.group(1))
                  index += 1
                  block: list[str] = []
                  minimum: int | None = None
                  while index < len(lines):
                      line = lines[index]
                      if line.strip():
                          indent = len(line) - len(line.lstrip(" "))
                          if indent <= parent_indent:
                              break
                          minimum = indent if minimum is None else min(minimum, indent)
                      block.append(line)
                      index += 1
                  if minimum is None:
                      continue
                  rendered = "\n".join(
                      line[minimum:] if line.strip() else "" for line in block
                  ).strip()
                  if rendered:
                      output.append(rendered + "\n")
              return output

          def executable_block(block: str) -> bool:
              exclusions = (
                  'rm -rf "$GITHUB_WORKSPACE"',
                  "git init \"$GITHUB_WORKSPACE\"",
                  "tar --sort=name",
                  "GITHUB_STEP_SUMMARY",
                  "--require-sg1",
                  "check-denominator-review-bundle.py",
                  "check-denominator-review-lock.sh",
                  "sha256sum run/",
                  "find run/",
                  "${{",
              )
              return not any(value in block for value in exclusions)

          def run_block(workflow: Path, number: int, block: str, env: dict[str, str]) -> dict[str, Any]:
              log_root = RUN / "logs" / workflow.stem
              log_root.mkdir(parents=True, exist_ok=True)
              log = log_root / f"{number:02d}.log"
              process = subprocess.run(
                  ["bash", "--noprofile", "--norc", "-e", "-o", "pipefail", "-c", block],
                  cwd=ROOT,
                  env=env,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  errors="replace",
                  timeout=1800,
              )
              log.write_text(process.stdout, encoding="utf-8")
              return {
                  "block": number,
                  "returncode": process.returncode,
                  "log": log.relative_to(ROOT).as_posix(),
                  "command_sha256": sha256(block.encode("utf-8")),
              }

          shutil.rmtree(RUN, ignore_errors=True)
          shutil.rmtree(RAW, ignore_errors=True)
          shutil.rmtree(CLASSIFIED, ignore_errors=True)
          RUN.mkdir(parents=True, exist_ok=True)
          RAW.mkdir(parents=True, exist_ok=True)
          CLASSIFIED.mkdir(parents=True, exist_ok=True)

          base_env = dict(os.environ)
          base_env.update(
              {
                  "GITHUB_WORKSPACE": str(ROOT),
                  "GITHUB_REPOSITORY": os.environ["CANDIDATE_REPOSITORY"],
                  "GITHUB_REF_NAME": os.environ["CANDIDATE_REF"],
                  "GITHUB_SHA": os.environ["CANDIDATE_SHA"],
                  "GITHUB_RUN_ID": os.environ.get("GITHUB_RUN_ID", "0"),
                  "GITHUB_RUN_ATTEMPT": os.environ.get("GITHUB_RUN_ATTEMPT", "1"),
                  "GITHUB_TOKEN": os.environ.get("GH_TOKEN", ""),
                  "CANDIDATE_REPOSITORY": os.environ["CANDIDATE_REPOSITORY"],
                  "CANDIDATE_REF": os.environ["CANDIDATE_REF"],
                  "CANDIDATE_SHA": os.environ["CANDIDATE_SHA"],
              }
          )

          selected: dict[str, tuple[dict[str, Any], Path, str]] = {}
          workflow_results: list[dict[str, Any]] = []
          workflow_paths = sorted(WORKFLOWS.glob("*denominator*.y*ml"))
          for workflow in workflow_paths:
              stem = workflow.stem
              if stem.startswith("temporary-") or stem in {
                  "denominator-review-bundle",
                  "sg1-denominator-review-lock",
              }:
                  continue
              scratch = ROOT / "run"
              shutil.rmtree(scratch, ignore_errors=True)
              scratch.mkdir(parents=True, exist_ok=True)
              rows: list[dict[str, Any]] = []
              failed = False
              executed = 0
              for number, block in enumerate(extract_run_blocks(workflow), 1):
                  if not executable_block(block):
                      continue
                  executed += 1
                  try:
                      row = run_block(workflow, number, block, base_env)
                  except subprocess.TimeoutExpired as error:
                      row = {
                          "block": number,
                          "returncode": 124,
                          "log": None,
                          "command_sha256": sha256(block.encode("utf-8")),
                          "error": f"timeout: {error}",
                      }
                  rows.append(row)
                  if row["returncode"] != 0:
                      failed = True
                      break

              discovered: list[str] = []
              for path in sorted(scratch.rglob("*.json")):
                  try:
                      value = json.loads(path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      continue
                  identifier = denominator_id(value)
                  if identifier is None:
                      continue
                  leaves = value.get("leaves") if isinstance(value, dict) else None
                  leaf_count = value.get("leaf_count") if isinstance(value, dict) else None
                  if not isinstance(leaf_count, int):
                      leaf_count = len(leaves) if isinstance(leaves, list) else 0
                  digest = sha256(canonical(value))
                  previous = selected.get(identifier)
                  if previous is None:
                      selected[identifier] = (value, workflow, digest)
                  else:
                      previous_value, previous_workflow, previous_digest = previous
                      previous_leaves = previous_value.get("leaf_count", 0)
                      if not isinstance(previous_leaves, int):
                          previous_leaves = 0
                      if digest != previous_digest and leaf_count > previous_leaves:
                          selected[identifier] = (value, workflow, digest)
                  discovered.append(identifier)

              workflow_results.append(
                  {
                      "workflow": workflow.relative_to(ROOT).as_posix(),
                      "workflow_sha256": sha256(workflow.read_bytes()),
                      "executed_block_count": executed,
                      "failed": failed,
                      "blocks": rows,
                      "denominators_discovered": sorted(set(discovered)),
                  }
              )

          raw_paths: dict[str, Path] = {}
          for identifier, (value, workflow, digest) in sorted(selected.items()):
              value = copy.deepcopy(value)
              claims = value.get("claims")
              if isinstance(claims, dict):
                  for key in list(claims):
                      if key in {
                          "compatibility_credit", "production_ready", "sg1_eligible",
                          "public_online", "nakama_retired", "cutover_authorized",
                      }:
                          claims[key] = False
              for key in (
                  "compatibility_credit", "production_ready", "sg1_eligible",
                  "public_online", "nakama_retired", "cutover_authorized",
              ):
                  if key in value:
                      value[key] = False
              value["materialization"] = {
                  "source_workflow": workflow.relative_to(ROOT).as_posix(),
                  "source_workflow_sha256": sha256(workflow.read_bytes()),
                  "source_candidate_sha": os.environ["CANDIDATE_SHA"],
                  "raw_content_sha256": digest,
                  "review_status": "pending-independent-review",
              }
              destination = RAW / f"{identifier.lower()}.candidate.json"
              write_json(destination, value)
              raw_paths[identifier] = destination

          rules_candidates = sorted((ROOT / "config").glob("*classification*rules*.json"))
          classifier_candidates = sorted((ROOT / "scripts").glob("*classif*.py"))
          classification_results: list[dict[str, Any]] = []
          selected_paths: dict[str, Path] = dict(raw_paths)
          for identifier, raw_path in sorted(raw_paths.items()):
              accepted_path: Path | None = None
              attempts: list[dict[str, Any]] = []
              for classifier in classifier_candidates:
                  output = CLASSIFIED / f"{identifier.lower()}.candidate.json"
                  rules = rules_candidates[0] if rules_candidates else None
                  commands = [
                      [sys.executable, str(classifier), "--input", str(raw_path), "--output", str(output)],
                      [sys.executable, str(classifier), "--candidate", str(raw_path), "--output", str(output)],
                      [sys.executable, str(classifier), str(raw_path), "--output", str(output)],
                  ]
                  if rules is not None:
                      commands.extend(
                          [
                              [sys.executable, str(classifier), "--input", str(raw_path), "--rules", str(rules), "--output", str(output)],
                              [sys.executable, str(classifier), "--candidate", str(raw_path), "--rules", str(rules), "--output", str(output)],
                          ]
                      )
                  for command in commands:
                      output.unlink(missing_ok=True)
                      process = subprocess.run(
                          command,
                          cwd=ROOT,
                          env=base_env,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True,
                          errors="replace",
                          timeout=120,
                      )
                      attempts.append(
                          {
                              "classifier": classifier.relative_to(ROOT).as_posix(),
                              "argv": command[2:],
                              "returncode": process.returncode,
                              "output_tail": process.stdout[-2000:],
                          }
                      )
                      if process.returncode != 0 or not output.is_file():
                          continue
                      try:
                          classified = json.loads(output.read_text(encoding="utf-8"))
                      except json.JSONDecodeError:
                          continue
                      if denominator_id(classified) != identifier:
                          continue
                      leaves = classified.get("leaves")
                      if not isinstance(leaves, list) or not leaves:
                          continue
                      for key in (
                          "compatibility_credit", "production_ready", "sg1_eligible",
                          "public_online", "nakama_retired", "cutover_authorized",
                      ):
                          if key in classified:
                              classified[key] = False
                      claims = classified.get("claims")
                      if isinstance(claims, dict):
                          for key in list(claims):
                              if key in {
                                  "compatibility_credit", "production_ready", "sg1_eligible",
                                  "public_online", "nakama_retired", "cutover_authorized",
                              }:
                                  claims[key] = False
                      write_json(output, classified)
                      accepted_path = output
                      break
                  if accepted_path is not None:
                      break
              if accepted_path is not None:
                  selected_paths[identifier] = accepted_path
              classification_results.append(
                  {
                      "denominator": identifier,
                      "classified_path": accepted_path.relative_to(ROOT).as_posix() if accepted_path else None,
                      "attempts": attempts,
                  }
              )

          candidate_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], cwd=ROOT, text=True
          ).strip()
          candidate_tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], cwd=ROOT, text=True
          ).strip()
          denominator_rows: list[dict[str, Any]] = []
          totals = {
              "leaf_count_total": 0,
              "classified_count": 0,
              "unclassified_count": 0,
              "owner_bound_count": 0,
              "task_bound_count": 0,
              "test_bound_count": 0,
          }
          for identifier, path in sorted(selected_paths.items()):
              value = json.loads(path.read_text(encoding="utf-8"))
              leaves = value.get("leaves")
              leaves = leaves if isinstance(leaves, list) else []
              leaf_count = value.get("leaf_count")
              if not isinstance(leaf_count, int):
                  leaf_count = len(leaves)
              classified_count = sum(
                  1 for leaf in leaves
                  if isinstance(leaf, dict)
                  and leaf.get("classification") not in {None, "", "unclassified"}
              )
              unclassified_count = leaf_count - classified_count
              owner_count = sum(
                  1 for leaf in leaves if isinstance(leaf, dict) and leaf.get("owner_role")
              )
              task_count = sum(
                  1 for leaf in leaves
                  if isinstance(leaf, dict)
                  and isinstance(leaf.get("task_ids"), list)
                  and bool(leaf["task_ids"])
              )
              test_count = sum(
                  1 for leaf in leaves
                  if isinstance(leaf, dict)
                  and isinstance(leaf.get("test_ids"), list)
                  and bool(leaf["test_ids"])
              )
              data = path.read_bytes()
              row = {
                  "id": identifier,
                  "manifest": {
                      "path": path.relative_to(ROOT).as_posix(),
                      "sha256": sha256(data),
                      "size_bytes": len(data),
                  },
                  "leaf_count": leaf_count,
                  "classified_count": classified_count,
                  "unclassified_count": unclassified_count,
                  "owner_bound_count": owner_count,
                  "task_bound_count": task_count,
                  "test_bound_count": test_count,
                  "review_status": "pending-independent-review",
              }
              denominator_rows.append(row)
              for key in totals:
                  if key == "leaf_count_total":
                      totals[key] += leaf_count
                  else:
                      totals[key] += row[key]

          missing = sorted(EXPECTED - set(selected_paths))
          aggregate_digest = sha256(canonical(denominator_rows))
          review_packet = {
              "schema": "trillionnium.denominator-review-packet.draft.v1",
              "project_id": "trillionnium-game",
              "packet_id": f"TG-DEN-DRAFT-{candidate_commit[:12]}",
              "source_candidate": {
                  "repository": os.environ["CANDIDATE_REPOSITORY"],
                  "commit": candidate_commit,
                  "tree": candidate_tree,
              },
              "denominators": denominator_rows,
              "missing_denominators": missing,
              "aggregate": {
                  "denominator_count": len(denominator_rows),
                  **totals,
                  "manifest_sha256": aggregate_digest,
              },
              "review": {
                  "decision": "pending",
                  "independent": False,
                  "minimum_reviewers": 2,
                  "required_roles": ["compatibility-architecture", "protocol", "security", "database", "realtime"],
              },
              "claims": {
                  "sg1_eligible": False,
                  "compatibility_credit": False,
                  "production_ready": False,
                  "public_online": False,
                  "nakama_retired": False,
              },
          }
          write_json(REVIEW_JSON, review_packet)

          materialization = {
              "schema": "trillionnium.denominator-materialization.v1",
              "project_id": "trillionnium-game",
              "source_candidate": review_packet["source_candidate"],
              "expected_denominator_count": len(EXPECTED),
              "materialized_denominator_count": len(denominator_rows),
              "materialized_denominators": [row["id"] for row in denominator_rows],
              "missing_denominators": missing,
              "workflow_results": workflow_results,
              "classification_results": classification_results,
              "aggregate": review_packet["aggregate"],
              "status": "review-ready" if not missing and totals["unclassified_count"] == 0 else "candidate-incomplete",
              "claims": review_packet["claims"],
          }
          write_json(STATUS, materialization)

          REVIEW_MD.parent.mkdir(parents=True, exist_ok=True)
          lines = [
              "# Denominator independent-review packet",
              "",
              f"- Source candidate: `{candidate_commit}`",
              f"- Source tree: `{candidate_tree}`",
              f"- Materialized: `{len(denominator_rows)}/14`",
              f"- Missing: `{', '.join(missing) if missing else 'none'}`",
              f"- Leaf total: `{totals['leaf_count_total']}`",
              f"- Classified: `{totals['classified_count']}`",
              f"- Unclassified: `{totals['unclassified_count']}`",
              "- Decision: `pending-independent-review`",
              "- Compatibility/production credit: `false` / `false`",
              "",
              "## Denominators",
              "",
              "| ID | Leaves | Classified | Unclassified | Owner | Task | Test | Manifest |",
              "|---|---:|---:|---:|---:|---:|---:|---|",
          ]
          for row in denominator_rows:
              lines.append(
                  f"| `{row['id']}` | {row['leaf_count']} | {row['classified_count']} | "
                  f"{row['unclassified_count']} | {row['owner_bound_count']} | "
                  f"{row['task_bound_count']} | {row['test_bound_count']} | "
                  f"`{row['manifest']['path']}` |"
              )
          lines.extend(
              [
                  "",
                  "## Required independent decision",
                  "",
                  "Two or more non-author reviewers must verify exact upstream identity, leaf completeness, "
                  "classification, owner/task/test bindings, exclusions and evidence references. This draft "
                  "cannot self-promote to the authoritative review bundle and grants no SG1 credit.",
                  "",
              ]
          )
          REVIEW_MD.write_text("\n".join(lines), encoding="utf-8")

          print(
              json.dumps(
                  {
                      "materialized": len(denominator_rows),
                      "missing": missing,
                      "leaf_count_total": totals["leaf_count_total"],
                      "unclassified_count": totals["unclassified_count"],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Validate materialization and repository source corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/status/DENOMINATOR_MATERIALIZATION.json >/dev/null
          python3 -m json.tool manifests/upstream/denominator-review-packet.draft.json >/dev/null
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py || true
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check

      - name: Commit non-workflow materialization outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add \
            manifests/upstream/candidates \
            manifests/upstream/denominator-review-packet.draft.json \
            docs/status/DENOMINATOR_MATERIALIZATION.json \
            docs/review/DENOMINATOR_REVIEW_PACKET.md
          if git diff --cached --quiet; then
            echo 'No new denominator materialization outputs.'
            exit 0
          fi
          git commit -m "feat(sg1): materialize denominator review candidates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          printf 'new_head=%s\nnew_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

      - name: Advance PR to independent review and refresh reviewer request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.github.com
          pr=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${api}/repos/${GITHUB_REPOSITORY}/pulls/42")
          node_id=$(jq -r '.node_id' <<<"$pr")
          jq -n --arg id "$node_id" \
            '{query:"mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}",variables:{id:$id}}' \
            | curl -fsS -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Content-Type: application/json' \
                --data-binary @- https://api.github.com/graphql \
            > /tmp/ready-response.json || true
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${api}/repos/${GITHUB_REPOSITORY}/pulls/42/requested_reviewers" \
            -d '{"reviewers":["ProfHepta"]}' \
            > /tmp/reviewer-response.json || true
          head=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          status=$(jq -c '{status,materialized_denominator_count,missing_denominators,aggregate,claims}' \
            docs/status/DENOMINATOR_MATERIALIZATION.json)
          body=$(jq -n \
            --arg head "$head" \
            --arg tree "$tree" \
            --arg status "$status" \
            '{body:("Denominator materialization sprint completed.\n\n- exact head: `"+$head+"`\n- exact tree: `"+$tree+"`\n- machine status: `"+$status+"`\n\nThe packet is intentionally pending independent review and grants no compatibility or production credit.")}')
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${api}/repos/${GITHUB_REPOSITORY}/issues/42/comments" \
            -d "$body" >/dev/null || true
