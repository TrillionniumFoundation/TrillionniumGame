name: tmp-monitor-product-integration-v3

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-monitor-product-integration-v3.yml

permissions:
  checks: read
  contents: read
  pull-requests: write
  issues: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  BRANCH: integration/plan-v32-product-surface-v3-20260909
  GH_TOKEN: ${{ github.token }}

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Wait for singular assured integration PR
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          head=''
          pr=''
          for _ in $(seq 1 1080); do
            head="$(gh api "repos/${REPOSITORY}/branches/${BRANCH}" --jq '.commit.sha' 2>/dev/null || true)"
            if test -n "$head"; then
              pr="$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
              test -n "$pr" && break
            fi
            sleep 20
          done
          test -n "$head"
          test -n "$pr"
          printf 'head=%s\npr=%s\n' "$head" "$pr" >> "$GITHUB_OUTPUT"

      - name: Require stable aggregate and prospective merge
        shell: bash
        run: |
          set -euo pipefail
          head='${{ steps.subject.outputs.head }}'
          pr='${{ steps.subject.outputs.pr }}'
          stable=0
          for _ in $(seq 1 900); do
            current="$(gh api "repos/${REPOSITORY}/branches/${BRANCH}" --jq '.commit.sha')"
            if test "$current" != "$head"; then head="$current"; stable=0; sleep 20; continue; fi
            payload="$(gh api "repos/${REPOSITORY}/commits/${head}/check-runs?per_page=100")"
            canonical="$(jq -c 'reduce .check_runs[] as $run ({}; if .[$run.name] == null or ((.[$run.name].started_at // "") < ($run.started_at // "")) then .[$run.name] = $run else . end) | [.[]]' <<<"$payload")"
            total="$(jq 'length' <<<"$canonical")"
            pending="$(jq '[.[]|select(.status!="completed")]|length' <<<"$canonical")"
            failed="$(jq '[.[]|select(.status=="completed" and (.conclusion!="success" and .conclusion!="neutral" and .conclusion!="skipped"))]|length' <<<"$canonical")"
            aggregate="$(jq '[.[]|select(.name=="trillionnium-game-merge-gate" and .status=="completed" and .conclusion=="success")]|length' <<<"$canonical")"
            prospective="$(jq '[.[]|select(.name=="prospective-merge-gate" and .status=="completed" and .conclusion=="success")]|length' <<<"$canonical")"
            if test "$total" -gt 0 && test "$pending" -eq 0 && test "$failed" -eq 0 && test "$aggregate" -gt 0 && test "$prospective" -gt 0; then stable=$((stable+1)); else stable=0; fi
            if test "$failed" -gt 0 && test "$pending" -eq 0; then
              jq -r '.[]|select(.status=="completed" and (.conclusion!="success" and .conclusion!="neutral" and .conclusion!="skipped"))|"- `\(.name)`: \(.conclusion) — \(.html_url)"' <<<"$canonical" > "$RUNNER_TEMP/failures.md"
              { printf 'Assured integration head `%s` has terminal failures:\n\n' "$head"; cat "$RUNNER_TEMP/failures.md"; printf '\nNo review or merge credit.\n'; } > "$RUNNER_TEMP/comment.md"
              gh pr comment "$pr" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
              exit 1
            fi
            if test "$stable" -ge 2; then
              gh pr ready "$pr" --repo "$REPOSITORY"
              gh pr edit "$pr" --repo "$REPOSITORY" --add-reviewer Tomasrgbsf --add-reviewer Franksudoman
              gh pr comment "$pr" --repo "$REPOSITORY" --body "The second-layer-assured integration head \`${head}\` has stable terminal-success aggregate and prospective-merge results. Ready for conflict-free independent source review only; accepted evidence, production, cutover and retirement remain false."
              gh issue comment 129 --repo "$REPOSITORY" --body "The second-layer-assured product integration head \`${head}\` reached stable aggregate and prospective-merge CI and is ready for independent review. #129 remains open until complete evidence and product acceptance."
              exit 0
            fi
            sleep 20
          done
          gh pr comment "$pr" --repo "$REPOSITORY" --body "No stable terminal aggregate plus prospective-merge pair was observed before timeout. The PR remains Draft and unqualified."
          exit 1
