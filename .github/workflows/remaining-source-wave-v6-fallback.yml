name: remaining-source-wave-v6-fallback

on:
  push:
    branches: [tooling/outbox-evidence-sealing-staging-2026-09-07a]
    paths:
      - '.github/workflows/remaining-source-wave-v6-fallback.yml'

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
  SOURCE_WAVE: codex/remaining-source-blockers-wave-v3-2026-09-06
  PRIMARY_WORKFLOW: remaining-source-wave-v5-rebase
  OUTPUT_BRANCH: codex/remaining-source-blockers-wave-v6-2026-09-07
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never

jobs:
  fallback-only-after-primary-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for primary and exit cleanly if it succeeded
        id: primary
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          deadline=$((SECONDS + 7200))
          while :; do
            runs=$(curl -fsSL "${headers[@]}" "$api/actions/runs?branch=tooling%2Foutbox-evidence-sealing-staging-2026-09-07a&per_page=100")
            row=$(jq -c --arg name "$PRIMARY_WORKFLOW" '[.workflow_runs[]|select(.name==$name)]|sort_by(.run_attempt,.id)|last//{}' <<<"$runs")
            id=$(jq -r '.id//empty' <<<"$row")
            status=$(jq -r '.status//"missing"' <<<"$row")
            conclusion=$(jq -r '.conclusion//""' <<<"$row")
            if [ -n "$id" ] && [ "$status" = completed ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'primary did not reach terminal state' >&2; exit 1; fi
            sleep 30
          done
          printf 'primary_run=%s\nprimary_conclusion=%s\n' "$id" "$conclusion"
          if [ "$conclusion" = success ]; then echo 'needed=false' >> "$GITHUB_OUTPUT"; else echo 'needed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Fetch exact product and source wave
        if: steps.primary.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags origin \
            "refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/product" \
            "refs/heads/${SOURCE_WAVE}:refs/remotes/origin/source-wave"
          git -C "$GITHUB_WORKSPACE/source" checkout -b "$OUTPUT_BRANCH" refs/remotes/origin/product
          git -C "$GITHUB_WORKSPACE/source" rev-parse refs/remotes/origin/product > "$RUNNER_TEMP/product-head"
          git -C "$GITHUB_WORKSPACE/source" rev-parse refs/remotes/origin/source-wave > "$RUNNER_TEMP/wave-head"

      - name: Apply three-way source patch with protected-authority policy
        if: steps.primary.outputs.needed == 'true'
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          base=$(git merge-base refs/remotes/origin/product refs/remotes/origin/source-wave)
          git diff --binary "$base" refs/remotes/origin/source-wave > "$RUNNER_TEMP/wave.patch"
          set +e
          git apply --3way --index "$RUNNER_TEMP/wave.patch"
          apply_status=$?
          set -e
          if [ "$apply_status" -ne 0 ]; then
            while IFS= read -r path; do
              case "$path" in
                .github/*|CURRENT_PLAN.md|docs/status/*|docs/evidence/*|docs/governance/*|scripts/ci-outbox-final-attempt-reaper.sh)
                  git checkout --ours -- "$path" ;;
                *) git checkout --theirs -- "$path" ;;
              esac
              git add -- "$path"
            done < <(git diff --name-only --diff-filter=U)
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          if git diff --cached --name-only | grep -Eq '^\.github/'; then echo 'fallback may not alter GitHub workflow/control paths' >&2; exit 1; fi
          if git diff --cached --name-only | grep -Eq '^(CURRENT_PLAN\.md|docs/status/|docs/evidence/|docs/governance/)'; then echo 'fallback may not replace formal authority paths' >&2; exit 1; fi
          test -f crates/trnm-persistence-core/tests/outbox_state_model.rs
          test -f crates/trnm-presence-router-v2/src/session_registry.rs
          test -f crates/trnm-server/src/main.rs
          test -f crates/trnm-token-crypto-provider/src/lib.rs
          test -f crates/trnm-persistence-core/src/migration_fence.rs
          test ! -e crates/trnm-persistence-pg/src/bin/trnm-server.rs
          test ! -e crates/trnm-persistence-pg/src/bin/trnm_server

      - name: Validate Rust Go and complete control plane
        if: steps.primary.outputs.needed == 'true'
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in crates/trnm-persistence-core/Cargo.toml crates/trnm-persistence-pg/Cargo.toml crates/trnm-presence-router-v2/Cargo.toml crates/trnm-token-crypto-provider/Cargo.toml crates/trnm-server/Cargo.toml; do
            test -f "$manifest"
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          files=$(find runtime -type f -name '*.go' -print | sort); test -n "$files"; test -z "$(printf '%s\n' "$files"|xargs gofmt -l)"
          (cd runtime && go test ./... -count=1 && go test -race ./... -count=1 && go vet ./...)
          python3 -m compileall -q scripts tools tests
          for script in check-documentation-authority.py check-plan.py check-evidence-index.py check-gap-register.py derive-gap-status.py derive-gates.py check-status-transitions.py check-workflow-action-policy.py check-repository-hygiene.py check-trnm-server.py check-rust-foundation.py check-rust-package-inventory.py; do python3 "scripts/$script"; done
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"; grep -qx OK "$RUNNER_TEMP/full-python.log"

      - name: Publish fallback candidate and Draft PR
        if: steps.primary.outputs.needed == 'true'
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          product=$(cat "$RUNNER_TEMP/product-head")
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}"|awk '{print $1}')" = "$product"
          test -z "$(git ls-remote origin "refs/heads/${OUTPUT_BRANCH}"|awk '{print $1}')"
          git config user.name 'Qian QI'; git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'feat: rebase remaining Plan v3.1 source wave with protected authority'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN"|base64|tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"
          head=$(git rev-parse HEAD); tree=$(git rev-parse HEAD^{tree})
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"; headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          jq -n --arg title 'feat: protected-authority fallback for remaining Plan v3.1 source wave' --arg head "$OUTPUT_BRANCH" --arg base "$PRODUCT_BRANCH" --arg body "Product parent: \`$product\`\nHead: \`$head\`\nTree: \`$tree\`\n\nFallback activated only because v5 failed. Formal plan, gap, evidence, governance and workflow authority remained from the current product candidate. Exact-head CI, artifacts and independent review remain mandatory.\n\n\`\`\`text\naccepted_evidence=false\ngap_closed=false\nproduction_ready=false\n\`\`\`" '{title:$title,head:$head,base:$base,body:$body,draft:true}' > "$RUNNER_TEMP/pr.json"
          number=$(curl -fsSL -X POST "${headers[@]}" "$api/pulls" --data-binary @"$RUNNER_TEMP/pr.json" | jq -r '.number')
          jq -n '{reviewers:["Tomasrgbsf"]}' > "$RUNNER_TEMP/review.json"
          curl -sS -X POST "${headers[@]}" "$api/pulls/$number/requested_reviewers" --data-binary @"$RUNNER_TEMP/review.json" >/dev/null || true
          printf 'head=%s\ntree=%s\npr=%s\n' "$head" "$tree" "$number"
