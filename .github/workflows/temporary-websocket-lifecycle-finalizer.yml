name: temporary-websocket-lifecycle-finalizer

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: trillionnium-plan-v3-single-writer
  cancel-in-progress: false

jobs:
  recover-verify-and-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Fetch quiet exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          sleep 90
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - name: Recover missing persistent lifecycle source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          root = Path('.')
          websocket = root / 'crates/trnm-persistence-pg/src/bin/trnm_server/websocket.rs'
          config = root / 'crates/trnm-persistence-pg/src/bin/trnm_server/config.rs'
          server = root / 'crates/trnm-persistence-pg/src/bin/trnm_server/server.rs'
          permanent = root / '.github/workflows/websocket-persistent-lifecycle.yml'
          ready = (
              websocket.is_file()
              and 'serve_persistent' in websocket.read_text(encoding='utf-8')
              and 'TRNM_SERVER_WEBSOCKET_MAX_MESSAGES' in config.read_text(encoding='utf-8')
              and 'websocket::serve_persistent' in server.read_text(encoding='utf-8')
              and permanent.is_file()
          )
          if ready:
              raise SystemExit(0)
          original = root / '.github/workflows/temporary-websocket-lifecycle-closure.yml'
          if not original.is_file():
              raise SystemExit('persistent WebSocket frontier incomplete and recovery payload absent')
          lines = original.read_text(encoding='utf-8').splitlines()

          def block(name: str) -> str:
              marker = f'      - name: {name}'
              try:
                  start = lines.index(marker)
              except ValueError as error:
                  raise SystemExit(f'missing recovery step: {name}') from error
              run = None
              for index in range(start + 1, len(lines)):
                  if lines[index].startswith('      - name: '):
                      break
                  if lines[index] == '        run: |':
                      run = index + 1
                      break
              if run is None:
                  raise SystemExit(f'missing run block: {name}')
              output = []
              for index in range(run, len(lines)):
                  line = lines[index]
                  if line.startswith('      - name: '):
                      break
                  if line and not line.startswith('          '):
                      raise SystemExit(f'noncanonical recovery indentation: {line!r}')
                  output.append(line[10:] if line else '')
              return '\n'.join(output) + '\n'

          first = block('Add pinned wire dependencies and persistent lifecycle source')
          first = first.replace(
              "routes = re.findall(r'\"(/[^\"\\n]*socket[^\"\\n]*)\"', prior)",
              "routes = [path for path in re.findall(r'\"(/[^\"\\n]+)\"', prior) if any(token in path for token in ('socket', 'websocket', '/ws', 'realtime'))]",
          )
          first = first.replace(
              "template.replace('__ROUTE__', route).replace('          ', '')",
              "template.replace('__ROUTE__', route)",
          )
          script = root / '.git/recover-websocket-source.sh'
          script.write_text(first, encoding='utf-8')
          subprocess.run(['bash', str(script)], check=True)
          for name in (
              'Bind lifecycle limit into typed server config and routing',
              'Generate persistent lifecycle process workflow',
          ):
              script = root / '.git' / ('recover-' + name.lower().replace(' ', '-') + '.sh')
              script.write_text(block(name), encoding='utf-8')
              subprocess.run(['bash', str(script)], check=True)
          PY
          test -f .github/workflows/websocket-persistent-lifecycle.yml
          grep -q 'serve_persistent' crates/trnm-persistence-pg/src/bin/trnm_server/websocket.rs
          grep -q 'websocket::serve_persistent' crates/trnm-persistence-pg/src/bin/trnm_server/server.rs
          git diff --check

      - name: Preserve compatibility entry points and canonical handshake output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          path = Path('crates/trnm-persistence-pg/src/bin/trnm_server/websocket.rs')
          source = path.read_text(encoding='utf-8')
          if '#[allow(dead_code)]\npub fn serve_once' not in source:
              source = source.replace(
                  'pub fn serve_once<R: Repository>(',
                  '#[allow(dead_code)]\npub fn serve_once<R: Repository>(',
                  1,
              )
          start = source.find('fn write_handshake(')
          end = source.find('\nfn handshake_accept(', start)
          if start < 0 or end < 0:
              raise SystemExit(f'{path}: handshake function anchors missing')
          replacement = '''fn write_handshake(
    stream: &mut TcpStream,
    request: &Request,
    protocol: Option<&str>,
) -> Result<(), ServerError> {
    let key = request
        .header("sec-websocket-key")
        .ok_or_else(|| InputError::new("websocket_key_missing"))?;
    let accept = handshake_accept(key);
    let mut response = format!(
        "HTTP/1.1 101 Switching Protocols\\r\\n\\
Upgrade: websocket\\r\\n\\
Connection: Upgrade\\r\\n\\
Sec-WebSocket-Accept: {accept}\\r\\n"
    );
    if let Some(protocol) = protocol {
        response.push_str(&format!("Sec-WebSocket-Protocol: {protocol}\\r\\n"));
    }
    response.push_str("\\r\\n");
    stream.write_all(response.as_bytes())?;
    stream.flush()?;
    Ok(())
}
'''
          source = source[:start] + replacement + source[end:]
          source = source.replace(
              '''                    Err(error) => {
                        let _ = write_close(stream, 1002, "protocol_error");
                        return Err(error);
                    }
''',
              '''                    Err(error) => {
                        let _ = write_close(stream, 1002, "protocol_error");
                        eprintln!("trnm-server WebSocket protocol failure: {error}");
                        return Ok(());
                    }
''',
              1,
          )
          source = source.replace(
              'fn published_handshake_vector_is_exact()',
              'fn rfc6455_handshake_accept_matches_the_published_vector()',
          )
          source = source.replace(
              'fn masked_text_ping_and_close_frames_decode_exactly()',
              'fn masked_single_text_frame_is_unmasked_exactly()',
          )
          source = source.replace(
              'fn server_frames_are_unmasked_and_canonical()',
              'fn server_text_and_close_frames_are_unmasked_and_canonical()',
          )
          if 'fn sha1_and_base64_helpers_match_known_vectors()' not in source:
              marker = '''    #[test]
    fn rfc6455_handshake_accept_matches_the_published_vector() {
'''
              index = source.find(marker)
              if index < 0:
                  raise SystemExit(f'{path}: handshake test anchor missing')
              alias = '''    #[test]
    fn sha1_and_base64_helpers_match_known_vectors() {
        assert_eq!(
            handshake_accept("dGhlIHNhbXBsZSBub25jZQ=="),
            "s3pPLMBiTxaQ9kYGzzhZRbK+xOo="
        );
    }

'''
              source = source[:index] + alias + source[index:]
          if 'fn malformed_key_version_and_subprotocol_fail_closed()' not in source:
              insert = source.rfind('\n}')
              test = '''
    #[test]
    fn malformed_key_version_and_subprotocol_fail_closed() {
        let base = |key: &str, version: &str, protocol: &str| {
            Request::new(
                "GET",
                ROUTE,
                BTreeMap::from([
                    ("upgrade".to_owned(), "websocket".to_owned()),
                    ("connection".to_owned(), "Upgrade".to_owned()),
                    ("sec-websocket-version".to_owned(), version.to_owned()),
                    ("sec-websocket-key".to_owned(), key.to_owned()),
                    ("sec-websocket-protocol".to_owned(), protocol.to_owned()),
                ]),
                Vec::new(),
            )
        };
        assert!(validate_handshake(&base("bad", "13", SUBPROTOCOL)).is_err());
        assert!(validate_handshake(&base(
            "dGhlIHNhbXBsZSBub25jZQ==",
            "12",
            SUBPROTOCOL,
        ))
        .is_err());
        assert!(validate_handshake(&base(
            "dGhlIHNhbXBsZSBub25jZQ==",
            "13",
            "unsupported",
        ))
        .is_err());
    }
'''
              source = source[:insert] + test + source[insert:]
          path.write_text(source, encoding='utf-8')

          server = Path('crates/trnm-persistence-pg/src/bin/trnm_server/server.rs')
          text = server.read_text(encoding='utf-8')
          if 'websocket::serve_persistent(' not in text:
              text, count = re.subn(
                  r'websocket::serve_once\((.*?)config\.max_request_bytes,\s*\)',
                  r'websocket::serve_persistent(\1config.max_request_bytes, config.websocket_max_messages,)',
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(f'{server}: persistent route replacement failed')
          server.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Resolve lock, format, test and strictly lint
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo check --package trnm-persistence-pg --all-targets
          cargo fmt --all
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --fix --allow-dirty --allow-staged \
            --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run persistent lifecycle against the authoritative PostgreSQL profile
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_IMAGE="$(grep -Eo '(docker.io/library/)?postgres(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' .github/workflows/websocket-persistent-lifecycle.yml | head -1)"
          test -n "$POSTGRES_IMAGE"
          docker run -d --name trnm-websocket-db -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55438:5432 "$POSTGRES_IMAGE"
          for attempt in $(seq 1 90); do
            if docker exec trnm-websocket-db pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90; sleep 1
          done
          export TRNM_SERVER_DATABASE_URL=postgresql://postgres@127.0.0.1:55438/postgres
          export TRNM_SERVER_DATABASE_PROFILE=postgresql
          export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$GITHUB_SHA"
          export TRNM_SERVER_ADMIN_TOKEN=0123456789abcdefghijklmnopqrstuvwxyzABCDE
          export TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE=1
          export TRNM_SERVER_BIND=127.0.0.1:57351
          export TRNM_SERVER_WORKER_COUNT=2
          export TRNM_SERVER_CONNECTION_QUEUE_CAPACITY=16
          export TRNM_SERVER_WEBSOCKET_MAX_MESSAGES=8
          cargo run --quiet --package trnm-persistence-pg --bin trnm-server -- migrate
          cargo run --quiet --package trnm-persistence-pg --bin trnm-server -- serve \
            > /tmp/trnm-websocket.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; docker rm -f trnm-websocket-db >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import json, re, socket, struct, time
          source=open('crates/trnm-persistence-pg/src/bin/trnm_server/websocket.rs').read()
          route=re.search(r'const ROUTE: &str = "([^"]+)";',source).group(1)
          address=('127.0.0.1',57351); token='0123456789abcdefghijklmnopqrstuvwxyzABCDE'
          for _ in range(200):
              try:
                  with socket.create_connection(address,timeout=.2): break
              except OSError: time.sleep(.05)
          else: raise SystemExit('server did not become reachable')
          def http(method,path,body=b''):
              with socket.create_connection(address,timeout=3) as sock:
                  h=[f'{method} {path} HTTP/1.1','Host: localhost',f'Authorization: Bearer {token}',f'Content-Length: {len(body)}','Connection: close']
                  if body:h.append('Content-Type: application/json')
                  sock.sendall(('\r\n'.join(h)+'\r\n\r\n').encode()+body);data=b''
                  while True:
                      c=sock.recv(4096)
                      if not c:break
                      data+=c
              return data
          bootstrap=json.dumps({'entity_id':'01'*16,'authority_generation':1,'state_digest':'02'*32,'updated_at_ms':10},separators=(',',':')).encode()
          assert http('POST','/v1/authority/bootstrap',bootstrap).startswith(b'HTTP/1.1 201')
          def send(sock,opcode,payload):
              mask=b'\x11\x22\x33\x44';n=len(payload);head=bytes([0x80|opcode])
              if n<=125:head+=bytes([0x80|n])
              elif n<=65535:head+=bytes([0x80|126])+struct.pack('!H',n)
              else:head+=bytes([0x80|127])+struct.pack('!Q',n)
              sock.sendall(head+mask+bytes(x^mask[i%4] for i,x in enumerate(payload)))
          def recv(sock):
              h=sock.recv(2);assert len(h)==2 and not h[1]&0x80;n=h[1]&0x7f
              if n==126:n=struct.unpack('!H',sock.recv(2))[0]
              elif n==127:n=struct.unpack('!Q',sock.recv(8))[0]
              p=b''
              while len(p)<n:p+=sock.recv(n-len(p))
              return h[0]&0xf,p
          with socket.create_connection(address,timeout=4) as sock:
              sock.sendall((f'GET {route} HTTP/1.1\r\nHost: localhost\r\nUpgrade: websocket\r\nConnection: keep-alive, Upgrade\r\nSec-WebSocket-Version: 13\r\nSec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\r\nSec-WebSocket-Protocol: trnm-json-v1\r\nAuthorization: Bearer {token}\r\n\r\n').encode())
              hs=b''
              while b'\r\n\r\n' not in hs:hs+=sock.recv(4096)
              assert hs.startswith(b'HTTP/1.1 101') and b'Sec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=' in hs and b'trnm-json-v1' in hs,hs
              send(sock,9,b'heartbeat');assert recv(sock)==(10,b'heartbeat')
              commit=json.dumps({'entity_id':'01'*16,'command_id':'03'*16,'fingerprint':'04'*32,'expected_revision':0,'authority_generation':1,'next_state_digest':'05'*32,'committed_at_ms':11,'event_id':'06'*16,'event_payload_digest':'07'*32,'intent_id':'08'*16,'intent_kind':'broadcast','intent_payload_digest':'09'*32,'available_at_ms':11},separators=(',',':')).encode()
              send(sock,1,commit);o,p=recv(sock);assert o==1 and b'"outcome":"applied"' in p,p
              send(sock,1,commit);o,p=recv(sock);assert o==1 and b'"outcome":"duplicate"' in p,p
              send(sock,8,struct.pack('!H',1000));o,p=recv(sock);assert o==8 and p[:2]==struct.pack('!H',1000)
          assert http('POST','/-/drain').startswith(b'HTTP/1.1 200')
          PY
          for attempt in $(seq 1 100); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then wait "$SERVER_PID"; exit 0; fi
            sleep 0.1
          done
          cat /tmp/trnm-websocket.log >&2
          exit 1

      - name: Delete every temporary writer and push unchanged-tip result
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) \
            -print -delete
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(realtime): add persistent WebSocket JSON lifecycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
