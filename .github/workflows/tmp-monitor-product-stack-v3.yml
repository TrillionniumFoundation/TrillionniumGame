name: tmp-monitor-product-stack-v3

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-monitor-product-stack-v3.yml

permissions:
  checks: read
  contents: read
  pull-requests: write
  issues: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  GH_TOKEN: ${{ github.token }}

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: feature/plan-v32-console-core-20260909
            issue: 145
            label: console-wave8
          - branch: feature/plan-v32-provider-value-core-20260909
            issue: 146
            label: provider-value-wave9
          - branch: feature/plan-v32-migration-core-20260909
            issue: 147
            label: migration-wave10
    steps:
      - name: Wait for exact branch and PR
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          head=''
          for _ in $(seq 1 720); do
            head="$(gh api "repos/${REPOSITORY}/branches/${{ matrix.branch }}" --jq '.commit.sha' 2>/dev/null || true)"
            test -n "$head" && break
            sleep 30
          done
          test -n "$head"
          pr=''
          for _ in $(seq 1 20); do
            pr="$(gh pr list --repo "$REPOSITORY" --head '${{ matrix.branch }}' --state open --json number --jq '.[0].number // empty')"
            test -n "$pr" && break
            sleep 15
          done
          test -n "$pr"
          printf 'head=%s\npr=%s\n' "$head" "$pr" >> "$GITHUB_OUTPUT"

      - name: Wait for stable exact-head aggregate
        shell: bash
        run: |
          set -euo pipefail
          head='${{ steps.subject.outputs.head }}'
          pr='${{ steps.subject.outputs.pr }}'
          stable_observations=0
          for _ in $(seq 1 600); do
            current="$(gh api "repos/${REPOSITORY}/branches/${{ matrix.branch }}" --jq '.commit.sha')"
            if test "$current" != "$head"; then
              head="$current"
              stable_observations=0
              sleep 30
              continue
            fi
            payload="$(gh api "repos/${REPOSITORY}/commits/${head}/check-runs?per_page=100")"
            total="$(jq '.total_count' <<<"$payload")"
            pending="$(jq '[.check_runs[]|select(.status!="completed")]|length' <<<"$payload")"
            failed="$(jq '[.check_runs[]|select(.status=="completed" and (.conclusion!="success" and .conclusion!="neutral" and .conclusion!="skipped"))]|length' <<<"$payload")"
            aggregate="$(jq '[.check_runs[]|select(.name=="trillionnium-game-merge-gate" and .status=="completed" and .conclusion=="success")]|length' <<<"$payload")"
            if test "$pending" -eq 0; then stable_observations=$((stable_observations+1)); else stable_observations=0; fi
            if test "$failed" -gt 0 && test "$pending" -eq 0 && test "$stable_observations" -ge 2; then
              jq -r '.check_runs[]|select(.status=="completed" and (.conclusion!="success" and .conclusion!="neutral" and .conclusion!="skipped"))|"- `\(.name)`: \(.conclusion) — \(.html_url)"' <<<"$payload" >/tmp/failures.md
              { printf 'Stable exact-head checks failed for `%s`.\n\n' "$head"; cat /tmp/failures.md; printf '\nThe PR remains Draft and requires source repair.\n'; } >/tmp/comment.md
              gh pr comment "$pr" --repo "$REPOSITORY" --body-file /tmp/comment.md
              exit 1
            fi
            if test "$total" -gt 0 && test "$pending" -eq 0 && test "$failed" -eq 0 && test "$aggregate" -gt 0 && test "$stable_observations" -ge 2; then
              gh pr ready "$pr" --repo "$REPOSITORY"
              gh pr edit "$pr" --repo "$REPOSITORY" --add-reviewer Tomasrgbsf --add-reviewer Franksudoman
              gh pr comment "$pr" --repo "$REPOSITORY" --body "Stable exact-head checks are terminal-success with the aggregate for \`${head}\`. Ready for independent review only; complete product/evidence/production claims remain false."
              gh issue comment '${{ matrix.issue }}' --repo "$REPOSITORY" --body "${{ matrix.label }} exact-head source \`${head}\` reached stable aggregate CI success and is ready for independent review. The issue remains open."
              exit 0
            fi
            sleep 30
          done
          gh pr comment "$pr" --repo "$REPOSITORY" --body "No stable terminal aggregate was observed before monitor timeout. The PR remains Draft and receives no gate credit."
          exit 1
