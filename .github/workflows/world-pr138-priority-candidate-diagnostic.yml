name: World PR138 priority candidate diagnostic

on:
  push:
    branches: [ops/world-pr138-source-diagnostic-20260912]

permissions:
  contents: read

concurrency:
  group: world-pr138-priority-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  WORLD_BRANCH: qualification/world-pr138-priority-candidate-20260912-a
  WORLD_HEAD: c23dcb1649c7f75abcabb7fbb17ae9c043be1777
  WORLD_TREE: 143651373b7c50c23be114ee39a60c1e780174cb
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'
  PRODUCTION_AUTHORIZATION: not_granted

jobs:
  qualify-candidate:
    name: world-pr138-priority-candidate-diagnostic-not-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Materialize exact World candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          git clone --quiet --no-checkout --single-branch --branch "$WORLD_BRANCH" \
            https://github.com/TrillionniumFoundation/Trillionnium-World.git "$RUNNER_TEMP/world"
          git -C "$RUNNER_TEMP/world" checkout --quiet --detach "$WORLD_HEAD"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse HEAD)" = "$WORLD_HEAD"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"
          test -z "$(git -C "$RUNNER_TEMP/world" status --porcelain=v1 --untracked-files=no)"
          {
            printf 'world_head=%s\n' "$WORLD_HEAD"
            printf 'world_tree=%s\n' "$WORLD_TREE"
            printf 'repository_native_admission=false\n'
            printf 'production_authorization=%s\n' "$PRODUCTION_AUTHORIZATION"
          } > "$GITHUB_WORKSPACE/evidence/identity.txt"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          test "$(rustc --version | awk '{print $2}')" = "$RUSTUP_TOOLCHAIN"
          rustc --version --verbose | tee "$GITHUB_WORKSPACE/evidence/rustc.txt"
          cargo --version --verbose | tee "$GITHUB_WORKSPACE/evidence/cargo.txt"

      - name: Run source-policy regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          python3 -B -m unittest \
            scripts.test_trnm_world_priority_contracts \
            scripts.test_trnm_world_priority_preflight -v 2>&1 \
            | tee "$GITHUB_WORKSPACE/evidence/python-source-policy.log"

      - name: Materialize deterministic rustfmt patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          cargo fmt --manifest-path trillionnium/crates/world-authority/Cargo.toml --all
          git diff --check
          git diff --binary -- trillionnium/crates/world-authority \
            > "$GITHUB_WORKSPACE/evidence/rustfmt.patch"
          test -s "$GITHUB_WORKSPACE/evidence/rustfmt.patch"
          sha256sum "$GITHUB_WORKSPACE/evidence/rustfmt.patch" \
            > "$GITHUB_WORKSPACE/evidence/rustfmt.patch.sha256"
          cargo fmt --manifest-path trillionnium/crates/world-authority/Cargo.toml --all -- --check

      - name: Run all World authority targets after deterministic rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          cargo test --manifest-path trillionnium/crates/world-authority/Cargo.toml \
            --workspace --all-targets --locked 2>&1 \
            | tee "$GITHUB_WORKSPACE/evidence/rust-test.log"

      - name: Run strict Clippy after deterministic rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          cargo clippy --manifest-path trillionnium/crates/world-authority/Cargo.toml \
            --workspace --all-targets --locked -- -D warnings 2>&1 \
            | tee "$GITHUB_WORKSPACE/evidence/clippy.log"

      - name: Record formatted working-tree diff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -d "$RUNNER_TEMP/world/.git"; then
            git -C "$RUNNER_TEMP/world" status --short \
              > "$GITHUB_WORKSPACE/evidence/formatted-status.txt"
            git -C "$RUNNER_TEMP/world" diff --stat \
              > "$GITHUB_WORKSPACE/evidence/formatted-diff-stat.txt"
          fi
          printf 'repository_native_admission=false\n' >> "$GITHUB_WORKSPACE/evidence/identity.txt"
          printf 'independent_acceptance=false\n' >> "$GITHUB_WORKSPACE/evidence/identity.txt"

      - name: Hash retained diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f ! -name MANIFEST.sha256 -print0 \
            | sort -z | xargs -0 -r sha256sum > evidence/MANIFEST.sha256

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-pr138-priority-candidate-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 14
