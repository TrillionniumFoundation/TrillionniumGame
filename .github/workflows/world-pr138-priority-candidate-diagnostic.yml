name: World PR138 priority candidate diagnostic

on:
  push:
    branches: [ops/world-pr138-source-diagnostic-20260912]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pr138-priority-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  WORLD_BRANCH: qualification/world-pr138-priority-candidate-20260912-a
  WORLD_HEAD: c23dcb1649c7f75abcabb7fbb17ae9c043be1777
  WORLD_TREE: 143651373b7c50c23be114ee39a60c1e780174cb
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'
  PRODUCTION_AUTHORIZATION: not_granted

jobs:
  qualify-candidate:
    name: world-pr138-priority-candidate-diagnostic-not-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Materialize exact World candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git clone --quiet --no-checkout --single-branch --branch "$WORLD_BRANCH" \
            https://github.com/TrillionniumFoundation/Trillionnium-World.git "$RUNNER_TEMP/world"
          git -C "$RUNNER_TEMP/world" checkout --quiet --detach "$WORLD_HEAD"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse HEAD)" = "$WORLD_HEAD"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"
          test -z "$(git -C "$RUNNER_TEMP/world" status --porcelain=v1 --untracked-files=no)"
          {
            printf 'repository=TrillionniumFoundation/Trillionnium-World\n'
            printf 'branch=%s\n' "$WORLD_BRANCH"
            printf 'commit=%s\n' "$WORLD_HEAD"
            printf 'tree=%s\n' "$WORLD_TREE"
            printf 'repository_native_admission=false\n'
            printf 'production_authorization=%s\n' "$PRODUCTION_AUTHORIZATION"
          } > evidence/identity.txt

      - name: Install exact diagnostic toolchain
        id: tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client python3-yaml pkg-config libasound2-dev libudev-dev \
            libx11-dev libxi-dev libxkbcommon-dev libwayland-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          test "$(rustc --version | awk '{print $2}')" = "$RUSTUP_TOOLCHAIN"
          test "$(psql -Atqc 'show server_version_num')" = 160004
          rustc --version --verbose | tee evidence/rustc.txt
          cargo --version --verbose | tee evidence/cargo.txt
          psql -Atqc 'select version()' | tee evidence/postgres.txt

      - name: Run priority source-policy regressions
        if: ${{ always() && !cancelled() && steps.source.outcome == 'success' && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          python3 -B -m unittest \
            scripts.test_trnm_world_priority_contracts \
            scripts.test_trnm_world_priority_preflight -v 2>&1 \
            | tee "$GITHUB_WORKSPACE/evidence/python-priority.log"

      - name: Check Rust formatting
        if: ${{ always() && !cancelled() && steps.source.outcome == 'success' && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          cargo fmt --manifest-path trillionnium/crates/world-authority/Cargo.toml --all -- --check 2>&1 \
            | tee "$GITHUB_WORKSPACE/evidence/rust-format.log"

      - name: Run all World authority targets
        if: ${{ always() && !cancelled() && steps.source.outcome == 'success' && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          cargo test --manifest-path trillionnium/crates/world-authority/Cargo.toml \
            --workspace --all-targets --locked 2>&1 \
            | tee "$GITHUB_WORKSPACE/evidence/rust-test.log"

      - name: Run strict Clippy
        if: ${{ always() && !cancelled() && steps.source.outcome == 'success' && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          cargo clippy --manifest-path trillionnium/crates/world-authority/Cargo.toml \
            --workspace --all-targets --locked -- -D warnings 2>&1 \
            | tee "$GITHUB_WORKSPACE/evidence/clippy.log"

      - name: Run disposable PostgreSQL cutover harness
        if: ${{ always() && !cancelled() && steps.source.outcome == 'success' && steps.tools.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          bash scripts/run-trnm-world-authority-postgres-check.sh 2>&1 \
            | tee "$GITHUB_WORKSPACE/evidence/postgres-cutover.log"

      - name: Hash retained diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f ! -name MANIFEST.sha256 -print0 \
            | sort -z | xargs -0 -r sha256sum > evidence/MANIFEST.sha256

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-pr138-priority-candidate-${{ env.WORLD_HEAD }}-${{ github.run_attempt }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 14
