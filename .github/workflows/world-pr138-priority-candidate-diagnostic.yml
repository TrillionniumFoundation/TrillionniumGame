name: World PR138 priority candidate rustfmt extractor

on:
  push:
    branches: [ops/world-pr138-source-diagnostic-20260912]

permissions:
  contents: read

env:
  WORLD_BRANCH: qualification/world-pr138-priority-candidate-20260912-a
  WORLD_HEAD: c23dcb1649c7f75abcabb7fbb17ae9c043be1777
  WORLD_TREE: 143651373b7c50c23be114ee39a60c1e780174cb
  RUSTUP_TOOLCHAIN: '1.98.1'
  PRODUCTION_AUTHORIZATION: not_granted

jobs:
  extract-rustfmt:
    name: world-pr138-rustfmt-bytes-not-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Materialize exact World candidate
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout --single-branch --branch "$WORLD_BRANCH" \
            https://github.com/TrillionniumFoundation/Trillionnium-World.git "$RUNNER_TEMP/world"
          git -C "$RUNNER_TEMP/world" checkout --quiet --detach "$WORLD_HEAD"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse HEAD)" = "$WORLD_HEAD"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"

      - name: Install rustfmt 1.98.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt >/dev/null
          test "$(rustc --version | awk '{print $2}')" = "$RUSTUP_TOOLCHAIN"

      - name: Emit deterministic formatted files
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          cargo fmt --manifest-path trillionnium/crates/world-authority/Cargo.toml --all
          git diff --check
          mapfile -t files < <(git diff --name-only -- trillionnium/crates/world-authority)
          test "${#files[@]}" -gt 0
          printf 'FORMATTED_FILE_COUNT=%s\n' "${#files[@]}"
          for file in "${files[@]}"; do
            test -f "$file"
            printf 'FORMATTED_FILE_BEGIN path=%s sha256=%s\n' "$file" "$(sha256sum "$file" | awk '{print $1}')"
            base64 -w0 "$file"
            printf '\nFORMATTED_FILE_END path=%s\n' "$file"
          done
          printf 'repository_native_admission=false\nproduction_authorization=%s\n' "$PRODUCTION_AUTHORIZATION"
