name: pr113-stage-index-aware-final-blobs

on:
  push:
    branches:
      - ops/trusted-world-v13k-publisher-plan-v31-2026-09-08
    paths:
      - .github/workflows/pr113-stage-final-v2.yml

permissions:
  contents: write

concurrency:
  group: pr113-stage-index-aware-final-blobs
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TARGET_BRANCH: ops/trusted-world-v13k-publisher-plan-v31-2026-09-08
    steps:
      - name: Fetch exact branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          observed="$(git -C "$GITHUB_WORKSPACE" ls-remote origin \
            "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Generate and validate exact final indexed tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import textwrap
          from pathlib import Path

          source = Path('.github/workflows/pr113-integrator-expression-repair.yml').read_text()
          marker = '      - name: Materialize final registered trusted publisher\n'
          section = source.index(marker)
          command = source.index("          python3 - <<'PY'\n", section)
          start = command + len("          python3 - <<'PY'\n")
          end_marker = "\n          PY\n\n      - name: Validate exact final source"
          end = source.index(end_marker, start)
          program = textwrap.dedent(source[start:end])
          exec(compile(program, '<pr113-final-generator>', 'exec'), {'__name__': '__main__'})

          workflow_path = Path('.github/workflows/world-command-deployed-runtime-v1.yml')
          workflow_path.write_text(
              workflow_path.read_text(encoding='utf-8').rstrip('\n') + '\n',
              encoding='utf-8',
          )

          overlay_path = Path('docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json')
          overlay = json.loads(overlay_path.read_text(encoding='utf-8'))
          rows = [
              row for row in overlay.get('replace_workflows', [])
              if row.get('workflow_id') == 345102133
          ]
          if len(rows) != 1:
              raise SystemExit('registered World workflow overlay drift')
          data = workflow_path.read_bytes()
          rows[0]['git_blob_sha1'] = hashlib.sha1(
              f'blob {len(data)}\0'.encode('ascii') + data
          ).hexdigest()
          canonical = dict(overlay)
          canonical.pop('overlay_sha256', None)
          overlay['overlay_sha256'] = hashlib.sha256(
              json.dumps(canonical, sort_keys=True, separators=(',', ':')).encode('utf-8')
          ).hexdigest()
          overlay_path.write_text(
              json.dumps(overlay, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )

          for temporary in (
              '.github/workflows/pr113-eof-repair.yml',
              '.github/workflows/pr113-stage-final.yml',
              '.github/workflows/pr113-stage-final-v2.yml',
          ):
              path = Path(temporary)
              if not path.exists():
                  raise SystemExit(f'missing temporary workflow: {temporary}')
              path.unlink()
          PY
          git add -A
          git diff --cached --check
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          for path in \
            .github/workflows/trusted-world-v13k-publisher.yml \
            .github/workflows/pr113-trusted-world-integrator.yml \
            .github/workflows/pr113-integrator-expression-repair.yml \
            .github/workflows/pr113-eof-repair.yml \
            .github/workflows/pr113-stage-final.yml \
            .github/workflows/pr113-stage-final-v2.yml; do
            test ! -e "$path"
          done

      - name: Commit only the validated non-workflow staging blobs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p .pr113-staging
          cp .github/workflows/world-command-deployed-runtime-v1.yml \
            .pr113-staging/world-command-deployed-runtime-v1.yml
          cp docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json \
            .pr113-staging/REQUIRED_WORKFLOWS_OVERLAY_V1.json
          git reset --hard HEAD
          actual="$(git status --short | awk '{print $2}' | sort | paste -sd, -)"
          expected=".pr113-staging/"
          test "$actual" = "$expected"
          git config user.name trillionnium-governance-bot
          git config user.email trillionnium-governance-bot@users.noreply.github.com
          git add .pr113-staging
          git commit -m "tooling: stage index-validated trusted publisher blobs"
          staged="$(git rev-parse HEAD)"
          observed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git push origin "${staged}:refs/heads/${TARGET_BRANCH}"
