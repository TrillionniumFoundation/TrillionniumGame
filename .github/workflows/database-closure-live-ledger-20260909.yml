name: database-closure-live-ledger-20260909

on:
  push:
    branches:
      - codex/plan-v32-controller-v2-2026-09-09
    paths:
      - .github/workflows/database-closure-live-ledger-20260909.yml
      - tools/sync_database_closure_ledger.sh
      - docs/internal/database-closure-ledger.request

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: database-closure-live-ledger-20260909
  cancel-in-progress: true

jobs:
  derive-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact controller source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/controller"
          git init "$GITHUB_WORKSPACE/controller"
          git -C "$GITHUB_WORKSPACE/controller" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/controller" fetch --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/controller" checkout -B codex/plan-v32-controller-v2-2026-09-09 FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/controller" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Derive live ledger from GitHub read-back
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ github.workspace }}/controller
        shell: bash
        run: bash "$GITHUB_WORKSPACE/controller/tools/sync_database_closure_ledger.sh"
