name: temporary-outbox-dispatch-closure

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-outbox-dispatch-closure
  cancel-in-progress: false

jobs:
  implement-test-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Fetch exact triggering head without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Materialize generation-fenced outbox dispatch core
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/outbox_dispatch.rs <<'RUST'
          use std::time::Duration;

          use postgres::IsolationLevel;
          use trnm_contracts::{CommandId, Digest32, DomainError, RetryClass, StableCode};

          use super::{EntityId, IntentId, IntentKind, NodeId, PgRepository};

          const STATE_PENDING: i16 = 0;
          const STATE_LEASED: i16 = 1;
          const STATE_DELIVERED: i16 = 2;
          const STATE_DEAD_LETTERED: i16 = 3;

          const LEASE_QUERY: &str =
              "SELECT intent_id, entity_id, command_id, kind, payload_digest, attempt, \
               lease_generation, state FROM trnm_outbox \
               WHERE state IN (0, 1) AND available_at_ms <= $1 \
               ORDER BY available_at_ms, intent_id LIMIT $2 FOR UPDATE";
          const LEASE_UPDATE: &str =
              "UPDATE trnm_outbox SET state = $2, owner_node = $3, attempt = $4, \
               lease_generation = $5, receipt_digest = NULL, dead_reason_digest = NULL, \
               available_at_ms = $6, updated_at_ms = $7 \
               WHERE intent_id = $1 AND state = $8 AND lease_generation = $9";
          const EXHAUST_UPDATE: &str =
              "UPDATE trnm_outbox SET state = $2, owner_node = NULL, receipt_digest = NULL, \
               dead_reason_digest = $3, updated_at_ms = $4 \
               WHERE intent_id = $1 AND state = $5 AND lease_generation = $6";
          const COMPLETE_UPDATE: &str =
              "UPDATE trnm_outbox SET state = $4, owner_node = NULL, receipt_digest = $5, \
               dead_reason_digest = NULL, updated_at_ms = $6 \
               WHERE intent_id = $1 AND state = $2 AND owner_node = $3 \
               AND lease_generation = $7";
          const RETRY_UPDATE: &str =
              "UPDATE trnm_outbox SET state = $4, owner_node = NULL, receipt_digest = NULL, \
               dead_reason_digest = NULL, available_at_ms = $5, updated_at_ms = $6 \
               WHERE intent_id = $1 AND state = $2 AND owner_node = $3 \
               AND lease_generation = $7";
          const DEAD_UPDATE: &str =
              "UPDATE trnm_outbox SET state = $4, owner_node = NULL, receipt_digest = NULL, \
               dead_reason_digest = $5, updated_at_ms = $6 \
               WHERE intent_id = $1 AND state = $2 AND owner_node = $3 \
               AND lease_generation = $7";

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct OutboxLeasePolicy {
              max_batch: u16,
              max_attempts: u32,
              lease_duration: Duration,
              exhausted_reason: Digest32,
          }

          impl OutboxLeasePolicy {
              pub fn new(
                  max_batch: u16,
                  max_attempts: u32,
                  lease_duration: Duration,
                  exhausted_reason: Digest32,
              ) -> Result<Self, DomainError> {
                  let policy = Self {
                      max_batch,
                      max_attempts,
                      lease_duration,
                      exhausted_reason,
                  };
                  policy.validate()?;
                  Ok(policy)
              }

              fn validate(self) -> Result<(), DomainError> {
                  if self.max_batch == 0
                      || self.max_batch > 1024
                      || self.max_attempts == 0
                      || self.max_attempts > i32::MAX as u32
                      || self.lease_duration.is_zero()
                      || self.lease_duration > Duration::from_secs(24 * 60 * 60)
                      || self.exhausted_reason.is_zero()
                  {
                      return Err(invalid("outbox_lease_policy_invalid"));
                  }
                  Ok(())
              }

              fn lease_until(self, now_ms: u64) -> Result<u64, DomainError> {
                  let duration_ms = u64::try_from(self.lease_duration.as_millis())
                      .map_err(|_| invalid("outbox_lease_duration_overflow"))?;
                  now_ms
                      .checked_add(duration_ms)
                      .ok_or_else(|| invalid("outbox_lease_expiry_overflow"))
              }

              #[must_use]
              pub const fn max_batch(self) -> u16 {
                  self.max_batch
              }

              #[must_use]
              pub const fn max_attempts(self) -> u32 {
                  self.max_attempts
              }
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub enum OutboxIntentState {
              Pending,
              Leased,
              Delivered,
              DeadLettered,
          }

          impl OutboxIntentState {
              fn decode(value: i16) -> Result<Self, DomainError> {
                  match value {
                      STATE_PENDING => Ok(Self::Pending),
                      STATE_LEASED => Ok(Self::Leased),
                      STATE_DELIVERED => Ok(Self::Delivered),
                      STATE_DEAD_LETTERED => Ok(Self::DeadLettered),
                      _ => Err(data_loss("invalid_outbox_state")),
                  }
              }
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct LeasedOutboxIntent {
              pub id: IntentId,
              pub entity: EntityId,
              pub command: CommandId,
              pub kind: IntentKind,
              pub payload: Digest32,
              pub attempt: u32,
              pub lease_generation: u64,
              pub lease_expires_at_ms: u64,
              pub owner: NodeId,
          }

          #[derive(Clone, Debug, Default, Eq, PartialEq)]
          pub struct OutboxLeaseBatch {
              pub leased: Vec<LeasedOutboxIntent>,
              pub dead_lettered: Vec<IntentId>,
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub enum OutboxFailureOutcome {
              Retried { available_at_ms: u64 },
              DeadLettered,
          }

          impl PgRepository {
              pub fn lease_outbox(
                  &mut self,
                  owner: NodeId,
                  now_ms: u64,
                  policy: OutboxLeasePolicy,
              ) -> Result<OutboxLeaseBatch, DomainError> {
                  policy.validate()?;
                  if owner.is_zero() {
                      return Err(invalid("outbox_owner_invalid"));
                  }
                  let now_db = to_db_i64(now_ms, "outbox_now_overflow")?;
                  let limit_db = i64::from(policy.max_batch);
                  let lease_expires_at_ms = policy.lease_until(now_ms)?;
                  let lease_expires_db =
                      to_db_i64(lease_expires_at_ms, "outbox_lease_expiry_overflow")?;
                  let max_attempts = i32::try_from(policy.max_attempts)
                      .map_err(|_| invalid("outbox_max_attempts_overflow"))?;

                  let mut transaction = self
                      .client
                      .build_transaction()
                      .isolation_level(IsolationLevel::Serializable)
                      .start()
                      .map_err(super::map_postgres_error)?;
                  let rows = transaction
                      .query(LEASE_QUERY, &[&now_db, &limit_db])
                      .map_err(super::map_postgres_error)?;
                  let mut batch = OutboxLeaseBatch::default();

                  for row in rows {
                      let intent = decode_intent_id(row.get(0))?;
                      let entity = decode_entity_id(row.get(1))?;
                      let command = decode_command_id(row.get(2))?;
                      let kind = decode_kind(row.get(3))?;
                      let payload = decode_digest(row.get(4), "invalid_outbox_payload_digest")?;
                      let attempt_db: i32 = row.get(5);
                      let generation_db: i64 = row.get(6);
                      let prior_state: i16 = row.get(7);
                      if attempt_db < 0 || generation_db < 0 {
                          return Err(data_loss("negative_outbox_counter"));
                      }
                      OutboxIntentState::decode(prior_state)?;

                      if attempt_db >= max_attempts {
                          let updated = transaction
                              .execute(
                                  EXHAUST_UPDATE,
                                  &[
                                      &intent.as_bytes().as_slice(),
                                      &STATE_DEAD_LETTERED,
                                      &policy.exhausted_reason.as_bytes().as_slice(),
                                      &now_db,
                                      &prior_state,
                                      &generation_db,
                                  ],
                              )
                              .map_err(super::map_postgres_error)?;
                          if updated != 1 {
                              return Err(data_loss("outbox_exhaust_transition_lost"));
                          }
                          batch.dead_lettered.push(intent);
                          continue;
                      }

                      let next_attempt = attempt_db
                          .checked_add(1)
                          .ok_or_else(|| data_loss("outbox_attempt_overflow"))?;
                      let next_generation = generation_db
                          .checked_add(1)
                          .ok_or_else(|| data_loss("outbox_lease_generation_overflow"))?;
                      let updated = transaction
                          .execute(
                              LEASE_UPDATE,
                              &[
                                  &intent.as_bytes().as_slice(),
                                  &STATE_LEASED,
                                  &owner.as_bytes().as_slice(),
                                  &next_attempt,
                                  &next_generation,
                                  &lease_expires_db,
                                  &now_db,
                                  &prior_state,
                                  &generation_db,
                              ],
                          )
                          .map_err(super::map_postgres_error)?;
                      if updated != 1 {
                          return Err(data_loss("outbox_lease_transition_lost"));
                      }
                      batch.leased.push(LeasedOutboxIntent {
                          id: intent,
                          entity,
                          command,
                          kind,
                          payload,
                          attempt: u32::try_from(next_attempt)
                              .map_err(|_| data_loss("negative_outbox_attempt"))?,
                          lease_generation: u64::try_from(next_generation)
                              .map_err(|_| data_loss("negative_outbox_lease_generation"))?,
                          lease_expires_at_ms,
                          owner,
                      });
                  }

                  transaction.commit().map_err(super::map_postgres_error)?;
                  Ok(batch)
              }

              pub fn complete_outbox(
                  &mut self,
                  lease: &LeasedOutboxIntent,
                  receipt: Digest32,
                  completed_at_ms: u64,
              ) -> Result<(), DomainError> {
                  validate_lease(lease)?;
                  if receipt.is_zero() {
                      return Err(invalid("outbox_receipt_invalid"));
                  }
                  let completed_at =
                      to_db_i64(completed_at_ms, "outbox_completed_at_overflow")?;
                  let generation = to_db_i64(
                      lease.lease_generation,
                      "outbox_lease_generation_overflow",
                  )?;
                  let updated = self
                      .client
                      .execute(
                          COMPLETE_UPDATE,
                          &[
                              &lease.id.as_bytes().as_slice(),
                              &STATE_LEASED,
                              &lease.owner.as_bytes().as_slice(),
                              &STATE_DELIVERED,
                              &receipt.as_bytes().as_slice(),
                              &completed_at,
                              &generation,
                          ],
                      )
                      .map_err(super::map_postgres_error)?;
                  if updated != 1 {
                      return Err(stale_lease());
                  }
                  Ok(())
              }

              pub fn fail_outbox(
                  &mut self,
                  lease: &LeasedOutboxIntent,
                  reason: Digest32,
                  now_ms: u64,
                  retry_at_ms: u64,
                  max_attempts: u32,
              ) -> Result<OutboxFailureOutcome, DomainError> {
                  validate_lease(lease)?;
                  if reason.is_zero() || max_attempts == 0 || max_attempts > i32::MAX as u32 {
                      return Err(invalid("outbox_failure_policy_invalid"));
                  }
                  let now_db = to_db_i64(now_ms, "outbox_failure_now_overflow")?;
                  let generation = to_db_i64(
                      lease.lease_generation,
                      "outbox_lease_generation_overflow",
                  )?;

                  if lease.attempt >= max_attempts {
                      let updated = self
                          .client
                          .execute(
                              DEAD_UPDATE,
                              &[
                                  &lease.id.as_bytes().as_slice(),
                                  &STATE_LEASED,
                                  &lease.owner.as_bytes().as_slice(),
                                  &STATE_DEAD_LETTERED,
                                  &reason.as_bytes().as_slice(),
                                  &now_db,
                                  &generation,
                              ],
                          )
                          .map_err(super::map_postgres_error)?;
                      if updated != 1 {
                          return Err(stale_lease());
                      }
                      return Ok(OutboxFailureOutcome::DeadLettered);
                  }

                  if retry_at_ms < now_ms {
                      return Err(invalid("outbox_retry_time_before_failure"));
                  }
                  let retry_at = to_db_i64(retry_at_ms, "outbox_retry_at_overflow")?;
                  let updated = self
                      .client
                      .execute(
                          RETRY_UPDATE,
                          &[
                              &lease.id.as_bytes().as_slice(),
                              &STATE_LEASED,
                              &lease.owner.as_bytes().as_slice(),
                              &STATE_PENDING,
                              &retry_at,
                              &now_db,
                              &generation,
                          ],
                      )
                      .map_err(super::map_postgres_error)?;
                  if updated != 1 {
                      return Err(stale_lease());
                  }
                  Ok(OutboxFailureOutcome::Retried {
                      available_at_ms: retry_at_ms,
                  })
              }
          }

          fn validate_lease(lease: &LeasedOutboxIntent) -> Result<(), DomainError> {
              if lease.id.is_zero()
                  || lease.entity.is_zero()
                  || lease.command.is_zero()
                  || lease.payload.is_zero()
                  || lease.attempt == 0
                  || lease.lease_generation == 0
                  || lease.owner.is_zero()
              {
                  return Err(invalid("outbox_lease_invalid"));
              }
              Ok(())
          }

          fn decode_kind(value: i16) -> Result<IntentKind, DomainError> {
              match value {
                  0 => Ok(IntentKind::Broadcast),
                  1 => Ok(IntentKind::SearchIndex),
                  2 => Ok(IntentKind::Notification),
                  3 => Ok(IntentKind::ExternalEffect),
                  4 => Ok(IntentKind::Completion),
                  _ => Err(data_loss("invalid_outbox_kind")),
              }
          }

          fn decode_intent_id(value: Vec<u8>) -> Result<IntentId, DomainError> {
              Ok(IntentId::new(decode_fixed(
                  value,
                  "invalid_outbox_intent_id",
              )?))
          }

          fn decode_entity_id(value: Vec<u8>) -> Result<EntityId, DomainError> {
              Ok(EntityId::new(decode_fixed(
                  value,
                  "invalid_outbox_entity_id",
              )?))
          }

          fn decode_command_id(value: Vec<u8>) -> Result<CommandId, DomainError> {
              Ok(CommandId::new(decode_fixed(
                  value,
                  "invalid_outbox_command_id",
              )?))
          }

          fn decode_digest(value: Vec<u8>, reason: &'static str) -> Result<Digest32, DomainError> {
              Ok(Digest32::new(decode_fixed(value, reason)?))
          }

          fn decode_fixed<const N: usize>(
              value: Vec<u8>,
              reason: &'static str,
          ) -> Result<[u8; N], DomainError> {
              value.try_into().map_err(|_| data_loss(reason))
          }

          fn to_db_i64(value: u64, reason: &'static str) -> Result<i64, DomainError> {
              i64::try_from(value).map_err(|_| invalid(reason))
          }

          fn invalid(reason: &'static str) -> DomainError {
              DomainError::new(StableCode::InvalidArgument, reason, RetryClass::Never)
          }

          fn data_loss(reason: &'static str) -> DomainError {
              DomainError::new(StableCode::DataLoss, reason, RetryClass::Never)
          }

          fn stale_lease() -> DomainError {
              DomainError::new(
                  StableCode::Aborted,
                  "stale_outbox_lease",
                  RetryClass::ResyncRequired,
              )
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn digest(value: u8) -> Digest32 {
                  Digest32::new([value; 32])
              }

              #[test]
              fn policy_is_bounded_and_expiry_is_checked() {
                  let policy = OutboxLeasePolicy::new(
                      64,
                      5,
                      Duration::from_secs(30),
                      digest(1),
                  )
                  .unwrap();
                  assert_eq!(policy.max_batch(), 64);
                  assert_eq!(policy.max_attempts(), 5);
                  assert_eq!(policy.lease_until(1_000).unwrap(), 31_000);
                  assert_eq!(
                      policy.lease_until(u64::MAX).unwrap_err().reason(),
                      "outbox_lease_expiry_overflow"
                  );
              }

              #[test]
              fn unbounded_or_zero_policy_fails_closed() {
                  for (batch, attempts, duration, reason) in [
                      (0, 1, Duration::from_secs(1), digest(1)),
                      (1, 0, Duration::from_secs(1), digest(1)),
                      (1, 1, Duration::ZERO, digest(1)),
                      (1, 1, Duration::from_secs(86_401), digest(1)),
                      (1, 1, Duration::from_secs(1), Digest32::new([0; 32])),
                  ] {
                      assert_eq!(
                          OutboxLeasePolicy::new(batch, attempts, duration, reason)
                              .unwrap_err()
                              .reason(),
                          "outbox_lease_policy_invalid"
                      );
                  }
              }

              #[test]
              fn state_and_kind_decoding_reject_unknown_database_values() {
                  assert_eq!(
                      OutboxIntentState::decode(STATE_PENDING).unwrap(),
                      OutboxIntentState::Pending
                  );
                  assert_eq!(
                      OutboxIntentState::decode(STATE_DEAD_LETTERED).unwrap(),
                      OutboxIntentState::DeadLettered
                  );
                  assert_eq!(
                      OutboxIntentState::decode(9).unwrap_err().reason(),
                      "invalid_outbox_state"
                  );
                  assert_eq!(
                      decode_kind(9).unwrap_err().reason(),
                      "invalid_outbox_kind"
                  );
              }

              #[test]
              fn sql_contract_is_generation_fenced_and_reclaimable() {
                  assert!(LEASE_QUERY.contains("state IN (0, 1)"));
                  assert!(LEASE_QUERY.contains("FOR UPDATE"));
                  for statement in [LEASE_UPDATE, EXHAUST_UPDATE, COMPLETE_UPDATE, RETRY_UPDATE, DEAD_UPDATE] {
                      assert!(statement.contains("lease_generation"));
                  }
                  assert!(COMPLETE_UPDATE.contains("owner_node = $3"));
                  assert!(RETRY_UPDATE.contains("owner_node = $3"));
                  assert!(DEAD_UPDATE.contains("owner_node = $3"));
              }
          }
          RUST

          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          module = root / 'crates/trnm-persistence-pg/src/outbox_dispatch.rs'
          source = Path('/tmp/outbox_dispatch.rs').read_text(encoding='utf-8')
          if module.exists() and module.read_text(encoding='utf-8') != source:
              raise SystemExit(f'{module}: existing implementation differs; refusing overwrite')
          module.write_text(source, encoding='utf-8')

          lib = root / 'crates/trnm-persistence-pg/src/lib.rs'
          text = lib.read_text(encoding='utf-8')
          if 'mod outbox_dispatch;' not in text:
              marker = '#![forbid(unsafe_code)]\n\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'{lib}: source anchor missing or ambiguous')
              text = text.replace(marker, marker + 'mod outbox_dispatch;\n\n', 1)
          export = (
              'pub use outbox_dispatch::{\n'
              '    LeasedOutboxIntent, OutboxFailureOutcome, OutboxIntentState, OutboxLeaseBatch,\n'
              '    OutboxLeasePolicy,\n'
              '};\n\n'
          )
          if 'pub use outbox_dispatch::' not in text:
              marker = 'mod outbox_dispatch;\n\n'
              text = text.replace(marker, marker + export, 1)
          lib.write_text(text, encoding='utf-8')

          doc = root / 'docs/development/PG_OUTBOX_DISPATCH_SOURCE_CANDIDATE.md'
          doc.write_text(
              '''# PG outbox dispatch source candidate

Status: `source-candidate`. Compatibility, durability, production and retirement credit remain false.

The authoritative PG-wire repository now exposes a generation-fenced outbox transition core:

- bounded ordered lease batches;
- pending work acquisition and expired-lease node-failure reclaim;
- owner plus lease-generation fencing on completion and failure;
- exact atomic delivered, retry-pending and dead-letter transitions;
- fail-closed attempt exhaustion inside the lease transaction;
- stable validation/data-loss/stale-lease errors;
- PostgreSQL/CockroachDB-compatible serializable transaction boundary.

This closes no evidence gate by source presence alone. Remaining work includes the background dispatcher,
external-effect adapters, acknowledgement reconciliation, both-profile fault injection, process/node-loss
reclaim proof, endurance, metrics/SLO integration and independent data-integrity review.
''',
              encoding='utf-8',
          )

          inventory_path = root / 'docs/status/IMPLEMENTATION_INVENTORY.json'
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          for component in inventory.get('components', []):
              if component.get('id') in {'COMP-PERSISTENCE-PG', 'COMP-TRNM-SERVER'}:
                  implemented = component.setdefault('implemented', [])
                  fact = 'generation-fenced PG outbox lease, reclaim, complete, retry and dead-letter source API'
                  if fact not in implemented:
                      implemented.append(fact)
                  missing = component.setdefault('missing', [])
                  old = 'outbox delivery worker'
                  if old in missing:
                      missing.remove(old)
                  replacement = (
                      'background outbox delivery loop, external-effect adapter, reconciliation and '
                      'both-profile node-loss/endurance evidence'
                  )
                  if replacement not in missing:
                      missing.append(replacement)
          inventory_path.write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          roadmap_path = root / 'docs/roadmap/NEXT_MILESTONE.json'
          roadmap = json.loads(roadmap_path.read_text(encoding='utf-8'))
          for item in roadmap.get('items', []):
              if item.get('id') == 'TG-V3-024' and item.get('status') in {'planned', 'ready', 'blocked'}:
                  item['status'] = 'in-progress'
          roadmap_path.write_text(
              json.dumps(roadmap, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          current_path = root / 'docs/status/CURRENT_STATE.json'
          current = json.loads(current_path.read_text(encoding='utf-8'))
          current.setdefault('implementation', {})[
              'pg_outbox_generation_fenced_dispatch_source_candidate'
          ] = True
          current_path.write_text(
              json.dumps(current, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          workflow = root / '.github/workflows/temporary-outbox-dispatch-closure.yml'
          if not workflow.is_file():
              raise SystemExit('temporary workflow missing before self-removal')
          workflow.unlink()
          PY
          test ! -e .github/workflows/temporary-outbox-dispatch-closure.yml
          git diff --check

      - name: Compile, test and strictly lint exact source candidate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit only against unchanged branch tip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test ! -e .github/workflows/temporary-outbox-dispatch-closure.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(outbox): add generation-fenced PG dispatch transitions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
