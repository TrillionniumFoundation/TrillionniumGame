name: outbox-evidence-sealing-export

on:
  push:
    branches:
      - tooling/outbox-evidence-seal-export-2026-09-07

permissions:
  actions: read
  contents: read

concurrency:
  group: outbox-evidence-sealing-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact export commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build exact four-file sealing transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tooling/build-outbox-evidence-sealing-export.py
          bash -n scripts/ci-outbox-final-attempt-reaper.sh
          grep -F 'wait "$tee_pid"' scripts/ci-outbox-final-attempt-reaper.sh
          grep -F 'test -s "$outbox/files.sha256"' .github/workflows/prospective-merge-gate.yml
          grep -F '(cd "$outbox" && sha256sum --check files.sha256)' .github/workflows/prospective-merge-gate.yml
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/outbox-evidence-sealing-four-files.tar.gz \
            scripts/ci-outbox-final-attempt-reaper.sh \
            .github/workflows/prospective-merge-gate.yml \
            docs/governance/REQUIRED_WORKFLOWS_V1.json \
            docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json \
            run/outbox-evidence-sealing-export/report.json
          test -s run/outbox-evidence-sealing-four-files.tar.gz
          sha256sum run/outbox-evidence-sealing-four-files.tar.gz

      - name: Retain exact patched four-file payload
        id: retained-patch
        uses: ./.github/actions/upload-evidence
        with:
          name: outbox-evidence-sealing-four-files-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/outbox-evidence-sealing-four-files.tar.gz
          mime_type: application/gzip

      - name: Verify retained patch receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained-patch.outputs.artifact_id }}'
          test -n '${{ steps.retained-patch.outputs.sha256 }}'
          test '${{ steps.retained-patch.outputs.size_bytes }}' -gt 0
          printf 'artifact_id=%s\nsha256=%s\nsize_bytes=%s\n' \
            '${{ steps.retained-patch.outputs.artifact_id }}' \
            '${{ steps.retained-patch.outputs.sha256 }}' \
            '${{ steps.retained-patch.outputs.size_bytes }}'
