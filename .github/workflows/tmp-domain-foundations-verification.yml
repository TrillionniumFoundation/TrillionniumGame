name: tmp-domain-foundations-verification

on:
  push:
    branches:
      - ops/domain-foundations-verification-20260909
    paths:
      - .github/workflows/tmp-domain-foundations-verification.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: domain-foundations-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: identity
            branch: feature/plan-v32-identity-core-20260909
            issue: 137
            packages: trnm-identity-core trnm-identity-service
          - component: social
            branch: feature/plan-v32-social-core-20260909
            issue: 138
            packages: trnm-social-core
    steps:
      - name: Resolve exact product head and PR
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/${{ matrix.branch }}" --jq '.object.sha')"
          tree="$(gh api "repos/${REPOSITORY}/git/commits/${sha}" --jq '.tree.sha')"
          pr="$(gh pr list --repo "$REPOSITORY" --head "${{ matrix.branch }}" --state open --json number --jq '.[0].number // empty')"
          echo "PRODUCT_SHA=$sha" >> "$GITHUB_ENV"
          echo "PRODUCT_TREE=$tree" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$pr" >> "$GITHUB_ENV"
      - name: Fetch exact product candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$PRODUCT_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
      - name: Execute exact source verification
        id: checks
        shell: bash
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE"
          : > /tmp/results.txt
          failures=0
          run_check() {
            name="$1"
            shift
            if "$@" >/tmp/current.log 2>&1; then
              echo "${name}=PASS" | tee -a /tmp/results.txt
            else
              echo "${name}=FAIL" | tee -a /tmp/results.txt
              tail -n 80 /tmp/current.log > "/tmp/failure-${name}.log"
              failures=$((failures + 1))
            fi
          }

          run_check no-temporary-product-workflows bash -c '! git ls-tree -r --name-only HEAD | grep -Eq "^\.github/workflows/tmp-"'
          run_check root-lockfile test -s Cargo.lock
          run_check cargo-metadata cargo metadata --format-version 1 --no-deps --locked
          run_check cargo-format cargo fmt --all -- --check
          for package in ${{ matrix.packages }}; do
            run_check "test-${package}" cargo test --package "$package" --all-targets --locked
            run_check "clippy-${package}" cargo clippy --package "$package" --all-targets --locked -- -D warnings
          done
          run_check documentation-authority python3 scripts/check-documentation-authority.py
          run_check package-inventory python3 scripts/check-rust-package-inventory.py
          run_check plan-control python3 scripts/check-plan.py
          run_check clean-source git diff --exit-code

          if test '${{ matrix.component }}' = identity; then
            run_check identity-contracts python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          core = Path('crates/trnm-identity-core/src/lib.rs')
          service = Path('crates/trnm-identity-service/src/lib.rs')
          fixtures = [
              Path('crates/trnm-identity-core/testdata/provider-classes-v1.json'),
              Path('crates/trnm-identity-core/testdata/receipt-and-retirement-v1.json'),
              Path('crates/trnm-identity-service/testdata/provider-verification-boundary-v1.json'),
              Path('crates/trnm-identity-service/testdata/exact-replay-and-deadline-v1.json'),
          ]
          if not core.is_file() or not service.is_file() or not all(path.is_file() for path in fixtures):
              raise SystemExit('identity source or fixture missing')
          source = core.read_text(encoding='utf-8')
          expected = ['custom','device','email','facebook','facebook_instant_game','apple','google','game_center','steam']
          enum = re.search(r'pub enum IdentityProvider \{(?P<body>.*?)\n\}', source, re.S)
          if enum is None:
              raise SystemExit('provider enum missing')
          variants = re.findall(r'^\s{4}([A-Z][A-Za-z0-9]+),$', enum.group('body'), re.M)
          actual = [re.sub(r'(?<!^)(?=[A-Z])', '_', value).lower() for value in variants]
          if actual != expected:
              raise SystemExit(f'provider classes differ: {actual!r}')
          provider_fixture = json.loads(fixtures[0].read_text(encoding='utf-8'))
          if provider_fixture.get('providers') != expected:
              raise SystemExit('provider fixture differs')
          service_source = service.read_text(encoding='utf-8')
          order = [
              'checked_sub(now_ms)',
              '.verifier',
              '.authenticate_or_create(',
          ]
          positions = [service_source.find(token) for token in order]
          if any(position < 0 for position in positions) or positions != sorted(positions):
              raise SystemExit(f'provider verification/repository order changed: {positions!r}')
          for path in fixtures:
              value = json.loads(path.read_text(encoding='utf-8'))
              boundary = value.get('claim_boundary', {})
              for key in ('production_ready',):
                  if boundary.get(key) is not False:
                      raise SystemExit(f'{path}: production claim is not false')
          PY
          else
            run_check social-contracts python3 - <<'PY'
          import json
          from pathlib import Path

          source_path = Path('crates/trnm-social-core/src/lib.rs')
          fixtures = [
              Path('crates/trnm-social-core/testdata/domain-surface-v1.json'),
              Path('crates/trnm-social-core/testdata/post-repair-source-contract-v1.json'),
          ]
          if not source_path.is_file() or not all(path.is_file() for path in fixtures):
              raise SystemExit('social source or fixture missing')
          source = source_path.read_text(encoding='utf-8')
          if 'candidate.commit(' in source:
              raise SystemExit('candidate transition can still be discarded')
          if source.count('*self = candidate;') < 10:
              raise SystemExit('too few authority replacement sites')
          if 'impl ExactSizeIterator<Item = &ChatMessage>' in source:
              raise SystemExit('chat iterator overclaims ExactSizeIterator')
          if 'impl ExactSizeIterator<Item = &Notification>' in source:
              raise SystemExit('notification iterator overclaims ExactSizeIterator')
          for path in fixtures:
              value = json.loads(path.read_text(encoding='utf-8'))
              if value.get('claim_boundary', {}).get('production_ready') is not False:
                  raise SystemExit(f'{path}: production claim is not false')
          PY
          fi

          echo "FAILURES=$failures" >> "$GITHUB_ENV"
          if test "$failures" -gt 0; then
            exit 1
          fi
      - name: Publish exact result and request review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          failures="${FAILURES:-1}"
          result=failed
          if test "$failures" = 0; then
            result=passed
          fi
          results="$(cat /tmp/results.txt 2>/dev/null || printf 'verification-did-not-produce-results=FAIL\n')"
          marker="<!-- ${{ matrix.component }}-foundation-exact-verification:${PRODUCT_SHA} -->"
          cat > /tmp/comment.md <<EOF
          ${marker}
          `${{ matrix.component }}` product-head verification **${result}**.

          ```text
          repository=${REPOSITORY}
          branch=${{ matrix.branch }}
          commit=${PRODUCT_SHA}
          tree=${PRODUCT_TREE}
          pull_request=${PR_NUMBER:-none}
          failed_check_count=${failures}
          compatibility_credit=false
          accepted_evidence=false
          production_ready=false
          issue_complete=false
          ```

          ```text
          ${results}
          ```

          This is exact-source execution for the bounded candidate only. Wire/database/oracle/fault/load evidence and independent acceptance remain separate.
          EOF
          duplicate="$(gh api "repos/${REPOSITORY}/issues/${{ matrix.issue }}/comments?per_page=100" --jq --arg marker "$marker" '[.[] | select(.body | contains($marker))] | length')"
          if test "$duplicate" -eq 0; then
            gh issue comment '${{ matrix.issue }}' --repo "$REPOSITORY" --body-file /tmp/comment.md
          fi
          if test "$result" = passed && test -n "${PR_NUMBER:-}"; then
            gh api --method POST "repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" -f 'reviewers[]=Tomasrgbsf' >/dev/null || true
          fi
