name: codex-pr114-control-registration-repair

on:
  push:
    branches:
      - codex/server-composition-root-v2-2026-09-06

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'TrillionniumFoundation/TrillionniumGame'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact repair head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: codex/server-composition-root-v2-2026-09-06
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$TARGET_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply deterministic repair and stage final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/codex-pr114-control-registration-repair.py
          rm -f scripts/codex-pr114-control-registration-repair.py
          rm -f .github/workflows/codex-pr114-control-registration-repair.yml
          git add -A

      - name: Execute complete Python and control contract on final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          python3 scripts/check-rust-server-slice.py

      - name: Publish validated product control commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: codex/server-composition-root-v2-2026-09-06
        run: |
          set -euo pipefail
          git config user.name "ProfHepta"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          test -n "$(git status --porcelain)"
          git commit -m "fix(server): align typed queue and workflow registration"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
