name: reviewer-conflict-capacity-fix

on:
  push:
    branches: [tooling/reviewer-conflict-capacity-fix-2026-09-07]
    paths:
      - '.github/workflows/reviewer-conflict-capacity-fix.yml'

permissions:
  contents: write

env:
  EXPECTED_SOURCE_HEAD: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
  EXPECTED_SOURCE_TREE: 9d3ae2fadb2684f095855ecf16307376b55a440f
  PRODUCT_BRANCH: codex/reviewer-conflict-capacity-2026-09-07
  MATRIX_GZIP_BLOB: d373f23acf8236ea455976c66ec042efd38c64e7
  CHECKER_BLOB: 7026eab5208c792b07f77ec8d7d77f46fed6eaaa
  TEST_GZIP_BLOB: 463d9cba0e2b2dfb2825bfa631fb935880af43ae
  MATRIX_FINAL_BLOB: 644439b7173a1c6de24b50b75ce2adb0ee9d04f9
  CHECKER_FINAL_BLOB: 7026eab5208c792b07f77ec8d7d77f46fed6eaaa
  TEST_FINAL_BLOB: d0fbe6b1e76fbeb52bd945bf2554c54529a88ef9
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin "$EXPECTED_SOURCE_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout -b "$PRODUCT_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$EXPECTED_SOURCE_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = "$EXPECTED_SOURCE_TREE"

      - name: Materialize exact reviewed bytes
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git hash-object docs/review/INDEPENDENT_REVIEW_MATRIX.json)" = 78b3f1fe0451cd430c6007e3755c99f620f1c5d8
          test "$(git hash-object scripts/check-independent-review-matrix.py)" = 3f353a8e46b7f379ccfd02beed8bd7d0bdd71cf5
          test "$(git hash-object tests/control_plane/test_independent_review_matrix.py)" = fc52a0683d34ec547f5d40e00d6fcb505a99034a
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import json
          import os
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'trillionnium-reviewer-conflict-capacity-fix',
          }

          def blob(sha: str) -> bytes:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/git/blobs/{sha}',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  value = json.load(response)
              if value.get('encoding') != 'base64' or value.get('sha') != sha:
                  raise SystemExit(f'blob identity mismatch: {sha}')
              return base64.b64decode(value['content'], validate=True)

          Path('docs/review/INDEPENDENT_REVIEW_MATRIX.json').write_bytes(
              gzip.decompress(blob(os.environ['MATRIX_GZIP_BLOB']))
          )
          Path('scripts/check-independent-review-matrix.py').write_bytes(
              blob(os.environ['CHECKER_BLOB'])
          )
          Path('tests/control_plane/test_independent_review_matrix.py').write_bytes(
              gzip.decompress(blob(os.environ['TEST_GZIP_BLOB']))
          )
          PY
          test "$(git hash-object docs/review/INDEPENDENT_REVIEW_MATRIX.json)" = "$MATRIX_FINAL_BLOB"
          test "$(git hash-object scripts/check-independent-review-matrix.py)" = "$CHECKER_FINAL_BLOB"
          test "$(git hash-object tests/control_plane/test_independent_review_matrix.py)" = "$TEST_FINAL_BLOB"
          test "$(git diff --name-only | LC_ALL=C sort)" = "$(printf '%s\n' \
            docs/review/INDEPENDENT_REVIEW_MATRIX.json \
            scripts/check-independent-review-matrix.py \
            tests/control_plane/test_independent_review_matrix.py | LC_ALL=C sort)"
          git diff --check

      - name: Execute focused and complete control corpus
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 scripts/check-independent-review-matrix.py \
            | tee "$RUNNER_TEMP/reviewer-capacity.json"
          jq -e '
            .status == "blocked-reviewer-capacity" and
            .all_required_reviews_available == false and
            .available_domains == 0 and
            .blocked_domains == 6 and
            (.eligible_reviewers | length) == 0 and
            (.candidate_conflicts | sort) == ["Franksudoman","ProfHepta","Tomasrgbsf"]
          ' "$RUNNER_TEMP/reviewer-capacity.json" >/dev/null
          python3 -m unittest tests.control_plane.test_independent_review_matrix -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"
          python3 scripts/check-documentation-authority.py >/dev/null
          python3 scripts/check-plan.py >/dev/null
          python3 scripts/check-evidence-index.py >/dev/null
          python3 scripts/check-gap-register.py >/dev/null
          python3 scripts/derive-gap-status.py >/dev/null
          python3 scripts/derive-gates.py >/dev/null
          python3 scripts/check-status-transitions.py >/dev/null
          python3 scripts/check-workflow-action-policy.py >/dev/null
          python3 scripts/check-repository-hygiene.py >/dev/null
          python3 scripts/check-trnm-server.py >/dev/null
          python3 scripts/check-rust-foundation.py >/dev/null

      - name: Publish exact source candidate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git add \
            docs/review/INDEPENDENT_REVIEW_MATRIX.json \
            scripts/check-independent-review-matrix.py \
            tests/control_plane/test_independent_review_matrix.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 3
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'fix(governance): fail closed on conflicted reviewer capacity'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          printf 'product_head=%s\nproduct_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
