name: world-rustfmt-bd1603-20260909

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-rustfmt-bd1603-20260909-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_HEAD_SHA: bd1603ea6087f71ee1fe2d7940c729931105c25f
  RUSTUP_TOOLCHAIN: '1.98.1'

jobs:
  format:
    name: world-rustfmt/materialize-patch
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact World head
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/world"
          rm -rf "$root"
          git init "$root"
          git -C "$root" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$root" fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$WORLD_HEAD_SHA"
          test -z "$(git -C "$root" status --porcelain=v1 --untracked-files=no)"

      - name: Install exact rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$RUSTUP_TOOLCHAIN"
          rustfmt --version
          cargo --version --verbose

      - name: Format every current Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/world"
          cargo fmt --manifest-path "$root/trillionnium/Cargo.toml" --all
          cargo fmt --manifest-path "$root/trillionnium/crates/world-authority/Cargo.toml" --all
          cargo fmt --manifest-path "$root/trillionnium/contracts/trnm-world-transition-v1/Cargo.toml"
          cargo fmt --manifest-path "$root/contracts/Cargo.toml" --all
          git -C "$root" diff --check
          git -C "$root" diff --name-only > "$RUNNER_TEMP/world-rustfmt-files.txt"
          git -C "$root" diff --binary > "$RUNNER_TEMP/world-rustfmt.patch"
          test -s "$RUNNER_TEMP/world-rustfmt.patch"
          cat "$RUNNER_TEMP/world-rustfmt-files.txt"

      - name: Publish deterministic patch on the temporary runner branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$TARGET_BRANCH"
          runner="$RUNNER_TEMP/runner-repository"
          rm -rf "$runner"
          git init "$runner"
          git -C "$runner" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$runner" fetch --no-tags --depth=1 origin "$TARGET_BRANCH"
          git -C "$runner" checkout -B "$TARGET_BRANCH" FETCH_HEAD
          out="$runner/.world-diagnostics/rustfmt-bd1603"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/world-rustfmt.patch" "$out/world-rustfmt.patch"
          cp "$RUNNER_TEMP/world-rustfmt-files.txt" "$out/world-rustfmt-files.txt"
          {
            printf 'world_repository=%s\n' "$WORLD_REPOSITORY"
            printf 'world_head_sha=%s\n' "$WORLD_HEAD_SHA"
            printf 'rustfmt=%s\n' "$(rustfmt --version)"
            printf 'production_authorization=not_granted\n'
          } > "$out/identity.txt"
          (
            cd "$out"
            sha256sum world-rustfmt.patch world-rustfmt-files.txt identity.txt > SHA256SUMS
          )
          git -C "$runner" add .world-diagnostics/rustfmt-bd1603
          if git -C "$runner" diff --cached --quiet; then
            echo 'deterministic rustfmt patch already published'
            exit 0
          fi
          git -C "$runner" config user.name 'github-actions[bot]'
          git -C "$runner" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$runner" commit -m 'chore(ci): retain World bd1603 rustfmt patch'
          git -C "$runner" push origin "HEAD:$TARGET_BRANCH"
