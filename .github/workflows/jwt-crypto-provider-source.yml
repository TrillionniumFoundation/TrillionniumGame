name: jwt-crypto-provider-source

on:
  pull_request:
    paths:
      - 'crates/trnm-token-crypto-provider/**'
      - 'contracts/security/jwt-crypto-provider-v1.json'
      - 'docs/adr/ADR-0002-JWT-CRYPTO-PROVIDER.md'
      - '.github/workflows/jwt-crypto-provider-source.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-token-crypto-provider/**'
      - 'contracts/security/jwt-crypto-provider-v1.json'
      - 'docs/adr/ADR-0002-JWT-CRYPTO-PROVIDER.md'
      - '.github/workflows/jwt-crypto-provider-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jwt-crypto-provider-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate fail-closed claims
        run: |
          set -euo pipefail
          jq -e '
            .status == "interface-source-candidate" and
            .claims.provider_interface_exists == true and
            .claims.production_provider_exists == false and
            .claims.jwt_adapter_integrated == false and
            .claims.security_review_accepted == false and
            .claims.production_ready == false
          ' contracts/security/jwt-crypto-provider-v1.json >/dev/null
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format
        run: cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/trnm-token-crypto-provider/Cargo.toml --all-targets --locked
      - name: Strict lint
        run: cargo clippy --manifest-path crates/trnm-token-crypto-provider/Cargo.toml --all-targets --locked -- -D warnings
