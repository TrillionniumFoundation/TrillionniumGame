name: One-shot branch consolidation cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: branch-consolidation-cleanup
  cancel-in-progress: false

jobs:
  delete-absorbed-branches:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out canonical main with full ancestry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Prove every non-main tip is absorbed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          remote_main=$(git rev-parse refs/remotes/origin/main)
          test "$(git rev-parse HEAD)" = "$remote_main"
          : > absorbed-branches.tsv
          while IFS= read -r ref; do
            branch=${ref#refs/remotes/origin/}
            [[ "$branch" == 'HEAD' || "$branch" == 'main' ]] && continue
            sha=$(git rev-parse "$ref")
            git merge-base --is-ancestor "$sha" HEAD
            printf '%s\t%s\n' "$branch" "$sha" >> absorbed-branches.tsv
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)
          test -s absorbed-branches.tsv

      - name: Delete every absorbed non-main branch
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r branch sha; do
            test -n "$branch"
            test "$branch" != main
            git push origin --delete "$branch"
          done < absorbed-branches.tsv
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t remaining < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' | sort)
          test "${#remaining[@]}" -eq 1
          test "${remaining[0]}" = main

      - name: Commit immutable completion evidence and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          rows = []
          for line in Path('absorbed-branches.tsv').read_text(encoding='utf-8').splitlines():
              name, tip = line.split('\t', 1)
              rows.append({'name': name, 'tip': tip})
          payload = {
              'schema': 'trillionnium.repository-branch-consolidation-completion.v1',
              'completed_at_utc': datetime.now(timezone.utc).isoformat(),
              'main_before_completion_commit': __import__('subprocess').check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'deleted_branch_count': len(rows),
              'deleted_branches': rows,
              'remaining_heads': ['main'],
              'all_deleted_tips_were_ancestors': True,
          }
          path = Path('docs/governance/branch-consolidation-completion-2026-08-29.json')
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/branch-consolidation-cleanup.yml
          git add docs/governance/branch-consolidation-completion-2026-08-29.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(repo): seal main-only branch consolidation'
          git push origin HEAD:main
