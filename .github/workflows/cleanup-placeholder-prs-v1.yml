name: cleanup-placeholder-prs-v1

on:
  push:
    branches:
      - ops/world-p0-diagnostic-58f76a-20260910

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup:
    name: cleanup/temporary-placeholder-prs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Close placeholder PRs for this temporary head
        shell: bash
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          token = os.environ["GH_WRITE_TOKEN"]
          owner = repo.split("/", 1)[0]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = f"https://api.github.com/repos/{repo}/pulls?state=open&head={urllib.parse.quote(owner + ':' + branch)}&per_page=100"
          with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
              pulls = json.load(response)
          for pull in pulls:
              if pull.get("title") not in {"placeholder", "placeholder-cleanup-marker"}:
                  continue
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/pulls/{pull['number']}",
                  data=b'{"state":"closed"}',
                  method="PATCH",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=60):
                  pass
              print(f"CLOSED_PLACEHOLDER_PR={pull['number']}")
          print("PLACEHOLDER_PR_CLEANUP=PASS")
          PY
