name: temporary-mark-pr52-ready

on:
  push:
    branches:
      - codex/outbox-spool-worker-2026-08-31

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-mark-pr52-ready
  cancel-in-progress: false

jobs:
  mark-ready-and-self-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Mark exact PR ready and verify API readback
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pull_id=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/52" --jq .node_id)
          test -n "$pull_id"
          gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft headRefOid}}}' \
            -F id="$pull_id" \
            > /tmp/ready-response.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = json.loads(Path('/tmp/ready-response.json').read_text())
          pull = value['data']['markPullRequestReadyForReview']['pullRequest']
          assert pull['number'] == 52, pull
          assert pull['isDraft'] is False, pull
          assert pull['headRefOid'] == os.environ['GITHUB_SHA'], pull
          print(json.dumps(pull, sort_keys=True))
          PY
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/52" --jq .draft)" = false

      - name: Remove temporary workflow without changing product source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temporary-mark-pr52-ready.yml
          git diff --check
          git config user.name "Tomasrgbsf"
          git config user.email "tomasbraynt@gmail.com"
          git add -A
          git commit -m "ci: remove temporary PR readiness workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
