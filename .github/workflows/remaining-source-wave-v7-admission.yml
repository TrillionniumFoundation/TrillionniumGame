name: remaining-source-wave-v7-admission

on:
  push:
    branches: [tooling/remaining-source-wave-v2-2026-09-06]
    paths:
      - '.github/workflows/remaining-source-wave-v7-admission.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  settle-and-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: codex/branch-evidence-closure-2026-09-02
      EXPECTED_BASE: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
      PRODUCT_PREFIX: codex/remaining-source-blockers-wave-v7
    steps:
      - name: Wait for exporter and create one exact Draft review surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, time, urllib.error, urllib.parse, urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          owner, name = repository.split('/', 1)
          api = f'https://api.github.com/repos/{repository}'
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'trillionnium-v7-admission',
          }

          def call(url, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read()
                      return response.status, json.loads(raw.decode('utf-8')) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      value = json.loads(raw.decode('utf-8')) if raw else None
                  except Exception:
                      value = {'message': raw.decode('utf-8', errors='replace')[:2000]}
                  return error.code, value

          exporter = None
          for _ in range(300):
              code, payload = call(api + '/actions/runs?branch=tooling%2Fremaining-source-wave-v2-2026-09-06&per_page=100')
              if code != 200 or not isinstance(payload, dict):
                  raise SystemExit(f'cannot read workflow runs: HTTP {code}')
              rows = [row for row in payload.get('workflow_runs', []) if row.get('name') == 'remaining-source-wave-v7-bootstrap']
              rows.sort(key=lambda row: (int(row.get('run_attempt') or 0), int(row.get('id') or 0)), reverse=True)
              if rows:
                  exporter = rows[0]
                  if exporter.get('status') == 'completed':
                      break
              time.sleep(5)
          if not exporter or exporter.get('status') != 'completed':
              raise SystemExit('v7 exporter did not reach terminal state')

          refs_code, refs = call(api + '/git/matching-refs/heads/' + urllib.parse.quote(os.environ['PRODUCT_PREFIX'], safe='/'))
          refs = refs if refs_code == 200 and isinstance(refs, list) else []
          exact_refs = [row for row in refs if str(row.get('ref', '')).startswith('refs/heads/' + os.environ['PRODUCT_PREFIX'])]
          result = {
              'schema': 'trillionnium.remaining-source-wave-v7-admission.v1',
              'exporter': {
                  'id': exporter.get('id'), 'attempt': exporter.get('run_attempt'),
                  'head': exporter.get('head_sha'), 'status': exporter.get('status'),
                  'conclusion': exporter.get('conclusion'),
              },
              'product_refs': exact_refs,
              'claims': {
                  'source_candidate': False,
                  'accepted_evidence': False,
                  'gap_closed': False,
                  'production_ready': False,
              },
          }

          marker = '<!-- TRNM-REMAINING-SOURCE-WAVE-V7 -->'
          if exporter.get('conclusion') != 'success':
              body = '\n'.join([
                  marker,
                  '## Remaining-source Wave v7 exporter blocked',
                  '',
                  f"- run: `{exporter.get('id')}` attempt `{exporter.get('run_attempt')}`",
                  f"- exact tooling head: `{exporter.get('head_sha')}`",
                  f"- conclusion: `{exporter.get('conclusion')}`",
                  f"- published product refs matching prefix: `{len(exact_refs)}`",
                  '',
                  'No product-source, evidence, gap, compatibility or production credit is granted. Fix the concrete exporter failure rather than bypassing it.',
              ])
              call(api + '/issues/7/comments', method='POST', body={'body': body})
              raise SystemExit('v7 exporter failed')

          if len(exact_refs) != 1:
              body = '\n'.join([
                  marker,
                  '## Remaining-source Wave v7 publication is ambiguous',
                  '',
                  f"- successful exporter run: `{exporter.get('id')}`",
                  f"- matching product refs: `{len(exact_refs)}`",
                  '',
                  'A unique product branch is required before creating an admission surface.',
              ])
              call(api + '/issues/7/comments', method='POST', body={'body': body})
              raise SystemExit(f'expected one v7 product ref, observed {len(exact_refs)}')

          ref = exact_refs[0]
          product_branch = str(ref['ref']).removeprefix('refs/heads/')
          head = (ref.get('object') or {}).get('sha')
          ccode, commit = call(api + f'/git/commits/{head}')
          if ccode != 200 or not isinstance(commit, dict):
              raise SystemExit(f'cannot read v7 product commit: HTTP {ccode}')
          tree = (commit.get('tree') or {}).get('sha')
          bcode, base_ref = call(api + '/git/ref/heads/' + urllib.parse.quote(os.environ['BASE_BRANCH'], safe=''))
          live_base = ((base_ref or {}).get('object') or {}).get('sha') if bcode == 200 else None
          if live_base != os.environ['EXPECTED_BASE']:
              raise SystemExit(f'integration base moved: {live_base}')

          pcode, pulls = call(api + '/pulls?state=all&head=' + urllib.parse.quote(owner + ':' + product_branch) + '&per_page=20')
          pulls = pulls if pcode == 200 and isinstance(pulls, list) else []
          opened = [row for row in pulls if row.get('state') == 'open']
          if len(opened) > 1:
              raise SystemExit('multiple open PRs target the v7 product branch')
          body = '\n'.join([
              '## Exact cumulative source candidate',
              '',
              f'- base branch/head: `{os.environ["BASE_BRANCH"]}` / `{live_base}`',
              f'- product branch/head: `{product_branch}` / `{head}`',
              f'- product tree: `{tree}`',
              f'- guarded exporter: `{exporter.get("id")}` attempt `{exporter.get("run_attempt")}` / `success`',
              '',
              'The exporter validates source ancestry and immutable inputs, applies the canonical server authority transition, runs Rust 1.85.1 format/all-target tests/strict Clippy, Go test/race/vet, and the complete repository control corpus before publication.',
              '',
              '```text',
              'source_candidate=true',
              'accepted_evidence=false',
              'gap_closed=false',
              'production_ready=false',
              'public_online=false',
              'nakama_retired=false',
              '```',
              '',
              'Exact-head/actual-merge workflows, retained artifact admission, conflict-free specialist review, external governance and real-environment evidence remain mandatory. No self-approval, bypass, cutover or retirement is authorized.',
          ])
          if opened:
              pr = opened[0]
              number = int(pr['number'])
              ucode, updated = call(api + f'/pulls/{number}', method='PATCH', body={
                  'title': 'feat: integrate remaining Plan v3.1 source blockers v7',
                  'body': body,
                  'draft': True,
              })
              if ucode != 200:
                  raise SystemExit(f'cannot update v7 PR: HTTP {ucode}')
          else:
              ccode, created = call(api + '/pulls', method='POST', body={
                  'title': 'feat: integrate remaining Plan v3.1 source blockers v7',
                  'head': product_branch,
                  'base': os.environ['BASE_BRANCH'],
                  'body': body,
                  'draft': True,
              })
              if ccode != 201:
                  raise SystemExit(f'cannot create v7 PR: HTTP {ccode} {created}')
              number = int(created['number'])

          rcode, response = call(api + f'/pulls/{number}/requested_reviewers', method='POST', body={'reviewers': ['Tomasrgbsf']})
          result.update({
              'product_branch': product_branch, 'head': head, 'tree': tree,
              'pull_request': number, 'review_request_status': rcode,
          })
          result['claims']['source_candidate'] = True
          comment = '\n'.join([
              marker,
              '## Remaining-source Wave v7 published and routed',
              '',
              f'- product PR: `#{number}`',
              f'- head/tree: `{head}` / `{tree}`',
              f'- exporter run: `{exporter.get("id")}` attempt `{exporter.get("run_attempt")}`',
              f'- reviewer request status: `{rcode}`',
              '',
              'This is a source-candidate handoff only. It does not close a gap or transfer old-head evidence/review credit.',
          ])
          call(api + '/issues/7/comments', method='POST', body={'body': comment})
          print(json.dumps(result, sort_keys=True))
          if rcode not in (200, 201):
              raise SystemExit(f'reviewer request failed: HTTP {rcode}')
          PY
