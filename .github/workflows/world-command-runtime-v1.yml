name: world-command-runtime-v1

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/game-world-command-runtime-v1
    paths:
      - 'runtime/internal/worldcommand/**'
      - 'contracts/world-command-runtime-v1-status.json'
      - 'contracts/world-command-fault-evidence-v1.schema.json'
      - 'docs/ARCHITECTURE.md'
      - 'docs/OPERATIONS_AND_RELEASE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'scripts/check-world-command-runtime-v1.sh'
      - 'scripts/test-world-command-runtime-v1-negative.sh'
      - 'tools/summarize_world_command_faults.py'
      - '.github/workflows/world-command-runtime-v1.yml'

permissions:
  contents: read

concurrency:
  group: world-command-runtime-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate source and negative contracts
        run: |
          set -euo pipefail
          bash scripts/check-world-command-runtime-v1.sh
          bash scripts/test-world-command-runtime-v1-negative.sh

  go-fault-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          cd "$GITHUB_WORKSPACE"
          go version
      - name: Verify formatting
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l runtime/internal/worldcommand)
          test -z "$unformatted" || { printf '%s\n' "$unformatted" >&2; exit 1; }
      - name: Run deterministic fault matrix
        working-directory: runtime
        run: |
          set -euo pipefail
          mkdir -p ../run/world-command-runtime-v1
          go test -json ./internal/worldcommand -count=1 \
            | tee ../run/world-command-runtime-v1/go-test.jsonl
          go test -race ./internal/worldcommand -count=1 \
            | tee ../run/world-command-runtime-v1/go-race.txt
          go vet ./internal/worldcommand
      - name: Build and validate exact-source evidence
        run: |
          set -euo pipefail
          tree_sha=$(git show -s --format=%T "$CANDIDATE_SHA")
          python3 tools/summarize_world_command_faults.py \
            --input run/world-command-runtime-v1/go-test.jsonl \
            --output run/world-command-runtime-v1/fault-summary.json \
            --repository TrillionniumFoundation/TrillionniumGame \
            --commit "$CANDIDATE_SHA" \
            --tree "$tree_sha"
          EXPECTED_COMMIT="$CANDIDATE_SHA" jq -e '
            .contract_version == "trnm_game_world_command_fault_evidence_v1" and
            .repository == "TrillionniumFoundation/TrillionniumGame" and
            .source_commit == env.EXPECTED_COMMIT and
            .status == "passed" and
            .required_scenario_count == .passed_scenario_count and
            .authority.cutover_authorized == false and
            .authority.closed_online_promotion == false and
            .authority.public_online_enabled == false and
            .authority.public_player_market_enabled == false and
            (.limitations | length >= 3)
          ' run/world-command-runtime-v1/fault-summary.json >/dev/null
          sha256sum \
            contracts/world-command-runtime-v1-status.json \
            contracts/world-command-fault-evidence-v1.schema.json \
            docs/ARCHITECTURE.md \
            docs/OPERATIONS_AND_RELEASE.md \
            docs/DOCUMENTATION_AUTHORITY.json \
            tools/summarize_world_command_faults.py \
            runtime/internal/worldcommand/*.go \
            run/world-command-runtime-v1/go-test.jsonl \
            run/world-command-runtime-v1/go-race.txt \
            run/world-command-runtime-v1/fault-summary.json \
            > run/world-command-runtime-v1/SHA256SUMS
      - name: Seal evidence in immutable job log
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/world-command-runtime-v1-${CANDIDATE_SHA}.tar.gz \
            -C run/world-command-runtime-v1 .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/world-command-runtime-v1-${CANDIDATE_SHA}.tar.gz
          cat run/world-command-runtime-v1/fault-summary.json
          cat run/world-command-runtime-v1/SHA256SUMS
