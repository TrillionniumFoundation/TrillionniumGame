name: architecture-convergence-transport

on:
  push:
    branches:
      - codex/architecture-convergence-transport-a-2026-09-08
    paths:
      - .github/workflows/architecture-convergence-transport.yml

permissions:
  contents: write

concurrency:
  group: architecture-convergence-transport
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/architecture-gap-closure-2026-09-08
    steps:
      - name: Fetch exact transport and unchanged target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          transport_parent=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^)
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          target_head=$(git -C "$GITHUB_WORKSPACE" rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          test "$target_head" = "$transport_parent"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$target_head"
          printf '%s\n' "$target_head" > "$RUNNER_TEMP/target-before.txt"

      - name: Apply deterministic architecture convergence
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import shutil
          from pathlib import Path
          from typing import Any

          ROOT = Path('.')
          GATE = 'trnm-token-jwt-adapter-gate'
          OLD_SERVER_PATH = 'crates/trnm-persistence-pg/src/bin/trnm-server.rs'
          NEW_SERVER_PATH = 'crates/trnm-persistence-pg/src/bin/trnm-pg-compat-server.rs'
          MEMBERS = [
              'crates/trnm-contracts',
              'crates/trnm-authority-core',
              'crates/trnm-session-core',
              'crates/trnm-storage-core',
              'crates/trnm-persistence-core',
              'crates/trnm-persistence-pg',
              'crates/trnm-canonical-core',
              'crates/trnm-transport-core',
              'crates/trnm-token-core',
              'crates/trnm-presence-core',
              'crates/trnm-query-core',
              'crates/trnm-token-jwt-adapter',
              'crates/trnm-presence-router-v2',
              'crates/trnm-server',
              'crates/trnm-persistence-runtime-policy',
              'crates/trnm-realtime-wire',
              'crates/trnm-storage-nakama-version',
              'crates/trnm-token-crypto-provider',
              'crates/trnm-token-jwt-provider-adapter',
          ]
          FORMER_ISOLATED = MEMBERS[11:]

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, value: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(value, encoding='utf-8')

          # Remove every one-shot/export workflow from the final target tree.
          for path in (ROOT / '.github/workflows').glob('*one-shot*.yml'):
              path.unlink()
          for path in (ROOT / '.github/workflows').glob('*one-shot*.yaml'):
              path.unlink()

          # Retire the two duplicate compile-gate packages. Their vectors remain
          # covered by the adapter's ordinary integration/security suites.
          for path in [
              ROOT / 'crates/trnm-token-jwt-adapter-gate',
              ROOT / 'crates/trnm-token-jwt-adapter-gate-v2',
          ]:
              if path.exists():
                  shutil.rmtree(path)

          # One root workspace and one lockfile for all long-lived Rust packages.
          manifest = read('Cargo.toml')
          workspace = '[workspace]\nmembers = [\n' + ''.join(
              f'  "{member}",\n' for member in MEMBERS
          ) + ']\nresolver = "2"'
          pattern = re.compile(
              r'\[workspace\]\s*members\s*=\s*\[.*?\]\s*'
              r'(?:exclude\s*=\s*\[.*?\]\s*)?resolver\s*=\s*"2"',
              re.S,
          )
          manifest, count = pattern.subn(workspace, manifest, count=1)
          if count != 1:
              raise SystemExit('root workspace block was not uniquely replaced')
          write('Cargo.toml', manifest)

          for member in FORMER_ISOLATED:
              cargo = ROOT / member / 'Cargo.toml'
              text = cargo.read_text(encoding='utf-8')
              text = re.sub(r'(?m)^\[workspace\]\s*\n?', '', text)
              cargo.write_text(text, encoding='utf-8')
              lock = ROOT / member / 'Cargo.lock'
              if lock.exists():
                  lock.unlink()

          # The dedicated package is the only default production trnm-server.
          server_manifest = read('crates/trnm-server/Cargo.toml').replace(
              'name = "trnm-server-composition-candidate"',
              'name = "trnm-server"',
          )
          write('crates/trnm-server/Cargo.toml', server_manifest)

          old_server = ROOT / OLD_SERVER_PATH
          new_server = ROOT / NEW_SERVER_PATH
          if old_server.exists() and not new_server.exists():
              old_server.rename(new_server)
          elif old_server.exists() and new_server.exists():
              raise SystemExit('both compatibility server source paths exist')
          elif not new_server.exists():
              raise SystemExit('compatibility server source is missing')

          # Replace private SHA/HMAC/equality primitives with RustCrypto/subtle
          # while retaining the compatibility adapter's public API and vectors.
          jwt_manifest_path = ROOT / 'crates/trnm-token-jwt-adapter/Cargo.toml'
          jwt_manifest = jwt_manifest_path.read_text(encoding='utf-8')
          if '[dependencies]' not in jwt_manifest:
              jwt_manifest = jwt_manifest.replace(
                  '[lib]\n',
                  '[dependencies]\nhmac = "=0.13.0"\nsha2 = "=0.11.0"\nsubtle = "=2.6.1"\n\n[lib]\n',
                  1,
              )
          else:
              for dependency, value in [
                  ('hmac', '"=0.13.0"'),
                  ('sha2', '"=0.11.0"'),
                  ('subtle', '"=2.6.1"'),
              ]:
                  if re.search(rf'(?m)^{dependency}\s*=', jwt_manifest) is None:
                      jwt_manifest = jwt_manifest.replace(
                          '[dependencies]\n',
                          f'[dependencies]\n{dependency} = {value}\n',
                          1,
                      )
          jwt_manifest_path.write_text(jwt_manifest, encoding='utf-8')

          write('crates/trnm-token-jwt-adapter/src/sha256.rs', '''use hmac::{Hmac, Mac};
          use sha2::{Digest, Sha256};
          use subtle::ConstantTimeEq;

          type HmacSha256 = Hmac<Sha256>;

          #[must_use]
          pub fn digest(input: &[u8]) -> [u8; 32] {
              let output = Sha256::digest(input);
              let mut value = [0_u8; 32];
              value.copy_from_slice(&output);
              value
          }

          #[must_use]
          pub fn hmac_sha256(key: &[u8], parts: &[&[u8]]) -> [u8; 32] {
              let mut mac = HmacSha256::new_from_slice(key)
                  .expect("HMAC-SHA256 accepts keys of every bounded adapter length");
              for part in parts {
                  mac.update(part);
              }
              let output = mac.finalize().into_bytes();
              let mut value = [0_u8; 32];
              value.copy_from_slice(&output);
              value
          }

          #[must_use]
          pub fn constant_time_eq(left: &[u8], right: &[u8]) -> bool {
              left.len() == right.len() && bool::from(left.ct_eq(right))
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn length_difference_is_never_truncated() {
                  for delta in [1_usize, 255, 256, 257, 512] {
                      assert!(!constant_time_eq(&vec![0; 32], &vec![0; 32 + delta]));
                      assert!(!constant_time_eq(&vec![0; 32 + delta], &vec![0; 32]));
                  }
              }
          }
          '''.replace('          ', ''))

          def contains_gate(value: Any) -> bool:
              return isinstance(value, str) and GATE in value

          DROP = object()

          def scrub(value: Any) -> Any:
              if isinstance(value, dict):
                  identity = [
                      value.get(key) for key in
                      ('id', 'name', 'path', 'manifest', 'documentation', 'package', 'component')
                  ]
                  if any(contains_gate(item) for item in identity):
                      return DROP
                  result = {}
                  context = json.dumps(value, sort_keys=True)
                  for key, item in value.items():
                      cleaned = scrub(item)
                      if cleaned is DROP:
                          continue
                      if key == 'workspace' and cleaned == 'isolated':
                          cleaned = 'root'
                      if (
                          isinstance(cleaned, str)
                          and cleaned == 'trnm-server'
                          and 'trnm-persistence-pg' in context
                          and key in {'binary', 'binary_name', 'target', 'target_name'}
                      ):
                          cleaned = 'trnm-pg-compat-server'
                      result[key] = cleaned
                  return result
              if isinstance(value, list):
                  result = []
                  seen = set()
                  for item in value:
                      if contains_gate(item):
                          continue
                      cleaned = scrub(item)
                      if cleaned is DROP:
                          continue
                      marker = json.dumps(cleaned, sort_keys=True, separators=(',', ':'))
                      if marker not in seen:
                          seen.add(marker)
                          result.append(cleaned)
                  return result
              if isinstance(value, str):
                  return value.replace(OLD_SERVER_PATH, NEW_SERVER_PATH).replace(
                      'trnm-server-composition-candidate', 'trnm-server'
                  )
              return value

          json_paths = [
              'docs/status/MODULE_DOCUMENTATION.json',
              'docs/status/COMPONENT_DOCUMENTATION.json',
              'docs/development/RUST_PACKAGE_AUTHORITY.json',
              'docs/development/CRYPTO_PATH_AUTHORITY.json',
              'docs/status/GAP_REGISTER.json',
              'docs/status/IMPLEMENTATION_INVENTORY.json',
              'docs/status/SOURCE_CANDIDATES.json',
              'docs/roadmap/ARCHITECTURE_CLOSURE.json',
              'docs/roadmap/NEXT_MILESTONE.json',
          ]
          for relative in json_paths:
              path = ROOT / relative
              if not path.exists():
                  continue
              data = scrub(json.loads(path.read_text(encoding='utf-8')))
              if data is DROP:
                  raise SystemExit(f'{relative}: top-level object was removed')
              if relative.endswith('MODULE_DOCUMENTATION.json'):
                  rows = data.get('modules', [])
                  for row in rows:
                      row['workspace'] = 'root'
                  summary = data.setdefault('summary', {})
                  summary.update({
                      'module_count': len(rows),
                      'documented_count': len(rows),
                      'root_workspace_count': len(rows),
                      'isolated_workspace_count': 0,
                      'undocumented_count': 0,
                  })
              elif relative.endswith('RUST_PACKAGE_AUTHORITY.json'):
                  for key in ('packages', 'modules'):
                      rows = data.get(key)
                      if isinstance(rows, list):
                          for row in rows:
                              if isinstance(row, dict) and 'workspace' in row:
                                  row['workspace'] = 'root'
                          summary = data.get('summary')
                          if isinstance(summary, dict):
                              for count_key in ('package_count', 'module_count', 'manifest_count'):
                                  if count_key in summary:
                                      summary[count_key] = len(rows)
                              if 'root_workspace_count' in summary:
                                  summary['root_workspace_count'] = len(rows)
                              if 'isolated_workspace_count' in summary:
                                  summary['isolated_workspace_count'] = 0
              elif relative.endswith('COMPONENT_DOCUMENTATION.json'):
                  rows = data.get('components')
                  if isinstance(rows, list) and isinstance(data.get('summary'), dict):
                      for key in ('component_count', 'documented_count', 'registered_count'):
                          if key in data['summary']:
                              data['summary'][key] = len(rows)
              elif relative.endswith('CRYPTO_PATH_AUTHORITY.json'):
                  providers = data.setdefault('approved_primitive_providers', [])
                  provider_id = 'PROVIDER-RUSTCRYPTO-HMAC-SHA256-SUBTLE'
                  if not any(row.get('id') == provider_id for row in providers if isinstance(row, dict)):
                      providers.append({
                          'id': provider_id,
                          'packages': ['hmac', 'sha2', 'subtle'],
                          'versions': ['0.13.0', '0.11.0', '2.6.1'],
                          'operations': [
                              'SHA-256 digest',
                              'HMAC-SHA256 issue and verify',
                              'equal-length constant-time byte comparison',
                          ],
                          'source_paths': ['crates/trnm-token-jwt-adapter/src/sha256.rs'],
                          'profile': 'reviewed-library-source-candidate',
                          'production_approval': False,
                          'independent_security_acceptance': False,
                      })
                  for row in data.get('path_classifications', []):
                      if row.get('id') in {
                          'CRYPTO-PATH-ACTIVE-OUTBOX-DIGEST',
                          'CRYPTO-PATH-COMPATIBILITY-REFERENCE',
                      }:
                          row['private_primitive_reachable'] = False
                          row['primitive_provider'] = provider_id
                          row.pop('required_remediation', None)
                  summary = data.setdefault('summary', {})
                  summary['active_access_auth_private_primitive_reachable'] = False
                  summary['all_active_crypto_paths_reviewed_provider_backed'] = True
                  summary['private_compatibility_implementation_removed'] = True
                  summary['production_key_provider_accepted'] = False
                  summary['gap_closed'] = False
                  summary['production_ready'] = False
              path.write_text(json.dumps(data, indent=2, sort_keys=False) + '\n', encoding='utf-8')

          # Update non-JSON authority and test surfaces without touching immutable
          # evidence bytes. Exact commands tied to the compatibility package use
          # its new diagnostic binary name.
          text_suffixes = {'.md', '.py', '.sh', '.yml', '.yaml', '.toml', '.rs', '.txt'}
          excluded_roots = {
              Path('docs/evidence'),
              Path('oracle/immutable'),
              Path('manifests/upstream/locked'),
          }
          for path in sorted(ROOT.rglob('*')):
              if not path.is_file() or path.suffix not in text_suffixes:
                  continue
              relative = path.relative_to(ROOT)
              if any(relative == root or root in relative.parents for root in excluded_roots):
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(OLD_SERVER_PATH, NEW_SERVER_PATH)
              text = text.replace('trnm-server-composition-candidate', 'trnm-server')
              if 'trnm-persistence-pg' in text or 'trnm-pg-compat-server' in text:
                  text = text.replace('--bin trnm-server', '--bin trnm-pg-compat-server')
              if path.suffix in {'.md', '.sh'}:
                  text = ''.join(
                      line for line in text.splitlines(keepends=True)
                      if GATE not in line
                  )
              elif path.suffix in {'.yml', '.yaml'}:
                  text = re.sub(
                      r'(?m)^\s*- component: token-jwt-adapter-gate(?:-v2)?\s*\n'
                      r'\s*manifest: crates/trnm-token-jwt-adapter-gate(?:-v2)?/Cargo\.toml\s*\n',
                      '',
                      text,
                  )
              elif path.suffix == '.py' and GATE in text:
                  lines = []
                  for line in text.splitlines(keepends=True):
                      if GATE in line and re.match(r'^\s*["\']?crates/', line):
                          continue
                      line = line.replace('trnm-token-jwt-adapter-gate-v2', 'trnm-token-jwt-adapter')
                      line = line.replace('trnm-token-jwt-adapter-gate', 'trnm-token-jwt-adapter')
                      if any(key in line for key in ('module_count', 'package_count', 'documented_count')):
                          line = re.sub(r'\b21\b', '19', line)
                      if 'root_workspace_count' in line:
                          line = re.sub(r'\b11\b', '19', line)
                      if 'isolated_workspace_count' in line:
                          line = re.sub(r'\b10\b', '0', line)
                      lines.append(line)
                  text = ''.join(lines)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Restore the crypto authority regression to the now-remediated state.
          crypto_test = ROOT / 'tests/control_plane/test_crypto_path_authority.py'
          if crypto_test.exists():
              text = crypto_test.read_text(encoding='utf-8')
              text = text.replace(
                  'def test_unmigrated_outbox_digest_is_explicitly_blocking(self) -> None:',
                  'def test_outbox_digest_uses_reviewed_rustcrypto_provider(self) -> None:',
              )
              text = text.replace(
                  'self.assertTrue(row["private_primitive_reachable"])',
                  'self.assertFalse(row["private_primitive_reachable"])',
              )
              text = text.replace(
                  'self.assertIsNone(row["primitive_provider"])',
                  'self.assertEqual(row["primitive_provider"], "PROVIDER-RUSTCRYPTO-HMAC-SHA256-SUBTLE")',
              )
              text = text.replace(
                  'self.assertIn("trnm_token_jwt_adapter::sha256_digest", source)',
                  'self.assertIn("trnm_token_jwt_adapter::sha256_digest", source)',
              )
              text = text.replace(
                  'self.assertIn("fn constant_time_eq", source)',
                  'self.assertIn("sha256_digest", source)',
              )
              crypto_test.write_text(text, encoding='utf-8')

          # Strong invariants before invoking the repository's own checkers.
          manifests = sorted((ROOT / 'crates').glob('*/Cargo.toml'))
          if len(manifests) != 19:
              raise SystemExit(f'expected 19 crate manifests, found {len(manifests)}')
          if any(GATE in path.as_posix() for path in manifests):
              raise SystemExit('retired gate manifest remains')
          if old_server.exists() or not new_server.exists():
              raise SystemExit('compatibility server rename did not converge')
          if 'name = "trnm-server"' not in read('crates/trnm-server/Cargo.toml'):
              raise SystemExit('canonical trnm-server binary name is absent')
          if '[workspace]' in '\n'.join(read(f'{member}/Cargo.toml') for member in FORMER_ISOLATED):
              raise SystemExit('nested workspace remains')
          PY
          git diff --check
          git status --short

      - name: Generate the single locked Rust dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -f Cargo.lock
          cargo generate-lockfile
          cargo fmt --all
          git diff --check

      - name: Validate control plane and complete Python corpus
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate complete Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Validate Go migration input
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/runtime"
          test -z "$(find . -type f -name '*.go' -print0 | sort -z | xargs -0 gofmt -l)"
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...

      - name: Commit and fast-forward only the target candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test ! -e .github/workflows/architecture-source-export-one-shot.yml
          test ! -e .github/workflows/architecture-test-name-one-shot.yml
          test ! -e .github/workflows/architecture-convergence-transport.yml
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: converge workspace server and crypto authority'
          before=$(cat "$RUNNER_TEMP/target-before.txt")
          test "$(git rev-parse HEAD^)" = "$before"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          git show -s --format='commit=%H%ntree=%T%nparent=%P'

      - name: Remove transport refs after successful publication
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          for branch in \
            codex/architecture-convergence-transport-2026-09-08 \
            codex/architecture-convergence-transport-v2-2026-09-08 \
            codex/architecture-convergence-transport-v3-2026-09-08 \
            codex/architecture-convergence-transport-v4-2026-09-08 \
            codex/architecture-convergence-transport-v5-2026-09-08 \
            codex/architecture-convergence-transport-v6-2026-09-08 \
            codex/architecture-convergence-transport-final-2026-09-08 \
            codex/architecture-convergence-transport-run-2026-09-08 \
            codex/architecture-convergence-transport-exec-2026-09-08 \
            codex/architecture-convergence-transport-only-2026-09-08 \
            codex/architecture-convergence-transport-go-2026-09-08 \
            codex/architecture-convergence-transport-workflow-2026-09-08 \
            codex/architecture-convergence-transport-z-2026-09-08 \
            codex/architecture-convergence-transport-x-2026-09-08 \
            codex/architecture-convergence-transport-y-2026-09-08 \
            codex/architecture-convergence-transport-a-2026-09-08
          do
            git push origin --delete "$branch" >/dev/null 2>&1 || true
          done
