name: world-pr127-game-server-runtime-modules-v7

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pr127-game-server-runtime-modules-v7
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_SOURCE_SHA: 'cc608ce65a4a51b7972fcfd01110a2f95d7571cb'
  COMMON_HELPER_SHA: 'b02fef9a86b77c8babd19a7dd469081095ea2e90'
  STACK_HELPER_SHA: '3aa075564891e4f7abba57c682dafc9f6b06c7b2'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: world-pr127/game-server-runtime-modules-v7
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Fetch exact sources and install local evidence action
        shell: bash
        run: |
          set -euo pipefail
          clone_exact() {
            local directory="$1"
            local remote="$2"
            local revision="$3"
            git init -q "$directory"
            git -C "$directory" remote add origin "$remote"
            git -C "$directory" fetch -q --no-tags --depth=2 origin "$revision"
            git -C "$directory" checkout -q --detach FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          }
          clone_exact "$RUNNER_TEMP/world" \
            "https://github.com/${WORLD_REPOSITORY}.git" "$WORLD_SOURCE_SHA"
          clone_exact "$RUNNER_TEMP/common" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$COMMON_HELPER_SHA"
          clone_exact "$RUNNER_TEMP/stack" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$STACK_HELPER_SHA"
          clone_exact "$RUNNER_TEMP/driver" \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          test -s "$RUNNER_TEMP/driver/scripts/world-pr127-cumulative-modules-transform.py"
          rm -rf "$GITHUB_WORKSPACE/.github/actions/upload-evidence"
          mkdir -p "$GITHUB_WORKSPACE/.github/actions" "$GITHUB_WORKSPACE/scripts"
          cp -R "$RUNNER_TEMP/common/.github/actions/upload-evidence" \
            "$GITHUB_WORKSPACE/.github/actions/"
          cp "$RUNNER_TEMP/common/scripts/upload-actions-artifact.py" \
            "$GITHUB_WORKSPACE/scripts/"

      - name: Install Rust 1.98.1 and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal --component rustfmt,clippy
          rustup default "$RUSTUP_TOOLCHAIN"
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.list.save
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config
          test "$(rustc --version | awk '{print $2}')" = "$RUSTUP_TOOLCHAIN"

      - name: Transform and materialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          python3 "$RUNNER_TEMP/driver/scripts/world-pr127-cumulative-modules-transform.py" \
            "$world" \
            --common-helper "$RUNNER_TEMP/common" \
            --stack-helper "$RUNNER_TEMP/stack" \
            --source-sha "$WORLD_SOURCE_SHA"
          git -C "$world" config user.name 'World qualification'
          git -C "$world" config user.email 'world-qualification@invalid'
          git -C "$world" add -A
          test -n "$(git -C "$world" diff --cached --name-only)"
          GIT_AUTHOR_DATE='2026-09-11T00:00:00Z' \
          GIT_COMMITTER_DATE='2026-09-11T00:00:00Z' \
            git -C "$world" commit -m \
              'refactor(world): extract cumulative root modules'
          packet="$RUNNER_TEMP/world-root-modules-v7"
          mkdir -p "$packet"
          git -C "$world" diff --binary "$WORLD_SOURCE_SHA..HEAD" \
            > "$packet/candidate.patch"
          test -s "$packet/candidate.patch"
          {
            printf 'world_source=%s\n' "$WORLD_SOURCE_SHA"
            printf 'candidate_commit=%s\n' "$(git -C "$world" rev-parse HEAD)"
            printf 'candidate_tree=%s\n' "$(git -C "$world" rev-parse 'HEAD^{tree}')"
            printf 'migrated_seams=44\n'
            printf 'remaining_active_seams=2\n'
            printf 'qualification=pending\n'
            printf 'production_authorization=not_granted\n'
          } > "$packet/identity.txt"
          (cd "$packet" && sha256sum candidate.patch identity.txt > SHA256SUMS)
          tar --sort=name --format=gnu --mtime='UTC 2026-09-11' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/world-root-modules-v7.tar.gz" \
            -C "$RUNNER_TEMP" world-root-modules-v7

      - name: Retain exact unqualified candidate
        uses: ./.github/actions/upload-evidence
        with:
          name: world-root-modules-v7-${{ env.WORLD_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/world-root-modules-v7.tar.gz
          mime_type: application/gzip

      - name: Run format tests and strict Clippy
        shell: bash
        run: |
          set -uo pipefail
          world="$RUNNER_TEMP/world"
          diagnostics="$RUNNER_TEMP/world-root-modules-v7-diagnostics"
          mkdir -p "$diagnostics"
          set +e
          cargo fmt --manifest-path "$world/trillionnium/Cargo.toml" \
            --all --check 2>&1 | tee "$diagnostics/fmt.log"
          fmt_status=${PIPESTATUS[0]}
          cargo test --manifest-path "$world/trillionnium/Cargo.toml" \
            -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server \
            --all-targets --locked 2>&1 | tee "$diagnostics/test.log"
          test_status=${PIPESTATUS[0]}
          cargo clippy --manifest-path "$world/trillionnium/Cargo.toml" \
            -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server \
            --all-targets --locked -- -D warnings \
            2>&1 | tee "$diagnostics/clippy.log"
          clippy_status=${PIPESTATUS[0]}
          set -e
          {
            printf 'fmt_status=%s\n' "$fmt_status"
            printf 'test_status=%s\n' "$test_status"
            printf 'clippy_status=%s\n' "$clippy_status"
          } > "$diagnostics/status.txt"
          test "$fmt_status" -eq 0
          test "$test_status" -eq 0
          test "$clippy_status" -eq 0

      - name: Run complete World truth and source qualification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          python3 scripts/check-trnm-world-include-boundaries.py
          bash scripts/run-trnm-world-v6-qualification-v2.sh truth
          bash scripts/run-trnm-world-v6-qualification-v2.sh source
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          printf 'WORLD_ROOT_MODULES_V7=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'

      - name: Package qualification diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/world-root-modules-v7-diagnostics"
          mkdir -p "$diagnostics"
          test -s "$diagnostics/status.txt" || \
            printf 'state=failed_before_test_status\n' > "$diagnostics/status.txt"
          {
            printf 'world_source=%s\n' "$WORLD_SOURCE_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'production_authorization=not_granted\n'
          } > "$diagnostics/run.txt"
          (cd "$diagnostics" && find . -type f ! -name SHA256SUMS \
            -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          tar --sort=name --format=gnu --mtime='UTC 2026-09-11' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/world-root-modules-v7-diagnostics.tar.gz" \
            -C "$RUNNER_TEMP" world-root-modules-v7-diagnostics

      - name: Upload qualification diagnostics
        if: always()
        uses: ./.github/actions/upload-evidence
        with:
          name: world-root-modules-v7-diagnostics-${{ env.WORLD_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/world-root-modules-v7-diagnostics.tar.gz
          mime_type: application/gzip
