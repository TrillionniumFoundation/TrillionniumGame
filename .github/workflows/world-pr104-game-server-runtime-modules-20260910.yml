name: world-pr127-game-server-runtime-modules-v5

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pr127-game-server-runtime-modules-v5
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_SOURCE_SHA: cc608ce65a4a51b7972fcfd01110a2f95d7571cb
  COMMON_HELPER_SHA: b02fef9a86b77c8babd19a7dd469081095ea2e90
  STACK_HELPER_SHA: 3aa075564891e4f7abba57c682dafc9f6b06c7b2
  RUSTUP_TOOLCHAIN: 1.98.1
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: world-pr127/game-server-runtime-modules-v5
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Fetch exact World source and immutable helpers
        shell: bash
        run: |
          set -euo pipefail
          for specification in \
            "world|https://github.com/${WORLD_REPOSITORY}.git|${WORLD_SOURCE_SHA}" \
            "common|https://github.com/${GITHUB_REPOSITORY}.git|${COMMON_HELPER_SHA}" \
            "stack|https://github.com/${GITHUB_REPOSITORY}.git|${STACK_HELPER_SHA}"; do
            IFS='|' read -r name remote revision <<<"$specification"
            directory="$RUNNER_TEMP/$name"
            git init -q "$directory"
            git -C "$directory" remote add origin "$remote"
            git -C "$directory" fetch -q --no-tags --depth=2 origin "$revision"
            git -C "$directory" checkout -q --detach FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$revision"
          done
          test -s "$RUNNER_TEMP/common/scripts/world-pr104-all-test-modules-transform.py"
          test -s "$RUNNER_TEMP/stack/scripts/world-pr104-campaign-runtime-modules-transform.py"
          test -s "$RUNNER_TEMP/stack/scripts/world-pr104-rts-runtime-modules-transform.py"
          test -s "$RUNNER_TEMP/stack/scripts/world-pr104-game-server-runtime-modules-transform.py"

      - name: Install pinned Rust toolchain and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUSTUP_TOOLCHAIN"
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config
          test "$(rustc --version | awk '{print $2}')" = "$RUSTUP_TOOLCHAIN"

      - name: Apply cumulative module transformations
        shell: bash
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/world"
          common="$RUNNER_TEMP/common"
          stack="$RUNNER_TEMP/stack"

          python3 "$common/scripts/world-pr104-all-test-modules-transform.py" \
            "$world" --source-sha "$WORLD_SOURCE_SHA"
          python3 "$stack/scripts/world-pr104-campaign-runtime-modules-transform.py" \
            "$world" --completed-commit "$WORLD_SOURCE_SHA"
          python3 "$stack/scripts/world-pr104-rts-runtime-modules-transform.py" \
            "$world" --completed-commit "$WORLD_SOURCE_SHA"
          python3 "$stack/scripts/world-pr104-game-server-runtime-modules-transform.py" \
            "$world" --completed-commit "$WORLD_SOURCE_SHA" --helper-root "$stack/scripts"

          python3 - "$world" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import sys

          root = Path(sys.argv[1])
          crate = root / 'trillionnium/crates/trnm-game-server/src'
          authority = crate / 'lib_parts/authority_foundation/part_01.rs'
          lib = crate / 'lib.rs'

          authority_text = authority.read_text(encoding='utf-8', errors='strict')
          start = authority_text.index('use axum::extract::DefaultBodyLimit;')
          boundary = re.search(
              r'(?m)^(?:pub\(crate\)\s+)?const PLAYER_SESSION_HEADER',
              authority_text,
          )
          if boundary is None or boundary.start() <= start:
              raise SystemExit('shared import declaration boundary drift')
          imports = authority_text[start:boundary.start()].rstrip() + '\n'
          if 'use uuid::Uuid;' not in imports or 'use tokio::sync::' not in imports:
              raise SystemExit('shared import inventory drift')
          authority.write_text(
              authority_text[:start] + authority_text[boundary.start():],
              encoding='utf-8',
          )

          lib_text = lib.read_text(encoding='utf-8', errors='strict')
          anchor = 'mod stream;\n'
          if lib_text.count(anchor) != 1 or 'use axum::extract::DefaultBodyLimit;' in lib_text:
              raise SystemExit('crate-root import insertion drift')
          lib.write_text(lib_text.replace(anchor, anchor + '\n' + imports), encoding='utf-8')

          online = crate / 'bin/trnm-online-e2e.rs'
          text = online.read_text(encoding='utf-8', errors='strict')
          old = '    let _ = tokio::task::block_in_place(|| state_stream.close(None));'
          new = '    tokio::task::block_in_place(|| {\n        let _ = state_stream.close(None);\n    });'
          if text.count(old) == 1 and new not in text:
              online.write_text(text.replace(old, new), encoding='utf-8')
          elif text.count(new) != 1 or old in text:
              raise SystemExit('WebSocket close repair drift')

          for manifest_path in (
              root / 'trillionnium/crates/trnm-campaign-core/src/lib_parts/manifest.json',
              root / 'trillionnium/crates/trnm-rts-sim/src/lib_parts/manifest.json',
              root / 'trillionnium/crates/trnm-game-server/src/lib_parts/manifest.json',
          ):
              value = json.loads(manifest_path.read_text(encoding='utf-8'))
              source_root = manifest_path.parent.parent
              for field in ('parts', 'nested_test_parts'):
                  for record in value.get(field, []):
                      payload = (source_root / record['path']).read_bytes()
                      record['bytes'] = len(payload)
                      record['sha256'] = hashlib.sha256(payload).hexdigest()
              manifest_path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY

          cargo fmt --manifest-path "$world/trillionnium/Cargo.toml" --all

          # rustfmt changes direct-source bytes; bind manifests one final time.
          python3 - "$world" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import sys
          root = Path(sys.argv[1])
          for manifest_path in (
              root / 'trillionnium/crates/trnm-campaign-core/src/lib_parts/manifest.json',
              root / 'trillionnium/crates/trnm-rts-sim/src/lib_parts/manifest.json',
              root / 'trillionnium/crates/trnm-game-server/src/lib_parts/manifest.json',
          ):
              value = json.loads(manifest_path.read_text(encoding='utf-8'))
              source_root = manifest_path.parent.parent
              for field in ('parts', 'nested_test_parts'):
                  for record in value.get(field, []):
                      payload = (source_root / record['path']).read_bytes()
                      record['bytes'] = len(payload)
                      record['sha256'] = hashlib.sha256(payload).hexdigest()
              manifest_path.write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          PY

          git -C "$world" config user.name 'World qualification'
          git -C "$world" config user.email 'world-qualification@invalid'
          git -C "$world" add -A
          GIT_AUTHOR_DATE='2026-09-11T00:00:00Z' \
          GIT_COMMITTER_DATE='2026-09-11T00:00:00Z' \
            git -C "$world" commit -m 'refactor(world): extract cumulative root modules'

          mkdir -p "$RUNNER_TEMP/candidate"
          git -C "$world" diff --binary "$WORLD_SOURCE_SHA..HEAD" \
            > "$RUNNER_TEMP/candidate/candidate.patch"
          test -s "$RUNNER_TEMP/candidate/candidate.patch"
          {
            printf 'world_source=%s\n' "$WORLD_SOURCE_SHA"
            printf 'candidate_commit=%s\n' "$(git -C "$world" rev-parse HEAD)"
            printf 'candidate_tree=%s\n' "$(git -C "$world" rev-parse 'HEAD^{tree}')"
            printf 'migrated_seams=44\n'
            printf 'remaining_active_seams=2\n'
            printf 'qualification=pending\n'
            printf 'production_authorization=not_granted\n'
          } > "$RUNNER_TEMP/candidate/identity.txt"
          (cd "$RUNNER_TEMP/candidate" && sha256sum candidate.patch identity.txt > SHA256SUMS)

      - name: Upload exact unqualified candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-root-modules-v5-${{ env.WORLD_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/**
          if-no-files-found: error
          retention-days: 90

      - name: Run format tests and strict Clippy
        shell: bash
        run: |
          set -uo pipefail
          world="$RUNNER_TEMP/world"
          diagnostics="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics"
          set +e
          cargo fmt --manifest-path "$world/trillionnium/Cargo.toml" --all --check \
            2>&1 | tee "$diagnostics/fmt.log"
          fmt_status=${PIPESTATUS[0]}
          cargo test --manifest-path "$world/trillionnium/Cargo.toml" \
            -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server \
            --all-targets --locked 2>&1 | tee "$diagnostics/test.log"
          test_status=${PIPESTATUS[0]}
          cargo clippy --manifest-path "$world/trillionnium/Cargo.toml" \
            -p trnm-campaign-core -p trnm-rts-sim -p trnm-game-server \
            --all-targets --locked -- -D warnings 2>&1 | tee "$diagnostics/clippy.log"
          clippy_status=${PIPESTATUS[0]}
          set -e
          printf 'fmt_status=%s\ntest_status=%s\nclippy_status=%s\n' \
            "$fmt_status" "$test_status" "$clippy_status" \
            > "$diagnostics/status.txt"
          test "$fmt_status" -eq 0
          test "$test_status" -eq 0
          test "$clippy_status" -eq 0

      - name: Run complete World truth and source qualification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          python3 scripts/check-trnm-world-include-boundaries.py
          bash scripts/run-trnm-world-v6-qualification-v2.sh truth
          bash scripts/run-trnm-world-v6-qualification-v2.sh source
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          printf 'WORLD_ROOT_MODULES_V5=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'

      - name: Finalize diagnostic manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/diagnostics"
          mkdir -p "$diagnostics"
          test -s "$diagnostics/status.txt" || printf 'state=failed_before_test_status\n' > "$diagnostics/status.txt"
          {
            printf 'world_source=%s\n' "$WORLD_SOURCE_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'production_authorization=not_granted\n'
          } > "$diagnostics/run.txt"
          (cd "$diagnostics" && find . -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > SHA256SUMS)

      - name: Upload qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-root-modules-v5-diagnostics-${{ env.WORLD_SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/diagnostics/**
          if-no-files-found: error
          retention-days: 90
