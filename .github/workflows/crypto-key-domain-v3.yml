name: crypto-key-domain-v3

on:
  push:
    branches: [tooling/crypto-key-lifecycle-patch-2026-09-06]
    paths:
      - '.github/workflows/crypto-key-domain-v3.yml'

permissions:
  contents: write

concurrency:
  group: crypto-key-domain-v3
  cancel-in-progress: true

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_BRANCH: codex/crypto-key-lifecycle-2026-09-06
      EXPECTED_BASE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact lifecycle product branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/product"
          git init "$GITHUB_WORKSPACE/product"
          git -C "$GITHUB_WORKSPACE/product" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/product" fetch --no-tags --depth=64 origin \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/source/product"
          git -C "$GITHUB_WORKSPACE/product" checkout -b "$PRODUCT_BRANCH" \
            refs/remotes/source/product
          git -C "$GITHUB_WORKSPACE/product" merge-base --is-ancestor \
            "$EXPECTED_BASE" HEAD
          git -C "$GITHUB_WORKSPACE/product" rev-parse HEAD \
            > "$RUNNER_TEMP/original-head"
          test -f "$GITHUB_WORKSPACE/product/crates/trnm-token-crypto-provider/src/key_epoch.rs"
          test -f "$GITHUB_WORKSPACE/product/crates/trnm-token-crypto-provider/src/signer_journal.rs"

      - name: Add domain-bound lifecycle wrapper using canonical KeyDomain
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          cat > crates/trnm-token-crypto-provider/src/key_domain.rs <<'RS'
          //! Explicit cryptographic key-domain separation.
          //!
          //! The wrapper reuses the crate's canonical [`KeyDomain`] enum, so
          //! provider keys cannot be silently reclassified through a second,
          //! divergent domain vocabulary. It stores only opaque key IDs and
          //! delegates lifecycle transitions to the bounded epoch registry.

          use std::fmt;

          use super::key_epoch::{
              KeyEpoch, KeyEpochError, KeyEpochRecord, KeyEpochRegistry, KeyId,
          };
          use super::KeyDomain;

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct DomainBoundKeyId {
              pub domain: KeyDomain,
              pub key_id: KeyId,
          }

          impl DomainBoundKeyId {
              #[must_use]
              pub const fn new(domain: KeyDomain, key_id: KeyId) -> Self {
                  Self { domain, key_id }
              }
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub enum KeyDomainError {
              DomainMismatch {
                  expected: KeyDomain,
                  received: KeyDomain,
              },
              Lifecycle(KeyEpochError),
          }

          impl fmt::Display for KeyDomainError {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  match self {
                      Self::DomainMismatch { expected, received } => write!(
                          formatter,
                          "key domain mismatch: expected {expected:?}, received {received:?}"
                      ),
                      Self::Lifecycle(error) => error.fmt(formatter),
                  }
              }
          }

          impl std::error::Error for KeyDomainError {}

          impl From<KeyEpochError> for KeyDomainError {
              fn from(value: KeyEpochError) -> Self {
                  Self::Lifecycle(value)
              }
          }

          #[derive(Clone, Debug)]
          pub struct DomainKeyEpochRegistry {
              domain: KeyDomain,
              inner: KeyEpochRegistry,
          }

          impl DomainKeyEpochRegistry {
              #[must_use]
              pub fn new(domain: KeyDomain) -> Self {
                  Self {
                      domain,
                      inner: KeyEpochRegistry::new(),
                  }
              }

              #[must_use]
              pub const fn domain(&self) -> KeyDomain {
                  self.domain
              }

              pub fn initialize(
                  &mut self,
                  epoch: KeyEpoch,
                  key: DomainBoundKeyId,
                  activated_at_unix_seconds: i64,
              ) -> Result<KeyEpochRecord, KeyDomainError> {
                  self.require_domain(key)?;
                  Ok(self
                      .inner
                      .initialize(epoch, key.key_id, activated_at_unix_seconds)?)
              }

              pub fn rotate(
                  &mut self,
                  next_epoch: KeyEpoch,
                  next_key: DomainBoundKeyId,
                  activated_at_unix_seconds: i64,
                  previous_retire_after_unix_seconds: i64,
              ) -> Result<KeyEpochRecord, KeyDomainError> {
                  self.require_domain(next_key)?;
                  Ok(self.inner.rotate(
                      next_epoch,
                      next_key.key_id,
                      activated_at_unix_seconds,
                      previous_retire_after_unix_seconds,
                  )?)
              }

              pub fn active_signer(&self) -> Result<KeyEpochRecord, KeyDomainError> {
                  Ok(self.inner.active_signer()?)
              }

              pub fn verification_key(
                  &self,
                  epoch: KeyEpoch,
                  now_unix_seconds: i64,
              ) -> Result<KeyEpochRecord, KeyDomainError> {
                  Ok(self.inner.verification_key(epoch, now_unix_seconds)?)
              }

              pub fn retire_expired(&mut self, now_unix_seconds: i64) -> usize {
                  self.inner.retire_expired(now_unix_seconds)
              }

              pub fn revoke(
                  &mut self,
                  epoch: KeyEpoch,
                  revoked_at_unix_seconds: i64,
              ) -> Result<KeyEpochRecord, KeyDomainError> {
                  Ok(self.inner.revoke(epoch, revoked_at_unix_seconds)?)
              }

              fn require_domain(&self, key: DomainBoundKeyId) -> Result<(), KeyDomainError> {
                  if key.domain == self.domain {
                      Ok(())
                  } else {
                      Err(KeyDomainError::DomainMismatch {
                          expected: self.domain,
                          received: key.domain,
                      })
                  }
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              fn epoch(value: u64) -> KeyEpoch {
                  KeyEpoch::new(value).unwrap()
              }

              fn key(domain: KeyDomain, value: u8) -> DomainBoundKeyId {
                  DomainBoundKeyId::new(domain, KeyId::new([value; 16]).unwrap())
              }

              #[test]
              fn cross_domain_initialization_is_rejected_without_state() {
                  let mut registry = DomainKeyEpochRegistry::new(KeyDomain::AccessToken);
                  assert_eq!(
                      registry.initialize(epoch(1), key(KeyDomain::RefreshToken, 1), 10),
                      Err(KeyDomainError::DomainMismatch {
                          expected: KeyDomain::AccessToken,
                          received: KeyDomain::RefreshToken,
                      })
                  );
                  assert!(matches!(
                      registry.active_signer(),
                      Err(KeyDomainError::Lifecycle(KeyEpochError::NoActiveSigner))
                  ));
              }

              #[test]
              fn cross_domain_rotation_does_not_retire_current_signer() {
                  let mut registry = DomainKeyEpochRegistry::new(KeyDomain::Socket);
                  registry
                      .initialize(epoch(1), key(KeyDomain::Socket, 1), 10)
                      .unwrap();
                  assert_eq!(
                      registry.rotate(epoch(2), key(KeyDomain::Authority, 2), 20, 30),
                      Err(KeyDomainError::DomainMismatch {
                          expected: KeyDomain::Socket,
                          received: KeyDomain::Authority,
                      })
                  );
                  assert_eq!(registry.active_signer().unwrap().epoch, epoch(1));
              }

              #[test]
              fn same_domain_rotation_preserves_lifecycle_contract() {
                  let mut registry = DomainKeyEpochRegistry::new(KeyDomain::Authority);
                  registry
                      .initialize(epoch(7), key(KeyDomain::Authority, 7), 100)
                      .unwrap();
                  registry
                      .rotate(epoch(8), key(KeyDomain::Authority, 8), 200, 300)
                      .unwrap();
                  assert_eq!(registry.active_signer().unwrap().epoch, epoch(8));
                  assert_eq!(
                      registry.verification_key(epoch(7), 300).unwrap().epoch,
                      epoch(7)
                  );
              }
          }
          RS

          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-token-crypto-provider/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          if 'mod key_domain;' not in text:
              marker = 'mod key_epoch;'
              if text.count(marker) != 1:
                  raise SystemExit('key epoch module registration drift')
              text = text.replace(marker, 'mod key_domain;\n' + marker, 1)
          export = (
              'pub use key_domain::{\n'
              '    DomainBoundKeyId, DomainKeyEpochRegistry, KeyDomainError,\n'
              '};\n'
          )
          if 'pub use key_domain::' not in text:
              text = text.rstrip() + '\n\n' + export
          elif 'KeyDomain,' in text.split('pub use key_domain::', 1)[1].split('};', 1)[0]:
              raise SystemExit('duplicate KeyDomain export retained')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Normalize, test and strictly lint
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          git add -N crates/trnm-token-crypto-provider/src/key_domain.rs
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml
          git diff --check
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-token-crypto-provider/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-token-crypto-provider/Cargo.toml \
            --all-targets --locked -- -D warnings
          grep -qF 'pub struct DomainKeyEpochRegistry' \
            crates/trnm-token-crypto-provider/src/key_domain.rs
          grep -qF 'use super::KeyDomain;' \
            crates/trnm-token-crypto-provider/src/key_domain.rs

      - name: CAS fast-forward validated branch
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add crates/trnm-token-crypto-provider/src
          if git diff --cached --quiet; then
            printf 'source_already_current=true\nhead=%s\n' "$original"
            exit 0
          fi
          git diff --cached --check
          git commit -m 'feat(crypto): enforce canonical key-domain separation'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${original}"
          printf 'old_head=%s\nnew_head=%s\ntree=%s\n' \
            "$original" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Preserve claim boundary
        shell: bash
        run: |
          printf '%s\n' \
            'source_candidate=true' \
            'real_key_material_used=false' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false'
