name: tmp-consolidate-product-stack

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-consolidate-product-stack.yml

permissions:
  checks: read
  contents: write
  pull-requests: write
  issues: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  BASE_BRANCH: integration/plan-v32-main-rebind-2026-09-09
  INTEGRATION_BRANCH: integration/plan-v32-product-surface-20260909
  GH_TOKEN: ${{ github.token }}

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Wait for every product branch to reach a stable aggregate
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            feature/plan-v32-product-wave1-20260909-v3
            feature/plan-v32-storage-service-20260909
            feature/plan-v32-competition-core-20260909
            feature/plan-v32-multiplayer-core-20260909
            feature/plan-v32-api-gateway-core-20260909
            feature/plan-v32-rtapi-service-20260909
            feature/plan-v32-runtime-core-20260909
            feature/plan-v32-console-core-20260909
            feature/plan-v32-provider-value-core-20260909
            feature/plan-v32-migration-core-20260909
            feature/plan-v32-kms-adapter-20260909
            feature/plan-v32-conformance-core-20260909
            feature/plan-v32-recovery-core-20260909
            feature/plan-v32-endurance-core-20260909
            feature/plan-v32-cutover-controller-20260909
          )
          declare -A last_sha
          declare -A stable
          for branch in "${branches[@]}"; do stable["$branch"]=0; done

          for _ in $(seq 1 960); do
            complete=0
            : > "$RUNNER_TEMP/product-heads.tsv"
            for branch in "${branches[@]}"; do
              sha="$(gh api "repos/${REPOSITORY}/branches/${branch}" --jq '.commit.sha' 2>/dev/null || true)"
              if test -z "$sha"; then
                stable["$branch"]=0
                continue
              fi
              if test "${last_sha[$branch]:-}" != "$sha"; then
                last_sha["$branch"]="$sha"
                stable["$branch"]=0
              fi
              payload="$(gh api "repos/${REPOSITORY}/commits/${sha}/check-runs?per_page=100" 2>/dev/null || echo '{"check_runs":[]}')"
              canonical="$(jq -c '
                reduce .check_runs[] as $run ({};
                  if .[$run.name] == null
                     or ((.[$run.name].started_at // "") < ($run.started_at // ""))
                  then .[$run.name] = $run else . end)
                | [.[]]
              ' <<<"$payload")"
              total="$(jq 'length' <<<"$canonical")"
              pending="$(jq '[.[]|select(.status!="completed")]|length' <<<"$canonical")"
              failed="$(jq '[.[]|select(.status=="completed" and (.conclusion!="success" and .conclusion!="neutral" and .conclusion!="skipped"))]|length' <<<"$canonical")"
              aggregate="$(jq '[.[]|select(.name=="trillionnium-game-merge-gate" and .status=="completed" and .conclusion=="success")]|length' <<<"$canonical")"
              if test "$total" -gt 0 && test "$pending" -eq 0 && test "$failed" -eq 0 && test "$aggregate" -gt 0; then
                stable["$branch"]=$(( ${stable[$branch]} + 1 ))
              else
                stable["$branch"]=0
              fi
              if test "${stable[$branch]}" -ge 2; then
                complete=$((complete+1))
                printf '%s\t%s\n' "$branch" "$sha" >> "$RUNNER_TEMP/product-heads.tsv"
              fi
            done
            if test "$complete" -eq "${#branches[@]}"; then
              cp "$RUNNER_TEMP/product-heads.tsv" "$RUNNER_TEMP/final-product-heads.tsv"
              break
            fi
            sleep 20
          done
          test -s "$RUNNER_TEMP/final-product-heads.tsv"
          test "$(wc -l < "$RUNNER_TEMP/final-product-heads.tsv")" -eq "${#branches[@]}"
          base_sha="$(gh api "repos/${REPOSITORY}/branches/${BASE_BRANCH}" --jq '.commit.sha')"
          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"
          {
            printf 'heads<<EOF\n'
            cat "$RUNNER_TEMP/final-product-heads.tsv"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Merge latest green waves in dependency order
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin '${{ steps.subjects.outputs.base_sha }}'
          git -C "$GITHUB_WORKSPACE" checkout -B "$INTEGRATION_BRANCH" FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" config user.name 'github-actions[bot]'
          git -C "$GITHUB_WORKSPACE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS=$'\t' read -r branch sha; do
            git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$sha"
            if ! git -C "$GITHUB_WORKSPACE" merge --no-ff --no-edit FETCH_HEAD; then
              git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
              {
                printf 'Product stack consolidation conflict while merging `%s` at `%s`.\n\n' "$branch" "$sha"
                sed 's/^/- `/' "$RUNNER_TEMP/conflicts.txt" | sed 's/$/`/'
                printf '\nNo integration branch was published.\n'
              } > "$RUNNER_TEMP/conflict-comment.md"
              gh issue comment 129 --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/conflict-comment.md"
              exit 1
            fi
          done < "$RUNNER_TEMP/final-product-heads.tsv"
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.toml Cargo.lock crates docs tests scripts .github/CODEOWNERS
          if ! git diff --cached --quiet; then
            git commit -m 'chore(integration): normalize product stack lock and formatting'
          fi
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse HEAD^{tree})"
          printf 'head_sha=%s\nhead_tree=%s\n' "$head_sha" "$head_tree" >> "$GITHUB_OUTPUT"

      - name: Qualify consolidated source before publication
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
          do
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-workspace-convergence.py
          python3 scripts/check-plan.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code

      - name: Publish singular product integration candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git push --force-with-lease origin "HEAD:refs/heads/${INTEGRATION_BRANCH}"
          existing="$(gh pr list --repo "$REPOSITORY" --head "$INTEGRATION_BRANCH" --state open --json number --jq '.[0].number // empty')"
          cat > "$RUNNER_TEMP/pr.md" <<EOF
          ## Scope

          Singular Plan v3.2 product-surface integration candidate stacked on PR #150.

          \`\`\`text
          base branch   ${BASE_BRANCH}
          base commit   ${{ steps.subjects.outputs.base_sha }}
          head branch   ${INTEGRATION_BRANCH}
          head commit   ${{ steps.merge.outputs.head_sha }}
          head tree     ${{ steps.merge.outputs.head_tree }}
          \`\`\`

          This candidate merges the latest stable-aggregate heads for identity, social, storage, competition/scheduler, party/matchmaker/multiplayer, HTTP/gRPC admission, RTAPI, Runtime, Console, provider/IAP value, migration, KMS outcome, conformance, recovery, endurance and cutover control.

          Each included branch remains a source candidate. This integration does not create official SDK/oracle observations, real KMS/HSM custody, live HA/PITR/endurance, accepted evidence, production readiness, cutover authorization or Nakama retirement.

          The exact included branch heads are recorded in the workflow run and PR comment. Any later source/base movement requires requalification.
          EOF
          if test -z "$existing"; then
            gh pr create --repo "$REPOSITORY" --draft --base "$BASE_BRANCH" --head "$INTEGRATION_BRANCH" --title '[Plan v3.2] Consolidate product, operations and cutover source candidates' --body-file "$RUNNER_TEMP/pr.md" --reviewer Tomasrgbsf --reviewer Franksudoman
            existing="$(gh pr list --repo "$REPOSITORY" --head "$INTEGRATION_BRANCH" --state open --json number --jq '.[0].number')"
          else
            gh pr edit "$existing" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/pr.md"
          fi
          {
            printf 'Included exact branch heads:\n\n'
            while IFS=$'\t' read -r branch sha; do printf -- '- `%s` — `%s`\n' "$branch" "$sha"; done < "$RUNNER_TEMP/final-product-heads.tsv"
          } > "$RUNNER_TEMP/heads-comment.md"
          gh pr comment "$existing" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/heads-comment.md"
          gh issue comment 129 --repo "$REPOSITORY" --body "The singular product-surface integration candidate PR #${existing} was published at \`${{ steps.merge.outputs.head_sha }}\`. It remains Draft; every product/evidence/production acceptance boundary remains open."
