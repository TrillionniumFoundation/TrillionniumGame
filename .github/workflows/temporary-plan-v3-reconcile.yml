name: temporary-plan-v3-post-merge-reconcile

on:
  push:
    branches:
      - codex/plan-v3-post-merge-reconcile-2026-08-31
    paths:
      - scripts/temporary-plan-v3-reconcile.py
      - .github/workflows/temporary-plan-v3-reconcile.yml

permissions:
  contents: write

concurrency:
  group: temporary-plan-v3-post-merge-reconcile-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_REPOSITORY: ${{ github.repository }}
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  patch-validate-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact branch without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B codex/plan-v3-post-merge-reconcile-2026-08-31 FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Apply bounded reconciliation and remove executor
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temporary-plan-v3-reconcile.py
          rm scripts/temporary-plan-v3-reconcile.py
          rm .github/workflows/temporary-plan-v3-reconcile.yml
          cargo fmt --all
          git diff --check
          test -z "$(find .github/workflows scripts -type f -name 'temporary-*' -print -quit)"

      - name: Validate control plane and evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-plan.py
          python3 scripts/check-gap-register.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-workflow-actions.py
          python3 scripts/check-source-candidate-boundaries.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-rust-package-inventory.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Test and strictly lint the full Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Execute exact-image outbox final-attempt fault matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path('config/database-test-images.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('TRNM_POSTGRES_IMAGE=' + value['profiles']['postgresql']['image'] + '\n')
              output.write('TRNM_COCKROACH_IMAGE=' + value['profiles']['cockroachdb']['image'] + '\n')
          PY
          TRNM_EVIDENCE_ROOT=run/reconcile-outbox \
            TRNM_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-postgresql" \
            bash scripts/ci-outbox-spool-worker.sh postgresql
          TRNM_EVIDENCE_ROOT=run/reconcile-outbox \
            TRNM_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cockroachdb" \
            bash scripts/ci-outbox-spool-worker.sh cockroachdb

      - name: Commit only the validated product tree
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(find .github/workflows scripts -type f -name 'temporary-*' -print -quit)"
          git diff --check
          git config user.name 'trillionnium-plan-reconciler'
          git config user.email 'plan-reconciler@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(plan): reconcile accepted controls and final-attempt outbox recovery'
          git push origin HEAD:codex/plan-v3-post-merge-reconcile-2026-08-31
