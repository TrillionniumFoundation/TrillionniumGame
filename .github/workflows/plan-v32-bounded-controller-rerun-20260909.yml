name: plan-v32-bounded-controller-rerun-20260909

on:
  push:
    branches:
      - codex/plan-v32-controller-v2-2026-09-09
    paths:
      - .github/workflows/plan-v32-bounded-controller-rerun-20260909.yml
      - tools/rerun_failed_plan_v32_controllers.sh
      - docs/internal/plan-v32-controller-rerun.request

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: plan-v32-bounded-controller-rerun-20260909
  cancel-in-progress: true

jobs:
  rerun-terminal-failures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact controller source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/controller"
          git init "$GITHUB_WORKSPACE/controller"
          git -C "$GITHUB_WORKSPACE/controller" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/controller" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/controller" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/controller" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Rerun only bounded terminal failures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/controller/tools/rerun_failed_plan_v32_controllers.sh"
