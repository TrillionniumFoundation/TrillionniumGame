name: plan-v31-current-turn-settlement-v2

on:
  push:
    branches: [tooling/gap-closure-audit-2026-09-07]
    paths:
      - '.github/workflows/plan-v31-current-turn-settlement-v2.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  settle:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_BRANCH: tooling/gap-closure-audit-2026-09-07
      TARGET_PR: '63'
      COMMAND_ISSUE: '7'
      EXPECTED_HEAD: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
      EXPECTED_TREE: 9d3ae2fadb2684f095855ecf16307376b55a440f
      EXPECTED_BASE: d66c1b5b614a2a7b682c233fe2e7a19939b6976b
      EXPECTED_MERGE: 6965f95d03031156edc92cc862bd979ff87e9edb
    steps:
      - name: Build exact closed-set settlement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/settlement"
          python3 - <<'PY'
          from __future__ import annotations

          import base64, json, os, time, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          repository=os.environ['TARGET_REPOSITORY']; branch=os.environ['TARGET_BRANCH']; token=os.environ['GH_TOKEN']
          root=f'https://api.github.com/repos/{repository}'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','User-Agent':'trillionnium-plan-v31-settlement-v2','X-GitHub-Api-Version':'2022-11-28'}
          producers={
            'effective-governance-readback','monotonic-main-protection-reconcile','governance-negative-rehearsal',
            'governance-settlement','conflict-free-reviewer-discovery','v7-source-wave-admission-handoff',
            'archive-zero-credit-transfer-pr','storage-nakama-live-differential','database-ha-restore-live-evidence',
            'current-gap-producer-diagnostics','focused-source-gap-evidence','aws-kms-hmac-live-evidence',
          }
          def call(method,path,body=None,allowed=()):
            data=None if body is None else json.dumps(body,separators=(',',':')).encode()
            req=urllib.request.Request(root+path,data=data,headers=headers,method=method)
            try:
              with urllib.request.urlopen(req,timeout=60) as r:
                raw=r.read(); return r.status,json.loads(raw.decode()) if raw else None
            except urllib.error.HTTPError as e:
              raw=e.read().decode(errors='replace')
              if e.code in allowed:
                try: value=json.loads(raw) if raw else None
                except Exception: value={'message':raw[:1000]}
                return e.code,value
              raise SystemExit(f'{method} {path}: HTTP {e.code}: {raw[:2000]}')

          deadline=time.monotonic()+60*60; latest={}
          while True:
            _,payload=call('GET','/actions/runs?'+urllib.parse.urlencode({'branch':branch,'per_page':100}))
            for row in payload.get('workflow_runs',[]):
              name=row.get('name')
              if name not in producers: continue
              rank=(int(row.get('run_attempt') or 0),int(row.get('id') or 0)); old=latest.get(name)
              old_rank=(int(old.get('run_attempt') or 0),int(old.get('id') or 0)) if old else (-1,-1)
              if old is None or rank>old_rank: latest[name]=row
            if producers.issubset(latest) and all(latest[n].get('status')=='completed' for n in producers): break
            if time.monotonic()>=deadline: break
            time.sleep(15)

          _,pull=call('GET',f"/pulls/{os.environ['TARGET_PR']}")
          _,commit=call('GET',f"/git/commits/{pull['head']['sha']}")
          identities={'base':pull['base']['sha'],'head':pull['head']['sha'],'tree':commit['tree']['sha'],'prospective_merge':pull.get('merge_commit_sha')}
          expected={'base':os.environ['EXPECTED_BASE'],'head':os.environ['EXPECTED_HEAD'],'tree':os.environ['EXPECTED_TREE'],'prospective_merge':os.environ['EXPECTED_MERGE']}
          records=[]
          for name in sorted(producers):
            row=latest.get(name)
            if row is None:
              records.append({'workflow':name,'status':'missing','conclusion':None,'artifacts':[]}); continue
            _,artifacts=call('GET',f"/actions/runs/{row['id']}/artifacts?per_page=100")
            records.append({'workflow':name,'run_id':row['id'],'run_attempt':row.get('run_attempt'),'head_sha':row.get('head_sha'),'status':row.get('status'),'conclusion':row.get('conclusion'),'artifacts':[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'digest':a.get('digest'),'expired':a.get('expired')} for a in artifacts.get('artifacts',[])]})

          def content(path):
            _,value=call('GET','/contents/'+path+'?ref='+urllib.parse.quote(os.environ['EXPECTED_HEAD']))
            return json.loads(base64.b64decode(value['content']))
          gap=content('docs/status/GAP_REGISTER.json'); evidence=content('docs/evidence/index.json'); product=content('docs/status/PRODUCT_GATES.json')
          gaps=gap.get('gaps',[]); gates=product.get('gates',[])
          accepted=evidence.get('accepted_entry_count')
          if not isinstance(accepted,int): accepted=sum(1 for row in evidence.get('entries',[]) if row.get('status')=='accepted')
          _,reviews=call('GET',f"/pulls/{os.environ['TARGET_PR']}/reviews?per_page=100")
          latest_review={}
          for row in reviews:
            login=str((row.get('user') or {}).get('login') or '').lower()
            if not login: continue
            old=latest_review.get(login)
            if old is None or str(old.get('submitted_at') or '')<=str(row.get('submitted_at') or ''): latest_review[login]=row
          conflicts={'profhepta','franksudoman'}
          approvals=[row for login,row in latest_review.items() if login not in conflicts and row.get('state')=='APPROVED' and row.get('commit_id')==os.environ['EXPECTED_HEAD'] and str((row.get('user') or {}).get('type') or '').lower()!='bot']
          changes=[row for login,row in latest_review.items() if login not in conflicts and row.get('state')=='CHANGES_REQUESTED' and row.get('commit_id')==os.environ['EXPECTED_HEAD']]
          status_counts={}; gate_counts={}
          for row in gaps: status_counts[row.get('status')]=status_counts.get(row.get('status'),0)+1
          for row in gates: gate_counts[row.get('status')]=gate_counts.get(row.get('status'),0)+1
          formal={
            'identity_stable':identities==expected,
            'producer_count':len(producers),
            'producer_terminal_success':sum(r.get('status')=='completed' and r.get('conclusion')=='success' for r in records),
            'producer_terminal_failure':sum(r.get('status')=='completed' and r.get('conclusion') not in ('success','neutral','skipped') for r in records),
            'producer_active_or_missing':sum(r.get('status')!='completed' for r in records),
            'gap_count':len(gaps),'gaps_closed':sum(r.get('status')=='closed' for r in gaps),
            'close_criteria_count':sum(len(r.get('close_criteria',[])) for r in gaps),'gap_status_counts':status_counts,
            'accepted_evidence_count':accepted,'product_gate_count':len(gates),'product_gate_status_counts':gate_counts,
            'qualifying_exact_head_approvals':len(approvals),'current_exact_head_changes_requested':len(changes),
            'all_gaps_closed':False,'production_ready':False,'public_online':False,'nakama_retired':False,
          }
          formal['all_gaps_closed']=bool(formal['identity_stable'] and formal['producer_terminal_success']==len(producers) and formal['gaps_closed']==len(gaps) and len(gaps)>0 and accepted>0 and gates and all(r.get('status') in ('passed','accepted','closed') for r in gates) and len(approvals)>=2 and not changes)
          packet={'schema':'trillionnium.plan-v31-current-turn-settlement.v2','repository':repository,'pull_request':int(os.environ['TARGET_PR']),'identities':identities,'expected_identities':expected,'producer_results':records,'formal':formal,'qualifying_approvers':[(r.get('user') or {}).get('login') for r in approvals],'changes_requested_by':[(r.get('user') or {}).get('login') for r in changes],'claim_boundary':{'accepted_evidence':accepted>0,'all_gaps_closed':formal['all_gaps_closed'],'production_ready':False,'public_online':False,'nakama_retired':False}}
          Path(os.environ['RUNNER_TEMP'],'settlement','settlement-v2.json').write_text(json.dumps(packet,sort_keys=True,separators=(',',':'))+'\n')
          lines=['<!-- TRNM-PLAN-V31-CURRENT-TURN-SETTLEMENT-V2 -->','## Plan v3.1 complete current-wave settlement','',f"Exact tuple stable: `{str(formal['identity_stable']).lower()}`",f"Producer success/failure/active: `{formal['producer_terminal_success']}/{formal['producer_terminal_failure']}/{formal['producer_active_or_missing']}`",f"Formal gaps: `{formal['gaps_closed']}/{formal['gap_count']}` closed; `{formal['close_criteria_count']}` criteria",f"Accepted evidence: `{accepted}`",f"Current-head approvals/changes requested: `{len(approvals)}/{len(changes)}`",f"All gaps closed: `{str(formal['all_gaps_closed']).lower()}`",'','| Producer | Run | Conclusion | Artifacts |','| --- | ---: | --- | ---: |']
          for row in records: lines.append(f"| `{row['workflow']}` | {row.get('run_id') or 'missing'} | `{row.get('conclusion') or row.get('status')}` | {len(row.get('artifacts',[]))} |")
          lines+=['','The settlement is fail-closed. A source/test packet, administrator readback, review request or generated classification is not independent acceptance and does not grant compatibility, production, cutover or retirement authority.']
          body='\n'.join(lines)
          for issue in (os.environ['TARGET_PR'],os.environ['COMMAND_ISSUE']):
            _,comments=call('GET',f'/issues/{issue}/comments?per_page=100')
            old=next((r for r in reversed(comments) if '<!-- TRNM-PLAN-V31-CURRENT-TURN-SETTLEMENT-V2 -->' in (r.get('body') or '')),None)
            if old: call('PATCH',f"/issues/comments/{old['id']}",{'body':body})
            else: call('POST',f'/issues/{issue}/comments',{'body':body})
          if formal['producer_terminal_success']==len(producers) and formal['identity_stable']:
            call('POST',f"/pulls/{os.environ['TARGET_PR']}/requested_reviewers",{'reviewers':['Tomasrgbsf']},allowed=(422,))
          print(json.dumps(formal,sort_keys=True))
          PY
          sha256sum "$RUNNER_TEMP/settlement/settlement-v2.json" > "$RUNNER_TEMP/settlement/SHA256SUMS"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/plan-v31-settlement-v2.tar.gz" -C "$RUNNER_TEMP/settlement" settlement-v2.json SHA256SUMS

      - name: Fetch source and retain settlement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin "https://github.com/${TARGET_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD

      - name: Upload settlement
        id: retained
        uses: ./source/.github/actions/upload-evidence
        with:
          name: plan-v31-current-turn-settlement-v2-${{ env.EXPECTED_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan-v31-settlement-v2.tar.gz
          mime_type: application/gzip

      - name: Verify receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained.outputs.artifact_id }}'
          test -n '${{ steps.retained.outputs.sha256 }}'
          test '${{ steps.retained.outputs.size_bytes }}' -gt 0
