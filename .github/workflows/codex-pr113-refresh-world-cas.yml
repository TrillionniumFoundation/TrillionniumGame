name: codex-pr113-refresh-world-cas

on:
  push:
    branches:
      - ops/trusted-world-v13k-publisher-plan-v31-2026-09-08

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    if: github.repository == 'TrillionniumFoundation/TrillionniumGame'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_BRANCH: ops/trusted-world-v13k-publisher-plan-v31-2026-09-08
      BASE_SHA: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
      WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
      WORLD_BRANCH: fix/world-plan-v4-development-closure-20260831
      IMPORTER_COMMIT: d8ab3164cbd573e642d98fbfb626fe551574c7e5
      IMPORTER_BLOB_SHA1: 5c21773242423b083f87ee0924474754646065d0
      ARTIFACT_ID: '9780499701'
      ARTIFACT_SHA256: 456a181bdc8f8aa248229b044db9eec4f52572ea3b20bca6492907db58d64ef5
    steps:
      - name: Fetch exact refresh head and base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            fetch --no-tags origin "$GITHUB_SHA" "$BASE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$TARGET_BRANCH" "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" cat-file -t "$BASE_SHA")" = commit

      - name: Fetch pinned artifact and importer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/world-v13k-source-candidate.zip
          test "$(sha256sum /tmp/world-v13k-source-candidate.zip | awk '{print $1}')" = "$ARTIFACT_SHA256"
          curl --fail-with-body --location --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/${WORLD_REPOSITORY}/${IMPORTER_COMMIT}/scripts/import-qualified-world-v13k.py" \
            --output /tmp/import-qualified-world-v13k.py
          test "$(git hash-object /tmp/import-qualified-world-v13k.py)" = "$IMPORTER_BLOB_SHA1"
          python3 -m py_compile /tmp/import-qualified-world-v13k.py

      - name: Freeze current World head and derive exact overlay
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/codex-pr113-refresh-world-cas-r2.py

      - name: Materialize source-only final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/codex-pr113-refresh-world-cas.py
          rm -f scripts/codex-pr113-refresh-world-cas-r2.py
          rm -f scripts/codex-pr113-refresh-world-cas-trigger.txt
          rm -f .github/workflows/codex-pr113-refresh-world-cas.yml
          git add -A

      - name: Validate final three-file candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" --)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | sort > /tmp/observed-paths
          cat > /tmp/expected-paths <<'EOF'
          .github/workflows/world-command-deployed-runtime-v1.yml
          .github/world-publication-requests/world-v13k-2026-09-08.json
          docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json
          EOF
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/observed-paths
          expected_head="$(jq -r '.target.expected_head' .github/world-publication-requests/world-v13k-2026-09-08.json)"
          observed_head="$(git ls-remote "https://github.com/${WORLD_REPOSITORY}.git" "refs/heads/${WORLD_BRANCH}" | awk '{print $1}')"
          test "$observed_head" = "$expected_head"
          git diff --cached --check

      - name: Publish refreshed request without touching World
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "ProfHepta"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          test -n "$(git status --porcelain)"
          git commit -m "fix(world): refresh publication CAS and preserve target delta"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push origin "HEAD:refs/heads/$TARGET_BRANCH"
