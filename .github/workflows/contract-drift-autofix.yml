name: contract-drift-autofix

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29
    paths:
      - '.github/workflows/contract-drift-autofix.yml'

permissions:
  contents: write

concurrency:
  group: contract-drift-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BRANCH: feat/plan-v3-gap-closure-2026-08-29
      EXPECTED_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact feature head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install exact Rust formatter
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          rustup override set 1.85.1
          rustfmt --version
      - name: Format every authoritative Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          isolated=(
            crates/trnm-token-jwt-adapter/Cargo.toml
            crates/trnm-token-jwt-adapter-gate/Cargo.toml
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
            crates/trnm-presence-router-v2/Cargo.toml
            crates/trnm-server/Cargo.toml
            crates/trnm-persistence-runtime-policy/Cargo.toml
            crates/trnm-realtime-wire/Cargo.toml
            crates/trnm-storage-nakama-version/Cargo.toml
            crates/trnm-token-crypto-provider/Cargo.toml
            crates/trnm-token-jwt-provider-adapter/Cargo.toml
          )
          for manifest in "${isolated[@]}"; do
            cargo fmt --manifest-path "$manifest"
          done
          git diff --check
      - name: Recheck formatting and package coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-rust-package-inventory.py
          cargo fmt --all -- --check
          isolated=(
            crates/trnm-token-jwt-adapter/Cargo.toml
            crates/trnm-token-jwt-adapter-gate/Cargo.toml
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
            crates/trnm-presence-router-v2/Cargo.toml
            crates/trnm-server/Cargo.toml
            crates/trnm-persistence-runtime-policy/Cargo.toml
            crates/trnm-realtime-wire/Cargo.toml
            crates/trnm-storage-nakama-version/Cargo.toml
            crates/trnm-token-crypto-provider/Cargo.toml
            crates/trnm-token-jwt-provider-adapter/Cargo.toml
          )
          for manifest in "${isolated[@]}"; do
            cargo fmt --manifest-path "$manifest" -- --check
          done
      - name: Commit exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatter drift remains.'
            exit 0
          fi
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'style(rust): apply Rust 1.85.1 formatting'
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${BRANCH}"
