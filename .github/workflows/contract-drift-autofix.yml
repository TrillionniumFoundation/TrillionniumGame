name: contract-drift-autofix

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29
    paths:
      - '.github/workflows/contract-drift-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contract-drift-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BRANCH: feat/plan-v3-gap-closure-2026-08-29
      EXPECTED_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact feature head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          cd "$GITHUB_WORKSPACE"
      - name: Accept the current precise fail-closed adapter state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-world-transition-v1-boundary.sh')
          text = path.read_text(encoding='utf-8')
          old = '''if status.get("status") not in {
              "implemented_pending_exact_head_ci",
              "verified_remote",
          }:
          '''.replace('          ', '    ')
          new = '''if status.get("status") not in {
              "implemented_pending_exact_head_ci",
              "implemented_python_and_go_pending_exact_head_ci",
              "verified_remote",
          }:
          '''.replace('          ', '    ')
          if old not in text:
              raise SystemExit('expected adapter status enum block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify all four repaired contract groups
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/oracle/check-hook-inventory.sh
          bash scripts/check-remaining-denominators.sh
          bash scripts/check-sdk-denominator.sh
          bash scripts/check-world-transition-v1-boundary.sh
          bash scripts/test-world-transition-v1-boundary-negative.sh
          git diff --check
      - name: Commit verified contract correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat -- scripts/check-world-transition-v1-boundary.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-world-transition-v1-boundary.sh
          git commit -m 'fix(worldtransition): accept precise pending-CI status'
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${BRANCH}"
