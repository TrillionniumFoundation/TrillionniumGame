name: temporary-shared-process-metrics

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-shared-process-metrics
  cancel-in-progress: false

jobs:
  patch-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Apply shared process metrics and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path_text: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_text)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} anchors, found {count} for {old!r}"
                  )
              path.write_text(source.replace(old, new, expected), encoding="utf-8")

          app = "crates/trnm-persistence-pg/src/bin/trnm_server/app.rs"
          replace_exact(
              app,
              "use trnm_contracts::{\n",
              "use std::sync::atomic::{AtomicU64, Ordering};\n"
              "use std::sync::Arc;\n\n"
              "use trnm_contracts::{\n",
          )
          replace_exact(
              app,
              "use super::session_api::{SessionApi, SessionError};\n",
              "use super::session_api::{SessionApi, SessionError, SharedSessionMetrics};\n",
          )
          replace_exact(
              app,
              '''#[derive(Clone, Copy, Debug, Default, Eq, PartialEq)]
          struct Metrics {
              requests: u64,
              successes: u64,
              input_failures: u64,
              domain_failures: u64,
              bootstraps: u64,
              commands_applied: u64,
              command_replays: u64,
              drain_requests: u64,
          }

          impl Metrics {
              fn increment(value: &mut u64) {
                  *value = value.saturating_add(1);
              }
          }
          ''',
              '''#[derive(Debug, Default)]
          struct Metrics {
              requests: AtomicU64,
              successes: AtomicU64,
              input_failures: AtomicU64,
              domain_failures: AtomicU64,
              bootstraps: AtomicU64,
              commands_applied: AtomicU64,
              command_replays: AtomicU64,
              drain_requests: AtomicU64,
          }

          #[derive(Clone, Copy, Debug, Default, Eq, PartialEq)]
          struct MetricsSnapshot {
              requests: u64,
              successes: u64,
              input_failures: u64,
              domain_failures: u64,
              bootstraps: u64,
              commands_applied: u64,
              command_replays: u64,
              drain_requests: u64,
          }

          #[derive(Clone, Debug, Default)]
          pub(crate) struct SharedAppMetrics(Arc<Metrics>);

          impl SharedAppMetrics {
              fn increment(counter: &AtomicU64) {
                  counter.fetch_add(1, Ordering::Relaxed);
              }

              fn increment_requests(&self) {
                  Self::increment(&self.0.requests);
              }

              fn increment_successes(&self) {
                  Self::increment(&self.0.successes);
              }

              fn increment_input_failures(&self) {
                  Self::increment(&self.0.input_failures);
              }

              fn increment_domain_failures(&self) {
                  Self::increment(&self.0.domain_failures);
              }

              fn increment_bootstraps(&self) {
                  Self::increment(&self.0.bootstraps);
              }

              fn increment_commands_applied(&self) {
                  Self::increment(&self.0.commands_applied);
              }

              fn increment_command_replays(&self) {
                  Self::increment(&self.0.command_replays);
              }

              fn increment_drain_requests(&self) {
                  Self::increment(&self.0.drain_requests);
              }

              fn snapshot(&self) -> MetricsSnapshot {
                  MetricsSnapshot {
                      requests: self.0.requests.load(Ordering::Relaxed),
                      successes: self.0.successes.load(Ordering::Relaxed),
                      input_failures: self.0.input_failures.load(Ordering::Relaxed),
                      domain_failures: self.0.domain_failures.load(Ordering::Relaxed),
                      bootstraps: self.0.bootstraps.load(Ordering::Relaxed),
                      commands_applied: self.0.commands_applied.load(Ordering::Relaxed),
                      command_replays: self.0.command_replays.load(Ordering::Relaxed),
                      drain_requests: self.0.drain_requests.load(Ordering::Relaxed),
                  }
              }
          }
          ''',
          )
          replace_exact(app, "    metrics: Metrics,\n", "    metrics: SharedAppMetrics,\n")
          replace_exact(
              app,
              '''    pub fn new(repository: R, admin_token: String) -> Self {
                  Self {
                      repository,
                      admin_token,
                      sessions: SessionApi::default(),
                      draining: false,
                      metrics: Metrics::default(),
                  }
              }
          ''',
              '''    pub fn new(repository: R, admin_token: String) -> Self {
                  Self::with_shared_metrics(
                      repository,
                      admin_token,
                      SharedAppMetrics::default(),
                      SharedSessionMetrics::default(),
                  )
              }

              #[must_use]
              pub(crate) fn with_shared_metrics(
                  repository: R,
                  admin_token: String,
                  metrics: SharedAppMetrics,
                  session_metrics: SharedSessionMetrics,
              ) -> Self {
                  Self {
                      repository,
                      admin_token,
                      sessions: SessionApi::with_shared_metrics(session_metrics),
                      draining: false,
                      metrics,
                  }
              }
          ''',
          )
          replacements = {
              "Metrics::increment(&mut self.metrics.requests);": "self.metrics.increment_requests();",
              "Metrics::increment(&mut self.metrics.successes);": "self.metrics.increment_successes();",
              "Metrics::increment(&mut self.metrics.drain_requests);": "self.metrics.increment_drain_requests();",
              "Metrics::increment(&mut self.metrics.bootstraps);": "self.metrics.increment_bootstraps();",
              "Metrics::increment(&mut self.metrics.commands_applied);": "self.metrics.increment_commands_applied();",
              "Metrics::increment(&mut self.metrics.command_replays);": "self.metrics.increment_command_replays();",
              "Metrics::increment(&mut self.metrics.input_failures);": "self.metrics.increment_input_failures();",
              "Metrics::increment(&mut self.metrics.domain_failures);": "self.metrics.increment_domain_failures();",
          }
          for old, new in replacements.items():
              replace_exact(app, old, new)
          replace_exact(
              app,
              '''    fn metrics_response(&self) -> Response {
                  let ready = u8::from(!self.draining);
                  let repository = self.repository.operational_metrics();
          ''',
              '''    fn metrics_response(&self) -> Response {
                  let ready = u8::from(!self.draining);
                  let metrics = self.metrics.snapshot();
                  let repository = self.repository.operational_metrics();
          ''',
          )
          for field in (
              "requests",
              "successes",
              "input_failures",
              "domain_failures",
              "bootstraps",
              "commands_applied",
              "command_replays",
              "drain_requests",
          ):
              replace_exact(app, f"self.metrics.{field},", f"metrics.{field},")
          replace_exact(
              app,
              '''    #[test]
              fn admin_token_comparison_rejects_a_256_byte_length_delta() {
          ''',
              '''    #[test]
              fn shared_metrics_aggregate_across_app_instances() {
                  let token = token();
                  let metrics = SharedAppMetrics::default();
                  let sessions = SharedSessionMetrics::default();
                  let mut first = App::with_shared_metrics(
                      FakeRepository::default(),
                      token.clone(),
                      metrics.clone(),
                      sessions.clone(),
                  );
                  let mut second = App::with_shared_metrics(
                      FakeRepository::default(),
                      token.clone(),
                      metrics,
                      sessions,
                  );
                  let response = first.handle(&Request::new(
                      "POST",
                      "/v1/authority/commit",
                      headers(&token),
                      commit_body(),
                  ));
                  assert_eq!(response.status, 201);
                  let response = second.handle(&Request::new(
                      "GET",
                      "/metrics",
                      BTreeMap::new(),
                      Vec::new(),
                  ));
                  let body = String::from_utf8(response.body).unwrap();
                  assert!(body.contains("trnm_server_commands_applied_total 1"));
              }

              #[test]
              fn admin_token_comparison_rejects_a_256_byte_length_delta() {
          ''',
          )

          session = "crates/trnm-persistence-pg/src/bin/trnm_server/session_api.rs"
          replace_exact(
              session,
              "use std::time::{SystemTime, UNIX_EPOCH};\n",
              "use std::sync::atomic::{AtomicU64, Ordering};\n"
              "use std::sync::Arc;\n"
              "use std::time::{SystemTime, UNIX_EPOCH};\n",
          )
          replace_exact(
              session,
              '''#[derive(Debug, Default)]
          pub struct SessionApi {
              verifier: Option<AccessTokenVerifier>,
              metrics: SessionApiMetrics,
          }
          ''',
              '''#[derive(Debug, Default)]
          struct SessionMetricCounters {
              access_verified: AtomicU64,
              access_rejected: AtomicU64,
              refresh_rotated: AtomicU64,
              refresh_replay_revoked: AtomicU64,
              logout_revoked: AtomicU64,
          }

          #[derive(Clone, Debug, Default)]
          pub(crate) struct SharedSessionMetrics(Arc<SessionMetricCounters>);

          impl SharedSessionMetrics {
              fn increment(counter: &AtomicU64) {
                  counter.fetch_add(1, Ordering::Relaxed);
              }

              fn snapshot(&self) -> SessionApiMetrics {
                  SessionApiMetrics {
                      access_verified: self.0.access_verified.load(Ordering::Relaxed),
                      access_rejected: self.0.access_rejected.load(Ordering::Relaxed),
                      refresh_rotated: self.0.refresh_rotated.load(Ordering::Relaxed),
                      refresh_replay_revoked: self
                          .0
                          .refresh_replay_revoked
                          .load(Ordering::Relaxed),
                      logout_revoked: self.0.logout_revoked.load(Ordering::Relaxed),
                  }
              }
          }

          #[derive(Debug, Default)]
          pub struct SessionApi {
              verifier: Option<AccessTokenVerifier>,
              metrics: SharedSessionMetrics,
          }
          ''',
          )
          replace_exact(
              session,
              '''impl SessionApi {
              pub fn configure(&mut self, verifier: AccessTokenVerifier) {
          ''',
              '''impl SessionApi {
              pub(crate) fn with_shared_metrics(metrics: SharedSessionMetrics) -> Self {
                  Self {
                      verifier: None,
                      metrics,
                  }
              }

              pub fn configure(&mut self, verifier: AccessTokenVerifier) {
          ''',
          )
          replace_exact(
              session,
              '''    #[must_use]
              pub const fn metrics(&self) -> SessionApiMetrics {
                  self.metrics
              }
          ''',
              '''    #[must_use]
              pub fn metrics(&self) -> SessionApiMetrics {
                  self.metrics.snapshot()
              }
          ''',
          )
          session_replacements = {
              "increment(&mut self.metrics.refresh_rotated);": "SharedSessionMetrics::increment(&self.metrics.0.refresh_rotated);",
              "increment(&mut self.metrics.refresh_replay_revoked);": "SharedSessionMetrics::increment(&self.metrics.0.refresh_replay_revoked);",
              "increment(&mut self.metrics.logout_revoked);": "SharedSessionMetrics::increment(&self.metrics.0.logout_revoked);",
              "increment(&mut self.metrics.access_verified);": "SharedSessionMetrics::increment(&self.metrics.0.access_verified);",
              "increment(&mut self.metrics.access_rejected);": "SharedSessionMetrics::increment(&self.metrics.0.access_rejected);",
          }
          for old, new in session_replacements.items():
              replace_exact(session, old, new)
          replace_exact(
              session,
              '''fn increment(value: &mut u64) {
              *value = value.saturating_add(1);
          }

          ''',
              "",
          )

          retry = "crates/trnm-persistence-pg/src/bin/trnm_server/retry.rs"
          replace_exact(
              retry,
              "#[derive(Debug)]\npub struct RetryingRepository<R> {\n",
              "#[derive(Clone, Debug)]\npub struct RetryingRepository<R> {\n",
          )

          server = "crates/trnm-persistence-pg/src/bin/trnm_server/server.rs"
          replace_exact(
              server,
              "use super::app::{App, Repository};\n",
              "use super::app::{App, Repository, SharedAppMetrics};\n",
          )
          replace_exact(
              server,
              "use super::retry::{RetryPolicy, RetryingRepository};\n",
              "use super::retry::{RetryPolicy, RetryingRepository};\n"
              "use super::session_api::SharedSessionMetrics;\n",
          )
          replace_exact(
              server,
              '''    let worker_failed = Arc::new(AtomicBool::new(false));
              let mut workers = Vec::with_capacity(worker_count);

              for worker_index in 0..worker_count {
                  let worker_repository =
                      RetryingRepository::new(repository.clone(), RetryPolicy::candidate_default())?;
          ''',
              '''    let worker_failed = Arc::new(AtomicBool::new(false));
              let metrics = SharedAppMetrics::default();
              let session_metrics = SharedSessionMetrics::default();
              let retrying_repository =
                  RetryingRepository::new(repository, RetryPolicy::candidate_default())?;
              let mut workers = Vec::with_capacity(worker_count);

              for worker_index in 0..worker_count {
                  let worker_repository = retrying_repository.clone();
          ''',
          )
          replace_exact(
              server,
              '''        let worker_failed = Arc::clone(&worker_failed);
              workers.push(
          ''',
              '''        let worker_failed = Arc::clone(&worker_failed);
              let worker_metrics = metrics.clone();
              let worker_session_metrics = session_metrics.clone();
              workers.push(
          ''',
          )
          replace_exact(
              server,
              '''                            worker_receiver,
                                      worker_draining,
                                  );
          ''',
              '''                            worker_receiver,
                                      worker_draining,
                                      worker_metrics,
                                      worker_session_metrics,
                                  );
          ''',
          )
          replace_exact(
              server,
              '''    receiver: Arc<Mutex<Receiver<TcpStream>>>,
              draining: Arc<AtomicBool>,
          ) where
          ''',
              '''    receiver: Arc<Mutex<Receiver<TcpStream>>>,
              draining: Arc<AtomicBool>,
              metrics: SharedAppMetrics,
              session_metrics: SharedSessionMetrics,
          ) where
          ''',
          )
          replace_exact(
              server,
              '''    let mut app = App::new(repository, config.admin_token.clone());
          ''',
              '''    let mut app = App::with_shared_metrics(
                  repository,
                  config.admin_token.clone(),
                  metrics,
                  session_metrics,
              );
          ''',
          )

          temporary = Path(".github/workflows/temporary-shared-process-metrics.yml")
          if not temporary.is_file():
              raise SystemExit("temporary workflow is missing")
          temporary.unlink()
          PY
          test ! -e .github/workflows/temporary-shared-process-metrics.yml
          git diff --check

      - name: Validate exact source corpus
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit verified clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-shared-process-metrics.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(server): aggregate metrics across concurrent workers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
