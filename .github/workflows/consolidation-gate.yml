name: Repository consolidation gate

on:
  push:
    branches:
      - integration/all-branches-main-v1
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-consolidation-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  INTEGRATION_BRANCH: integration/all-branches-main-v1

jobs:
  source-and-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out consolidation head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup default 1.85.1
          rustc --version --verbose
          cargo --version --verbose
          go version
          python3 --version

      - name: Prove every development branch is an ancestor
        shell: bash
        run: |
          set -euo pipefail
          evidence=consolidation-evidence/source
          mkdir -p "$evidence"
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'
          git rev-parse HEAD > "$evidence/commit-before-materialization.txt"
          git rev-parse HEAD^{tree} > "$evidence/tree-before-materialization.txt"
          : > "$evidence/branches.tsv"
          : > "$evidence/non-ancestor-branches.txt"
          while IFS= read -r ref; do
            branch=${ref#refs/remotes/origin/}
            [[ "$branch" == 'HEAD' ]] && continue
            sha=$(git rev-parse "$ref")
            if [[ "$branch" == "$INTEGRATION_BRANCH" || "$branch" == 'main' ]]; then
              relation=self-or-target
            elif git merge-base --is-ancestor "$sha" HEAD; then
              relation=ancestor
            else
              relation=NOT_ANCESTOR
              printf '%s\t%s\n' "$branch" "$sha" \
                >> "$evidence/non-ancestor-branches.txt"
            fi
            printf '%s\t%s\t%s\n' "$branch" "$sha" "$relation" \
              >> "$evidence/branches.tsv"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)
          test ! -s "$evidence/non-ancestor-branches.txt"

      - name: Materialize unified workspace deterministically
        shell: bash
        run: |
          set -euo pipefail
          evidence=consolidation-evidence/materialization
          mkdir -p "$evidence"
          cargo generate-lockfile \
            > "$evidence/cargo-generate-lockfile.log" 2>&1
          cargo fmt --all \
            > "$evidence/root-cargo-fmt.log" 2>&1
          isolated=(
            crates/trnm-token-jwt-adapter/Cargo.toml
            crates/trnm-token-jwt-adapter-gate/Cargo.toml
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
            crates/trnm-presence-router-v2/Cargo.toml
          )
          for manifest in "${isolated[@]}"; do
            label=$(basename "$(dirname "$manifest")")
            cargo fmt --manifest-path "$manifest" \
              > "$evidence/${label}-cargo-fmt.log" 2>&1
          done
          git diff --binary -- . ':(exclude)consolidation-evidence' \
            > "$evidence/materialization.patch"
          git diff --name-only -- . ':(exclude)consolidation-evidence' \
            > "$evidence/materialized-files.txt"
          git diff --check -- . ':(exclude)consolidation-evidence'

      - name: Validate root Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          evidence=consolidation-evidence/rust-root
          mkdir -p "$evidence"
          cargo fmt --all -- --check \
            > "$evidence/cargo-fmt-check.log" 2>&1
          cargo test --workspace --all-targets --locked \
            2>&1 | tee "$evidence/cargo-test.log"
          cargo clippy --workspace --all-targets --locked -- -D warnings \
            2>&1 | tee "$evidence/cargo-clippy.log"

      - name: Validate isolated Rust compatibility workspaces
        shell: bash
        run: |
          set -euo pipefail
          evidence=consolidation-evidence/rust-isolated
          mkdir -p "$evidence"
          isolated=(
            crates/trnm-token-jwt-adapter/Cargo.toml
            crates/trnm-token-jwt-adapter-gate/Cargo.toml
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
            crates/trnm-presence-router-v2/Cargo.toml
          )
          for manifest in "${isolated[@]}"; do
            label=$(basename "$(dirname "$manifest")")
            cargo fmt --manifest-path "$manifest" -- --check \
              > "$evidence/${label}-fmt.log" 2>&1
            cargo test --manifest-path "$manifest" --all-targets --locked \
              2>&1 | tee "$evidence/${label}-test.log"
            cargo clippy --manifest-path "$manifest" --all-targets --locked \
              -- -D warnings 2>&1 | tee "$evidence/${label}-clippy.log"
          done

      - name: Validate plan, contracts and Python reference implementations
        shell: bash
        run: |
          set -euo pipefail
          evidence=consolidation-evidence/python
          mkdir -p "$evidence"
          python3 -m compileall -q scripts tests tools
          python3 scripts/check-plan.py \
            2>&1 | tee "$evidence/check-plan.log"
          python3 scripts/check-rust-foundation.py \
            2>&1 | tee "$evidence/check-rust-foundation.log"
          python3 scripts/check-storage-core.py \
            2>&1 | tee "$evidence/check-storage-core.log"
          python3 scripts/check-persistence-core.py \
            2>&1 | tee "$evidence/check-persistence-core.log"
          python3 scripts/check-foundation-schema.py \
            2>&1 | tee "$evidence/check-foundation-schema.log"
          python3 scripts/check-database-v2.py \
            2>&1 | tee "$evidence/check-database-v2.log"
          python3 scripts/check-pgwire-persistence-adapter.py \
            2>&1 | tee "$evidence/check-pgwire-adapter.log"
          python3 scripts/test-canonical-framing.py \
            2>&1 | tee "$evidence/test-canonical-framing.log"
          python3 scripts/check-transport-core.py \
            2>&1 | tee "$evidence/check-transport-core.log"
          python3 scripts/check-token-core.py \
            2>&1 | tee "$evidence/check-token-core.log"
          python3 scripts/check-presence-core.py \
            2>&1 | tee "$evidence/check-presence-core.log"
          python3 scripts/verify-presence-router-v2.py \
            2>&1 | tee "$evidence/verify-presence-router-v2.log"
          python3 scripts/check-query-core.py \
            2>&1 | tee "$evidence/check-query-core.log"
          python3 -m unittest discover -s tests -p 'test_*.py' \
            2>&1 | tee "$evidence/unittest-discover.log"
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('.').rglob('*.json')):
              if '.git' in path.parts or 'target' in path.parts:
                  continue
              json.loads(path.read_text(encoding='utf-8'))
          PY
          find scripts -type f -name '*.sh' -print0 \
            | sort -z | xargs -0 -n1 bash -n

      - name: Validate deployed World runtime
        working-directory: runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../consolidation-evidence/go
          go test -mod=readonly ./... \
            2>&1 | tee ../consolidation-evidence/go/go-test.log

      - name: Commit deterministic materialization
        if: github.ref_name == env.INTEGRATION_BRANCH
        shell: bash
        run: |
          set -euo pipefail
          evidence=consolidation-evidence/materialization
          if git diff --quiet -- . ':(exclude)consolidation-evidence'; then
            printf 'clean\n' > "$evidence/result.txt"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock crates
            git commit -m 'build(consolidation): materialize unified workspace'
            git push origin HEAD:"$INTEGRATION_BRANCH"
            printf 'committed\n' > "$evidence/result.txt"
          fi
          git rev-parse HEAD > "$evidence/validated-commit.txt"
          git rev-parse HEAD^{tree} > "$evidence/validated-tree.txt"
          remote=$(git ls-remote origin "refs/heads/$INTEGRATION_BRANCH" | awk '{print $1}')
          test "$remote" = "$(git rev-parse HEAD)"

      - name: Seal static evidence
        if: always()
        shell: bash
        run: |
          mkdir -p consolidation-evidence
          find consolidation-evidence -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum \
            > consolidation-evidence/SHA256SUMS || true

      - name: Upload static consolidation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-consolidation-static-${{ github.run_id }}
          path: consolidation-evidence
          if-no-files-found: error
          retention-days: 30

  postgresql-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out consolidation head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Execute PostgreSQL live persistence contract
        shell: bash
        run: |
          set -euo pipefail
          TRNM_EVIDENCE_ROOT=consolidation-evidence/pgwire \
            bash scripts/ci-pgwire-persistence-adapter.sh postgresql
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-consolidation-postgresql-${{ github.run_id }}
          path: consolidation-evidence
          if-no-files-found: error
          retention-days: 30

  cockroachdb-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out consolidation head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Execute CockroachDB live persistence contract
        shell: bash
        run: |
          set -euo pipefail
          TRNM_EVIDENCE_ROOT=consolidation-evidence/pgwire \
            bash scripts/ci-pgwire-persistence-adapter.sh cockroachdb
      - name: Upload CockroachDB evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-consolidation-cockroachdb-${{ github.run_id }}
          path: consolidation-evidence
          if-no-files-found: error
          retention-days: 30

  all-gates:
    if: always()
    needs:
      - source-and-static
      - postgresql-live
      - cockroachdb-live
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce all consolidation gates
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.source-and-static.result }}
          POSTGRESQL_RESULT: ${{ needs.postgresql-live.result }}
          COCKROACHDB_RESULT: ${{ needs.cockroachdb-live.result }}
        run: |
          set -euo pipefail
          printf 'static=%s\npostgresql=%s\ncockroachdb=%s\n' \
            "$STATIC_RESULT" "$POSTGRESQL_RESULT" "$COCKROACHDB_RESULT"
          test "$STATIC_RESULT" = success
          test "$POSTGRESQL_RESULT" = success
          test "$COCKROACHDB_RESULT" = success
