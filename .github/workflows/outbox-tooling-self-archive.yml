name: outbox-tooling-self-archive

on:
  push:
    branches: [tooling/outbox-evidence-sealing-2026-09-07]
    paths:
      - '.github/workflows/outbox-tooling-self-archive.yml'

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  archive-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: tooling/outbox-evidence-sealing-2026-09-07
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require successful siblings, archive exact tip, then delete branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]
          branch = os.environ["BRANCH"]
          own_run = int(os.environ["GITHUB_RUN_ID"])
          own_sha = os.environ["GITHUB_SHA"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trillionnium-tooling-self-archive",
          }

          def request(method, url, payload=None, accepted=(200, 201, 202, 204)):
              raw = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=raw, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      value = json.loads(body.decode("utf-8")) if body else None
                      if response.status not in accepted:
                          raise RuntimeError(f"unexpected HTTP {response.status}: {url}")
                      return response.status, value
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {error.code} {method} {url}: {detail[:1000]}") from error

          _, ref = request(
              "GET", f"{api}/git/ref/heads/{urllib.parse.quote(branch, safe='')}"
          )
          if ref["object"]["sha"] != own_sha:
              raise SystemExit("tooling branch moved after this workflow started")

          _, pulls = request(
              "GET",
              f"{api}/pulls?state=open&head={urllib.parse.quote(repository.split('/')[0] + ':' + branch)}&per_page=10",
          )
          if pulls:
              raise SystemExit("tooling branch still backs an open pull request")

          deadline = time.time() + 720
          siblings = []
          while True:
              _, payload = request(
                  "GET",
                  f"{api}/actions/runs?head_sha={own_sha}&per_page=100",
              )
              siblings = [
                  run
                  for run in payload.get("workflow_runs", [])
                  if int(run.get("id") or 0) != own_run
              ]
              active = [run for run in siblings if run.get("status") != "completed"]
              if not active:
                  break
              if time.time() >= deadline:
                  raise SystemExit("sibling workflows did not become terminal")
              time.sleep(15)

          bad = [
              {
                  "id": run.get("id"),
                  "name": run.get("name"),
                  "conclusion": run.get("conclusion"),
              }
              for run in siblings
              if run.get("conclusion") != "success"
          ]
          if bad:
              raise SystemExit(f"non-success sibling workflows prevent cleanup: {bad}")

          tag = f"archive/tooling/outbox-evidence-sealing-2026-09-07/{own_sha[:12]}"
          try:
              request(
                  "POST",
                  f"{api}/git/refs",
                  {"ref": f"refs/tags/{tag}", "sha": own_sha},
                  accepted=(201,),
              )
          except RuntimeError as error:
              # Existing tag is acceptable only when it resolves to this exact commit.
              _, existing = request(
                  "GET", f"{api}/git/ref/tags/{urllib.parse.quote(tag, safe='')}"
              )
              if existing["object"]["sha"] != own_sha:
                  raise error

          request(
              "DELETE",
              f"{api}/git/refs/heads/{urllib.parse.quote(branch, safe='')}",
              accepted=(204,),
          )
          print(
              json.dumps(
                  {
                      "archived": tag,
                      "sha": own_sha,
                      "sibling_runs": len(siblings),
                      "branch_deleted": True,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
          )
          PY
