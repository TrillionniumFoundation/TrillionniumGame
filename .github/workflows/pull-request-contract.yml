name: pull-request-contract

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pull-request-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-pr-body:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Materialize untrusted PR body as data
        run: |
          set -euo pipefail
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > pull-request-body.md
          jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH" > pull-request-draft.txt
      - name: Validate exact identity and claim boundary
        run: |
          set -euo pipefail
          tree=$(git show -s --format=%T "$CANDIDATE_SHA")
          python3 scripts/check-pull-request-contract.py \
            --body-file pull-request-body.md \
            --head "$CANDIDATE_SHA" \
            --tree "$tree" \
            --draft "$(cat pull-request-draft.txt)" \
            | tee pull-request-contract.json
          jq -e '
            .claims.compatibility_credit == false and
            .claims.production_ready == false and
            (
              (.draft == true and .claims.merge_ready == false) or
              (.draft == false and .claims.merge_ready == true)
            )
          ' pull-request-contract.json >/dev/null
