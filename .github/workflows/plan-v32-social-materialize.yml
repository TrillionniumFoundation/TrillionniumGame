name: plan-v32-social-materialize

on:
  push:
    branches:
      - feature/plan-v32-social-core-20260910

permissions:
  contents: write

concurrency:
  group: plan-v32-social-materialize
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch the exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$GITHUB_WORKSPACE" config --local \
            http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "+${GITHUB_REF}:${GITHUB_REF}"
          git -C "$GITHUB_WORKSPACE" checkout -B "${GITHUB_REF_NAME}" \
            "${GITHUB_REF}"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Apply the exact social control-plane registration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          patch='tools/plan-v32-social-existing.patch'
          test -f "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = \
            '77a95cf5373b1fb2da73f7f58a66ef98a9716d5283a79f840fbc236f8c652dcc'
          git apply --check "$patch"
          git apply "$patch"
          rm -f "$patch" .github/workflows/plan-v32-social-materialize.yml

      - name: Validate the clean source candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --package trnm-social-core --all-targets --locked
          cargo clippy --package trnm-social-core --all-targets --locked -- -D warnings
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-rust-foundation.py
          python3 scripts/check-workspace-convergence.py
          python3 -m unittest \
            tests.control_plane.test_documentation_authority -v
          git diff --check
          test ! -e tools/plan-v32-social-existing.patch
          test ! -e .github/workflows/plan-v32-social-materialize.yml

      - name: Commit and push the clean candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'social: register and validate bounded social core'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:${GITHUB_REF}"
