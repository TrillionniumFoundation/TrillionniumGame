name: plan-v32-social-materialize

on:
  push:
    branches:
      - feature/plan-v32-social-core-20260910

permissions:
  contents: write

concurrency:
  group: plan-v32-social-materialize
  cancel-in-progress: false

jobs:
  materialize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch the exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$GITHUB_WORKSPACE" config --local \
            http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "+${GITHUB_REF}:${GITHUB_REF}"
          git -C "$GITHUB_WORKSPACE" checkout -B "${GITHUB_REF_NAME}" \
            "${GITHUB_REF}"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Register the social package in machine authority
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          from typing import Any

          def read_json(path: str) -> dict[str, Any]:
              value = json.loads(Path(path).read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"{path}: top-level JSON object required")
              return value

          def write_json(path: str, value: dict[str, Any]) -> None:
              Path(path).write_text(
                  json.dumps(value, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} replacement sites, observed {count}"
                  )
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "Cargo.toml",
              '  "crates/trnm-identity-core",\n  "crates/trnm-storage-core",',
              '  "crates/trnm-identity-core",\n  "crates/trnm-social-core",\n  "crates/trnm-storage-core",',
          )

          authority_path = "docs/development/RUST_PACKAGE_AUTHORITY.json"
          authority = read_json(authority_path)
          members = authority["workspace"]["members"]
          if "crates/trnm-social-core" in members:
              raise SystemExit("social package is already registered")
          members.insert(members.index("crates/trnm-identity-core") + 1, "crates/trnm-social-core")
          write_json(authority_path, authority)

          registry_path = "docs/status/MODULE_DOCUMENTATION.json"
          registry = read_json(registry_path)
          modules = registry["modules"]
          if any(row.get("id") == "trnm-social-core" for row in modules):
              raise SystemExit("social module is already documented")
          row = {
              "id": "trnm-social-core",
              "path": "crates/trnm-social-core",
              "manifest": "crates/trnm-social-core/Cargo.toml",
              "documentation": "crates/trnm-social-core/README.md",
              "workspace": "root",
              "lifecycle": "product-library",
              "maturity": "social-domain-source-candidate",
              "owner_role": "social",
              "authority": "bounded social graph, group, chat and notification state machine",
              "blocking_gaps": [
                  "GAP-P0-SERVER-001",
                  "GAP-P0-DATA-001",
                  "GAP-P0-SCOPE-001",
                  "GAP-P1-REVIEW-001",
              ],
              "claim_credit": False,
          }
          identity_index = next(
              index for index, current in enumerate(modules)
              if current.get("id") == "trnm-identity-core"
          )
          modules.insert(identity_index + 1, row)
          summary = registry["summary"]
          summary["module_count"] = len(modules)
          summary["documented_count"] = len(modules)
          summary["root_workspace_count"] = sum(
              item.get("workspace") == "root" for item in modules
          )
          summary["isolated_workspace_count"] = sum(
              item.get("workspace") == "isolated" for item in modules
          )
          summary["undocumented_count"] = 0
          write_json(registry_path, registry)

          current_state_path = "docs/status/CURRENT_STATE.json"
          current_state = read_json(current_state_path)
          implementation = current_state["implementation"]
          if "social_core_source_candidate" in implementation:
              raise SystemExit("social current-state marker already exists")
          implementation["social_core_source_candidate"] = True
          write_json(current_state_path, current_state)

          inventory_path = "docs/status/IMPLEMENTATION_INVENTORY.json"
          inventory = read_json(inventory_path)
          components = inventory["components"]
          if any(item.get("id") == "COMP-SOCIAL-CORE" for item in components):
              raise SystemExit("social implementation inventory already exists")
          component = {
              "id": "COMP-SOCIAL-CORE",
              "path": "crates/trnm-social-core",
              "kind": "rust-library",
              "workstreams": ["W5", "W6"],
              "status": "social-domain-source-candidate",
              "implemented": [
                  "typed registered-user and social command identities",
                  "exact command receipt replay and changed-fingerprint rejection",
                  "friend request acceptance removal block and unblock transitions",
                  "bounded deterministic friend keyset pagination",
                  "group creation join approval roles leave ban and unban transitions",
                  "contiguous bounded group-chat sequence and scoped cursor model",
                  "bounded ordered notification create read delete and pagination state",
                  "post-commit outbox intent identities derived from command and ordinal",
                  "finite profile limits and whole-state invariant validation",
                  "payload-bearing debug output redacted to byte length",
              ],
              "missing": [
                  "complete users search import and public profile semantics",
                  "public HTTP gRPC gateway and complete RTAPI adapters",
                  "direct room and channel chat plus distributed presence integration",
                  "durable PostgreSQL and CockroachDB repositories and migrations",
                  "outbox worker delivery restart reconnect and response-loss evidence",
                  "complete denominator leaf mapping and official SDK oracle differential",
                  "conflict-free protocol data-integrity realtime security review",
              ],
              "blocking_gaps": [
                  "GAP-P0-SERVER-001",
                  "GAP-P0-DATA-001",
                  "GAP-P0-SCOPE-001",
                  "GAP-P1-REVIEW-001",
              ],
              "parity_ids": [],
              "evidence_ids": [],
              "claim_credit": False,
          }
          identity_component = next(
              index for index, item in enumerate(components)
              if item.get("id") == "COMP-IDENTITY-CORE"
          )
          components.insert(identity_component + 1, component)
          write_json(inventory_path, inventory)

          replace_exact(
              "scripts/check-rust-foundation.py",
              '    "crates/trnm-identity-core",\n    "crates/trnm-session-core",',
              '    "crates/trnm-identity-core",\n    "crates/trnm-social-core",\n    "crates/trnm-session-core",',
              expected=2,
          )
          replace_exact(
              "scripts/check-rust-foundation.py",
              " 'crates/trnm-identity-core': {},\n 'crates/trnm-persistence-core':",
              " 'crates/trnm-identity-core': {},\n 'crates/trnm-social-core': {'trnm-identity-core': {'path': '../trnm-identity-core'}},\n 'crates/trnm-persistence-core':",
          )
          replace_exact(
              "scripts/check-workspace-convergence.py",
              '    "trnm-identity-core",\n    "trnm-session-core",',
              '    "trnm-identity-core",\n    "trnm-social-core",\n    "trnm-session-core",',
          )
          replace_exact(
              "tests/control_plane/test_documentation_authority.py",
              'self.assertEqual(result["module_document_count"], 22)',
              'self.assertEqual(result["module_document_count"], 23)',
          )
          PY
          rm -f \
            tools/plan-v32-social-existing.patch \
            .github/workflows/plan-v32-social-materialize.yml
          git add -A

      - name: Format social source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Resolve lock and compile social core
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo check --package trnm-social-core

      - name: Execute social core tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo test --package trnm-social-core --all-targets --locked

      - name: Execute social core strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo clippy --package trnm-social-core --all-targets --locked -- -D warnings

      - name: Validate documentation authority
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/check-documentation-authority.py

      - name: Validate Rust package authority
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/check-rust-foundation.py

      - name: Validate workspace convergence
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/check-workspace-convergence.py

      - name: Execute documentation authority regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 -m unittest tests.control_plane.test_documentation_authority -v

      - name: Validate clean candidate diff
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git diff --check
          test ! -e tools/plan-v32-social-existing.patch
          test ! -e .github/workflows/plan-v32-social-materialize.yml

      - name: Commit and push the clean candidate
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'social: register and validate bounded social core'
          git push origin "HEAD:${GITHUB_REF}"
