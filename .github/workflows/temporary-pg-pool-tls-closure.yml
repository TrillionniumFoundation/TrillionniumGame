name: temporary-pg-pool-tls-closure

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: trillionnium-plan-v3-single-writer
  cancel-in-progress: false

jobs:
  implement-prove-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch quiet exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          sleep 75
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -f crates/trnm-persistence-pg/src/deadline.rs
          test -f .github/workflows/pg-query-deadline.yml

      - name: Add reloadable TLS pool generation
        shell: bash
        run: |
          set -euo pipefail
          cat > crates/trnm-persistence-pg/src/reloadable_pool.rs <<'RUST'
          use std::fmt;
          use std::fs;
          use std::path::{Path, PathBuf};
          use std::sync::atomic::{AtomicU64, Ordering};
          use std::sync::{Arc, RwLock};

          use trnm_contracts::{DomainError, RetryClass, StableCode};

          use super::{
              DatabaseProfile, PgPool, PgPoolConfig, PgPoolSnapshot, PgRepository, PgTlsConfig,
          };

          #[derive(Clone, Eq, PartialEq)]
          pub struct PgTlsFileSet {
              root_certificate_pem: Option<PathBuf>,
              identity_certificate_chain_pem: Option<PathBuf>,
              identity_private_key_pkcs8_pem: Option<PathBuf>,
          }

          impl PgTlsFileSet {
              pub fn new(
                  root_certificate_pem: Option<PathBuf>,
                  identity_certificate_chain_pem: Option<PathBuf>,
                  identity_private_key_pkcs8_pem: Option<PathBuf>,
              ) -> Result<Self, DomainError> {
                  if identity_certificate_chain_pem.is_some()
                      != identity_private_key_pkcs8_pem.is_some()
                  {
                      return Err(invalid(
                          "database_tls_identity_cert_key_pair_required",
                      ));
                  }
                  for path in [
                      root_certificate_pem.as_deref(),
                      identity_certificate_chain_pem.as_deref(),
                      identity_private_key_pkcs8_pem.as_deref(),
                  ]
                  .into_iter()
                  .flatten()
                  {
                      validate_path(path)?;
                  }
                  Ok(Self {
                      root_certificate_pem,
                      identity_certificate_chain_pem,
                      identity_private_key_pkcs8_pem,
                  })
              }

              fn load(&self) -> Result<PgTlsConfig, DomainError> {
                  PgTlsConfig::new(
                      read_optional(self.root_certificate_pem.as_deref())?,
                      read_optional(self.identity_certificate_chain_pem.as_deref())?,
                      read_optional(self.identity_private_key_pkcs8_pem.as_deref())?,
                  )
              }
          }

          impl fmt::Debug for PgTlsFileSet {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_struct("PgTlsFileSet")
                      .field(
                          "custom_root_certificate",
                          &self.root_certificate_pem.is_some(),
                      )
                      .field(
                          "client_identity",
                          &self.identity_certificate_chain_pem.is_some(),
                      )
                      .field("paths", &"<redacted>")
                      .finish()
              }
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct ReloadablePgPoolSnapshot {
              pub generation: u64,
              pub pool: PgPoolSnapshot,
          }

          pub struct ReloadablePgPool {
              database_url: String,
              profile: DatabaseProfile,
              policy: PgPoolConfig,
              files: PgTlsFileSet,
              current: RwLock<Arc<PgPool>>,
              generation: AtomicU64,
          }

          impl ReloadablePgPool {
              pub fn connect_tls(
                  database_url: String,
                  profile: DatabaseProfile,
                  policy: PgPoolConfig,
                  files: PgTlsFileSet,
              ) -> Result<Self, DomainError> {
                  if database_url.is_empty() || database_url.len() > 4096 {
                      return Err(invalid("database_url_invalid"));
                  }
                  let pool = build_verified_pool(&database_url, profile, policy, &files)?;
                  Ok(Self {
                      database_url,
                      profile,
                      policy,
                      files,
                      current: RwLock::new(Arc::new(pool)),
                      generation: AtomicU64::new(1),
                  })
              }

              pub fn acquire(&self) -> Result<PgRepository, DomainError> {
                  let pool = self
                      .current
                      .read()
                      .map_err(|_| data_loss("database_pool_generation_lock_poisoned"))?
                      .clone();
                  pool.acquire()
              }

              pub fn reload_tls(&self) -> Result<ReloadablePgPoolSnapshot, DomainError> {
                  let candidate = build_verified_pool(
                      &self.database_url,
                      self.profile,
                      self.policy,
                      &self.files,
                  )?;
                  let mut current = self
                      .current
                      .write()
                      .map_err(|_| data_loss("database_pool_generation_lock_poisoned"))?;
                  let generation = self
                      .generation
                      .load(Ordering::Acquire)
                      .checked_add(1)
                      .ok_or_else(|| data_loss("database_pool_generation_overflow"))?;
                  *current = Arc::new(candidate);
                  self.generation.store(generation, Ordering::Release);
                  let pool = current.snapshot();
                  Ok(ReloadablePgPoolSnapshot { generation, pool })
              }

              pub fn snapshot(&self) -> Result<ReloadablePgPoolSnapshot, DomainError> {
                  let current = self
                      .current
                      .read()
                      .map_err(|_| data_loss("database_pool_generation_lock_poisoned"))?;
                  Ok(ReloadablePgPoolSnapshot {
                      generation: self.generation.load(Ordering::Acquire),
                      pool: current.snapshot(),
                  })
              }
          }

          impl fmt::Debug for ReloadablePgPool {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_struct("ReloadablePgPool")
                      .field("database_url", &"<redacted>")
                      .field("profile", &self.profile)
                      .field("policy", &self.policy)
                      .field("files", &self.files)
                      .field("generation", &self.generation.load(Ordering::Acquire))
                      .finish_non_exhaustive()
              }
          }

          fn build_verified_pool(
              database_url: &str,
              profile: DatabaseProfile,
              policy: PgPoolConfig,
              files: &PgTlsFileSet,
          ) -> Result<PgPool, DomainError> {
              let tls = files.load()?;
              let pool = PgPool::connect_tls(database_url, profile, policy, &tls)?;
              drop(pool.acquire()?);
              Ok(pool)
          }

          fn validate_path(path: &Path) -> Result<(), DomainError> {
              let value = path
                  .to_str()
                  .ok_or_else(|| invalid("database_tls_path_invalid"))?;
              if value.is_empty()
                  || value.len() > 4096
                  || value.bytes().any(|byte| byte.is_ascii_control())
              {
                  return Err(invalid("database_tls_path_invalid"));
              }
              Ok(())
          }

          fn read_optional(path: Option<&Path>) -> Result<Option<Vec<u8>>, DomainError> {
              path.map(|path| {
                  fs::read(path)
                      .map_err(|_| operational("database_tls_material_read_failed"))
              })
              .transpose()
          }

          fn invalid(reason: &'static str) -> DomainError {
              DomainError::new(StableCode::InvalidArgument, reason, RetryClass::Never)
          }

          fn operational(reason: &'static str) -> DomainError {
              DomainError::new(
                  StableCode::Unavailable,
                  reason,
                  RetryClass::SafeBackoff,
              )
          }

          fn data_loss(reason: &'static str) -> DomainError {
              DomainError::new(StableCode::DataLoss, reason, RetryClass::Never)
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn identity_paths_are_all_or_nothing_and_debug_is_redacted() {
                  let error = PgTlsFileSet::new(
                      None,
                      Some(PathBuf::from("client.pem")),
                      None,
                  )
                  .unwrap_err();
                  assert_eq!(
                      error.reason(),
                      "database_tls_identity_cert_key_pair_required"
                  );
                  let files = PgTlsFileSet::new(
                      Some(PathBuf::from("root.pem")),
                      None,
                      None,
                  )
                  .unwrap();
                  let debug = format!("{files:?}");
                  assert!(debug.contains("<redacted>"));
                  assert!(!debug.contains("root.pem"));
              }

              #[test]
              fn missing_material_fails_without_building_a_pool() {
                  let files = PgTlsFileSet::new(
                      Some(PathBuf::from("/definitely/missing/trnm-root.pem")),
                      None,
                      None,
                  )
                  .unwrap();
                  assert_eq!(
                      files.load().unwrap_err().reason(),
                      "database_tls_material_read_failed"
                  );
              }
          }
          RUST

          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path('.')
          lib = root / 'crates/trnm-persistence-pg/src/lib.rs'
          source = lib.read_text(encoding='utf-8')
          if 'mod reloadable_pool;' not in source:
              anchor = 'mod deadline;\n'
              if anchor not in source:
                  raise SystemExit(f'{lib}: deadline module anchor missing')
              source = source.replace(anchor, anchor + 'mod reloadable_pool;\n', 1)
          if 'pub use reloadable_pool::' not in source:
              anchor = 'pub use deadline::{PgDeadlinePolicy, PgDeadlineReport};\n\n'
              if anchor not in source:
                  raise SystemExit(f'{lib}: deadline export anchor missing')
              export = (
                  'pub use reloadable_pool::{\n'
                  '    PgTlsFileSet, ReloadablePgPool, ReloadablePgPoolSnapshot,\n'
                  '};\n\n'
              )
              source = source.replace(anchor, anchor + export, 1)
          lib.write_text(source, encoding='utf-8')

          doc = root / 'docs/development/PG_OPERATIONAL_CONTROLS.md'
          text = doc.read_text(encoding='utf-8')
          section = '''

## Atomic TLS pool generation reload

A reloadable TLS pool now reads certificate files into a candidate connector, creates and acquires
from a replacement pool, and only then atomically publishes the new generation. Invalid or missing
material leaves the currently serving generation untouched. Existing checked-out connections remain
owned by their original pool generation. URLs, private-key paths and certificate paths are redacted
from debug output.
'''
          if '## Atomic TLS pool generation reload' not in text:
              doc.write_text(text.rstrip() + section, encoding='utf-8')

          inventory_path = root / 'docs/status/IMPLEMENTATION_INVENTORY.json'
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          for component in inventory.get('components', []):
              if component.get('id') == 'COMP-PERSISTENCE-PG':
                  fact = 'fail-closed atomic TLS pool generation reload with verified candidate acquisition'
                  implemented = component.setdefault('implemented', [])
                  if fact not in implemented:
                      implemented.append(fact)
          inventory_path.write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Add live pool saturation and TLS reload tests
        shell: bash
        run: |
          set -euo pipefail
          cat > crates/trnm-persistence-pg/tests/pool_saturation.rs <<'RUST'
          use std::env;
          use std::time::{Duration, Instant};

          use trnm_persistence_pg::{DatabaseProfile, PgPool, PgPoolConfig};

          #[test]
          fn live_pool_saturation_obeys_the_acquire_timeout_and_recovers() {
              let required = env::var("TRNM_POOL_TEST_REQUIRED").ok().as_deref() == Some("1");
              let database_url = env::var("TRNM_POOL_TEST_DATABASE_URL").ok();
              let profile = match env::var("TRNM_POOL_TEST_PROFILE").as_deref() {
                  Ok("postgresql") => Some(DatabaseProfile::PostgreSql),
                  Ok("cockroachdb") => Some(DatabaseProfile::CockroachDb),
                  _ => None,
              };
              let (Some(database_url), Some(profile)) = (database_url, profile) else {
                  assert!(!required, "required pool live environment is incomplete");
                  eprintln!("pool saturation live profile not requested; no remote credit");
                  return;
              };
              let policy = PgPoolConfig {
                  max_size: 1,
                  min_idle: 0,
                  acquire_timeout: Duration::from_millis(250),
                  idle_timeout: Duration::from_secs(30),
                  max_lifetime: Duration::from_secs(60),
                  statement_timeout: Duration::from_secs(5),
                  lock_timeout: Duration::from_secs(1),
                  idle_transaction_timeout: Duration::from_secs(5),
              };
              let pool = PgPool::connect_plain(&database_url, profile, policy).unwrap();
              let held = pool.acquire().unwrap();
              let started = Instant::now();
              let error = pool.acquire().unwrap_err();
              let elapsed = started.elapsed();
              assert_eq!(error.reason(), "database_pool_acquire_timeout");
              assert!(elapsed >= Duration::from_millis(200));
              assert!(elapsed < Duration::from_secs(3));
              let snapshot = pool.snapshot();
              assert_eq!(snapshot.acquire_failures, 1);
              drop(held);
              drop(pool.acquire().unwrap());
          }
          RUST

          cat > crates/trnm-persistence-pg/tests/tls_reload.rs <<'RUST'
          use std::env;
          use std::fs;
          use std::path::PathBuf;
          use std::time::Duration;

          use trnm_persistence_pg::{
              DatabaseProfile, PgPoolConfig, PgTlsFileSet, ReloadablePgPool,
          };

          #[test]
          fn live_tls_pool_reload_is_verified_before_generation_swap() {
              let required = env::var("TRNM_TLS_RELOAD_TEST_REQUIRED").ok().as_deref()
                  == Some("1");
              let database_url = env::var("TRNM_TLS_RELOAD_TEST_DATABASE_URL").ok();
              let root_path = env::var("TRNM_TLS_RELOAD_TEST_ROOT_PEM").ok();
              let (Some(database_url), Some(root_path)) = (database_url, root_path) else {
                  assert!(!required, "required TLS reload environment is incomplete");
                  eprintln!("TLS reload live profile not requested; no remote credit");
                  return;
              };
              let root_path = PathBuf::from(root_path);
              let valid_root = fs::read(&root_path).unwrap();
              let files = PgTlsFileSet::new(Some(root_path.clone()), None, None).unwrap();
              let policy = PgPoolConfig {
                  max_size: 2,
                  min_idle: 0,
                  acquire_timeout: Duration::from_secs(2),
                  idle_timeout: Duration::from_secs(30),
                  max_lifetime: Duration::from_secs(60),
                  statement_timeout: Duration::from_secs(5),
                  lock_timeout: Duration::from_secs(1),
                  idle_transaction_timeout: Duration::from_secs(5),
              };
              let pool = ReloadablePgPool::connect_tls(
                  database_url,
                  DatabaseProfile::PostgreSql,
                  policy,
                  files,
              )
              .unwrap();
              assert_eq!(pool.snapshot().unwrap().generation, 1);
              drop(pool.acquire().unwrap());

              fs::write(&root_path, b"not a certificate").unwrap();
              assert_eq!(
                  pool.reload_tls().unwrap_err().reason(),
                  "database_tls_root_certificate_invalid"
              );
              assert_eq!(pool.snapshot().unwrap().generation, 1);
              drop(pool.acquire().unwrap());

              fs::write(&root_path, valid_root).unwrap();
              let snapshot = pool.reload_tls().unwrap();
              assert_eq!(snapshot.generation, 2);
              drop(pool.acquire().unwrap());
          }
          RUST
          git diff --check

      - name: Generate immutable permanent operational workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')
          text = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in sorted((root / '.github/workflows').glob('*.yml'))
              if path.name != 'temporary-pg-pool-tls-closure.yml'
          )
          postgres = sorted(set(re.findall(
              r'(?:docker\.io/library/)?postgres(?::[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}',
              text,
          )))
          cockroach = sorted(set(re.findall(
              r'(?:docker\.io/)?cockroachdb/cockroach(?::[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}',
              text,
          )))
          if not postgres or not cockroach:
              raise SystemExit('immutable database images missing')
          workflow = f'''name: pg-pool-tls-operations

on:
  pull_request:
  push:
    branches:
      - main
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: read

jobs:
  postgresql-pool-saturation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{GITHUB_REPOSITORY}}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Saturate one PostgreSQL connection
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          docker run -d --name trnm-pool-postgres -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55435:5432 {postgres[0]}
          for attempt in $(seq 1 90); do
            if docker exec trnm-pool-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90; sleep 1
          done
          TRNM_POOL_TEST_REQUIRED=1 TRNM_POOL_TEST_PROFILE=postgresql \
          TRNM_POOL_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55435/postgres \
            cargo test --package trnm-persistence-pg --test pool_saturation --locked -- --nocapture

  cockroachdb-pool-saturation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{GITHUB_REPOSITORY}}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Saturate one CockroachDB connection
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          docker run -d --name trnm-pool-cockroach -p 127.0.0.1:56259:26257 \
            {cockroach[0]} start-single-node --insecure \
            --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 120); do
            if docker exec trnm-pool-cockroach cockroach sql --insecure \
              --host=127.0.0.1:26257 --database=defaultdb --execute='SELECT 1' >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 120; sleep 1
          done
          TRNM_POOL_TEST_REQUIRED=1 TRNM_POOL_TEST_PROFILE=cockroachdb \
          TRNM_POOL_TEST_DATABASE_URL='postgresql://root@127.0.0.1:56259/defaultdb?sslmode=disable' \
            cargo test --package trnm-persistence-pg --test pool_saturation --locked -- --nocapture

  postgresql-tls-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{GITHUB_REPOSITORY}}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prove verified TLS reload and failed-candidate rollback
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          mkdir -p /tmp/trnm-pg-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj '/CN=Trillionnium Test CA' \
            -keyout /tmp/trnm-pg-tls/ca.key -out /tmp/trnm-pg-tls/ca.crt
          openssl req -newkey rsa:2048 -nodes -subj '/CN=localhost' \
            -keyout /tmp/trnm-pg-tls/server.key -out /tmp/trnm-pg-tls/server.csr
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' \
            > /tmp/trnm-pg-tls/server.ext
          openssl x509 -req -days 2 -sha256 \
            -in /tmp/trnm-pg-tls/server.csr \
            -CA /tmp/trnm-pg-tls/ca.crt -CAkey /tmp/trnm-pg-tls/ca.key -CAcreateserial \
            -extfile /tmp/trnm-pg-tls/server.ext \
            -out /tmp/trnm-pg-tls/server.crt
          cat > /tmp/trnm-pg-tls/Dockerfile <<'DOCKER'
          FROM {postgres[0]}
          COPY server.crt /var/lib/postgresql/server.crt
          COPY server.key /var/lib/postgresql/server.key
          RUN chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key \
            && chmod 0600 /var/lib/postgresql/server.key
          DOCKER
          docker build -t trnm-postgres-tls /tmp/trnm-pg-tls
          docker run -d --name trnm-postgres-tls -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55436:5432 trnm-postgres-tls \
            -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt \
            -c ssl_key_file=/var/lib/postgresql/server.key
          for attempt in $(seq 1 90); do
            if docker exec trnm-postgres-tls pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90; sleep 1
          done
          cp /tmp/trnm-pg-tls/ca.crt /tmp/trnm-pg-tls/client-root.pem
          TRNM_TLS_RELOAD_TEST_REQUIRED=1 \
          TRNM_TLS_RELOAD_TEST_DATABASE_URL='postgresql://postgres@localhost:55436/postgres?sslmode=require' \
          TRNM_TLS_RELOAD_TEST_ROOT_PEM=/tmp/trnm-pg-tls/client-root.pem \
            cargo test --package trnm-persistence-pg --test tls_reload --locked -- --nocapture

  pg-pool-tls-operations-gate:
    if: ${{{{ always() }}}}
    needs:
      - postgresql-pool-saturation
      - cockroachdb-pool-saturation
      - postgresql-tls-reload
    runs-on: ubuntu-24.04
    steps:
      - name: Require all operational profiles
        shell: bash
        env:
          POSTGRES_POOL: ${{{{ needs.postgresql-pool-saturation.result }}}}
          COCKROACH_POOL: ${{{{ needs.cockroachdb-pool-saturation.result }}}}
          POSTGRES_TLS: ${{{{ needs.postgresql-tls-reload.result }}}}
        run: |
          set -euo pipefail
          test "$POSTGRES_POOL" = success
          test "$COCKROACH_POOL" = success
          test "$POSTGRES_TLS" = success
'''
          (root / '.github/workflows/pg-pool-tls-operations.yml').write_text(
              workflow,
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Compile, test and strictly lint all retained source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo check --package trnm-persistence-pg --all-targets --locked
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --fix --allow-dirty --allow-staged \
            --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run all new live proofs before commit
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_IMAGE="$(grep -Eo '(docker.io/library/)?postgres(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' .github/workflows/pg-pool-tls-operations.yml | head -1)"
          COCKROACH_IMAGE="$(grep -Eo '(docker.io/)?cockroachdb/cockroach(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' .github/workflows/pg-pool-tls-operations.yml | head -1)"
          docker run -d --name trnm-pool-postgres -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55435:5432 "$POSTGRES_IMAGE"
          for attempt in $(seq 1 90); do
            if docker exec trnm-pool-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90; sleep 1
          done
          TRNM_POOL_TEST_REQUIRED=1 TRNM_POOL_TEST_PROFILE=postgresql \
          TRNM_POOL_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55435/postgres \
            cargo test --package trnm-persistence-pg --test pool_saturation --locked -- --nocapture
          docker rm -f trnm-pool-postgres
          docker run -d --name trnm-pool-cockroach -p 127.0.0.1:56259:26257 \
            "$COCKROACH_IMAGE" start-single-node --insecure \
            --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 120); do
            if docker exec trnm-pool-cockroach cockroach sql --insecure \
              --host=127.0.0.1:26257 --database=defaultdb --execute='SELECT 1' >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 120; sleep 1
          done
          TRNM_POOL_TEST_REQUIRED=1 TRNM_POOL_TEST_PROFILE=cockroachdb \
          TRNM_POOL_TEST_DATABASE_URL='postgresql://root@127.0.0.1:56259/defaultdb?sslmode=disable' \
            cargo test --package trnm-persistence-pg --test pool_saturation --locked -- --nocapture
          docker rm -f trnm-pool-cockroach
          mkdir -p /tmp/trnm-pg-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj '/CN=Trillionnium Test CA' \
            -keyout /tmp/trnm-pg-tls/ca.key -out /tmp/trnm-pg-tls/ca.crt
          openssl req -newkey rsa:2048 -nodes -subj '/CN=localhost' \
            -keyout /tmp/trnm-pg-tls/server.key -out /tmp/trnm-pg-tls/server.csr
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' \
            > /tmp/trnm-pg-tls/server.ext
          openssl x509 -req -days 2 -sha256 \
            -in /tmp/trnm-pg-tls/server.csr \
            -CA /tmp/trnm-pg-tls/ca.crt -CAkey /tmp/trnm-pg-tls/ca.key -CAcreateserial \
            -extfile /tmp/trnm-pg-tls/server.ext \
            -out /tmp/trnm-pg-tls/server.crt
          cat > /tmp/trnm-pg-tls/Dockerfile <<DOCKER
          FROM $POSTGRES_IMAGE
          COPY server.crt /var/lib/postgresql/server.crt
          COPY server.key /var/lib/postgresql/server.key
          RUN chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key \
            && chmod 0600 /var/lib/postgresql/server.key
          DOCKER
          docker build -t trnm-postgres-tls /tmp/trnm-pg-tls
          docker run -d --name trnm-postgres-tls -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55436:5432 trnm-postgres-tls \
            -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt \
            -c ssl_key_file=/var/lib/postgresql/server.key
          for attempt in $(seq 1 90); do
            if docker exec trnm-postgres-tls pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90; sleep 1
          done
          cp /tmp/trnm-pg-tls/ca.crt /tmp/trnm-pg-tls/client-root.pem
          TRNM_TLS_RELOAD_TEST_REQUIRED=1 \
          TRNM_TLS_RELOAD_TEST_DATABASE_URL='postgresql://postgres@localhost:55436/postgres?sslmode=require' \
          TRNM_TLS_RELOAD_TEST_ROOT_PEM=/tmp/trnm-pg-tls/client-root.pem \
            cargo test --package trnm-persistence-pg --test tls_reload --locked -- --nocapture

      - name: Delete all temporary writers and push unchanged-tip result
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) \
            -print -delete
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(pg): add atomic TLS pool reload and saturation proof"
          git push origin "HEAD:${GITHUB_REF_NAME}"
