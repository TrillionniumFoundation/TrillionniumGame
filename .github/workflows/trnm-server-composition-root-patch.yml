name: trnm-server-composition-root-patch

on:
  push:
    branches: [tooling/trnm-server-composition-root-2026-09-06]
    paths:
      - '.github/workflows/trnm-server-composition-root-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trnm-server-composition-root-patch
  cancel-in-progress: true

jobs:
  extract-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SOURCE_BRANCH: codex/branch-evidence-closure-2026-09-02
      PRODUCT_BRANCH: codex/trnm-server-composition-root-2026-09-06
      BASELINE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Fetch exact source and product branches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=64 origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/source" \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/product"
          git -C "$GITHUB_WORKSPACE" checkout -b "$PRODUCT_BRANCH" \
            refs/remotes/origin/product
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$BASELINE" HEAD
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$RUNNER_TEMP/original-head"
          printf 'source=%s\nsource_tree=%s\nproduct=%s\n' \
            "$(git -C "$GITHUB_WORKSPACE" rev-parse refs/remotes/origin/source)" \
            "$(git -C "$GITHUB_WORKSPACE" rev-parse 'refs/remotes/origin/source^{tree}')" \
            "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"

      - name: Extract current canonical server into final package boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf crates/trnm-server/src/runtime crates/trnm-server/proto
          mkdir -p crates/trnm-server/src/runtime crates/trnm-server/proto
          git archive refs/remotes/origin/source \
            crates/trnm-persistence-pg/src/bin/trnm_server \
            crates/trnm-persistence-pg/src/auth.rs \
            crates/trnm-persistence-pg/src/bin/trnm-server.rs \
            crates/trnm-persistence-pg/build.rs \
            crates/trnm-persistence-pg/proto/nakama-healthcheck.proto \
            | tar -x -C "$RUNNER_TEMP"

          cp -a "$RUNNER_TEMP/crates/trnm-persistence-pg/src/bin/trnm_server/." \
            crates/trnm-server/src/runtime/
          cp "$RUNNER_TEMP/crates/trnm-persistence-pg/src/auth.rs" \
            crates/trnm-server/src/runtime/auth.rs
          cp "$RUNNER_TEMP/crates/trnm-persistence-pg/src/bin/trnm-server.rs" \
            crates/trnm-server/src/canonical_main.rs
          cp "$RUNNER_TEMP/crates/trnm-persistence-pg/build.rs" \
            crates/trnm-server/build.rs
          cp "$RUNNER_TEMP/crates/trnm-persistence-pg/proto/nakama-healthcheck.proto" \
            crates/trnm-server/proto/nakama-healthcheck.proto

          python3 - <<'PY'
          from pathlib import Path

          main = Path('crates/trnm-server/src/canonical_main.rs')
          text = main.read_text(encoding='utf-8')
          text = text.replace('mod trnm_server;', 'mod runtime;', 1)
          text = text.replace('use trnm_server::', 'use runtime::')
          text = text.replace('trnm_server::', 'runtime::')
          if 'mod runtime;' not in text or 'trnm_server::' in text:
              raise SystemExit('canonical main extraction drift')
          main.write_text(text, encoding='utf-8')

          module = Path('crates/trnm-server/src/runtime/mod.rs')
          text = module.read_text(encoding='utf-8')
          text = text.replace(
              '#[path = "../../auth.rs"]\npub(crate) mod auth;',
              'pub(crate) mod auth;',
              1,
          )
          if '../../auth.rs' in text:
              raise SystemExit('runtime auth path was not localized')
          module.write_text(text, encoding='utf-8')

          schema = Path('crates/trnm-server/src/runtime/schema.rs')
          text = schema.read_text(encoding='utf-8')
          text = text.replace('../../../../../migrations/', '../../../../migrations/')
          if '../../../../../migrations/' in text:
              raise SystemExit('schema include path was not rebased')
          schema.write_text(text, encoding='utf-8')
          PY

      - name: Define isolated final composition package
        shell: bash
        run: |
          set -euo pipefail
          cat > crates/trnm-server/Cargo.toml <<'TOML'
          [package]
          name = "trnm-server"
          version = "0.1.0"
          edition = "2021"
          rust-version = "1.85.1"
          license = "Apache-2.0"
          description = "TrillionniumGame Rust server composition-root convergence candidate"
          publish = false

          [lib]
          path = "src/lib.rs"

          [[bin]]
          name = "trnm-server-foundation"
          path = "src/main.rs"

          [[bin]]
          name = "trnm-server"
          path = "src/canonical_main.rs"

          [dependencies]
          native-tls = "=0.2.18"
          openssl = "=0.10.81"
          postgres = "=0.19.14"
          postgres-native-tls = "=0.5.3"
          prost = "=0.14.3"
          r2d2 = "=0.8.10"
          r2d2_postgres = "=0.18.2"
          tokio = { version = "=1.53.1", features = ["rt", "time"] }
          tonic = { version = "=0.14.5", features = ["transport"] }
          tonic-prost = "=0.14.5"
          trnm-contracts = { path = "../trnm-contracts" }
          trnm-persistence-core = { path = "../trnm-persistence-core" }
          trnm-persistence-pg = { path = "../trnm-persistence-pg" }
          trnm-realtime-wire = { path = "../trnm-realtime-wire" }
          trnm-session-core = { path = "../trnm-session-core" }
          trnm-token-jwt-adapter = { path = "../trnm-token-jwt-adapter" }

          [build-dependencies]
          prost-build = "=0.14.3"
          prost-types = "=0.14.3"
          protoc-bin-vendored = "=3.2.0"
          tonic-build = "=0.14.5"
          tonic-prost-build = "=0.14.5"

          [workspace]

          [lints.rust]
          unsafe_code = "forbid"
          missing_debug_implementations = "deny"
          unused_must_use = "deny"

          [lints.clippy]
          dbg_macro = "deny"
          todo = "deny"
          unimplemented = "deny"
          wildcard_imports = "deny"
          TOML

          cat > crates/trnm-server/README.md <<'MD'
          # `trnm-server` composition-root convergence candidate

          Status: **source candidate; no compatibility, durability, SG4 or production credit**.

          This package now compiles two explicit binaries during convergence:

          - `trnm-server`: the extracted database-backed HTTP/gRPC/WebSocket/session composition root;
          - `trnm-server-foundation`: the previous bounded process prototype retained temporarily as a regression oracle.

          The extraction keeps the production-authoritative migration chain, bounded pool/retry/cancellation behavior, session verification, transactional command/outbox path, HTTP, generated gRPC Healthcheck and persistent WebSocket implementation in one package boundary. It does **not** by itself establish complete Nakama protocol parity, accepted durability, multi-node behavior, production capacity, public-online readiness, cutover or retirement.

          Removal of the old binary under `trnm-persistence-pg` and the foundation prototype is a separate atomic integration step after exact-head and prospective-merge validation, retained evidence, and independent protocol/database/security/SRE review.

          ```bash
          cargo fmt --manifest-path crates/trnm-server/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-server/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path crates/trnm-server/Cargo.toml --all-targets --locked -- -D warnings
          ```
          MD

      - name: Install exact Rust and generate isolated lock
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo generate-lockfile --manifest-path crates/trnm-server/Cargo.toml
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate complete composition root
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --manifest-path crates/trnm-server/Cargo.toml
          git add -N \
            crates/trnm-server/src/canonical_main.rs \
            crates/trnm-server/src/runtime \
            crates/trnm-server/proto/nakama-healthcheck.proto \
            crates/trnm-server/build.rs
          git diff --check
          cargo fmt --manifest-path crates/trnm-server/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-server/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-server/Cargo.toml \
            --all-targets --locked -- -D warnings

          test -f crates/trnm-server/src/runtime/app.rs
          test -f crates/trnm-server/src/runtime/server.rs
          test -f crates/trnm-server/src/runtime/schema.rs
          test -f crates/trnm-server/src/runtime/websocket.rs
          test -f crates/trnm-server/src/runtime/grpc.rs
          test -f crates/trnm-server/src/runtime/session_api.rs
          test -f crates/trnm-server/src/runtime/retry.rs
          test -f crates/trnm-server/src/runtime/pool.rs
          test -f crates/trnm-server/src/runtime/auth.rs
          test -f crates/trnm-server/src/canonical_main.rs
          test -f crates/trnm-server/build.rs
          test -f crates/trnm-server/proto/nakama-healthcheck.proto
          ! grep -R -nF '../../../../../migrations/' crates/trnm-server/src/runtime

          TRNM_SERVER_DATABASE_URL='postgresql://127.0.0.1:5432/trillionnium' \
          TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE=1 \
          TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$(git rev-parse refs/remotes/origin/source)" \
          TRNM_SERVER_ADMIN_TOKEN='source-candidate-admin-token-not-production' \
          cargo run --quiet --manifest-path crates/trnm-server/Cargo.toml --locked \
            --bin trnm-server -- check-config

      - name: CAS fast-forward validated product branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          original=$(cat "$RUNNER_TEMP/original-head")
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add crates/trnm-server
          if git diff --cached --quiet; then
            printf 'source_already_current=true\nhead=%s\n' "$original"
            exit 0
          fi
          git diff --cached --check
          git commit -m 'feat(server): converge canonical composition root into trnm-server package'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${original}"
          printf 'old_head=%s\nnew_head=%s\ntree=%s\n' \
            "$original" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Preserve no-credit boundary
        shell: bash
        run: |
          printf '%s\n' \
            'composition_root_source_candidate=true' \
            'old_server_removed=false' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'sg4_credit=false' \
            'production_ready=false'
