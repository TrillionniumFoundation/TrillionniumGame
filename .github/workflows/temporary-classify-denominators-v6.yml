name: temporary-classify-denominators-v6

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-classify-denominators-v6
  cancel-in-progress: false

jobs:
  discover-materialize-classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Fetch exact branch and history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=700 origin "$GITHUB_REF_NAME"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Recover and strengthen materializer discovery
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REPOSITORY: ${{ github.repository }}
          CANDIDATE_REF: ${{ github.ref_name }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          path=.github/workflows/temporary-denominator-materialization-v4.yml
          commit=$(git log --all --format=%H -- "$path" | head -n1)
          test -n "$commit"
          git show "$commit:$path" >/tmp/materializer.yml
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/materializer.yml').read_text(encoding='utf-8').splitlines()
          start = next(index + 1 for index, line in enumerate(lines) if "python3 - <<'PY'" in line)
          content = []
          for line in lines[start:]:
              if line.strip() == 'PY':
                  break
              content.append(line[10:] if line.startswith('          ') else line)
          source = '\n'.join(content) + '\n'
          old = '          workflow_paths = sorted(WORKFLOWS.glob("*denominator*.y*ml"))\n          for workflow in workflow_paths:\n              stem = workflow.stem\n'
          new = '''          registry = json.loads((ROOT / "docs/development/PARITY_DENOMINATORS.json").read_text(encoding="utf-8"))
          output_markers = {
              Path(row["output"]).name
              for row in registry.get("denominators", [])
              if isinstance(row, dict) and isinstance(row.get("output"), str)
          }
          workflow_paths = sorted(WORKFLOWS.glob("*.y*ml"))
          for workflow in workflow_paths:
              stem = workflow.stem
              workflow_source = workflow.read_text(encoding="utf-8")
              discoverable = (
                  "denominator" in stem
                  or "generate-" in workflow_source and "denominator" in workflow_source
                  or "pinned-upstream-source" in stem
                  or any(marker in workflow_source for marker in output_markers)
              )
              if not discoverable:
                  continue
'''
          if old not in source:
              raise SystemExit('materializer workflow-discovery anchor drifted')
          source = source.replace(old, new, 1)
          Path('/tmp/materialize-v6.py').write_text(source, encoding='utf-8')
          PY
          export GITHUB_TOKEN="$GH_TOKEN"
          export GITHUB_REPOSITORY="$CANDIDATE_REPOSITORY"
          export GITHUB_REF_NAME="$CANDIDATE_REF"
          export GITHUB_SHA="$CANDIDATE_SHA"
          export GITHUB_RUN_ID
          export GITHUB_RUN_ATTEMPT
          python3 /tmp/materialize-v6.py

      - name: Resolve classifier and rule authority from repository tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path.cwd()
          script = root / 'scripts/classify-materialized-denominators.py'
          source = script.read_text(encoding='utf-8')
          test = (root / 'tests/control_plane/test_denominator_classifier.py').read_text(encoding='utf-8')
          classifier = None
          patterns = [
              r'SCRIPT\s*=\s*ROOT\s*/\s*"([^"]+)"',
              r"SCRIPT\s*=\s*ROOT\s*/\s*'([^']+)'",
          ]
          for pattern in patterns:
              match = re.search(pattern, test)
              if match:
                  classifier = match.group(1)
                  break
          if classifier and not classifier.startswith('scripts/'):
              classifier = f'scripts/{classifier}'
          if not classifier or not (root / classifier).is_file():
              candidates = sorted((root / 'scripts').glob('*denominator*classif*.py'))
              if not candidates:
                  candidates = sorted((root / 'scripts').glob('*classif*.py'))
              if not candidates:
                  raise SystemExit('repository denominator classifier not found')
              classifier = candidates[0].relative_to(root).as_posix()
          rule_candidates = sorted((root / 'config').glob('*denominator*classif*.json'))
          if not rule_candidates:
              rule_candidates = sorted((root / 'config').glob('*classif*rules*.json'))
          if not rule_candidates:
              raise SystemExit('repository denominator classification rules not found')
          rules = rule_candidates[0].relative_to(root).as_posix()
          source = re.sub(
              r'^CLASSIFIER = ROOT / ".*"$',
              f'CLASSIFIER = ROOT / "{classifier}"',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          source = re.sub(
              r'^RULES = ROOT / ".*"$',
              f'RULES = ROOT / "{rules}"',
              source,
              count=1,
              flags=re.MULTILINE,
          )
          script.write_text(source, encoding='utf-8')
          print(f'classifier={classifier}')
          print(f'rules={rules}')
          PY
          python3 -m py_compile scripts/classify-materialized-denominators.py

      - name: Classify and require the complete review-ready set
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/classify-materialized-denominators.py
          python3 scripts/classify-materialized-denominators.py --check
          python3 scripts/check-denominator-materialization.py --require-present
          python3 scripts/check-denominator-materialization.py --require-review-ready

      - name: Validate source corpus and immutable claims
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-plan.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check

      - name: Commit non-workflow closure outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add \
            scripts/classify-materialized-denominators.py \
            manifests/upstream/candidates \
            manifests/upstream/denominator-review-packet.draft.json \
            docs/status/DENOMINATOR_MATERIALIZATION.json \
            docs/review/DENOMINATOR_REVIEW_PACKET.md
          if git diff --cached --quiet; then
            echo 'complete review packet already current'
          else
            git commit -m "feat(sg1): close denominator extraction and classification gaps"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          printf 'head=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

      - name: Refresh independent review request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/42/requested_reviewers" \
            -d '{"reviewers":["ProfHepta"]}' >/dev/null || true
