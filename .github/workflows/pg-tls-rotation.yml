name: pg-tls-rotation

on:
  pull_request:
    paths:
      - 'crates/trnm-persistence-pg/src/bin/trnm-pg-tls-rotation-probe.rs'
      - 'crates/trnm-persistence-pg/src/pool.rs'
      - 'crates/trnm-persistence-pg/src/pool_parts/**'
      - 'crates/trnm-persistence-pg/Cargo.toml'
      - 'scripts/wait-postgresql-tls-ready.py'
      - 'tests/control_plane/test_pg_tls_endpoint_readiness.py'
      - 'Cargo.lock'
      - '.github/workflows/pg-tls-rotation.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-persistence-pg/src/bin/trnm-pg-tls-rotation-probe.rs'
      - 'crates/trnm-persistence-pg/src/pool.rs'
      - 'crates/trnm-persistence-pg/src/pool_parts/**'
      - 'crates/trnm-persistence-pg/Cargo.toml'
      - 'scripts/wait-postgresql-tls-ready.py'
      - 'tests/control_plane/test_pg_tls_endpoint_readiness.py'
      - 'Cargo.lock'
      - '.github/workflows/pg-tls-rotation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-tls-rotation-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  POSTGRES_IMAGE: postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
  RUST_TOOLCHAIN: 1.85.1

jobs:
  source-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Run endpoint readiness regression tests
        run: python3 -m unittest tests.control_plane.test_pg_tls_endpoint_readiness -v
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy
          rustup override set "$RUST_TOOLCHAIN"
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run TLS rotation probe unit tests
        run: >-
          cargo test -p trnm-persistence-pg --locked
          --bin trnm-pg-tls-rotation-probe
      - name: Strict lint TLS rotation probe
        run: >-
          cargo clippy -p trnm-persistence-pg --locked
          --bin trnm-pg-tls-rotation-probe -- -D warnings

  live-postgresql-tls-rotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup override set "$RUST_TOOLCHAIN"
      - name: Generate independent old and new certificate authorities
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for profile in old new; do
            mkdir -p "run/pg-tls/${profile}"
            cat >"run/pg-tls/${profile}/ca.cnf" <<EOF
          [req]
          distinguished_name = distinguished_name
          x509_extensions = v3_ca
          prompt = no
          [distinguished_name]
          CN = trillionnium-${profile}-database-ca
          [v3_ca]
          basicConstraints = critical,CA:TRUE
          keyUsage = critical,keyCertSign,cRLSign
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid:always
          EOF
            openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
              -config "run/pg-tls/${profile}/ca.cnf" \
              -keyout "run/pg-tls/${profile}/ca.key" \
              -out "run/pg-tls/${profile}/ca.crt"
            openssl req -newkey rsa:2048 -nodes -sha256 \
              -keyout "run/pg-tls/${profile}/server.key" \
              -out "run/pg-tls/${profile}/server.csr" \
              -subj '/CN=localhost'
            cat >"run/pg-tls/${profile}/server.ext" <<'EOF'
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature,keyEncipherment
          extendedKeyUsage = serverAuth
          subjectAltName = DNS:localhost,IP:127.0.0.1
          subjectKeyIdentifier = hash
          authorityKeyIdentifier = keyid,issuer
          EOF
            openssl x509 -req -sha256 -days 2 \
              -in "run/pg-tls/${profile}/server.csr" \
              -CA "run/pg-tls/${profile}/ca.crt" \
              -CAkey "run/pg-tls/${profile}/ca.key" \
              -CAcreateserial \
              -extfile "run/pg-tls/${profile}/server.ext" \
              -out "run/pg-tls/${profile}/server.crt"
            openssl verify -CAfile "run/pg-tls/${profile}/ca.crt" \
              "run/pg-tls/${profile}/server.crt"
            chmod 0600 "run/pg-tls/${profile}/server.key"
            sudo chown 70:70 \
              "run/pg-tls/${profile}/server.key" \
              "run/pg-tls/${profile}/server.crt"
          done
          test "$(sha256sum run/pg-tls/old/ca.crt | cut -d' ' -f1)" != \
            "$(sha256sum run/pg-tls/new/ca.crt | cut -d' ' -f1)"
      - name: Start two exact PostgreSQL TLS endpoints
        shell: bash
        env:
          PGPASSWORD: tls_rotation_test_password
        run: |
          set -euo pipefail
          docker rm -f trnm-pg-old trnm-pg-new >/dev/null 2>&1 || true
          for specification in old:55432 new:55433; do
            profile=${specification%%:*}
            port=${specification##*:}
            docker run --detach \
              --name "trnm-pg-${profile}" \
              --publish "127.0.0.1:${port}:5432" \
              --env POSTGRES_DB=trillionnium_tls \
              --env POSTGRES_USER=postgres \
              --env POSTGRES_PASSWORD=tls_rotation_test_password \
              --volume "$PWD/run/pg-tls/${profile}/server.crt:/var/lib/postgresql/server.crt:ro" \
              --volume "$PWD/run/pg-tls/${profile}/server.key:/var/lib/postgresql/server.key:ro" \
              --volume "$PWD/run/pg-tls/${profile}/ca.crt:/var/lib/postgresql/root.crt:ro" \
              "$POSTGRES_IMAGE" \
              -c ssl=on \
              -c ssl_cert_file=/var/lib/postgresql/server.crt \
              -c ssl_key_file=/var/lib/postgresql/server.key
          done
          for profile in old new; do
            python3 scripts/wait-postgresql-tls-ready.py \
              --container "trnm-pg-${profile}" \
              --database trillionnium_tls --timeout-seconds 60 \
              | tee "run/pg-tls/${profile}/readiness.json"
          done
          touch run/pg-tls/endpoints-ready
      - name: Prove monotonic rolling trust rotation and fail-closed roots
        shell: bash
        env:
          TRNM_TLS_ROTATION_OLD_DATABASE_URL: postgresql://postgres:tls_rotation_test_password@127.0.0.1:55432/trillionnium_tls
          TRNM_TLS_ROTATION_NEW_DATABASE_URL: postgresql://postgres:tls_rotation_test_password@127.0.0.1:55433/trillionnium_tls
          TRNM_TLS_ROTATION_OLD_ROOT_CERT_PEM: run/pg-tls/old/ca.crt
          TRNM_TLS_ROTATION_NEW_ROOT_CERT_PEM: run/pg-tls/new/ca.crt
          TRNM_TLS_ROTATION_OLD_GENERATION: '41'
          TRNM_TLS_ROTATION_NEW_GENERATION: '42'
        run: |
          set -euo pipefail
          test -f run/pg-tls/endpoints-ready
          cargo run --quiet -p trnm-persistence-pg --locked \
            --bin trnm-pg-tls-rotation-probe \
            2>run/pg-tls/probe.stderr | tee run/pg-tls/probe.env
          test ! -s run/pg-tls/probe.stderr
          grep -qx 'schema=trillionnium.pg-tls-rotation-probe.v1' run/pg-tls/probe.env
          grep -qx 'old_generation=41' run/pg-tls/probe.env
          grep -qx 'new_generation=42' run/pg-tls/probe.env
          grep -qx 'assertion=old_generation_connects_old_endpoint' run/pg-tls/probe.env
          grep -qx 'assertion=new_generation_connects_new_endpoint' run/pg-tls/probe.env
          grep -qx 'assertion=old_generation_rejected_by_new_endpoint' run/pg-tls/probe.env
          grep -qx 'assertion=new_generation_rejected_by_old_endpoint' run/pg-tls/probe.env
          grep -qx 'assertion=invalid_root_rejected' run/pg-tls/probe.env
          grep -qx 'rotation_mode=rolling_pool_replacement' run/pg-tls/probe.env
          grep -qx 'hot_reload_claim=false' run/pg-tls/probe.env
          grep -qx 'production_ready=false' run/pg-tls/probe.env
      - name: Seal exact execution receipt in immutable job log
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          printf 'old_root_sha256=%s\n' \
            "$(sha256sum run/pg-tls/old/ca.crt | cut -d' ' -f1)"
          printf 'new_root_sha256=%s\n' \
            "$(sha256sum run/pg-tls/new/ca.crt | cut -d' ' -f1)"
          cat run/pg-tls/probe.env
          printf '%s\n' \
            'transport=postgresql-native-tls-verify-full' \
            'topology=two-independent-single-node-postgresql-endpoints' \
            'multi_node_evidence=false' \
            'endurance_evidence=false' \
            'production_ready=false'
      - name: Stop PostgreSQL TLS endpoints
        if: always()
        shell: bash
        run: docker rm -f trnm-pg-old trnm-pg-new >/dev/null 2>&1 || true
