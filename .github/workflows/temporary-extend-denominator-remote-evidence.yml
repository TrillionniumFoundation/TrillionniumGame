name: temporary-extend-denominator-remote-evidence-v3

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-extend-denominator-remote-evidence-v3
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Apply exact remote-evidence patch
        run: |
          set -euo pipefail
          python3 scripts/temporary_apply_remote_evidence_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/development/DENOMINATOR_REVIEW_AND_LOCK.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          python3 -m py_compile tools/denominator/review_lock.py
          python3 -m json.tool config/denominator-review-policy.json >/dev/null
          python3 -m json.tool contracts/denominator/review-bundle.v1.schema.json >/dev/null
          git diff --check

      - name: Execute fail-closed review and full Python tests
        run: |
          set -euo pipefail
          bash scripts/check-denominator-review-lock.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit only verified contract changes
        run: |
          set -euo pipefail
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add \
            tools/denominator/review_lock.py \
            tests/denominator/test_review_lock.py \
            config/denominator-review-policy.json \
            contracts/denominator/review-bundle.v1.schema.json \
            docs/development/DENOMINATOR_REVIEW_AND_LOCK.md
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(evidence): accept sealed exact-head job-log carriers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
