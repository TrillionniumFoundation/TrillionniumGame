name: world-transition-v1-adapter

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'contracts/world-transition-v1*'
      - 'docs/WORLD_TRANSITION_V1_**'
      - 'runtime/world_transition_v1/**'
      - 'runtime/internal/worldtransition/**'
      - 'scripts/check-world-transition-v1-boundary.sh'
      - 'scripts/test-world-transition-v1-boundary-negative.sh'
      - 'testdata/world-transition-v1/**'
      - 'tests/test_world_transition_v1.py'
      - 'tools/emit_world_transition_v1_shadow_fixture.py'
      - '.github/workflows/world-transition-v1-adapter.yml'
  push:
    branches:
      - main
      - feature/nakama-world-transition-v1-adapter
      - feature/nakama-authority-world-transition-v1
    paths:
      - 'contracts/world-transition-v1*'
      - 'docs/WORLD_TRANSITION_V1_**'
      - 'runtime/world_transition_v1/**'
      - 'runtime/internal/worldtransition/**'
      - 'scripts/check-world-transition-v1-boundary.sh'
      - 'scripts/test-world-transition-v1-boundary-negative.sh'
      - 'testdata/world-transition-v1/**'
      - 'tests/test_world_transition_v1.py'
      - 'tools/emit_world_transition_v1_shadow_fixture.py'
      - '.github/workflows/world-transition-v1-adapter.yml'

permissions:
  contents: read

concurrency:
  group: world-transition-v1-adapter-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  adapter-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "refs/heads/${CANDIDATE_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
          cd "$GITHUB_WORKSPACE"
          go version
      - name: Compile standard-library Python adapter
        run: >-
          python3 -S -m compileall -q
          runtime/world_transition_v1
          tools/emit_world_transition_v1_shadow_fixture.py
          tests/test_world_transition_v1.py
      - name: Verify exact World lock and authority boundary
        run: bash scripts/check-world-transition-v1-boundary.sh
      - name: Prove forbidden capabilities and divergence fail closed
        run: bash scripts/test-world-transition-v1-boundary-negative.sh
      - name: Run Python adapter and shadow unit tests
        run: >-
          PYTHONPATH=. python3 -S -m unittest
          discover -s tests -p 'test_world_transition_v1.py' -v
      - name: Verify Go transition package formatting, tests and vet
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l runtime/internal/worldtransition)
          test -z "$unformatted" || {
            printf 'unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          }
          (cd runtime && go test ./internal/worldtransition -count=1)
          (cd runtime && go vet ./internal/worldtransition)
      - name: Reject forbidden Go capabilities
        run: |
          set -euo pipefail
          if grep -R -nE '"(net|net/http|database/sql|crypto/ed25519|os/exec|time|math/rand)"' runtime/internal/worldtransition --include='*.go'; then
            echo 'Go transition verifier acquired a forbidden capability' >&2
            exit 1
          fi
      - name: Emit exact-head accepted and rejected fixtures
        run: |
          set -euo pipefail
          mkdir -p run/world-transition-v1
          PYTHONPATH=. python3 -S tools/emit_world_transition_v1_shadow_fixture.py \
            --nakama-revision "$CANDIDATE_SHA" \
            --output-dir run/world-transition-v1 \
            | tee run/world-transition-v1/emitter-stdout.json
      - name: Recompare through the public CLI
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -S -m runtime.world_transition_v1 compare-shadow \
            --world run/world-transition-v1/world-observations.jsonl \
            --candidate run/world-transition-v1/nakama-observations.jsonl \
            --summary run/world-transition-v1/cli-shadow-summary.json
      - name: Validate honest evidence posture
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          jq -e '
            .contract_version == "trnm_nakama_world_transition_fixture_report_v1" and
            .fixture_kind == "synthetic_contract_fixture" and
            .nakama_revision == env.EXPECTED_SHA and
            .shadow_status == "matched" and
            .authority.completion_signing_performed == false and
            .authority.canonical_archive_root_produced == false and
            .authority.global_ordering_owned_by_world == false and
            .authority.public_online_enabled == false and
            (.limitations | length >= 3)
          ' run/world-transition-v1/fixture-report.json >/dev/null
          jq -e '
            .contract_version == "trnm_nakama_world_transition_shadow_summary_v1" and
            .status == "matched" and
            .divergence_count == 0 and
            .fixture_count == 2 and
            .matched_count == 2 and
            .promotion_eligible_for_integration_review == true and
            .cutover_authorized == false and
            .canonical_completion_signing_performed == false and
            .public_online_enabled == false
          ' run/world-transition-v1/shadow-summary.json >/dev/null
          jq -e '
            .status == "implemented_python_and_go_pending_exact_head_ci" and
            .authority.cutover_authorized == false and
            .authority.public_online_enabled == false and
            .authority.public_player_market_enabled == false and
            (.not_implemented | index("production_world_command_store_adapter")) != null
          ' contracts/world-transition-v1-adapter-status.json >/dev/null
      - name: Record and seal exact artifact digests
        run: |
          set -euo pipefail
          find run/world-transition-v1 -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum \
            > run/world-transition-v1/SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/world-transition-v1-${CANDIDATE_SHA}.tar.gz \
            -C run/world-transition-v1 .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/world-transition-v1-${CANDIDATE_SHA}.tar.gz
          cat run/world-transition-v1/SHA256SUMS
