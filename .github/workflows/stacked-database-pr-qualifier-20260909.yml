name: stacked-database-pr-qualifier-20260909

on:
  push:
    branches:
      - codex/plan-v32-controller-v2-2026-09-09
    paths:
      - .github/workflows/stacked-database-pr-qualifier-20260909.yml
      - tools/qualify_stacked_database_pr.sh

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        pr: [121, 122, 123]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: stacked-database-pr-qualifier-${{ matrix.pr }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ matrix.pr }}
      EXPECTED_WORKFLOW_COUNT: "56"
    steps:
      - name: Fetch exact qualifier source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/controller"
          git init "$GITHUB_WORKSPACE/controller"
          git -C "$GITHUB_WORKSPACE/controller" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/controller" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/controller" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/controller" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Require the stacked Draft PR to exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 100); do
            gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" >/dev/null 2>&1 && exit 0
            sleep 12
          done
          printf 'PR #%s did not materialize\n' "$PR_NUMBER" >&2
          exit 1
      - name: Bind complete exact-head and prospective-merge execution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/controller/tools/qualify_stacked_database_pr.sh"
