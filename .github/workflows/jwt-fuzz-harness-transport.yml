name: jwt-fuzz-harness-transport

on:
  push:
    branches:
      - codex/jwt-fuzz-harness-2026-09-08
    paths:
      - .github/workflows/jwt-fuzz-harness-transport.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: jwt-fuzz-harness-transport
  cancel-in-progress: false

jobs:
  add-fuzz:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/architecture-gap-closure-2026-09-08
      TARGET_PR: '116'
    steps:
      - name: Wait for stable crypto-converged target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          previous=''; stable=0; deadline=$((SECONDS+10800))
          while (( SECONDS < deadline )); do
            head=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "${api}/git/ref/heads/${TARGET_BRANCH//\//%2F}" | jq -r '.object.sha')
            crypto_status=$(curl --silent --output "$RUNNER_TEMP/crypto.rs" --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github.raw+json' \
              "${api}/contents/crates/trnm-token-jwt-adapter/src/sha256.rs?ref=${head}")
            if [[ "$crypto_status" == 200 ]] \
               && grep -Fq 'use hmac::{Hmac, Mac};' "$RUNNER_TEMP/crypto.rs" \
               && grep -Fq 'use subtle::ConstantTimeEq;' "$RUNNER_TEMP/crypto.rs"; then
              if [[ "$head" == "$previous" ]]; then stable=$((stable+1)); else previous="$head"; stable=0; fi
            else
              previous=''; stable=0
            fi
            if (( stable >= 6 )); then printf '%s\n' "$head" > "$RUNNER_TEMP/target-before.txt"; break; fi
            sleep 30
          done
          test -s "$RUNNER_TEMP/target-before.txt"
          head=$(cat "$RUNNER_TEMP/target-before.txt")
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$head"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$head"

      - name: Add bounded coverage-guided fuzz harness
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p fuzz/fuzz_targets fuzz/corpus/jwt_surface
          cat > fuzz/Cargo.toml <<'TOML'
          [package]
          name = "trnm-fuzz"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [package.metadata]
          cargo-fuzz = true

          [dependencies]
          libfuzzer-sys = "0.4"
          trnm-token-jwt-adapter = { path = "../crates/trnm-token-jwt-adapter" }

          [[bin]]
          name = "jwt_surface"
          path = "fuzz_targets/jwt_surface.rs"
          test = false
          doc = false
          bench = false

          [workspace]
          members = []
          TOML
          sed -i 's/^          //' fuzz/Cargo.toml
          cat > fuzz/fuzz_targets/jwt_surface.rs <<'RS'
          #![no_main]

          use libfuzzer_sys::fuzz_target;
          use trnm_token_jwt_adapter::base64url;
          use trnm_token_jwt_adapter::json::{self, JsonLimits};
          use trnm_token_jwt_adapter::{verify, KeyRing, SecretKey, VerificationProfile};

          fuzz_target!(|data: &[u8]| {
              let limits = JsonLimits {
                  max_depth: 16,
                  max_nodes: 2_048,
                  max_string_bytes: 16 * 1_024,
                  max_collection_len: 256,
              };
              let _ = json::parse(data, limits);

              let Ok(text) = core::str::from_utf8(data) else {
                  return;
              };
              let _ = base64url::decode(text, 32 * 1_024);

              let mut keys = KeyRing::new();
              keys.set_legacy_key(SecretKey::new(vec![0x42; 32]).expect("fixed valid fuzz key"));
              let profile = VerificationProfile::default();
              let _ = verify(text, &keys, &profile, 2_000_000_000);
          });
          RS
          sed -i 's/^          //' fuzz/fuzz_targets/jwt_surface.rs
          python3 - <<'PY'
          import base64, hashlib, hmac, json
          from pathlib import Path
          root=Path('fuzz/corpus/jwt_surface')
          def b64(value:bytes)->str:
              return base64.urlsafe_b64encode(value).rstrip(b'=').decode()
          seeds={
              'empty-segments':'..',
              'algorithm-none':b64(b'{"alg":"none","typ":"JWT"}')+'.'+b64(b'{"sub":"user"}')+'.AA',
              'oversized-kid':b64(json.dumps({'alg':'HS256','typ':'JWT','kid':'x'*2048},separators=(',',':')).encode())+'.e30.AA',
          }
          header=b'{"alg":"HS256","typ":"JWT"}'
          payload=b'{"sub":"user-1","iat":1999999900,"exp":2000000100}'
          signing=(b64(header)+'.'+b64(payload)).encode()
          signature=hmac.new(bytes([0x42])*32,signing,hashlib.sha256).digest()
          seeds['valid-legacy']=signing.decode()+'.'+b64(signature)
          seeds['tampered-legacy']=signing.decode()+'.'+b64(bytes([signature[0]^1])+signature[1:])
          for name,value in seeds.items():
              (root/name).write_text(value,encoding='utf-8')
          PY

          cat > .github/workflows/jwt-fuzz.yml <<'YAML'
          name: jwt-fuzz

          on:
            pull_request:
              paths:
                - 'crates/trnm-token-jwt-adapter/**'
                - 'crates/trnm-token-jwt-provider-adapter/**'
                - 'crates/trnm-token-crypto-provider/**'
                - 'crates/trnm-persistence-pg/src/auth.rs'
                - 'fuzz/**'
                - '.github/workflows/jwt-fuzz.yml'
            push:
              branches: [main]
              paths:
                - 'crates/trnm-token-jwt-adapter/**'
                - 'crates/trnm-token-jwt-provider-adapter/**'
                - 'crates/trnm-token-crypto-provider/**'
                - 'crates/trnm-persistence-pg/src/auth.rs'
                - 'fuzz/**'
                - '.github/workflows/jwt-fuzz.yml'
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: jwt-fuzz-${{ github.ref }}
            cancel-in-progress: true

          env:
            CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
            CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

          jobs:
            fuzz:
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - name: Fetch exact candidate without external actions
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf "$GITHUB_WORKSPACE"
                    git init "$GITHUB_WORKSPACE"
                    git -C "$GITHUB_WORKSPACE" remote add origin \
                      "https://github.com/${CANDIDATE_REPOSITORY}.git"
                    git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
                    git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
                    test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
                - name: Install pinned project toolchain and fuzz driver
                  shell: bash
                  run: |
                    set -euo pipefail
                    rustup toolchain install nightly --profile minimal
                    cargo +nightly install cargo-fuzz --locked
                    cargo +nightly fuzz --version
                    rustc +nightly --version --verbose
                - name: Build and execute bounded JWT fuzz target
                  shell: bash
                  run: |
                    set -euo pipefail
                    mkdir -p run/jwt-fuzz/artifacts
                    cargo +nightly fuzz build jwt_surface --fuzz-dir fuzz
                    cargo +nightly fuzz run jwt_surface --fuzz-dir fuzz -- \
                      -max_total_time=300 \
                      -max_len=32768 \
                      -timeout=10 \
                      -rss_limit_mb=2048 \
                      -artifact_prefix=run/jwt-fuzz/artifacts/
                    find run/jwt-fuzz/artifacts -type f -maxdepth 1 -print > run/jwt-fuzz/artifacts.txt
                    test ! -s run/jwt-fuzz/artifacts.txt
                    jq -n \
                      --arg repository "$CANDIDATE_REPOSITORY" \
                      --arg head "$CANDIDATE_SHA" \
                      --arg run_id "$GITHUB_RUN_ID" \
                      --arg attempt "$GITHUB_RUN_ATTEMPT" \
                      '{schema:"trillionnium.jwt-fuzz-execution.v1",repository:$repository,head:$head,run_id:$run_id,run_attempt:$attempt,coverage_guided:true,max_total_time_seconds:300,max_input_bytes:32768,crash_artifact_count:0,claims:{independent_security_acceptance:false,gap_closed:false,production_ready:false}}' \
                      > run/jwt-fuzz/summary.json
                    find run/jwt-fuzz -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum \
                      > run/jwt-fuzz/SHA256SUMS
          YAML
          sed -i 's/^          //' .github/workflows/jwt-fuzz.yml
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/development/CRYPTO_PATH_AUTHORITY.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['fuzz_authority']={
              'manifest':'fuzz/Cargo.toml',
              'target':'fuzz/fuzz_targets/jwt_surface.rs',
              'workflow':'.github/workflows/jwt-fuzz.yml',
              'surfaces':['strict JSON','base64url','compact JWT','algorithm and key routing','signature length','claim validation'],
              'required_execution':'exact candidate coverage-guided run with zero crash artifacts',
              'independent_security_acceptance':False,
              'gap_closed':False,
          }
          p.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
          git diff --check

      - name: Validate fuzz build and complete repository
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          exec > >(tee "$RUNNER_TEMP/validation.log") 2>&1
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
          cargo +nightly fuzz build jwt_surface --fuzz-dir fuzz
          cargo +nightly fuzz run jwt_surface --fuzz-dir fuzz -- -runs=10000 -max_len=32768 -timeout=10 -rss_limit_mb=2048
          cd runtime
          test -z "$(find . -type f -name '*.go' -print0 | sort -z | xargs -0 gofmt -l)"
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...

      - name: Publish onto unchanged candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          before=$(cat "$RUNNER_TEMP/target-before.txt")
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "$before"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(security): add bounded coverage-guided JWT fuzz target'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Report failure closed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/validation.log"
          [[ -s "$log" ]] || echo 'fuzz harness transport failed before combined validation' > "$log"
          tail -c 50000 "$log" > "$RUNNER_TEMP/tail.log"
          body=$(python3 - <<'PY'
          import json,os
          from pathlib import Path
          text=Path(os.environ['RUNNER_TEMP'],'tail.log').read_text(encoding='utf-8',errors='replace')
          print(json.dumps({'body':'JWT fuzz harness transport failed closed; the candidate was not updated.\n\n```text\n'+text+'\n```'}))
          PY
          )
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TARGET_PR}/comments" \
            -d "$body" >/dev/null

      - name: Delete fuzz transport branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE" push origin --delete codex/jwt-fuzz-harness-2026-09-08 >/dev/null 2>&1 || true
