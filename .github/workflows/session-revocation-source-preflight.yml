# Exact-source preflight trigger for the session-revocation candidate.
name: session-revocation-source-preflight

on:
  push:
    branches:
      - tooling/session-revocation-preflight-2026-09-06

permissions:
  contents: read

concurrency:
  group: session-revocation-source-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: 7deee4377cff401854647151842c582f038feef1
      EXPECTED_PRODUCT_COMMIT: 0d0f246a131902403202afcd28103f22af30c8a9
    steps:
      - name: Fetch exact tooling commit without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=4 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
            "$EXPECTED_PRODUCT_COMMIT" "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
            "$EXPECTED_PARENT" "$EXPECTED_PRODUCT_COMMIT"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse "$EXPECTED_PRODUCT_COMMIT^{tree}")" = \
            "83e5f6ba6446045ae69a54c2203e808c69cd7167"
          test -f "$GITHUB_WORKSPACE/crates/trnm-presence-router-v2/src/session_registry.rs"

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Format, test and strictly lint session routing
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets --locked -- -D warnings

      - name: Record zero-credit source receipt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'source_candidate=true' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false'
