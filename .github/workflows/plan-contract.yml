name: trillionnium-game-plan-contract

on:
  pull_request:
    paths:
      - 'CURRENT_PLAN.md'
      - 'PROJECT_*'
      - 'README.md'
      - 'NOTICE'
      - 'LICENSE'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'scripts/check-plan.py'
      - 'scripts/generate-api-rtapi-denominator.py'
      - 'scripts/check-api-rtapi-denominator.sh'
      - 'tests/test_api_rtapi_denominator.py'
      - '.github/workflows/plan-contract.yml'
  push:
    branches: [main]
    paths:
      - 'CURRENT_PLAN.md'
      - 'PROJECT_*'
      - 'README.md'
      - 'NOTICE'
      - 'LICENSE'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'scripts/check-plan.py'
      - 'scripts/generate-api-rtapi-denominator.py'
      - 'scripts/check-api-rtapi-denominator.sh'
      - 'tests/test_api_rtapi_denominator.py'
      - '.github/workflows/plan-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trillionnium-game-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate complete Rust rewrite plan
        run: python3 scripts/check-plan.py

  exact-api-rtapi-denominator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Run unit and syntax tests
        run: bash scripts/check-api-rtapi-denominator.sh
      - name: Fetch exact upstream sources and generate candidate A
        run: |
          set -euo pipefail
          python3 scripts/generate-api-rtapi-denominator.py \
            --fetch \
            --source-dir run/upstream \
            --output-dir run/candidate-a
      - name: Re-run offline and require byte-identical output
        run: |
          set -euo pipefail
          python3 scripts/generate-api-rtapi-denominator.py \
            --source-dir run/upstream \
            --output-dir run/candidate-b
          diff -ru run/candidate-a run/candidate-b
      - name: Prove candidate cannot close SG1
        run: |
          set -euo pipefail
          if python3 scripts/generate-api-rtapi-denominator.py \
              --source-dir run/upstream \
              --output-dir run/sg1-negative \
              --require-sg1; then
            echo 'candidate incorrectly received SG1 credit' >&2
            exit 1
          fi
      - name: Validate and seal fail-closed candidate metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name, minimum in [
              ('api-denominator.candidate.json', 100),
              ('rtapi-denominator.candidate.json', 50),
          ]:
              value = json.loads((Path('run/candidate-a') / name).read_text())
              assert value['leaf_count'] >= minimum, (name, value['leaf_count'])
              assert value['unclassified_count'] == value['leaf_count']
              assert value['status'] == 'candidate-unclassified'
              assert value['sg1_eligible'] is False
              assert value['compatibility_credit'] is False
          PY
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/api-rtapi-denominator-${CANDIDATE_SHA}.tar.gz \
            -C run/candidate-a .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/api-rtapi-denominator-${CANDIDATE_SHA}.tar.gz
          find run/candidate-a -type f -print0 | sort -z | xargs -0 sha256sum
