name: realtime-control-models-receipt-binding-v3

on:
  push:
    branches:
      - tooling/realtime-control-models-preflight-2026-09-06
    paths:
      - '.github/workflows/realtime-control-models-receipt-binding-v2.yml'

permissions:
  contents: write

concurrency:
  group: realtime-control-models-receipt-binding-v3
  cancel-in-progress: true

jobs:
  patch-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PRODUCT_BRANCH: codex/realtime-control-models-2026-09-06
      EXPECTED_BASE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch current product branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/product"
          git init "$GITHUB_WORKSPACE/product"
          git -C "$GITHUB_WORKSPACE/product" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/product" fetch --no-tags --depth=64 origin \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/product"
          git -C "$GITHUB_WORKSPACE/product" checkout -b "$PRODUCT_BRANCH" \
            refs/remotes/origin/product
          git -C "$GITHUB_WORKSPACE/product" merge-base --is-ancestor \
            "$EXPECTED_BASE" HEAD
          git -C "$GITHUB_WORKSPACE/product" rev-parse HEAD \
            > "$RUNNER_TEMP/original-head"
          test -f "$GITHUB_WORKSPACE/product/crates/trnm-presence-router-v2/src/disconnect_journal.rs"

      - name: Bind receipt to the immutable disconnect operation
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/trnm-presence-router-v2/src/disconnect_journal.rs")
          text = path.read_text(encoding="utf-8")

          if "pub struct DisconnectReceipt" not in text:
              marker = (
                  "#[derive(Clone, Copy, Debug, Eq, PartialEq)]\n"
                  "pub enum DisconnectState"
              )
              if text.count(marker) != 1:
                  raise SystemExit("disconnect state marker drift")
              receipt = "\n".join(
                  (
                      "#[derive(Clone, Copy, Debug, Eq, PartialEq)]",
                      "pub struct DisconnectReceipt {",
                      "    pub operation_digest: [u8; 32],",
                      "    pub receipt_digest: [u8; 32],",
                      "}",
                      "",
                      "impl DisconnectReceipt {",
                      "    pub fn validate(self) -> Result<Self, DisconnectJournalError> {",
                      "        if self.operation_digest.iter().all(|byte| *byte == 0) {",
                      "            return Err(DisconnectJournalError::ZeroDigest(",
                      "                \"receipt.operation_digest\",",
                      "            ));",
                      "        }",
                      "        if self.receipt_digest.iter().all(|byte| *byte == 0) {",
                      "            return Err(DisconnectJournalError::ZeroDigest(",
                      "                \"receipt.receipt_digest\",",
                      "            ));",
                      "        }",
                      "        Ok(self)",
                      "    }",
                      "}",
                      "",
                      "",
                  )
              )
              text = text.replace(marker, receipt + marker, 1)

          if "receipt: DisconnectReceipt" not in text:
              start_marker = "    pub fn reconcile_receipt("
              end_marker = "\n    fn require("
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit("reconcile_receipt function marker drift")
              replacement = "\n".join(
                  (
                      "    pub fn reconcile_receipt(",
                      "        &mut self,",
                      "        id: DisconnectIntentId,",
                      "        receipt: DisconnectReceipt,",
                      "    ) -> Result<DisconnectRecord, DisconnectJournalError> {",
                      "        let receipt = receipt.validate()?;",
                      "        let current = self.require(id)?;",
                      "        if receipt.operation_digest != current.operation.operation_digest {",
                      "            return Err(DisconnectJournalError::ConflictingIntent(id));",
                      "        }",
                      "        match current.state {",
                      "            DisconnectState::Applied { receipt: existing } => {",
                      "                if existing == receipt.receipt_digest {",
                      "                    return Ok(current);",
                      "                }",
                      "                return Err(DisconnectJournalError::ReceiptMismatch(id));",
                      "            }",
                      "            DisconnectState::Dispatched { .. } | DisconnectState::Indeterminate => {}",
                      "            DisconnectState::DeadLetter { .. } => {",
                      "                return Err(DisconnectJournalError::Terminal(id));",
                      "            }",
                      "            DisconnectState::Pending | DisconnectState::Leased { .. } => {",
                      "                return Err(DisconnectJournalError::NotDispatched(id));",
                      "            }",
                      "        }",
                      "        let next = DisconnectRecord {",
                      "            state: DisconnectState::Applied {",
                      "                receipt: receipt.receipt_digest,",
                      "            },",
                      "            ..current",
                      "        };",
                      "        self.records.insert(id, next);",
                      "        Ok(next)",
                      "    }",
                  )
              )
              text = text[:start] + replacement + text[end:]

          call_44 = "journal.reconcile_receipt(id(1), digest(44))"
          call_45 = "journal.reconcile_receipt(id(1), digest(45))"
          typed_44 = "\n".join(
              (
                  "journal.reconcile_receipt(",
                  "                id(1),",
                  "                DisconnectReceipt {",
                  "                    operation_digest: digest(9),",
                  "                    receipt_digest: digest(44),",
                  "                },",
                  "            )",
              )
          )
          typed_45 = "\n".join(
              (
                  "journal.reconcile_receipt(",
                  "                id(1),",
                  "                DisconnectReceipt {",
                  "                    operation_digest: digest(9),",
                  "                    receipt_digest: digest(45),",
                  "                },",
                  "            )",
              )
          )
          text = text.replace(call_44, typed_44)
          text = text.replace(call_45, typed_45)

          negative_marker = "operation_digest: digest(8)"
          if negative_marker not in text:
              insertion = "        let applied = journal"
              if text.count(insertion) != 1:
                  raise SystemExit("receipt test insertion marker drift")
              negative = "\n".join(
                  (
                      "        assert_eq!(",
                      "            journal.reconcile_receipt(",
                      "                id(1),",
                      "                DisconnectReceipt {",
                      "                    operation_digest: digest(8),",
                      "                    receipt_digest: digest(44),",
                      "                },",
                      "            ),",
                      "            Err(DisconnectJournalError::ConflictingIntent(id(1)))",
                      "        );",
                      "",
                  )
              )
              text = text.replace(insertion, negative + insertion, 1)

          path.write_text(text, encoding="utf-8")

          lib = Path("crates/trnm-presence-router-v2/src/lib.rs")
          source = lib.read_text(encoding="utf-8")
          if "DisconnectReceipt" not in source:
              marker = "DisconnectOperation,"
              if source.count(marker) != 1:
                  raise SystemExit("disconnect export marker drift")
              source = source.replace(
                  marker,
                  "DisconnectOperation, DisconnectReceipt,",
                  1,
              )
          lib.write_text(source, encoding="utf-8")
          PY
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml
          git diff --check
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets --locked -- -D warnings
          grep -qF 'pub struct DisconnectReceipt' \
            crates/trnm-presence-router-v2/src/disconnect_journal.rs
          grep -qF 'receipt: DisconnectReceipt' \
            crates/trnm-presence-router-v2/src/disconnect_journal.rs
          grep -qF 'operation_digest: digest(8)' \
            crates/trnm-presence-router-v2/src/disconnect_journal.rs

      - name: CAS fast-forward validated product branch
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add crates/trnm-presence-router-v2/src
          if git diff --cached --quiet; then
            printf 'source_already_current=true\nhead=%s\n' "$original"
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix(realtime): bind disconnect receipt to exact operation'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${original}"
          printf 'old_head=%s\nnew_head=%s\ntree=%s\n' \
            "$original" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Preserve claim boundary
        shell: bash
        run: |
          printf '%s\n' \
            'source_candidate=true' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false'
