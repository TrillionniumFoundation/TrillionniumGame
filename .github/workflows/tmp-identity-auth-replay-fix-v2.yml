name: tmp-identity-operation-scope-fix-v3

on:
  push:
    branches:
      - ops/identity-auth-replay-fix-20260910
    paths:
      - .github/workflows/tmp-identity-auth-replay-fix-v2.yml

permissions:
  contents: write

concurrency:
  group: identity-operation-scope-fix-v3-20260910
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_BRANCH: feature/plan-v32-identity-core-20260909
      EXPECTED_HEAD: 4ef337a1a279252f9d81f8a9dbbb85d280ff03f9
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact target head without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Enforce operation-scoped receipt replay and pairwise regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("crates/trnm-identity-core/src/lib.rs")
          source = source_path.read_text(encoding="utf-8")

          operations = {
              "create_account": "Created",
              "authenticate": "Authenticated",
              "link_provider": "Linked",
              "unlink_provider": "Unlinked",
              "update_profile": "Updated",
              "set_status": "StatusChanged",
              "delete_account": "Deleted",
          }
          old_call = "self.existing_receipt(command, fingerprint)?"
          for function_name, outcome in operations.items():
              marker = f"    pub fn {function_name}(\n"
              if source.count(marker) != 1:
                  raise SystemExit(f"{function_name}: function boundary changed")
              start = source.index(marker)
              end = source.find("\n    pub fn ", start + len(marker))
              if end < 0:
                  raise SystemExit(f"{function_name}: next function boundary missing")
              segment = source[start:end]
              if segment.count(old_call) != 1:
                  raise SystemExit(
                      f"{function_name}: expected one legacy receipt lookup, found {segment.count(old_call)}"
                  )
              scoped_call = (
                  "self.existing_receipt(\n"
                  "            command,\n"
                  "            fingerprint,\n"
                  f"            ReceiptOutcome::{outcome},\n"
                  "        )?"
              )
              segment = segment.replace(old_call, scoped_call, 1)
              source = source[:start] + segment + source[end:]

          old_helper = '''    fn existing_receipt(
              &self,
              command: CommandId,
              fingerprint: Fingerprint,
          ) -> Result<Option<CommandReceipt>, IdentityError> {
              let Some(receipt) = self.receipts.get(&command) else {
                  return Ok(None);
              };
              if receipt.fingerprint != fingerprint {
                  return Err(IdentityError::new(
                      IdentityErrorCode::Conflict,
                      "command_fingerprint_conflict",
                  ));
              }
              Ok(Some(*receipt))
          }
          '''
          new_helper = '''    fn existing_receipt(
              &self,
              command: CommandId,
              fingerprint: Fingerprint,
              expected_outcome: ReceiptOutcome,
          ) -> Result<Option<CommandReceipt>, IdentityError> {
              let Some(receipt) = self.receipts.get(&command) else {
                  return Ok(None);
              };
              if receipt.fingerprint != fingerprint {
                  return Err(IdentityError::new(
                      IdentityErrorCode::Conflict,
                      "command_fingerprint_conflict",
                  ));
              }
              if receipt.outcome != expected_outcome {
                  return Err(IdentityError::new(
                      IdentityErrorCode::Conflict,
                      "command_operation_conflict",
                  ));
              }
              Ok(Some(*receipt))
          }
          '''
          if source.count(old_helper) != 1:
              raise SystemExit("existing_receipt helper no longer matches exact reviewed source")
          source = source.replace(old_helper, new_helper, 1)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("crates/trnm-identity-core/tests/receipt_operation_scope.rs")
          if test_path.exists():
              raise SystemExit("operation-scope integration test already exists")
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(
              r'''use trnm_identity_core::{
              AccountId, AccountStatus, CommandId, CommandReceipt, DisplayName, Fingerprint,
              IdentityConfig, IdentityError, IdentityErrorCode, IdentityProvider, IdentityRegistry,
              ProviderIdentity, Username,
          };

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          enum Operation {
              Create,
              Authenticate,
              Link,
              Unlink,
              Update,
              SetStatus,
              Delete,
          }

          impl Operation {
              const ALL: [Self; 7] = [
                  Self::Create,
                  Self::Authenticate,
                  Self::Link,
                  Self::Unlink,
                  Self::Update,
                  Self::SetStatus,
                  Self::Delete,
              ];
          }

          fn bytes16(value: u8) -> [u8; 16] {
              let mut bytes = [0; 16];
              bytes[15] = value;
              bytes
          }

          fn bytes32(value: u8) -> [u8; 32] {
              let mut bytes = [0; 32];
              bytes[31] = value;
              bytes
          }

          fn account(value: u8) -> AccountId {
              AccountId::new(bytes16(value)).expect("nonzero account")
          }

          fn command(value: u8) -> CommandId {
              CommandId::new(bytes16(value)).expect("nonzero command")
          }

          fn fingerprint(value: u8) -> Fingerprint {
              Fingerprint::new(bytes32(value)).expect("nonzero fingerprint")
          }

          fn provider(kind: IdentityProvider, value: &str) -> ProviderIdentity {
              ProviderIdentity::new(kind, value).expect("valid provider")
          }

          fn registry() -> IdentityRegistry {
              IdentityRegistry::new(IdentityConfig::new(16, 8, 128).expect("valid limits"))
          }

          fn create_base(
              registry: &mut IdentityRegistry,
              primary: ProviderIdentity,
          ) -> CommandReceipt {
              registry
                  .create_account(
                      command(1),
                      fingerprint(1),
                      account(1),
                      Username::new("identity-scope-user").expect("valid username"),
                      DisplayName::new("Identity Scope User").expect("valid display name"),
                      primary,
                  )
                  .expect("base account")
          }

          fn seed_receipt(
              operation: Operation,
          ) -> (
              IdentityRegistry,
              CommandReceipt,
              ProviderIdentity,
              ProviderIdentity,
          ) {
              let mut registry = registry();
              let primary = provider(IdentityProvider::Device, "scope-primary");
              let secondary = provider(IdentityProvider::Email, "scope-secondary@example.invalid");
              let receipt = match operation {
                  Operation::Create => registry
                      .create_account(
                          command(200),
                          fingerprint(200),
                          account(1),
                          Username::new("identity-scope-user").expect("valid username"),
                          DisplayName::new("Identity Scope User").expect("valid display name"),
                          primary.clone(),
                      )
                      .expect("create receipt"),
                  Operation::Authenticate => {
                      create_base(&mut registry, primary.clone());
                      registry
                          .authenticate(command(200), fingerprint(200), &primary)
                          .expect("authenticate receipt")
                  }
                  Operation::Link => {
                      create_base(&mut registry, primary.clone());
                      registry
                          .link_provider(
                              command(200),
                              fingerprint(200),
                              account(1),
                              1,
                              secondary.clone(),
                          )
                          .expect("link receipt")
                  }
                  Operation::Unlink => {
                      create_base(&mut registry, primary.clone());
                      registry
                          .link_provider(
                              command(2),
                              fingerprint(2),
                              account(1),
                              1,
                              secondary.clone(),
                          )
                          .expect("setup link");
                      registry
                          .unlink_provider(
                              command(200),
                              fingerprint(200),
                              account(1),
                              2,
                              &secondary,
                          )
                          .expect("unlink receipt")
                  }
                  Operation::Update => {
                      create_base(&mut registry, primary.clone());
                      registry
                          .update_profile(
                              command(200),
                              fingerprint(200),
                              account(1),
                              1,
                              None,
                              Some(DisplayName::new("Updated").expect("valid display name")),
                          )
                          .expect("update receipt")
                  }
                  Operation::SetStatus => {
                      create_base(&mut registry, primary.clone());
                      registry
                          .set_status(
                              command(200),
                              fingerprint(200),
                              account(1),
                              1,
                              AccountStatus::Disabled,
                          )
                          .expect("status receipt")
                  }
                  Operation::Delete => {
                      create_base(&mut registry, primary.clone());
                      registry
                          .delete_account(command(200), fingerprint(200), account(1), 1)
                          .expect("delete receipt")
                  }
              };
              (registry, receipt, primary, secondary)
          }

          fn attempt(
              registry: &mut IdentityRegistry,
              operation: Operation,
              primary: &ProviderIdentity,
              secondary: &ProviderIdentity,
          ) -> Result<CommandReceipt, IdentityError> {
              match operation {
                  Operation::Create => registry.create_account(
                      command(200),
                      fingerprint(200),
                      account(9),
                      Username::new("attempted-user").expect("valid username"),
                      DisplayName::new("Attempted User").expect("valid display name"),
                      provider(IdentityProvider::Steam, "attempted-steam"),
                  ),
                  Operation::Authenticate => {
                      registry.authenticate(command(200), fingerprint(200), primary)
                  }
                  Operation::Link => registry.link_provider(
                      command(200),
                      fingerprint(200),
                      account(1),
                      1,
                      secondary.clone(),
                  ),
                  Operation::Unlink => registry.unlink_provider(
                      command(200),
                      fingerprint(200),
                      account(1),
                      1,
                      secondary,
                  ),
                  Operation::Update => registry.update_profile(
                      command(200),
                      fingerprint(200),
                      account(1),
                      1,
                      None,
                      Some(DisplayName::new("Attempted Update").expect("valid display name")),
                  ),
                  Operation::SetStatus => registry.set_status(
                      command(200),
                      fingerprint(200),
                      account(1),
                      1,
                      AccountStatus::Banned,
                  ),
                  Operation::Delete => {
                      registry.delete_account(command(200), fingerprint(200), account(1), 1)
                  }
              }
          }

          #[test]
          fn receipt_replay_is_scoped_to_the_exact_public_operation() {
              for stored in Operation::ALL {
                  for attempted in Operation::ALL {
                      let (mut registry, receipt, primary, secondary) = seed_receipt(stored);
                      let snapshot = registry.clone();
                      let result = attempt(&mut registry, attempted, &primary, &secondary);
                      if stored == attempted {
                          assert_eq!(
                              result.expect("same-operation replay must succeed"),
                              receipt,
                              "stored={stored:?}, attempted={attempted:?}"
                          );
                      } else {
                          let error = result.expect_err("cross-operation replay must fail");
                          assert_eq!(
                              error.code(),
                              IdentityErrorCode::Conflict,
                              "stored={stored:?}, attempted={attempted:?}"
                          );
                          assert_eq!(
                              error.reason(),
                              "command_operation_conflict",
                              "stored={stored:?}, attempted={attempted:?}"
                          );
                      }
                      assert_eq!(
                          registry, snapshot,
                          "replay must not mutate: stored={stored:?}, attempted={attempted:?}"
                      );
                  }
              }
          }
          ''',
              encoding="utf-8",
          )

          readme_path = Path("crates/trnm-identity-core/README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old = "Tests cover bounds, operation-scoped exact replay, changed fingerprints, provider and username collisions, stale revisions, last-provider protection, profile changes, account status, terminal deletion, receipt exhaustion and revision overflow. Authentication-specific regressions cover unchanged active replay plus disable, ban, reactivation, deletion, unlink, rebind, revision drift and cross-operation command reuse, with complete no-mutation assertions for every rejection."
          new = "Tests cover bounds, operation-scoped exact replay, changed fingerprints, provider and username collisions, stale revisions, last-provider protection, profile changes, account status, terminal deletion, receipt exhaustion and revision overflow. A 7-by-7 public-operation matrix proves that create, authenticate, link, unlink, profile update, status change and delete receipts replay only through the exact originating API; all 42 cross-operation pairs fail with `command_operation_conflict` and preserve the complete registry. Authentication-specific regressions additionally cover unchanged active replay plus disable, ban, reactivation, deletion, unlink, rebind and revision drift."
          if readme.count(old) != 1:
              raise SystemExit("README test-contract paragraph changed")
          readme_path.write_text(readme.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format and execute focused and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --package trnm-identity-core --all-targets --locked
          cargo clippy --package trnm-identity-core --all-targets --locked -- -D warnings
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-plan.py
          git diff --check

      - name: Commit and fast-forward exact target branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            crates/trnm-identity-core/src/lib.rs \
            crates/trnm-identity-core/tests/receipt_operation_scope.rs \
            crates/trnm-identity-core/README.md
          git diff --cached --check
          git commit -m 'fix(identity): scope receipt replay to exact operation'
          new_head="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse HEAD^{tree})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'published_head=%s\npublished_tree=%s\n' "$new_head" "$new_tree" >> "$GITHUB_STEP_SUMMARY"
