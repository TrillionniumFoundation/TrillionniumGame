name: database-backup-restore

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'rust-toolchain.toml'
      - 'config/database-test-images.json'
      - 'scripts/check-migration-lock.py'
      - 'scripts/seal-outbox-final-attempt.py'
      - 'scripts/verify-actions-log-artifact.py'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/trnm-persistence-pg/**'
      - 'migrations/**'
      - 'scripts/ci-pgwire-backup-restore.sh'
      - 'scripts/check-pgwire-backup-restore.py'
      - 'scripts/postgresql-semantic-snapshot.sql'
      - 'scripts/cockroachdb-semantic-snapshot.sql'
      - 'tests/control_plane/test_pgwire_backup_restore_contract.py'
      - 'scripts/check-authoritative-schema-identity.py'
      - 'scripts/upload-actions-artifact.py'
      - '.github/actions/upload-evidence/**'
      - '.github/workflows/database-backup-restore.yml'

permissions:
  contents: read

concurrency:
  group: database-backup-restore-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    name: database-source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate fail-closed source contract
        run: |
          set -euo pipefail
          python3 scripts/check-pgwire-backup-restore.py
          bash -n scripts/ci-pgwire-backup-restore.sh

  restore:
    name: backup-restore-${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [postgresql, cockroachdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Record Docker environment
        run: |
          set -euo pipefail
          docker version
          docker info
      - name: Execute empty restore and semantic comparison
        env:
          TRNM_EVIDENCE_ROOT: run/backup-restore
          TRNM_RUN_ID: ${{ github.run_id }}-${{ matrix.profile }}
          TRNM_REQUIRE_LIVE_DATABASE: "1"
          TRNM_SCHEMA_SOURCE_COMMIT: ${{ env.CANDIDATE_SHA }}
        run: bash scripts/ci-pgwire-backup-restore.sh '${{ matrix.profile }}'
      - name: Seal exact-head evidence digest in the immutable job log
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          evidence="run/backup-restore/${PROFILE}"
          test -s "$evidence/SHA256SUMS"
          test -s "$evidence/summary.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('run/backup-restore') / os.environ['PROFILE']
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          assert summary['profile'] == os.environ['PROFILE']
          assert summary['backup_created'] is True
          assert summary['empty_restore'] is True
          assert summary['semantic_snapshot_equal'] is True
          assert summary['production_pitr'] is False
          assert summary['multi_node_restore'] is False
          PY
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "run/backup-restore-${PROFILE}.tar.gz" -C "$evidence" .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\nprofile=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID" "$PROFILE"
          sha256sum "run/backup-restore-${PROFILE}.tar.gz"
          python3 - <<'PY_BACKUP_ARCHIVE'
          import hashlib, importlib.util, json, os, subprocess
          from pathlib import Path

          def load(name, relative):
              spec = importlib.util.spec_from_file_location(name, relative)
              assert spec is not None and spec.loader is not None
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module

          uploader = load('backup_archive_uploader', 'scripts/upload-actions-artifact.py')
          migrations = load('backup_archive_migrations', 'scripts/check-migration-lock.py')
          schemas = load('backup_archive_schemas', 'scripts/check-authoritative-schema-identity.py')
          checker = load('backup_archive_shared_verifier', 'scripts/verify-actions-log-artifact.py')
          projection = load('backup_archive_projection', 'scripts/check-pgwire-backup-restore.py')
          profile = os.environ['PROFILE']
          name = f"backup-restore-{profile}-{os.environ['CANDIDATE_SHA']}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          data = uploader.validate_artifact(name, Path(f'run/backup-restore-{profile}.tar.gz'))
          files = checker.archive_files(data)
          assert 'files.sha256' not in files, 'ambiguous backup checksum manifest'
          manifest_view = dict(files)
          manifest_view['files.sha256'] = manifest_view.pop('SHA256SUMS')
          checker.verify_file_manifest(manifest_view)
          identity = schemas.decode_identity_document(files['identity.json'])
          assert identity['schema'] == 'trillionnium.backup-restore-identity.v1'
          assert identity['job_identity_kind'] == 'workflow_job_key_and_matrix_profile'
          actual_head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          actual_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert actual_head == os.environ['CANDIDATE_SHA']
          expected = {
              'repository': os.environ['CANDIDATE_REPOSITORY'], 'commit': actual_head, 'tree': actual_tree,
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_repository': os.environ['GITHUB_REPOSITORY'],
              'workflow': '.github/workflows/database-backup-restore.yml',
              'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'], 'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'],
              'job': os.environ['GITHUB_JOB'], 'job_name': 'backup-restore-' + profile, 'profile': profile,
          }
          assert all(identity[key] == value for key, value in expected.items()), 'backup archive producer identity differs'
          for flag in ('compatibility_credit', 'accepted_evidence', 'production_ready'):
              assert identity[flag] is False
          chains, version, table_count = schemas.validated_source()
          fresh = schemas.decode_identity_document(files['schema-identity.json'])
          restored = schemas.decode_identity_document(files['restored-schema-identity.json'])
          schemas.validate_identity(fresh, profile=profile, chains=chains, schema_version=version,
                                    table_count=table_count, mode='fresh', source_commit=actual_head)
          schemas.validate_identity(restored, profile=profile, chains=chains, schema_version=version,
                                    table_count=table_count, mode='verify')
          assert all(restored[key] == fresh[key] == identity[key] for key in ('source_commit', 'upgrade_source_commit', 'v2_apply_source_commit', 'v3_apply_source_commit'))
          assert all(fresh[key] == identity[key] for key in ('schema_version', 'storage_writer_epoch', 'chain_digest', 'digest_algorithm'))
          assert fresh['schema_version'] == 4 and fresh['storage_writer_epoch'] == 4
          source_v3 = projection.validate_storage_snapshot_bytes(files['source-storage-v3.txt'], profile, fresh, 'restore')
          restored_v3 = projection.validate_storage_snapshot_bytes(files['restored-storage-v3.txt'], profile, restored, 'restore')
          assert source_v3 == restored_v3 == schemas.decode_identity_document(files['storage-v3-snapshot-check.json'])
          assert files['source-storage-v3.txt'] == files['restored-storage-v3.txt']
          assert files['source.csv'] == files['restored.csv']
          check = {'schema': 'trillionnium.authoritative-schema-identity-check.v1', 'profile': profile,
                   'schema_version': version, 'chain_digest': fresh['chain_digest'],
                   'identity_verified': True, 'compatibility_credit': False}
          for path in ('schema-identity-check.json', 'restored-schema-identity-check.json'):
              assert schemas.decode_identity_document(files[path]) == check
          summary = schemas.decode_identity_document(files['summary.json'])
          assert summary['schema'] == 'trillionnium.backup-restore.v1' and summary['profile'] == profile
          assert all(summary[key] is True for key in ('backup_created', 'empty_restore', 'semantic_snapshot_equal'))
          assert all(summary[key] is False for key in ('production_pitr', 'multi_node_restore'))
          assert summary['schema_version'] == summary['storage_writer_epoch'] == summary['authoritative_migration_file_count'] == 4
          assert summary['storage_v3_fixture_count'] == source_v3['storage_fixture_count'] == 4
          lock = migrations.load_lock()
          assert len(lock['profiles'][profile]['ordered_files']) == 4
          assert files['migration-lock.json'] == Path('migrations/MIGRATION_CHAIN.lock.json').read_bytes()
          checker.verify_migration_files(files, lock['profiles'][profile]['ordered_files'])
          validation = migrations.validate()
          assert schemas.decode_identity_document(files['migration-chain-validation.json']) == validation
          checked = {'schema': 'trillionnium.backup-restore-archive-check.v1', 'profile': profile,
                     'commit': actual_head, 'tree': actual_tree, 'file_count': len(files),
                     'sha256': hashlib.sha256(data).hexdigest(), 'size_bytes': len(data), 'identity': identity,
                     'checksum_inventory_complete': True, 'archive_verified': True,
                     'compatibility_credit': False, 'accepted_evidence': False}
          document = json.dumps(checked, sort_keys=True, separators=(',', ':'))
          Path(f'run/backup-restore-{profile}-archive-check.json').write_text(document + '\n')
          print(document)
          PY_BACKUP_ARCHIVE
          cat "$evidence/summary.json"
          cat "$evidence/snapshot-sha256.txt"
          cat "$evidence/SHA256SUMS"
      - name: Retain exact-head backup restore profile packet
        id: retained-backup-profile
        uses: ./.github/actions/upload-evidence
        with:
          name: backup-restore-${{ matrix.profile }}-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/backup-restore-${{ matrix.profile }}.tar.gz
          mime_type: application/gzip
      - name: Verify retained backup restore profile receipt
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          ARTIFACT_ID: ${{ steps.retained-backup-profile.outputs.artifact_id }}
          RETAINED_SHA256: ${{ steps.retained-backup-profile.outputs.sha256 }}
          RETAINED_SIZE_BYTES: ${{ steps.retained-backup-profile.outputs.size_bytes }}
        run: |
          set -euo pipefail
          python3 - <<'PY_BACKUP_RECEIPT'
          import hashlib, importlib.util, json, os, re, subprocess
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('backup_receipt_uploader', 'scripts/upload-actions-artifact.py')
          assert spec is not None and spec.loader is not None
          uploader = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(uploader)
          profile = os.environ['PROFILE']
          name = f"backup-restore-{profile}-{os.environ['CANDIDATE_SHA']}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          archive = Path(f'run/backup-restore-{profile}.tar.gz')
          data = uploader.validate_artifact(name, archive)
          artifact_id = uploader._artifact_id(os.environ['ARTIFACT_ID'])
          digest = hashlib.sha256(data).hexdigest()
          assert os.environ['RETAINED_SHA256'] == digest, 'retained backup digest differs'
          size = os.environ['RETAINED_SIZE_BYTES']
          assert re.fullmatch(r'[1-9][0-9]*', size) and int(size) == len(data), 'retained backup byte length differs'
          check_spec = importlib.util.spec_from_file_location('backup_receipt_schemas', 'scripts/check-authoritative-schema-identity.py')
          assert check_spec is not None and check_spec.loader is not None
          schemas = importlib.util.module_from_spec(check_spec)
          check_spec.loader.exec_module(schemas)
          checked = schemas.decode_identity_document(Path(f'run/backup-restore-{profile}-archive-check.json').read_bytes())
          assert checked['schema'] == 'trillionnium.backup-restore-archive-check.v1'
          assert checked['archive_verified'] is True and checked['checksum_inventory_complete'] is True
          assert checked['sha256'] == digest and checked['size_bytes'] == len(data), 'backup archive changed after validation'
          identity = checked['identity']
          expected = {'repository': os.environ['CANDIDATE_REPOSITORY'], 'commit': os.environ['CANDIDATE_SHA'],
                      'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                      'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'workflow_repository': os.environ['GITHUB_REPOSITORY'], 'workflow_ref': os.environ['GITHUB_WORKFLOW_REF'],
                      'workflow_sha': os.environ['GITHUB_WORKFLOW_SHA'], 'job': os.environ['GITHUB_JOB'], 'profile': profile}
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['CANDIDATE_SHA']
          assert all(identity[key] == value for key, value in expected.items()), 'retained backup producer identity differs'
          assert all(identity[key] is False for key in ('compatibility_credit', 'accepted_evidence', 'production_ready'))
          receipt = {'schema': 'trillionnium.backup-restore-retention-receipt.v1',
                     'artifact_id': artifact_id, 'name': name, 'sha256': digest, 'size_bytes': len(data),
                     'repository': identity['repository'], 'commit': identity['commit'], 'tree': identity['tree'],
                     'run_id': identity['run_id'], 'run_attempt': identity['run_attempt'],
                     'workflow': identity['workflow'], 'job': identity['job'], 'profile': profile,
                     'workflow_repository': identity['workflow_repository'], 'workflow_ref': identity['workflow_ref'],
                     'workflow_sha': identity['workflow_sha'], 'job_name': identity['job_name'],
                     'source_commit': identity['source_commit'], 'upgrade_source_commit': identity['upgrade_source_commit'], 'v2_apply_source_commit': identity['v2_apply_source_commit'], 'v3_apply_source_commit': identity['v3_apply_source_commit'],
                     'schema_version': identity['schema_version'], 'storage_writer_epoch': identity['storage_writer_epoch'],
                     'chain_digest': identity['chain_digest'], 'digest_algorithm': identity['digest_algorithm'],
                     'compatibility_credit': False, 'accepted_evidence': False, 'production_ready': False}
          document = json.dumps(receipt, sort_keys=True, separators=(',', ':'))
          Path(f'run/backup-restore-{profile}-retention-receipt.json').write_text(document + '\n')
          print(document)
          PY_BACKUP_RECEIPT
