name: temporary-materialize-denominator-review-package

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  actions: read
  contents: write

concurrency:
  group: temporary-materialize-denominator-review-package
  cancel-in-progress: false

jobs:
  generate-review-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Install and validate review-package tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/temporary_install_denominator_review_package.py
          python3 -m py_compile \
            tools/denominator/source_manifest.py \
            tools/denominator/review_request.py \
            scripts/generate-source-denominator.py \
            scripts/build-denominator-review-request.py
          python3 -m json.tool config/denominator-gates.json >/dev/null
          python3 -m json.tool config/denominator-review-routing.json >/dev/null
          python3 -m unittest \
            tests.denominator.test_source_denominator \
            tests.denominator.test_review_request -v
          git diff --check

      - name: Fetch exact Nakama and Nakama Common trees
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fetch-pinned-upstream.py \
            --repository heroiclabs/nakama \
            --revision d4d92f93f78bbbe62c7fc50a3f85c772ec121a09 \
            --tree f3c9cfc2726d5543da1564629170f35b98e3797d \
            --output run/nakama
          python3 scripts/fetch-pinned-upstream.py \
            --repository heroiclabs/nakama-common \
            --revision 449b77ecc8789aa466c36b67f6e498033dfcd9c5 \
            --tree c6a7b9796b9c2a6b5118c74e5f213963a5001f14 \
            --output run/common

      - name: Generate thirteen upstream surface candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/candidates
          python3 scripts/generate-api-rtapi-denominator.py \
            --fetch \
            --source-dir run/api-upstream \
            --output-dir run/candidates
          python3 scripts/generate-config-cli-denominator.py \
            --nakama-dir run/nakama \
            --output-dir run/candidates
          python3 scripts/generate-database-denominator.py \
            --nakama-dir run/nakama \
            --output-dir run/candidates
          python3 scripts/generate-runtime-denominator.py \
            --nakama-dir run/nakama \
            --common-dir run/common \
            --output-dir run/candidates
          python3 tools/denominator/typescript_runtime_surface.py \
            --common-dir run/common \
            --output-dir run/candidates
          python3 scripts/generate-remaining-denominators.py \
            --source-dir run/nakama \
            --output-dir run/candidates

          python3 - <<'PY'
          import json
          import os
          import subprocess

          registry_path = 'config/sdk-source-snapshots.json'
          for profile in json.load(open(registry_path, encoding='utf-8'))['profiles']:
              archive_tree = profile.get('archive_tree', profile['tree'])
              repairs = profile.get('archive_repairs', [])
              output = f"run/sdks/{profile['id']}"
              command = [
                  'python3', 'scripts/fetch-pinned-upstream.py',
                  '--repository', profile['repository'],
                  '--revision', profile['commit'],
                  '--tree', archive_tree,
                  '--output', output,
              ]
              for gitlink in profile.get('gitlinks', []):
                  command.extend(['--gitlink', f"{gitlink['path']}={gitlink['commit']}"])
              subprocess.run(command, check=True)
              if repairs:
                  subprocess.run(
                      [
                          'python3', 'scripts/repair-pinned-github-archive.py',
                          '--registry', registry_path,
                          '--profile', profile['id'],
                          '--root', output,
                      ],
                      check=True,
                  )
          PY
          python3 scripts/generate-sdk-denominator.py \
            --registry config/sdk-source-snapshots.json \
            --sdk-root run/sdks \
            --nakama-root run/nakama \
            --common-root run/common \
            --output run/candidates/sdk-denominator.candidate.json

      - name: Generate DEN-SOURCE and require fourteen exact candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-source-denominator.py \
            --output run/candidates/source-denominator.candidate.json
          test "$(find run/candidates -maxdepth 1 -name '*-denominator.candidate.json' | wc -l)" -eq 14
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('run/candidates').glob('*-denominator.candidate.json'))
          denominators = set()
          total = 0
          for path in files:
              value = json.loads(path.read_text(encoding='utf-8'))
              denominator = value['denominator']
              assert denominator not in denominators, denominator
              denominators.add(denominator)
              assert value['leaf_count'] == len(value['leaves']) > 0
              assert value['unclassified_count'] == value['leaf_count']
              total += value['leaf_count']
          assert len(denominators) == 14
          assert total >= 10000, total
          print(f'candidate_denominators={len(denominators)} total_leaves={total}')
          PY

      - name: Seal candidate bundle and construct exact job-log evidence index
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/denominator-candidates-${GITHUB_SHA}.tar.gz \
            -C run/candidates .
          archive_sha=$(sha256sum run/denominator-candidates-${GITHUB_SHA}.tar.gz | awk '{print $1}')
          job_id=$(python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = (
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/jobs?per_page=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              value = json.load(response)
          matches = [job for job in value['jobs'] if job['name'] == 'generate-review-package']
          if len(matches) != 1:
              raise SystemExit(f'expected one current job, got {matches!r}')
          print(matches[0]['id'])
          PY
          )
          export ARCHIVE_SHA="$archive_sha" JOB_ID="$job_id"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = {}
          for path in sorted(Path('run/candidates').glob('*-denominator.candidate.json')):
              value = json.loads(path.read_text(encoding='utf-8'))
              denominator = value['denominator']
              manual = value.get('manual_contracts', [])
              rows[denominator] = {
                  'evidence_kind': 'immutable-job-log',
                  'head_sha': os.environ['GITHUB_SHA'],
                  'pull_request': 42,
                  'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
                  'job_id': int(os.environ['JOB_ID']),
                  'job_name': 'generate-review-package',
                  'conclusion': 'success',
                  'archive_sha256': 'sha256:' + os.environ['ARCHIVE_SHA'],
                  'assertion_count': value['leaf_count'] + len(manual) + 1,
                  'log_sealed': True,
              }
          output = {
              'schema': 'trillionnium.denominator-remote-evidence-index.v1',
              'project_id': 'trillionnium-game',
              'candidate_head': os.environ['GITHUB_SHA'],
              'candidate_archive_sha256': 'sha256:' + os.environ['ARCHIVE_SHA'],
              'denominators': rows,
              'claims': {
                  'independent_review_completed': False,
                  'sg1_complete': False,
                  'compatibility_credit': False,
              },
          }
          Path('run/remote-evidence-index.json').write_text(
              json.dumps(output, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\njob_id=%s\narchive_sha256=sha256:%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$job_id" "$archive_sha"
          find run/candidates -type f -print0 | sort -z | xargs -0 sha256sum

      - name: Build deterministic per-leaf independent review requests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf manifests/upstream/candidates manifests/upstream/review-requests
          cp run/remote-evidence-index.json manifests/upstream/remote-evidence-index.json
          candidate_args=()
          while IFS= read -r -d '' path; do
            candidate_args+=(--candidate "$path")
          done < <(find run/candidates -maxdepth 1 -name '*-denominator.candidate.json' -print0 | sort -z)
          python3 scripts/build-denominator-review-request.py \
            "${candidate_args[@]}" \
            --head-sha "$GITHUB_SHA" \
            --remote-index run/remote-evidence-index.json \
            --output-dir manifests/upstream
          find manifests/upstream/candidates manifests/upstream/review-requests \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            > manifests/upstream/REVIEW_PACKAGE_SHA256SUMS

      - name: Validate complete package and fail-closed claims
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('manifests/upstream')
          worklist = json.loads((root / 'denominator-review-worklist.json').read_text())
          assert worklist['candidate_count'] == 14
          assert worklist['required_denominator_count'] == 14
          assert worklist['total_leaf_count'] >= 10000
          assert worklist['manual_blocker_count'] > 0
          assert worklist['claims']['all_candidates_materialized'] is True
          assert worklist['claims']['all_leaves_have_conservative_proposals'] is True
          assert worklist['claims']['independent_review_completed'] is False
          assert worklist['claims']['all_denominators_reviewed_locked'] is False
          assert worklist['claims']['sg1_complete'] is False
          assert len(list((root / 'candidates').glob('*.candidate.json'))) == 14
          requests = list((root / 'review-requests').glob('*.review-request.json'))
          assert len(requests) == 14
          for path in requests:
              value = json.loads(path.read_text())
              template = value['review_bundle_template']
              assert template['reviewers'] == []
              assert template['self_approval'] is False
              assert template['remote_evidence']['head_sha'] == worklist['candidate_head']
              assert template['remote_evidence']['log_sealed'] is True
              assert all(
                  row['classification'] == 'mandatory'
                  and row['reviewer_ids'] == []
                  and row['proposal_only'] is True
                  for row in template['leaf_decisions']
              )
          PY
          sha256sum --check manifests/upstream/REVIEW_PACKAGE_SHA256SUMS
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --check

      - name: Commit exact candidates and review worklist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add \
            config/denominator-gates.json \
            config/denominator-review-routing.json \
            tools/denominator/source_manifest.py \
            tools/denominator/review_request.py \
            scripts/generate-source-denominator.py \
            scripts/build-denominator-review-request.py \
            tests/denominator/test_source_denominator.py \
            tests/denominator/test_review_request.py \
            docs/development/DENOMINATOR_REVIEW_REQUEST_PACKAGE.md \
            manifests/upstream/candidates \
            manifests/upstream/review-requests \
            manifests/upstream/remote-evidence-index.json \
            manifests/upstream/denominator-review-worklist.json \
            manifests/upstream/REVIEW_PACKAGE_SHA256SUMS
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(sg1): materialize complete denominator review worklist"
          git push origin "HEAD:${GITHUB_REF_NAME}"
