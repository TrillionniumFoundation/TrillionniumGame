name: pr104-recovery-state-repair

on:
  push:
    branches:
      - codex/realtime-recovery-wave-2026-09-07
    paths:
      - scripts/one_shot_pr104_recovery_state_repair.py
      - .github/workflows/pr104-recovery-state-repair.yml

permissions:
  contents: write

concurrency:
  group: pr104-recovery-state-repair
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/realtime-recovery-wave-2026-09-07

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          observed="$(git -C "$GITHUB_WORKSPACE" ls-remote origin \
            "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD

      - name: Apply and format bounded state repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/one_shot_pr104_recovery_state_repair.py
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml
          git diff --check
          actual="$(git diff --name-only | sort | paste -sd, -)"
          expected=".github/workflows/pr104-recovery-state-repair.yml,crates/trnm-presence-router-v2/src/connection_actor.rs,crates/trnm-presence-router-v2/src/disconnect_journal.rs,crates/trnm-presence-router-v2/src/lib.rs,scripts/one_shot_pr104_recovery_state_repair.py"
          test "$actual" = "$expected"

      - name: Form and validate unpushed final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name trillionnium-recovery-bot
          git config user.email trillionnium-recovery-bot@users.noreply.github.com
          git add -A
          git commit -m "fix(realtime): fence request reuse and bound reconciliation"
          test -z "$(git status --porcelain)"
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-presence-router-v2/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets -- -D warnings

      - name: Publish exact tested tree without force
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
