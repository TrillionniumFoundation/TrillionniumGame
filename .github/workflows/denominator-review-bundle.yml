name: denominator-review-bundle

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/development/PARITY_DENOMINATORS.json'
      - 'docs/COMPATIBILITY.md'
      - 'docs/TESTING_AND_EVIDENCE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'docs/evidence/schemas/denominator-review-bundle-v1.schema.json'
      - 'manifests/upstream/**'
      - 'scripts/check-denominator-review-bundle.py'
      - '.github/workflows/denominator-review-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denominator-review-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate-current-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate current denominator review authority
        run: |
          set -euo pipefail
          grep -q 'SG1 remains incomplete until every family and the global bundle are independently accepted and locked' docs/COMPATIBILITY.md
          grep -q 'Review expires on head change' docs/TESTING_AND_EVIDENCE.md
      - name: Validate registry and optional review bundle
        run: |
          set -euo pipefail
          python3 scripts/check-denominator-review-bundle.py \
            | tee denominator-review-result.json
          jq -e '
            .claims.compatibility_credit == false and
            .claims.production_ready == false
          ' denominator-review-result.json >/dev/null
      - name: Require the strict SG1 path to fail while incomplete
        run: |
          set -euo pipefail
          if jq -e '.claims.sg1_eligible == true' denominator-review-result.json >/dev/null; then
            python3 scripts/check-denominator-review-bundle.py --require-sg1
          else
            if python3 scripts/check-denominator-review-bundle.py --require-sg1; then
              echo 'incomplete denominator bundle incorrectly received SG1 eligibility' >&2
              exit 1
            fi
          fi
