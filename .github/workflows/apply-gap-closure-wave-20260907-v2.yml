name: apply-gap-closure-wave-20260907-v2

on:
  push:
    branches:
      - tooling/outbox-evidence-sealing-assets-2026-09-07a
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: apply-gap-closure-wave-20260907-v2
  cancel-in-progress: false

env:
  BASE_SHA: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
  TARGET_BRANCH: tooling/outbox-evidence-sealing-assets-2026-09-07a

jobs:
  materialize-validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact current review surface
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "$GITHUB_SHA" "$BASE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Extract transformer and remove temporary execution files
        shell: bash
        run: |
          set -euo pipefail
          transformer_commit=$(git log -n 1 --format=%H -- \
            tools/apply-gap-closure-wave-20260907.py)
          test -n "$transformer_commit"
          git show "$transformer_commit:tools/apply-gap-closure-wave-20260907.py" \
            > "$RUNNER_TEMP/apply-gap-closure-wave.py"
          python3 -m py_compile "$RUNNER_TEMP/apply-gap-closure-wave.py"
          rm -f \
            .github/workflows/apply-gap-closure-wave-20260907.yml \
            .github/workflows/apply-gap-closure-wave-20260907-v2.yml \
            tools/apply-gap-closure-wave-20260907.py \
            tooling/outbox-evidence-sealing/RELEASE_TRANSFER.md \
            tooling/outbox-evidence-sealing/TRANSFER_ATTEMPT.md \
            tooling/outbox-evidence-sealing/TRANSFER_DEBUG.md

      - name: Materialize and validate clean target tree
        id: validate
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python3 "$RUNNER_TEMP/apply-gap-closure-wave.py" "$GITHUB_WORKSPACE"
            jq -e '
              .family_count == 14 and
              .leaf_count == 10173 and
              .unclassified_count == 0 and
              .accepted == false and
              .gap_closed == false and
              .sg1_credit == false and
              .production_ready == false
            ' docs/status/DENOMINATOR_CLASSIFICATION_CANDIDATE.json >/dev/null
            jq -e '
              .eligible_reviewer_count == 1 and
              .policy_minimum_eligible_reviewers == 2 and
              .capacity_satisfied == false and
              (.domains | length) == 6 and
              all(.domains[]; .status == "blocked-reviewer-capacity" and .accepted == false)
            ' docs/status/REVIEWER_CAPACITY.json >/dev/null
            python3 -m compileall -q scripts tools tests
            python3 -m unittest discover -s tests -p 'test_*.py' -v
            python3 scripts/check-plan.py
            python3 scripts/check-status-transitions.py
            python3 scripts/derive-gates.py
            python3 scripts/check-documentation-authority.py
            python3 scripts/check-workflow-action-policy.py
            python3 scripts/check-repository-hygiene.py
            git diff --check
          } 2>&1 | tee "$RUNNER_TEMP/wave-validation.log"

      - name: Publish one fast-forward target-tree commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          # Reject any attempted truth promotion by this mechanical wave.
          ! git diff --cached -- docs/status/GAP_REGISTER.json \
            docs/status/PRODUCT_GATES.json docs/evidence/index.json \
            | grep -E '^\+.*("status"[[:space:]]*:[[:space:]]*"closed"|"accepted"[[:space:]]*:[[:space:]]*true|"production_ready"[[:space:]]*:[[:space:]]*true)'
          current=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          test "$current" = "$GITHUB_SHA"
          tree=$(git write-tree)
          commit=$(printf '%s\n' \
            'control-plane: materialize conservative scope and reviewer blockers' \
            | git commit-tree "$tree" -p "$GITHUB_SHA")
          git push origin "$commit:refs/heads/$TARGET_BRANCH"
          printf 'published_commit=%s\n' "$commit" | tee "$RUNNER_TEMP/published.env"

      - name: Report exact failure without promotion
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wave-validation.log"
          if [[ -f "$log" ]]; then
            tail -n 120 "$log" > "$RUNNER_TEMP/failure-tail.txt"
          else
            printf 'failure occurred before validation log creation\n' \
              > "$RUNNER_TEMP/failure-tail.txt"
          fi
          body=$(cat <<EOF
          Gap-closure wave v2 failed on tooling commit \`$GITHUB_SHA\`. No product, evidence, gap, SG1, compatibility or production credit was granted.

          <details><summary>Failing tail</summary>

          \`\`\`
          $(cat "$RUNNER_TEMP/failure-tail.txt")
          \`\`\`
          </details>
          EOF
          )
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/93/comments" \
            --raw-field body="$body"
