name: native-workflow-migration-autofix

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29
    paths:
      - '.github/workflows/native-workflow-migration-autofix.yml'

permissions:
  contents: write

concurrency:
  group: native-workflow-migration-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: feat/plan-v3-gap-closure-2026-08-29
      EXPECTED_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact feature head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Convert bounded workflow set
        run: python3 scripts/migrate-new-workflows-native.py
      - name: Validate policy and syntax contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-workflow-action-policy.py
          python3 -m py_compile scripts/migrate-new-workflows-native.py
          git diff --check
      - name: Commit converted workflow definitions
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          test -n "$changed"
          printf '%s\n' "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '.github/workflows/*.yml' '.github/workflows/*.yaml'
          git diff --cached --check
          git commit -m 'fix(ci): migrate new workflows to native exact-head execution'
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${BRANCH}"
