name: temporary-pg-query-deadline-closure

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: trillionnium-plan-v3-single-writer
  cancel-in-progress: false

jobs:
  implement-prove-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Fetch and stabilize exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          sleep 90
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - name: Add transport-aware cancellation and deadline supervisor
        shell: bash
        run: |
          set -euo pipefail
          cat > crates/trnm-persistence-pg/src/deadline.rs <<'RUST'
          use std::fmt;
          use std::sync::atomic::{AtomicBool, Ordering};
          use std::sync::{mpsc, Arc};
          use std::thread;
          use std::time::Duration;

          use postgres::{CancelToken, Client, NoTls};
          use postgres_native_tls::MakeTlsConnector;
          use trnm_contracts::{DomainError, RetryClass, StableCode};

          use super::PgRepository;

          #[derive(Clone)]
          pub(crate) enum PgCancelTransport {
              Plaintext,
              Tls(MakeTlsConnector),
          }

          impl PgCancelTransport {
              fn cancel(&self, token: &CancelToken) -> Result<(), postgres::Error> {
                  match self {
                      Self::Plaintext => token.cancel_query(NoTls),
                      Self::Tls(connector) => token.cancel_query(connector.clone()),
                  }
              }

              const fn name(&self) -> &'static str {
                  match self {
                      Self::Plaintext => "plaintext",
                      Self::Tls(_) => "tls",
                  }
              }
          }

          impl fmt::Debug for PgCancelTransport {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_tuple("PgCancelTransport")
                      .field(&self.name())
                      .finish()
              }
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct PgDeadlinePolicy {
              timeout: Duration,
          }

          impl PgDeadlinePolicy {
              pub fn new(timeout: Duration) -> Result<Self, DomainError> {
                  if timeout.is_zero() || timeout > Duration::from_secs(10 * 60) {
                      return Err(invalid("database_query_deadline_policy_invalid"));
                  }
                  Ok(Self { timeout })
              }

              #[must_use]
              pub const fn timeout(self) -> Duration {
                  self.timeout
              }
          }

          #[derive(Clone, Copy, Debug, Default, Eq, PartialEq)]
          pub struct PgDeadlineReport {
              pub timed_out: bool,
              pub cancel_requested: bool,
              pub cancel_failed: bool,
          }

          impl PgRepository {
              pub fn execute_with_deadline<T>(
                  &mut self,
                  policy: PgDeadlinePolicy,
                  operation: impl FnOnce(&mut Client) -> Result<T, postgres::Error>,
              ) -> Result<T, DomainError> {
                  let timed_out = Arc::new(AtomicBool::new(false));
                  let cancel_requested = Arc::new(AtomicBool::new(false));
                  let cancel_failed = Arc::new(AtomicBool::new(false));
                  let worker_timed_out = Arc::clone(&timed_out);
                  let worker_cancel_requested = Arc::clone(&cancel_requested);
                  let worker_cancel_failed = Arc::clone(&cancel_failed);
                  let cancel_token = self.client.cancel_token();
                  let cancel_transport = self.cancel_transport.clone();
                  let (finished_sender, finished_receiver) = mpsc::sync_channel::<()>(0);

                  let watchdog = thread::Builder::new()
                      .name("trnm-pg-query-deadline".to_owned())
                      .spawn(move || match finished_receiver.recv_timeout(policy.timeout) {
                          Ok(()) | Err(mpsc::RecvTimeoutError::Disconnected) => {}
                          Err(mpsc::RecvTimeoutError::Timeout) => {
                              worker_timed_out.store(true, Ordering::Release);
                              worker_cancel_requested.store(true, Ordering::Release);
                              if cancel_transport.cancel(&cancel_token).is_err() {
                                  worker_cancel_failed.store(true, Ordering::Release);
                              }
                          }
                      })
                      .map_err(|_| operational("database_query_watchdog_spawn_failed"))?;

                  let operation_result = operation(&mut self.client);
                  let _ = finished_sender.send(());
                  watchdog
                      .join()
                      .map_err(|_| operational("database_query_watchdog_panicked"))?;

                  let report = PgDeadlineReport {
                      timed_out: timed_out.load(Ordering::Acquire),
                      cancel_requested: cancel_requested.load(Ordering::Acquire),
                      cancel_failed: cancel_failed.load(Ordering::Acquire),
                  };
                  if report.cancel_failed {
                      return Err(operational("database_query_cancel_request_failed"));
                  }
                  if report.timed_out {
                      return Err(DomainError::new(
                          StableCode::Unavailable,
                          "database_query_deadline_exceeded",
                          RetryClass::SafeBackoff,
                      ));
                  }
                  operation_result.map_err(super::map_postgres_error)
              }
          }

          fn invalid(reason: &'static str) -> DomainError {
              DomainError::new(StableCode::InvalidArgument, reason, RetryClass::Never)
          }

          fn operational(reason: &'static str) -> DomainError {
              DomainError::new(
                  StableCode::Unavailable,
                  reason,
                  RetryClass::SafeBackoff,
              )
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn deadline_policy_is_bounded() {
                  assert_eq!(
                      PgDeadlinePolicy::new(Duration::ZERO)
                          .unwrap_err()
                          .reason(),
                      "database_query_deadline_policy_invalid"
                  );
                  assert_eq!(
                      PgDeadlinePolicy::new(Duration::from_secs(601))
                          .unwrap_err()
                          .reason(),
                      "database_query_deadline_policy_invalid"
                  );
                  assert_eq!(
                      PgDeadlinePolicy::new(Duration::from_millis(250))
                          .unwrap()
                          .timeout(),
                      Duration::from_millis(250)
                  );
              }

              #[test]
              fn transport_debug_does_not_contain_tls_material() {
                  assert_eq!(format!("{:?}", PgCancelTransport::Plaintext),
                      "PgCancelTransport(\"plaintext\")");
              }
          }
          RUST

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')
          lib = root / 'crates/trnm-persistence-pg/src/lib.rs'
          text = lib.read_text(encoding='utf-8')
          if 'mod deadline;' not in text:
              marker = '#![forbid(unsafe_code)]\n\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'{lib}: crate root marker missing or ambiguous')
              text = text.replace(marker, marker + 'mod deadline;\n', 1)
          if 'pub use deadline::' not in text:
              anchor = 'mod deadline;\n'
              text = text.replace(
                  anchor,
                  anchor + 'pub use deadline::{PgDeadlinePolicy, PgDeadlineReport};\n\n',
                  1,
              )
          if 'cancel_transport:' not in text:
              pattern = re.compile(
                  r'(pub struct PgRepository \{\s*profile: DatabaseProfile,\s*client: [^,\n]+,)(\s*\})',
                  re.MULTILINE,
              )
              text, count = pattern.subn(
                  r'\1\n    pub(crate) cancel_transport: deadline::PgCancelTransport,\2',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'{lib}: PgRepository field anchor missing')
          if 'cancel_transport: deadline::PgCancelTransport::Plaintext' not in text:
              pattern = re.compile(
                  r'Ok\(Self \{\s*profile,\s*client:\s*([^,}\n]+),?\s*\}\)',
                  re.MULTILINE,
              )
              match = pattern.search(text)
              if not match:
                  pattern = re.compile(
                      r'Ok\(Self \{\s*profile,\s*client\s*\}\)',
                      re.MULTILINE,
                  )
                  match = pattern.search(text)
              if not match:
                  raise SystemExit(f'{lib}: direct repository constructor anchor missing')
              original = match.group(0)
              replacement = original[:-2].rstrip()
              if replacement.endswith('}'):
                  replacement = replacement[:-1].rstrip()
              replacement += ',\n            cancel_transport: deadline::PgCancelTransport::Plaintext,\n        })'
              text = text[:match.start()] + replacement + text[match.end():]
          lib.write_text(text, encoding='utf-8')

          pool = root / 'crates/trnm-persistence-pg/src/pool.rs'
          source = pool.read_text(encoding='utf-8')
          if 'use super::deadline::PgCancelTransport;' not in source:
              anchor = 'use super::{DatabaseProfile, PgRepository};\n'
              if anchor not in source:
                  raise SystemExit(f'{pool}: super import anchor missing')
              source = source.replace(
                  anchor,
                  'use super::deadline::PgCancelTransport;\n' + anchor,
                  1,
              )
          source = source.replace(
              '    Tls(Pool<TlsManager>),',
              '    Tls {\n        pool: Pool<TlsManager>,\n        connector: MakeTlsConnector,\n    },',
          )
          source = source.replace(
              '            inner: PoolInner::Tls(pool),',
              '            inner: PoolInner::Tls { pool, connector },',
          )
          source = source.replace(
              '            PoolInner::Tls(pool) => pool\n                .get_timeout(self.policy.acquire_timeout)\n                .map(ClientHandle::Tls),',
              '''            PoolInner::Tls { pool, .. } => pool
                .get_timeout(self.policy.acquire_timeout)
                .map(ClientHandle::Tls),''',
          )
          source = source.replace(
              '            PoolInner::Tls(pool) => (pool.max_size(), pool.state()),',
              '            PoolInner::Tls { pool, .. } => (pool.max_size(), pool.state()),',
          )
          source = source.replace(
              '            PoolInner::Tls(_) => "tls-verify-full",',
              '            PoolInner::Tls { .. } => "tls-verify-full",',
          )
          if 'connector.clone()' not in source:
              source = source.replace(
                  '        let manager = PostgresConnectionManager::new(database, tls.connector()?);',
                  '''        let connector = tls.connector()?;
        let manager = PostgresConnectionManager::new(database, connector.clone());''',
                  1,
              )
          if 'cancel_transport' not in source.split('pub fn acquire', 1)[1]:
              old = '''        let handle = match &self.inner {
            PoolInner::Plain(pool) => pool
                .get_timeout(self.policy.acquire_timeout)
                .map(ClientHandle::Plain),
            PoolInner::Tls { pool, .. } => pool
                .get_timeout(self.policy.acquire_timeout)
                .map(ClientHandle::Tls),
        }
        .map_err(|_| {'''
              new = '''        let (handle, cancel_transport) = match &self.inner {
            PoolInner::Plain(pool) => (
                pool.get_timeout(self.policy.acquire_timeout)
                    .map(ClientHandle::Plain),
                PgCancelTransport::Plaintext,
            ),
            PoolInner::Tls { pool, connector } => (
                pool.get_timeout(self.policy.acquire_timeout)
                    .map(ClientHandle::Tls),
                PgCancelTransport::Tls(connector.clone()),
            ),
        };
        let handle = handle.map_err(|_| {'''
              if old not in source:
                  raise SystemExit(f'{pool}: acquire match anchor missing')
              source = source.replace(old, new, 1)
              source = source.replace(
                  '''        let mut repository = PgRepository {
            profile: self.profile,
            client: handle,
        };''',
                  '''        let mut repository = PgRepository {
            profile: self.profile,
            client: handle,
            cancel_transport,
        };''',
                  1,
              )
          pool.write_text(source, encoding='utf-8')

          doc = root / 'docs/development/PG_OPERATIONAL_CONTROLS.md'
          existing = doc.read_text(encoding='utf-8') if doc.exists() else '# PG operational controls\n'
          section = '''

## In-flight query cancellation

Every acquired repository carries a transport-matched PostgreSQL cancellation channel. A bounded
watchdog uses the server-issued `CancelToken` after the request deadline, supports both plaintext
CI and verify-full TLS connectors, waits for the operation to unwind, and returns a stable
`database_query_deadline_exceeded` or cancellation-channel failure. The mechanism complements the
session `statement_timeout`; it does not replace application request budgets or independent fault
review.
'''
          if '## In-flight query cancellation' not in existing:
              doc.write_text(existing.rstrip() + section, encoding='utf-8')

          inventory_path = root / 'docs/status/IMPLEMENTATION_INVENTORY.json'
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          for component in inventory.get('components', []):
              if component.get('id') in {'COMP-PERSISTENCE-PG', 'COMP-TRNM-SERVER'}:
                  fact = 'transport-aware PostgreSQL cancel-token watchdog with bounded in-flight query deadline'
                  implemented = component.setdefault('implemented', [])
                  if fact not in implemented:
                      implemented.append(fact)
                  missing = component.setdefault('missing', [])
                  for stale in (
                      'pool, TLS and cancellation of an in-flight blocking database operation',
                      'pool/TLS/in-flight cancellation',
                  ):
                      if stale in missing:
                          missing.remove(stale)
                  remaining = 'TLS rotation plus both-profile cancellation, saturation and failover acceptance evidence'
                  if remaining not in missing:
                      missing.append(remaining)
          inventory_path.write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Add live cancellation test and permanent exact-head matrix
        shell: bash
        run: |
          set -euo pipefail
          cat > crates/trnm-persistence-pg/tests/query_deadline.rs <<'RUST'
          use std::env;
          use std::time::{Duration, Instant};

          use trnm_persistence_pg::{DatabaseProfile, PgDeadlinePolicy, PgRepository};

          #[test]
          fn live_long_query_is_cancelled_inside_the_total_deadline_boundary() {
              let required = env::var("TRNM_QUERY_DEADLINE_TEST_REQUIRED")
                  .ok()
                  .as_deref()
                  == Some("1");
              let database_url = env::var("TRNM_QUERY_DEADLINE_TEST_DATABASE_URL").ok();
              let profile = match env::var("TRNM_QUERY_DEADLINE_TEST_PROFILE").as_deref() {
                  Ok("postgresql") => Some(DatabaseProfile::PostgreSql),
                  Ok("cockroachdb") => Some(DatabaseProfile::CockroachDb),
                  _ => None,
              };
              let (Some(database_url), Some(profile)) = (database_url, profile) else {
                  assert!(!required, "required query-deadline live environment is incomplete");
                  eprintln!("query deadline live profile not requested; no remote credit");
                  return;
              };

              let mut repository = PgRepository::connect(&database_url, profile).unwrap();
              let policy = PgDeadlinePolicy::new(Duration::from_millis(250)).unwrap();
              let long_query = match profile {
                  DatabaseProfile::PostgreSql => "SELECT pg_sleep(10)",
                  DatabaseProfile::CockroachDb => {
                      "SELECT count(*) FROM generate_series(1, 1000000000)"
                  }
              };
              let started = Instant::now();
              let error = repository
                  .execute_with_deadline(policy, |client| client.simple_query(long_query))
                  .unwrap_err();
              let elapsed = started.elapsed();
              assert_eq!(error.reason(), "database_query_deadline_exceeded");
              assert!(elapsed >= Duration::from_millis(200));
              assert!(elapsed < Duration::from_secs(8), "elapsed={elapsed:?}");
              repository
                  .execute_with_deadline(
                      PgDeadlinePolicy::new(Duration::from_secs(2)).unwrap(),
                      |client| client.simple_query("SELECT 1"),
                  )
                  .unwrap();
          }
          RUST

          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')
          texts = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in sorted((root / '.github/workflows').glob('*.yml'))
              if path.name != 'temporary-pg-query-deadline-closure.yml'
          )
          postgres = sorted(set(re.findall(
              r'(?:docker\.io/library/)?postgres(?::[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}',
              texts,
          )))
          cockroach = sorted(set(re.findall(
              r'(?:docker\.io/)?cockroachdb/cockroach(?::[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}',
              texts,
          )))
          if not postgres or not cockroach:
              raise SystemExit('immutable PostgreSQL/CockroachDB image references are required')
          workflow = f'''name: pg-query-deadline

on:
  pull_request:
  push:
    branches:
      - main
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: read

jobs:
  postgresql-query-deadline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact head without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{GITHUB_REPOSITORY}}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Cancel a live PostgreSQL query
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          docker run -d --name trnm-deadline-postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55433:5432 \
            {postgres[0]}
          for attempt in $(seq 1 90); do
            if docker exec trnm-deadline-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90
            sleep 1
          done
          TRNM_QUERY_DEADLINE_TEST_REQUIRED=1 \
          TRNM_QUERY_DEADLINE_TEST_PROFILE=postgresql \
          TRNM_QUERY_DEADLINE_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55433/postgres \
            cargo test --package trnm-persistence-pg --test query_deadline --locked -- --nocapture

  cockroachdb-query-deadline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact head without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{GITHUB_REPOSITORY}}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Cancel a live CockroachDB query
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          docker run -d --name trnm-deadline-cockroach \
            -p 127.0.0.1:56258:26257 \
            {cockroach[0]} \
            start-single-node --insecure --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 120); do
            if docker exec trnm-deadline-cockroach cockroach sql \
              --insecure --host=127.0.0.1:26257 --database=defaultdb \
              --execute='SELECT 1' >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 120
            sleep 1
          done
          TRNM_QUERY_DEADLINE_TEST_REQUIRED=1 \
          TRNM_QUERY_DEADLINE_TEST_PROFILE=cockroachdb \
          TRNM_QUERY_DEADLINE_TEST_DATABASE_URL='postgresql://root@127.0.0.1:56258/defaultdb?sslmode=disable' \
            cargo test --package trnm-persistence-pg --test query_deadline --locked -- --nocapture

  pg-query-deadline-gate:
    if: ${{{{ always() }}}}
    needs:
      - postgresql-query-deadline
      - cockroachdb-query-deadline
    runs-on: ubuntu-24.04
    steps:
      - name: Require both cancellation profiles
        shell: bash
        env:
          POSTGRESQL_RESULT: ${{{{ needs.postgresql-query-deadline.result }}}}
          COCKROACHDB_RESULT: ${{{{ needs.cockroachdb-query-deadline.result }}}}
        run: |
          set -euo pipefail
          test "$POSTGRESQL_RESULT" = success
          test "$COCKROACHDB_RESULT" = success
'''
          (root / '.github/workflows/pg-query-deadline.yml').write_text(
              workflow,
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Compile, format and strictly lint
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo check --package trnm-persistence-pg --all-targets --locked
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --fix --allow-dirty --allow-staged \
            --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Prove both live profiles before commit
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_IMAGE="$(grep -Eo '(docker.io/library/)?postgres(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' .github/workflows/pg-query-deadline.yml | head -1)"
          COCKROACH_IMAGE="$(grep -Eo '(docker.io/)?cockroachdb/cockroach(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' .github/workflows/pg-query-deadline.yml | head -1)"
          test -n "$POSTGRES_IMAGE"
          test -n "$COCKROACH_IMAGE"
          docker run -d --name trnm-deadline-postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55433:5432 \
            "$POSTGRES_IMAGE"
          for attempt in $(seq 1 90); do
            if docker exec trnm-deadline-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90
            sleep 1
          done
          TRNM_QUERY_DEADLINE_TEST_REQUIRED=1 \
          TRNM_QUERY_DEADLINE_TEST_PROFILE=postgresql \
          TRNM_QUERY_DEADLINE_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55433/postgres \
            cargo test --package trnm-persistence-pg --test query_deadline --locked -- --nocapture
          docker rm -f trnm-deadline-postgres
          docker run -d --name trnm-deadline-cockroach \
            -p 127.0.0.1:56258:26257 \
            "$COCKROACH_IMAGE" \
            start-single-node --insecure --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 120); do
            if docker exec trnm-deadline-cockroach cockroach sql \
              --insecure --host=127.0.0.1:26257 --database=defaultdb \
              --execute='SELECT 1' >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 120
            sleep 1
          done
          TRNM_QUERY_DEADLINE_TEST_REQUIRED=1 \
          TRNM_QUERY_DEADLINE_TEST_PROFILE=cockroachdb \
          TRNM_QUERY_DEADLINE_TEST_DATABASE_URL='postgresql://root@127.0.0.1:56258/defaultdb?sslmode=disable' \
            cargo test --package trnm-persistence-pg --test query_deadline --locked -- --nocapture
          docker rm -f trnm-deadline-cockroach

      - name: Remove temporary writers and push unchanged-tip candidate
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) \
            -print -delete
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(pg): add transport-aware in-flight query cancellation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
