name: chain-external-qualification-ded43a-20260909

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chain-external-qualification-ded43a-20260909-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CHAIN_REPOSITORY: TrillionniumFoundation/Trillionnium-Chain
  CHAIN_BASE_SHA: b2d485e5641614ea0ca34ebf80a5f7843ff1e6d9
  CHAIN_HEAD_SHA: ded43a0704b455cd4bef724cb3ca40fb6db9465d
  CHAIN_HEAD_TREE: c0791ffb57e05fde43f87bfed1a3b4656c09efc0
  CHAIN_MERGE_SHA: 0549e088e5a1108363e542bf02d6afc2c11ffed2
  CHAIN_MERGE_TREE: c0791ffb57e05fde43f87bfed1a3b4656c09efc0
  CHAIN_ASSESSED_BASELINE_SHA: af691ea5005e1f0262e90c4fc878ba0a70dbe7ea
  RUSTUP_TOOLCHAIN: '1.95.0'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  chain:
    name: external/chain-head-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Fetch and verify exact Chain tuple in canonical root and linked worktree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/trillionnium-chain"
          merge="$RUNNER_TEMP/chain-merge"
          rm -rf "$root" "$merge"
          git init "$root"
          git -C "$root" remote add origin "https://github.com/${CHAIN_REPOSITORY}.git"
          git -C "$root" fetch --no-tags origin "$CHAIN_HEAD_SHA"
          git -C "$root" fetch --no-tags origin "$CHAIN_MERGE_SHA"
          git -C "$root" fetch --no-tags origin "$CHAIN_ASSESSED_BASELINE_SHA"
          git -C "$root" checkout --detach "$CHAIN_HEAD_SHA"
          git -C "$root" worktree add --detach "$merge" "$CHAIN_MERGE_SHA"
          test "$(git -C "$root" rev-parse HEAD)" = "$CHAIN_HEAD_SHA"
          test "$(git -C "$root" rev-parse 'HEAD^{tree}')" = "$CHAIN_HEAD_TREE"
          test "$(git -C "$merge" rev-parse HEAD)" = "$CHAIN_MERGE_SHA"
          test "$(git -C "$merge" rev-parse 'HEAD^{tree}')" = "$CHAIN_MERGE_TREE"
          test "$(git -C "$merge" rev-parse 'HEAD^1')" = "$CHAIN_BASE_SHA"
          test "$(git -C "$merge" rev-parse 'HEAD^2')" = "$CHAIN_HEAD_SHA"
          git -C "$root" cat-file -e "$CHAIN_ASSESSED_BASELINE_SHA^{commit}"
          test -z "$(git -C "$root" status --porcelain=v1 --untracked-files=no)"
          test -z "$(git -C "$merge" status --porcelain=v1 --untracked-files=no)"

      - name: Install Chain qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Qualify exact Chain head
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/trillionnium-chain"
          export TRNM_EXPECTED_SOURCE_SHA="$CHAIN_HEAD_SHA"
          bash scripts/project-preflight.sh --audit
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_plan_manifest_pins_v1.py
          python3 scripts/ci/check_technical_convergence_v1.py
          python3 scripts/ci/test_technical_convergence_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_required_baseline_closure_v1.py
          python3 scripts/ci/test_module_coverage_guard_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          python3 formal/poco-convergence-v1/check.py
          python3 scripts/ci/check_poco_bft_v0_parameters.py
          python3 scripts/ci/check_poco_bft_v0_wire_vectors.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-consensus-crypto -p trnm-native-execution-v0 --all-targets --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml -p trnm-consensus-crypto -p trnm-native-execution-v0 --all-targets --locked -- -D warnings
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Qualify exact Chain prospective merge
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chain-merge"
          export TRNM_EXPECTED_SOURCE_SHA="$CHAIN_MERGE_SHA"
          bash scripts/project-preflight.sh --audit
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_plan_manifest_pins_v1.py
          python3 scripts/ci/check_technical_convergence_v1.py
          python3 scripts/ci/test_technical_convergence_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_required_baseline_closure_v1.py
          python3 scripts/ci/test_module_coverage_guard_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          python3 formal/poco-convergence-v1/check.py
          python3 scripts/ci/check_poco_bft_v0_parameters.py
          python3 scripts/ci/check_poco_bft_v0_wire_vectors.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-consensus-crypto -p trnm-native-execution-v0 --all-targets --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml -p trnm-consensus-crypto -p trnm-native-execution-v0 --all-targets --locked -- -D warnings
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Emit Chain immutable identity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/trillionnium-chain"
          merge="$RUNNER_TEMP/chain-merge"
          test "$(git -C "$root" rev-parse HEAD)" = "$CHAIN_HEAD_SHA"
          test "$(git -C "$root" rev-parse 'HEAD^{tree}')" = "$CHAIN_HEAD_TREE"
          test "$(git -C "$merge" rev-parse HEAD)" = "$CHAIN_MERGE_SHA"
          test "$(git -C "$merge" rev-parse 'HEAD^{tree}')" = "$CHAIN_MERGE_TREE"
          test "$(git -C "$merge" show -s --format=%P HEAD)" = "$CHAIN_BASE_SHA $CHAIN_HEAD_SHA"
          git -C "$root" cat-file -e "$CHAIN_ASSESSED_BASELINE_SHA^{commit}"
          printf 'chain_repository=%s\n' "$CHAIN_REPOSITORY"
          printf 'chain_base=%s\n' "$CHAIN_BASE_SHA"
          printf 'chain_head=%s\n' "$CHAIN_HEAD_SHA"
          printf 'chain_head_tree=%s\n' "$CHAIN_HEAD_TREE"
          printf 'chain_merge=%s\n' "$CHAIN_MERGE_SHA"
          printf 'chain_merge_tree=%s\n' "$CHAIN_MERGE_TREE"
          printf 'chain_assessed_baseline=%s\n' "$CHAIN_ASSESSED_BASELINE_SHA"
          printf 'chain_merge_parents=%s\n' "$(git -C "$merge" show -s --format=%P HEAD)"
          printf 'runner_repository=%s\nrunner_commit=%s\nrunner_run_id=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID"
          printf 'production_authorization=not_granted\n'
          printf 'CHAIN_EXTERNAL_QUALIFICATION=PASS\n'
