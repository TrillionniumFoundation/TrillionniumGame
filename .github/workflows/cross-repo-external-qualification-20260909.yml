name: cross-repo-external-qualification-20260909

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-repo-external-qualification-20260909-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  INTEGRATION_REPOSITORY: TrillionniumFoundation/Trillionnium-Integration
  INTEGRATION_BASE_SHA: ac71d4ae4b154f689a9e1ca0abf27e390202f871
  INTEGRATION_HEAD_SHA: 84e651cbd0bc1c58374cf8ced661b54a81539895
  INTEGRATION_HEAD_TREE: e5cebd154c143f1ee5fea87ad4c3bbc19b4d13dc
  INTEGRATION_MERGE_SHA: 0ce5be709f4356bdac4211a959a926ca6b9db284
  INTEGRATION_MERGE_TREE: e5cebd154c143f1ee5fea87ad4c3bbc19b4d13dc
  CHAIN_REPOSITORY: TrillionniumFoundation/Trillionnium-Chain
  CHAIN_BASE_SHA: b2d485e5641614ea0ca34ebf80a5f7843ff1e6d9
  CHAIN_HEAD_SHA: bbee7c0194e420a36c7747167000450083d5d951
  CHAIN_HEAD_TREE: f7b239de6bd3ec1bd782c429e7a141776314a078
  CHAIN_MERGE_SHA: f2125748fd733b85f45567334e6e1b4aab80f86c
  CHAIN_MERGE_TREE: f7b239de6bd3ec1bd782c429e7a141776314a078
  RUSTUP_TOOLCHAIN: '1.95.0'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  integration:
    name: external/integration-head-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch and verify exact Integration tuple
        shell: bash
        run: |
          set -euo pipefail
          for kind in head merge; do
            dir="$RUNNER_TEMP/integration-$kind"
            rm -rf "$dir"
            git init "$dir"
            git -C "$dir" remote add origin "https://github.com/${INTEGRATION_REPOSITORY}.git"
            if test "$kind" = head; then sha="$INTEGRATION_HEAD_SHA"; else sha="$INTEGRATION_MERGE_SHA"; fi
            git -C "$dir" fetch --no-tags --depth=2 origin "$sha"
            git -C "$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          done
          test "$(git -C "$RUNNER_TEMP/integration-head" rev-parse 'HEAD^{tree}')" = "$INTEGRATION_HEAD_TREE"
          test "$(git -C "$RUNNER_TEMP/integration-merge" rev-parse 'HEAD^{tree}')" = "$INTEGRATION_MERGE_TREE"
          test "$(git -C "$RUNNER_TEMP/integration-merge" rev-parse 'HEAD^1')" = "$INTEGRATION_BASE_SHA"
          test "$(git -C "$RUNNER_TEMP/integration-merge" rev-parse 'HEAD^2')" = "$INTEGRATION_HEAD_SHA"

      - name: Qualify exact Integration head
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/integration-head"
          python3 -m json.tool components.lock.json >/dev/null
          python3 -m py_compile scripts/check-components-lock.py scripts/test-components-lock-negative.py
          python3 scripts/check-components-lock.py
          python3 scripts/test-components-lock-negative.py
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Qualify exact Integration prospective merge
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/integration-merge"
          python3 -m json.tool components.lock.json >/dev/null
          python3 -m py_compile scripts/check-components-lock.py scripts/test-components-lock-negative.py
          python3 scripts/check-components-lock.py
          python3 scripts/test-components-lock-negative.py
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Emit Integration immutable identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'integration_repository=%s\n' "$INTEGRATION_REPOSITORY"
          printf 'integration_base=%s\n' "$INTEGRATION_BASE_SHA"
          printf 'integration_head=%s\n' "$INTEGRATION_HEAD_SHA"
          printf 'integration_head_tree=%s\n' "$INTEGRATION_HEAD_TREE"
          printf 'integration_merge=%s\n' "$INTEGRATION_MERGE_SHA"
          printf 'integration_merge_tree=%s\n' "$INTEGRATION_MERGE_TREE"
          printf 'integration_merge_parents=%s\n' "$(git -C "$RUNNER_TEMP/integration-merge" show -s --format=%P HEAD)"
          printf 'runner_repository=%s\nrunner_commit=%s\nrunner_run_id=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID"
          printf 'production_authorization=not_granted\n'
          printf 'INTEGRATION_EXTERNAL_QUALIFICATION=PASS\n'

  chain:
    name: external/chain-head-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Fetch and verify exact Chain tuple
        shell: bash
        run: |
          set -euo pipefail
          for kind in head merge; do
            dir="$RUNNER_TEMP/chain-$kind"
            rm -rf "$dir"
            git init "$dir"
            git -C "$dir" remote add origin "https://github.com/${CHAIN_REPOSITORY}.git"
            if test "$kind" = head; then sha="$CHAIN_HEAD_SHA"; else sha="$CHAIN_MERGE_SHA"; fi
            git -C "$dir" fetch --no-tags --depth=2 origin "$sha"
            git -C "$dir" checkout --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          done
          test "$(git -C "$RUNNER_TEMP/chain-head" rev-parse 'HEAD^{tree}')" = "$CHAIN_HEAD_TREE"
          test "$(git -C "$RUNNER_TEMP/chain-merge" rev-parse 'HEAD^{tree}')" = "$CHAIN_MERGE_TREE"
          test "$(git -C "$RUNNER_TEMP/chain-merge" rev-parse 'HEAD^1')" = "$CHAIN_BASE_SHA"
          test "$(git -C "$RUNNER_TEMP/chain-merge" rev-parse 'HEAD^2')" = "$CHAIN_HEAD_SHA"

      - name: Install Chain qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.95.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Qualify exact Chain head
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chain-head"
          export TRNM_EXPECTED_SOURCE_SHA="$CHAIN_HEAD_SHA"
          bash scripts/project-preflight.sh --audit
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_plan_manifest_pins_v1.py
          python3 scripts/ci/check_technical_convergence_v1.py
          python3 scripts/ci/test_technical_convergence_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_required_baseline_closure_v1.py
          python3 scripts/ci/test_module_coverage_guard_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          python3 formal/poco-convergence-v1/check.py
          python3 scripts/ci/check_poco_bft_v0_parameters.py
          python3 scripts/ci/check_poco_bft_v0_wire_vectors.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-consensus-crypto -p trnm-native-execution-v0 --all-targets --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml -p trnm-consensus-crypto -p trnm-native-execution-v0 --all-targets --locked -- -D warnings
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Qualify exact Chain prospective merge
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/chain-merge"
          export TRNM_EXPECTED_SOURCE_SHA="$CHAIN_MERGE_SHA"
          bash scripts/project-preflight.sh --audit
          bash scripts/ci/check_canonical_development_plan.sh
          python3 scripts/ci/check_plan_manifest_pins_v1.py
          python3 scripts/ci/check_technical_convergence_v1.py
          python3 scripts/ci/test_technical_convergence_v1.py
          python3 scripts/ci/check_module_coverage_v1.py
          python3 scripts/ci/check_required_baseline_closure_v1.py
          python3 scripts/ci/test_module_coverage_guard_v1.py
          python3 scripts/ci/check_required_protocol_contract_v1.py
          python3 formal/poco-convergence-v1/check.py
          python3 scripts/ci/check_poco_bft_v0_parameters.py
          python3 scripts/ci/check_poco_bft_v0_wire_vectors.py
          cargo fmt --manifest-path trillionnium/Cargo.toml --all -- --check
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-consensus-crypto -p trnm-native-execution-v0 --all-targets --locked
          cargo clippy --manifest-path trillionnium/Cargo.toml -p trnm-consensus-crypto -p trnm-native-execution-v0 --all-targets --locked -- -D warnings
          cargo check --manifest-path trillionnium/Cargo.toml --workspace --all-targets --locked
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Emit Chain immutable identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'chain_repository=%s\n' "$CHAIN_REPOSITORY"
          printf 'chain_base=%s\n' "$CHAIN_BASE_SHA"
          printf 'chain_head=%s\n' "$CHAIN_HEAD_SHA"
          printf 'chain_head_tree=%s\n' "$CHAIN_HEAD_TREE"
          printf 'chain_merge=%s\n' "$CHAIN_MERGE_SHA"
          printf 'chain_merge_tree=%s\n' "$CHAIN_MERGE_TREE"
          printf 'chain_merge_parents=%s\n' "$(git -C "$RUNNER_TEMP/chain-merge" show -s --format=%P HEAD)"
          printf 'runner_repository=%s\nrunner_commit=%s\nrunner_run_id=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID"
          printf 'production_authorization=not_granted\n'
          printf 'CHAIN_EXTERNAL_QUALIFICATION=PASS\n'
