          ## Global resource and epoch fencing

          `SessionRouteRegistry` is constructed with validated global limits for active connections,
          presence entries, tracked sessions, retained revocation high-waters, and per-session
          connections. Capacity is checked before cloning candidate state; exhaustion returns a stable
          error without changing router state, indexes, high-waters, or revisions. Revocation
          high-waters are never silently evicted because doing so could re-authorize stale epochs.

          A session generation may advance only together with a strictly newer connection generation.
          Delayed update, leave, or remove operations from an older epoch therefore fail the underlying
          connection-generation fence and cannot mutate the replacement session.
