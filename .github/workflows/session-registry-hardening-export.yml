              fn tracked_session_count(&self) -> Result<usize, SessionRouteError> {
                  let overlap = self
                      .connections_by_session
                      .keys()
                      .filter(|session_id| self.revoked_through.contains_key(*session_id))
                      .count();
                  self.connections_by_session
                      .len()
                      .checked_add(self.revoked_through.len())
                      .and_then(|value| value.checked_sub(overlap))
                      .ok_or(SessionRouteError::InvariantViolation(
                          "tracked session count overflow",
                      ))
              }

              fn require_global_join_capacity(
                  &self,
                  connection: &ConnectionRef,
                  session_id: &SessionId,
                  stream: &StreamKey,
              ) -> Result<(), SessionRouteError> {
