name: session-registry-hardening-export

on:
  push:
    branches: [tooling/session-registry-hardening-2026-09-06]
    paths:
      - '.github/workflows/session-registry-hardening-export.yml'

permissions:
  contents: write

jobs:
  harden-test-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_PARENT: 0d0f246a131902403202afcd28103f22af30c8a9
      PRODUCT_BRANCH: codex/session-registry-hardening-v2-2026-09-06
      GH_TOKEN: ${{ github.token }}
