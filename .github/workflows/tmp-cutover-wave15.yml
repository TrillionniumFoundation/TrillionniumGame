          cat > crates/trnm-cutover-controller/README.md <<'EOF'
          # trnm-cutover-controller

          Status: **module documentation; source-candidate; no automatic compatibility or production credit**  
          Path: `crates/trnm-cutover-controller`  
          Workspace class: `root`  
          Lifecycle: `cutover-control`  
          Owner role: `program-sre`

          ## Status and authority

          This document is the engineering contract for fail-closed shadow, canary, Rust-primary, Nakama-read-only, rollback and retirement control state. It is a source candidate and does not route traffic, change authority, deploy, cut over or retire Nakama.

          ## Responsibilities

          The crate owns exact plan/subject identity, complete evidence-kind requirements, cohort writer ownership, stage-specific authority counts, clean observation windows, rollback rehearsals, final migration/backup/legacy/key/traffic facts, exact receipts and irreversible retirement state.

          It does not authenticate evidence, operate infrastructure, mutate database ownership, revoke real keys, route users or supply human decisions.

          ## Architecture and dependencies

          Compatibility, migration, KMS, recovery, endurance, governance, product and operations systems produce independently accepted artifacts bound to the same subject. A deployment adapter executes the controller's approved intent under a separate authorization and then reports observed facts.

          Every cohort has one current writer. Shadow performs no external effects. Canary may split exclusive cohorts between Nakama and Rust; Rust-primary and later stages require zero Nakama write authority and positive Rust authority.

          ## Public contracts

          The only forward sequence is Planned → Shadow → Canary → RustPrimary → NakamaReadOnly → Retired. Every observation window has a minimum duration, zero contractual divergences/invariant violations and bounded errors, lag and reconciliation backlog.

          Rollback must be rehearsed for the exact stage pair, restore semantic equality inside the rollback objective and return write authority to Nakama. Rust-primary/read-only rollback additionally requires a completed reverse delta.

          ## Correctness and failure model

          Missing artifact, self-review, wrong subject, stale revision, duplicate identity, wrong writer/authority shape, short/dirty window, absent rehearsal, incomplete final delta/backup/legacy/key/traffic fact or receipt capacity failure changes no state.

          Retirement requires all cohorts on Rust, zero Nakama write authority, positive Rust authority, a clean read-only observation and accepted retirement evidence. Retired state cannot roll back.

          ## Security and privacy

          Evidence and reviewer digests are structural inputs only. The evidence layer must authenticate independent acceptance and exact source/artifact provenance. No production credential, token, key or user payload belongs in this state.

          Deployment and key-revoke adapters require least privilege, dual approval, audit and incident rollback boundaries.

          ## Build and test

          ```bash
          cargo fmt --all -- --check
          cargo test --package trnm-cutover-controller --all-targets --locked
          cargo clippy --package trnm-cutover-controller --all-targets --locked -- -D warnings
          ```

          Tests cover self-review/subject rejection, no source-only shadow, shadow no-effect, one-writer cohorts, Rust-primary authority requirements, retirement facts and exact receipt replay.

          ## Operations

          Adapters expose stage, cohort writers, authority counts, observation duration/results, rollback readiness, artifact coverage and abort reason with bounded labels. Cohort/user identities and raw evidence are not labels.

          ## Compatibility and evidence

          Complete #128 requires real authenticated artifacts from #124–#127, protected governance, live shadow/canary cohorts, traffic and write fencing, rollback rehearsals, final backups/audits, key rotation, legacy disposition and independent cutover/retirement decisions.

          This controller cannot establish C5, production readiness, cutover authorization or Nakama retirement by itself.

          ## Known gaps and exit criteria

          Blocking gaps include `GAP-P0-GOV-001`, `GAP-P0-EVIDENCE-001`, `GAP-P0-DATA-001`, `GAP-P0-SERVER-001`, `GAP-P0-CRYPTO-001`, `GAP-P0-SCOPE-001`, `GAP-P0-CI-001`, `GAP-P1-BRANCH-001`, and `GAP-P1-REVIEW-001`.

          Exit requires authenticated upstream evidence, real deployment adapters, successful shadow/canary/rollback/read-only windows, final authority/data/security audit and conflict-free program/SRE acceptance.
          EOF

