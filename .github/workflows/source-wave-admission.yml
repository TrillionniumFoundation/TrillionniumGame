name: source-wave-admission

on:
  push:
    branches: [tooling/source-wave-admission-2026-09-07]
    paths:
      - '.github/workflows/source-wave-admission.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  BASE_SHA: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
  BASE_BRANCH: codex/branch-evidence-closure-2026-09-02
  CANDIDATE_BRANCH: codex/remaining-source-blockers-wave-v3-2026-09-06
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never

jobs:
  qualify-and-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Fetch exact base and cumulative source candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags origin \
            "$BASE_SHA" \
            "refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/source-wave"
          candidate=$(git -C "$GITHUB_WORKSPACE/source" rev-parse refs/remotes/origin/source-wave)
          git -C "$GITHUB_WORKSPACE/source" merge-base --is-ancestor "$BASE_SHA" "$candidate"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach "$candidate"
          changed=$(git -C "$GITHUB_WORKSPACE/source" diff --name-only "$BASE_SHA" HEAD)
          test -n "$changed"
          printf 'candidate=%s\ntree=%s\nchanged_paths=%s\n' \
            "$candidate" \
            "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" \
            "$(printf '%s\n' "$changed" | wc -l | tr -d ' ')"

      - name: Require the intended source-wave boundaries
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test -f crates/trnm-persistence-core/tests/outbox_state_model.rs
          test -f crates/trnm-presence-router-v2/src/session_registry.rs
          test -f crates/trnm-server/src/main.rs
          test -f crates/trnm-server/Cargo.toml
          test -f crates/trnm-server/Cargo.lock
          test ! -e crates/trnm-persistence-pg/src/bin/trnm-server.rs
          test ! -e crates/trnm-persistence-pg/src/bin/trnm_server
          grep -Rqs 'SessionRegistryLimits' crates/trnm-presence-router-v2/src
          grep -Rqs 'indeterminate' crates/trnm-persistence-core crates/trnm-server
          grep -Rqs 'generation' crates/trnm-presence-router-v2/src/session_registry.rs
          grep -Rqs 'migration' crates/trnm-server/src
          git diff --check "$BASE_SHA" HEAD
          forbidden=$(git diff --name-only "$BASE_SHA" HEAD | \
            grep -E '(^|/)(target|node_modules|dist|build|\.venv|__pycache__)/|(^|/)\.env($|\.)|(^|/).*\.(pem|key|p12|pfx)$' || true)
          test -z "$forbidden"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate all Rust package surfaces
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 scripts/check-rust-package-inventory.py
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in \
            crates/trnm-persistence-core/Cargo.toml \
            crates/trnm-presence-router-v2/Cargo.toml \
            crates/trnm-server/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done

      - name: Validate Go migration input and complete control plane
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          files=$(find runtime -type f -name '*.go' -print | sort)
          test -n "$files"
          test -z "$(printf '%s\n' "$files" | xargs gofmt -l)"
          (cd runtime && go test ./... -count=1 && go test -race ./... -count=1 && go vet ./...)
          python3 -m compileall -q scripts tools tests
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-trnm-server.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"
          test -z "$(git status --porcelain)"

      - name: Create or update one Draft source-wave PR
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H 'Accept: application/vnd.github+json' \
                   -H "Authorization: Bearer ${GH_TOKEN}" \
                   -H 'X-GitHub-Api-Version: 2022-11-28')
          owner=${GITHUB_REPOSITORY%%/*}
          encoded_head=$(python3 - "$owner" "$CANDIDATE_BRANCH" <<'PY'
          import sys, urllib.parse
          print(urllib.parse.quote(f'{sys.argv[1]}:{sys.argv[2]}', safe=''))
          PY
          )
          prs=$(curl -fsSL "${headers[@]}" \
            "$api/pulls?state=open&head=${encoded_head}&base=${BASE_BRANCH}&per_page=20")
          count=$(jq 'length' <<<"$prs")
          if [[ "$count" -eq 0 ]]; then
            body=$(cat <<'EOF'
          Cumulative Plan v3.1 source-candidate: bounded Outbox model, session/realtime fencing and fanout, ambiguous-effect reconciliation, connection actor limits, key lifecycle, migration fencing, and canonical trnm-server composition. The admission workflow requires exact ancestry, intended source boundaries, Rust 1.85.1 root/isolated format-test-strict-Clippy, Go test/race/vet, and the complete repository control corpus. This Draft grants no evidence, gap, compatibility, production, cutover, or retirement credit.
          EOF
          )
            payload=$(jq -n --arg title 'feat: integrate remaining Plan v3.1 source blockers' \
              --arg head "$CANDIDATE_BRANCH" --arg base "$BASE_BRANCH" --arg body "$body" \
              '{title:$title,head:$head,base:$base,body:$body,draft:true}')
            pr=$(curl -fsSL -X POST "${headers[@]}" "$api/pulls" -d "$payload")
          elif [[ "$count" -eq 1 ]]; then
            pr=$(jq '.[0]' <<<"$prs")
          else
            echo 'multiple cumulative source-wave PRs exist' >&2
            exit 1
          fi
          number=$(jq -r '.number' <<<"$pr")
          live_head=$(jq -r '.head.sha' <<<"$pr")
          test "$live_head" = "$(git rev-parse HEAD)"
          curl -fsSL -X POST "${headers[@]}" "$api/pulls/$number/requested_reviewers" \
            -d '{"reviewers":["Tomasrgbsf"]}' >/dev/null || true
          curl -fsSL -X POST "${headers[@]}" "$api/issues/$number/comments" \
            -d "$(jq -n --arg body "Exact-head source-wave qualification succeeded for $live_head. This is a Draft source candidate only; current-head independent specialist review, retained evidence, real environments and protected integration remain mandatory." '{body:$body}')" >/dev/null
          printf 'pr=%s\nhead=%s\n' "$number" "$live_head"
