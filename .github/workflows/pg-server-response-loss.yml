name: pg-server-response-loss

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/trnm-contracts/**'
      - 'crates/trnm-persistence-core/**'
      - 'crates/trnm-persistence-pg/**'
      - 'migrations/postgresql/**'
      - 'scripts/check-pg-server-response-loss.sh'
      - '.github/workflows/pg-server-response-loss.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-server-response-loss-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  post-commit-response-loss:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - name: Inject client reset and recover by exact receipt
        env:
          TRNM_PG_RESPONSE_LOSS_ROOT: run/pg-server-response-loss
        run: bash scripts/check-pg-server-response-loss.sh
      - name: Validate exact-head fault result
        run: |
          set -euo pipefail
          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            '.repository == "TrillionniumFoundation/TrillionniumGame" and
             .commit == $sha and
             .profile == "postgresql" and
             .assertions.durable_receipt_after_response_loss == true and
             .assertions.durable_event_after_response_loss == true and
             .assertions.durable_outbox_after_response_loss == true and
             .assertions.restart_replayed_exact_duplicate == true and
             .assertions.duplicate_visible_effects == 0 and
             .assertions.acknowledged_or_committed_command_loss == 0 and
             .claims.postgresql_ambiguous_response_slice_passed == true and
             .claims.socket_protocol_compatible == false and
             .claims.cockroachdb_passed == false and
             .claims.sg4_complete == false and
             .claims.production_ready == false' \
            run/pg-server-response-loss/result.json >/dev/null
      - name: Record exact-head diagnostic digest (no artifact credit)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target='run/pg-server-response-loss'
          test -e "$target"
          manifest="$RUNNER_TEMP/diagnostic-SHA256SUMS"
          if [[ -d "$target" ]]; then
            mapfile -d '' files < <(find "$target" -type f -print0 | sort -z)
            test "${#files[@]}" -gt 0
            sha256sum "${files[@]}" | tee "$manifest"
          else
            sha256sum "$target" | tee "$manifest"
          fi
          printf '### Diagnostic evidence only\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'This job did not upload a persistent artifact and grants no compatibility or production credit.\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$manifest" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
