name: temporary-cancel-obsolete-grpc-finalizer

on:
  push:
    branches:
      - codex/cancel-obsolete-grpc-finalizer-2026-08-31

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  cancel-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONTROL_BRANCH: codex/cancel-obsolete-grpc-finalizer-2026-08-31
      OBSOLETE_RUN_ID: '33349647670'
      CURRENT_PR: '57'
      CURRENT_HEAD: af4eac100f176f66407b9cf0d08da1538db1e042
    steps:
      - name: Fetch exact control branch without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${GITHUB_WORKSPACE}"
          git init "${GITHUB_WORKSPACE}"
          git -C "${GITHUB_WORKSPACE}" remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "${GITHUB_WORKSPACE}" fetch --no-tags origin \
            "+refs/heads/${CONTROL_BRANCH}:refs/remotes/origin/${CONTROL_BRANCH}"
          git -C "${GITHUB_WORKSPACE}" checkout -B "${CONTROL_BRANCH}" \
            "origin/${CONTROL_BRANCH}"
          test "$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Cancel only the obsolete construction run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${CURRENT_PR}" --jq .head.sha)" = \
            "${CURRENT_HEAD}"
          current=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSOLETE_RUN_ID}" --jq .status)
          case "${current}" in
            completed) ;;
            *)
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSOLETE_RUN_ID}/cancel" >/dev/null
              ;;
          esac
          for _ in $(seq 1 30); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSOLETE_RUN_ID}" --jq .status)
            if test "${status}" = completed; then
              exit 0
            fi
            sleep 1
          done
          echo "obsolete run did not become terminal" >&2
          exit 1
      - name: Remove temporary cancellation surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trillionnium-run-canceller"
          git config user.email "run-canceller@users.noreply.github.com"
          git rm .github/workflows/temporary-cancel-obsolete-grpc-finalizer.yml
          git diff --cached --check
          git commit -m "ci: remove obsolete-run cancellation executor"
          git push origin "HEAD:refs/heads/${CONTROL_BRANCH}"
