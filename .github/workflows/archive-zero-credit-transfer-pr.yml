name: archive-zero-credit-transfer-pr

on:
  push:
    branches: [tooling/gap-closure-audit-2026-09-07]
    paths:
      - '.github/workflows/archive-zero-credit-transfer-pr.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  archive-close-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_PR: '93'
      EXPECTED_BASE: codex/branch-evidence-closure-2026-09-02
      EXPECTED_HEAD_BRANCH: tooling/outbox-evidence-sealing-assets-2026-09-07a
    steps:
      - name: Validate zero-credit scope, archive exact tip and retire branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['TARGET_REPOSITORY']
          token = os.environ['GH_TOKEN']
          number = int(os.environ['TARGET_PR'])
          root = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'trillionnium-zero-credit-pr-retirement',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def call(method: str, path: str, body=None, allowed=()):
              raw = None if body is None else json.dumps(body, separators=(',', ':')).encode()
              request = urllib.request.Request(root + path, data=raw, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = response.read()
                      return response.status, json.loads(payload.decode()) if payload else None
              except urllib.error.HTTPError as error:
                  payload = error.read().decode('utf-8', errors='replace')
                  if error.code in allowed:
                      try:
                          value = json.loads(payload) if payload else None
                      except Exception:
                          value = {'message': payload[:1000]}
                      return error.code, value
                  raise SystemExit(f'{method} {path}: HTTP {error.code}: {payload[:2000]}')

          _, pull = call('GET', f'/pulls/{number}')
          if pull['state'] != 'open' or pull.get('merged'):
              raise SystemExit('PR 93 is not an open unmerged transfer surface')
          if pull['base']['ref'] != os.environ['EXPECTED_BASE']:
              raise SystemExit('PR 93 base drift')
          if pull['head']['ref'] != os.environ['EXPECTED_HEAD_BRANCH']:
              raise SystemExit('PR 93 head branch drift')
          if 'zero-credit' not in ((pull.get('body') or '') + ' ' + (pull.get('title') or '')).lower():
              raise SystemExit('PR 93 no longer declares zero-credit scope')
          head = pull['head']['sha']

          files = []
          page = 1
          while True:
              _, rows = call('GET', f'/pulls/{number}/files?per_page=100&page={page}')
              files.extend(row['filename'] for row in rows)
              if len(rows) < 100:
                  break
              page += 1
          if not files or any(not path.startswith('tooling/outbox-evidence-sealing/') for path in files):
              raise SystemExit('PR 93 contains non-transfer paths: ' + ', '.join(files))

          _, runs = call('GET', '/actions/runs?' + urllib.parse.urlencode({
              'head_sha': head,
              'per_page': 100,
          }))
          active = [row for row in runs.get('workflow_runs', []) if row.get('status') != 'completed']
          if active:
              raise SystemExit('PR 93 still has non-terminal runs')

          tag = f'archive/tooling/outbox-evidence-sealing-assets-2026-09-07a/{head}'
          status, existing = call(
              'GET', '/git/ref/tags/' + urllib.parse.quote(tag, safe=''), allowed=(404,)
          )
          if status == 404:
              call('POST', '/git/refs', {'ref': 'refs/tags/' + tag, 'sha': head})
          elif existing['object']['sha'] != head:
              raise SystemExit('archive tag collision')

          call('PATCH', f'/pulls/{number}', {'state': 'closed'})
          status, ref = call(
              'GET', '/git/ref/heads/' + urllib.parse.quote(os.environ['EXPECTED_HEAD_BRANCH'], safe=''),
              allowed=(404,),
          )
          if status == 200:
              if ref['object']['sha'] != head:
                  raise SystemExit('transfer branch moved after archive')
              call('DELETE', '/git/refs/heads/' + urllib.parse.quote(os.environ['EXPECTED_HEAD_BRANCH'], safe=''))

          _, main = call('GET', '/git/ref/heads/main')
          result = {
              'pull_request': number,
              'archived_head': head,
              'archive_tag': tag,
              'paths': files,
              'closed': True,
              'branch_deleted': True,
              'main_unchanged': main['object']['sha'] == 'd66c1b5b614a2a7b682c233fe2e7a19939b6976b',
              'accepted_evidence': False,
              'gap_closed': False,
          }
          print(json.dumps(result, sort_keys=True))
          PY
