name: trillionnium-game-rust-server-vertical-slice

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/trnm-server/**'
      - 'contracts/server/**'
      - 'docs/development/RUST_SERVER_VERTICAL_SLICE.md'
      - 'docs/status/RUST_SERVER_VERTICAL_SLICE_STATUS.json'
      - 'scripts/check-rust-server-vertical-slice.py'
      - 'tests/server/**'
      - '.github/workflows/w1-rust-server-vertical-slice.yml'
      - '.github/workflows/trillionnium-game-merge-gate.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-server/**'
      - 'contracts/server/**'
      - 'docs/development/RUST_SERVER_VERTICAL_SLICE.md'
      - 'docs/status/RUST_SERVER_VERTICAL_SLICE_STATUS.json'
      - 'scripts/check-rust-server-vertical-slice.py'
      - 'tests/server/**'
      - '.github/workflows/w1-rust-server-vertical-slice.yml'
      - '.github/workflows/trillionnium-game-merge-gate.yml'

permissions:
  contents: read

concurrency:
  group: rust-server-vertical-slice-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate fail-closed source contract
        run: python3 scripts/check-rust-server-vertical-slice.py
      - name: Execute independent Python wrapper
        run: python3 -m unittest tests.server.test_rust_server_vertical_slice -v

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Format
        run: cargo fmt --manifest-path crates/trnm-server/Cargo.toml -- --check
      - name: Test all targets
        run: cargo test --manifest-path crates/trnm-server/Cargo.toml --all-targets --locked
      - name: Strict lint
        run: cargo clippy --manifest-path crates/trnm-server/Cargo.toml --all-targets --locked -- -D warnings
      - name: Typed configuration smoke
        run: cargo run --quiet --manifest-path crates/trnm-server/Cargo.toml --locked --bin trnm-server-foundation -- check-config

  no-credit-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Reject premature claims
        run: |
          set -euo pipefail
          jq -e '
            .claims.nakama_wire_compatible == false and
            .claims.database_durable == false and
            .claims.sg4_complete == false and
            .claims.compatibility_credit == false and
            .claims.production_ready == false and
            .claims.public_online == false and
            .claims.nakama_replaced == false
          ' contracts/server/rust-server-vertical-slice.v1.json >/dev/null
          jq -e '
            .claims.nakama_wire_compatible == false and
            .claims.database_durable == false and
            .claims.sg4_complete == false and
            .claims.compatibility_credit == false and
            .claims.production_ready == false and
            .claims.public_online == false and
            .claims.nakama_replaced == false
          ' docs/status/RUST_SERVER_VERTICAL_SLICE_STATUS.json >/dev/null
