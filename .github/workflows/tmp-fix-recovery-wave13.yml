name: tmp-fix-recovery-wave13

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-fix-recovery-wave13.yml

permissions:
  contents: write
  pull-requests: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  FEATURE_BRANCH: feature/plan-v32-recovery-core-20260909
  GH_TOKEN: ${{ github.token }}

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Wait for exact recovery branch
        shell: bash
        run: |
          set -euo pipefail
          head_sha=''
          for _ in $(seq 1 1080); do
            head_sha="$(gh api "repos/${REPOSITORY}/branches/${FEATURE_BRANCH}" --jq '.commit.sha' 2>/dev/null || true)"
            test -n "$head_sha" && break
            sleep 20
          done
          test -n "$head_sha"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$head_sha"
          git -C "$GITHUB_WORKSPACE" checkout -B "$FEATURE_BRANCH" "$head_sha"

      - name: Apply exact recovery semantics
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-recovery-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')

          old_packet = '''    pub backup_completed_at_ms: u64,
    pub backup_artifact_digest: Digest32,
    pub required_scenarios: BTreeMap<ScenarioId, RequiredScenario>,
'''
          new_packet = '''    pub backup_completed_at_ms: u64,
    pub source_observed_at_ms: u64,
    pub backup_artifact_digest: Digest32,
    pub expected_catalog_digest: Digest32,
    pub expected_semantic_digest: Digest32,
    pub required_scenarios: BTreeMap<ScenarioId, RequiredScenario>,
'''
          if old_packet in text:
              text = text.replace(old_packet, new_packet, 1)
          elif new_packet not in text:
              raise SystemExit('RecoveryPacket field anchor missing')

          old_packet_check = '''            || self.backup_started_at_ms == 0
            || self.backup_completed_at_ms < self.backup_started_at_ms
            || self.required_scenarios.is_empty()
'''
          new_packet_check = '''            || self.backup_started_at_ms == 0
            || self.backup_completed_at_ms <= self.backup_started_at_ms
            || self.source_observed_at_ms < self.backup_completed_at_ms
            || self.required_scenarios.is_empty()
'''
          if old_packet_check in text:
              text = text.replace(old_packet_check, new_packet_check, 1)
          elif new_packet_check not in text:
              raise SystemExit('RecoveryPacket validation anchor missing')

          old_assertions = '''            || self.executed > self.collected
            || accounted != self.executed
'''
          new_assertions = '''            || self.executed != self.collected
            || accounted != self.executed
'''
          if old_assertions in text:
              text = text.replace(old_assertions, new_assertions, 1)
          elif new_assertions not in text:
              raise SystemExit('assertion completeness anchor missing')

          old_attempt = '''    pub catalog_digest: Digest32,
    pub semantic_digest: Digest32,
    pub expected_semantic_digest: Digest32,
    pub invariant_violations: BTreeMap<Invariant, u64>,
    pub assertions: AssertionCounts,
'''
          new_attempt = '''    pub catalog_digest: Digest32,
    pub semantic_digest: Digest32,
    pub assertion_digest: Digest32,
    pub invariant_violations: BTreeMap<Invariant, u64>,
    pub assertions: AssertionCounts,
'''
          if old_attempt in text:
              text = text.replace(old_attempt, new_attempt, 1)
          elif new_attempt not in text:
              raise SystemExit('RecoveryAttempt field anchor missing')

          invariant_anchor = '''pub enum Invariant {
    AcknowledgedCommandLoss,
    DuplicateVisibleValue,
    StaleAuthorityAcceptedWrite,
    PartialCommandEventOutboxCommit,
    DuplicateActiveAuthority,
    ReceiptReplayMismatch,
    SchemaDigestMismatch,
    MissingRestoredObject,
    CorruptRestoredObject,
    UnreconciledOutboxIntent,
}
'''
          invariant_replacement = invariant_anchor + '''
const REQUIRED_INVARIANTS: [Invariant; 10] = [
    Invariant::AcknowledgedCommandLoss,
    Invariant::DuplicateVisibleValue,
    Invariant::StaleAuthorityAcceptedWrite,
    Invariant::PartialCommandEventOutboxCommit,
    Invariant::DuplicateActiveAuthority,
    Invariant::ReceiptReplayMismatch,
    Invariant::SchemaDigestMismatch,
    Invariant::MissingRestoredObject,
    Invariant::CorruptRestoredObject,
    Invariant::UnreconciledOutboxIntent,
];
'''
          if 'const REQUIRED_INVARIANTS' not in text:
              if invariant_anchor not in text:
                  raise SystemExit('Invariant anchor missing')
              text = text.replace(invariant_anchor, invariant_replacement, 1)

          validate_start = text.index('    pub fn validate(self, packet: &RecoveryPacket)')
          decision_start = text.index('#[derive(Clone, Copy, Debug, Eq, Ord, PartialEq, PartialOrd)]\npub enum DecisionKind', validate_start)
          validate_block = '''    pub fn validate(self, packet: &RecoveryPacket) -> Result<Self, RecoveryError> {
        self.assertions.validate()?;
        let scenario = packet
            .required_scenarios
            .get(&self.scenario)
            .ok_or_else(|| RecoveryError::new(
                StableRecoveryCode::FailedPrecondition,
                "recovery_scenario_not_required",
                false,
            ))?;
        let invariant_set_complete = self.invariant_violations.len() == REQUIRED_INVARIANTS.len()
            && REQUIRED_INVARIANTS.iter().all(|invariant| {
                self.invariant_violations.get(invariant).copied() == Some(0)
            });
        if self.packet != packet.id
            || self.profile != packet.profile
            || self.subject != packet.subject
            || self.restored_sequence == 0
            || self.restored_sequence > packet.source_sequence
            || self.recovery_point_ms == 0
            || self.recovery_point_ms > packet.source_observed_at_ms
            || self.restore_started_at_ms == 0
            || self.readiness_restored_at_ms < self.restore_started_at_ms
            || self.catalog_digest != packet.expected_catalog_digest
            || self.semantic_digest != packet.expected_semantic_digest
            || self.assertion_digest != scenario.expected_assertion_digest
            || !invariant_set_complete
        {
            return Err(RecoveryError::new(
                StableRecoveryCode::FailedPrecondition,
                "recovery_attempt_invalid",
                false,
            ));
        }
        let actual_rpo_ms = packet
            .source_observed_at_ms
            .checked_sub(self.recovery_point_ms)
            .ok_or_else(|| RecoveryError::invalid("recovery_point_invalid"))?;
        let actual_rto_ms = self
            .readiness_restored_at_ms
            .checked_sub(self.restore_started_at_ms)
            .ok_or_else(|| RecoveryError::invalid("restore_time_invalid"))?;
        if actual_rpo_ms > packet.objectives.maximum_rpo_ms
            || actual_rto_ms > packet.objectives.maximum_rto_ms
        {
            return Err(RecoveryError::new(
                StableRecoveryCode::FailedPrecondition,
                "recovery_objective_missed",
                false,
            ));
        }
        Ok(self)
    }
}

'''
          block_start = text.rfind('impl RecoveryAttempt {', 0, validate_start)
          if block_start < 0:
              raise SystemExit('RecoveryAttempt impl anchor missing')
          text = text[:block_start] + 'impl RecoveryAttempt {\n' + validate_block + text[decision_start:]

          old_packet_fixture = '''            backup_started_at_ms: 10,
            backup_completed_at_ms: 20,
            backup_artifact_digest: digest(40),
            required_scenarios: BTreeMap::from([(scenario.id, scenario)]),
'''
          new_packet_fixture = '''            backup_started_at_ms: 10,
            backup_completed_at_ms: 20,
            source_observed_at_ms: 200,
            backup_artifact_digest: digest(40),
            expected_catalog_digest: digest(50),
            expected_semantic_digest: digest(51),
            required_scenarios: BTreeMap::from([(scenario.id, scenario)]),
'''
          if old_packet_fixture in text:
              text = text.replace(old_packet_fixture, new_packet_fixture, 1)
          elif new_packet_fixture not in text:
              raise SystemExit('packet fixture anchor missing')

          old_attempt_fixture = '''            recovery_point_ms: 15,
            restore_started_at_ms: 100,
            readiness_restored_at_ms: 140,
            catalog_digest: digest(50),
            semantic_digest: digest(51),
            expected_semantic_digest: digest(51),
            invariant_violations: BTreeMap::from([
                (Invariant::AcknowledgedCommandLoss, 0),
                (Invariant::DuplicateVisibleValue, 0),
                (Invariant::StaleAuthorityAcceptedWrite, 0),
            ]),
'''
          new_attempt_fixture = '''            recovery_point_ms: 198,
            restore_started_at_ms: 100,
            readiness_restored_at_ms: 140,
            catalog_digest: digest(50),
            semantic_digest: digest(51),
            assertion_digest: digest(20),
            invariant_violations: REQUIRED_INVARIANTS
                .into_iter()
                .map(|invariant| (invariant, 0))
                .collect(),
'''
          if old_attempt_fixture in text:
              text = text.replace(old_attempt_fixture, new_attempt_fixture, 1)
          elif new_attempt_fixture not in text:
              raise SystemExit('attempt fixture anchor missing')

          old_rpo = '''        let mut attempt = attempt(DatabaseProfile::PostgreSql);
        attempt.restored_sequence = 90;
'''
          new_rpo = '''        let mut attempt = attempt(DatabaseProfile::PostgreSql);
        attempt.recovery_point_ms = 190;
'''
          if old_rpo in text:
              text = text.replace(old_rpo, new_rpo, 1)
          elif new_rpo not in text:
              raise SystemExit('RPO test anchor missing')

          test_anchor = '''    #[test]
    fn all_scenarios_do_not_substitute_for_independent_decisions() {'''
          if 'fn missing_invariant_or_wrong_assertion_digest_is_rejected()' not in text:
              addition = '''    #[test]
    fn missing_invariant_or_wrong_assertion_digest_is_rejected() {
        let mut registry = registry();
        registry
            .register_packet(packet(DatabaseProfile::PostgreSql))
            .unwrap();
        let mut missing = attempt(DatabaseProfile::PostgreSql);
        missing
            .invariant_violations
            .remove(&Invariant::DataCorruption);
        assert_eq!(
            registry.record_attempt(missing).unwrap_err().reason(),
            "recovery_attempt_invalid"
        );
        let mut wrong_assertion = attempt(DatabaseProfile::PostgreSql);
        wrong_assertion.assertion_digest = digest(99);
        assert_eq!(
            registry
                .record_attempt(wrong_assertion)
                .unwrap_err()
                .reason(),
            "recovery_attempt_invalid"
        );
    }

'''
              if test_anchor not in text:
                  raise SystemExit('recovery test anchor missing')
              text = text.replace(test_anchor, addition + test_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Qualify and publish recovery repair
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fmt --all
          cargo test --package trnm-recovery-core --all-targets --locked
          cargo clippy --package trnm-recovery-core --all-targets --locked -- -D warnings
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/trnm-recovery-core/src/lib.rs
          git commit -m 'fix(operations): bind RPO catalog semantics and complete invariants'
          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          pr="$(gh pr list --repo "$REPOSITORY" --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          test -z "$pr" || gh pr comment "$pr" --repo "$REPOSITORY" --body \
            "Replaced sequence-distance RPO with exact observed-time RPO, bound catalog/semantic/assertion digests to the packet, and require the complete zero-invariant set and fully executed assertions. Focused tests and strict Clippy passed in carrier run `${GITHUB_RUN_ID}`; exact-head checks must requalify the new source."
