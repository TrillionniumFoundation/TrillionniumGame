name: prospective-merge-gate

on:
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: prospective-merge-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  GOTOOLCHAIN: auto
  BASE_REPOSITORY: ${{ github.repository }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PROSPECTIVE_MERGE_SHA: ${{ github.sha }}

jobs:
  control-plane:
    name: prospective-control-plane
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch the exact GitHub prospective merge object
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_REPOSITORY"
          test -n "$PR_NUMBER"
          test "${#SOURCE_BASE_SHA}" -eq 40
          test "${#SOURCE_HEAD_SHA}" -eq 40
          test "${#PROSPECTIVE_MERGE_SHA}" -eq 40
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${BASE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/prospective-merge"
          git -C "$GITHUB_WORKSPACE" checkout --detach \
            refs/remotes/origin/prospective-merge
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = \
            "$PROSPECTIVE_MERGE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s \
            --format='merge_commit=%H%ntree=%T%nparents=%P'
      - name: Bind ordered parents and merge tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-prospective-merge-identity.py \
            --repository "$BASE_REPOSITORY" \
            --expected-base "$SOURCE_BASE_SHA" \
            --expected-head "$SOURCE_HEAD_SHA" \
            --expected-merge "$PROSPECTIVE_MERGE_SHA" \
            --output run/prospective-merge/control-identity.json
          cat run/prospective-merge/control-identity.json
      - name: Validate control-plane and source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-trnm-server.py
          python3 -m py_compile \
            scripts/check-prospective-merge-identity.py \
            scripts/check-plan.py \
            scripts/check-status-transitions.py \
            scripts/derive-gates.py \
            scripts/check-schema-authority.py \
            scripts/check-workflow-action-policy.py \
            scripts/check-required-workflow-runs.py \
            scripts/check-repository-hygiene.py \
            scripts/check-rust-package-inventory.py \
            scripts/check-trnm-server.py
      - name: Exercise merge-identity and workflow-integrity regressions
        run: |
          python3 -m unittest \
            tests.control_plane.test_prospective_merge_identity \
            tests.control_plane.test_workflow_gate_integrity -v

  rust-workspace:
    name: prospective-rust-workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Fetch the exact GitHub prospective merge object
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${BASE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/prospective-merge"
          git -C "$GITHUB_WORKSPACE" checkout --detach \
            refs/remotes/origin/prospective-merge
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = \
            "$PROSPECTIVE_MERGE_SHA"
          python3 scripts/check-prospective-merge-identity.py \
            --repository "$BASE_REPOSITORY" \
            --expected-base "$SOURCE_BASE_SHA" \
            --expected-head "$SOURCE_HEAD_SHA" \
            --expected-merge "$PROSPECTIVE_MERGE_SHA" \
            --output run/prospective-merge/rust-identity.json
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Validate package coverage
        run: python3 scripts/check-rust-package-inventory.py
      - name: Format root workspace
        run: cargo fmt --all -- --check
      - name: Test every root target
        run: cargo test --workspace --all-targets --locked
      - name: Strict lint every root target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  isolated-rust:
    name: prospective-isolated-rust (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: token-jwt-adapter
            manifest: crates/trnm-token-jwt-adapter/Cargo.toml
          - component: token-jwt-adapter-gate
            manifest: crates/trnm-token-jwt-adapter-gate/Cargo.toml
          - component: token-jwt-adapter-gate-v2
            manifest: crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
          - component: presence-router-v2
            manifest: crates/trnm-presence-router-v2/Cargo.toml
          - component: trnm-server-foundation
            manifest: crates/trnm-server/Cargo.toml
          - component: persistence-runtime-policy
            manifest: crates/trnm-persistence-runtime-policy/Cargo.toml
          - component: realtime-wire
            manifest: crates/trnm-realtime-wire/Cargo.toml
          - component: storage-nakama-version
            manifest: crates/trnm-storage-nakama-version/Cargo.toml
          - component: token-crypto-provider
            manifest: crates/trnm-token-crypto-provider/Cargo.toml
          - component: token-jwt-provider-adapter
            manifest: crates/trnm-token-jwt-provider-adapter/Cargo.toml
    steps:
      - name: Fetch the exact GitHub prospective merge object
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${BASE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/prospective-merge"
          git -C "$GITHUB_WORKSPACE" checkout --detach \
            refs/remotes/origin/prospective-merge
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = \
            "$PROSPECTIVE_MERGE_SHA"
          python3 scripts/check-prospective-merge-identity.py \
            --repository "$BASE_REPOSITORY" \
            --expected-base "$SOURCE_BASE_SHA" \
            --expected-head "$SOURCE_HEAD_SHA" \
            --expected-merge "$PROSPECTIVE_MERGE_SHA" \
            --output "run/prospective-merge/${{ matrix.component }}-identity.json"
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format
        run: cargo fmt --manifest-path '${{ matrix.manifest }}' -- --check
      - name: Test
        run: cargo test --manifest-path '${{ matrix.manifest }}' --all-targets --locked
      - name: Strict lint
        run: cargo clippy --manifest-path '${{ matrix.manifest }}' --all-targets --locked -- -D warnings

  python-and-go:
    name: prospective-python-and-go
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Fetch the exact GitHub prospective merge object
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${BASE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/prospective-merge"
          git -C "$GITHUB_WORKSPACE" checkout --detach \
            refs/remotes/origin/prospective-merge
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = \
            "$PROSPECTIVE_MERGE_SHA"
          python3 scripts/check-prospective-merge-identity.py \
            --repository "$BASE_REPOSITORY" \
            --expected-base "$SOURCE_BASE_SHA" \
            --expected-head "$SOURCE_HEAD_SHA" \
            --expected-merge "$PROSPECTIVE_MERGE_SHA" \
            --output run/prospective-merge/python-go-identity.json
      - name: Compile and run complete Python corpus
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash scripts/check-api-rtapi-denominator.sh
      - name: Validate World authority boundaries
        run: |
          set -euo pipefail
          bash scripts/check-world-command-runtime-v1.sh
          bash scripts/test-world-command-runtime-v1-negative.sh
          bash scripts/check-world-command-deployed-runtime-v1.sh
          bash scripts/test-world-command-deployed-runtime-v1-negative.sh
          bash scripts/check-world-transition-v1-boundary.sh
          bash scripts/check-world-transition-v1-go.sh
          bash scripts/test-world-transition-v1-go-negative.sh
      - name: Verify Go formatting, tests, race and vet
        shell: bash
        run: |
          set -euo pipefail
          files=$(find runtime -type f -name '*.go' -print | sort)
          test -n "$files"
          unformatted=$(printf '%s\n' "$files" | xargs gofmt -l)
          test -z "$unformatted" || { printf '%s\n' "$unformatted" >&2; exit 1; }
          cd runtime
          go test ./... -count=1
          go test -race ./... -count=1
          go vet ./...

  live-profiles:
    name: prospective-live (${{ matrix.profile }})
    needs: control-plane
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        profile: [postgresql, cockroachdb]
    steps:
      - name: Fetch the exact GitHub prospective merge object
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${BASE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/prospective-merge"
          git -C "$GITHUB_WORKSPACE" checkout --detach \
            refs/remotes/origin/prospective-merge
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = \
            "$PROSPECTIVE_MERGE_SHA"
          python3 scripts/check-prospective-merge-identity.py \
            --repository "$BASE_REPOSITORY" \
            --expected-base "$SOURCE_BASE_SHA" \
            --expected-head "$SOURCE_HEAD_SHA" \
            --expected-merge "$PROSPECTIVE_MERGE_SHA" \
            --output "run/prospective-merge/${{ matrix.profile }}-identity.json"
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
          docker version
      - name: Execute server and protocol live packet
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          TRNM_EVIDENCE_ROOT: run/prospective-merge/server-live
          TRNM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}-server
        run: bash scripts/ci-trnm-server-live.sh '${{ matrix.profile }}'
      - name: Execute final-attempt outbox live packet
        env:
          TRNM_EVIDENCE_ROOT: run/prospective-merge/outbox-final-attempt
          TRNM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}-outbox
        run: bash scripts/ci-outbox-final-attempt-reaper.sh '${{ matrix.profile }}'
      - name: Validate and seal the merge-result packet
        env:
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          server="run/prospective-merge/server-live/${PROFILE}"
          outbox="run/prospective-merge/outbox-final-attempt/${PROFILE}"
          test -s "$server/summary.json"
          test -s "$server/SHA256SUMS"
          test -s "$outbox/result.env"
          test -s "$outbox/identity.env"
          test -s "$outbox/crash-before-publish/result.env"
          test -s "$outbox/crash-after-publish/result.env"
          EXPECTED_MERGE="$PROSPECTIVE_MERGE_SHA" PROFILE="$PROFILE" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = os.environ['PROFILE']
          expected = os.environ['EXPECTED_MERGE']
          server = Path('run/prospective-merge/server-live') / profile
          outbox = Path('run/prospective-merge/outbox-final-attempt') / profile
          summary = json.loads((server / 'summary.json').read_text(encoding='utf-8'))
          assert summary['repository'] == 'TrillionniumFoundation/TrillionniumGame'
          assert summary['commit'] == expected
          assert summary['profile'] == profile
          for field in (
              'check_config', 'fresh_migration', 'health_ready',
              'unauthenticated_mutation_rejected',
              'http_bootstrap_commit_duplicate_conflict',
              'websocket_json_commit', 'response_loss_exact_receipt_replay',
              'authenticated_drain', 'process_restart_exact_receipt_replay',
          ):
              assert summary[field] is True, (field, summary[field])
          assert summary['wire_compatible'] is False
          assert summary['production_ready'] is False

          def env_file(path: Path) -> dict[str, str]:
              result = {}
              for line in path.read_text(encoding='utf-8').splitlines():
                  key, value = line.split('=', 1)
                  result[key] = value
              return result

          result = env_file(outbox / 'result.env')
          assert result == {'status': 'passed', 'profile': profile, 'commit': expected}
          identity = env_file(outbox / 'identity.env')
          assert identity['repository'] == 'TrillionniumFoundation/TrillionniumGame'
          assert identity['commit'] == expected
          assert identity['profile'] == profile
          assert len(identity['migration_blob_sha1']) == 40
          before = env_file(outbox / 'crash-before-publish/result.env')
          after = env_file(outbox / 'crash-after-publish/result.env')
          assert before['possible_lost_effect_declared'] == 'true'
          assert before['spool_effect_count'] == '0'
          assert before['dead_letter_count'] == '1'
          assert after['possible_lost_effect_declared'] == 'false'
          assert after['spool_effect_count'] == '1'
          assert after['dead_letter_count'] == '1'
          assert sum(1 for path in server.rglob('*') if path.is_file()) >= 12
          assert sum(1 for path in outbox.rglob('*') if path.is_file()) >= 20
          PY
          sha256sum --check "$server/SHA256SUMS"
          archive="run/prospective-merge-${PROFILE}-${PROSPECTIVE_MERGE_SHA}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" \
            -C run/prospective-merge \
            "${PROFILE}-identity.json" \
            "server-live/${PROFILE}" \
            "outbox-final-attempt/${PROFILE}"
          printf 'repository=%s\nbase_sha=%s\nhead_sha=%s\nmerge_sha=%s\nprofile=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$BASE_REPOSITORY" "$SOURCE_BASE_SHA" "$SOURCE_HEAD_SHA" \
            "$PROSPECTIVE_MERGE_SHA" "$PROFILE" "$GITHUB_RUN_ID" \
            "$GITHUB_RUN_ATTEMPT"
          sha256sum "$archive"
          cat "$server/summary.json"
          cat "$outbox/result.env"
          cat "$outbox/crash-before-publish/result.env"
          cat "$outbox/crash-after-publish/result.env"

  prospective-merge-gate:
    name: prospective-merge-gate
    if: always()
    needs:
      - control-plane
      - rust-workspace
      - isolated-rust
      - python-and-go
      - live-profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject missing, skipped, cancelled or failed merge-result lanes
        env:
          CONTROL_PLANE: ${{ needs.control-plane.result }}
          RUST_WORKSPACE: ${{ needs.rust-workspace.result }}
          ISOLATED_RUST: ${{ needs.isolated-rust.result }}
          PYTHON_GO: ${{ needs.python-and-go.result }}
          LIVE_PROFILES: ${{ needs.live-profiles.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONTROL_PLANE" = success
          test "$RUST_WORKSPACE" = success
          test "$ISOLATED_RUST" = success
          test "$PYTHON_GO" = success
          test "$LIVE_PROFILES" = success
      - name: Rebind the final gate to the exact merge object
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${BASE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin \
            "+refs/pull/${PR_NUMBER}/merge:refs/remotes/origin/prospective-merge"
          git -C "$GITHUB_WORKSPACE" checkout --detach \
            refs/remotes/origin/prospective-merge
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = \
            "$PROSPECTIVE_MERGE_SHA"
          python3 scripts/check-prospective-merge-identity.py \
            --repository "$BASE_REPOSITORY" \
            --expected-base "$SOURCE_BASE_SHA" \
            --expected-head "$SOURCE_HEAD_SHA" \
            --expected-merge "$PROSPECTIVE_MERGE_SHA" \
            --output run/prospective-merge/final-identity.json
          printf 'repository=%s\nbase_sha=%s\nhead_sha=%s\nmerge_sha=%s\nrun_id=%s\n' \
            "$BASE_REPOSITORY" "$SOURCE_BASE_SHA" "$SOURCE_HEAD_SHA" \
            "$PROSPECTIVE_MERGE_SHA" "$GITHUB_RUN_ID"
          cat run/prospective-merge/final-identity.json
