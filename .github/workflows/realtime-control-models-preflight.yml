name: realtime-control-models-preflight

on:
  push:
    branches: [tooling/realtime-control-models-preflight-2026-09-06]
    paths:
      - '.github/workflows/realtime-control-models-preflight.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PRODUCT_BRANCH: codex/realtime-control-models-2026-09-06
      EXPECTED_BASE: 7deee4377cff401854647151842c582f038feef1
    steps:
      - name: Fetch exact current product branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=16 origin \
            "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/product"
          git -C "$GITHUB_WORKSPACE" checkout --detach refs/remotes/origin/product
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor \
            "$EXPECTED_BASE" HEAD
          test -f "$GITHUB_WORKSPACE/crates/trnm-presence-router-v2/src/connection_actor.rs"
          test -f "$GITHUB_WORKSPACE/crates/trnm-presence-router-v2/src/reconnect_cursor.rs"
          test -f "$GITHUB_WORKSPACE/crates/trnm-presence-router-v2/src/disconnect_journal.rs"
          printf 'head=%s\ntree=%s\nbase=%s\n' \
            "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            "$(git -C "$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')" \
            "$EXPECTED_BASE"

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Format, test and strictly lint realtime controls
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets --locked -- -D warnings

      - name: Record zero-credit source receipt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'source_candidate=true' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false' \
            'public_online=false'
