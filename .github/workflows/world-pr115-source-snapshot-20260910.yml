name: world-pr115-read-only-source-snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    name: world-pr115/read-only-source-snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch, verify, and package exact World PR 115 head
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/pulls/115'
          start="$RUNNER_TEMP/world-pr-start.json"
          finish="$RUNNER_TEMP/world-pr-finish.json"
          head_dir="$RUNNER_TEMP/world-head"
          out="$RUNNER_TEMP/world-pr115-source"

          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > "$start"
          read -r base head merge state draft < <(
            python3 - "$start" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              pull = json.load(handle)
          print(
              pull['base']['sha'],
              pull['head']['sha'],
              pull['merge_commit_sha'],
              pull['state'],
              str(pull['draft']).lower(),
          )
          PY
          )
          test "$state" = open
          test "$draft" = true
          test -n "$base"
          test -n "$head"
          test -n "$merge"

          rm -rf "$head_dir" "$out"
          git init "$head_dir"
          git -C "$head_dir" remote add origin \
            'https://github.com/TrillionniumFoundation/Trillionnium-World.git'
          git -C "$head_dir" fetch --no-tags --depth=1 origin "$head"
          git -C "$head_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$head_dir" rev-parse HEAD)" = "$head"
          tree="$(git -C "$head_dir" rev-parse 'HEAD^{tree}')"

          mkdir -p "$out"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude=.git \
            --exclude=target \
            --exclude=run \
            -czf "$out/world-pr115-head-source.tar.gz" \
            -C "$head_dir" .
          sha256sum "$out/world-pr115-head-source.tar.gz" > "$out/SHA256SUMS"

          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > "$finish"
          python3 - "$start" "$finish" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              start = json.load(handle)
          with open(sys.argv[2], encoding='utf-8') as handle:
              finish = json.load(handle)
          def subject(pull):
              return (
                  pull['base']['sha'],
                  pull['head']['sha'],
                  pull['merge_commit_sha'],
                  pull['state'],
                  pull['draft'],
              )
          assert subject(start) == subject(finish), (subject(start), subject(finish))
          PY

          {
            printf 'repository=TrillionniumFoundation/Trillionnium-World\n'
            printf 'pull_request=115\n'
            printf 'base=%s\n' "$base"
            printf 'head=%s\n' "$head"
            printf 'head_tree=%s\n' "$tree"
            printf 'prospective_merge=%s\n' "$merge"
            printf 'runner_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'runner_commit=%s\n' "$GITHUB_SHA"
            printf 'runner_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'production_authorization=not_granted\n'
          } > "$out/identity.txt"
          cat "$out/identity.txt"
          cat "$out/SHA256SUMS"
          printf 'WORLD_PR115_SOURCE_SNAPSHOT=PASS\n'

      - name: Upload exact World source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-pr115-source-snapshot
          path: ${{ runner.temp }}/world-pr115-source/**
          if-no-files-found: error
          retention-days: 7
