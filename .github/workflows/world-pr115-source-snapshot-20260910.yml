name: world-pr104-campaign-test-module-tranche

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: world-pr104-campaign-test-module-tranche
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_SOURCE_SHA: '5e83f616c1de0fa54640df1e1ef7b15e3266204b'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qualify:
    name: world-pr104/campaign-test-module-tranche
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch immutable World source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/world"
          git init "$root"
          git -C "$root" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$root" fetch --no-tags --depth=2 origin "$WORLD_SOURCE_SHA"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$WORLD_SOURCE_SHA"
          printf 'WORLD_CAMPAIGN_TRANCHE_SOURCE=%s\n' "$WORLD_SOURCE_SHA"

      - name: Install pinned Rust and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.list.save
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version

      - name: Convert campaign test bodies to explicit modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/world" <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          tests = root / "trillionnium/crates/trnm-campaign-core/src/lib_parts/tests"
          wrapper = tests / "part_01.rs"
          expected = '''use super::*;
          use tempfile::tempdir;

          include!(concat!(
              env!("CARGO_MANIFEST_DIR"),
              "/src/lib_parts/tests/campaign_tests_01.rs"
          ));
          include!(concat!(
              env!("CARGO_MANIFEST_DIR"),
              "/src/lib_parts/tests/campaign_tests_02.rs"
          ));
          include!(concat!(
              env!("CARGO_MANIFEST_DIR"),
              "/src/lib_parts/tests/campaign_tests_03.rs"
          ));
          '''
          assert wrapper.read_text(encoding="utf-8") == expected, "campaign test wrapper drift"
          wrapper.write_text(
              '''use super::*;
          use tempfile::tempdir;

          #[path = "campaign_tests_01.rs"]
          mod campaign_tests_01;
          #[allow(unused_imports)]
          use campaign_tests_01::*;

          #[path = "campaign_tests_02.rs"]
          mod campaign_tests_02;
          #[allow(unused_imports)]
          use campaign_tests_02::*;

          #[path = "campaign_tests_03.rs"]
          mod campaign_tests_03;
          #[allow(unused_imports)]
          use campaign_tests_03::*;
          ''',
              encoding="utf-8",
          )

          declaration = re.compile(
              r"^(    )(?:(pub(?:\([^)]*\))?\s+))?((?:async\s+)?fn|struct|enum|const|static|type|trait)\s+",
              re.MULTILINE,
          )
          for index in range(1, 4):
              path = tests / f"campaign_tests_{index:02d}.rs"
              source = path.read_text(encoding="utf-8")
              assert not source.startswith("use super::*;"), path
              source = declaration.sub(lambda match: f"{match.group(1)}pub(super) {match.group(3)} ", source)
              path.write_text("use super::*;\n\n" + source, encoding="utf-8")

          # rustfmt may alter wrapper/body bytes; manifest is refreshed after formatting.
          manifest_path = root / "trillionnium/crates/trnm-campaign-core/src/lib_parts/manifest.json"
          ledger_path = root / "scripts/contracts/trnm-world-include-migrations-v1.json"
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          existing = {(item["path"], item["expression"]) for item in ledger["completed"]}
          for index in range(1, 4):
              expression = f'concat!(env!("CARGO_MANIFEST_DIR"),"/src/lib_parts/tests/campaign_tests_{index:02d}.rs")'
              key = ("trillionnium/crates/trnm-campaign-core/src/lib_parts/tests/part_01.rs", expression)
              assert key not in existing
              ledger["completed"].append({
                  "path": key[0],
                  "expression": expression,
                  "replacement_module": f"campaign_tests_{index:02d}",
                  "required_fragments": [
                      f'#[path = "campaign_tests_{index:02d}.rs"]',
                      f"mod campaign_tests_{index:02d};",
                  ],
                  "completed_commit": "5e83f616c1de0fa54640df1e1ef7b15e3266204b",
              })
          ledger_path.write_text(json.dumps(ledger, indent=2) + "\n", encoding="utf-8")
          print("WORLD_CAMPAIGN_TEST_MODULE_TRANSFORM=PASS")
          PY
          cd "$RUNNER_TEMP/world/trillionnium"
          cargo fmt --all
          python3 - "$RUNNER_TEMP/world" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest_path = root / "trillionnium/crates/trnm-campaign-core/src/lib_parts/manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          base = manifest_path.parent.parent
          changed = {
              "lib_parts/tests/part_01.rs",
              "lib_parts/tests/campaign_tests_01.rs",
              "lib_parts/tests/campaign_tests_02.rs",
              "lib_parts/tests/campaign_tests_03.rs",
          }
          seen = set()
          for field in ("parts", "nested_test_parts"):
              for record in manifest[field]:
                  if record["path"] in changed:
                      payload = (base / record["path"]).read_bytes()
                      record["bytes"] = len(payload)
                      record["sha256"] = hashlib.sha256(payload).hexdigest()
                      seen.add(record["path"])
          assert seen == changed, (seen, changed)
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print("WORLD_CAMPAIGN_TEST_MANIFEST_REFRESH=PASS")
          PY

      - name: Qualify transformed source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/world"
          cd "$root"
          cargo fmt --manifest-path trillionnium/Cargo.toml --all --check
          cargo test --manifest-path trillionnium/Cargo.toml -p trnm-campaign-core --all-targets
          cargo clippy --manifest-path trillionnium/Cargo.toml -p trnm-campaign-core --all-targets -- -D warnings
          python3 scripts/check-trnm-world-include-boundaries.py
          bash scripts/run-trnm-world-v6-qualification-v2.sh source
          printf 'WORLD_CAMPAIGN_TEST_MODULE_QUALIFICATION=PASS\n'

      - name: Emit content-addressed candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/world" <<'PY'
          import base64
          import hashlib
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          paths = [
              "trillionnium/crates/trnm-campaign-core/src/lib_parts/tests/part_01.rs",
              "trillionnium/crates/trnm-campaign-core/src/lib_parts/tests/campaign_tests_01.rs",
              "trillionnium/crates/trnm-campaign-core/src/lib_parts/tests/campaign_tests_02.rs",
              "trillionnium/crates/trnm-campaign-core/src/lib_parts/tests/campaign_tests_03.rs",
              "trillionnium/crates/trnm-campaign-core/src/lib_parts/manifest.json",
          ]
          chunk_size = 2400
          for relative in paths:
              payload = (root / relative).read_bytes()
              encoded = base64.b64encode(payload).decode("ascii")
              chunks = [encoded[offset:offset + chunk_size] for offset in range(0, len(encoded), chunk_size)]
              print(f"TRNM_BLOB_BEGIN path={relative} bytes={len(payload)} sha256={hashlib.sha256(payload).hexdigest()} chunks={len(chunks)}")
              for index, chunk in enumerate(chunks):
                  print(f"TRNM_BLOB_CHUNK path={relative} index={index} data={chunk}")
              print(f"TRNM_BLOB_END path={relative}")
          print("PRODUCTION_AUTHORIZATION=not_granted")
          PY
