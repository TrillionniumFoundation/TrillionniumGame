name: world-pr104-read-only-source-packet

on:
  pull_request:

permissions:
  contents: read

jobs:
  packet:
    name: world-pr104/read-only-source-packet
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Export exact World PR 104 migration inputs to the immutable log
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/pulls/104'
          pull="$RUNNER_TEMP/world-pr104.json"
          root="$RUNNER_TEMP/world-pr104"
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > "$pull"
          base="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["base"]["sha"])' "$pull")"
          head="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head"]["sha"])' "$pull")"
          merge="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["merge_commit_sha"])' "$pull")"
          state="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["state"])' "$pull")"
          draft="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["draft"]).lower())' "$pull")"
          test "$state" = open
          test "$draft" = true
          test -n "$base"
          test -n "$head"
          test -n "$merge"
          rm -rf "$root"
          git init "$root"
          git -C "$root" remote add origin 'https://github.com/TrillionniumFoundation/Trillionnium-World.git'
          git -C "$root" fetch --no-tags --depth=1 origin "$head"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$head"
          tree="$(git -C "$root" rev-parse 'HEAD^{tree}')"
          printf 'WORLD_PR104_PACKET_IDENTITY base=%s head=%s tree=%s merge=%s\n' "$base" "$head" "$tree" "$merge"
          files=(
            'trillionnium/crates/trnm-campaign-core/src/lib_parts/tests/part_01.rs'
            'trillionnium/crates/trnm-campaign-core/src/lib_parts/tests/campaign_tests_03.rs'
            'trillionnium/crates/trnm-campaign-core/src/lib_parts/manifest.json'
            'trillionnium/crates/trnm-game-server/src/lib_parts/tests/part_01.rs'
            'trillionnium/crates/trnm-game-server/src/lib_parts/tests/game_server_tests_04.rs'
            'trillionnium/crates/trnm-game-server/src/lib_parts/manifest.json'
            'trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/part_01.rs'
            'trillionnium/crates/trnm-rts-sim/src/lib_parts/tests/rts_tests_03.rs'
            'trillionnium/crates/trnm-rts-sim/src/lib_parts/manifest.json'
            'scripts/contracts/trnm-world-include-migrations-v1.json'
          )
          for relative in "${files[@]}"; do
            file="$root/$relative"
            test -f "$file"
            bytes="$(wc -c < "$file")"
            digest="$(sha256sum "$file" | cut -d' ' -f1)"
            printf 'WORLD_PACKET_FILE_BEGIN path=%s bytes=%s sha256=%s\n' "$relative" "$bytes" "$digest"
            base64 -w0 "$file"
            printf '\nWORLD_PACKET_FILE_END path=%s\n' "$relative"
          done
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" > "$RUNNER_TEMP/world-pr104-finish.json"
          finish_head="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["head"]["sha"])' "$RUNNER_TEMP/world-pr104-finish.json")"
          finish_merge="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["merge_commit_sha"])' "$RUNNER_TEMP/world-pr104-finish.json")"
          test "$finish_head" = "$head"
          test "$finish_merge" = "$merge"
          printf 'WORLD_PR104_READ_ONLY_SOURCE_PACKET=PASS\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
