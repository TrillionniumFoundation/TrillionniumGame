name: world-pr115-read-only-source-snapshot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-pr115-source-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_PR_NUMBER: '115'

jobs:
  snapshot:
    name: world-pr115/read-only-source-snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Freeze live World PR 115 tuple
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${WORLD_REPOSITORY}/pulls/${WORLD_PR_NUMBER}" \
            > "$RUNNER_TEMP/world-pr-start.json"
          python3 - "$RUNNER_TEMP/world-pr-start.json" "$GITHUB_ENV" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              pull = json.load(handle)
          assert pull["number"] == 115
          assert pull["state"] == "open"
          assert pull["draft"] is True
          assert pull["base"]["ref"] == "main"
          assert pull["head"]["repo"]["full_name"] == "TrillionniumFoundation/Trillionnium-World"
          assert pull["merge_commit_sha"]
          values = {
              "WORLD_BASE_SHA": pull["base"]["sha"],
              "WORLD_HEAD_SHA": pull["head"]["sha"],
              "WORLD_MERGE_SHA": pull["merge_commit_sha"],
          }
          with open(sys.argv[2], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")
          print("WORLD_PR115_SOURCE_SNAPSHOT_TUPLE=PASS")
          print(values)
          PY

      - name: Fetch and verify exact World head and merge
        shell: bash
        run: |
          set -euo pipefail
          head_dir="$RUNNER_TEMP/world-head"
          merge_dir="$RUNNER_TEMP/world-merge"
          rm -rf "$head_dir" "$merge_dir"

          git init "$head_dir"
          git -C "$head_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$head_dir" fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C "$head_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$head_dir" rev-parse HEAD)" = "$WORLD_HEAD_SHA"

          git init "$merge_dir"
          git -C "$merge_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$merge_dir" fetch --no-tags --depth=2 origin "$WORLD_MERGE_SHA"
          git -C "$merge_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$merge_dir" rev-parse HEAD)" = "$WORLD_MERGE_SHA"
          test "$(git -C "$merge_dir" show -s --format=%P HEAD)" = "$WORLD_BASE_SHA $WORLD_HEAD_SHA"

          head_tree="$(git -C "$head_dir" rev-parse 'HEAD^{tree}')"
          merge_tree="$(git -C "$merge_dir" rev-parse 'HEAD^{tree}')"
          test "$head_tree" = "$merge_tree"
          printf 'WORLD_HEAD_TREE=%s\nWORLD_MERGE_TREE=%s\n' "$head_tree" "$merge_tree" >> "$GITHUB_ENV"
          printf 'WORLD_PR115_SOURCE_SNAPSHOT_OBJECTS=PASS\n'

      - name: Build deterministic read-only source bundle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/world-pr115-source"
          rm -rf "$out"
          mkdir -p "$out"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --exclude=.git \
            --exclude=target \
            --exclude=run \
            -czf "$out/world-pr115-head-source.tar.gz" \
            -C "$RUNNER_TEMP/world-head" .
          sha256sum "$out/world-pr115-head-source.tar.gz" > "$out/SHA256SUMS"
          {
            printf 'repository=%s\n' "$WORLD_REPOSITORY"
            printf 'pull_request=%s\n' "$WORLD_PR_NUMBER"
            printf 'base=%s\n' "$WORLD_BASE_SHA"
            printf 'head=%s\n' "$WORLD_HEAD_SHA"
            printf 'head_tree=%s\n' "$WORLD_HEAD_TREE"
            printf 'prospective_merge=%s\n' "$WORLD_MERGE_SHA"
            printf 'merge_tree=%s\n' "$WORLD_MERGE_TREE"
            printf 'runner_repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'runner_commit=%s\n' "$GITHUB_SHA"
            printf 'runner_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'production_authorization=not_granted\n'
          } > "$out/identity.txt"
          cat "$out/identity.txt"
          cat "$out/SHA256SUMS"

      - name: Reject World tuple movement
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${WORLD_REPOSITORY}/pulls/${WORLD_PR_NUMBER}" \
            > "$RUNNER_TEMP/world-pr-finish.json"
          python3 - "$RUNNER_TEMP/world-pr-start.json" "$RUNNER_TEMP/world-pr-finish.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              start = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              finish = json.load(handle)
          def subject(pull):
              return (
                  pull["base"]["sha"],
                  pull["head"]["sha"],
                  pull["merge_commit_sha"],
                  pull["state"],
                  pull["draft"],
              )
          assert subject(start) == subject(finish), (subject(start), subject(finish))
          print("WORLD_PR115_SOURCE_SNAPSHOT_CURRENT=PASS")
          PY

      - name: Upload exact World source snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world-pr115-source-${{ env.WORLD_HEAD_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/world-pr115-source/**
          if-no-files-found: error
          retention-days: 7
