name: codex-governance-readback-review-repair-r4

on:
  push:
    branches:
      - ops/governance-readback-packet-2026-09-08

permissions:
  contents: write

concurrency:
  group: codex-governance-readback-review-repair-r4
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_HEAD: c1fe85b1aee4346c796bb7ffc15c80e00ff34ab4
      TARGET_BRANCH: ops/governance-readback-packet-2026-09-08
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch exact temporary repair object
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin \
            "+${GITHUB_SHA}:refs/remotes/origin/repair"
          git -C "$GITHUB_WORKSPACE" checkout --detach refs/remotes/origin/repair
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$SOURCE_HEAD"
          actual=$(git diff --name-only "$SOURCE_HEAD" HEAD | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/codex-governance-readback-review-repair-r4.yml' \
            'scripts/codex-apply-governance-readback-r4.py' | sort)
          test "$actual" = "$expected"

      - name: Apply reviewed hardening and qualify final tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 scripts/codex-apply-governance-readback-r4.py
          python3 -m py_compile \
            scripts/capture-repository-governance-readback.py \
            tests/control_plane/test_capture_repository_governance_readback.py
          python3 -m unittest -v \
            tests/control_plane/test_capture_repository_governance_readback.py
          rm -f \
            .github/workflows/codex-governance-readback-review-repair-r4.yml \
            scripts/codex-apply-governance-readback-r4.py
          git add -A
          test ! -e .github/workflows/codex-governance-readback-review-repair-r4.yml
          test ! -e scripts/codex-apply-governance-readback-r4.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-plan.py
          python3 scripts/check-documentation-authority.py
          git diff --cached --check "$SOURCE_HEAD"
          actual=$(git diff --cached --name-only "$SOURCE_HEAD" | sort)
          expected=$(printf '%s\n' \
            'scripts/capture-repository-governance-readback.py' \
            'tests/control_plane/test_capture_repository_governance_readback.py' | sort)
          test "$actual" = "$expected"
          ! git diff --cached --quiet

      - name: Publish source-only non-force repair
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          remote_head=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(governance): close readback review findings"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
