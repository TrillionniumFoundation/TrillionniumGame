name: temporary-shared-app-metrics-v3

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-shared-app-metrics-v3
  cancel-in-progress: false

jobs:
  patch-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Reuse verified patch, close strict lint and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source_workflow = Path(
              ".github/workflows/temporary-shared-app-metrics-v2.yml"
          )
          source = source_workflow.read_text(encoding="utf-8")
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          patch = textwrap.dedent(source[start:end])
          patch_path = Path("/tmp/shared-app-metrics-patch.py")
          patch_path.write_text(patch + "\n", encoding="utf-8")
          subprocess.run(["python3", str(patch_path)], check=True)

          app = Path("crates/trnm-persistence-pg/src/bin/trnm_server/app.rs")
          content = app.read_text(encoding="utf-8")
          old = "    #[must_use]\n    pub fn new(repository: R, admin_token: String) -> Self {\n"
          new = (
              "    #[cfg(test)]\n"
              "    #[must_use]\n"
              "    pub fn new(repository: R, admin_token: String) -> Self {\n"
          )
          if content.count(old) != 1:
              raise SystemExit(
                  f"{app}: expected one App::new anchor, found {content.count(old)}"
              )
          app.write_text(content.replace(old, new, 1), encoding="utf-8")

          current = Path(
              ".github/workflows/temporary-shared-app-metrics-v3.yml"
          )
          if not current.is_file():
              raise SystemExit("current temporary workflow is missing")
          current.unlink()
          PY
          test ! -e .github/workflows/temporary-shared-process-metrics.yml
          test ! -e .github/workflows/temporary-shared-app-metrics-v2.yml
          test ! -e .github/workflows/temporary-shared-app-metrics-v3.yml
          git diff --check

      - name: Validate exact source corpus
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit verified clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-shared-process-metrics.yml
          test ! -e .github/workflows/temporary-shared-app-metrics-v2.yml
          test ! -e .github/workflows/temporary-shared-app-metrics-v3.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(server): aggregate metrics across concurrent workers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
