name: trillionnium-game-actions-unblock-smoke

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: actions-unblock-followup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-followup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/plan-v3-gap-closure-2026-08-29'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: feat/plan-v3-gap-closure-2026-08-29
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact feature head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$EXPECTED_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Apply bounded repair
        run: python3 scripts/repair-v3-followup.py
      - name: Validate repaired source and workflow policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-workflow-action-policy.py
          python3 -m py_compile scripts/generate-runtime-denominator.py
          bash -n scripts/oracle/run-immutable-smoke.sh
          git diff --check
      - name: Create reviewed repair commit
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(control): bind workflows to exact head and preserve parser residuals'
          git show -s --format='repair_commit=%H%ntree=%T'
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${BRANCH}"
