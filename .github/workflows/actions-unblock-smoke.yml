name: trillionnium-game-actions-unblock-smoke

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actions-unblock-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-unblock-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_PR_NUMBER: '104'
  WORLD_RUST_TOOLCHAIN: '1.98.1'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: postgres
  TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
  TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94

jobs:
  repository-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record exact execution identity without checkout or external actions
        shell: bash
        run: |
          set -euo pipefail
          printf 'repository=%s\nsha=%s\nref=%s\nevent=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF" \
            "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID"
          test "$GITHUB_REPOSITORY" = 'TrillionniumFoundation/TrillionniumGame'
          test -n "$GITHUB_SHA"
          test -n "$GITHUB_RUN_ID"

  freeze_world_tuple:
    name: freeze-world-pr-104-tuple
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.freeze.outputs.base_sha }}
      head_sha: ${{ steps.freeze.outputs.head_sha }}
      head_tree: ${{ steps.freeze.outputs.head_tree }}
      merge_sha: ${{ steps.freeze.outputs.merge_sha }}
      merge_tree: ${{ steps.freeze.outputs.merge_tree }}
    steps:
      - id: freeze
        name: Fetch PR refs and freeze one immutable tuple
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/world-tuple"
          rm -rf "$repo"
          git init "$repo"
          git -C "$repo" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$repo" fetch --no-tags --depth=2 origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            "+refs/pull/${WORLD_PR_NUMBER}/head:refs/remotes/origin/pr-head" \
            "+refs/pull/${WORLD_PR_NUMBER}/merge:refs/remotes/origin/pr-merge"
          base_sha="$(git -C "$repo" rev-parse refs/remotes/origin/main)"
          head_sha="$(git -C "$repo" rev-parse refs/remotes/origin/pr-head)"
          merge_sha="$(git -C "$repo" rev-parse refs/remotes/origin/pr-merge)"
          head_tree="$(git -C "$repo" rev-parse "${head_sha}^{tree}")"
          merge_tree="$(git -C "$repo" rev-parse "${merge_sha}^{tree}")"
          test "$(git -C "$repo" rev-parse "${merge_sha}^1")" = "$base_sha"
          test "$(git -C "$repo" rev-parse "${merge_sha}^2")" = "$head_sha"
          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'head_sha=%s\n' "$head_sha"
            printf 'head_tree=%s\n' "$head_tree"
            printf 'merge_sha=%s\n' "$merge_sha"
            printf 'merge_tree=%s\n' "$merge_tree"
          } | tee -a "$GITHUB_OUTPUT"
          printf 'world_repository=%s\nworld_pr=%s\nproduction_authorization=not_granted\n' \
            "$WORLD_REPOSITORY" "$WORLD_PR_NUMBER"

  external-world-v6:
    name: external-world-v6 (${{ matrix.scope }})
    needs: freeze_world_tuple
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        scope: [truth, source, postgres, package]
    env:
      WORLD_BASE_SHA: ${{ needs.freeze_world_tuple.outputs.base_sha }}
      WORLD_HEAD_SHA: ${{ needs.freeze_world_tuple.outputs.head_sha }}
      WORLD_HEAD_TREE: ${{ needs.freeze_world_tuple.outputs.head_tree }}
      WORLD_MERGE_SHA: ${{ needs.freeze_world_tuple.outputs.merge_sha }}
      WORLD_MERGE_TREE: ${{ needs.freeze_world_tuple.outputs.merge_tree }}
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Fetch and verify frozen World objects
        shell: bash
        run: |
          set -euo pipefail
          head_dir="$RUNNER_TEMP/world-head"
          merge_dir="$RUNNER_TEMP/world-merge"
          rm -rf "$head_dir" "$merge_dir"
          git init "$head_dir"
          git -C "$head_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$head_dir" fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C "$head_dir" checkout --detach FETCH_HEAD
          git init "$merge_dir"
          git -C "$merge_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$merge_dir" fetch --no-tags --depth=2 origin "$WORLD_MERGE_SHA"
          git -C "$merge_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$head_dir" rev-parse HEAD)" = "$WORLD_HEAD_SHA"
          test "$(git -C "$head_dir" rev-parse 'HEAD^{tree}')" = "$WORLD_HEAD_TREE"
          test "$(git -C "$merge_dir" rev-parse HEAD)" = "$WORLD_MERGE_SHA"
          test "$(git -C "$merge_dir" rev-parse 'HEAD^{tree}')" = "$WORLD_MERGE_TREE"
          test "$(git -C "$merge_dir" rev-parse HEAD^1)" = "$WORLD_BASE_SHA"
          test "$(git -C "$merge_dir" rev-parse HEAD^2)" = "$WORLD_HEAD_SHA"
          test -z "$(git -C "$head_dir" status --porcelain=v1 --untracked-files=no)"
          test -z "$(git -C "$merge_dir" status --porcelain=v1 --untracked-files=no)"

      - name: Install pinned World toolchain
        if: ${{ matrix.scope != 'truth' }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$WORLD_RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup override set "$WORLD_RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config postgresql-client
          rustc --version --verbose
          cargo --version --verbose
          psql --version

      - name: Qualify frozen World head
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-head"
          bash scripts/run-trnm-world-v6-qualification-v2.sh "${{ matrix.scope }}"

      - name: Qualify frozen World prospective merge
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-merge"
          bash scripts/run-trnm-world-v6-qualification-v2.sh "${{ matrix.scope }}"

      - name: Assemble immutable evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/external-evidence/${{ matrix.scope }}"
          mkdir -p "$out/head" "$out/merge"
          for pair in \
            "$RUNNER_TEMP/world-head:$out/head" \
            "$RUNNER_TEMP/world-merge:$out/merge"; do
            root="${pair%%:*}"
            dest="${pair#*:}"
            source="$root/run/world-v6-v2/${{ matrix.scope }}"
            test ! -d "$source" || cp -R "$source/." "$dest/"
          done
          {
            printf 'world_repository=%s\nworld_pr=%s\n' "$WORLD_REPOSITORY" "$WORLD_PR_NUMBER"
            printf 'world_base_sha=%s\nworld_head_sha=%s\nworld_head_tree=%s\n' \
              "$WORLD_BASE_SHA" "$WORLD_HEAD_SHA" "$WORLD_HEAD_TREE"
            printf 'world_merge_sha=%s\nworld_merge_tree=%s\nscope=%s\n' \
              "$WORLD_MERGE_SHA" "$WORLD_MERGE_TREE" "${{ matrix.scope }}"
            printf 'external_runner_repository=%s\nexternal_runner_commit=%s\nexternal_runner_run_id=%s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID"
            printf 'production_authorization=not_granted\n'
          } > "$out/attestation.txt"
          find "$out" -type f -print0 | sort -z | xargs -0 -r sha256sum > "$out/SHA256SUMS"

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-world-v6-${{ matrix.scope }}-${{ needs.freeze_world_tuple.outputs.head_sha }}-${{ needs.freeze_world_tuple.outputs.merge_sha }}-${{ github.run_attempt }}
          path: external-evidence/${{ matrix.scope }}/**
          if-no-files-found: warn
          retention-days: 30
