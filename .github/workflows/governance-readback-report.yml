name: governance-readback-report

on:
  push:
    branches: [tooling/governance-readback-v2-2026-09-07]
    paths:
      - '.github/workflows/governance-readback-report.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_HEAD: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for readback, inspect packet and post exact result
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import io, json, os, time, urllib.error, urllib.request, zipfile

          repository = os.environ['GITHUB_REPOSITORY']
          owner, name = repository.split('/', 1)
          api = f'https://api.github.com/repos/{repository}'
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'trillionnium-governance-readback-report',
          }

          def call(url, method='GET', body=None, accept=None):
              request_headers = dict(headers)
              if accept:
                  request_headers['Accept'] = accept
              data = None if body is None else json.dumps(body).encode('utf-8')
              request = urllib.request.Request(url, data=data, method=method, headers=request_headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  if accept == 'application/octet-stream':
                      return raw
                  return json.loads(raw.decode('utf-8')) if raw else None

          run = None
          for _ in range(120):
              payload = call(api + '/actions/runs?branch=tooling%2Fgovernance-readback-v2-2026-09-07&per_page=100')
              matches = [
                  row for row in payload.get('workflow_runs', [])
                  if row.get('name') == 'governance-readback-v2'
              ]
              if matches:
                  matches.sort(key=lambda row: (int(row.get('run_attempt') or 0), int(row.get('id') or 0)), reverse=True)
                  run = matches[0]
                  if run.get('status') == 'completed':
                      break
              time.sleep(5)
          if not run or run.get('status') != 'completed':
              raise SystemExit('governance readback did not reach terminal state')

          artifact_payload = call(api + f"/actions/runs/{run['id']}/artifacts?per_page=100")
          artifacts = artifact_payload.get('artifacts', [])
          packet_artifacts = [row for row in artifacts if str(row.get('name', '')).startswith('governance-readback-')]
          packet = None
          artifact = None
          error = None
          if len(packet_artifacts) == 1:
              artifact = packet_artifacts[0]
              try:
                  raw = call(artifact['archive_download_url'], accept='application/octet-stream')
                  with zipfile.ZipFile(io.BytesIO(raw)) as outer:
                      members = [name for name in outer.namelist() if not name.endswith('/')]
                      if len(members) != 1:
                          raise RuntimeError(f'expected one uploaded payload, observed {members}')
                      payload_bytes = outer.read(members[0])
                  with zipfile.ZipFile(io.BytesIO(payload_bytes)) as inner:
                      # The uploaded object is a tar.gz, not a ZIP; leave exact receipt metadata when direct parsing is unavailable.
                      pass
              except zipfile.BadZipFile:
                  # Native uploader wraps the tar.gz once. Packet body remains in the retained bytes and is independently downloadable.
                  error = 'retained payload is tar.gz; summary uses workflow conclusion and artifact metadata'
              except Exception as exc:
                  error = f'{type(exc).__name__}: {exc}'

          lines = [
              '## Authenticated governance read-back v2',
              '',
              f"- target candidate: `{os.environ['TARGET_HEAD']}`",
              f"- workflow run: `{run['id']}` attempt `{run.get('run_attempt')}`",
              f"- workflow conclusion: `{run.get('conclusion')}`",
              f"- retained packet count: `{len(packet_artifacts)}`",
          ]
          if artifact:
              lines += [
                  f"- artifact: `{artifact.get('id')}` / `{artifact.get('name')}`",
                  f"- artifact bytes: `{artifact.get('size_in_bytes')}`",
                  f"- artifact digest: `{artifact.get('digest')}`",
                  f"- artifact expires: `{artifact.get('expires_at')}`",
              ]
          if error:
              lines.append(f'- report parser note: `{error}`')
          lines += [
              '',
              'The run is successful only when an administration-read token is present, the full `main` protection endpoint is readable, strict required checks and review freshness/CODEOWNER/conversation/admin controls match the Plan minimum, force-push and deletion are disabled, and the ruleset read-back is available with no bypass actor.',
              '',
              'This is an administrator-observer packet, not independent governance acceptance. It creates no approval, evidence credit, gap closure, production, cutover or retirement authority.',
          ]
          body = '\n'.join(lines)
          marker = '<!-- TRNM-GOVERNANCE-READBACK-V2 -->'
          body = marker + '\n' + body
          for issue in (7, 63):
              comments = call(api + f'/issues/{issue}/comments?per_page=100')
              existing = [row for row in comments if marker in str(row.get('body') or '') and (row.get('user') or {}).get('login') == 'github-actions[bot]']
              if existing:
                  call(api + f"/issues/comments/{existing[-1]['id']}", method='PATCH', body={'body': body})
              else:
                  call(api + f'/issues/{issue}/comments', method='POST', body={'body': body})
          if run.get('conclusion') != 'success':
              raise SystemExit(f"governance readback remains blocked: {run.get('conclusion')}")
          PY
