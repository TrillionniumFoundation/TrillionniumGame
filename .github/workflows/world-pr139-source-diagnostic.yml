name: World PR139 exact source diagnostic

on:
  push:
    branches: [ops/world-pr138-source-diagnostic-20260912]

permissions:
  contents: read

concurrency:
  group: world-pr139-source-diagnostic-${{ github.ref }}
  cancel-in-progress: true

env:
  WORLD_BRANCH: fix/world-gap-execution-v15-20260912
  WORLD_HEAD: bfafb6a88fd422b4fa28108348a2f7f3bdde88a7
  WORLD_TREE: 30aaf3c0c3b33375a6cdf0df62a3708a17f971d6
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  PYTHONDONTWRITEBYTECODE: '1'
  PRODUCTION_AUTHORIZATION: not_granted

jobs:
  diagnose:
    name: world-pr139-exact-source-not-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Materialize exact World PR139 head
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout --single-branch --branch "$WORLD_BRANCH" \
            https://github.com/TrillionniumFoundation/Trillionnium-World.git "$RUNNER_TEMP/world"
          git -C "$RUNNER_TEMP/world" checkout --quiet --detach "$WORLD_HEAD"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse HEAD)" = "$WORLD_HEAD"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"
          test -z "$(git -C "$RUNNER_TEMP/world" status --porcelain=v1 --untracked-files=no)"

      - name: Install exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client python3-yaml pkg-config libasound2-dev libudev-dev \
            libx11-dev libxi-dev libxkbcommon-dev libwayland-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          test "$(rustc --version | awk '{print $2}')" = "$RUSTUP_TOOLCHAIN"
          test "$(psql -Atqc 'show server_version_num')" = 160004
          rustc --version --verbose
          cargo --version --verbose

      - name: Run truth and source qualification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          bash scripts/run-trnm-world-v6-qualification-v2.sh truth
          bash scripts/run-trnm-world-v6-qualification-v2.sh source
          python3 scripts/check-trnm-world-include-boundaries.py
          python3 scripts/test-trnm-world-include-boundaries.py
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Check exact Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          cargo fmt --manifest-path trillionnium/crates/world-authority/Cargo.toml --all -- --check

      - name: Run World authority all-target tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          cargo test --manifest-path trillionnium/crates/world-authority/Cargo.toml \
            --workspace --all-targets --locked

      - name: Run World authority strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          cargo clippy --manifest-path trillionnium/crates/world-authority/Cargo.toml \
            --workspace --all-targets --locked -- -D warnings

      - name: Run PostgreSQL cutover harness
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world"
          bash scripts/run-trnm-world-authority-postgres-check.sh

      - name: Report diagnostic scope
        if: always()
        shell: bash
        run: |
          printf 'repository_native_admission=false\n'
          printf 'independent_acceptance=false\n'
          printf 'production_authorization=%s\n' "$PRODUCTION_AUTHORIZATION"
