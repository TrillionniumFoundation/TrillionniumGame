name: temporary-app-secret-redaction-20260831

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-app-secret-redaction-20260831
  cancel-in-progress: false

jobs:
  patch-verify-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Redact App Debug and remove transients
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/trnm-persistence-pg/src/bin/trnm_server/app.rs')
          source = path.read_text(encoding='utf-8')
          if 'impl<R: std::fmt::Debug> std::fmt::Debug for App<R>' not in source:
              source = source.replace('#[derive(Debug)]\npub struct App<R> {', 'pub struct App<R> {', 1)
              anchor = 'impl<R: Repository> App<R> {'
              index = source.find(anchor)
              if index < 0:
                  raise SystemExit('App implementation anchor is missing')
              implementation = '''impl<R: std::fmt::Debug> std::fmt::Debug for App<R> {
              fn fmt(&self, formatter: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
                  formatter
                      .debug_struct("App")
                      .field("repository", &self.repository)
                      .field("admin_token", &"<redacted>")
                      .field("draining", &self.draining)
                      .field("metrics", &self.metrics)
                      .finish()
              }
          }

          '''
              source = source[:index] + implementation + source[index:]
              test_anchor = '''    #[test]
              fn admin_token_comparison_rejects_a_256_byte_length_delta() {
          '''
              if test_anchor in source:
                  source = source.replace(
                      test_anchor,
                      '''    #[test]
              fn app_debug_redacts_admin_token() {
                  let secret = token();
                  let app = App::new(FakeRepository::default(), secret.clone());
                  let debug = format!("{app:?}");
                  assert!(debug.contains("<redacted>"));
                  assert!(!debug.contains(&secret));
              }

          ''' + test_anchor,
                      1,
                  )
          path.write_text(source, encoding='utf-8')
          PY
          find .github/workflows -maxdepth 1 -type f -name 'temporary-*' -print -delete
          if [[ -d .github/tmp ]]; then
            find .github/tmp -type f \( -name 'add-pg-cancel-watchdog.py' -o -name 'pg-operations-patch.*' \) -print -delete
            find .github/tmp -depth -type d -empty -delete
          fi

      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1

      - name: Verify complete source corpus
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in crates/trnm-token-jwt-adapter/Cargo.toml crates/trnm-presence-router-v2/Cargo.toml crates/trnm-server/Cargo.toml; do
            [[ -f "$manifest" ]] || continue
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          while IFS= read -r module; do
            directory=${module%/go.mod}
            (
              cd "$directory"
              test -z "$(gofmt -l .)"
              go test ./...
              go test -race ./...
              go vet ./...
            )
          done < <(find . -name go.mod -not -path './.git/*' -print | sed 's#^./##' | sort)

      - name: Commit only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'temporary-*' -print -quit)"
          git diff --check
          git config user.name 'trillionnium-gap-closure-bot'
          git config user.email 'gap-closure-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Secret redaction is already present.'
            exit 0
          fi
          git commit -m 'fix(server): redact administrator token from application debug'
          git push origin "HEAD:${GITHUB_REF_NAME}"
