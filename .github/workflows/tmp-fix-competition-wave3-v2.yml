name: tmp-fix-competition-wave3-v2

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-fix-competition-wave3-v2.yml

permissions:
  contents: write
  pull-requests: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  FEATURE_BRANCH: feature/plan-v32-competition-core-20260909
  GH_TOKEN: ${{ github.token }}

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Wait for exact competition branch
        shell: bash
        run: |
          set -euo pipefail
          head_sha=''
          for _ in $(seq 1 240); do
            head_sha="$(gh api "repos/${REPOSITORY}/branches/${FEATURE_BRANCH}" --jq '.commit.sha' 2>/dev/null || true)"
            test -n "$head_sha" && break
            sleep 30
          done
          test -n "$head_sha"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$head_sha"
          git -C "$GITHUB_WORKSPACE" checkout -B "$FEATURE_BRANCH" "$head_sha"

      - name: Apply idempotent source repair
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('crates/trnm-competition-core/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          copy_pattern = r'#\[derive\(Clone, Copy, Debug, Eq, PartialEq\)\]\s*\npub enum JobState \{'
          old_pattern = r'#\[derive\(Clone, Debug, Eq, PartialEq\)\]\s*\npub enum JobState \{'
          if re.search(copy_pattern, text):
              raise SystemExit(0)
          updated, count = re.subn(
              old_pattern,
              '#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub enum JobState {',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('JobState derive contract not found exactly once')
          path.write_text(updated, encoding='utf-8')
          PY
          if git diff --quiet; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Qualify and publish repair
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo fmt --all
          cargo test --package trnm-competition-core --all-targets --locked
          cargo clippy --package trnm-competition-core --all-targets --locked -- -D warnings
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/trnm-competition-core/src/lib.rs
          git commit -m 'fix(competition): copy scheduler lease state before mutation'
          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          pr="$(gh pr list --repo "$REPOSITORY" --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          test -z "$pr" || gh pr comment "$pr" --repo "$REPOSITORY" --body \
            "Applied the idempotent `JobState: Copy` repair and passed focused tests/strict Clippy in carrier run `${GITHUB_RUN_ID}`. All repository-native checks must bind the new exact head."
