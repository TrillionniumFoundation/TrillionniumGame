name: trillionnium-game-pinned-upstream-source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/upstream/**'
      - 'scripts/fetch-pinned-upstream.py'
      - 'scripts/check-pinned-upstream-fetch.sh'
      - 'tests/upstream/**'
      - 'docs/development/PINNED_UPSTREAM_SOURCE_FETCH.md'
      - '.github/workflows/w0-pinned-source-fetch.yml'
  push:
    branches: [main]
    paths:
      - 'tools/upstream/**'
      - 'scripts/fetch-pinned-upstream.py'
      - 'scripts/check-pinned-upstream-fetch.sh'
      - 'tests/upstream/**'
      - 'docs/development/PINNED_UPSTREAM_SOURCE_FETCH.md'
      - '.github/workflows/w0-pinned-source-fetch.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-source-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Run archive security and tree identity tests
        run: bash scripts/check-pinned-upstream-fetch.sh

  exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Fetch and verify exact Nakama trees
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p run/evidence
          python3 scripts/fetch-pinned-upstream.py \
            --repository heroiclabs/nakama \
            --revision d4d92f93f78bbbe62c7fc50a3f85c772ec121a09 \
            --tree f3c9cfc2726d5543da1564629170f35b98e3797d \
            --output run/nakama > run/evidence/nakama.json
          python3 scripts/fetch-pinned-upstream.py \
            --repository heroiclabs/nakama-common \
            --revision 449b77ecc8789aa466c36b67f6e498033dfcd9c5 \
            --tree c6a7b9796b9c2a6b5118c74e5f213963a5001f14 \
            --output run/nakama-common > run/evidence/nakama-common.json
      - name: Re-verify published source locks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from tools.upstream.pinned_archive import verify_source_lock
          verify_source_lock(Path('run/nakama'), repository='heroiclabs/nakama', revision='d4d92f93f78bbbe62c7fc50a3f85c772ec121a09', tree='f3c9cfc2726d5543da1564629170f35b98e3797d')
          verify_source_lock(Path('run/nakama-common'), repository='heroiclabs/nakama-common', revision='449b77ecc8789aa466c36b67f6e498033dfcd9c5', tree='c6a7b9796b9c2a6b5118c74e5f213963a5001f14')
          PY
      - name: Package and seal evidence manifests
        run: |
          set -euo pipefail
          sha256sum run/evidence/*.json > run/evidence/SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C run -cf - evidence | gzip -n > run/pinned-source-evidence-${CANDIDATE_SHA}.tar.gz
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/pinned-source-evidence-${CANDIDATE_SHA}.tar.gz
          cat run/evidence/SHA256SUMS
