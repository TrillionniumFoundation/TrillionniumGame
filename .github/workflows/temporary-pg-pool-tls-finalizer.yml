name: temporary-pg-pool-tls-finalizer

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: trillionnium-plan-v3-single-writer
  cancel-in-progress: false

jobs:
  recover-verify-and-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Fetch quiet exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          sleep 90
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -f crates/trnm-persistence-pg/src/deadline.rs

      - name: Recover missing TLS pool source and test blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import subprocess
          from pathlib import Path

          root = Path('.')
          required = [
              root / 'crates/trnm-persistence-pg/src/reloadable_pool.rs',
              root / 'crates/trnm-persistence-pg/tests/pool_saturation.rs',
              root / 'crates/trnm-persistence-pg/tests/tls_reload.rs',
              root / '.github/workflows/pg-pool-tls-operations.yml',
          ]
          if all(path.is_file() for path in required):
              raise SystemExit(0)
          original = root / '.github/workflows/temporary-pg-pool-tls-closure.yml'
          if not original.is_file():
              missing = [str(path) for path in required if not path.is_file()]
              raise SystemExit(f'TLS pool frontier incomplete and recovery payload absent: {missing}')
          lines = original.read_text(encoding='utf-8').splitlines()

          def run_block(name: str) -> None:
              marker = f'      - name: {name}'
              try:
                  start = lines.index(marker)
              except ValueError as error:
                  raise SystemExit(f'missing recovery step: {name}') from error
              run = None
              for index in range(start + 1, len(lines)):
                  if lines[index].startswith('      - name: '):
                      break
                  if lines[index] == '        run: |':
                      run = index + 1
                      break
              if run is None:
                  raise SystemExit(f'missing run block: {name}')
              block = []
              for index in range(run, len(lines)):
                  line = lines[index]
                  if line.startswith('      - name: '):
                      break
                  if line and not line.startswith('          '):
                      raise SystemExit(f'noncanonical recovery indentation: {line!r}')
                  block.append(line[10:] if line else '')
              script = root / '.git' / ('recover-' + name.lower().replace(' ', '-') + '.sh')
              script.write_text('\n'.join(block) + '\n', encoding='utf-8')
              subprocess.run(['bash', str(script)], check=True)

          run_block('Add reloadable TLS pool generation')
          run_block('Add live pool saturation and TLS reload tests')
          run_block('Generate immutable permanent operational workflow')
          PY
          test -f crates/trnm-persistence-pg/src/reloadable_pool.rs
          test -f crates/trnm-persistence-pg/tests/pool_saturation.rs
          test -f crates/trnm-persistence-pg/tests/tls_reload.rs
          test -f .github/workflows/pg-pool-tls-operations.yml
          git diff --check

      - name: Compile, test and strictly lint source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo check --package trnm-persistence-pg --all-targets --locked
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --fix --allow-dirty --allow-staged \
            --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run PostgreSQL and CockroachDB pool saturation
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_IMAGE="$(grep -Eo '(docker.io/library/)?postgres(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' .github/workflows/pg-pool-tls-operations.yml | head -1)"
          COCKROACH_IMAGE="$(grep -Eo '(docker.io/)?cockroachdb/cockroach(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' .github/workflows/pg-pool-tls-operations.yml | head -1)"
          test -n "$POSTGRES_IMAGE"
          test -n "$COCKROACH_IMAGE"
          docker run -d --name trnm-pool-postgres -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55435:5432 "$POSTGRES_IMAGE"
          for attempt in $(seq 1 90); do
            if docker exec trnm-pool-postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90; sleep 1
          done
          TRNM_POOL_TEST_REQUIRED=1 TRNM_POOL_TEST_PROFILE=postgresql \
          TRNM_POOL_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55435/postgres \
            cargo test --package trnm-persistence-pg --test pool_saturation --locked -- --nocapture
          docker rm -f trnm-pool-postgres
          docker run -d --name trnm-pool-cockroach -p 127.0.0.1:56259:26257 \
            "$COCKROACH_IMAGE" start-single-node --insecure \
            --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 120); do
            if docker exec trnm-pool-cockroach cockroach sql --insecure \
              --host=127.0.0.1:26257 --database=defaultdb --execute='SELECT 1' >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 120; sleep 1
          done
          TRNM_POOL_TEST_REQUIRED=1 TRNM_POOL_TEST_PROFILE=cockroachdb \
          TRNM_POOL_TEST_DATABASE_URL='postgresql://root@127.0.0.1:56259/defaultdb?sslmode=disable' \
            cargo test --package trnm-persistence-pg --test pool_saturation --locked -- --nocapture
          docker rm -f trnm-pool-cockroach

      - name: Run verified PostgreSQL TLS reload and rollback test
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_IMAGE="$(grep -Eo '(docker.io/library/)?postgres(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' .github/workflows/pg-pool-tls-operations.yml | head -1)"
          rm -rf /tmp/trnm-pg-tls
          mkdir -p /tmp/trnm-pg-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj '/CN=Trillionnium Test CA' \
            -keyout /tmp/trnm-pg-tls/ca.key -out /tmp/trnm-pg-tls/ca.crt
          openssl req -newkey rsa:2048 -nodes -subj '/CN=localhost' \
            -keyout /tmp/trnm-pg-tls/server.key -out /tmp/trnm-pg-tls/server.csr
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' \
            > /tmp/trnm-pg-tls/server.ext
          openssl x509 -req -days 2 -sha256 \
            -in /tmp/trnm-pg-tls/server.csr \
            -CA /tmp/trnm-pg-tls/ca.crt -CAkey /tmp/trnm-pg-tls/ca.key -CAcreateserial \
            -extfile /tmp/trnm-pg-tls/server.ext \
            -out /tmp/trnm-pg-tls/server.crt
          cat > /tmp/trnm-pg-tls/Dockerfile <<DOCKER
          FROM $POSTGRES_IMAGE
          COPY server.crt /var/lib/postgresql/server.crt
          COPY server.key /var/lib/postgresql/server.key
          RUN chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key \
            && chmod 0600 /var/lib/postgresql/server.key
          DOCKER
          docker build -t trnm-postgres-tls /tmp/trnm-pg-tls
          docker run -d --name trnm-postgres-tls -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55436:5432 trnm-postgres-tls \
            -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt \
            -c ssl_key_file=/var/lib/postgresql/server.key
          for attempt in $(seq 1 90); do
            if docker exec trnm-postgres-tls pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90; sleep 1
          done
          cp /tmp/trnm-pg-tls/ca.crt /tmp/trnm-pg-tls/client-root.pem
          TRNM_TLS_RELOAD_TEST_REQUIRED=1 \
          TRNM_TLS_RELOAD_TEST_DATABASE_URL='postgresql://postgres@localhost:55436/postgres?sslmode=require' \
          TRNM_TLS_RELOAD_TEST_ROOT_PEM=/tmp/trnm-pg-tls/client-root.pem \
            cargo test --package trnm-persistence-pg --test tls_reload --locked -- --nocapture

      - name: Remove every temporary writer and push from unchanged tip
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) \
            -print -delete
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(pg): add atomic TLS pool reload and saturation proof"
          git push origin "HEAD:${GITHUB_REF_NAME}"
