name: trillionnium-game-sg1-sdk-denominator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/sdk-source-snapshots.json'
      - 'tools/sdk/**'
      - 'tools/upstream/**'
      - 'scripts/fetch-pinned-upstream.py'
      - 'scripts/repair-pinned-github-archive.py'
      - 'scripts/generate-sdk-denominator.py'
      - 'scripts/check-sdk-denominator.sh'
      - 'tests/sdk/**'
      - 'tests/upstream/**'
      - 'docs/COMPATIBILITY.md'
      - 'docs/TESTING_AND_EVIDENCE.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - '.github/workflows/sg1-sdk-denominator.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-sdk-denominator-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-sdk-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate current SDK denominator contract
        run: |
          set -euo pipefail
          grep -q 'Official SDK tests are black-box consumers' docs/COMPATIBILITY.md
          grep -q 'Generated internal tests cannot substitute for official consumer behavior' docs/COMPATIBILITY.md
      - name: Validate SDK registry, archive verifier and negative fixtures
        run: |
          set -euo pipefail
          bash scripts/check-sdk-denominator.sh
          python3 -m unittest discover -s tests/upstream -p 'test_*.py' -v
      - name: Fetch exact server contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fetch-pinned-upstream.py --repository heroiclabs/nakama --revision d4d92f93f78bbbe62c7fc50a3f85c772ec121a09 --tree f3c9cfc2726d5543da1564629170f35b98e3797d --output run/nakama
          python3 scripts/fetch-pinned-upstream.py --repository heroiclabs/nakama-common --revision 449b77ecc8789aa466c36b67f6e498033dfcd9c5 --tree c6a7b9796b9c2a6b5118c74e5f213963a5001f14 --output run/common
      - name: Diagnose cpp archive tree before strict fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/upstream/diagnose_pinned_tree.py \
            --registry config/sdk-source-snapshots.json \
            --profile cpp \
            --limit 200
      - name: Fetch exact SDK snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          registry_path = 'config/sdk-source-snapshots.json'
          for profile in json.load(open(registry_path, encoding='utf-8'))['profiles']:
              archive_tree = profile.get('archive_tree', profile['tree'])
              repairs = profile.get('archive_repairs', [])
              if bool(repairs) != ('archive_tree' in profile):
                  raise SystemExit(
                      f"{profile['id']}: archive_tree and archive_repairs must be declared together"
                  )
              output = f"run/sdks/{profile['id']}"
              command = [
                  'python3',
                  'scripts/fetch-pinned-upstream.py',
                  '--repository', profile['repository'],
                  '--revision', profile['commit'],
                  '--tree', archive_tree,
                  '--output', output,
              ]
              for gitlink in profile.get('gitlinks', []):
                  command.extend([
                      '--gitlink',
                      f"{gitlink['path']}={gitlink['commit']}",
                  ])
              subprocess.run(command, check=True)
              if repairs:
                  subprocess.run(
                      [
                          'python3',
                          'scripts/repair-pinned-github-archive.py',
                          '--registry', registry_path,
                          '--profile', profile['id'],
                          '--root', output,
                      ],
                      check=True,
                  )
          PY
      - name: Generate twice and compare
        run: |
          set -euo pipefail
          python3 scripts/generate-sdk-denominator.py --registry config/sdk-source-snapshots.json --sdk-root run/sdks --nakama-root run/nakama --common-root run/common --output run/a/sdk-denominator.candidate.json
          python3 scripts/generate-sdk-denominator.py --registry config/sdk-source-snapshots.json --sdk-root run/sdks --nakama-root run/nakama --common-root run/common --output run/b/sdk-denominator.candidate.json
          cmp run/a/sdk-denominator.candidate.json run/b/sdk-denominator.candidate.json
      - name: Prove SG1 remains closed
        run: |
          set -euo pipefail
          if python3 scripts/generate-sdk-denominator.py --registry config/sdk-source-snapshots.json --sdk-root run/sdks --nakama-root run/nakama --common-root run/common --output run/negative.json --require-sg1; then
            echo 'SDK candidate incorrectly received SG1 credit' >&2
            exit 1
          fi
      - name: Seal exact-head SDK candidate in immutable log
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/sdk-denominator-${CANDIDATE_SHA}.tar.gz -C run/a .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/sdk-denominator-${CANDIDATE_SHA}.tar.gz
          find run/a -type f -print0 | sort -z | xargs -0 sha256sum
