name: session-revocation-rustfmt-publish

on:
  push:
    branches:
      - tooling/session-revocation-rustfmt-2026-09-06
    paths:
      - '.github/workflows/session-revocation-rustfmt-publish.yml'

permissions:
  contents: write

concurrency:
  group: session-revocation-rustfmt-publish
  cancel-in-progress: false

jobs:
  format-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRODUCT_BRANCH: codex/session-revocation-fanout-2026-09-06
      EXPECTED_PRODUCT_HEAD: 0d0f246a131902403202afcd28103f22af30c8a9
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch unchanged product branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/product"
          git init "$GITHUB_WORKSPACE/product"
          git -C "$GITHUB_WORKSPACE/product" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/product" fetch --no-tags --depth=2 origin \
            "refs/heads/${PRODUCT_BRANCH}"
          git -C "$GITHUB_WORKSPACE/product" checkout -b "$PRODUCT_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/product" rev-parse HEAD)" = \
            "$EXPECTED_PRODUCT_HEAD"

      - name: Install exact Rust
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Apply exact formatter and validate the isolated crate
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml
          expected='crates/trnm-presence-router-v2/src/session_registry.rs'
          test "$(git diff --name-only)" = "$expected"
          git diff --check
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets --locked -- -D warnings

      - name: Publish one ordinary fast-forward commit
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add crates/trnm-presence-router-v2/src/session_registry.rs
          test "$(git diff --cached --name-only)" = \
            'crates/trnm-presence-router-v2/src/session_registry.rs'
          git diff --cached --check
          git commit -m 'style(realtime): apply exact Rust 1.85.1 formatting'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          printf 'published_head=%s\npublished_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
