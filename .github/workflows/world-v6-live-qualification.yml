name: world-v6-live-qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: world-v6-live-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_BRANCH: fix/world-convergence-v6-20260908
  WORLD_PR_NUMBER: '104'
  RUST_TOOLCHAIN: '1.98.1'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '1'

jobs:
  qualify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ops/world-v6-external-qualification-20260909'
    name: World live qualification (${{ matrix.scope }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        scope: [truth, source, postgres, package]
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      TRNM_SETTLEMENT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    steps:
      - name: Resolve and freeze live World PR tuple
        id: tuple
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${WORLD_REPOSITORY}.git"
          base_sha="$(git ls-remote "$remote" refs/heads/main | awk '{print $1}')"
          head_sha="$(git ls-remote "$remote" "refs/heads/${WORLD_BRANCH}" | awk '{print $1}')"
          merge_sha="$(git ls-remote "$remote" "refs/pull/${WORLD_PR_NUMBER}/merge" | awk '{print $1}')"
          test -n "$base_sha"
          test -n "$head_sha"
          test -n "$merge_sha"
          printf 'base_sha=%s\nhead_sha=%s\nmerge_sha=%s\n' "$base_sha" "$head_sha" "$merge_sha" | tee "$RUNNER_TEMP/world-tuple.txt"
          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'head_sha=%s\n' "$head_sha"
            printf 'merge_sha=%s\n' "$merge_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch and verify exact World head and true prospective merge
        env:
          WORLD_BASE_SHA: ${{ steps.tuple.outputs.base_sha }}
          WORLD_HEAD_SHA: ${{ steps.tuple.outputs.head_sha }}
          WORLD_MERGE_SHA: ${{ steps.tuple.outputs.merge_sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://github.com/${WORLD_REPOSITORY}.git"
          rm -rf world-head world-merge
          git init world-head
          git -C world-head remote add origin "$remote"
          git -C world-head fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C world-head checkout --detach FETCH_HEAD
          git init world-merge
          git -C world-merge remote add origin "$remote"
          git -C world-merge fetch --no-tags --depth=2 origin "refs/pull/${WORLD_PR_NUMBER}/merge"
          git -C world-merge checkout --detach FETCH_HEAD
          test "$(git -C world-head rev-parse HEAD)" = "$WORLD_HEAD_SHA"
          test "$(git -C world-merge rev-parse HEAD)" = "$WORLD_MERGE_SHA"
          test "$(git -C world-merge rev-parse HEAD^1)" = "$WORLD_BASE_SHA"
          test "$(git -C world-merge rev-parse HEAD^2)" = "$WORLD_HEAD_SHA"
          printf 'head_tree=%s\nmerge_tree=%s\n' \
            "$(git -C world-head rev-parse 'HEAD^{tree}')" \
            "$(git -C world-merge rev-parse 'HEAD^{tree}')" \
            | tee -a "$RUNNER_TEMP/world-tuple.txt"

      - name: Install pinned Rust and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config postgresql-client
          rustc --version --verbose
          cargo --version --verbose
          psql --version

      - name: Qualify exact World head
        id: head
        env:
          QUALIFICATION_SCOPE: ${{ matrix.scope }}
        shell: bash
        run: |
          set +e
          (cd world-head && bash scripts/run-trnm-world-v6-qualification-v2.sh "$QUALIFICATION_SCOPE") \
            > "$RUNNER_TEMP/world-head-${QUALIFICATION_SCOPE}.log" 2>&1
          rc=$?
          printf 'rc=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          tail -n 160 "$RUNNER_TEMP/world-head-${QUALIFICATION_SCOPE}.log" || true
          exit 0

      - name: Qualify true World prospective merge
        id: merge
        env:
          QUALIFICATION_SCOPE: ${{ matrix.scope }}
        shell: bash
        run: |
          set +e
          (cd world-merge && bash scripts/run-trnm-world-v6-qualification-v2.sh "$QUALIFICATION_SCOPE") \
            > "$RUNNER_TEMP/world-merge-${QUALIFICATION_SCOPE}.log" 2>&1
          rc=$?
          printf 'rc=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          tail -n 160 "$RUNNER_TEMP/world-merge-${QUALIFICATION_SCOPE}.log" || true
          exit 0

      - name: Publish bounded result to temporary runner PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCOPE: ${{ matrix.scope }}
          WORLD_BASE_SHA: ${{ steps.tuple.outputs.base_sha }}
          WORLD_HEAD_SHA: ${{ steps.tuple.outputs.head_sha }}
          WORLD_MERGE_SHA: ${{ steps.tuple.outputs.merge_sha }}
          HEAD_RC: ${{ steps.head.outputs.rc }}
          MERGE_RC: ${{ steps.merge.outputs.rc }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request
          scope = os.environ['SCOPE']
          runner = pathlib.Path(os.environ['RUNNER_TEMP'])
          def bounded(path):
              text = path.read_text(encoding='utf-8', errors='replace') if path.exists() else '<log missing>'
              text = re.sub(r'\x1b\[[0-9;?]*[ -/]*[@-~]', '', text)
              text = '\n'.join(text.splitlines()[-120:])
              return text[-10000:]
          head_log = bounded(runner / f'world-head-{scope}.log')
          merge_log = bounded(runner / f'world-merge-{scope}.log')
          repo = os.environ['GITHUB_REPOSITORY']
          pr = os.environ['PR_NUMBER']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}/pulls/{pr}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'world-v6-live-qualification',
          }
          with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=30) as response:
              current = json.load(response)
          body = current.get('body') or ''
          start = f'<!-- world-v6-live-{scope}:start -->'
          end = f'<!-- world-v6-live-{scope}:end -->'
          if start in body and end in body:
              body = body[:body.index(start)].rstrip() + '\n\n' + body[body.index(end)+len(end):].lstrip()
          block = f'''{start}
          ## World V6 live qualification: `{scope}`

          - base: `{os.environ['WORLD_BASE_SHA']}`
          - head: `{os.environ['WORLD_HEAD_SHA']}`
          - prospective merge: `{os.environ['WORLD_MERGE_SHA']}`
          - head exit: `{os.environ.get('HEAD_RC', '<missing>')}`
          - merge exit: `{os.environ.get('MERGE_RC', '<missing>')}`
          - production authorization: `not_granted`

          <details><summary>Exact-head tail</summary>

          ```text
          {head_log}
          ```
          </details>

          <details><summary>Prospective-merge tail</summary>

          ```text
          {merge_log}
          ```
          </details>
          {end}'''
          body = body.rstrip() + '\n\n' + block + '\n'
          data = json.dumps({'body': body}).encode('utf-8')
          request = urllib.request.Request(api, data=data, headers=headers, method='PATCH')
          with urllib.request.urlopen(request, timeout=30) as response:
              json.load(response)
          PY

      - name: Enforce both exact objects
        env:
          HEAD_RC: ${{ steps.head.outputs.rc }}
          MERGE_RC: ${{ steps.merge.outputs.rc }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAD_RC" = 0
          test "$MERGE_RC" = 0

  aggregate:
    name: world-v6-live-qualification
    if: always()
    needs: [qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every scope
        env:
          RESULT: ${{ needs.qualify.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RESULT" = success
