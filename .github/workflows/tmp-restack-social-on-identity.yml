name: tmp-restack-social-on-identity

on:
  push:
    branches:
      - ops/identity-auth-replay-fix-20260910
    paths:
      - .github/workflows/tmp-restack-social-on-identity.yml

permissions:
  contents: write

concurrency:
  group: restack-social-on-identity-20260910
  cancel-in-progress: false

jobs:
  merge-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_BRANCH: feature/plan-v32-social-core-20260910
      EXPECTED_SOCIAL_HEAD: 1f72a9d974d71e80230af69f4644fbed080d6940
      IDENTITY_HEAD: 2e490e342dc206eabc7ab53ea8fb6b2b8188b8fd
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact stack heads without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$EXPECTED_SOCIAL_HEAD" "$IDENTITY_HEAD"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$EXPECTED_SOCIAL_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SOCIAL_HEAD"

      - name: Merge the exact current identity parent
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-edit "$IDENTITY_HEAD" \
            -m 'merge(surface2): absorb exact identity receipt scope'
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_SOCIAL_HEAD"
          test "$(git rev-parse HEAD^2)" = "$IDENTITY_HEAD"
          git diff --check HEAD^1..HEAD

      - name: Execute identity social and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --all -- --check
          cargo test --package trnm-identity-core --all-targets --locked
          cargo test --package trnm-social-core --all-targets --locked
          cargo clippy --package trnm-identity-core --all-targets --locked -- -D warnings
          cargo clippy --package trnm-social-core --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-plan.py
          python3 -m unittest discover -s tests/control_plane -p 'test_*.py' -v

      - name: Fast-forward the exact social branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$EXPECTED_SOCIAL_HEAD"
          new_head="$(git rev-parse HEAD)"
          new_tree="$(git rev-parse HEAD^{tree})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'published_head=%s\npublished_tree=%s\n' "$new_head" "$new_tree" >> "$GITHUB_STEP_SUMMARY"
