name: tmp-materialize-product-wave1-v2

on:
  push:
    branches:
      - ops/product-wave1-carrier-20260909
    paths:
      - .github/workflows/tmp-materialize-product-wave1-v2.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  REPOSITORY: TrillionniumFoundation/TrillionniumGame
  BASE_BRANCH: integration/plan-v32-main-rebind-2026-09-09
  BASE_SHA: d306a9385e154babc0173bfb214b5726a0f2942c
  FEATURE_BRANCH: feature/plan-v32-product-wave1-20260909-v3
  GH_TOKEN: ${{ github.token }}

jobs:
  publish-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact Plan v3.2 base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$BASE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$BASE_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$BASE_SHA"

      - name: Reuse bounded materializer from controller v1
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/contents/.github/workflows/tmp-materialize-product-wave1.yml?ref=ops/product-wave1-carrier-20260909" \
            --jq '.content' | base64 --decode > /tmp/controller-v1.yml
          test -s /tmp/controller-v1.yml
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from __future__ import annotations

          import subprocess
          import textwrap
          from pathlib import Path

          source = Path('/tmp/controller-v1.yml').read_text(encoding='utf-8').splitlines()
          selected = [
              'Fetch exact source and repair carriers',
              'Materialize product source from reviewed carriers',
              'Reconcile fail-closed package and status authority',
          ]

          def run_script(name: str) -> None:
              start = None
              step_indent = None
              for index, line in enumerate(source):
                  stripped = line.strip()
                  if stripped == f'- name: {name}':
                      start = index
                      step_indent = len(line) - len(line.lstrip())
                      break
              if start is None or step_indent is None:
                  raise SystemExit(f'missing controller step: {name}')
              run_index = None
              for index in range(start + 1, len(source)):
                  line = source[index]
                  indent = len(line) - len(line.lstrip())
                  if indent == step_indent and line.strip().startswith('- name:'):
                      break
                  if line.strip() == 'run: |':
                      run_index = index
                      break
              if run_index is None:
                  raise SystemExit(f'missing run block: {name}')
              body = []
              base_indent = None
              for index in range(run_index + 1, len(source)):
                  line = source[index]
                  indent = len(line) - len(line.lstrip())
                  if line.strip() and base_indent is None:
                      base_indent = indent
                  if line.strip() and base_indent is not None and indent < base_indent:
                      break
                  body.append(line)
              script = textwrap.dedent('\n'.join(body)) + '\n'
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)

          for step in selected:
              print(f'Executing controller step: {step}', flush=True)
              run_script(step)
          PY

      - name: Normalize lockfile and formatting
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          cargo generate-lockfile
          cargo fmt --all
          git diff --check

      - name: Publish Draft source candidate
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -d crates/trnm-identity-core
          test -d crates/trnm-social-core
          test ! -e .github/workflows/tmp-materialize-product-wave1-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$FEATURE_BRANCH"
          git add Cargo.toml Cargo.lock crates docs tests scripts .github/CODEOWNERS
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(product): add bounded identity and social Wave 1 cores'
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse HEAD^{tree})"
          printf 'head_sha=%s\nhead_tree=%s\n' "$head_sha" "$head_tree" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          body_file="$RUNNER_TEMP/product-wave1-pr.md"
          cat > "$body_file" <<EOF
          ## Scope

          Inspectable repository-controlled Wave 1 implementation for #137 and #138, stacked on exact Plan v3.2 source candidate PR #150.

          \`\`\`text
          base branch   ${BASE_BRANCH}
          base commit   ${BASE_SHA}
          head branch   ${FEATURE_BRANCH}
          head commit   ${head_sha}
          head tree     ${head_tree}
          \`\`\`

          The candidate adds transport-independent account/provider identity and social state/service boundaries, command receipts, revision fencing, capacity limits, hostile tests and machine registration. Full CI executes after publication and any failure remains visible on this Draft PR.

          It does not claim complete #137/#138 coverage, provider authenticity, public wire compatibility, durable database integration, official SDK/oracle differential, accepted evidence, production readiness, cutover or retirement.

          \`\`\`text
          source_candidate=true
          exact_head_qualification_pending=true
          complete_identity_surface=false
          complete_social_surface=false
          accepted_evidence=false
          production_ready=false
          all_gaps_closed=false
          \`\`\`
          EOF
          if gh pr view "$FEATURE_BRANCH" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh pr edit "$FEATURE_BRANCH" --repo "$REPOSITORY" \
              --title '[Plan v3.2][Wave 1] Add bounded identity and social product cores' \
              --body-file "$body_file" --add-reviewer Tomasrgbsf --add-reviewer Franksudoman
          else
            gh pr create --repo "$REPOSITORY" --draft \
              --base "$BASE_BRANCH" --head "$FEATURE_BRANCH" \
              --title '[Plan v3.2][Wave 1] Add bounded identity and social product cores' \
              --body-file "$body_file" \
              --reviewer Tomasrgbsf --reviewer Franksudoman
          fi

      - name: Qualify published exact source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = '${{ steps.publish.outputs.head_sha }}'
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          for manifest in \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
          do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-workspace-convergence.py
          python3 scripts/check-plan.py
          python3 -m compileall -q scripts tools tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code

      - name: Publish controller outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$REPOSITORY" --head "$FEATURE_BRANCH" --json number --jq '.[0].number // empty')"
          if test -n "$pr_number"; then
            gh pr comment "$pr_number" --repo "$REPOSITORY" --body \
              "Carrier qualification outcome: \`${{ job.status }}\` for workflow run \`${GITHUB_RUN_ID}\`. Product branch: \`${FEATURE_BRANCH}\`. A successful carrier is source/CI evidence only; independent review and all external/product gates remain separate."
          fi
