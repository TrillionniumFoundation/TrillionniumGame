name: evidence-admission-materialize

on:
  push:
    branches: [tooling/evidence-admission-materialization-2026-09-05]

permissions:
  contents: write

jobs:
  test-and-store-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact tooling and fixed source without external actions
        shell: bash
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/trnm-tooling"
          source="$RUNNER_TEMP/trnm-source"
          git init "$tooling"
          git -C "$tooling" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$tooling" rev-parse HEAD)" = "$GITHUB_SHA"
          cd "$tooling"
          cat payload.part0 payload.part1 payload.part2 payload.part3 > payload.json.gz
          printf '%s\n' '78b049dd3932cfecb0f9f9ae4a4334500d6fa7126d4a4bdba8cb14ff3759b25c  materialize.py.gz' 'ed5d6648c2a0a13562b75a9fad336e62b9cb24b8c32158d1ff1b1b7d5b40dce5  payload.json.gz' | sha256sum -c -
          gzip -dc materialize.py.gz > "$RUNNER_TEMP/materialize.py"
          git init "$source"
          git -C "$source" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$source" fetch --no-tags --depth=1 origin 421b33ca10e92ba393d93d8b27b70cc5f84f6f4e
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = 421b33ca10e92ba393d93d8b27b70cc5f84f6f4e
          test "$(git -C "$source" rev-parse HEAD^{tree})" = 3ca91b2f8809540206eeaf0a1aa4781b1bcf49d0
      - name: Reproduce rejection gap, test full source, and store blobs only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/trnm-source"
          python3 "$RUNNER_TEMP/materialize.py" "$RUNNER_TEMP/trnm-tooling/payload.json.gz"
