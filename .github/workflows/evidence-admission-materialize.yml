name: evidence-admission-materialize

on:
  push:
    branches: [tooling/evidence-admission-materialization-2026-09-05]

permissions:
  contents: write

jobs:
  test-and-store-objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Bind fixed tooling and product source
        shell: bash
        run: |
          set -euo pipefail
          tooling="$RUNNER_TEMP/trnm-tooling"
          source="$RUNNER_TEMP/trnm-source"
          git init "$tooling"
          git -C "$tooling" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$tooling" rev-parse HEAD)" = "$GITHUB_SHA"
          cd "$tooling"
          printf '%s\n' 'e4e50f686736d4a303bc91e79578087fbd471474007727e7c5f66eaeeb6c97bb  materialize.py.gz' 'f3ac068bd145e0ab009aec263a6a2aa4caa34f204b134fc353ce554b0f2ea29b  payload.json.gz' | sha256sum -c -
          gzip -dc materialize.py.gz > "$RUNNER_TEMP/materialize.py"
          git init "$source"
          git -C "$source" remote add origin https://github.com/TrillionniumFoundation/TrillionniumGame.git
          git -C "$source" fetch --no-tags --depth=1 origin b2fc8ea5ffeda4a5be2c783986b71b2892d162b6
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = b2fc8ea5ffeda4a5be2c783986b71b2892d162b6
          test "$(git -C "$source" rev-parse HEAD^{tree})" = 11b31a99f538049b06a1079848841a0f34c2693c
          cd "$source"
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Compile, execute database faults, and store verified blobs only
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/trnm-source"
          python3 "$RUNNER_TEMP/materialize.py" "$RUNNER_TEMP/trnm-tooling/payload.json.gz"
