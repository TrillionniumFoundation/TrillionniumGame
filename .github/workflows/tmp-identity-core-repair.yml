name: tmp-identity-core-repair

on:
  push:
    branches:
      - ops/identity-core-repair-20260909
    paths:
      - .github/workflows/tmp-identity-core-repair.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: identity-core-repair
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
      FEATURE_BRANCH: feature/plan-v32-identity-core-20260909
      SOURCE_BRANCH: ops/identity-core-source-20260909
    steps:
      - name: Resolve product base and optional feature head
        shell: bash
        run: |
          set -euo pipefail
          parent="$(gh pr view 150 --repo "$REPOSITORY" --json state,mergedAt,headRefName,headRefOid)"
          if test "$(jq -r '.mergedAt // empty' <<<"$parent")" != ''; then
            product_base=main
            product_base_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          elif test "$(jq -r '.state' <<<"$parent")" = OPEN; then
            product_base="$(jq -r '.headRefName' <<<"$parent")"
            product_base_sha="$(jq -r '.headRefOid' <<<"$parent")"
          else
            echo 'Plan v3.2 parent is neither open nor merged' >&2
            exit 1
          fi
          feature_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/${FEATURE_BRANCH}" --jq '.object.sha' 2>/dev/null || true)"
          checkout_sha="$product_base_sha"
          if test -n "$feature_sha"; then
            checkout_sha="$feature_sha"
          fi
          echo "PRODUCT_BASE=$product_base" >> "$GITHUB_ENV"
          echo "PRODUCT_BASE_SHA=$product_base_sha" >> "$GITHUB_ENV"
          echo "FEATURE_SHA=$feature_sha" >> "$GITHUB_ENV"
          echo "CHECKOUT_SHA=$checkout_sha" >> "$GITHUB_ENV"
      - name: Fetch exact checkout and original generator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$CHECKOUT_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CHECKOUT_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$SOURCE_BRANCH:refs/remotes/origin/identity-source"
          git -C "$GITHUB_WORKSPACE" show refs/remotes/origin/identity-source:.github/workflows/tmp-identity-core-source.yml > /tmp/identity-source.yml
      - name: Materialize missing source and apply registry updates
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from __future__ import annotations
          import subprocess
          from pathlib import Path

          root = Path('.')
          lines = Path('/tmp/identity-source.yml').read_text(encoding='utf-8').splitlines()

          def extract(marker: str, terminator: str, start_at: int = 0) -> str:
              start = next(i for i in range(start_at, len(lines)) if marker in lines[i]) + 1
              end = next(i for i in range(start, len(lines)) if lines[i].strip() == terminator)
              content = lines[start:end]
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in content) + '\n'

          files = {
              'crates/trnm-identity-core/Cargo.toml': ("cat > crates/trnm-identity-core/Cargo.toml <<'TOML'", 'TOML'),
              'crates/trnm-identity-core/src/lib.rs': ("cat > crates/trnm-identity-core/src/lib.rs <<'RS'", 'RS'),
              'crates/trnm-identity-core/README.md': ("cat > crates/trnm-identity-core/README.md <<'MD'", 'MD'),
          }
          for relative, (marker, terminator) in files.items():
              target = root / relative
              if not target.exists():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(extract(marker, terminator), encoding='utf-8')

          fixture = root / 'crates/trnm-identity-core/testdata/provider-classes-v1.json'
          if not fixture.exists():
              fixture.parent.mkdir(parents=True, exist_ok=True)
              fixture.write_text('''{
  "schema": "trnm.identity-provider-classes.v1",
  "project_id": "trillionnium-game",
  "issue": 137,
  "providers": [
    "custom",
    "device",
    "email",
    "facebook",
    "facebook_instant_game",
    "apple",
    "google",
    "game_center",
    "steam"
  ],
  "bounds": {
    "provider_identity_bytes": 512,
    "identities_per_account_hard_max": 16
  },
  "claim_boundary": {
    "source_fixture": true,
    "provider_verification": false,
    "compatibility_credit": false,
    "production_ready": false
  }
}
''', encoding='utf-8')

          step = next(i for i, line in enumerate(lines) if '- name: Register package and source inventory' in line)
          registration = extract("python3 - <<'PY'", 'PY', step)
          Path('/tmp/register-identity.py').write_text(registration, encoding='utf-8')
          subprocess.run(['python3', '/tmp/register-identity.py'], check=True)
          PY
      - name: Format and validate identity source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          cargo fmt --all
          cargo test --package trnm-identity-core --all-targets
          cargo test --package trnm-identity-core --all-targets --locked
          cargo clippy --package trnm-identity-core --all-targets --locked -- -D warnings
          python3 -m json.tool crates/trnm-identity-core/testdata/provider-classes-v1.json >/dev/null
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          expected = [
              'custom', 'device', 'email', 'facebook', 'facebook_instant_game',
              'apple', 'google', 'game_center', 'steam'
          ]
          source = Path('crates/trnm-identity-core/src/lib.rs').read_text(encoding='utf-8')
          fixture = json.loads(Path('crates/trnm-identity-core/testdata/provider-classes-v1.json').read_text(encoding='utf-8'))
          body = re.search(r'pub enum IdentityProvider \{(?P<body>.*?)\n\}', source, re.S)
          if body is None:
              raise SystemExit('IdentityProvider enum missing')
          variants = re.findall(r'^\s{4}([A-Z][A-Za-z0-9]+),$', body.group('body'), re.M)
          normalized = [re.sub(r'(?<!^)(?=[A-Z])', '_', value).lower() for value in variants]
          if normalized != expected or fixture.get('providers') != expected:
              raise SystemExit(f'provider contract mismatch: source={normalized!r} fixture={fixture.get("providers")!r}')
          if fixture.get('claim_boundary', {}).get('provider_verification') is not False:
              raise SystemExit('fixture overclaims provider verification')
          PY
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-plan.py
          git diff --check
      - name: Commit qualified source and create or update child PR
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock \
            crates/trnm-identity-core \
            docs/status/MODULE_DOCUMENTATION.json \
            docs/development/RUST_PACKAGE_AUTHORITY.json \
            docs/status/IMPLEMENTATION_INVENTORY.json \
            docs/status/CURRENT_STATE.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'identity source already matches the qualified form'
          else
            git commit -m 'identity: add qualified bounded account and provider core'
          fi
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse HEAD^{tree})"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          if test -n "$FEATURE_SHA"; then
            git push --force-with-lease="refs/heads/${FEATURE_BRANCH}:${FEATURE_SHA}" origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          else
            git push --force-with-lease="refs/heads/${FEATURE_BRANCH}:" origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          fi
          existing="$(gh pr list --repo "$REPOSITORY" --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          cat > /tmp/body.md <<EOF
          Parent issue: #137

          Adds a qualified bounded account/provider-identity domain source candidate covering nine provider classes, unique live username/provider indexes, exact command receipt replay, changed-fingerprint rejection, revision fencing, checked overflow, link/unlink, account status and terminal identity retirement.

          ```text
          base_branch=${PRODUCT_BASE}
          base_commit=${PRODUCT_BASE_SHA}
          head_commit=${head_sha}
          head_tree=${head_tree}
          ```

          This remains partial. Provider token verification, public HTTP/gRPC, durable PostgreSQL repository/migration, session issuance and socket revocation, account export/metadata, official consumer/oracle differential, promotable evidence and independent acceptance remain open.

          ```text
          domain_source_candidate=true
          issue_137_source_complete=false
          compatibility_credit=false
          accepted_evidence=false
          production_ready=false
          all_gaps_closed=false
          ```
          EOF
          if test -z "$existing"; then
            url="$(gh pr create --repo "$REPOSITORY" --draft --base "$PRODUCT_BASE" --head "$FEATURE_BRANCH" \
              --title '[Plan v3.2][#137] Add qualified bounded account and provider identity core' \
              --body-file /tmp/body.md)"
            number="${url##*/}"
          else
            number="$existing"
            gh pr edit "$number" --repo "$REPOSITORY" --base "$PRODUCT_BASE" --body-file /tmp/body.md
          fi
          gh issue comment 137 --repo "$REPOSITORY" --body \
            "Identity core was rebuilt with rustfmt, unlocked/locked tests, strict Clippy and repository validators before updating PR #${number} at exact head \`${head_sha}\`. The issue remains open for provider/API/data/session/differential/review work."
