name: tmp-world-arm-object-probe

on:
  push:
    branches:
      - ops/game-world-arm-object-probe-20260906
    paths:
      - .github/workflows/tmp-world-arm-object-probe.yml

permissions:
  contents: read

concurrency:
  group: tmp-world-arm-object-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    env:
      WORLD_TOKEN: ${{ secrets.WORLD_REPOSITORY_TOKEN }}
    steps:
      - name: Create one fixed unreferenced blob in World
        shell: bash
        run: |
          set -euo pipefail
          test -n "${WORLD_TOKEN:-}" || { echo 'WORLD_OBJECT_WRITE_PROBE=NO_CONFIGURED_TOKEN'; exit 1; }
          payload='trnm-world-arm-object-write-probe-v1'
          expected="$(printf '%s\n' "$payload" | git hash-object --stdin)"
          encoded="$(printf '%s\n' "$payload" | base64 -w0)"
          response="${RUNNER_TEMP}/response.json"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${WORLD_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/TrillionniumFoundation/Trillionnium-World/git/blobs \
            --data "{\"content\":\"${encoded}\",\"encoding\":\"base64\"}")"
          test "$code" = 201
          test "$(jq -r '.sha // empty' "$response")" = "$expected"
          printf 'WORLD_OBJECT_WRITE_PROBE=PASS blob=%s\n' "$expected"
