name: temporary-resolve-database-image-pins

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-resolve-database-image-pins
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Resolve and verify immutable image identities
        run: |
          set -euo pipefail
          postgres_tag='postgres:17.6-alpine3.22'
          cockroach_tag='cockroachdb/cockroach:v26.2.6'

          docker pull "$postgres_tag"
          docker pull "$cockroach_tag"

          postgres_ref=$(docker image inspect "$postgres_tag" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk '/^postgres@sha256:[0-9a-f]{64}$/ {print; exit}')
          cockroach_ref=$(docker image inspect "$cockroach_tag" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk '/^cockroachdb\/cockroach@sha256:[0-9a-f]{64}$/ {print; exit}')

          [[ "$postgres_ref" =~ ^postgres@sha256:[0-9a-f]{64}$ ]] || {
            echo 'failed to resolve immutable PostgreSQL reference' >&2
            docker image inspect "$postgres_tag" >&2
            exit 1
          }
          [[ "$cockroach_ref" =~ ^cockroachdb/cockroach@sha256:[0-9a-f]{64}$ ]] || {
            echo 'failed to resolve immutable CockroachDB reference' >&2
            docker image inspect "$cockroach_tag" >&2
            exit 1
          }

          docker pull "$postgres_ref"
          docker pull "$cockroach_ref"
          postgres_version=$(docker run --rm "$postgres_ref" postgres --version)
          cockroach_version=$(docker run --rm "$cockroach_ref" version)
          grep -Fq 'PostgreSQL) 17.6' <<<"$postgres_version"
          grep -Fq 'Build Tag:        v26.2.6' <<<"$cockroach_version"

          export POSTGRES_TAG="$postgres_tag"
          export POSTGRES_REF="$postgres_ref"
          export POSTGRES_VERSION="$postgres_version"
          export COCKROACH_TAG="$cockroach_tag"
          export COCKROACH_REF="$cockroach_ref"
          export COCKROACH_VERSION="$cockroach_version"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def require_ref(value: str, repository: str) -> str:
              prefix = repository + "@sha256:"
              if not value.startswith(prefix) or len(value) != len(prefix) + 64:
                  raise SystemExit(f"invalid immutable image reference: {value!r}")
              digest = value.removeprefix(prefix)
              if any(character not in "0123456789abcdef" for character in digest):
                  raise SystemExit(f"invalid immutable image digest: {value!r}")
              return value

          value = {
              "schema": "trillionnium.database-test-images.v1",
              "project_id": "trillionnium-game",
              "captured_at": "2026-08-30",
              "profiles": {
                  "postgresql": {
                      "source_tag": os.environ["POSTGRES_TAG"],
                      "image": require_ref(os.environ["POSTGRES_REF"], "postgres"),
                      "version_output": os.environ["POSTGRES_VERSION"],
                      "test_topology": "single-node-isolated-ci",
                  },
                  "cockroachdb": {
                      "source_tag": os.environ["COCKROACH_TAG"],
                      "image": require_ref(
                          os.environ["COCKROACH_REF"], "cockroachdb/cockroach"
                      ),
                      "version_output": os.environ["COCKROACH_VERSION"],
                      "test_topology": "single-node-insecure-isolated-ci",
                  },
              },
              "claims": {
                  "tag_mutability_accepted": False,
                  "image_identity_pinned": True,
                  "production_topology_evidence": False,
                  "compatibility_credit": False,
                  "production_ready": False,
              },
          }
          path = Path("config/database-test-images.json")
          path.write_text(
              json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          python3 -m json.tool config/database-test-images.json >/dev/null
          cat config/database-test-images.json

      - name: Commit pins and self-delete
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-resolve-database-image-pins.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "build(database): pin exact live-test image identities"
          git push origin "HEAD:${GITHUB_REF_NAME}"
