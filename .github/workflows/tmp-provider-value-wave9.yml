          # trnm-provider-value-core

          Status: **module documentation; source-candidate; no automatic compatibility or production credit**  
          Path: `crates/trnm-provider-value-core`  
          Workspace class: `root`  
          Lifecycle: `product-library`  
          Owner role: `payments`

          ## Status and authority

          This document is the module contract for verified provider events, wallet value, purchases, subscriptions, ledger entries, outbox intents and exact receipts. It is a source candidate and does not establish provider authenticity, payment compliance, IAP compatibility or production custody.

          ## Responsibilities

          The crate owns bounded provider/event/transaction identities, replay and conflict detection, purchase/subscription transition rules, wallet arithmetic policy, exact reversal amounts, ledger/outbox coupling and command receipts.

          It does not parse or cryptographically verify provider payloads, call provider networks, execute external entitlement delivery, persist SQL, hold money, settle fiat or provide tax/accounting records.

          ## Architecture and dependencies

          A provider-specific verifier converts an untrusted callback or receipt into `VerifiedProviderEvent` only after signature, audience/application, environment, time and replay checks. A durable repository applies this pure transition in one transaction and writes event index, purchase/subscription, wallet, ledger, outbox and command receipt together.

          Outbox workers deliver notifications/entitlements after commit and reconcile ambiguous provider outcomes; no external I/O occurs inside the value transaction.

          ## Public contracts

          Provider event ID is unique within a provider. Exact repeated events return the original result without another ledger or outbox effect; changed content under the same event ID fails. Commands have an independent exact identity/fingerprint receipt.

          Purchase and subscription value events require positive minor-unit amounts. Reversal events derive the debit from the original credited amount rather than caller input. Provider sequence is monotonic per original transaction.

          ## Correctness and failure model

          The registry clones before applying a new event. Any invalid transition, owner/product mismatch, sequence regression, balance overflow/policy failure, duplicate ledger/outbox identity or capacity exhaustion preserves purchases, subscriptions, balances, ledger, outbox, event index and receipts.

          Subscription renewal must advance expiry. Refund/void/chargeback are terminal for the active purchase and cancel a linked subscription.

          ## Security and privacy

          Only verified typed events may enter this core. Raw receipts, store credentials, signatures, user data and transaction payloads are never logged or used as metric labels. Evidence digests are identifiers, not proof of provider authenticity by themselves.

          Value-affecting callbacks require replay protection, exact application/environment binding, provider deadlines and independent payment/security review.

          ## Build and test

          ```bash
          cargo fmt --all -- --check
          cargo test --package trnm-provider-value-core --all-targets --locked
          cargo clippy --package trnm-provider-value-core --all-targets --locked -- -D warnings
          ```

          Tests cover one-effect provider replay, event identity conflict, atomic exact refund, negative-balance rollback, monotonic renewal, cancellation without ledger and changed command fingerprint rejection.

          ## Operations

          Adapters expose verification result, event replay/conflict, transaction state, value delta class, ledger/outbox backlog, reversal/reconciliation and provider latency with bounded labels. Provider IDs, user IDs and raw receipts are excluded.

          ## Compatibility and evidence

          Complete #146 requires each Nakama provider and IAP/subscription endpoint, signed fixtures and sandboxes, wallet semantics, receipt validation, refund/void/renewal/reconciliation, notifications, official SDK/oracle differential and compliance review.

          This core does not prove real provider behavior, exactly-once external delivery, custody, accounting, tax, fraud resistance or production readiness.

          ## Known gaps and exit criteria

          Blocking gaps include `GAP-P0-SERVER-001`, `GAP-P0-DATA-001`, `GAP-P0-CRYPTO-001`, `GAP-P0-SCOPE-001`, `GAP-P0-CI-001`, `GAP-P1-OUTBOX-001`, and `GAP-P1-REVIEW-001`.

          Exit requires real provider verifier adapters, sandbox/fixture matrices, durable transactional repositories, outbox reconciliation, full public API, official consumer differential, security/compliance evidence and conflict-free payment/database review.
          EOF

