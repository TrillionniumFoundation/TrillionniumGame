name: temporary-jwt-rustcrypto-closure

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: trillionnium-plan-v3-single-writer
  cancel-in-progress: false

jobs:
  implement-test-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch quiet exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          sleep 90
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - name: Replace private hash and HMAC bodies with pinned RustCrypto
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')
          package = root / 'crates/trnm-token-jwt-adapter'
          manifest = package / 'Cargo.toml'
          source_path = package / 'src/sha256.rs'
          if not manifest.is_file() or not source_path.is_file():
              raise SystemExit('standalone JWT adapter or sha256 authority is missing')

          manifest_text = manifest.read_text(encoding='utf-8')
          marker = '[dependencies]\n'
          if marker not in manifest_text:
              raise SystemExit(f'{manifest}: dependencies section missing')
          for name, version in (
              ('hmac', '=0.12.1'),
              ('sha2', '=0.10.9'),
          ):
              if not re.search(rf'^{re.escape(name)}\s*=', manifest_text, re.MULTILINE):
                  manifest_text = manifest_text.replace(
                      marker,
                      marker + f'{name} = "{version}"\n',
                      1,
                  )
          manifest.write_text(manifest_text, encoding='utf-8')

          source = source_path.read_text(encoding='utf-8')
          production = source.split('#[cfg(test)]', 1)[0]
          signatures = []
          for match in re.finditer(
              r'(?m)^(?P<visibility>pub(?:\([^)]*\))?\s+)?fn\s+'
              r'(?P<name>[A-Za-z_][A-Za-z0-9_]*)\s*'
              r'\((?P<args>[^)]*)\)\s*'
              r'(?:->\s*(?P<return>[^\{\n]+))?\s*\{',
              production,
          ):
              args = []
              for argument in match.group('args').split(','):
                  argument = argument.strip()
                  if not argument or ':' not in argument:
                      continue
                  name, type_text = argument.split(':', 1)
                  args.append((name.strip().lstrip('mut ').strip(), type_text.strip()))
              signatures.append(
                  {
                      'name': match.group('name'),
                      'args': args,
                      'return': (match.group('return') or '()').strip(),
                  }
              )

          slice_functions = [
              row
              for row in signatures
              if row['args']
              and all('&[u8]' in argument[1] for argument in row['args'])
          ]
          hash_candidates = [
              row
              for row in slice_functions
              if len(row['args']) == 1
              and '[u8; 32]' in row['return'].replace(' ', '')
          ]
          hmac_candidates = [
              row
              for row in slice_functions
              if len(row['args']) == 2
              and '[u8; 32]' in row['return'].replace(' ', '')
          ]
          equality_candidates = [
              row
              for row in slice_functions
              if len(row['args']) == 2 and row['return'] == 'bool'
          ]
          # Normalize return spelling before giving up.
          if not hash_candidates:
              hash_candidates = [
                  row
                  for row in slice_functions
                  if len(row['args']) == 1
                  and re.sub(r'\s+', '', row['return']) == '[u8;32]'
              ]
          if not hmac_candidates:
              hmac_candidates = [
                  row
                  for row in slice_functions
                  if len(row['args']) == 2
                  and re.sub(r'\s+', '', row['return']) == '[u8;32]'
              ]
          if len(hash_candidates) != 1 or len(hmac_candidates) != 1 or len(equality_candidates) != 1:
              raise SystemExit(
                  'JWT crypto interface is not the expected one-hash/one-HMAC/one-equality contract: '
                  f'hash={hash_candidates}, hmac={hmac_candidates}, equality={equality_candidates}'
              )

          def locate_body(text: str, function_name: str) -> tuple[int, int]:
              match = re.search(
                  rf'(?m)^(?:pub(?:\([^)]*\))?\s+)?fn\s+{re.escape(function_name)}\s*\(',
                  text,
              )
              if not match:
                  raise SystemExit(f'function missing: {function_name}')
              opening = text.find('{', match.end())
              if opening < 0:
                  raise SystemExit(f'function body missing: {function_name}')
              depth = 0
              index = opening
              in_string = False
              in_char = False
              escaped = False
              line_comment = False
              block_comment = 0
              while index < len(text):
                  current = text[index]
                  following = text[index + 1] if index + 1 < len(text) else ''
                  if line_comment:
                      if current == '\n':
                          line_comment = False
                      index += 1
                      continue
                  if block_comment:
                      if current == '/' and following == '*':
                          block_comment += 1
                          index += 2
                          continue
                      if current == '*' and following == '/':
                          block_comment -= 1
                          index += 2
                          continue
                      index += 1
                      continue
                  if in_string or in_char:
                      if escaped:
                          escaped = False
                      elif current == '\\':
                          escaped = True
                      elif in_string and current == '"':
                          in_string = False
                      elif in_char and current == "'":
                          in_char = False
                      index += 1
                      continue
                  if current == '/' and following == '/':
                      line_comment = True
                      index += 2
                      continue
                  if current == '/' and following == '*':
                      block_comment = 1
                      index += 2
                      continue
                  if current == '"':
                      in_string = True
                  elif current == "'":
                      in_char = True
                  elif current == '{':
                      depth += 1
                  elif current == '}':
                      depth -= 1
                      if depth == 0:
                          return opening, index + 1
                  index += 1
              raise SystemExit(f'unclosed function body: {function_name}')

          replacements = {}
          hash_row = hash_candidates[0]
          hash_input = hash_row['args'][0][0]
          replacements[hash_row['name']] = '''{
    use sha2::Digest as _;

    sha2::Sha256::digest(%s).into()
}''' % hash_input

          hmac_row = hmac_candidates[0]
          key = hmac_row['args'][0][0]
          message = hmac_row['args'][1][0]
          replacements[hmac_row['name']] = '''{
    use hmac::Mac as _;

    let mut hmac = hmac::Hmac::<sha2::Sha256>::new_from_slice(%s)
        .expect("HMAC-SHA256 accepts keys of every length");
    hmac.update(%s);
    hmac.finalize().into_bytes().into()
}''' % (key, message)

          equality_row = equality_candidates[0]
          left = equality_row['args'][0][0]
          right = equality_row['args'][1][0]
          replacements[equality_row['name']] = '''{
    let maximum = %s.len().max(%s.len());
    let mut difference = %s.len() ^ %s.len();
    for index in 0..maximum {
        let left_byte = %s.get(index).copied().unwrap_or(0);
        let right_byte = %s.get(index).copied().unwrap_or(0);
        difference |= usize::from(left_byte ^ right_byte);
    }
    difference == 0
}''' % (left, right, left, right, left, right)

          spans = []
          for name, replacement in replacements.items():
              start, end = locate_body(source, name)
              spans.append((start, end, replacement))
          for start, end, replacement in sorted(spans, reverse=True):
              source = source[:start] + replacement + source[end:]
          banner = (
              '// Production SHA-256 and HMAC-SHA256 are delegated to pinned RustCrypto crates.\n'
              '// The local constant-time equality wrapper retains full-width length accounting.\n'
          )
          if banner not in source:
              source = banner + source
          source_path.write_text(source, encoding='utf-8')

          adr = root / 'docs/adr/ADR-0002-RUSTCRYPTO-JWT-BACKEND.md'
          adr.write_text(
              '''# ADR-0002: Use pinned RustCrypto SHA-256 and HMAC for JWT signing

- Status: source candidate; independent security acceptance pending
- Scope: `crates/trnm-token-jwt-adapter`

## Decision

JWT SHA-256 and HMAC-SHA256 operations delegate to the pinned, reviewed RustCrypto `sha2` and
`hmac` crates. The adapter retains its bounded parser, exact 32-byte signature rule, legacy/epoch
separation and full-width unequal-length comparison regression. The previous hand-written hash and
HMAC rounds are not used by production code.

## Consequences and remaining gates

Direct dependency versions are exact. Existing RFC, malformed-token and 256-byte length-delta
vectors remain mandatory under the standalone strict gate. This ADR does not constitute a security
review, KMS/key-provider decision, fuzz acceptance, compatibility claim or production approval.
Independent cryptographic review and key-lifecycle evidence remain required.
''',
              encoding='utf-8',
          )

          inventory_path = root / 'docs/status/IMPLEMENTATION_INVENTORY.json'
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          for component in inventory.get('components', []):
              if component.get('id') == 'COMP-TOKEN-JWT':
                  fact = 'pinned RustCrypto SHA-256 and HMAC-SHA256 production backend with ADR'
                  implemented = component.setdefault('implemented', [])
                  if fact not in implemented:
                      implemented.append(fact)
                  missing = component.setdefault('missing', [])
                  remaining = 'independent crypto review, production key provider, fuzz acceptance and key-lifecycle evidence'
                  if remaining not in missing:
                      missing.append(remaining)
          inventory_path.write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Add permanent standalone RustCrypto security gate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/jwt-rustcrypto-backend.yml <<'YAML'
          name: jwt-rustcrypto-backend

          on:
            pull_request:
            push:
              branches:
                - main
                - feat/plan-v3-gap-closure-2026-08-29

          permissions:
            contents: read

          jobs:
            jwt-rustcrypto-backend:
              runs-on: ubuntu-24.04
              timeout-minutes: 20
              steps:
                - name: Fetch exact head without external actions
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -rf "$GITHUB_WORKSPACE"
                    git init "$GITHUB_WORKSPACE"
                    git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
                    git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
                    git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
                    test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
                - name: Verify pinned reviewed backend and execute full adapter corpus
                  shell: bash
                  run: |
                    set -euo pipefail
                    rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
                    rustup override set 1.85.1
                    manifest=crates/trnm-token-jwt-adapter/Cargo.toml
                    source=crates/trnm-token-jwt-adapter/src/sha256.rs
                    grep -Eq '^hmac[[:space:]]*=[[:space:]]*"=0\.12\.1"$' "$manifest"
                    grep -Eq '^sha2[[:space:]]*=[[:space:]]*"=0\.10\.9"$' "$manifest"
                    grep -q 'hmac::Hmac::<sha2::Sha256>' "$source"
                    grep -q 'sha2::Sha256::digest' "$source"
                    grep -q 'left.len() \^ right.len()' "$source" || \
                      grep -q 'difference = .*len() \^ .*len()' "$source"
                    cargo fmt --manifest-path "$manifest" -- --check
                    cargo test --manifest-path "$manifest" --all-targets --locked
                    cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
                    test -f docs/adr/ADR-0002-RUSTCRYPTO-JWT-BACKEND.md
          YAML
          git diff --check

      - name: Resolve exact dependency lock and run security corpus
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          manifest=crates/trnm-token-jwt-adapter/Cargo.toml
          cargo check --manifest-path "$manifest" --all-targets
          cargo fmt --manifest-path "$manifest"
          cargo test --manifest-path "$manifest" --all-targets --locked
          cargo clippy --fix --allow-dirty --allow-staged \
            --manifest-path "$manifest" --all-targets --locked -- -D warnings
          cargo fmt --manifest-path "$manifest"
          git diff --check
          cargo fmt --manifest-path "$manifest" -- --check
          cargo test --manifest-path "$manifest" --all-targets --locked
          cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Delete every temporary writer and push unchanged-tip result
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) \
            -print -delete
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "refactor(jwt): delegate SHA-256 and HMAC to RustCrypto"
          git push origin "HEAD:${GITHUB_REF_NAME}"
