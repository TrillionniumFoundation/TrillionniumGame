name: crypto-strict-clippy-v5

on:
  push:
    branches: [tooling/crypto-key-lifecycle-patch-2026-09-06]
    paths:
      - '.github/workflows/crypto-strict-clippy-v5.yml'

permissions:
  contents: write

jobs:
  normalize-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRODUCT_BRANCH: codex/crypto-key-lifecycle-2026-09-06
      EXPECTED_BASE: 7deee4377cff401854647151842c582f038feef1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for complete crypto source and fetch exact branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          for attempt in $(seq 1 90); do
            git -C "$GITHUB_WORKSPACE" fetch --no-tags --prune origin \
              "+refs/heads/${PRODUCT_BRANCH}:refs/remotes/origin/product"
            if git -C "$GITHUB_WORKSPACE" cat-file -e \
                 'refs/remotes/origin/product:crates/trnm-token-crypto-provider/src/key_domain.rs' \
                 2>/dev/null && \
               git -C "$GITHUB_WORKSPACE" show \
                 'refs/remotes/origin/product:crates/trnm-token-crypto-provider/src/signer_journal.rs' \
                 | grep -qF 'pub key_domain: KeyDomain'; then
              break
            fi
            if test "$attempt" -eq 90; then
              printf 'complete crypto source did not materialize\n' >&2
              exit 1
            fi
            sleep 20
          done
          git -C "$GITHUB_WORKSPACE" checkout -b "$PRODUCT_BRANCH" \
            refs/remotes/origin/product
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$RUNNER_TEMP/original-head"

      - name: Correct accessor convention without changing key material semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-token-crypto-provider/src/key_epoch.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'pub const fn as_bytes(self) -> [u8; 16] {\n        self.0\n    }',
              'pub const fn as_bytes(&self) -> &[u8; 16] {\n        &self.0\n    }',
              1,
          )
          if 'pub const fn as_bytes(self)' in text:
              raise SystemExit('KeyId accessor correction did not apply')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format, test and strictly lint complete crypto crate
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup override set 1.85.1
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml
          git diff --check
          cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-token-crypto-provider/Cargo.toml \
            --all-targets --locked
          cargo clippy --manifest-path crates/trnm-token-crypto-provider/Cargo.toml \
            --all-targets --locked -- -D warnings

      - name: CAS fast-forward validated branch
        shell: bash
        run: |
          set -euo pipefail
          original=$(cat "$RUNNER_TEMP/original-head")
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add crates/trnm-token-crypto-provider/src
          if git diff --cached --quiet; then
            printf 'source_already_current=true\nhead=%s\n' "$original"
            exit 0
          fi
          git commit -m 'style(crypto): use borrowed key byte accessors'
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}" \
            --force-with-lease="refs/heads/${PRODUCT_BRANCH}:${original}"
          printf 'old_head=%s\nnew_head=%s\ntree=%s\n' \
            "$original" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Preserve no-credit boundary
        shell: bash
        run: |
          printf '%s\n' \
            'source_candidate=true' \
            'real_key_material_used=false' \
            'accepted_evidence=false' \
            'gap_closed=false' \
            'production_ready=false'
