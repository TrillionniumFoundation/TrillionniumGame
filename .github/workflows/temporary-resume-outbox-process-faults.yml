name: temporary-resume-outbox-process-faults

on:
  push:
    branches:
      - codex/outbox-process-faults-2026-08-31

permissions:
  contents: write

concurrency:
  group: temporary-resume-outbox-process-faults
  cancel-in-progress: false

jobs:
  repair-harness-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Reuse audited patch with conditional exit capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/temporary-outbox-process-faults.yml')
          source = workflow.read_text(encoding='utf-8')
          old = r'''          set +e
          "$worker_bin" run-once \
            >"$evidence/worker-crash.stdout" \
            2>"$evidence/worker-crash.stderr"
          crash_status=$?
          set -e
          test "$crash_status" -eq 70
          '''
          new = r'''          if "$worker_bin" run-once \
            >"$evidence/worker-crash.stdout" \
            2>"$evidence/worker-crash.stderr"; then
            echo 'expected post-delivery worker exit did not occur' >&2
            exit 1
          else
            crash_status=$?
          fi
          test "$crash_status" -eq 70
          '''
          if source.count(old) != 1:
              raise SystemExit(
                  f'expected one crash-capture block, found {source.count(old)}'
              )
          source = source.replace(old, new, 1)
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          patch = textwrap.dedent(source[start:end])
          Path('/tmp/apply-outbox-process-faults.py').write_text(
              patch + '\n', encoding='utf-8'
          )
          PY
          python3 -m py_compile /tmp/apply-outbox-process-faults.py
          python3 /tmp/apply-outbox-process-faults.py
          rm .github/workflows/temporary-resume-outbox-process-faults.yml
          test ! -e .github/workflows/temporary-outbox-process-faults.yml
          git diff --check
          bash -n scripts/ci-outbox-spool-worker.sh

      - name: Validate complete source corpus
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-rust-package-inventory.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Execute PostgreSQL process-fault matrix
        shell: bash
        run: |
          set -euo pipefail
          TRNM_POSTGRES_IMAGE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('config/database-test-images.json').read_text())['profiles']['postgresql']['image'])
          PY
          )
          export TRNM_POSTGRES_IMAGE
          export TRNM_EVIDENCE_ROOT=/tmp/outbox-process-evidence
          export TRNM_RUN_ID="process-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-postgresql"
          bash scripts/ci-outbox-spool-worker.sh postgresql

      - name: Execute CockroachDB process-fault matrix
        shell: bash
        run: |
          set -euo pipefail
          TRNM_COCKROACH_IMAGE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('config/database-test-images.json').read_text())['profiles']['cockroachdb']['image'])
          PY
          )
          export TRNM_COCKROACH_IMAGE
          export TRNM_EVIDENCE_ROOT=/tmp/outbox-process-evidence
          export TRNM_RUN_ID="process-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cockroachdb"
          bash scripts/ci-outbox-spool-worker.sh cockroachdb

      - name: Commit only fully verified process-fault implementation
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*outbox*' -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "test(outbox): prove process exit reclaim and claim exclusion"
          git push origin "HEAD:${GITHUB_REF_NAME}"
