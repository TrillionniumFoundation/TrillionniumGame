name: temporary-master-runtime-closure-v4

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temporary-master-runtime-closure
  cancel-in-progress: true

jobs:
  finalize-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Cancel obsolete temporary runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          current = int(os.environ['GITHUB_RUN_ID'])
          base = os.environ['GITHUB_API_URL']
          repo = os.environ['GITHUB_REPOSITORY']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'trillionnium-master-runtime-closure-v4',
          }
          request = urllib.request.Request(
              f'{base}/repos/{repo}/actions/runs?branch=feat/plan-v3-gap-closure-2026-08-29&per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get('workflow_runs', [])
          for run in runs:
              if int(run['id']) == current or run.get('status') == 'completed':
                  continue
              if not str(run.get('name', '')).startswith('temporary-'):
                  continue
              cancel = urllib.request.Request(
                  f"{base}/repos/{repo}/actions/runs/{run['id']}/cancel",
                  data=b'', method='POST', headers=headers,
              )
              try:
                  urllib.request.urlopen(cancel, timeout=30).read()
              except urllib.error.HTTPError as error:
                  if error.code not in (403, 409, 422):
                      raise
          PY

      - name: Fetch exact latest branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_REF_NAME"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Materialize and normalize formal source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/tmp/runtime-closure/apply-v2.py ]; then
            python3 -m py_compile .github/tmp/runtime-closure/apply-v2.py
            python3 .github/tmp/runtime-closure/apply-v2.py
          fi
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          lib = Path('crates/trnm-persistence-pg/src/lib.rs')
          source = lib.read_text(encoding='utf-8')
          header = '#![forbid(unsafe_code)]\n\n'
          if not source.startswith(header):
              raise SystemExit('persistence-pg crate header drifted')
          body = source[len(header):]
          lines = body.splitlines(keepends=True)
          normalized = []
          skip_export = False
          for line in lines:
              stripped = line.strip()
              if stripped in {'mod cancel;', 'mod outbox;', 'mod pool;'}:
                  continue
              if not skip_export and any(
                  stripped.startswith(f'pub use {name}::')
                  for name in ('cancel', 'outbox', 'pool')
              ):
                  skip_export = ';' not in stripped
                  continue
              if skip_export:
                  if ';' in stripped:
                      skip_export = False
                  continue
              normalized.append(line)
          body = ''.join(normalized).lstrip('\n')
          prefix = (
              'mod cancel;\nmod outbox;\nmod pool;\n\n'
              'pub use cancel::{cancellation_watchdog_panicked, PgCancelHandle};\n'
              'pub use outbox::{\n'
              '    OutboxLease, OutboxRecord, OutboxRetryOutcome, OutboxState,\n'
              '};\n'
              'pub use pool::{PgPool, PgPoolConfig, PgPoolSnapshot, PgTlsConfig};\n\n'
          )
          source = header + prefix + body
          lib.write_text(source, encoding='utf-8')

          cancel = Path('crates/trnm-persistence-pg/src/cancel.rs')
          if cancel.is_file():
              value = cancel.read_text(encoding='utf-8').replace(
                  'pub(crate) fn cancellation_watchdog_panicked()',
                  'pub fn cancellation_watchdog_panicked()',
              )
              cancel.write_text(value, encoding='utf-8')

          server_pool = Path('crates/trnm-persistence-pg/src/bin/trnm_server/pool.rs')
          if server_pool.is_file():
              value = server_pool.read_text(encoding='utf-8').replace(
                  "if signal.recv_timeout(deadline) == Err(mpsc::RecvTimeoutError::Timeout) {",
                  "if matches!(signal.recv_timeout(deadline), Err(mpsc::RecvTimeoutError::Timeout)) {",
              )
              server_pool.write_text(value, encoding='utf-8')

          required = {
              'crates/trnm-persistence-pg/src/outbox.rs': ['MAX_CLAIM_SCAN', 'load_outbox_record'],
              'crates/trnm-persistence-pg/src/cancel.rs': ['PgCancelHandle', 'cancellation_watchdog_panicked'],
              'crates/trnm-persistence-pg/src/pool.rs': ['CancelTransport::Tls'],
              'crates/trnm-persistence-pg/src/bin/trnm_server/pool.rs': ['run_with_deadline'],
              'crates/trnm-persistence-pg/tests/outbox_runtime.rs': ['outbox_claim_retry_crash_reclaim_deadletter_and_completion_are_durable'],
              '.github/workflows/pg-outbox-fault.yml': ['postgresql-outbox', 'cockroachdb-outbox'],
          }
          for path_text, markers in required.items():
              path = Path(path_text)
              if not path.is_file():
                  raise SystemExit(f'missing formal file: {path}')
              value = path.read_text(encoding='utf-8')
              missing = [marker for marker in markers if marker not in value]
              if missing:
                  raise SystemExit(f'{path}: missing {missing}')

          workflows = '\n'.join(
              path.read_text(encoding='utf-8', errors='replace')
              for path in Path('.github/workflows').glob('*.yml')
              if not path.name.startswith('temporary-')
          )
          postgres = re.findall(r"postgres(?::[^@\s\"']+)?@sha256:[0-9a-f]{64}", workflows)
          cockroach = re.findall(r"cockroachdb/cockroach(?::[^@\s\"']+)?@sha256:[0-9a-f]{64}", workflows)
          if not postgres or not cockroach:
              raise SystemExit('immutable database image identity missing')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'POSTGRES_IMAGE={postgres[0]}\n')
              handle.write(f'COCKROACH_IMAGE={cockroach[0]}\n')
          for path in Path('.github/workflows').glob('temporary-*.yml'):
              path.unlink()
          PY
          rm -rf .github/tmp/runtime-closure
          rmdir .github/tmp 2>/dev/null || true
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -print -quit)"
          git diff --check

      - name: Execute strict source gates
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/runtime-closure-v4.log) 2>&1
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo check --package trnm-persistence-pg --all-targets
          cargo clippy --package trnm-persistence-pg --all-targets --fix \
            --allow-dirty --allow-staged -- -W clippy::all
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Execute PostgreSQL outbox crash matrix
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/runtime-closure-v4.log) 2>&1
          trap 'docker rm -f trnm-v4-postgres >/dev/null 2>&1 || true' EXIT
          docker run -d --name trnm-v4-postgres \
            -e POSTGRES_USER=trnm -e POSTGRES_PASSWORD=trnm -e POSTGRES_DB=trnm \
            -p 127.0.0.1:55432:5432 "$POSTGRES_IMAGE"
          for attempt in $(seq 1 90); do
            docker exec trnm-v4-postgres pg_isready -U trnm -d trnm && break
            test "$attempt" -lt 90
            sleep 1
          done
          export TRNM_SERVER_DATABASE_URL='postgresql://trnm:trnm@127.0.0.1:55432/trnm?sslmode=disable'
          export TRNM_SERVER_DATABASE_PROFILE='postgresql'
          export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$GITHUB_SHA"
          export TRNM_SERVER_ADMIN_TOKEN='outbox_fault_admin_token_0123456789abcdef'
          export TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE='1'
          export TRNM_LIVE_TEST_REQUIRED='1'
          export TRNM_PG_TEST_URL="$TRNM_SERVER_DATABASE_URL"
          export TRNM_PG_TEST_PROFILE='postgresql'
          cargo run --package trnm-persistence-pg --bin trnm-server --locked -- migrate
          cargo test --package trnm-persistence-pg --test outbox_runtime --locked -- --nocapture

      - name: Execute CockroachDB outbox crash matrix
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/runtime-closure-v4.log) 2>&1
          trap 'docker rm -f trnm-v4-cockroach >/dev/null 2>&1 || true' EXIT
          docker run -d --name trnm-v4-cockroach \
            -p 127.0.0.1:26257:26257 "$COCKROACH_IMAGE" \
            start-single-node --insecure --listen-addr=0.0.0.0:26257 \
            --http-addr=0.0.0.0:8080
          for attempt in $(seq 1 90); do
            docker exec trnm-v4-cockroach cockroach sql --insecure \
              --host=127.0.0.1:26257 -e 'SELECT 1' >/dev/null 2>&1 && break
            test "$attempt" -lt 90
            sleep 1
          done
          docker exec trnm-v4-cockroach cockroach sql --insecure \
            --host=127.0.0.1:26257 -e 'CREATE DATABASE IF NOT EXISTS trnm'
          export TRNM_SERVER_DATABASE_URL='postgresql://root@127.0.0.1:26257/trnm?sslmode=disable'
          export TRNM_SERVER_DATABASE_PROFILE='cockroachdb'
          export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$GITHUB_SHA"
          export TRNM_SERVER_ADMIN_TOKEN='outbox_fault_admin_token_0123456789abcdef'
          export TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE='1'
          export TRNM_LIVE_TEST_REQUIRED='1'
          export TRNM_PG_TEST_URL="$TRNM_SERVER_DATABASE_URL"
          export TRNM_PG_TEST_PROFILE='cockroachdb'
          cargo run --package trnm-persistence-pg --bin trnm-server --locked -- migrate
          cargo test --package trnm-persistence-pg --test outbox_runtime --locked -- --nocapture

      - name: Reject stale writers and push clean exact source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -print -quit)"
          test ! -d .github/tmp/runtime-closure
          git diff --check
          git config user.name 'trillionnium-gap-closure-bot'
          git config user.email 'gap-closure-bot@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(pg): close outbox crash and cancellation source gaps'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record failure without claim promotion
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path('/tmp/runtime-closure-v4.log')
          tail = ''
          if path.is_file():
              tail = '\n'.join(path.read_text(encoding='utf-8', errors='replace').splitlines()[-140:])
          body = (
              f"Master runtime closure v4 failed for exact source head `{os.environ['GITHUB_SHA']}`. "
              f"No gap, stage gate or compatibility claim was promoted. Run: "
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}\n\n```text\n{tail}\n```"
          )
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/issues/42/comments",
              data=json.dumps({'body': body}).encode(), method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'trillionnium-master-runtime-closure-v4',
              },
          )
          try:
              urllib.request.urlopen(request, timeout=30).read()
          except Exception:
              pass
          PY
