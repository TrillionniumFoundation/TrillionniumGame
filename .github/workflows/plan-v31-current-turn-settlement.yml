name: plan-v31-current-turn-settlement

on:
  push:
    branches: [tooling/gap-closure-audit-2026-09-07]
    paths:
      - '.github/workflows/plan-v31-current-turn-settlement.yml'

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  settle:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
      TARGET_BRANCH: tooling/gap-closure-audit-2026-09-07
      TARGET_PR: '63'
      COMMAND_ISSUE: '7'
      EXPECTED_HEAD: 88c02a417c7b0c64f27dc9f49e0b5e6317150964
      EXPECTED_TREE: 9d3ae2fadb2684f095855ecf16307376b55a440f
      EXPECTED_BASE: d66c1b5b614a2a7b682c233fe2e7a19939b6976b
      EXPECTED_MERGE: 6965f95d03031156edc92cc862bd979ff87e9edb
    steps:
      - name: Wait for exact current execution wave and build closed-set report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/settlement"
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ['TARGET_REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          root = f'https://api.github.com/repos/{repository}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'trillionnium-plan-v31-current-turn-settlement',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          producers = {
              'effective-governance-readback',
              'monotonic-main-protection-reconcile',
              'governance-negative-rehearsal',
              'governance-settlement',
              'conflict-free-reviewer-discovery',
              'v7-source-wave-admission-handoff',
              'archive-zero-credit-transfer-pr',
              'storage-nakama-live-differential',
              'database-ha-restore-live-evidence',
              'current-gap-producer-diagnostics',
              'focused-source-gap-evidence',
          }

          def call(method, path, body=None, allowed=()):
              data = None if body is None else json.dumps(body, separators=(',', ':')).encode()
              request = urllib.request.Request(root + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      payload = response.read()
                      return response.status, json.loads(payload.decode()) if payload else None
              except urllib.error.HTTPError as error:
                  payload = error.read().decode('utf-8', errors='replace')
                  if error.code in allowed:
                      try:
                          value = json.loads(payload) if payload else None
                      except Exception:
                          value = {'message': payload[:1000]}
                      return error.code, value
                  raise SystemExit(f'{method} {path}: HTTP {error.code}: {payload[:2000]}')

          deadline = time.monotonic() + 60 * 60
          latest = {}
          while True:
              _, runs = call('GET', '/actions/runs?' + urllib.parse.urlencode({
                  'branch': branch, 'per_page': 100,
              }))
              for row in runs.get('workflow_runs', []):
                  name = row.get('name')
                  if name not in producers:
                      continue
                  rank = (int(row.get('run_attempt') or 0), int(row.get('id') or 0))
                  old = latest.get(name)
                  old_rank = (int(old.get('run_attempt') or 0), int(old.get('id') or 0)) if old else (-1, -1)
                  if old is None or rank > old_rank:
                      latest[name] = row
              if producers.issubset(latest) and all(latest[name].get('status') == 'completed' for name in producers):
                  break
              if time.monotonic() >= deadline:
                  break
              time.sleep(15)

          _, pull = call('GET', f"/pulls/{os.environ['TARGET_PR']}")
          identities = {
              'base': pull['base']['sha'],
              'head': pull['head']['sha'],
              'tree': None,
              'prospective_merge': pull.get('merge_commit_sha'),
          }
          _, head_commit = call('GET', f"/git/commits/{pull['head']['sha']}")
          identities['tree'] = head_commit['tree']['sha']
          expected = {
              'base': os.environ['EXPECTED_BASE'],
              'head': os.environ['EXPECTED_HEAD'],
              'tree': os.environ['EXPECTED_TREE'],
              'prospective_merge': os.environ['EXPECTED_MERGE'],
          }
          identity_stable = identities == expected

          records = []
          for name in sorted(producers):
              row = latest.get(name)
              if row is None:
                  records.append({'workflow': name, 'observed': False, 'status': 'missing', 'conclusion': None, 'artifacts': []})
                  continue
              _, artifacts = call('GET', f"/actions/runs/{row['id']}/artifacts?per_page=100")
              records.append({
                  'workflow': name,
                  'observed': True,
                  'run_id': row['id'],
                  'run_attempt': row.get('run_attempt'),
                  'head_sha': row.get('head_sha'),
                  'status': row.get('status'),
                  'conclusion': row.get('conclusion'),
                  'artifacts': [{
                      'id': item.get('id'), 'name': item.get('name'),
                      'size_in_bytes': item.get('size_in_bytes'),
                      'digest': item.get('digest'), 'expired': item.get('expired'),
                  } for item in artifacts.get('artifacts', [])],
              })

          def content(path):
              _, value = call('GET', '/contents/' + path + '?ref=' + urllib.parse.quote(os.environ['EXPECTED_HEAD']))
              return json.loads(base64.b64decode(value['content']))

          gap = content('docs/status/GAP_REGISTER.json')
          evidence = content('docs/evidence/index.json')
          product = content('docs/status/PRODUCT_GATES.json')
          gaps = gap.get('gaps', [])
          product_rows = product.get('gates', [])
          gap_counts = {}
          for row in gaps:
              gap_counts[row.get('status')] = gap_counts.get(row.get('status'), 0) + 1
          product_counts = {}
          for row in product_rows:
              product_counts[row.get('status')] = product_counts.get(row.get('status'), 0) + 1
          accepted_evidence = evidence.get('accepted_entry_count')
          if not isinstance(accepted_evidence, int):
              accepted_evidence = sum(1 for row in evidence.get('entries', []) if row.get('status') == 'accepted')

          _, reviews = call('GET', f"/pulls/{os.environ['TARGET_PR']}/reviews?per_page=100")
          latest_reviews = {}
          for row in reviews:
              login = str((row.get('user') or {}).get('login') or '').lower()
              if not login:
                  continue
              old = latest_reviews.get(login)
              if old is None or str(old.get('submitted_at') or '') <= str(row.get('submitted_at') or ''):
                  latest_reviews[login] = row
          conflicts = {'profhepta', 'franksudoman'}
          approvals = [
              row for login, row in latest_reviews.items()
              if login not in conflicts and row.get('state') == 'APPROVED'
              and row.get('commit_id') == os.environ['EXPECTED_HEAD']
              and str((row.get('user') or {}).get('type') or '').lower() != 'bot'
          ]
          changes = [
              row for login, row in latest_reviews.items()
              if login not in conflicts and row.get('state') == 'CHANGES_REQUESTED'
              and row.get('commit_id') == os.environ['EXPECTED_HEAD']
          ]
          all_producers_success = all(
              row.get('status') == 'completed' and row.get('conclusion') == 'success'
              for row in records
          )
          formal = {
              'identity_stable': identity_stable,
              'producer_count': len(producers),
              'producer_terminal_success': sum(
                  row.get('status') == 'completed' and row.get('conclusion') == 'success'
                  for row in records
              ),
              'producer_failed': sum(
                  row.get('status') == 'completed' and row.get('conclusion') not in ('success', 'neutral', 'skipped')
                  for row in records
              ),
              'producer_active_or_missing': sum(row.get('status') != 'completed' for row in records),
              'all_producers_success': all_producers_success,
              'formal_gap_count': len(gaps),
              'formal_gaps_closed': sum(row.get('status') == 'closed' for row in gaps),
              'close_criteria_count': sum(len(row.get('close_criteria', [])) for row in gaps),
              'gap_status_counts': gap_counts,
              'accepted_evidence_count': accepted_evidence,
              'product_gate_count': len(product_rows),
              'product_gate_status_counts': product_counts,
              'qualifying_current_head_approvals': len(approvals),
              'current_head_changes_requested': len(changes),
              'all_gaps_closed': False,
              'production_ready': False,
              'public_online': False,
              'nakama_retired': False,
          }
          formal['all_gaps_closed'] = bool(
              identity_stable
              and all_producers_success
              and len(gaps) > 0
              and formal['formal_gaps_closed'] == len(gaps)
              and accepted_evidence > 0
              and product_rows
              and all(row.get('status') in ('passed', 'accepted', 'closed') for row in product_rows)
              and len(approvals) >= 2
              and not changes
          )

          value = {
              'schema': 'trillionnium.plan-v31-current-turn-settlement.v1',
              'repository': repository,
              'pull_request': int(os.environ['TARGET_PR']),
              'identities': identities,
              'expected_identities': expected,
              'producer_results': records,
              'formal': formal,
              'qualifying_approvers': [(row.get('user') or {}).get('login') for row in approvals],
              'current_changes_requested': [(row.get('user') or {}).get('login') for row in changes],
              'claim_boundary': {
                  'accepted_evidence': accepted_evidence > 0,
                  'all_gaps_closed': formal['all_gaps_closed'],
                  'production_ready': False,
                  'public_online': False,
                  'nakama_retired': False,
              },
          }
          target = Path(os.environ['RUNNER_TEMP']) / 'settlement' / 'current-turn-settlement.json'
          target.write_text(json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n')

          lines = [
              '<!-- TRNM-PLAN-V31-CURRENT-TURN-SETTLEMENT -->',
              '## Plan v3.1 current execution-wave settlement', '',
              f"Exact tuple stable: `{str(identity_stable).lower()}`",
              f"Producer terminal-success: `{formal['producer_terminal_success']}/{formal['producer_count']}`",
              f"Producer failed: `{formal['producer_failed']}`; active/missing: `{formal['producer_active_or_missing']}`",
              f"Formal gaps closed: `{formal['formal_gaps_closed']}/{formal['formal_gap_count']}`",
              f"Close criteria: `{formal['close_criteria_count']}`",
              f"Accepted evidence entries: `{accepted_evidence}`",
              f"Current-head independent approvals: `{len(approvals)}`; changes requested: `{len(changes)}`",
              f"All gaps closed: `{str(formal['all_gaps_closed']).lower()}`", '',
              '| Producer | Run | Conclusion | Artifacts |',
              '| --- | ---: | --- | ---: |',
          ]
          for row in records:
              lines.append(
                  f"| `{row['workflow']}` | {row.get('run_id') or 'missing'} | "
                  f"`{row.get('conclusion') or row.get('status')}` | {len(row.get('artifacts', []))} |"
              )
          lines += ['', 'No source request, workflow run, review request or administrator mutation is itself gap closure. The machine result remains fail-closed until every formal criterion and independent/environment obligation is accepted.']
          body = '\n'.join(lines)
          for issue in (os.environ['TARGET_PR'], os.environ['COMMAND_ISSUE']):
              _, comments = call('GET', f'/issues/{issue}/comments?per_page=100')
              old = next((row for row in reversed(comments) if '<!-- TRNM-PLAN-V31-CURRENT-TURN-SETTLEMENT -->' in (row.get('body') or '')), None)
              if old:
                  call('PATCH', f"/issues/comments/{old['id']}", {'body': body})
              else:
                  call('POST', f'/issues/{issue}/comments', {'body': body})
          if all_producers_success and identity_stable:
              call('POST', f"/pulls/{os.environ['TARGET_PR']}/requested_reviewers", {'reviewers':['Tomasrgbsf']}, allowed=(422,))
          print(json.dumps(formal, sort_keys=True))
          PY
          sha256sum "$RUNNER_TEMP/settlement/current-turn-settlement.json" \
            > "$RUNNER_TEMP/settlement/SHA256SUMS"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$RUNNER_TEMP/plan-v31-current-turn-settlement.tar.gz" \
            -C "$RUNNER_TEMP/settlement" current-turn-settlement.json SHA256SUMS

      - name: Fetch exact source for uploader
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${TARGET_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin "$EXPECTED_HEAD"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD

      - name: Retain final current-turn settlement
        id: retained
        uses: ./source/.github/actions/upload-evidence
        with:
          name: plan-v31-current-turn-settlement-${{ env.EXPECTED_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plan-v31-current-turn-settlement.tar.gz
          mime_type: application/gzip

      - name: Verify receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained.outputs.artifact_id }}'
          test -n '${{ steps.retained.outputs.sha256 }}'
          test '${{ steps.retained.outputs.size_bytes }}' -gt 0
