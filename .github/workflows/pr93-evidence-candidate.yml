name: pr93-evidence-candidate

on:
  push:
    branches:
      - tooling/gap-closure-audit-2026-09-07
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pr93-evidence-candidate
  cancel-in-progress: true

jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PR_NUMBER: "93"
    steps:
      - name: Bind current object and require terminal-success execution
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          pr=$(gh api "repos/$repo/pulls/$PR_NUMBER")
          head=$(jq -r .head.sha <<<"$pr")
          base=$(jq -r .base.sha <<<"$pr")
          merge=$(jq -r .merge_commit_sha <<<"$pr")
          test "$(jq -r .state <<<"$pr")" = open
          test "$(jq -r .draft <<<"$pr")" = true
          printf 'head=%s\nbase=%s\nmerge=%s\n' "$head" "$base" "$merge" \
            >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 80); do
            gh api --paginate "repos/$repo/actions/runs?head_sha=$head&per_page=100" \
              | jq -s '[.[].workflow_runs[]] | unique_by(.id)' \
              > "$RUNNER_TEMP/runs.json"
            active=$(jq '[.[] | select(.status != "completed")] | length' \
              "$RUNNER_TEMP/runs.json")
            [[ "$active" -eq 0 ]] && break
            sleep 15
          done
          test "$(jq 'length' "$RUNNER_TEMP/runs.json")" -gt 0
          test "$(jq '[.[] | select(.status != "completed")] | length' "$RUNNER_TEMP/runs.json")" -eq 0
          test "$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure")] | length' "$RUNNER_TEMP/runs.json")" -eq 0

      - name: Check out exact head and actual merge without external actions
        shell: bash
        env:
          HEAD_SHA: ${{ steps.identity.outputs.head }}
          BASE_SHA: ${{ steps.identity.outputs.base }}
          MERGE_SHA: ${{ steps.identity.outputs.merge }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin \
            "$HEAD_SHA" "$BASE_SHA" "$MERGE_SHA" \
            "refs/pull/$PR_NUMBER/merge"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$HEAD_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" || true

      - name: Build exact run job artifact and source packet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.identity.outputs.head }}
          BASE_SHA: ${{ steps.identity.outputs.base }}
          MERGE_SHA: ${{ steps.identity.outputs.merge }}
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/pr93-evidence-candidate"
          mkdir -p "$packet/runs" "$packet/source"
          cp "$RUNNER_TEMP/runs.json" "$packet/runs/workflow-runs.json"

          jq -r '.[].id' "$RUNNER_TEMP/runs.json" | while read -r run_id; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              | jq -s '[.[].jobs[]] | unique_by(.id)' \
              > "$packet/runs/jobs-$run_id.json"
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              | jq -s '[.[].artifacts[]] | unique_by(.id)' \
              > "$packet/runs/artifacts-$run_id.json"
          done

          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            > "$packet/reviews.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
            > "$packet/requested-reviewers.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            > "$packet/pull-request.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" \
            > "$packet/main-branch-summary.json"

          git show -s --format=raw "$HEAD_SHA" > "$packet/source/head-commit.txt"
          git show -s --format=raw "$MERGE_SHA" > "$packet/source/merge-commit.txt"
          git ls-tree -r "$HEAD_SHA" > "$packet/source/head-tree.txt"
          git ls-tree -r "$MERGE_SHA" > "$packet/source/merge-tree.txt"
          git diff --stat "$BASE_SHA" "$HEAD_SHA" > "$packet/source/diff-stat.txt"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" \
            > "$packet/source/diff-name-status.txt"
          git archive --format=tar.gz -o "$packet/source/exact-head.tar.gz" "$HEAD_SHA"

          python3 - "$packet" "$GITHUB_REPOSITORY" "$BASE_SHA" "$HEAD_SHA" "$MERGE_SHA" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          packet=Path(sys.argv[1])
          repo,base,head,merge=sys.argv[2:]
          members=[]
          for path in sorted(p for p in packet.rglob('*') if p.is_file()):
              raw=path.read_bytes()
              members.append({'path':path.relative_to(packet).as_posix(),
                              'bytes':len(raw),
                              'sha256':hashlib.sha256(raw).hexdigest()})
          manifest={
              'schema':'trillionnium.pr93-evidence-candidate.v1',
              'repository':repo,'pr':93,'base':base,'head':head,'merge':merge,
              'members':members,
              'review_state':'independent-specialist-and-global-sg1-review-required',
              'accepted_evidence':False,'gap_closed':False,'sg1_credit':False,
              'compatibility_credit':False,'production_ready':False,
              'public_online':False,'nakama_retired':False,
          }
          (packet/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          (
            cd "$packet"
            find . -type f ! -path './files.sha256' -print0 \
              | LC_ALL=C sort -z | xargs -0 sha256sum > files.sha256
            sha256sum --check files.sha256
          )
          tar -C "$RUNNER_TEMP" -czf "$GITHUB_WORKSPACE/pr93-evidence-candidate.tar.gz" \
            pr93-evidence-candidate
          sha256sum "$GITHUB_WORKSPACE/pr93-evidence-candidate.tar.gz" \
            | tee "$GITHUB_WORKSPACE/pr93-evidence-candidate.tar.gz.sha256"

      - name: Upload with repository-native evidence action
        id: upload
        uses: ./.github/actions/upload-evidence
        with:
          name: pr93-evidence-candidate-${{ steps.identity.outputs.head }}
          path: |
            pr93-evidence-candidate.tar.gz
            pr93-evidence-candidate.tar.gz.sha256
          retention-days: 90

      - name: Publish zero-credit packet locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.identity.outputs.head }}
          BASE_SHA: ${{ steps.identity.outputs.base }}
          MERGE_SHA: ${{ steps.identity.outputs.merge }}
        run: |
          set -euo pipefail
          digest=$(cut -d' ' -f1 pr93-evidence-candidate.tar.gz.sha256)
          body=$(cat <<EOF
          Retained PR #93 evidence **candidate** for exact head \`$HEAD_SHA\`, base \`$BASE_SHA\`, and actual merge \`$MERGE_SHA\`.

          - producer run: \`$GITHUB_RUN_ID\`
          - job: \`$GITHUB_JOB\`
          - packet SHA-256: \`$digest\`
          - artifact ID: \`${{ steps.upload.outputs.artifact-id }}\`
          - artifact digest: \`${{ steps.upload.outputs.artifact-digest }}\`

          The packet enumerates exact workflow runs, jobs, artifact metadata, source trees and review state. It remains zero-credit until retained bytes are independently downloaded, member digests reproduced, evidence admission passes, and current-object specialist/global SG1 decisions are accepted.
          EOF
          )
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/$PR_NUMBER/comments" \
            --raw-field body="$body"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/7/comments" \
            --raw-field body="$body"
