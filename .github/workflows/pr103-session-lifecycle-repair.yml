name: pr103-session-lifecycle-repair

on:
  push:
    branches:
      - codex/plan-v31-product-gap-wave-2026-09-07
    paths:
      - scripts/one_shot_pr103_session_lifecycle_repair.py
      - .github/workflows/pr103-session-lifecycle-repair.yml

permissions:
  contents: write

concurrency:
  group: pr103-session-lifecycle-repair
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/plan-v31-product-gap-wave-2026-09-07

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          observed="$(git -C "$GITHUB_WORKSPACE" ls-remote origin \
            "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD

      - name: Apply projected-capacity and namespace lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/one_shot_pr103_session_lifecycle_repair.py
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml
          git diff --check
          actual="$(git diff --name-only | sort | paste -sd, -)"
          expected="crates/trnm-presence-router-v2/README.md,crates/trnm-presence-router-v2/src/lib.rs,crates/trnm-presence-router-v2/src/router/state.rs,crates/trnm-presence-router-v2/src/session_registry.rs"
          test "$actual" = "$expected"

      - name: Form and validate source-only commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name trillionnium-realtime-bot
          git config user.email trillionnium-realtime-bot@users.noreply.github.com
          git add \
            crates/trnm-presence-router-v2/README.md \
            crates/trnm-presence-router-v2/src/lib.rs \
            crates/trnm-presence-router-v2/src/router/state.rs \
            crates/trnm-presence-router-v2/src/session_registry.rs
          git commit -m "fix(realtime): add projected capacity and namespace rollover"
          source_commit="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          cargo fmt --manifest-path crates/trnm-presence-router-v2/Cargo.toml -- --check
          cargo test --manifest-path crates/trnm-presence-router-v2/Cargo.toml --all-targets
          cargo clippy --manifest-path crates/trnm-presence-router-v2/Cargo.toml \
            --all-targets -- -D warnings
          observed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$observed" = "$GITHUB_SHA"
          git push origin "${source_commit}:refs/heads/${TARGET_BRANCH}"
