name: temporary-fix-outbox-evidence

on:
  push:
    branches:
      - codex/grpc-healthcheck-source-2026-08-31
    paths:
      - '.github/workflows/temporary-fix-outbox-evidence.yml'

permissions:
  contents: write

concurrency:
  group: temporary-fix-outbox-evidence
  cancel-in-progress: false

jobs:
  patch-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_REPOSITORY: ${{ github.repository }}
      CANDIDATE_SHA: ${{ github.sha }}
      TARGET_BRANCH: codex/grpc-healthcheck-source-2026-08-31
      UPLOAD_ARTIFACT_PIN: 043fb460e6257d1ca154e89a5e86196c74e480f8
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Patch expected crash handling, artifact retention and policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          root = Path.cwd()
          pin = os.environ["UPLOAD_ARTIFACT_PIN"]
          exact_use = f"actions/upload-artifact@{pin}"

          script = root / "scripts/ci-outbox-final-attempt-reaper.sh"
          text = script.read_text(encoding="utf-8")
          old = '''  set +e
          "$worker_bin" run-once >"$scenario/worker-crash.stdout" 2>"$scenario/worker-crash.stderr"
          crash_status=$?
          set -e
          '''
          new = '''  # Commands used as an `if` condition are exempt from `errexit` and the
          # inherited ERR trap. Capture the intentional failpoint status without
          # suppressing fail-fast behavior for any surrounding command.
          if "$worker_bin" run-once >"$scenario/worker-crash.stdout" 2>"$scenario/worker-crash.stderr"; then
            crash_status=0
          else
            crash_status=$?
          fi
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one failpoint status block in {script}, found {text.count(old)}"
              )
          script.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = root / ".github/workflows/outbox-final-attempt-reaper.yml"
          text = workflow.read_text(encoding="utf-8")
          trigger_pair = (
              "      - 'scripts/upload-actions-artifact.py'\n"
              "      - 'tests/control_plane/test_actions_artifact_uploader.py'\n"
          )
          expanded_pair = (
              trigger_pair
              + "      - 'scripts/check-workflow-action-policy.py'\n"
              + "      - 'tests/control_plane/test_workflow_action_policy.py'\n"
          )
          if text.count(trigger_pair) != 2:
              raise SystemExit(
                  "expected uploader trigger pair in pull_request and push path filters"
              )
          text = text.replace(trigger_pair, expanded_pair)

          old_contract = (
              "          grep -q 'possible_lost_effect_declared' scripts/ci-outbox-final-attempt-reaper.sh\n"
              "          python3 -m py_compile scripts/upload-actions-artifact.py\n"
              "          python3 -m unittest tests.control_plane.test_actions_artifact_uploader -v\n"
          )
          new_contract = (
              "          grep -q 'possible_lost_effect_declared' scripts/ci-outbox-final-attempt-reaper.sh\n"
              "          grep -Fq 'if \"$worker_bin\" run-once >\"$scenario/worker-crash.stdout\"' scripts/ci-outbox-final-attempt-reaper.sh\n"
              f"          grep -Fq '{exact_use}' .github/workflows/outbox-final-attempt-reaper.yml\n"
              "          python3 -m py_compile scripts/upload-actions-artifact.py\n"
              "          python3 -m unittest \\\n"
              "            tests.control_plane.test_actions_artifact_uploader \\\n"
              "            tests.control_plane.test_workflow_action_policy -v\n"
          )
          if text.count(old_contract) != 1:
              raise SystemExit("outbox source-contract block changed unexpectedly")
          text = text.replace(old_contract, new_contract, 1)

          marker = "      - name: Seal and retain raw diagnostic archive\n"
          if text.count(marker) != 1:
              raise SystemExit("outbox archive step marker changed unexpectedly")
          prefix, _, _ = text.partition(marker)
          replacement = f'''      - name: Prepare raw diagnostic archive
            if: always()
            id: archive
            shell: bash
            env:
              PROFILE: ${{{{ matrix.profile }}}}
            run: |
              set -euo pipefail
              root="run/outbox-final-attempt-reaper/${{PROFILE}}"
              mkdir -p "$root"
              archive="run/outbox-final-attempt-reaper-${{PROFILE}}-${{CANDIDATE_SHA}}.tar.gz"
              tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \\
                -czf "$archive" -C "$root" .
              archive_sha=$(sha256sum "$archive" | awk '{{print $1}}')
              artifact_name="outbox-final-attempt-reaper-${{PROFILE}}-${{CANDIDATE_SHA}}-${{GITHUB_RUN_ID}}-${{GITHUB_RUN_ATTEMPT}}"
              printf 'archive_sha256=%s\\n' "$archive_sha"
              find "$root" -type f -print0 | sort -z | xargs -0 -r sha256sum
              {{
                printf 'archive_path=%s\\n' "$archive"
                printf 'archive_sha256=%s\\n' "$archive_sha"
                printf 'artifact_name=%s\\n' "$artifact_name"
              }} >> "$GITHUB_OUTPUT"
              {{
                printf '### Outbox final-attempt boundaries %s\\n\\n' "$PROFILE"
                printf -- '- candidate: `%s@%s`\\n' "$CANDIDATE_REPOSITORY" "$CANDIDATE_SHA"
                printf -- '- run: `%s`\\n' "$GITHUB_RUN_ID"
                printf -- '- raw archive SHA-256: `%s`\\n' "$archive_sha"
                printf -- '- crash before publish may lose the external effect: `true`\\n'
                printf -- '- compatibility credit: `false`\\n'
                printf -- '- production ready: `false`\\n'
              }} >> "$GITHUB_STEP_SUMMARY"

          - name: Retain raw diagnostic archive
            if: always() && steps.archive.outcome == 'success'
            id: retain
            uses: {exact_use}
            with:
              name: ${{{{ steps.archive.outputs.artifact_name }}}}
              path: ${{{{ steps.archive.outputs.archive_path }}}}
              if-no-files-found: error
              compression-level: 0
              retention-days: 30
              overwrite: false
              include-hidden-files: false

          - name: Record retained artifact identity
            if: always() && steps.archive.outcome == 'success' && steps.retain.outcome == 'success'
            shell: bash
            env:
              PROFILE: ${{{{ matrix.profile }}}}
              RAW_ARCHIVE_SHA256: ${{{{ steps.archive.outputs.archive_sha256 }}}}
              ARTIFACT_ID: ${{{{ steps.retain.outputs.artifact-id }}}}
              ARTIFACT_URL: ${{{{ steps.retain.outputs.artifact-url }}}}
              ARTIFACT_DIGEST: ${{{{ steps.retain.outputs.artifact-digest }}}}
            run: |
              set -euo pipefail
              [[ "$RAW_ARCHIVE_SHA256" =~ ^[0-9a-f]{{64}}$ ]]
              [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
              test -n "$ARTIFACT_URL"
              test -n "$ARTIFACT_DIGEST"
              {{
                printf -- '- retained artifact ID: `%s`\\n' "$ARTIFACT_ID"
                printf -- '- retained artifact URL: `%s`\\n' "$ARTIFACT_URL"
                printf -- '- service artifact digest: `%s`\\n' "$ARTIFACT_DIGEST"
                printf -- '- raw archive digest remains separately bound: `%s`\\n' "$RAW_ARCHIVE_SHA256"
              }} >> "$GITHUB_STEP_SUMMARY"
          '''
          workflow.write_text(prefix + replacement, encoding="utf-8")

          policy = root / "scripts/check-workflow-action-policy.py"
          policy.write_text(
              f'''#!/usr/bin/env python3
          """Enforce repository-local or exact allowlisted immutable workflow actions."""
          from __future__ import annotations

          import re
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          WORKFLOW_ROOT = ROOT / ".github/workflows"
          USES = re.compile(r"^\\s*-?\\s*uses\\s*:\\s*(?P<value>\\S.*)$")
          WRITE_PERMISSION = re.compile(r"^\\s*(?P<scope>[a-zA-Z0-9_-]+)\\s*:\\s*write\\s*(?:#.*)?$")
          SHA40 = re.compile(r"^[0-9a-f]{{40}}$")
          MOVABLE_CANDIDATE_FETCH = 'refs/heads/${{CANDIDATE_REF}}'
          IMMUTABLE_CANDIDATE_FETCH = '\"${{CANDIDATE_SHA}}\"'

          # External actions remain denied by default. This exact allowlist is
          # restricted to a GitHub first-party action at one immutable commit.
          # A tag, branch, near-miss SHA or another action remains forbidden.
          ALLOWED_LOCAL_USES_PREFIXES = ("./",)
          ALLOWED_EXTERNAL_USES = frozenset(
              {{"{exact_use}"}}
          )
          ALLOWED_WRITE_WORKFLOWS: set[str] = set()


          def allowed_use(value: str) -> bool:
              return value.startswith(ALLOWED_LOCAL_USES_PREFIXES) or value in ALLOWED_EXTERNAL_USES


          def main() -> int:
              failures: list[str] = []
              files = sorted(WORKFLOW_ROOT.glob("*.yml")) + sorted(WORKFLOW_ROOT.glob("*.yaml"))
              if not files:
                  print("workflow action policy failed: no workflow files", file=sys.stderr)
                  return 1

              for value in sorted(ALLOWED_EXTERNAL_USES):
                  if "@" not in value:
                      failures.append(f"allowlisted action is missing immutable ref: {{value}}")
                      continue
                  owner_repo, reference = value.rsplit("@", 1)
                  if not owner_repo.startswith("actions/") or not SHA40.fullmatch(reference):
                      failures.append(f"allowlisted action is not a GitHub first-party 40-hex pin: {{value}}")

              immutable_fetch_workflows = 0
              external_use_count = 0
              for path in files:
                  relative = path.relative_to(ROOT).as_posix()
                  text = path.read_text(encoding="utf-8")
                  if "\\r" in text or not text.endswith("\\n"):
                      failures.append(f"{{relative}}: workflow must be LF with trailing newline")
                  for number, line in enumerate(text.splitlines(), 1):
                      match = USES.match(line)
                      if match:
                          value = match.group("value").strip("'\\\"")
                          if value in ALLOWED_EXTERNAL_USES:
                              external_use_count += 1
                          elif not value.startswith(ALLOWED_LOCAL_USES_PREFIXES):
                              failures.append(
                                  f"{{relative}}:{{number}}: unapproved external action/reusable workflow is forbidden: {{value}}"
                              )
                      permission = WRITE_PERMISSION.match(line)
                      if permission and relative not in ALLOWED_WRITE_WORKFLOWS:
                          failures.append(
                              f"{{relative}}:{{number}}: write permission is forbidden: {{permission.group('scope')}}"
                          )
                  if "pull_request_target:" in text:
                      failures.append(f"{{relative}}: pull_request_target is forbidden")
                  if "persist-credentials: true" in text:
                      failures.append(f"{{relative}}: persistent checkout credentials are forbidden")
                  if MOVABLE_CANDIDATE_FETCH in text:
                      failures.append(
                          f"{{relative}}: movable branch fetch is forbidden; fetch CANDIDATE_SHA directly"
                      )

                  has_candidate_fetch = (
                      "CANDIDATE_SHA:" in text
                      and "git -C \\\"$GITHUB_WORKSPACE\\\" fetch" in text
                  )
                  if has_candidate_fetch:
                      immutable_fetch_workflows += 1
                      if IMMUTABLE_CANDIDATE_FETCH not in text:
                          failures.append(
                              f"{{relative}}: exact candidate fetch does not contain {{IMMUTABLE_CANDIDATE_FETCH}}"
                          )
                      if 'rev-parse HEAD)\\\" = \\\"$CANDIDATE_SHA\\\"' not in text:
                          failures.append(f"{{relative}}: checked-out SHA is not asserted")

              if failures:
                  print("workflow action policy failed:", file=sys.stderr)
                  for failure in failures:
                      print(f"- {{failure}}", file=sys.stderr)
                  return 1

              print(
                  "workflow action policy: OK "
                  f"({{len(files)}} workflows; {{immutable_fetch_workflows}} immutable candidate fetchers; "
                  f"{{external_use_count}} exact first-party action use; no unapproved external actions, "
                  "movable candidate fetches or write permissions)"
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''.replace("          ", ""),
              encoding="utf-8",
          )

          test = root / "tests/control_plane/test_workflow_action_policy.py"
          test.write_text(
              f'''from __future__ import annotations

          import contextlib
          import importlib.util
          import io
          import re
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          SCRIPT = ROOT / "scripts/check-workflow-action-policy.py"
          EXACT_USE = "{exact_use}"


          class WorkflowActionPolicyTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  spec = importlib.util.spec_from_file_location("check_workflow_action_policy", SCRIPT)
                  assert spec is not None and spec.loader is not None
                  cls.module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(cls.module)

              def test_local_and_exact_first_party_action_are_allowed(self) -> None:
                  self.assertTrue(self.module.allowed_use("./.github/actions/local"))
                  self.assertTrue(self.module.allowed_use(EXACT_USE))

              def test_mutable_near_miss_and_other_external_actions_are_rejected(self) -> None:
                  self.assertFalse(self.module.allowed_use("actions/upload-artifact@v7"))
                  self.assertFalse(self.module.allowed_use(EXACT_USE[:-1] + "0"))
                  self.assertFalse(
                      self.module.allowed_use(
                          "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
                      )
                  )
                  self.assertFalse(
                      self.module.allowed_use(
                          "third-party/example@043fb460e6257d1ca154e89a5e86196c74e480f8"
                      )
                  )

              def test_external_allowlist_is_exact_first_party_immutable_sha(self) -> None:
                  for value in self.module.ALLOWED_EXTERNAL_USES:
                      owner_repo, reference = value.rsplit("@", 1)
                      self.assertTrue(owner_repo.startswith("actions/"))
                      self.assertIsNotNone(re.fullmatch(r"[0-9a-f]{{40}}", reference))

              def test_repository_policy_passes(self) -> None:
                  stdout = io.StringIO()
                  stderr = io.StringIO()
                  with contextlib.redirect_stdout(stdout), contextlib.redirect_stderr(stderr):
                      status = self.module.main()
                  self.assertEqual(status, 0, stderr.getvalue())
                  self.assertIn("workflow action policy: OK", stdout.getvalue())
                  self.assertEqual(stderr.getvalue(), "")


          if __name__ == "__main__":
              unittest.main()
          '''.replace("          ", ""),
              encoding="utf-8",
          )

          doc = root / "docs/development/OUTBOX_FINAL_ATTEMPT_REAPER.md"
          text = doc.read_text(encoding="utf-8")
          old = '''The deterministic raw archive is retained through the native Actions Results
          artifact service and finalized with its SHA-256 digest. Logs or summaries
          without that retained archive receive no evidence credit.
          '''
          new = f'''The deterministic raw `.tar.gz` archive is hashed before upload and retained by
          GitHub's first-party `actions/upload-artifact` action pinned to immutable commit
          `{pin}`. The summary binds the raw archive SHA-256 separately from the service
          artifact ID, URL and digest. Logs or summaries without the retained archive and
          those identities receive no evidence credit.
          '''
          if text.count(old) != 1:
              raise SystemExit("outbox evidence retention paragraph changed unexpectedly")
          doc.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/temporary-fix-outbox-evidence.yml

      - name: Validate final clean source transaction
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci-outbox-final-attempt-reaper.sh
          python3 -m compileall -q scripts tests
          python3 -m unittest \
            tests.control_plane.test_workflow_action_policy \
            tests.control_plane.test_workflow_pin_audit \
            tests.control_plane.test_actions_artifact_uploader -v
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/audit-workflow-pins.py --fail-on-mutable
          python3 scripts/check-repository-hygiene.py
          git diff --check
          test ! -e .github/workflows/temporary-fix-outbox-evidence.yml
          grep -Fq 'if "$worker_bin" run-once >"$scenario/worker-crash.stdout"' \
            scripts/ci-outbox-final-attempt-reaper.sh
          grep -Fq "actions/upload-artifact@${UPLOAD_ARTIFACT_PIN}" \
            .github/workflows/outbox-final-attempt-reaper.yml

      - name: Commit exact validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --short)"
          git commit -m 'fix(outbox): retain final-attempt evidence fail closed'
          git push origin "HEAD:${TARGET_BRANCH}"
