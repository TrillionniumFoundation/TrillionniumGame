name: temporary-repair-outbox-bigint

on:
  push:
    branches:
      - codex/outbox-spool-worker-2026-08-31

permissions:
  contents: write

concurrency:
  group: temporary-repair-outbox-bigint
  cancel-in-progress: false

jobs:
  repair-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Align outbox attempt values with BIGINT schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, expected: int = 1) -> None:
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f'{path}: expected {expected} anchors, found {count} for {old!r}'
                  )
              path.write_text(source.replace(old, new, expected), encoding='utf-8')

          outbox = Path('crates/trnm-persistence-pg/src/outbox.rs')
          replace_exact(
              outbox,
              'const MAX_CLAIM_BATCH: usize = 64;\n',
              'const MAX_CLAIM_BATCH: usize = 64;\nconst MAX_OUTBOX_ATTEMPTS: u32 = 32;\n',
          )
          replace_exact(
              outbox,
              '        let max_attempts_i32 =\n            i32::try_from(max_attempts).map_err(|_| counter_overflow())?;\n',
              '        let max_attempts_i64 = i64::from(max_attempts);\n',
              expected=2,
          )
          replace_exact(outbox, '&[&now_ms_i64, &max_attempts_i32],', '&[&now_ms_i64, &max_attempts_i64],')
          replace_exact(
              outbox,
              '            let prior_attempt_i32: i32 = row.get(5);\n            let prior_attempt = u32::try_from(prior_attempt_i32)\n',
              '            let prior_attempt_i64: i64 = row.get(5);\n            let prior_attempt = u32::try_from(prior_attempt_i64)\n',
          )
          replace_exact(
              outbox,
              '            let attempt_i32 =\n                i32::try_from(attempt).map_err(|_| counter_overflow())?;\n',
              '            let attempt_i64 = i64::from(attempt);\n',
          )
          replace_exact(outbox, '                        &attempt_i32,\n', '                        &attempt_i64,\n')
          replace_exact(outbox, '        let outcome = if attempt >= max_attempts_i32 {\n', '        let outcome = if attempt >= max_attempts_i64 {\n')
          replace_exact(
              outbox,
              ") -> Result<i32, DomainError> {\n",
              ") -> Result<i64, DomainError> {\n",
          )
          replace_exact(outbox, '    let attempt: i32 = row.get(0);\n', '    let attempt: i64 = row.get(0);\n')
          replace_exact(
              outbox,
              '        || max_attempts == 0\n        || limit == 0\n',
              '        || max_attempts == 0\n        || max_attempts > MAX_OUTBOX_ATTEMPTS\n        || limit == 0\n',
          )
          replace_exact(
              outbox,
              '        if max_attempts == 0\n            || lease.attempt == 0\n',
              '        if max_attempts == 0\n            || max_attempts > MAX_OUTBOX_ATTEMPTS\n            || lease.attempt == 0\n',
          )
          test_anchor = '''        assert_eq!(
                      validate_claim(NodeId::new([1; 16]), 1, 1, MAX_CLAIM_BATCH + 1)
                          .unwrap_err()
                          .reason(),
                      "invalid_outbox_claim"
                  );
          '''
          test_replacement = test_anchor + '''        assert_eq!(
                      validate_claim(
                          NodeId::new([1; 16]),
                          1,
                          MAX_OUTBOX_ATTEMPTS + 1,
                          1,
                      )
                      .unwrap_err()
                      .reason(),
                      "invalid_outbox_claim"
                  );
          '''
          replace_exact(outbox, test_anchor, test_replacement)

          worker = Path('crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs')
          replace_exact(
              worker,
              '            1,\n            100,\n            "max_attempts_invalid",\n',
              '            1,\n            32,\n            "max_attempts_invalid",\n',
          )
          config_anchor = '''        let mut values = base_config(&directory);
                  values.insert("TRNM_OUTBOX_NODE_ID_HEX".to_owned(), "00".repeat(16));
                  assert!(matches!(
                      load(&values),
                      Err(WorkerError::Configuration("node_id_invalid"))
                  ));
          '''
          config_replacement = config_anchor + '''
                  let mut values = base_config(&directory);
                  values.insert("TRNM_OUTBOX_MAX_ATTEMPTS".to_owned(), "33".to_owned());
                  assert!(matches!(
                      load(&values),
                      Err(WorkerError::Configuration("max_attempts_invalid"))
                  ));
          '''
          replace_exact(worker, config_anchor, config_replacement)

          for path in (
              Path('.github/workflows/temporary-diagnose-outbox-pool.yml'),
          ):
              if not path.is_file():
                  raise SystemExit(f'missing temporary workflow: {path}')
              path.unlink()
          PY
          git diff --check

      - name: Validate complete source corpus
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-rust-package-inventory.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Execute PostgreSQL outbox fault matrix
        shell: bash
        run: |
          set -euo pipefail
          TRNM_POSTGRES_IMAGE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('config/database-test-images.json').read_text())
          print(value['profiles']['postgresql']['image'])
          PY
          )
          export TRNM_POSTGRES_IMAGE
          export TRNM_EVIDENCE_ROOT=/tmp/outbox-evidence
          export TRNM_RUN_ID="repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-postgresql"
          bash scripts/ci-outbox-spool-worker.sh postgresql

      - name: Execute CockroachDB outbox fault matrix
        shell: bash
        run: |
          set -euo pipefail
          TRNM_COCKROACH_IMAGE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('config/database-test-images.json').read_text())
          print(value['profiles']['cockroachdb']['image'])
          PY
          )
          export TRNM_COCKROACH_IMAGE
          export TRNM_EVIDENCE_ROOT=/tmp/outbox-evidence
          export TRNM_RUN_ID="repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-cockroachdb"
          bash scripts/ci-outbox-spool-worker.sh cockroachdb

      - name: Commit only fully verified repair
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-diagnose-outbox-pool.yml
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*outbox*' -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(outbox): align attempt counters with bigint schema"
          git push origin "HEAD:${GITHUB_REF_NAME}"
