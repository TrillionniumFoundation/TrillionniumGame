name: temporary-diagnose-outbox-claim

on:
  push:
    branches:
      - codex/outbox-spool-worker-2026-08-31

permissions:
  contents: read

concurrency:
  group: temporary-diagnose-outbox-claim
  cancel-in-progress: true

jobs:
  diagnose-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact branch without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Instrument outbox claim stages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs')
          source = worker.read_text(encoding='utf-8')
          old = '''                "domain_failure(code={},retry={:?})",
                          error.code().as_str(),
                          error.retry(),
          '''
          new = '''                "domain_failure(code={},reason={},retry={:?})",
                          error.code().as_str(),
                          error.reason(),
                          error.retry(),
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one worker diagnostic anchor, found {source.count(old)}')
          worker.write_text(source.replace(old, new, 1), encoding='utf-8')

          outbox = Path('crates/trnm-persistence-pg/src/outbox.rs')
          source = outbox.read_text(encoding='utf-8')
          start = source.index('    pub fn claim_outbox(')
          end = source.index('\n    pub fn complete_outbox(', start)
          block = source[start:end]

          transaction_old = '''        let mut transaction = self
                      .client
                      .build_transaction()
                      .isolation_level(postgres::IsolationLevel::Serializable)
                      .start()
                      .map_err(map_postgres_error)?;
          '''
          transaction_new = '''        eprintln!("diagnostic_claim_stage=transaction_start");
                  let mut transaction = self
                      .client
                      .build_transaction()
                      .isolation_level(postgres::IsolationLevel::Serializable)
                      .start()
                      .map_err(|error| {
                          eprintln!("diagnostic_claim_stage=transaction_error error={error}");
                          map_postgres_error(error)
                      })?;
                  eprintln!("diagnostic_claim_stage=transaction_ok");
          '''
          if block.count(transaction_old) != 1:
              raise SystemExit(
                  f'expected one claim transaction anchor, found {block.count(transaction_old)}'
              )
          block = block.replace(transaction_old, transaction_new, 1)

          query_old = '''                .map_err(map_postgres_error)?
                      else {
          '''
          query_new = '''                .map_err(|error| {
                              eprintln!("diagnostic_claim_stage=query_error error={error}");
                              map_postgres_error(error)
                          })?
                      else {
          '''
          if block.count(query_old) != 1:
              raise SystemExit(f'expected one claim query anchor, found {block.count(query_old)}')
          block = block.replace(query_old, query_new, 1)

          row_anchor = '''            let intent_id = decode_id16::<IntentId>(
          '''
          if block.count(row_anchor) != 1:
              raise SystemExit(f'expected one row anchor, found {block.count(row_anchor)}')
          block = block.replace(
              row_anchor,
              '            eprintln!("diagnostic_claim_stage=row_received");\n' + row_anchor,
              1,
          )

          update_old = '''                .map_err(map_postgres_error)?;
                      if updated != 1 {
          '''
          update_new = '''                .map_err(|error| {
                              eprintln!("diagnostic_claim_stage=update_error error={error}");
                              map_postgres_error(error)
                          })?;
                      eprintln!("diagnostic_claim_stage=update_ok");
                      if updated != 1 {
          '''
          if block.count(update_old) != 1:
              raise SystemExit(f'expected one claim update anchor, found {block.count(update_old)}')
          block = block.replace(update_old, update_new, 1)

          commit_old = '        transaction.commit().map_err(map_postgres_error)?;\n'
          commit_new = '''        transaction.commit().map_err(|error| {
                      eprintln!("diagnostic_claim_stage=commit_error error={error}");
                      map_postgres_error(error)
                  })?;
                  eprintln!("diagnostic_claim_stage=commit_ok");
          '''
          if block.count(commit_old) != 1:
              raise SystemExit(f'expected one claim commit anchor, found {block.count(commit_old)}')
          block = block.replace(commit_old, commit_new, 1)
          outbox.write_text(source[:start] + block + source[end:], encoding='utf-8')
          PY
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - name: Load immutable PostgreSQL image
        shell: bash
        run: |
          set -euo pipefail
          TRNM_POSTGRES_IMAGE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('config/database-test-images.json').read_text())
          print(value['profiles']['postgresql']['image'])
          PY
          )
          echo "TRNM_POSTGRES_IMAGE=$TRNM_POSTGRES_IMAGE" >>"$GITHUB_ENV"
      - name: Reproduce exact outbox claim failure
        env:
          TRNM_EVIDENCE_ROOT: run/outbox-claim-diagnostic
          TRNM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: bash scripts/ci-outbox-spool-worker.sh postgresql
