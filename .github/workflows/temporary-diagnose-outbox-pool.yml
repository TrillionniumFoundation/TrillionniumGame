name: temporary-diagnose-outbox-pool

on:
  push:
    branches:
      - codex/outbox-spool-worker-2026-08-31

permissions:
  contents: read

concurrency:
  group: temporary-diagnose-outbox-pool-v3
  cancel-in-progress: true

jobs:
  diagnose-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch exact branch without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Instrument pooled connection health and session stages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('crates/trnm-persistence-pg/src/bin/trnm-outbox-worker.rs')
          source = worker.read_text(encoding='utf-8')
          old = '''                "domain_failure(code={},retry={:?})",
                          error.code().as_str(),
                          error.retry(),
          '''
          new = '''                "domain_failure(code={},reason={},retry={:?})",
                          error.code().as_str(),
                          error.reason(),
                          error.retry(),
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected one worker diagnostic anchor, found {source.count(old)}')
          worker.write_text(source.replace(old, new, 1), encoding='utf-8')

          pool = Path('crates/trnm-persistence-pg/src/pool.rs')
          source = pool.read_text(encoding='utf-8')
          start = source.index('fn configure_session(')
          end = source.index('\nfn duration_millis(', start)
          replacement = r'''fn configure_session(
              client: &mut Client,
              profile: DatabaseProfile,
              policy: PgPoolConfig,
          ) -> Result<(), DomainError> {
              eprintln!("diagnostic_pool_stage=health_query_start");
              client.simple_query("SELECT 1").map_err(|error| {
                  eprintln!("diagnostic_pool_stage=health_query_error error={error}");
                  operational_error("diagnostic_database_health_query_failed")
              })?;
              eprintln!("diagnostic_pool_stage=health_query_ok");

              client
                  .simple_query("SET application_name = 'trillionnium-game'")
                  .map_err(|error| {
                      eprintln!("diagnostic_pool_stage=application_name_error error={error}");
                      operational_error("diagnostic_database_application_name_failed")
                  })?;
              eprintln!("diagnostic_pool_stage=application_name_ok");

              let statement_timeout = duration_millis(policy.statement_timeout)?;
              client
                  .simple_query(&format!("SET statement_timeout = '{statement_timeout}ms'"))
                  .map_err(|error| {
                      eprintln!("diagnostic_pool_stage=statement_timeout_error error={error}");
                      operational_error("diagnostic_database_statement_timeout_failed")
                  })?;
              eprintln!("diagnostic_pool_stage=statement_timeout_ok");

              if profile == DatabaseProfile::PostgreSql {
                  let lock_timeout = duration_millis(policy.lock_timeout)?;
                  let idle_transaction_timeout = duration_millis(policy.idle_transaction_timeout)?;
                  client
                      .simple_query(&format!("SET lock_timeout = '{lock_timeout}ms'"))
                      .map_err(|error| {
                          eprintln!("diagnostic_pool_stage=lock_timeout_error error={error}");
                          operational_error("diagnostic_database_lock_timeout_failed")
                      })?;
                  eprintln!("diagnostic_pool_stage=lock_timeout_ok");
                  client
                      .simple_query(&format!(
                          "SET idle_in_transaction_session_timeout = '{idle_transaction_timeout}ms'"
                      ))
                      .map_err(|error| {
                          eprintln!("diagnostic_pool_stage=idle_transaction_timeout_error error={error}");
                          operational_error("diagnostic_database_idle_transaction_timeout_failed")
                      })?;
                  eprintln!("diagnostic_pool_stage=idle_transaction_timeout_ok");
              }
              Ok(())
          }
          '''
          pool.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PY
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - name: Load immutable PostgreSQL image
        shell: bash
        run: |
          set -euo pipefail
          TRNM_POSTGRES_IMAGE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('config/database-test-images.json').read_text())
          print(value['profiles']['postgresql']['image'])
          PY
          )
          echo "TRNM_POSTGRES_IMAGE=$TRNM_POSTGRES_IMAGE" >>"$GITHUB_ENV"
      - name: Reproduce exact pool failure with staged probes
        env:
          TRNM_EVIDENCE_ROOT: run/outbox-pool-diagnostic
          TRNM_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: bash scripts/ci-outbox-spool-worker.sh postgresql
