name: temporary-session-stage-sync

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-session-http-integration
  cancel-in-progress: false

jobs:
  synchronize-stage-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Extend stage transition contract and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-status-transitions.py')
          source = path.read_text(encoding='utf-8')
          old = '''    require(
                  document.get("stage") == "http-websocket-database-vertical-source-candidate",
                  "server status stage",
              )
          '''
          new = '''    require(
                  document.get("stage")
                  in {
                      "http-websocket-database-vertical-source-candidate",
                      "http-websocket-session-database-vertical-source-candidate",
                  },
                  "server status stage",
              )
          '''
          if source.count(old) != 1:
              raise SystemExit(
                  f'{path}: expected one server-stage contract, found {source.count(old)}'
              )
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/temporary-session-stage-sync.yml').unlink()
          PY
          git diff --check
          python3 scripts/check-status-transitions.py
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
      - name: Commit synchronized control plane
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-session-stage-sync.yml
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(status): allow session HTTP source-candidate stage"
          git push origin "HEAD:${GITHUB_REF_NAME}"
