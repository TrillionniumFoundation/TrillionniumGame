            docs/status/CURRENT_STATE.json
          git diff --cached --check
          git commit -m 'identity: add provider verification and repository service boundary'
          head_sha="$(git rev-parse HEAD)"
          head_tree="$(git rev-parse HEAD^{tree})"
          remote_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/${FEATURE_BRANCH}" --jq '.object.sha')"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force-with-lease="refs/heads/${FEATURE_BRANCH}:${remote_sha}" origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          pr_number="${PR_NUMBER:-}"
          if test -z "$pr_number"; then
            pr_number="$(gh pr list --repo "$REPOSITORY" --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          fi
          test -n "$pr_number"
          body=/tmp/identity-pr-body.md
          base_branch="$(gh pr view "$pr_number" --repo "$REPOSITORY" --json baseRefName --jq '.baseRefName')"
          cat > "$body" <<EOF
