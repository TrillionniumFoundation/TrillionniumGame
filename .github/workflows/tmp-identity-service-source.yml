          service_source_candidate=true
          issue_137_source_complete=false
          compatibility_credit=false
          accepted_evidence=false
          production_ready=false
          all_gaps_closed=false
          ```
          EOF
          gh pr edit "$pr_number" --repo "$REPOSITORY" --body-file "$body"
          gh issue comment 137 --repo "$REPOSITORY" --body \
