name: tmp-identity-service-source

on:
  push:
    branches:
      - ops/identity-service-source-20260909
    paths:
      - .github/workflows/tmp-identity-service-source.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: identity-service-source
  cancel-in-progress: false

jobs:
  build-source-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/TrillionniumGame
      FEATURE_BRANCH: feature/plan-v32-identity-core-20260909
    steps:
      - name: Resolve exact identity feature head
        shell: bash
        run: |
          set -euo pipefail
          feature_sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/${FEATURE_BRANCH}" --jq '.object.sha')"
          test -n "$feature_sha"
          echo "FEATURE_SHA=$feature_sha" >> "$GITHUB_ENV"
          pr_number="$(gh pr list --repo "$REPOSITORY" --head "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          echo "PR_NUMBER=$pr_number" >> "$GITHUB_ENV"
      - name: Fetch exact identity feature
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=2 origin "$FEATURE_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$FEATURE_SHA"
          test -f "$GITHUB_WORKSPACE/crates/trnm-identity-core/src/lib.rs"
      - name: Add typed identity service boundary
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p crates/trnm-identity-service/src crates/trnm-identity-service/testdata
          cat > crates/trnm-identity-service/Cargo.toml <<'TOML'
          [package]
          name = "trnm-identity-service"
          version.workspace = true
          edition.workspace = true
          rust-version.workspace = true
          license.workspace = true
          description = "Typed provider-verification and identity repository service boundary"
          publish.workspace = true

          [dependencies]
          trnm-identity-core = { path = "../trnm-identity-core" }

          [lints]
          workspace = true
          TOML
          cat > crates/trnm-identity-service/src/lib.rs <<'RS'
          //! Typed provider-verification and identity repository service boundary.
          //!
          //! Provider verification completes before any repository mutation. The repository
          //! owns the atomic authenticate-or-create decision and exact command receipt.

          use std::fmt;

          use trnm_identity_core::{
              AccountId, CommandId, CommandReceipt, DisplayName, Fingerprint, IdentityError,
              IdentityProvider, IdentityRegistry, ProviderIdentity, Username,
          };

          pub const MAX_PROVIDER_ASSERTION_BYTES: usize = 64 * 1024;
          pub const MAX_AUDIENCE_BYTES: usize = 256;
          pub const MAX_PROVIDER_VERIFICATION_BUDGET_MS: u64 = 30_000;

          #[derive(Clone, Debug, Eq, Hash, Ord, PartialEq, PartialOrd)]
          pub struct Audience(String);

          impl Audience {
              pub fn new(value: impl Into<String>) -> Result<Self, ServiceError> {
                  let value = value.into();
                  if value.is_empty()
                      || value.len() > MAX_AUDIENCE_BYTES
                      || value.trim() != value
                      || value.chars().any(char::is_control)
                  {
                      return Err(ServiceError::Input("audience_invalid"));
                  }
                  Ok(Self(value))
              }

              #[must_use]
              pub fn as_str(&self) -> &str {
                  &self.0
              }
          }

          #[derive(Eq, PartialEq)]
          pub struct ProviderAssertion {
              bytes: Vec<u8>,
          }

          impl ProviderAssertion {
              pub fn new(bytes: Vec<u8>) -> Result<Self, ServiceError> {
                  if bytes.is_empty() || bytes.len() > MAX_PROVIDER_ASSERTION_BYTES {
                      return Err(ServiceError::Input("provider_assertion_invalid"));
                  }
                  Ok(Self { bytes })
              }

              #[must_use]
              pub fn len(&self) -> usize {
                  self.bytes.len()
              }

              #[must_use]
              pub fn is_empty(&self) -> bool {
                  self.bytes.is_empty()
              }

              fn as_bytes(&self) -> &[u8] {
                  &self.bytes
              }
          }

          impl fmt::Debug for ProviderAssertion {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_struct("ProviderAssertion")
                      .field("bytes", &"<redacted>")
                      .field("length", &self.bytes.len())
                      .finish()
              }
          }

          impl Drop for ProviderAssertion {
              fn drop(&mut self) {
                  for byte in &mut self.bytes {
                      *byte = 0;
                  }
              }
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub enum ProviderFailureCode {
              InvalidAssertion,
              WrongAudience,
              Expired,
              Unavailable,
              DeadlineExceeded,
              Internal,
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct ProviderFailure {
              code: ProviderFailureCode,
              reason: &'static str,
          }

          impl ProviderFailure {
              #[must_use]
              pub const fn new(code: ProviderFailureCode, reason: &'static str) -> Self {
                  Self { code, reason }
              }

              #[must_use]
              pub const fn code(&self) -> ProviderFailureCode {
                  self.code
              }

              #[must_use]
              pub const fn reason(&self) -> &'static str {
                  self.reason
              }
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct VerifiedProviderIdentity {
              identity: ProviderIdentity,
              audience: Audience,
              issued_at_ms: u64,
              expires_at_ms: u64,
          }

          impl VerifiedProviderIdentity {
              pub fn new(
                  identity: ProviderIdentity,
                  audience: Audience,
                  issued_at_ms: u64,
                  expires_at_ms: u64,
              ) -> Result<Self, ProviderFailure> {
                  if issued_at_ms >= expires_at_ms {
                      return Err(ProviderFailure::new(
                          ProviderFailureCode::InvalidAssertion,
                          "provider_verification_window_invalid",
                      ));
                  }
                  Ok(Self {
                      identity,
                      audience,
                      issued_at_ms,
                      expires_at_ms,
                  })
              }

              #[must_use]
              pub fn identity(&self) -> &ProviderIdentity {
                  &self.identity
              }

              #[must_use]
              pub fn audience(&self) -> &Audience {
                  &self.audience
              }

              #[must_use]
              pub const fn issued_at_ms(&self) -> u64 {
                  self.issued_at_ms
              }

              #[must_use]
              pub const fn expires_at_ms(&self) -> u64 {
                  self.expires_at_ms
              }
          }

          pub struct ProviderVerificationRequest<'a> {
              provider: IdentityProvider,
              assertion: &'a [u8],
              audience: &'a Audience,
              now_ms: u64,
              deadline_ms: u64,
          }

          impl ProviderVerificationRequest<'_> {
              #[must_use]
              pub const fn provider(&self) -> IdentityProvider {
                  self.provider
              }

              #[must_use]
              pub fn assertion(&self) -> &[u8] {
                  self.assertion
              }

              #[must_use]
              pub const fn audience(&self) -> &Audience {
                  self.audience
              }

              #[must_use]
              pub const fn now_ms(&self) -> u64 {
                  self.now_ms
              }

              #[must_use]
              pub const fn deadline_ms(&self) -> u64 {
                  self.deadline_ms
              }
          }

          impl fmt::Debug for ProviderVerificationRequest<'_> {
              fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
                  formatter
                      .debug_struct("ProviderVerificationRequest")
                      .field("provider", &self.provider)
                      .field("assertion", &"<redacted>")
                      .field("assertion_length", &self.assertion.len())
                      .field("audience", &self.audience)
                      .field("now_ms", &self.now_ms)
                      .field("deadline_ms", &self.deadline_ms)
                      .finish()
              }
          }

          pub trait ProviderVerifier: fmt::Debug {
              fn verify(
                  &self,
                  request: &ProviderVerificationRequest<'_>,
              ) -> Result<VerifiedProviderIdentity, ProviderFailure>;
          }

          #[derive(Clone, Debug, Eq, PartialEq)]
          pub struct NewAccount {
              account: AccountId,
              username: Username,
              display_name: DisplayName,
          }

          impl NewAccount {
              #[must_use]
              pub const fn new(
                  account: AccountId,
                  username: Username,
                  display_name: DisplayName,
              ) -> Self {
                  Self {
                      account,
                      username,
                      display_name,
                  }
              }

              #[must_use]
              pub const fn account(&self) -> AccountId {
                  self.account
              }

              #[must_use]
              pub fn username(&self) -> &Username {
                  &self.username
              }

              #[must_use]
              pub fn display_name(&self) -> &DisplayName {
                  &self.display_name
              }
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub struct AuthenticationCommit {
              account: AccountId,
              receipt: CommandReceipt,
              created: bool,
          }

          impl AuthenticationCommit {
              #[must_use]
              pub const fn account(&self) -> AccountId {
                  self.account
              }

              #[must_use]
              pub const fn receipt(&self) -> CommandReceipt {
                  self.receipt
              }

              #[must_use]
              pub const fn created(&self) -> bool {
                  self.created
              }
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub enum RepositoryFailure {
              IdentityUnknown,
              Core(IdentityError),
          }

          impl From<IdentityError> for RepositoryFailure {
              fn from(value: IdentityError) -> Self {
                  Self::Core(value)
              }
          }

          pub trait IdentityRepository: fmt::Debug {
              fn authenticate_or_create(
                  &mut self,
                  command: CommandId,
                  fingerprint: Fingerprint,
                  identity: ProviderIdentity,
                  create: Option<NewAccount>,
              ) -> Result<AuthenticationCommit, RepositoryFailure>;

              fn link_verified_provider(
                  &mut self,
                  command: CommandId,
                  fingerprint: Fingerprint,
                  account: AccountId,
                  expected_revision: u64,
                  identity: ProviderIdentity,
              ) -> Result<CommandReceipt, RepositoryFailure>;

              fn unlink_verified_provider(
                  &mut self,
                  command: CommandId,
                  fingerprint: Fingerprint,
                  account: AccountId,
                  expected_revision: u64,
                  identity: &ProviderIdentity,
              ) -> Result<CommandReceipt, RepositoryFailure>;
          }

          impl IdentityRepository for IdentityRegistry {
              fn authenticate_or_create(
                  &mut self,
                  command: CommandId,
                  fingerprint: Fingerprint,
                  identity: ProviderIdentity,
                  create: Option<NewAccount>,
              ) -> Result<AuthenticationCommit, RepositoryFailure> {
                  if let Some(account) = self.owner_of(&identity) {
                      let receipt = self.authenticate(command, fingerprint, &identity)?;
                      return Ok(AuthenticationCommit {
                          account,
                          receipt,
                          created: false,
                      });
                  }
                  let create = create.ok_or(RepositoryFailure::IdentityUnknown)?;
                  let account = create.account;
                  let receipt = self.create_account(
                      command,
                      fingerprint,
                      account,
                      create.username,
                      create.display_name,
                      identity,
                  )?;
                  Ok(AuthenticationCommit {
                      account,
                      receipt,
                      created: true,
                  })
              }

              fn link_verified_provider(
                  &mut self,
                  command: CommandId,
                  fingerprint: Fingerprint,
                  account: AccountId,
                  expected_revision: u64,
                  identity: ProviderIdentity,
              ) -> Result<CommandReceipt, RepositoryFailure> {
                  self.link_provider(
                      command,
                      fingerprint,
                      account,
                      expected_revision,
                      identity,
                  )
                  .map_err(RepositoryFailure::from)
              }

              fn unlink_verified_provider(
                  &mut self,
                  command: CommandId,
                  fingerprint: Fingerprint,
                  account: AccountId,
                  expected_revision: u64,
                  identity: &ProviderIdentity,
              ) -> Result<CommandReceipt, RepositoryFailure> {
                  self.unlink_provider(
                      command,
                      fingerprint,
                      account,
                      expected_revision,
                      identity,
                  )
                  .map_err(RepositoryFailure::from)
              }
          }

          #[derive(Debug)]
          pub struct AuthenticateRequest {
              pub command: CommandId,
              pub fingerprint: Fingerprint,
              pub provider: IdentityProvider,
              pub assertion: ProviderAssertion,
              pub audience: Audience,
              pub now_ms: u64,
              pub deadline_ms: u64,
              pub create: Option<NewAccount>,
          }

          #[derive(Debug)]
          pub struct LinkProviderRequest {
              pub command: CommandId,
              pub fingerprint: Fingerprint,
              pub account: AccountId,
              pub expected_revision: u64,
              pub provider: IdentityProvider,
              pub assertion: ProviderAssertion,
              pub audience: Audience,
              pub now_ms: u64,
              pub deadline_ms: u64,
          }

          #[derive(Debug)]
          pub struct UnlinkProviderRequest {
              pub command: CommandId,
              pub fingerprint: Fingerprint,
              pub account: AccountId,
              pub expected_revision: u64,
              pub provider: IdentityProvider,
              pub assertion: ProviderAssertion,
              pub audience: Audience,
              pub now_ms: u64,
              pub deadline_ms: u64,
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub enum PublicServiceCode {
              InvalidArgument,
              Unauthenticated,
              PermissionDenied,
              Conflict,
              ResourceExhausted,
              DeadlineExceeded,
              Unavailable,
              Internal,
          }

          #[derive(Clone, Copy, Debug, Eq, PartialEq)]
          pub enum ServiceError {
              Input(&'static str),
              Provider(ProviderFailure),
              Repository(RepositoryFailure),
          }

          impl ServiceError {
              #[must_use]
              pub const fn public_code(&self) -> PublicServiceCode {
                  match self {
                      Self::Input(_) => PublicServiceCode::InvalidArgument,
                      Self::Provider(provider) => match provider.code {
                          ProviderFailureCode::InvalidAssertion
                          | ProviderFailureCode::WrongAudience
                          | ProviderFailureCode::Expired => PublicServiceCode::Unauthenticated,
                          ProviderFailureCode::Unavailable => PublicServiceCode::Unavailable,
                          ProviderFailureCode::DeadlineExceeded => {
                              PublicServiceCode::DeadlineExceeded
                          }
                          ProviderFailureCode::Internal => PublicServiceCode::Internal,
                      },
                      Self::Repository(RepositoryFailure::IdentityUnknown) => {
                          PublicServiceCode::Unauthenticated
                      }
                      Self::Repository(RepositoryFailure::Core(error)) => match error.code() {
                          trnm_identity_core::IdentityErrorCode::InvalidArgument => {
                              PublicServiceCode::InvalidArgument
                          }
                          trnm_identity_core::IdentityErrorCode::Unauthenticated
                          | trnm_identity_core::IdentityErrorCode::NotFound => {
                              PublicServiceCode::Unauthenticated
                          }
                          trnm_identity_core::IdentityErrorCode::AlreadyExists
                          | trnm_identity_core::IdentityErrorCode::Conflict
                          | trnm_identity_core::IdentityErrorCode::FailedPrecondition => {
                              PublicServiceCode::Conflict
                          }
                          trnm_identity_core::IdentityErrorCode::PermissionDenied => {
                              PublicServiceCode::PermissionDenied
                          }
                          trnm_identity_core::IdentityErrorCode::ResourceExhausted => {
                              PublicServiceCode::ResourceExhausted
                          }
                          trnm_identity_core::IdentityErrorCode::OutOfRange => {
                              PublicServiceCode::Internal
                          }
                      },
                  }
              }

              #[must_use]
              pub const fn reason(&self) -> &'static str {
                  match self {
                      Self::Input(reason) => reason,
                      Self::Provider(failure) => failure.reason,
                      Self::Repository(RepositoryFailure::IdentityUnknown) => "identity_unknown",
                      Self::Repository(RepositoryFailure::Core(error)) => error.reason(),
                  }
              }
          }

          impl From<RepositoryFailure> for ServiceError {
              fn from(value: RepositoryFailure) -> Self {
                  Self::Repository(value)
              }
          }

          #[derive(Debug)]
          pub struct IdentityService<R, V> {
              repository: R,
              verifier: V,
          }

          impl<R, V> IdentityService<R, V>
          where
              R: IdentityRepository,
              V: ProviderVerifier,
          {
              #[must_use]
              pub const fn new(repository: R, verifier: V) -> Self {
                  Self {
                      repository,
                      verifier,
                  }
              }

              #[must_use]
              pub const fn repository(&self) -> &R {
                  &self.repository
              }

              #[must_use]
              pub fn repository_mut(&mut self) -> &mut R {
                  &mut self.repository
              }

              pub fn authenticate(
                  &mut self,
                  request: AuthenticateRequest,
              ) -> Result<AuthenticationCommit, ServiceError> {
                  let identity = self.verify(
                      request.provider,
                      &request.assertion,
                      &request.audience,
                      request.now_ms,
                      request.deadline_ms,
                  )?;
                  self.repository
                      .authenticate_or_create(
                          request.command,
                          request.fingerprint,
                          identity,
                          request.create,
                      )
                      .map_err(ServiceError::from)
              }

              pub fn link_provider(
                  &mut self,
                  request: LinkProviderRequest,
              ) -> Result<CommandReceipt, ServiceError> {
                  let identity = self.verify(
                      request.provider,
                      &request.assertion,
                      &request.audience,
                      request.now_ms,
                      request.deadline_ms,
                  )?;
                  self.repository
                      .link_verified_provider(
                          request.command,
                          request.fingerprint,
                          request.account,
                          request.expected_revision,
                          identity,
                      )
                      .map_err(ServiceError::from)
              }

              pub fn unlink_provider(
                  &mut self,
                  request: UnlinkProviderRequest,
              ) -> Result<CommandReceipt, ServiceError> {
                  let identity = self.verify(
                      request.provider,
                      &request.assertion,
                      &request.audience,
                      request.now_ms,
                      request.deadline_ms,
                  )?;
                  self.repository
                      .unlink_verified_provider(
                          request.command,
                          request.fingerprint,
                          request.account,
                          request.expected_revision,
                          &identity,
                      )
                      .map_err(ServiceError::from)
              }

              fn verify(
                  &self,
                  provider: IdentityProvider,
                  assertion: &ProviderAssertion,
                  audience: &Audience,
                  now_ms: u64,
                  deadline_ms: u64,
              ) -> Result<ProviderIdentity, ServiceError> {
                  let budget = deadline_ms
                      .checked_sub(now_ms)
                      .ok_or(ServiceError::Input("provider_deadline_elapsed"))?;
                  if budget == 0 || budget > MAX_PROVIDER_VERIFICATION_BUDGET_MS {
                      return Err(ServiceError::Input("provider_deadline_invalid"));
                  }
                  let verification = self
                      .verifier
                      .verify(&ProviderVerificationRequest {
                          provider,
                          assertion: assertion.as_bytes(),
                          audience,
                          now_ms,
                          deadline_ms,
                      })
                      .map_err(ServiceError::Provider)?;
                  if verification.identity.provider() != provider {
                      return Err(ServiceError::Provider(ProviderFailure::new(
                          ProviderFailureCode::InvalidAssertion,
                          "provider_identity_class_mismatch",
                      )));
                  }
                  if verification.audience != *audience {
                      return Err(ServiceError::Provider(ProviderFailure::new(
                          ProviderFailureCode::WrongAudience,
                          "provider_audience_mismatch",
                      )));
                  }
                  if verification.issued_at_ms > now_ms || verification.expires_at_ms <= now_ms {
                      return Err(ServiceError::Provider(ProviderFailure::new(
                          ProviderFailureCode::Expired,
                          "provider_assertion_expired_or_not_yet_valid",
                      )));
                  }
                  Ok(verification.identity)
              }
          }

          #[cfg(test)]
          mod tests {
              use std::sync::atomic::{AtomicUsize, Ordering};
              use std::sync::Arc;

              use trnm_identity_core::{IdentityConfig, IdentityErrorCode};

              use super::*;

              fn bytes16(value: u8) -> [u8; 16] {
                  let mut bytes = [0; 16];
                  bytes[15] = value;
                  bytes
              }

              fn bytes32(value: u8) -> [u8; 32] {
                  let mut bytes = [0; 32];
                  bytes[31] = value;
                  bytes
              }

              fn account(value: u8) -> AccountId {
                  AccountId::new(bytes16(value)).unwrap()
              }

              fn command(value: u8) -> CommandId {
                  CommandId::new(bytes16(value)).unwrap()
              }

              fn fingerprint(value: u8) -> Fingerprint {
                  Fingerprint::new(bytes32(value)).unwrap()
              }

              fn audience() -> Audience {
                  Audience::new("game-client").unwrap()
              }

              fn assertion() -> ProviderAssertion {
                  ProviderAssertion::new(b"opaque-provider-token".to_vec()).unwrap()
              }

              fn identity(provider: IdentityProvider, value: &str) -> ProviderIdentity {
                  ProviderIdentity::new(provider, value).unwrap()
              }

              fn registry() -> IdentityRegistry {
                  IdentityRegistry::new(IdentityConfig::new(16, 8, 128).unwrap())
              }

              #[derive(Clone, Debug)]
              struct FixedVerifier {
                  calls: Arc<AtomicUsize>,
                  outcome: Result<VerifiedProviderIdentity, ProviderFailure>,
              }

              impl ProviderVerifier for FixedVerifier {
                  fn verify(
                      &self,
                      request: &ProviderVerificationRequest<'_>,
                  ) -> Result<VerifiedProviderIdentity, ProviderFailure> {
                      assert!(!request.assertion().is_empty());
                      assert!(request.deadline_ms() > request.now_ms());
                      self.calls.fetch_add(1, Ordering::SeqCst);
                      self.outcome.clone()
                  }
              }

              fn verifier(
                  provider: IdentityProvider,
                  external_id: &str,
                  result_audience: Audience,
                  issued_at_ms: u64,
                  expires_at_ms: u64,
              ) -> (FixedVerifier, Arc<AtomicUsize>) {
                  let calls = Arc::new(AtomicUsize::new(0));
                  (
                      FixedVerifier {
                          calls: Arc::clone(&calls),
                          outcome: VerifiedProviderIdentity::new(
                              identity(provider, external_id),
                              result_audience,
                              issued_at_ms,
                              expires_at_ms,
                          ),
                      },
                      calls,
                  )
              }

              fn create_request(
                  command_value: u8,
                  fingerprint_value: u8,
                  provider: IdentityProvider,
                  create: Option<NewAccount>,
              ) -> AuthenticateRequest {
                  AuthenticateRequest {
                      command: command(command_value),
                      fingerprint: fingerprint(fingerprint_value),
                      provider,
                      assertion: assertion(),
                      audience: audience(),
                      now_ms: 1_000,
                      deadline_ms: 2_000,
                      create,
                  }
              }

              #[test]
              fn assertion_debug_is_redacted() {
                  let value = ProviderAssertion::new(b"secret-provider-token".to_vec()).unwrap();
                  let rendered = format!("{value:?}");
                  assert!(rendered.contains("<redacted>"));
                  assert!(!rendered.contains("secret-provider-token"));
              }

              #[test]
              fn authenticate_or_create_is_repository_atomic_and_replayable() {
                  let (verifier, calls) = verifier(
                      IdentityProvider::Device,
                      "device-1",
                      audience(),
                      900,
                      2_000,
                  );
                  let mut service = IdentityService::new(registry(), verifier);
                  let create = NewAccount::new(
                      account(1),
                      Username::new("alpha").unwrap(),
                      DisplayName::new("Alpha").unwrap(),
                  );
                  let first = service
                      .authenticate(create_request(
                          1,
                          1,
                          IdentityProvider::Device,
                          Some(create.clone()),
                      ))
                      .unwrap();
                  assert!(first.created());
                  assert_eq!(first.account(), account(1));
                  let snapshot = service.repository().clone();
                  let replay = service
                      .authenticate(create_request(
                          1,
                          1,
                          IdentityProvider::Device,
                          Some(create),
                      ))
                      .unwrap();
                  assert_eq!(first.receipt(), replay.receipt());
                  assert_eq!(&snapshot, service.repository());
                  assert_eq!(calls.load(Ordering::SeqCst), 2);
              }

              #[test]
              fn existing_identity_authenticates_without_create_fields() {
                  let (verifier, _) = verifier(
                      IdentityProvider::Google,
                      "google-1",
                      audience(),
                      900,
                      2_000,
                  );
                  let mut service = IdentityService::new(registry(), verifier);
                  service
                      .authenticate(create_request(
                          1,
                          1,
                          IdentityProvider::Google,
                          Some(NewAccount::new(
                              account(1),
                              Username::new("alpha").unwrap(),
                              DisplayName::new("Alpha").unwrap(),
                          )),
                      ))
                      .unwrap();
                  let result = service
                      .authenticate(create_request(2, 2, IdentityProvider::Google, None))
                      .unwrap();
                  assert!(!result.created());
                  assert_eq!(result.account(), account(1));
              }

              #[test]
              fn no_create_for_unknown_identity_fails_without_state_change() {
                  let (verifier, _) = verifier(
                      IdentityProvider::Steam,
                      "steam-1",
                      audience(),
                      900,
                      2_000,
                  );
                  let mut service = IdentityService::new(registry(), verifier);
                  let snapshot = service.repository().clone();
                  let error = service
                      .authenticate(create_request(1, 1, IdentityProvider::Steam, None))
                      .unwrap_err();
                  assert_eq!(error.public_code(), PublicServiceCode::Unauthenticated);
                  assert_eq!(snapshot, *service.repository());
              }

              #[test]
              fn wrong_audience_and_expiry_fail_before_repository_mutation() {
                  for (result_audience, issued, expires, reason) in [
                      (Audience::new("other-client").unwrap(), 900, 2_000, "provider_audience_mismatch"),
                      (audience(), 900, 1_000, "provider_assertion_expired_or_not_yet_valid"),
                      (audience(), 1_001, 2_000, "provider_assertion_expired_or_not_yet_valid"),
                  ] {
                      let (verifier, _) = verifier(
                          IdentityProvider::Apple,
                          "apple-1",
                          result_audience,
                          issued,
                          expires,
                      );
                      let mut service = IdentityService::new(registry(), verifier);
                      let snapshot = service.repository().clone();
                      let error = service
                          .authenticate(create_request(
                              1,
                              1,
                              IdentityProvider::Apple,
                              Some(NewAccount::new(
                                  account(1),
                                  Username::new("alpha").unwrap(),
                                  DisplayName::new("Alpha").unwrap(),
                              )),
                          ))
                          .unwrap_err();
                      assert_eq!(error.reason(), reason);
                      assert_eq!(snapshot, *service.repository());
                  }
              }

              #[test]
              fn provider_class_mismatch_fails_before_repository_mutation() {
                  let (verifier, _) = verifier(
                      IdentityProvider::Facebook,
                      "facebook-1",
                      audience(),
                      900,
                      2_000,
                  );
                  let mut service = IdentityService::new(registry(), verifier);
                  let snapshot = service.repository().clone();
                  let error = service
                      .authenticate(create_request(
                          1,
                          1,
                          IdentityProvider::FacebookInstantGame,
                          Some(NewAccount::new(
                              account(1),
                              Username::new("alpha").unwrap(),
                              DisplayName::new("Alpha").unwrap(),
                          )),
                      ))
                      .unwrap_err();
                  assert_eq!(error.reason(), "provider_identity_class_mismatch");
                  assert_eq!(snapshot, *service.repository());
              }

              #[test]
              fn invalid_deadline_does_not_call_verifier() {
                  let (verifier, calls) = verifier(
                      IdentityProvider::Email,
                      "email-1",
                      audience(),
                      900,
                      2_000,
                  );
                  let mut service = IdentityService::new(registry(), verifier);
                  let mut request = create_request(1, 1, IdentityProvider::Email, None);
                  request.deadline_ms = request.now_ms;
                  assert_eq!(
                      service.authenticate(request).unwrap_err().reason(),
                      "provider_deadline_invalid"
                  );
                  assert_eq!(calls.load(Ordering::SeqCst), 0);
              }

              #[test]
              fn verified_link_and_unlink_use_exact_revision() {
                  let (device_verifier, _) = verifier(
                      IdentityProvider::Device,
                      "device-1",
                      audience(),
                      900,
                      2_000,
                  );
                  let mut service = IdentityService::new(registry(), device_verifier);
                  service
                      .authenticate(create_request(
                          1,
                          1,
                          IdentityProvider::Device,
                          Some(NewAccount::new(
                              account(1),
                              Username::new("alpha").unwrap(),
                              DisplayName::new("Alpha").unwrap(),
                          )),
                      ))
                      .unwrap();
                  let (google_verifier, _) = verifier(
                      IdentityProvider::Google,
                      "google-1",
                      audience(),
                      900,
                      2_000,
                  );
                  let mut service = IdentityService::new(service.repository, google_verifier);
                  let link = service
                      .link_provider(LinkProviderRequest {
                          command: command(2),
                          fingerprint: fingerprint(2),
                          account: account(1),
                          expected_revision: 1,
                          provider: IdentityProvider::Google,
                          assertion: assertion(),
                          audience: audience(),
                          now_ms: 1_000,
                          deadline_ms: 2_000,
                      })
                      .unwrap();
                  assert_eq!(link.revision(), 2);
                  let unlink = service
                      .unlink_provider(UnlinkProviderRequest {
                          command: command(3),
                          fingerprint: fingerprint(3),
                          account: account(1),
                          expected_revision: 2,
                          provider: IdentityProvider::Google,
                          assertion: assertion(),
                          audience: audience(),
                          now_ms: 1_000,
                          deadline_ms: 2_000,
                      })
                      .unwrap();
                  assert_eq!(unlink.revision(), 3);
              }

              #[test]
              fn changed_command_fingerprint_is_preserved_as_conflict() {
                  let (verifier, _) = verifier(
                      IdentityProvider::Custom,
                      "custom-1",
                      audience(),
                      900,
                      2_000,
                  );
                  let mut service = IdentityService::new(registry(), verifier);
                  service
                      .authenticate(create_request(
                          1,
                          1,
                          IdentityProvider::Custom,
                          Some(NewAccount::new(
                              account(1),
                              Username::new("alpha").unwrap(),
                              DisplayName::new("Alpha").unwrap(),
                          )),
                      ))
                      .unwrap();
                  let snapshot = service.repository().clone();
                  let error = service
                      .authenticate(create_request(1, 9, IdentityProvider::Custom, None))
                      .unwrap_err();
                  assert_eq!(error.public_code(), PublicServiceCode::Conflict);
                  assert!(matches!(
                      error,
                      ServiceError::Repository(RepositoryFailure::Core(core))
                          if core.code() == IdentityErrorCode::Conflict
                  ));
                  assert_eq!(snapshot, *service.repository());
              }
          }
