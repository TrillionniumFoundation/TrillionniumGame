          cat > crates/trnm-identity-service/README.md <<'MD'
          # trnm-identity-service

          Status: **module documentation; provider-verification-and-repository-service-source-candidate; no automatic compatibility or production credit**  
          Path: `crates/trnm-identity-service`  
          Workspace class: `root`  
          Lifecycle: `product-service-library`  
          Owner role: `identity-security`

          ## Status and authority

          This module is the typed application-service boundary between provider verification and atomic identity persistence for Plan v3.2 issue #137. It is a source candidate, not a public Nakama endpoint, real provider implementation, durable database repository, session issuer or production authentication authority.

          ## Responsibilities

          It owns bounded audience and opaque assertion input, a redacted provider verification request, verified provider identity checks, one atomic `authenticate_or_create` repository operation, and verified link/unlink orchestration.

          Provider verification completes before any repository mutation. The verified provider class, audience and validity window must match the requested operation. The repository owns the race-free lookup/create decision and exact command receipt.

          Non-goals include provider HTTP calls, JWT/session issuance, password hashing, account export, public wire mapping, database schema, retries, caches and operator workflows.

          ## Architecture and dependencies

          The dependency direction is:

          ```text
          transport adapter
            -> trnm-identity-service
                 -> ProviderVerifier
                 -> IdentityRepository
                      -> trnm-identity-core semantics
          ```

          Provider I/O must finish before the repository mutation begins. A durable adapter implements `authenticate_or_create` as one serializable or equivalently fenced transaction; a separate read followed by insert is not conforming.

          ## Public contracts

          Provider assertions are non-empty and at most 64 KiB. Audiences are canonical and at most 256 bytes. Provider verification deadlines are positive and at most 30 seconds from the supplied monotonic/application clock boundary.

          The verifier returns a typed provider identity, exact audience and half-open validity window. A wrong provider class, wrong audience, not-yet-valid or expired result is rejected before persistence.

          `authenticate_or_create` replays an exact command receipt, rejects a changed fingerprint and either authenticates an existing identity or creates one account atomically when create parameters are present.

          ## Correctness and failure model

          Input/deadline validation occurs before the verifier. Verification occurs before mutation. Repository errors retain stable classifications. Exact replay remains an identity-repository property rather than a transport retry guess.

          A verifier failure, mismatched verified result, unknown no-create identity, stale revision or collision leaves repository state unchanged. The source adapter for `IdentityRegistry` is an in-memory reference implementation, not distributed durability proof.

          Provider success followed by unavailable persistence is safe because no identity mutation preceded the provider check. Session issuance after identity commit needs its own idempotent operation and response-loss reconciliation; this module intentionally does not hide that remaining boundary.

          ## Security and privacy

          Assertion bytes are redacted from `Debug` and overwritten on drop as a best-effort memory hygiene measure; this is not claimed as compiler-proof secure erasure. No raw provider token is returned, logged or stored by the service API.

          Real verifiers must bind provider, application/audience, issuer, nonce/replay state, timestamps and endpoint identity under a deadline. Provider credentials and token contents must not enter errors, metric labels or retained evidence.

          ## Build and test

          ```bash
          cargo fmt --all -- --check
          cargo test --package trnm-identity-service --all-targets --locked
          cargo clippy --package trnm-identity-service --all-targets --locked -- -D warnings
          ```

          Tests cover redaction, atomic create/auth replay, no-create behavior, wrong audience, expiry/not-yet-valid, provider-class mismatch, deadline rejection, verified link/unlink and changed-fingerprint conflict.

          Unit fixtures are deterministic source tests, not evidence of any real provider, database, SDK or deployed server.

          ## Operations

          The module starts no tasks. Adapters own provider deadlines, retries, circuit breakers, repository acquisition/transaction timeouts, cancellation, metrics and readiness.

          Low-cardinality signals include provider class, stable result category, deadline/circuit state, repository outcome, created/existing result and receipt replay. Assertions, external IDs, account IDs and credentials are not labels.

          ## Compatibility and evidence

          Complete compatibility requires provider-specific fixtures and sandbox tests, exact HTTP/gRPC status and mapping, Nakama oracle/official-client differential, PostgreSQL transaction/response-loss evidence, session issuance/revocation integration and independent identity/security review.

          A fixed verifier or in-memory repository proves only interface order and deterministic source behavior. It grants no provider-authenticity, durability or compatibility credit.

          ## Known gaps and exit criteria

          Real custom/device/email/social provider verifiers, password policy, public API adapters, durable repository, account fields/export, session issuance, refresh/revoke/socket fanout, migration and independent acceptance remain open under issue #137.

          Exit requires every relevant denominator leaf, exact source and prospective-merge execution, retained provider/database/wire evidence and conflict-free specialist review. This module closes no product gate by itself.
          MD
