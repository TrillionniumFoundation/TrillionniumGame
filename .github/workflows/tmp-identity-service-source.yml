              anchor = '  "crates/trnm-identity-core",\n'
              if anchor not in text:
                  raise SystemExit('identity core is not registered in the root workspace')
              cargo.write_text(text.replace(anchor, anchor + member, 1), encoding='utf-8')

          def save(path: str, value: object) -> None:
              (root / path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          module_path = 'docs/status/MODULE_DOCUMENTATION.json'
