name: v3-source-and-scope-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-source-and-scope-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  structured-control:
    name: structured-control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate current control plane
        run: |
          set -euo pipefail
          python3 scripts/check-plan.py
          python3 scripts/check-source-candidate-boundaries.py
          python3 scripts/check-denominator-review-bundle.py
          python3 scripts/check-rust-server-source-candidate.py
          python3 scripts/check-storage-version-compat.py
          python3 scripts/check-schema-authority.py
      - name: Generate exact candidate identity
        env:
          TRNM_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/generate-candidate-manifest.py \
            --output run/v3-control/candidate-manifest.json
          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            '.commit == $sha and
             .claim_boundary.exact_source_identity_recorded == true and
             .claim_boundary.source_validation_executed == false and
             .claim_boundary.compatibility_credit == false' \
            run/v3-control/candidate-manifest.json >/dev/null

  rust-server:
    name: rust-server
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - run: cargo fmt --manifest-path crates/trnm-server/Cargo.toml -- --check
      - run: cargo test --manifest-path crates/trnm-server/Cargo.toml --all-targets --locked
      - run: cargo clippy --manifest-path crates/trnm-server/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute bounded real process
        run: bash scripts/check-rust-server-process.sh

  storage-version:
    name: storage-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - run: cargo fmt --manifest-path crates/trnm-storage-nakama-version/Cargo.toml -- --check
      - run: cargo test --manifest-path crates/trnm-storage-nakama-version/Cargo.toml --all-targets --locked
      - run: cargo clippy --manifest-path crates/trnm-storage-nakama-version/Cargo.toml --all-targets --locked -- -D warnings

  crypto-provider-boundary:
    name: crypto-provider-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - run: cargo fmt --manifest-path crates/trnm-token-crypto-provider/Cargo.toml -- --check
      - run: cargo test --manifest-path crates/trnm-token-crypto-provider/Cargo.toml --all-targets --locked
      - run: cargo clippy --manifest-path crates/trnm-token-crypto-provider/Cargo.toml --all-targets --locked -- -D warnings

  v3-source-and-scope-gate:
    name: v3-source-and-scope-gate
    if: always()
    needs:
      - structured-control
      - rust-server
      - storage-version
      - crypto-provider-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject missing, skipped, cancelled or failed lanes
        env:
          STRUCTURED_CONTROL: ${{ needs.structured-control.result }}
          RUST_SERVER: ${{ needs.rust-server.result }}
          STORAGE_VERSION: ${{ needs.storage-version.result }}
          CRYPTO_PROVIDER: ${{ needs.crypto-provider-boundary.result }}
        run: |
          set -euo pipefail
          test "$STRUCTURED_CONTROL" = success
          test "$RUST_SERVER" = success
          test "$STORAGE_VERSION" = success
          test "$CRYPTO_PROVIDER" = success
          printf 'repository=%s\nsha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
