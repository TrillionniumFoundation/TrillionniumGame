name: temporary-server-concurrency-closure

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: trillionnium-plan-v3-single-writer
  cancel-in-progress: false

jobs:
  implement-prove-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch quiet exact triggering head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          sleep 90
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

      - name: Replace the serial accept loop with bounded supervision
        shell: bash
        run: |
          set -euo pipefail
          cat > crates/trnm-persistence-pg/src/bin/trnm_server/server.rs <<'RUST'
          use std::io::ErrorKind;
          use std::net::{Shutdown, TcpListener, TcpStream};
          use std::sync::{mpsc, Arc, Mutex};
          use std::thread;
          use std::time::Duration;

          use super::app::{App, Repository};
          use super::config::ServerConfig;
          use super::error::ServerError;
          use super::http::{read_request, Response};
          use super::retry::{RetryPolicy, RetryingRepository};
          use super::websocket;

          type SharedApp<R> = Arc<Mutex<App<RetryingRepository<R>>>>;

          pub fn serve<R>(config: &ServerConfig, repository: R) -> Result<(), ServerError>
          where
              R: Repository + Send + 'static,
          {
              let listener = TcpListener::bind(config.bind)?;
              listener.set_nonblocking(true)?;
              let repository =
                  RetryingRepository::new(repository, RetryPolicy::candidate_default())?;
              let app = Arc::new(Mutex::new(App::new(
                  repository,
                  config.admin_token.clone(),
              )));
              let (connection_sender, connection_receiver) =
                  mpsc::sync_channel::<TcpStream>(config.connection_queue_capacity);
              let connection_receiver = Arc::new(Mutex::new(connection_receiver));
              let (error_sender, error_receiver) = mpsc::channel::<ServerError>();
              let mut workers = Vec::with_capacity(config.worker_count);
              for worker_index in 0..config.worker_count {
                  let receiver = Arc::clone(&connection_receiver);
                  let worker_app = Arc::clone(&app);
                  let worker_config = config.clone();
                  let worker_errors = error_sender.clone();
                  let worker = thread::Builder::new()
                      .name(format!("trnm-server-worker-{worker_index}"))
                      .spawn(move || {
                          worker_loop(receiver, worker_app, worker_config, worker_errors)
                      })?;
                  workers.push(worker);
              }
              drop(error_sender);

              eprintln!(
                  "trnm-server source candidate listening on {} profile={} workers={} queue={}",
                  config.bind,
                  config.database_profile.metadata_value(),
                  config.worker_count,
                  config.connection_queue_capacity,
              );

              let mut fatal_error = None;
              loop {
                  match error_receiver.try_recv() {
                      Ok(error) => {
                          fatal_error = Some(error);
                          break;
                      }
                      Err(mpsc::TryRecvError::Disconnected | mpsc::TryRecvError::Empty) => {}
                  }
                  if shared_should_stop(&app)? {
                      break;
                  }
                  match listener.accept() {
                      Ok((stream, _peer)) => {
                          configure_connection(&stream, config)?;
                          match connection_sender.try_send(stream) {
                              Ok(()) => {}
                              Err(mpsc::TrySendError::Full(mut stream)) => {
                                  write_response(&mut stream, &overloaded());
                                  let _ = stream.shutdown(Shutdown::Both);
                              }
                              Err(mpsc::TrySendError::Disconnected(_stream)) => {
                                  fatal_error = Some(ServerError::Configuration(
                                      "server_connection_workers_disconnected",
                                  ));
                                  break;
                              }
                          }
                      }
                      Err(error) if error.kind() == ErrorKind::WouldBlock => {
                          thread::sleep(Duration::from_millis(5));
                      }
                      Err(error) => {
                          fatal_error = Some(ServerError::Io(error));
                          break;
                      }
                  }
              }

              drop(connection_sender);
              for worker in workers {
                  worker
                      .join()
                      .map_err(|_| ServerError::Configuration("server_worker_panicked"))?;
              }
              eprintln!("trnm-server source candidate drained");
              fatal_error.map_or(Ok(()), Err)
          }

          fn worker_loop<R>(
              receiver: Arc<Mutex<mpsc::Receiver<TcpStream>>>,
              app: SharedApp<R>,
              config: ServerConfig,
              errors: mpsc::Sender<ServerError>,
          ) where
              R: Repository + Send + 'static,
          {
              loop {
                  let connection = match receiver.lock() {
                      Ok(receiver) => receiver.recv(),
                      Err(_) => {
                          let _ = errors.send(ServerError::Configuration(
                              "server_connection_queue_lock_poisoned",
                          ));
                          return;
                      }
                  };
                  let mut stream = match connection {
                      Ok(stream) => stream,
                      Err(_) => return,
                  };
                  if let Err(error) = handle_connection(&mut stream, &app, &config) {
                      let _ = errors.send(error);
                      return;
                  }
                  let _ = stream.shutdown(Shutdown::Both);
              }
          }

          fn handle_connection<R>(
              stream: &mut TcpStream,
              app: &SharedApp<R>,
              config: &ServerConfig,
          ) -> Result<(), ServerError>
          where
              R: Repository + Send + 'static,
          {
              match read_request(stream, config.max_request_bytes) {
                  Ok(request) if websocket::is_route(&request) => {
                      let mut app = app
                          .lock()
                          .map_err(|_| ServerError::Configuration("server_app_lock_poisoned"))?;
                      if let Err(error) = websocket::serve_once(
                          stream,
                          &request,
                          &mut app,
                          config.max_request_bytes,
                      ) {
                          // The receipt fence owns response-loss recovery. Never
                          // repeat a committed effect from this delivery path.
                          eprintln!("trnm-server WebSocket delivery failed: {error}");
                      }
                  }
                  Ok(request) => {
                      let response = app
                          .lock()
                          .map_err(|_| ServerError::Configuration("server_app_lock_poisoned"))?
                          .handle(&request);
                      write_response(stream, &response);
                  }
                  Err(ServerError::Input(_)) => write_response(stream, &bad_request()),
                  Err(ServerError::Io(error))
                      if matches!(error.kind(), ErrorKind::TimedOut | ErrorKind::WouldBlock) =>
                  {
                      write_response(stream, &bad_request());
                  }
                  Err(error) => return Err(error),
              }
              Ok(())
          }

          fn shared_should_stop<R>(app: &SharedApp<R>) -> Result<bool, ServerError>
          where
              R: Repository + Send + 'static,
          {
              app.lock()
                  .map(|app| app.should_stop())
                  .map_err(|_| ServerError::Configuration("server_app_lock_poisoned"))
          }

          fn write_response(stream: &mut TcpStream, response: &Response) {
              if let Err(error) = response.write_to(stream) {
                  eprintln!("trnm-server response delivery failed: {error}");
              }
          }

          fn configure_connection(
              stream: &TcpStream,
              config: &ServerConfig,
          ) -> Result<(), ServerError> {
              stream.set_nodelay(true)?;
              stream.set_read_timeout(Some(config.read_timeout))?;
              stream.set_write_timeout(Some(config.write_timeout))?;
              Ok(())
          }

          fn bad_request() -> Response {
              Response::json(
                  400,
                  br#"{"code":"invalid_argument","message":"Request is invalid.","retry":"never"}"#.to_vec(),
              )
          }

          fn overloaded() -> Response {
              Response::json(
                  503,
                  br#"{"code":"unavailable","message":"Connection queue is full.","retry":"backoff"}"#.to_vec(),
              )
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn connection_parse_failure_has_no_internal_reason() {
                  let response = bad_request();
                  assert_eq!(response.status, 400);
                  let body = String::from_utf8(response.body).unwrap();
                  assert!(!body.contains("http_"));
                  assert!(!body.contains("database"));
              }

              #[test]
              fn saturation_response_is_stable_and_retryable() {
                  let response = overloaded();
                  assert_eq!(response.status, 503);
                  let body = String::from_utf8(response.body).unwrap();
                  assert!(body.contains("\"retry\":\"backoff\""));
                  assert!(!body.contains("worker"));
                  assert!(!body.contains("channel"));
              }
          }
          RUST

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          path = Path('crates/trnm-persistence-pg/src/bin/trnm_server/config.rs')
          source = path.read_text(encoding='utf-8')
          if 'DEFAULT_WORKER_COUNT' not in source:
              anchor = 'const DEFAULT_WRITE_TIMEOUT_MS: u64 = 10_000;\n'
              if anchor not in source:
                  raise SystemExit(f'{path}: timeout constant anchor missing')
              source = source.replace(
                  anchor,
                  anchor
                  + 'const DEFAULT_WORKER_COUNT: usize = 4;\n'
                  + 'const DEFAULT_CONNECTION_QUEUE_CAPACITY: usize = 128;\n',
                  1,
              )
          if 'pub worker_count: usize' not in source:
              anchor = '    pub write_timeout: Duration,\n'
              if anchor not in source:
                  raise SystemExit(f'{path}: config field anchor missing')
              source = source.replace(
                  anchor,
                  anchor
                  + '    pub worker_count: usize,\n'
                  + '    pub connection_queue_capacity: usize,\n',
                  1,
              )
          if '.field("worker_count"' not in source:
              anchor = '            .field("write_timeout", &self.write_timeout)\n'
              if anchor not in source:
                  raise SystemExit(f'{path}: debug field anchor missing')
              source = source.replace(
                  anchor,
                  anchor
                  + '            .field("worker_count", &self.worker_count)\n'
                  + '            .field(\n'
                  + '                "connection_queue_capacity",\n'
                  + '                &self.connection_queue_capacity,\n'
                  + '            )\n',
                  1,
              )
          if 'TRNM_SERVER_WORKER_COUNT' not in source:
              anchor = '''        let write_timeout_ms = parse_u64(
            lookup("TRNM_SERVER_WRITE_TIMEOUT_MS").as_deref(),
            DEFAULT_WRITE_TIMEOUT_MS,
            100,
            120_000,
            "write_timeout_invalid",
        )?;
'''
              if anchor not in source:
                  raise SystemExit(f'{path}: timeout parse anchor missing')
              addition = '''        let worker_count = parse_usize(
            lookup("TRNM_SERVER_WORKER_COUNT").as_deref(),
            DEFAULT_WORKER_COUNT,
            1,
            64,
            "worker_count_invalid",
        )?;
        let connection_queue_capacity = parse_usize(
            lookup("TRNM_SERVER_CONNECTION_QUEUE_CAPACITY").as_deref(),
            DEFAULT_CONNECTION_QUEUE_CAPACITY,
            1,
            4096,
            "connection_queue_capacity_invalid",
        )?;
'''
              source = source.replace(anchor, anchor + addition, 1)
          if '                worker_count,' not in source:
              anchor = '''                read_timeout: Duration::from_millis(read_timeout_ms),
                write_timeout: Duration::from_millis(write_timeout_ms),
'''
              if anchor not in source:
                  raise SystemExit(f'{path}: constructor field anchor missing')
              source = source.replace(
                  anchor,
                  anchor
                  + '                worker_count,\n'
                  + '                connection_queue_capacity,\n',
                  1,
              )
          if 'config.worker_count, 4' not in source:
              anchor = '        assert_eq!(config.max_request_bytes, 128 * 1024);\n'
              if anchor not in source:
                  raise SystemExit(f'{path}: default test anchor missing')
              source = source.replace(
                  anchor,
                  anchor
                  + '        assert_eq!(config.worker_count, 4);\n'
                  + '        assert_eq!(config.connection_queue_capacity, 128);\n',
                  1,
              )
          path.write_text(source, encoding='utf-8')

          inventory_path = Path('docs/status/IMPLEMENTATION_INVENTORY.json')
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          for component in inventory.get('components', []):
              if component.get('id') == 'COMP-TRNM-SERVER':
                  fact = 'bounded nonblocking accept loop, fixed worker set, bounded connection queue and graceful drain join'
                  implemented = component.setdefault('implemented', [])
                  if fact not in implemented:
                      implemented.append(fact)
                  missing = component.setdefault('missing', [])
                  if 'concurrent bounded connection supervision' in missing:
                      missing.remove('concurrent bounded connection supervision')
          inventory_path.write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Generate exact-head process saturation workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path('.')
          all_workflows = '\n'.join(
              path.read_text(encoding='utf-8')
              for path in sorted((root / '.github/workflows').glob('*.yml'))
              if path.name != 'temporary-server-concurrency-closure.yml'
          )
          images = sorted(set(re.findall(
              r'(?:docker\.io/library/)?postgres(?::[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}',
              all_workflows,
          )))
          if not images:
              raise SystemExit('immutable PostgreSQL image missing')
          workflow = f'''name: server-concurrency-smoke

on:
  pull_request:
  push:
    branches:
      - main
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: read

jobs:
  bounded-connection-supervision:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact head without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${{GITHUB_REPOSITORY}}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prove saturation, recovery and drain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          docker run -d --name trnm-server-concurrency-db \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55437:5432 {images[0]}
          for attempt in $(seq 1 90); do
            if docker exec trnm-server-concurrency-db pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90; sleep 1
          done
          export TRNM_SERVER_DATABASE_URL=postgresql://postgres@127.0.0.1:55437/postgres
          export TRNM_SERVER_DATABASE_PROFILE=postgresql
          export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$GITHUB_SHA"
          export TRNM_SERVER_ADMIN_TOKEN=0123456789abcdefghijklmnopqrstuvwxyzABCDE
          export TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE=1
          export TRNM_SERVER_BIND=127.0.0.1:57350
          export TRNM_SERVER_WORKER_COUNT=2
          export TRNM_SERVER_CONNECTION_QUEUE_CAPACITY=4
          export TRNM_SERVER_READ_TIMEOUT_MS=5000
          cargo run --quiet --package trnm-persistence-pg --bin trnm-server -- migrate
          cargo run --quiet --package trnm-persistence-pg --bin trnm-server -- serve \
            > /tmp/trnm-server-concurrency.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; docker rm -f trnm-server-concurrency-db >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY2'
          import concurrent.futures
          import socket
          import time

          address = ('127.0.0.1', 57350)
          for _ in range(200):
              try:
                  with socket.create_connection(address, timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.05)
          else:
              raise SystemExit('server did not become reachable')

          blockers = []
          for _ in range(6):
              sock = socket.create_connection(address, timeout=2)
              sock.sendall(b'GET /healthz HTTP/1.1\r\nHost: localhost\r\n')
              blockers.append(sock)
          time.sleep(0.3)
          with socket.create_connection(address, timeout=2) as sock:
              sock.sendall(b'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n')
              payload = b''
              while True:
                  chunk = sock.recv(4096)
                  if not chunk:
                      break
                  payload += chunk
          if not payload.startswith(b'HTTP/1.1 503'):
              raise SystemExit(f'queue saturation did not return 503: {payload[:120]!r}')
          for sock in blockers:
              sock.close()
          time.sleep(0.5)

          def health(_):
              with socket.create_connection(address, timeout=3) as sock:
                  sock.sendall(b'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n')
                  data = b''
                  while True:
                      chunk = sock.recv(4096)
                      if not chunk:
                          break
                      data += chunk
              return data.split(b'\r\n', 1)[0]

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as executor:
              statuses = list(executor.map(health, range(64)))
          if any(status != b'HTTP/1.1 200 OK' for status in statuses):
              raise SystemExit(f'health recovery failed: {statuses!r}')

          with socket.create_connection(address, timeout=3) as sock:
              request = (
                  b'POST /-/drain HTTP/1.1\r\n'
                  b'Host: localhost\r\n'
                  b'Authorization: Bearer 0123456789abcdefghijklmnopqrstuvwxyzABCDE\r\n'
                  b'Content-Length: 0\r\n'
                  b'Connection: close\r\n\r\n'
              )
              sock.sendall(request)
              response = sock.recv(4096)
          if not response.startswith(b'HTTP/1.1 200 OK'):
              raise SystemExit(f'drain failed: {response[:120]!r}')
          PY2
          for attempt in $(seq 1 100); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              wait "$SERVER_PID"
              exit 0
            fi
            sleep 0.1
          done
          echo 'server failed to drain within 10 seconds' >&2
          exit 1
'''
          (root / '.github/workflows/server-concurrency-smoke.yml').write_text(
              workflow,
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Compile, autoformat, test and strictly lint
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          cargo check --package trnm-persistence-pg --all-targets --locked
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --fix --allow-dirty --allow-staged \
            --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --package trnm-persistence-pg --all-targets --locked
          cargo clippy --package trnm-persistence-pg --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run the process saturation smoke before commit
        shell: bash
        run: |
          set -euo pipefail
          POSTGRES_IMAGE="$(grep -Eo '(docker.io/library/)?postgres(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' .github/workflows/server-concurrency-smoke.yml | head -1)"
          docker run -d --name trnm-server-concurrency-db \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:55437:5432 "$POSTGRES_IMAGE"
          for attempt in $(seq 1 90); do
            if docker exec trnm-server-concurrency-db pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
            test "$attempt" -lt 90; sleep 1
          done
          export TRNM_SERVER_DATABASE_URL=postgresql://postgres@127.0.0.1:55437/postgres
          export TRNM_SERVER_DATABASE_PROFILE=postgresql
          export TRNM_SERVER_SCHEMA_SOURCE_COMMIT="$GITHUB_SHA"
          export TRNM_SERVER_ADMIN_TOKEN=0123456789abcdefghijklmnopqrstuvwxyzABCDE
          export TRNM_SERVER_ALLOW_PLAINTEXT_DATABASE=1
          export TRNM_SERVER_BIND=127.0.0.1:57350
          export TRNM_SERVER_WORKER_COUNT=2
          export TRNM_SERVER_CONNECTION_QUEUE_CAPACITY=4
          export TRNM_SERVER_READ_TIMEOUT_MS=5000
          cargo run --quiet --package trnm-persistence-pg --bin trnm-server -- migrate
          cargo run --quiet --package trnm-persistence-pg --bin trnm-server -- serve \
            > /tmp/trnm-server-concurrency.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; docker rm -f trnm-server-concurrency-db >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import concurrent.futures
          import socket
          import time
          address = ('127.0.0.1', 57350)
          for _ in range(200):
              try:
                  with socket.create_connection(address, timeout=0.2): break
              except OSError: time.sleep(0.05)
          else: raise SystemExit('server did not become reachable')
          blockers=[]
          for _ in range(6):
              sock=socket.create_connection(address,timeout=2)
              sock.sendall(b'GET /healthz HTTP/1.1\r\nHost: localhost\r\n')
              blockers.append(sock)
          time.sleep(0.3)
          with socket.create_connection(address,timeout=2) as sock:
              sock.sendall(b'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n')
              payload=b''
              while True:
                  chunk=sock.recv(4096)
                  if not chunk: break
                  payload+=chunk
          assert payload.startswith(b'HTTP/1.1 503'), payload[:120]
          for sock in blockers: sock.close()
          time.sleep(0.5)
          def health(_):
              with socket.create_connection(address,timeout=3) as sock:
                  sock.sendall(b'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n')
                  data=b''
                  while True:
                      chunk=sock.recv(4096)
                      if not chunk: break
                      data+=chunk
              return data.split(b'\r\n',1)[0]
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as executor:
              statuses=list(executor.map(health,range(64)))
          assert all(status==b'HTTP/1.1 200 OK' for status in statuses), statuses
          with socket.create_connection(address,timeout=3) as sock:
              sock.sendall(
                  b'POST /-/drain HTTP/1.1\r\nHost: localhost\r\n'
                  b'Authorization: Bearer 0123456789abcdefghijklmnopqrstuvwxyzABCDE\r\n'
                  b'Content-Length: 0\r\nConnection: close\r\n\r\n'
              )
              response=sock.recv(4096)
          assert response.startswith(b'HTTP/1.1 200 OK'), response[:120]
          PY
          for attempt in $(seq 1 100); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then wait "$SERVER_PID"; exit 0; fi
            sleep 0.1
          done
          exit 1

      - name: Remove every temporary writer and push unchanged-tip result
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) \
            -print -delete
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*.yml' -o -name 'temporary-*.yaml' \) -print -quit)"
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(server): add bounded connection supervision"
          git push origin "HEAD:${GITHUB_REF_NAME}"
