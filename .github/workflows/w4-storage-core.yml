name: trillionnium-game-storage-core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/trnm-contracts/**'
      - 'crates/trnm-storage-core/**'
      - 'contracts/storage/**'
      - 'scripts/check-storage-core.py'
      - 'tests/storage/**'
      - 'docs/development/STORAGE_CORE_CANDIDATE.md'
      - 'docs/status/STORAGE_CORE_STATUS.json'
      - '.github/workflows/w4-storage-core.yml'

permissions:
  contents: read

jobs:
  contract-and-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/check-rust-foundation.py
      - run: python3 scripts/check-storage-core.py
      - run: python3 -m unittest discover -s tests/storage -p 'test_*.py' -v

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
