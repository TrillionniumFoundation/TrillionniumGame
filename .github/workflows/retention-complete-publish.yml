name: retention-complete-publish

on:
  push:
    branches: [tooling/retention-inspect-2026-09-06]

permissions:
  contents: write

concurrency:
  group: retention-complete-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15-arm64
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: 4f78bbd93a6457da0ddb63c1508d34387ac0fa7b
      EXPECTED_TREE: 25909e7081d8877dd20177b1423e73654a6f7882
      PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
      PATCH_GZIP_BLOB: 6b7890b861cc6f0cde2f87a9acfff5aedd1cf456
      PATCH_GZIP_SHA256: b0f1a8a0a29e2ed855a6ce2ace8fc7edef8f6e1e67fc607fab1d3d470d0bc5c9
      PATCH_SHA256: 38a5fa31c5499fca933789052611f288ec1be0ce2cae5ff5e8b965945333d666
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Fetch exact tooling and unchanged candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/tooling" "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/tooling" hash-object retention-patch/evidence-retention-v1.patch.gz)" = "$PATCH_GZIP_BLOB"
          test "$(shasum -a 256 "$GITHUB_WORKSPACE/tooling/retention-patch/evidence-retention-v1.patch.gz" | cut -d' ' -f1)" = "$PATCH_GZIP_SHA256"

          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=128 origin \
            "refs/heads/${PRODUCT_BRANCH}"
          git -C "$GITHUB_WORKSPACE/source" checkout -b "$PRODUCT_BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git -C "$GITHUB_WORKSPACE/source" ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"

      - name: Apply exact patch and repin the complete workflow manifest
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/evidence-retention-v1.patch"
          gzip -dc "$GITHUB_WORKSPACE/tooling/retention-patch/evidence-retention-v1.patch.gz" > "$patch"
          test "$(shasum -a 256 "$patch" | cut -d' ' -f1)" = "$PATCH_SHA256"
          git apply --check "$patch"
          git apply "$patch"

          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import sys

          ROOT = Path.cwd()
          BASE = ROOT / "docs/governance/REQUIRED_WORKFLOWS_V1.json"
          OVERLAY = ROOT / "docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json"
          TARGET_PATHS = (
              ".github/workflows/candidate-identity-manifest.yml",
              ".github/workflows/pg-server-response-loss.yml",
              ".github/workflows/prospective-merge-gate.yml",
              ".github/workflows/trillionnium-game-merge-gate.yml",
              ".github/workflows/trnm-server-live.yml",
          )

          def reject_pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise SystemExit(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise SystemExit(f"non-finite JSON number: {value}")

          def load(path: Path):
              return json.loads(
                  path.read_text(encoding="utf-8"),
                  object_pairs_hook=reject_pairs,
                  parse_constant=reject_constant,
              )

          def canonical(value) -> bytes:
              return (json.dumps(
                  value, sort_keys=True, separators=(",", ":"), allow_nan=False,
              ) + "\n").encode("utf-8")

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(
                  f"blob {len(data)}\0".encode("ascii") + data,
              ).hexdigest()

          targets = {
              path: git_blob((ROOT / path).read_bytes()) for path in TARGET_PATHS
          }
          hits = {path: 0 for path in TARGET_PATHS}

          def repin(row):
              if not isinstance(row, dict):
                  raise SystemExit("workflow requirement must be an object")
              path = row.get("path")
              if path in targets:
                  row["git_blob_sha1"] = targets[path]
                  hits[path] += 1

          base = load(BASE)
          overlay = load(OVERLAY)
          repin(base.get("aggregate_workflow"))
          for row in base.get("workflows", []):
              repin(row)
          for key in ("replace_workflows", "add_workflows"):
              for row in overlay.get(key, []):
                  repin(row)

          missing = sorted(path for path, count in hits.items() if count == 0)
          if missing:
              raise SystemExit(f"workflow manifest has no requirement for: {missing}")

          base_bytes = canonical(base)
          BASE.write_bytes(base_bytes)
          overlay["base_manifest_blob_sha1"] = git_blob(base_bytes)
          overlay.pop("overlay_sha256", None)
          overlay["overlay_sha256"] = hashlib.sha256(canonical(overlay)).hexdigest()
          OVERLAY.write_bytes(canonical(overlay))

          gate_path = ROOT / "scripts/check-required-workflow-runs.py"
          spec = importlib.util.spec_from_file_location("retention_manifest_gate", gate_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load workflow manifest gate")
          gate = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = gate
          spec.loader.exec_module(gate)
          manifest = gate.load_composed_manifest(BASE.relative_to(ROOT))
          failures = gate.verify_files(ROOT, manifest)
          if failures:
              raise SystemExit("; ".join(failures))
          print(json.dumps({
              "base_blob": git_blob(BASE.read_bytes()),
              "overlay_blob": git_blob(OVERLAY.read_bytes()),
              "repinned": targets,
          }, sort_keys=True, separators=(",", ":")))
          PY

          expected=$(cat <<'EOF'
          .github/actions/upload-evidence/action.yml
          .github/actions/upload-evidence/index.js
          .github/workflows/candidate-identity-manifest.yml
          .github/workflows/pg-server-response-loss.yml
          .github/workflows/prospective-merge-gate.yml
          .github/workflows/trillionnium-game-merge-gate.yml
          .github/workflows/trnm-server-live.yml
          docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json
          docs/governance/REQUIRED_WORKFLOWS_V1.json
          tests/control_plane/test_evidence_retention_workflows.py
          EOF
          )
          actual=$({ git diff --name-only; git ls-files --others --exclude-standard; } | LC_ALL=C sort -u)
          test "$actual" = "$expected"
          git diff --check

      - name: Execute focused and complete repository control corpus on macOS
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node --check .github/actions/upload-evidence/index.js
          python3 -m compileall -q scripts tests
          python3 -m unittest -v \
            tests.control_plane.test_evidence_retention_workflows \
            tests.control_plane.test_macos_root_alias_io \
            tests.control_plane.test_required_workflow_source_contract \
            tests.control_plane.test_workflow_manifest_overlay
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-plan.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"

          expected=$(cat <<'EOF'
          .github/actions/upload-evidence/action.yml
          .github/actions/upload-evidence/index.js
          .github/workflows/candidate-identity-manifest.yml
          .github/workflows/pg-server-response-loss.yml
          .github/workflows/prospective-merge-gate.yml
          .github/workflows/trillionnium-game-merge-gate.yml
          .github/workflows/trnm-server-live.yml
          docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json
          docs/governance/REQUIRED_WORKFLOWS_V1.json
          tests/control_plane/test_evidence_retention_workflows.py
          EOF
          )
          actual=$({ git diff --name-only; git ls-files --others --exclude-standard; } | LC_ALL=C sort -u)
          test "$actual" = "$expected"

      - name: Commit complete surface and ordinary fast-forward push
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          .github/actions/upload-evidence/action.yml
          .github/actions/upload-evidence/index.js
          .github/workflows/candidate-identity-manifest.yml
          .github/workflows/pg-server-response-loss.yml
          .github/workflows/prospective-merge-gate.yml
          .github/workflows/trillionnium-game-merge-gate.yml
          .github/workflows/trnm-server-live.yml
          docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json
          docs/governance/REQUIRED_WORKFLOWS_V1.json
          tests/control_plane/test_evidence_retention_workflows.py
          EOF
          )
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          while IFS= read -r path; do
            git add -- "$path"
          done <<< "$expected"
          test "$(git diff --cached --name-only | LC_ALL=C sort)" = "$expected"
          git diff --cached --check
          git commit -m "ci(evidence): retain complete exact source and merge packets"
          new_head=$(git rev-parse HEAD)
          new_tree=$(git rev-parse HEAD^{tree})
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$new_head"
          printf 'new_head=%s\nnew_tree=%s\nforce_push=false\nmain_write=false\n' \
            "$new_head" "$new_tree"
