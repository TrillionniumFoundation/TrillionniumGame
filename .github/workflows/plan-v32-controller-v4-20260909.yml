name: plan-v32-controller-v4-20260909

on:
  push:
    branches:
      - codex/plan-v32-controller-v2-2026-09-09
    paths:
      - .github/workflows/plan-v32-controller-v4-20260909.yml
      - tools/plan_v32_converge.py
      - tools/finalize_plan_v32_contracts.py
      - tools/finalize_plan_v32_regressions.py
      - tools/finalize_plan_v32_regressions_v2.py
      - tools/run_plan_v32_convergence.sh

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: plan-v32-final-controller
  cancel-in-progress: true

jobs:
  converge-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      TARGET_BRANCH: codex/architecture-gap-closure-2026-09-08
      TARGET_PR: "116"
    steps:
      - name: Fetch exact controller source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/controller"
          git init "$GITHUB_WORKSPACE/controller"
          git -C "$GITHUB_WORKSPACE/controller" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/controller" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/controller" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/controller" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Execute fail-closed convergence and complete validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/controller/tools/run_plan_v32_convergence.sh"
