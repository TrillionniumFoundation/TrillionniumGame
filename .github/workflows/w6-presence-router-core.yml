name: trillionnium-game-presence-router-core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/trnm-presence-core/**'
      - 'contracts/realtime/presence-*.json'
      - 'scripts/check-presence-core.py'
      - 'tests/realtime/test_presence_vectors.py'
      - 'docs/development/PRESENCE_ROUTER_CORE.md'
      - 'docs/status/PRESENCE_ROUTER_STATUS.json'
      - '.github/workflows/w6-presence-router-core.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/trnm-presence-core/**'
      - 'contracts/realtime/presence-*.json'
      - 'scripts/check-presence-core.py'
      - 'tests/realtime/test_presence_vectors.py'
      - 'docs/development/PRESENCE_ROUTER_CORE.md'
      - 'docs/status/PRESENCE_ROUTER_STATUS.json'
      - '.github/workflows/w6-presence-router-core.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-presence-router-core-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract-and-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "refs/heads/${CANDIDATE_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate presence source contract
        run: python3 scripts/check-presence-core.py
      - name: Execute independent presence vectors
        run: python3 -m unittest discover -s tests/realtime -p 'test_presence_vectors.py' -v
      - name: Compile Python contract sources
        run: python3 -m compileall -q scripts tests/realtime

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "refs/heads/${CANDIDATE_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose
      - name: Format
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --workspace --all-targets --locked
      - name: Strict lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
