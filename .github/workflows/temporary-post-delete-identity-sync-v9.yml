name: temporary-post-delete-identity-sync-v9

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-after-external-delete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Wait for external deletion and stable branch tip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          token=os.environ['GH_TOKEN']
          repo=os.environ['GITHUB_REPOSITORY']
          branch=os.environ['GITHUB_REF_NAME']
          start=os.environ['GITHUB_SHA']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'trillionnium-post-delete-sync',
          }
          def get(url):
              r=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(r,timeout=30) as x:
                  return json.loads(x.read())
          last=None
          stable=0
          final=None
          for _ in range(60):
              ref=get(f'https://api.github.com/repos/{repo}/git/ref/heads/{branch}')
              sha=ref['object']['sha']
              if sha!=start and sha==last:
                  stable+=1
              else:
                  stable=0
              if stable>=3:
                  final=sha
                  break
              last=sha
              time.sleep(10)
          if final is None:
              raise SystemExit('branch did not reach a stable post-delete tip')
          commit=get(f'https://api.github.com/repos/{repo}/git/commits/{final}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              output.write(f'FINAL_SHA={final}\n')
              output.write(f'FINAL_TREE={commit["tree"]["sha"]}\n')
          PY
      - name: Bind PR and reviewer request to final tip without another commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.request
          token=os.environ['GH_TOKEN']
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['FINAL_SHA']
          tree=os.environ['FINAL_TREE']
          api=f'https://api.github.com/repos/{repo}'
          def req(method,url,body=None):
              data=None if body is None else json.dumps(body).encode()
              r=urllib.request.Request(url,data=data,method=method,headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
                  'User-Agent':'trillionnium-post-delete-sync',
              })
              try:
                  with urllib.request.urlopen(r,timeout=45) as x:
                      raw=x.read(); return x.status,json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raw=error.read().decode(errors='replace')
                  return error.code,{'message':raw}
          code,pr=req('GET',api+'/pulls/42')
          if code!=200 or pr['head']['sha']!=sha:
              raise SystemExit(f'PR head mismatch: {code} {pr}')
          exact=(
              '## Exact candidate\n\n'
              f'- base: `main@{pr["base"]["sha"]}`\n'
              f'- head: `{sha}`\n'
              f'- tree: `{tree}`\n\n'
              'Only terminal checks, reviews and governance readback bound to this exact '
              'candidate may receive closure credit.\n'
          )
          body=pr.get('body') or ''
          pattern=re.compile(r'## Exact candidate\n.*?(?=\n## |\Z)',re.S)
          body=pattern.sub(exact.rstrip(),body) if pattern.search(body) else exact+'\n'+body
          pcode,_=req('PATCH',api+'/pulls/42',{'body':body})
          if pcode!=200:
              raise SystemExit(f'PR body patch failed: {pcode}')
          if pr.get('draft'):
              mutation='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}'
              req('POST','https://api.github.com/graphql',{'query':mutation,'variables':{'id':pr['node_id']}})
          rcode,_=req('POST',api+'/pulls/42/requested_reviewers',{'reviewers':['ProfHepta']})
          if rcode not in {200,201,422}:
              raise SystemExit(f'reviewer request failed: {rcode}')
          marker='<!-- trillionnium-final-candidate-identity -->'
          text=(
              '## Final candidate identity\n\n'
              f'- commit: `{sha}`\n'
              f'- tree: `{tree}`\n'
              '- reviewer requested: `ProfHepta`\n\n'
              f'{marker}'
          )
          ccode,comments=req('GET',api+'/issues/42/comments?per_page=100')
          old=next((x for x in comments if marker in (x.get('body') or '')),None) if ccode==200 else None
          req('PATCH',old['url'],{'body':text}) if old else req('POST',api+'/issues/42/comments',{'body':text})
          print(json.dumps({'final_sha':sha,'final_tree':tree,'body_synced':True,'reviewer_requested':True},sort_keys=True))
          PY
