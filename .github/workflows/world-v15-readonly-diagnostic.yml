name: world-v15-readonly-rust-diagnostic

on:
  push:
    branches: [ops/world-v15-rust-diagnostic-20260912]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v15-readonly-rust-diagnostic
  cancel-in-progress: true

env:
  WORLD_SHA: 'bfafb6a88fd422b4fa28108348a2f7f3bdde88a7'
  WORLD_TREE: '30aaf3c0c3b33375a6cdf0df62a3708a17f971d6'
  WORLD_ORIGIN_SHA: 'd44d8930c917b55da7b23eb19e9645feb8f4ee59'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
  RUST_TEST_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  diagnostic:
    name: world-v15/diagnostic-not-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact driver and immutable World candidate
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          clone_exact() {
            local target="$1" remote="$2" expected="$3"
            git init -q "$target"
            git -C "$target" remote add origin "$remote"
            git -C "$target" fetch -q --no-tags --depth=1 origin "$expected"
            git -C "$target" checkout -q --detach FETCH_HEAD
            test "$(git -C "$target" rev-parse HEAD)" = "$expected"
          }
          clone_exact "$GITHUB_WORKSPACE" "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          clone_exact "$RUNNER_TEMP/world" "https://github.com/TrillionniumFoundation/Trillionnium-World.git" "$WORLD_SHA"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/world-target" >> "$GITHUB_ENV"
          {
            printf 'world_commit=%s\nworld_tree=%s\n' "$WORLD_SHA" "$WORLD_TREE"
            printf 'authority_tree=%s\n' "$(git -C "$RUNNER_TEMP/world" rev-parse HEAD:trillionnium/crates/world-authority)"
            printf 'driver_commit=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'scope=diagnostic_only\nworld_native_admission=false\nindependent_acceptance=false\nproduction_authorization=not_granted\n'
            uname -a
          } > "$RUNNER_TEMP/evidence/identity.txt"

      - name: Install and verify exact Rust toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          test "$(rustc --version | awk '{print $2}')" = "$RUSTUP_TOOLCHAIN"
          rustc --version --verbose > "$RUNNER_TEMP/evidence/rustc.txt"
          cargo --version --verbose > "$RUNNER_TEMP/evidence/cargo.txt"

      - name: Check Rust formatting without modifying source
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          timeout --signal=TERM --kill-after=10s 180s cargo fmt \
            --manifest-path "$RUNNER_TEMP/world/trillionnium/crates/world-authority/Cargo.toml" \
            --all -- --check 2>&1 | head -c 8388608 > "$RUNNER_TEMP/evidence/fmt.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[*]}" > "$RUNNER_TEMP/evidence/fmt.exit"
          test "${codes[0]}" = 0 && test "${codes[1]}" = 0 || exit 1
          test "$(wc -c < "$RUNNER_TEMP/evidence/fmt.log")" -lt 8388608

      - name: Execute all authority Rust tests and require new regression assertions
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          timeout --signal=TERM --kill-after=10s 1050s cargo test \
            --manifest-path "$RUNNER_TEMP/world/trillionnium/crates/world-authority/Cargo.toml" \
            --workspace --all-targets --locked \
            2>&1 | head -c 8388608 > "$RUNNER_TEMP/evidence/tests.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[*]}" > "$RUNNER_TEMP/evidence/tests.exit"
          test "${codes[0]}" = 0 && test "${codes[1]}" = 0 || exit 1
          test "$(wc -c < "$RUNNER_TEMP/evidence/tests.log")" -lt 8388608 || exit 1
          python3 - "$RUNNER_TEMP/evidence/tests.log" > "$RUNNER_TEMP/evidence/new-regressions.txt" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text()
          publication = re.findall(r'^test publication_tests::[^\r\n]+ \.\.\. ok$', text, re.M)
          preflight = re.findall(r'^test production_preflight::tests::[^\r\n]+ \.\.\. ok$', text, re.M)
          if len(publication) != 8 or len(preflight) != 5:
              raise SystemExit(f'missing new regression executions: publication={len(publication)} preflight={len(preflight)}')
          print(f'new executed regressions: publication={len(publication)} preflight={len(preflight)}')
          PY

      - name: Check strict Clippy without modifying source
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.toolchain.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          timeout --signal=TERM --kill-after=10s 600s cargo clippy \
            --manifest-path "$RUNNER_TEMP/world/trillionnium/crates/world-authority/Cargo.toml" \
            --workspace --all-targets --locked -- -D warnings \
            2>&1 | head -c 8388608 > "$RUNNER_TEMP/evidence/clippy.log"
          codes=("${PIPESTATUS[@]}")
          printf '%s\n' "${codes[*]}" > "$RUNNER_TEMP/evidence/clippy.exit"
          test "${codes[0]}" = 0 && test "${codes[1]}" = 0 || exit 1
          test "$(wc -c < "$RUNNER_TEMP/evidence/clippy.log")" -lt 8388608

      - name: Export exact public source objects for offline diagnostic verification
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/world" archive --format=tar.gz HEAD > "$RUNNER_TEMP/evidence/world-source.tar.gz"
          timeout 300s git -C "$RUNNER_TEMP/world" fetch -q --unshallow --no-tags origin "$WORLD_SHA"
          timeout 300s git -C "$RUNNER_TEMP/world" fetch -q --no-tags origin "$WORLD_ORIGIN_SHA"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse HEAD)" = "$WORLD_SHA"
          test "$(git -C "$RUNNER_TEMP/world" rev-parse FETCH_HEAD)" = "$WORLD_ORIGIN_SHA"
          git -C "$RUNNER_TEMP/world" bundle create "$RUNNER_TEMP/evidence/world-source.bundle" HEAD FETCH_HEAD
          git -C "$RUNNER_TEMP/world" bundle verify "$RUNNER_TEMP/evidence/world-source.bundle" > "$RUNNER_TEMP/evidence/bundle-verify.txt" 2>&1

      - name: Verify source stayed unchanged and retain diagnostic packet
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          if test -d "$RUNNER_TEMP/world/.git"; then
            git -C "$RUNNER_TEMP/world" status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/evidence/source-status.txt"
            test "$(git -C "$RUNNER_TEMP/world" rev-parse HEAD)" = "$WORLD_SHA"
            test "$(git -C "$RUNNER_TEMP/world" rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"
          fi
          find "$RUNNER_TEMP/evidence" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 -r sha256sum > "$RUNNER_TEMP/evidence/SHA256SUMS"
          tar -czf "$RUNNER_TEMP/world-v15-diagnostic.tar.gz" -C "$RUNNER_TEMP" evidence
          if test -f "$RUNNER_TEMP/evidence/source-status.txt"; then
            test ! -s "$RUNNER_TEMP/evidence/source-status.txt"
          fi

      - name: Upload scoped diagnostic evidence with repository-native transport
        if: ${{ always() && steps.source.outcome == 'success' }}
        uses: ./.github/actions/upload-evidence
        with:
          name: world-v15-diagnostic-${{ env.WORLD_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/world-v15-diagnostic.tar.gz
