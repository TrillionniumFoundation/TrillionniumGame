name: candidate-receipt-fix-v3

on:
  push:
    branches: [tooling/candidate-receipt-fix-v3-2026-09-06]
    paths:
      - '.github/workflows/candidate-receipt-fix-v3.yml'

permissions:
  contents: write

jobs:
  validate-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: 4a4fb5b57db0620c03804f4296eb80b3aee2887a
      EXPECTED_TREE: 0c55356ed25068a0224d2a25c82ed014aeefbff7
      PRODUCT_BRANCH: codex/branch-evidence-closure-2026-09-02
      EXPORT_BRANCH: tooling/candidate-receipt-fix-v3-2026-09-06
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Fetch exact tooling and unchanged candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/tooling" "$GITHUB_WORKSPACE/source"

          git init "$GITHUB_WORKSPACE/tooling"
          git -C "$GITHUB_WORKSPACE/tooling" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/tooling" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE/tooling" checkout -b "$EXPORT_BRANCH" FETCH_HEAD

          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags --depth=1 origin \
            "refs/heads/${PRODUCT_BRANCH}"
          git -C "$GITHUB_WORKSPACE/source" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git -C "$GITHUB_WORKSPACE/source" ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | cut -f1)" = "$EXPECTED_HEAD"

      - name: Repair candidate receipt, add regression and repin manifests
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import sys

          root = Path.cwd()
          candidate_path = root / ".github/workflows/candidate-identity-manifest.yml"
          candidate = candidate_path.read_text(encoding="utf-8")
          anchor = "          printf 'artifact_id=%s\\nsha256=%s\\nsize_bytes=%s\\n'\n"
          replacement = anchor[:-1] + " \\" + "\n"
          if candidate.count(anchor) != 1:
              raise SystemExit(f"candidate receipt anchor count={candidate.count(anchor)}")
          candidate_path.write_text(candidate.replace(anchor, replacement, 1), encoding="utf-8")

          test_path = root / "tests/control_plane/test_evidence_retention_workflows.py"
          tests = test_path.read_text(encoding="utf-8")
          insertion_anchor = "    def test_source_collection_binds_runs_jobs_attempts_and_definition_blobs(self) -> None:\n"
          method_name = "test_candidate_receipt_printf_continues_to_arguments"
          if method_name in tests:
              raise SystemExit("candidate receipt regression already exists")
          if tests.count(insertion_anchor) != 1:
              raise SystemExit("retention regression insertion anchor drift")
          method_lines = [
              "    def test_candidate_receipt_printf_continues_to_arguments(self) -> None:",
              "        source = WORKFLOWS[\"candidate\"].read_text(encoding=\"utf-8\")",
              "        receipt_lines = [",
              "            line",
              "            for line in source.splitlines()",
              "            if \"printf \" in line and \"artifact_id=%s\" in line",
              "        ]",
              "        self.assertEqual(len(receipt_lines), 1)",
              "        self.assertTrue(receipt_lines[0].endswith(\"\\\\\"))",
              "",
              "",
          ]
          method = "\n".join(method_lines)
          test_path.write_text(
              tests.replace(insertion_anchor, method + insertion_anchor, 1),
              encoding="utf-8",
          )

          base_path = root / "docs/governance/REQUIRED_WORKFLOWS_V1.json"
          overlay_path = root / "docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json"

          def reject_pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise SystemExit(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise SystemExit(f"non-finite JSON number: {value}")

          def load(path: Path):
              return json.loads(
                  path.read_text(encoding="utf-8"),
                  object_pairs_hook=reject_pairs,
                  parse_constant=reject_constant,
              )

          def compact(value) -> bytes:
              return json.dumps(
                  value,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              ).encode("utf-8")

          def canonical_file(value) -> bytes:
              return compact(value) + b"\n"

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(
                  f"blob {len(data)}\0".encode("ascii") + data,
              ).hexdigest()

          candidate_blob = git_blob(candidate_path.read_bytes())
          base = load(base_path)
          overlay = load(overlay_path)
          hits = 0
          rows = [base.get("aggregate_workflow"), *base.get("workflows", [])]
          rows.extend(overlay.get("replace_workflows", []))
          rows.extend(overlay.get("add_workflows", []))
          for row in rows:
              if isinstance(row, dict) and row.get("path") == ".github/workflows/candidate-identity-manifest.yml":
                  row["git_blob_sha1"] = candidate_blob
                  hits += 1
          if hits != 1:
              raise SystemExit(f"candidate workflow manifest occurrence count={hits}")

          base_bytes = canonical_file(base)
          base_path.write_bytes(base_bytes)
          overlay["base_manifest_blob_sha1"] = git_blob(base_bytes)
          overlay.pop("overlay_sha256", None)
          overlay["overlay_sha256"] = hashlib.sha256(compact(overlay)).hexdigest()
          overlay_path.write_bytes(canonical_file(overlay))

          gate_path = root / "scripts/check-required-workflow-runs.py"
          spec = importlib.util.spec_from_file_location("candidate_receipt_manifest_gate", gate_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load workflow manifest gate")
          gate = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = gate
          spec.loader.exec_module(gate)
          manifest = gate.load_composed_manifest(base_path.relative_to(root))
          failures = gate.verify_files(root, manifest)
          if failures:
              raise SystemExit("; ".join(failures))

          print(json.dumps({
              "candidate_blob": candidate_blob,
              "base_blob": git_blob(base_path.read_bytes()),
              "overlay_blob": git_blob(overlay_path.read_bytes()),
              "regression_blob": git_blob(test_path.read_bytes()),
          }, sort_keys=True, separators=(",", ":")))
          PY

          expected=$(cat <<'EOF'
          .github/workflows/candidate-identity-manifest.yml
          docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json
          docs/governance/REQUIRED_WORKFLOWS_V1.json
          tests/control_plane/test_evidence_retention_workflows.py
          EOF
          )
          test "$(git diff --name-only | LC_ALL=C sort)" = "$expected"
          git diff --check

      - name: Execute focused and complete control corpus
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 -m unittest -v \
            tests.control_plane.test_evidence_retention_workflows \
            tests.control_plane.test_required_workflow_source_contract \
            tests.control_plane.test_workflow_manifest_overlay
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-plan.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"

      - name: Export exact validated payload
        shell: bash
        run: |
          set -euo pipefail
          export_repo="$GITHUB_WORKSPACE/tooling"
          packet="$export_repo/candidate-receipt-fix-payload"
          payload="$packet/root"
          rm -rf "$packet"
          mkdir -p "$packet"
          expected=$(cat <<'EOF'
          .github/workflows/candidate-identity-manifest.yml
          docs/governance/REQUIRED_WORKFLOWS_OVERLAY_V1.json
          docs/governance/REQUIRED_WORKFLOWS_V1.json
          tests/control_plane/test_evidence_retention_workflows.py
          EOF
          )
          while IFS= read -r path; do
            test -f "$GITHUB_WORKSPACE/source/$path"
            mkdir -p "$payload/$(dirname "$path")"
            cp "$GITHUB_WORKSPACE/source/$path" "$payload/$path"
            printf '%s\t%s\t%s\n' \
              "$path" \
              "$(git -C "$GITHUB_WORKSPACE/source" hash-object "$path")" \
              "$(sha256sum "$GITHUB_WORKSPACE/source/$path" | cut -d' ' -f1)"
          done <<< "$expected" | tee "$packet/IDENTITIES.tsv"

          cd "$export_repo"
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add candidate-receipt-fix-payload
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = 5
          git diff --cached --check
          git commit -m "tooling: export validated candidate receipt fix"
          test "$(git ls-remote origin "refs/heads/${EXPORT_BRANCH}" | cut -f1)" = "$GITHUB_SHA"
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${EXPORT_BRANCH}"
          printf 'export_head=%s\nexport_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
