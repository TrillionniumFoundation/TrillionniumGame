name: cex-semantic-export-fc8643d-20260910

on:
  push:
    branches:
      - ops/cex-semantic-export-fc8643d-20260910

permissions:
  contents: read

concurrency:
  group: cex-semantic-export-fc8643d-20260910
  cancel-in-progress: false

jobs:
  semantic_export:
    name: cex-semantic/exact-patched-source-export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CEX_REPOSITORY: TrillionniumFoundation/CEX
      CEX_COMMIT: fc8643d76e7c9ca2691712e39985c7b2ae06ad74
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact CEX source and runner helper
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cex"
          helper="$RUNNER_TEMP/helper"
          rm -rf "$root" "$helper"
          git init "$root"
          git -C "$root" remote add origin "https://github.com/${CEX_REPOSITORY}.git"
          git -C "$root" fetch --no-tags --depth=1 origin "$CEX_COMMIT"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$CEX_COMMIT"
          git init "$helper"
          git -C "$helper" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$helper" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$helper" checkout --detach FETCH_HEAD
          test "$(git -C "$helper" rev-parse HEAD)" = "$GITHUB_SHA"
          test -s "$helper/scripts/cex-semantic-compare.py"
          test -s "$helper/scripts/patch-cex-release-fixtures.py"
          test -z "$(git -C "$root" status --porcelain=v1 --untracked-files=no)"
          test -z "$(git -C "$helper" status --porcelain=v1 --untracked-files=no)"

      - name: Patch and verify release fixture semantics
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cex"
          helper="$RUNNER_TEMP/helper"
          target="$root/scripts/rust_advisory_packages_v5.py"
          before="$(sha256sum "$target" | awk '{print $1}')"
          python3 "$helper/scripts/patch-cex-release-fixtures.py" "$target"
          python3 -m py_compile "$target"
          (
            cd "$root"
            PYTHONPATH=scripts python3 - <<'PY'
          import rust_advisory_packages_v5 as module
          result = module._external_workflow_self_tests()
          assert result and all(result.values()), result
          print("CEX_EXTERNAL_WORKFLOW_SELF_TESTS=PASS", result)
          PY
          )
          after="$(sha256sum "$target" | awk '{print $1}')"
          test "$before" != "$after"
          git -C "$root" diff --check
          printf 'CEX_PATCH_SOURCE_SHA256_BEFORE=%s\n' "$before"
          printf 'CEX_PATCH_SOURCE_SHA256_AFTER=%s\n' "$after"

      - name: Generate and compare patched semantic contract
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cex"
          helper="$RUNNER_TEMP/helper"
          output="$RUNNER_TEMP/repository-contract-semantics-v1.json"
          (
            cd "$root"
            python3 scripts/generate-repository-semantics.py --stdout
          ) > "$output"
          python3 "$helper/scripts/cex-semantic-compare.py" \
            "$root/docs/repository-contract-semantics-v1.json" \
            "$output" \
            "$CEX_COMMIT"
          printf 'CEX_PATCHED_SEMANTIC_SHA256=%s\n' "$(sha256sum "$output" | awk '{print $1}')"
          printf 'CEX_PATCHED_SEMANTIC_BYTES=%s\n' "$(wc -c < "$output")"

      - name: Emit exact compressed object bytes
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/cex"
          output="$RUNNER_TEMP/repository-contract-semantics-v1.json"
          printf 'CEX_PATCHED_SOURCE_GZIP_BASE64_BEGIN\n'
          gzip -n -9 -c "$root/scripts/rust_advisory_packages_v5.py" | base64 -w 76
          printf '\nCEX_PATCHED_SOURCE_GZIP_BASE64_END\n'
          printf 'CEX_PATCHED_SEMANTIC_GZIP_BASE64_BEGIN\n'
          gzip -n -9 -c "$output" | base64 -w 76
          printf '\nCEX_PATCHED_SEMANTIC_GZIP_BASE64_END\n'
          printf 'PRODUCTION_AUTHORIZATION=not_granted\n'
