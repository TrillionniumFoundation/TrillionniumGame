name: remaining-source-wave-v3-export

on:
  push:
    branches: [tooling/remaining-source-wave-v3-2026-09-06]
    paths:
      - '.github/workflows/remaining-source-wave-v3-export.yml'

permissions:
  contents: write

jobs:
  merge-validate-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BASE_SHA: 7deee4377cff401854647151842c582f038feef1
      WAVE_V1: codex/remaining-source-blockers-wave-2026-09-06
      WAVE_V2: codex/remaining-source-blockers-wave-v2-2026-09-06
      PRODUCT_BRANCH: codex/remaining-source-blockers-wave-v3-2026-09-06
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Fetch exact cumulative source branches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/source"
          git init "$GITHUB_WORKSPACE/source"
          git -C "$GITHUB_WORKSPACE/source" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags origin \
            "$BASE_SHA" \
            "refs/heads/${WAVE_V1}:refs/remotes/origin/wave-v1" \
            "refs/heads/${WAVE_V2}:refs/remotes/origin/wave-v2"
          git -C "$GITHUB_WORKSPACE/source" checkout -b "$PRODUCT_BRANCH" "$BASE_SHA"
          for ref in wave-v1 wave-v2; do
            git -C "$GITHUB_WORKSPACE/source" merge-base --is-ancestor \
              "$BASE_SHA" "refs/remotes/origin/$ref"
          done
          printf 'base=%s\nwave_v1=%s\nwave_v2=%s\n' \
            "$BASE_SHA" \
            "$(git -C "$GITHUB_WORKSPACE/source" rev-parse refs/remotes/origin/wave-v1)" \
            "$(git -C "$GITHUB_WORKSPACE/source" rev-parse refs/remotes/origin/wave-v2)"

      - name: Three-way merge and squash to one parent
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git merge --no-ff -m 'temporary merge: source wave v1' refs/remotes/origin/wave-v1
          git merge --no-ff -m 'temporary merge: source wave v2' refs/remotes/origin/wave-v2
          test -z "$(git diff --name-only --diff-filter=U)"
          merged_tree=$(git rev-parse HEAD^{tree})
          git reset --soft "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git write-tree)" = "$merged_tree"
          git diff --cached --check
          git commit -m "feat: converge complete Plan v3.1 source blocker wave"
          test "$(git rev-list --count HEAD ^${BASE_SHA})" -eq 1
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

      - name: Install exact Rust toolchain
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate every Rust package and target
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          python3 scripts/check-rust-package-inventory.py
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

          while IFS= read -r manifest; do
            printf '### isolated/package manifest %s\n' "$manifest"
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done < <(find crates -mindepth 2 -maxdepth 2 -name Cargo.toml -print | LC_ALL=C sort)

      - name: Validate Go and complete repository control plane
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          files=$(find runtime -type f -name '*.go' -print | sort)
          test -n "$files"
          test -z "$(printf '%s\n' "$files" | xargs gofmt -l)"
          (cd runtime && go test ./... -count=1 && go test -race ./... -count=1 && go vet ./...)

          python3 -m compileall -q scripts tools tests
          python3 scripts/check-workflow-action-policy.py
          python3 scripts/check-repository-hygiene.py
          python3 scripts/check-rust-package-inventory.py
          python3 scripts/check-trnm-server.py
          python3 scripts/check-documentation-authority.py
          python3 scripts/check-plan.py
          python3 scripts/check-status-transitions.py
          python3 scripts/check-evidence-index.py
          python3 scripts/check-gap-register.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/full-python.log"
          grep -Eq '^Ran [1-9][0-9]* tests in ' "$RUNNER_TEMP/full-python.log"
          grep -qx OK "$RUNNER_TEMP/full-python.log"

      - name: Verify critical source frontier exists
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          test -f crates/trnm-persistence-core/tests/outbox_state_model.rs
          test -f crates/trnm-presence-router-v2/src/session_registry.rs
          test -f crates/trnm-server/src/runtime/server.rs
          test ! -e crates/trnm-persistence-pg/src/bin/trnm-server.rs
          test ! -e crates/trnm-persistence-pg/src/bin/trnm_server
          grep -R -q 'indeterminate' crates --include='*.rs'
          grep -R -q 'revoked_through' crates --include='*.rs'
          grep -R -q 'connection_generation' crates --include='*.rs'
          grep -R -q 'write_fence' crates --include='*.rs'
          git diff --check "$BASE_SHA" HEAD

      - name: Publish exact single-parent source candidate
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: basic ${auth_header}" \
            push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
          printf 'product_head=%s\nproduct_tree=%s\nparent=%s\nchanged_paths=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse HEAD^{tree})" \
            "$(git rev-parse HEAD^)" \
            "$(git diff --name-only "$BASE_SHA" HEAD | wc -l | tr -d ' ')"
