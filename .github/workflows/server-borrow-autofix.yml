name: server-borrow-autofix

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29
    paths:
      - '.github/workflows/server-borrow-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: server-borrow-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: feat/plan-v3-gap-closure-2026-08-29
      EXPECTED_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact feature head without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "refs/heads/${BRANCH}"
          git -C "$GITHUB_WORKSPACE" checkout -B "$BRANCH" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          cd "$GITHUB_WORKSPACE"
      - name: Own request-line fields before body-buffer growth
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trnm-server/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    let method = request_parts.next().ok_or(ProtocolError::InvalidHeader)?;
              let path = request_parts.next().ok_or(ProtocolError::InvalidHeader)?;
              let version = request_parts.next().ok_or(ProtocolError::InvalidHeader)?;
              if request_parts.next().is_some()
                  || !matches!(version, "HTTP/1.0" | "HTTP/1.1")
                  || !matches!(method, "GET" | "POST")
                  || !path.starts_with('/')
          '''
          # Account for the canonical four-space source indentation rather than
          # relying on a broad parser rewrite.
          old = old.replace('              ', '    ')
          new = '''    let method = request_parts
                  .next()
                  .ok_or(ProtocolError::InvalidHeader)?
                  .to_owned();
              let path = request_parts
                  .next()
                  .ok_or(ProtocolError::InvalidHeader)?
                  .to_owned();
              let version = request_parts.next().ok_or(ProtocolError::InvalidHeader)?;
              if request_parts.next().is_some()
                  || !matches!(version, "HTTP/1.0" | "HTTP/1.1")
                  || !matches!(method.as_str(), "GET" | "POST")
                  || !path.starts_with('/')
          '''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('expected request-line block not found exactly')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format, test and lint the standalone server
        run: |
          set -euo pipefail
          cargo fmt --manifest-path crates/trnm-server/Cargo.toml
          cargo test --manifest-path crates/trnm-server/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path crates/trnm-server/Cargo.toml --all-targets --locked -- -D warnings
          python3 scripts/check-rust-server-vertical-slice.py
      - name: Commit verified source fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat -- crates/trnm-server
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/trnm-server
          git commit -m 'fix(server): own request line before body buffer growth'
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${BRANCH}"
