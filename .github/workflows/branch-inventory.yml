name: branch-inventory

on:
  pull_request:
    paths:
      - 'docs/governance/ACTIVE_BRANCHES.json'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'docs/GOVERNANCE.md'
      - 'scripts/generate-branch-inventory.py'
      - 'scripts/verify-branch-inventory-log.py'
      - 'scripts/verify-branch-inventory-stable.py'
      - 'scripts/emit-actions-log-artifact.py'
      - 'tests/control_plane/test_branch_inventory.py'
      - 'tests/control_plane/test_branch_inventory_stable.py'
      - '.github/workflows/branch-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'docs/governance/ACTIVE_BRANCHES.json'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'docs/GOVERNANCE.md'
      - 'scripts/generate-branch-inventory.py'
      - 'scripts/verify-branch-inventory-log.py'
      - 'scripts/verify-branch-inventory-stable.py'
      - 'scripts/emit-actions-log-artifact.py'
      - 'tests/control_plane/test_branch_inventory.py'
      - 'tests/control_plane/test_branch_inventory_stable.py'
      - '.github/workflows/branch-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: branch-inventory-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-ref-inventory:
    name: exact-ref-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Fetch all branch heads without mutation
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch --force --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*'

      - name: Generate non-destructive inventory
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 -m py_compile \
            scripts/generate-branch-inventory.py \
            scripts/verify-branch-inventory-log.py \
            scripts/verify-branch-inventory-stable.py \
            scripts/emit-actions-log-artifact.py
          python3 -m unittest \
            tests.control_plane.test_branch_inventory \
            tests.control_plane.test_branch_inventory_stable -v
          python3 scripts/generate-branch-inventory.py \
            --output run/governance/branch-inventory.json
          jq -e '
            .schema == "trillionnium.branch-inventory.v2" and
            .candidate.commit == env.CANDIDATE_SHA and
            .branch_count > 0 and
            .active_branch_registry.branch_count > 0 and
            .policy.deletion_executed == false and
            .policy.history_rewritten == false and
            .policy.independent_review_required == true and
            .policy.before_after_manifests_required == true and
            .policy.nonancestor_may_be_deleted == false and
            .policy.active_branch_may_be_deleted == false and
            .claims.inventory_generated == true and
            .claims.inventory_retained_and_verified == false and
            .claims.disposition_reviewed == false and
            .claims.cleanup_complete == false and
            .claims.sg0_complete == false
          ' run/governance/branch-inventory.json >/dev/null
          (
            cd run/governance
            sha256sum branch-inventory.json > SHA256SUMS
          )

      - name: Seal complete branch inventory in retained job log
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          archive="$RUNNER_TEMP/branch-inventory.tar.gz"
          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            -C run/governance \
            branch-inventory.json \
            SHA256SUMS \
            | gzip -n > "$archive"
          test -s "$archive"
          python3 scripts/emit-actions-log-artifact.py \
            "$archive" \
            --name "branch-inventory-${CANDIDATE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --max-bytes 2097152 \
            --metadata-json "$RUNNER_TEMP/branch-inventory-envelope.json"
          jq -e '
            .repository == env.CANDIDATE_REPOSITORY and
            .commit == env.CANDIDATE_SHA and
            .run_id == env.GITHUB_RUN_ID and
            .run_attempt == env.GITHUB_RUN_ATTEMPT and
            .job == env.GITHUB_JOB and
            .size > 0 and
            .claims.compatibility_credit == false and
            .claims.production_ready == false
          ' "$RUNNER_TEMP/branch-inventory-envelope.json" >/dev/null

  verify-retained-inventory:
    name: verify-retained-inventory
    needs: exact-ref-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Fetch all branch heads for independent revalidation
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch --force --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*'

      - name: Reconstruct and verify retained before-state
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          output='run/governance/verified-branch-inventory.json'
          python3 scripts/verify-branch-inventory-stable.py \
            --repository "$CANDIDATE_REPOSITORY" \
            --head-sha "$CANDIDATE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$output"
          jq -e '
            .schema == "trillionnium.branch-inventory-retained-log-verification.v1" and
            .repository == env.CANDIDATE_REPOSITORY and
            .head_sha == env.CANDIDATE_SHA and
            .branch_count > 0 and
            .captured_branch_count == .branch_count and
            .live_branch_count >= .captured_branch_count and
            .concurrent_addition_count >= 0 and
            .concurrent_addition_count <= 128 and
            .concurrent_removed_branch_count == 0 and
            .concurrent_moved_branch_count == 0 and
            .captured_remote_refs_reverified == true and
            .active_branch_count > 0 and
            .complete_before_state_retained == true and
            .live_remote_ref_set_reverified == true and
            .deletion_executed == false and
            .history_rewritten == false and
            .disposition_reviewed == false and
            .cleanup_complete == false and
            .sg0_complete == false
          ' "$output" >/dev/null
          sha256sum "$output" | tee "$RUNNER_TEMP/verified-branch-inventory.sha256"
          {
            printf '### Verified branch before-state\n\n'
            printf 'Every captured ref was re-read unchanged. Bounded branches created after the immutable producer snapshot are recorded as concurrent additions; deletion or movement of a captured ref fails verification. No disposition acceptance, SG0, compatibility or production credit is granted.\n\n'
            printf '```json\n'
            jq -c '{
              schema,
              repository,
              head_sha,
              head_tree,
              run_id,
              run_attempt,
              producer_job_id,
              archive_sha256,
              inventory_sha256,
              branch_count,
              captured_branch_count,
              live_branch_count,
              concurrent_addition_count,
              concurrent_additions,
              concurrent_removed_branch_count,
              concurrent_moved_branch_count,
              captured_remote_refs_reverified,
              active_branch_count,
              unique_tip_count,
              unique_tree_count,
              disposition_counts,
              complete_before_state_retained,
              live_remote_ref_set_reverified,
              deletion_executed,
              cleanup_complete,
              sg0_complete
            }' "$output"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
