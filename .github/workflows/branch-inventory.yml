name: branch-inventory

on:
  pull_request:
    paths:
      - 'scripts/generate-branch-inventory.py'
      - 'docs/governance/BRANCH_DISPOSITION_CONTRACT.md'
      - '.github/workflows/branch-inventory.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-inventory-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-ref-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Fetch all branch heads without mutation
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Generate non-destructive inventory
        run: |
          set -euo pipefail
          python3 scripts/generate-branch-inventory.py \
            --output run/governance/branch-inventory.json
          jq -e '
            .policy.deletion_executed == false and
            .policy.history_rewritten == false and
            .policy.independent_review_required == true and
            .claims.inventory_generated == true and
            .claims.disposition_reviewed == false and
            .claims.cleanup_complete == false
          ' run/governance/branch-inventory.json >/dev/null
          sha256sum run/governance/branch-inventory.json \
            > run/governance/SHA256SUMS
      - name: Record exact-head diagnostic digest (no artifact credit)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target='run/governance'
          test -e "$target"
          manifest="$RUNNER_TEMP/diagnostic-SHA256SUMS"
          if [[ -d "$target" ]]; then
            mapfile -d '' files < <(find "$target" -type f -print0 | sort -z)
            test "${#files[@]}" -gt 0
            sha256sum "${files[@]}" | tee "$manifest"
          else
            sha256sum "$target" | tee "$manifest"
          fi
          printf '### Diagnostic evidence only\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'This job did not upload a persistent artifact and grants no compatibility or production credit.\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$manifest" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
