name: temporary-shared-app-metrics-v2

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-shared-app-metrics-v2
  cancel-in-progress: false

jobs:
  patch-verify-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Apply shared application metrics and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path_text: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_text)
              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} anchors, found {count} for {old!r}"
                  )
              path.write_text(source.replace(old, new, expected), encoding="utf-8")

          app = "crates/trnm-persistence-pg/src/bin/trnm_server/app.rs"
          replace_exact(
              app,
              "use trnm_contracts::{\n",
              "use std::sync::{Arc, Mutex};\n\nuse trnm_contracts::{\n",
          )
          replace_exact(
              app,
              '''impl Metrics {
              fn increment(value: &mut u64) {
                  *value = value.saturating_add(1);
              }
          }
          ''',
              '''impl Metrics {
              fn increment(value: &mut u64) {
                  *value = value.saturating_add(1);
              }
          }

          #[derive(Clone, Debug, Default)]
          pub(crate) struct SharedAppMetrics(Arc<Mutex<Metrics>>);

          impl SharedAppMetrics {
              fn increment(&self, field: fn(&mut Metrics) -> &mut u64) {
                  let mut metrics = self
                      .0
                      .lock()
                      .unwrap_or_else(std::sync::PoisonError::into_inner);
                  Metrics::increment(field(&mut metrics));
              }

              fn snapshot(&self) -> Metrics {
                  *self
                      .0
                      .lock()
                      .unwrap_or_else(std::sync::PoisonError::into_inner)
              }
          }
          ''',
          )
          replace_exact(app, "    metrics: Metrics,\n", "    metrics: SharedAppMetrics,\n")
          replace_exact(
              app,
              '''    pub fn new(repository: R, admin_token: String) -> Self {
                  Self {
                      repository,
                      admin_token,
                      sessions: SessionApi::default(),
                      draining: false,
                      metrics: Metrics::default(),
                  }
              }
          ''',
              '''    pub fn new(repository: R, admin_token: String) -> Self {
                  Self::with_shared_metrics(repository, admin_token, SharedAppMetrics::default())
              }

              #[must_use]
              pub(crate) fn with_shared_metrics(
                  repository: R,
                  admin_token: String,
                  metrics: SharedAppMetrics,
              ) -> Self {
                  Self {
                      repository,
                      admin_token,
                      sessions: SessionApi::default(),
                      draining: false,
                      metrics,
                  }
              }
          ''',
          )
          fields = (
              "requests",
              "successes",
              "input_failures",
              "domain_failures",
              "bootstraps",
              "commands_applied",
              "command_replays",
              "drain_requests",
          )
          for field in fields:
              replace_exact(
                  app,
                  f"Metrics::increment(&mut self.metrics.{field});",
                  f"self.metrics.increment(|metrics| &mut metrics.{field});",
              )
          replace_exact(
              app,
              '''    fn metrics_response(&self) -> Response {
                  let ready = u8::from(!self.draining);
                  let repository = self.repository.operational_metrics();
          ''',
              '''    fn metrics_response(&self) -> Response {
                  let ready = u8::from(!self.draining);
                  let metrics = self.metrics.snapshot();
                  let repository = self.repository.operational_metrics();
          ''',
          )
          for field in fields:
              replace_exact(app, f"self.metrics.{field},", f"metrics.{field},")
          replace_exact(
              app,
              '''    #[test]
              fn admin_token_comparison_rejects_a_256_byte_length_delta() {
          ''',
              '''    #[test]
              fn shared_metrics_aggregate_across_app_instances() {
                  let token = token();
                  let metrics = SharedAppMetrics::default();
                  let mut first = App::with_shared_metrics(
                      FakeRepository::default(),
                      token.clone(),
                      metrics.clone(),
                  );
                  let mut second = App::with_shared_metrics(
                      FakeRepository::default(),
                      token.clone(),
                      metrics,
                  );
                  let response = first.handle(&Request::new(
                      "POST",
                      "/v1/authority/commit",
                      headers(&token),
                      commit_body(),
                  ));
                  assert_eq!(response.status, 201);
                  let response = second.handle(&Request::new(
                      "GET",
                      "/metrics",
                      BTreeMap::new(),
                      Vec::new(),
                  ));
                  let body = String::from_utf8(response.body).unwrap();
                  assert!(body.contains("trnm_server_commands_applied_total 1"));
              }

              #[test]
              fn admin_token_comparison_rejects_a_256_byte_length_delta() {
          ''',
          )

          server = "crates/trnm-persistence-pg/src/bin/trnm_server/server.rs"
          replace_exact(
              server,
              "use super::app::{App, Repository};\n",
              "use super::app::{App, Repository, SharedAppMetrics};\n",
          )
          replace_exact(
              server,
              '''    let worker_failed = Arc::new(AtomicBool::new(false));
              let mut workers = Vec::with_capacity(worker_count);
          ''',
              '''    let worker_failed = Arc::new(AtomicBool::new(false));
              let metrics = SharedAppMetrics::default();
              let mut workers = Vec::with_capacity(worker_count);
          ''',
          )
          replace_exact(
              server,
              "        let worker_failed = Arc::clone(&worker_failed);\n",
              "        let worker_failed = Arc::clone(&worker_failed);\n"
              "        let worker_metrics = metrics.clone();\n",
          )
          replace_exact(
              server,
              '''                            worker_receiver,
                                      worker_draining,
                                  );
          ''',
              '''                            worker_receiver,
                                      worker_draining,
                                      worker_metrics,
                                  );
          ''',
          )
          replace_exact(
              server,
              '''    receiver: Arc<Mutex<Receiver<TcpStream>>>,
              draining: Arc<AtomicBool>,
          ) where
          ''',
              '''    receiver: Arc<Mutex<Receiver<TcpStream>>>,
              draining: Arc<AtomicBool>,
              metrics: SharedAppMetrics,
          ) where
          ''',
          )
          replace_exact(
              server,
              "    let mut app = App::new(repository, config.admin_token.clone());\n",
              '''    let mut app =
                  App::with_shared_metrics(repository, config.admin_token.clone(), metrics);
          ''',
          )

          for temporary in (
              Path(".github/workflows/temporary-shared-process-metrics.yml"),
              Path(".github/workflows/temporary-shared-app-metrics-v2.yml"),
          ):
              if not temporary.is_file():
                  raise SystemExit(f"temporary workflow is missing: {temporary}")
              temporary.unlink()
          PY
          test ! -e .github/workflows/temporary-shared-process-metrics.yml
          test ! -e .github/workflows/temporary-shared-app-metrics-v2.yml
          git diff --check

      - name: Validate exact source corpus
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1
          cargo fmt --all
          git diff --check
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit verified clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-shared-process-metrics.yml
          test ! -e .github/workflows/temporary-shared-app-metrics-v2.yml
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix(server): aggregate metrics across concurrent workers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
