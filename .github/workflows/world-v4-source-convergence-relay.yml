name: World V4 direct-source convergence relay

on:
  push:
    branches:
      - ci/world-v4-source-convergence-relay-20260830
    paths:
      - '.github/workflows/world-v4-source-convergence-relay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: world-v4-direct-source-relay
  cancel-in-progress: false

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_BRANCH: fix/world-plan-v4-convergence-2026-08-30
  WORLD_HEAD: 2e6858d4556b2eee628bb7270337f66fc9529dd8
  WORLD_TREE: 3040d7c35fda6e325d91085d46248b01e85e8138
  WORLD_TEMPLATE_BLOB: 8882f47db55ca5993329594901c828c6faf325a8
  WORLD_BUILD_BLOB: abc8d4228123e13a3dc5e3e154467a7d2b67e2ee
  WORLD_CARGO_BLOB: d27f7eb6a06bc3b8ceb13e31edacc72d3f58262f
  RUST_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  converge:
    name: exact-tree direct-source conversion and validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require cross-repository write credential
        env:
          WORLD_TOKEN: ${{ secrets.WORLD_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORLD_TOKEN" || {
            echo 'WORLD_REPO_TOKEN is unavailable to this isolated relay' >&2
            exit 1
          }

      - name: Checkout exact World package branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.WORLD_REPOSITORY }}
          ref: ${{ env.WORLD_BRANCH }}
          path: world
          fetch-depth: 0
          token: ${{ secrets.WORLD_REPO_TOKEN }}
          persist-credentials: true

      - name: Revalidate immutable World identity and source inputs
        working-directory: world
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORLD_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$WORLD_TREE"
          test -z "$(git status --porcelain)"
          bash scripts/project-preflight.sh --audit
          crate='trillionnium/crates/trnm-game-server'
          test "$(git hash-object "$crate/src/lib.rs.in")" = "$WORLD_TEMPLATE_BLOB"
          test "$(git hash-object "$crate/build.rs")" = "$WORLD_BUILD_BLOB"
          test "$(git hash-object "$crate/Cargo.toml")" = "$WORLD_CARGO_BLOB"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version

      - name: Materialize reviewed source as directly compiled source
        working-directory: world
        shell: bash
        run: |
          set -euo pipefail
          crate='trillionnium/crates/trnm-game-server'
          out="$RUNNER_TEMP/world-v4-direct-source"
          mkdir -p "$out"
          rustc --edition=2021 "$crate/build.rs" -o "$out/materialize-game-server"
          OUT_DIR="$out" CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/world/$crate" \
            "$out/materialize-game-server"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          crate = Path('trillionnium/crates/trnm-game-server')
          template = (crate / 'src/lib.rs.in').read_text(encoding='utf-8')
          generated = (Path(os.environ['RUNNER_TEMP']) /
                       'world-v4-direct-source/trnm_game_server_lib_generated.rs').read_text(encoding='utf-8')
          marker = 'use axum::extract::DefaultBodyLimit;\n'
          if template.count(marker) != 1 or not generated.startswith(marker):
              raise SystemExit('reviewed source header/body boundary drifted')
          direct = template.split(marker, 1)[0] + generated
          direct = re.sub(
              r'include_str!\(concat!\(::std::env!\("CARGO_MANIFEST_DIR"\), "/migrations/([^"]+)"\)\)',
              r'include_str!("../migrations/\1")',
              direct,
          )
          required = (
              'const MIGRATION_V16:',
              'const MIGRATION_V17:',
              'const MIGRATION_V18:',
              'const MIGRATION_V19:',
              '(16, "0016_online_settlement_outbox_v1", MIGRATION_V16)',
              '"0017_online_settlement_worker_runtime_v1"',
              '"0018_online_settlement_operator_controls_v1"',
              '"0019_online_settlement_quarantine_v1"',
              'terminal settlement is owned by trnm-settlement-worker; in-process settlement is prohibited',
          )
          forbidden = (
              'include!(concat!(env!("OUT_DIR")',
              'trnm_game_server_lib_generated.rs',
              'reconcile_economy(&state.cex',
              'settle_pending_matches(&settlement_state',
          )
          for needle in required:
              if needle not in direct:
                  raise SystemExit(f'direct source omitted {needle!r}')
          for needle in forbidden:
              if needle in direct:
                  raise SystemExit(f'direct source retained {needle!r}')
          (crate / 'src/lib.rs').write_text(direct, encoding='utf-8')
          (crate / 'src/lib.rs.in').unlink()
          (crate / 'build.rs').unlink()
          cargo_path = crate / 'Cargo.toml'
          cargo = cargo_path.read_text(encoding='utf-8')
          if cargo.count('build = "build.rs"\n') != 1:
              raise SystemExit('Cargo build declaration drifted')
          cargo_path.write_text(cargo.replace('build = "build.rs"\n', '', 1), encoding='utf-8')
          PY
          rustfmt --edition 2021 "$crate/src/lib.rs"

      - name: Prove direct-source boundary and exact settlement ownership
        working-directory: world
        shell: bash
        run: |
          set -euo pipefail
          crate='trillionnium/crates/trnm-game-server'
          test -f "$crate/src/lib.rs"
          test ! -e "$crate/src/lib.rs.in"
          test ! -e "$crate/build.rs"
          ! grep -Fq 'build = "build.rs"' "$crate/Cargo.toml"
          for needle in \
            'const MIGRATION_V16:' \
            'const MIGRATION_V17:' \
            'const MIGRATION_V18:' \
            'const MIGRATION_V19:' \
            '0016_online_settlement_outbox_v1' \
            '0017_online_settlement_worker_runtime_v1' \
            '0018_online_settlement_operator_controls_v1' \
            '0019_online_settlement_quarantine_v1' \
            'terminal settlement is owned by trnm-settlement-worker; in-process settlement is prohibited'
          do
            grep -Fq "$needle" "$crate/src/lib.rs"
          done
          ! grep -Fq 'include!(concat!(env!("OUT_DIR")' "$crate/src/lib.rs"
          ! grep -Fq 'trnm_game_server_lib_generated.rs' "$crate/src/lib.rs"
          ! grep -Fq 'reconcile_economy(&state.cex' "$crate/src/lib.rs"
          ! grep -Fq 'settle_pending_matches(&settlement_state' "$crate/src/lib.rs"
          rustfmt --edition 2021 --check "$crate/src/lib.rs"

      - name: Compile directly reviewed World source
        working-directory: world/trillionnium
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p trnm-game-server --lib --locked
          cargo check --workspace --all-targets --locked

      - name: Run game-server and settlement validation bundle
        working-directory: world/trillionnium
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p trnm-game-server --lib --locked
          cargo test -p trnm-game-server --test settlement_game_server_boundary --locked
          cargo test -p trnm-game-server --test settlement_worker_contract --locked
          cargo test -p trnm-game-server --test settlement_fault_model --locked

      - name: Commit only the bounded World source conversion
        working-directory: world
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'trillionnium/crates/trnm-game-server/Cargo.toml',
              'trillionnium/crates/trnm-game-server/build.rs',
              'trillionnium/crates/trnm-game-server/src/lib.rs',
              'trillionnium/crates/trnm-game-server/src/lib.rs.in',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected conversion paths: {sorted(changed ^ expected)}')
          PY
          git config user.name 'trillionnium-world-source-bot'
          git config user.email 'world-source-bot@users.noreply.github.com'
          git add \
            trillionnium/crates/trnm-game-server/Cargo.toml \
            trillionnium/crates/trnm-game-server/build.rs \
            trillionnium/crates/trnm-game-server/src/lib.rs \
            trillionnium/crates/trnm-game-server/src/lib.rs.in
          git commit -m 'fix(world): materialize direct game-server source'
          test "$(git rev-parse HEAD^)" = "$WORLD_HEAD"
          git push origin "HEAD:$WORLD_BRANCH"
          {
            echo '### World direct-source convergence'
            echo "- parent: \`$WORLD_HEAD\`"
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- tree: \`$(git rev-parse 'HEAD^{tree}')\`"
            echo "- lib.rs blob: \`$(git hash-object trillionnium/crates/trnm-game-server/src/lib.rs)\`"
          } >> "$GITHUB_STEP_SUMMARY"
