name: World V4 direct-source convergence relay

on:
  pull_request:
    branches:
      - ci/world-v4-source-convergence-relay-20260830
    paths:
      - '.github/world-v4-source-convergence-trigger'

permissions:
  contents: read

jobs:
  startup-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm trusted base workflow starts
        run: echo world-v4-relay-started
