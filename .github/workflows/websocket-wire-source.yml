name: websocket-wire-source

on:
  pull_request:
    paths:
      - 'crates/trnm-realtime-wire/**'
      - 'contracts/realtime/websocket-wire-v1.json'
      - 'docs/development/WEBSOCKET_WIRE_SOURCE_V1.md'
      - '.github/workflows/websocket-wire-source.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-realtime-wire/**'
      - 'contracts/realtime/websocket-wire-v1.json'
      - 'docs/development/WEBSOCKET_WIRE_SOURCE_V1.md'
      - '.github/workflows/websocket-wire-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websocket-wire-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-frame-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate structured claim boundary
        run: |
          set -euo pipefail
          jq -e '
            .status == "source-candidate" and
            .maximum_payload_bytes == 131072 and
            .claims.source_candidate == true and
            .claims.frame_boundary_defined == true and
            .claims.websocket_server_implemented == false and
            .claims.realtime_wire_compatible == false and
            .claims.multi_node_verified == false and
            .claims.production_ready == false
          ' contracts/realtime/websocket-wire-v1.json >/dev/null
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format
        run: cargo fmt --manifest-path crates/trnm-realtime-wire/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/trnm-realtime-wire/Cargo.toml --all-targets --locked
      - name: Strict lint
        run: cargo clippy --manifest-path crates/trnm-realtime-wire/Cargo.toml --all-targets --locked -- -D warnings
