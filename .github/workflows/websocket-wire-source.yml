name: websocket-wire-source

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'crates/trnm-realtime-wire/**'
      - 'crates/trnm-persistence-pg/Cargo.toml'
      - 'crates/trnm-persistence-pg/src/bin/trnm_server/websocket.rs'
      - 'contracts/realtime/websocket-wire-v1.json'
      - 'contracts/realtime/trnm-authority-envelope-v1.proto'
      - 'docs/ARCHITECTURE.md'
      - 'docs/COMPATIBILITY.md'
      - 'docs/DOCUMENTATION_AUTHORITY.json'
      - 'scripts/check-trnm-server.py'
      - 'Cargo.lock'
      - '.github/workflows/websocket-wire-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: websocket-wire-source-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  bounded-persistent-codec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate structured claim boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .status == "source-candidate" and
            .maximum_payload_bytes == 131072 and
            .maximum_messages_per_connection == 64 and
            .protobuf_envelope.schema_path == "contracts/realtime/trnm-authority-envelope-v1.proto" and
            .protobuf_envelope.nakama_schema == false and
            .claims.source_candidate == true and
            .claims.frame_boundary_defined == true and
            .claims.websocket_server_source_candidate == true and
            .claims.persistent_connection_source_candidate == true and
            .claims.protobuf_envelope_source_candidate == true and
            .claims.official_nakama_protobuf_implemented == false and
            .claims.grpc_implemented == false and
            .claims.realtime_wire_compatible == false and
            .claims.multi_node_verified == false and
            .claims.production_ready == false
          ' contracts/realtime/websocket-wire-v1.json >/dev/null
          grep -Fq 'message AuthorityCommandEnvelope' contracts/realtime/trnm-authority-envelope-v1.proto
          grep -Fq 'message AuthorityResponseEnvelope' contracts/realtime/trnm-authority-envelope-v1.proto
          grep -Fq 'trnm-realtime-wire = { path = "../trnm-realtime-wire" }' crates/trnm-persistence-pg/Cargo.toml
          grep -Fq 'const PROTOBUF_SUBPROTOCOL: &str = "trnm.protobuf.v1";' crates/trnm-persistence-pg/src/bin/trnm_server/websocket.rs
          grep -Fq 'const MAX_MESSAGES_PER_CONNECTION: usize = 64;' crates/trnm-persistence-pg/src/bin/trnm_server/websocket.rs
          grep -Fq 'Opcode::Ping' crates/trnm-persistence-pg/src/bin/trnm_server/websocket.rs
          grep -Fq 'Opcode::Pong' crates/trnm-persistence-pg/src/bin/trnm_server/websocket.rs
      - name: Install exact Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format standalone codec
        run: cargo fmt --manifest-path crates/trnm-realtime-wire/Cargo.toml -- --check
      - name: Test standalone codec
        run: cargo test --manifest-path crates/trnm-realtime-wire/Cargo.toml --all-targets --locked
      - name: Strict lint standalone codec
        run: cargo clippy --manifest-path crates/trnm-realtime-wire/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test integrated server target
        run: cargo test --package trnm-persistence-pg --bin trnm-server --locked
      - name: Strict lint integrated server target
        run: cargo clippy --package trnm-persistence-pg --bin trnm-server --locked -- -D warnings
