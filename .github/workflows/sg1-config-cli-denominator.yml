name: trillionnium-game-config-cli-denominator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/denominator/go_config_surface.go'
      - 'scripts/generate-config-cli-denominator.py'
      - 'scripts/check-config-cli-denominator.sh'
      - 'tests/denominator/test_config_cli_denominator.py'
      - 'docs/development/CONFIG_CLI_DENOMINATOR_IMPLEMENTATION.md'
      - '.github/workflows/sg1-config-cli-denominator.yml'
  push:
    branches: [main]
    paths:
      - 'tools/denominator/go_config_surface.go'
      - 'scripts/generate-config-cli-denominator.py'
      - 'scripts/check-config-cli-denominator.sh'
      - 'tests/denominator/test_config_cli_denominator.py'
      - 'docs/development/CONFIG_CLI_DENOMINATOR_IMPLEMENTATION.md'
      - '.github/workflows/sg1-config-cli-denominator.yml'

permissions:
  contents: read

concurrency:
  group: trillionnium-game-config-cli-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-config-cli-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "refs/heads/${CANDIDATE_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'
      - name: Validate extractors and negative fixtures
        run: bash scripts/check-config-cli-denominator.sh
      - name: Fetch and verify exact Nakama source tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fetch-pinned-upstream.py \
            --repository heroiclabs/nakama \
            --revision d4d92f93f78bbbe62c7fc50a3f85c772ec121a09 \
            --tree f3c9cfc2726d5543da1564629170f35b98e3797d \
            --output run/upstream/nakama
      - name: Generate exact candidates twice
        run: |
          set -euo pipefail
          python3 scripts/generate-config-cli-denominator.py \
            --nakama-dir run/upstream/nakama \
            --output-dir run/candidate-a
          python3 scripts/generate-config-cli-denominator.py \
            --nakama-dir run/upstream/nakama \
            --output-dir run/candidate-b
          diff -ru run/candidate-a run/candidate-b
      - name: Validate nonempty fail-closed candidates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('run/candidate-a/config-denominator.candidate.json').read_text())
          cli = json.loads(Path('run/candidate-a/cli-denominator.candidate.json').read_text())
          assert config['leaf_count'] >= 100, config['leaf_count']
          assert cli['leaf_count'] >= 20, cli['leaf_count']
          assert config['counts_by_class'].get('config_field', 0) >= 75
          assert config['counts_by_class'].get('config_validation', 0) >= 20
          assert cli['counts_by_class'].get('cli_generated_flag_candidate', 0) >= 50
          for value in (config, cli):
              assert value['unclassified_count'] == value['leaf_count']
              assert value['unreviewed_count'] == value['leaf_count']
              assert not any(value['claims'].values())
          PY
      - name: Prove candidates cannot close SG1
        run: |
          set -euo pipefail
          if python3 scripts/generate-config-cli-denominator.py \
              --nakama-dir run/upstream/nakama \
              --output-dir run/sg1-negative \
              --require-sg1; then
            echo 'Config/CLI candidates incorrectly received SG1 credit' >&2
            exit 1
          fi
      - name: Seal exact-head candidate evidence in immutable log
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf run/config-cli-denominator-${CANDIDATE_SHA}.tar.gz \
            -C run/candidate-a .
          printf 'repository=%s\nhead_sha=%s\nrun_id=%s\n' \
            "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$GITHUB_RUN_ID"
          sha256sum run/config-cli-denominator-${CANDIDATE_SHA}.tar.gz
          find run/candidate-a -type f -print0 | sort -z | xargs -0 sha256sum
