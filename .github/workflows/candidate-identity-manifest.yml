name: candidate-identity-manifest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-identity-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-candidate-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Generate exact manifest
        env:
          TRNM_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/generate-candidate-manifest.py \
            --output run/candidate/candidate-manifest.json
          python3 -m json.tool run/candidate/candidate-manifest.json >/dev/null
          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            '.repository == "TrillionniumFoundation/TrillionniumGame" and
             .commit == $sha and
             (.tree | length) == 40 and
             .claim_boundary.exact_source_identity_recorded == true and
             .claim_boundary.source_validation_executed == false and
             .claim_boundary.independently_reviewed == false and
             .claim_boundary.compatibility_credit == false and
             .claim_boundary.production_ready == false' \
            run/candidate/candidate-manifest.json >/dev/null
          sha256sum run/candidate/candidate-manifest.json \
            > run/candidate/SHA256SUMS
      - name: Record exact-head diagnostic digest (no artifact credit)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          target='run/candidate'
          test -e "$target"
          manifest="$RUNNER_TEMP/diagnostic-SHA256SUMS"
          if [[ -d "$target" ]]; then
            mapfile -d '' files < <(find "$target" -type f -print0 | sort -z)
            test "${#files[@]}" -gt 0
            sha256sum "${files[@]}" | tee "$manifest"
          else
            sha256sum "$target" | tee "$manifest"
          fi
          printf '### Diagnostic evidence only\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'This job did not upload a persistent artifact and grants no compatibility or production credit.\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$manifest" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
