name: temporary-final-mechanical-closure-20260831

on:
  push:
    branches:
      - feat/plan-v3-gap-closure-2026-08-29

permissions:
  contents: write

concurrency:
  group: temporary-final-mechanical-closure-20260831
  cancel-in-progress: false

jobs:
  repair-verify-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch exact branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout -B "$GITHUB_REF_NAME" FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" show -s --format='commit=%H%ntree=%T'

      - name: Remove transient closure scaffolding
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'temporary-*' -o -iname '*rescue*' \) -print -delete
          if [[ -d .github/tmp ]]; then
            find .github/tmp -type f -name 'pg-operations-patch.*' -print -delete
            find .github/tmp -depth -type d -empty -delete
          fi

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.85.1

      - name: Apply only machine-applicable formatting and lint fixes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
          git diff --check

      - name: Verify root Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify standalone Rust workspaces
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            crates/trnm-token-jwt-adapter/Cargo.toml \
            crates/trnm-presence-router-v2/Cargo.toml \
            crates/trnm-server/Cargo.toml
          do
            [[ -f "$manifest" ]] || continue
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done

      - name: Verify control-plane and Python corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-plan.py
          python3 scripts/check-workflow-action-policy.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify every Go module
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            directory=${module%/go.mod}
            (
              cd "$directory"
              gofmt_check=$(gofmt -l .)
              test -z "$gofmt_check"
              go test ./...
              go test -race ./...
              go vet ./...
            )
          done < <(find . -name go.mod -not -path './.git/*' -print | sed 's#^./##' | sort)

      - name: Commit only after the full corpus passes
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-final-mechanical-closure-20260831.yml
          test -z "$(find .github/workflows -maxdepth 1 -type f \( -name 'temporary-*' -o -iname '*rescue*' \) -print -quit)"
          if [[ -d .github/tmp ]]; then
            test -z "$(find .github/tmp -type f -name 'pg-operations-patch.*' -print -quit)"
          fi
          git diff --check
          git config user.name "trillionnium-gap-closure-bot"
          git config user.email "gap-closure-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No source repair is required.'
            exit 0
          fi
          git commit -m "fix(repo): close remaining mechanical source blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
