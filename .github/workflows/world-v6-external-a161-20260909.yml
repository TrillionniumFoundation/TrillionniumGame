name: world-v6-external-a315-20260909

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-v6-external-a315-20260909-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WORLD_REPOSITORY: TrillionniumFoundation/Trillionnium-World
  WORLD_BASE_SHA: 0f6117a56263bcb5bf89e34b8bcda557a7da2e6d
  WORLD_HEAD_SHA: a31556d3979b21b99592030ba57ee89e09fd66f9
  WORLD_MERGE_REF: refs/pull/104/merge
  WORLD_MERGE_SHA: e5729f12e1e86bda21becf06e0e29877f182b407
  WORLD_RUST_TOOLCHAIN: '1.98.1'
  RUSTUP_TOOLCHAIN: '1.98.1'
  CARGO_INCREMENTAL: '0'
  RUST_TEST_THREADS: '1'
  PGHOST: 127.0.0.1
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  TRNM_WORLD_POSTGRES_CLIENT_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94

jobs:
  qualify:
    name: world-v6/${{ matrix.scope }}-head-and-merge
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        scope:
          - truth
          - source
          - postgres
          - package
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Fetch and verify exact World objects
        shell: bash
        run: |
          set -euo pipefail
          head_dir="$RUNNER_TEMP/world-head"
          merge_dir="$RUNNER_TEMP/world-merge"
          rm -rf "$head_dir" "$merge_dir"
          git init "$head_dir"
          git -C "$head_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$head_dir" fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C "$head_dir" checkout --detach FETCH_HEAD
          git init "$merge_dir"
          git -C "$merge_dir" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$merge_dir" fetch --no-tags --depth=2 origin "$WORLD_MERGE_REF"
          git -C "$merge_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$head_dir" rev-parse HEAD)" = "$WORLD_HEAD_SHA"
          test "$(git -C "$merge_dir" rev-parse HEAD)" = "$WORLD_MERGE_SHA"
          test "$(git -C "$merge_dir" rev-parse HEAD^1)" = "$WORLD_BASE_SHA"
          test "$(git -C "$merge_dir" rev-parse HEAD^2)" = "$WORLD_HEAD_SHA"
          test -z "$(git -C "$head_dir" status --porcelain=v1 --untracked-files=no)"
          test -z "$(git -C "$merge_dir" status --porcelain=v1 --untracked-files=no)"
          git -C "$head_dir" show -s --format='head_commit=%H%nhead_tree=%T'
          git -C "$merge_dir" show -s --format='merge_commit=%H%nmerge_tree=%T%nmerge_parents=%P'

      - name: Install pinned World toolchain and native dependencies
        if: ${{ matrix.scope != 'truth' }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$WORLD_RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup override set "$WORLD_RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev \
            libxkbcommon-dev libwayland-dev pkg-config postgresql-client
          rustc --version --verbose
          cargo --version --verbose
          psql --version

      - name: Prepare isolated PostgreSQL databases
        if: ${{ matrix.scope == 'postgres' }}
        shell: bash
        run: |
          set -euo pipefail
          createdb world_head
          createdb world_merge
          psql -d postgres -Atqc "select datname from pg_database where datname in ('world_head','world_merge') order by datname"

      - name: Qualify exact World head
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-head"
          if test "${{ matrix.scope }}" = postgres; then
            export PGDATABASE=world_head
            export TRNM_SETTLEMENT_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/world_head
          fi
          bash scripts/run-trnm-world-v6-qualification-v2.sh "${{ matrix.scope }}"

      - name: Qualify actual World prospective merge
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/world-merge"
          if test "${{ matrix.scope }}" = postgres; then
            export PGDATABASE=world_merge
            export TRNM_SETTLEMENT_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/world_merge
          fi
          bash scripts/run-trnm-world-v6-qualification-v2.sh "${{ matrix.scope }}"

      - name: Emit immutable execution identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'world_repository=%s\n' "$WORLD_REPOSITORY"
          printf 'world_base_sha=%s\n' "$WORLD_BASE_SHA"
          printf 'world_head_sha=%s\n' "$WORLD_HEAD_SHA"
          printf 'world_merge_sha=%s\n' "$WORLD_MERGE_SHA"
          printf 'scope=%s\n' "${{ matrix.scope }}"
          printf 'runner_repository=%s\n' "$GITHUB_REPOSITORY"
          printf 'runner_commit=%s\n' "$GITHUB_SHA"
          printf 'runner_run_id=%s\n' "$GITHUB_RUN_ID"
          printf 'production_authorization=not_granted\n'
          for tuple in head merge; do
            root="$RUNNER_TEMP/world-$tuple/run/world-v6-v2/${{ matrix.scope }}"
            if test -d "$root"; then
              find "$root" -type f -print0 | sort -z | xargs -0 -r sha256sum
            fi
          done

  rustfmt-patch:
    name: world-v6/rustfmt-patch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch exact World head
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/world-format"
          rm -rf "$root"
          git init "$root"
          git -C "$root" remote add origin "https://github.com/${WORLD_REPOSITORY}.git"
          git -C "$root" fetch --no-tags --depth=1 origin "$WORLD_HEAD_SHA"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$WORLD_HEAD_SHA"

      - name: Install exact rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$WORLD_RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup override set "$WORLD_RUST_TOOLCHAIN"
          rustfmt --version

      - name: Generate canonical formatting patch
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/world-format"
          cargo fmt --manifest-path "$root/trillionnium/Cargo.toml" --all
          cargo fmt --manifest-path "$root/trillionnium/crates/world-authority/Cargo.toml" --all
          cargo fmt --manifest-path "$root/trillionnium/contracts/trnm-world-transition-v1/Cargo.toml"
          cargo fmt --manifest-path "$root/contracts/Cargo.toml" --all
          git -C "$root" diff --check
          git -C "$root" diff --name-only
          git -C "$root" diff --binary > "$RUNNER_TEMP/world-rustfmt.patch"
          test -s "$RUNNER_TEMP/world-rustfmt.patch"
          printf 'WORLD_RUSTFMT_PATCH_SHA256=%s\n' "$(sha256sum "$RUNNER_TEMP/world-rustfmt.patch" | cut -d' ' -f1)"
          printf 'WORLD_RUSTFMT_PATCH_BASE64_BEGIN\n'
          gzip -9c "$RUNNER_TEMP/world-rustfmt.patch" | base64 -w 120
          printf '\nWORLD_RUSTFMT_PATCH_BASE64_END\n'

  required:
    name: world-v6/external-required
    if: always()
    needs:
      - qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all matrix scopes
        env:
          RESULT: ${{ needs.qualify.result }}
        run: |
          set -euo pipefail
          test "$RESULT" = success
          printf 'WORLD_V6_EXTERNAL_REQUIRED=PASS\n'
          printf 'world_head=%s\n' "$WORLD_HEAD_SHA"
          printf 'world_merge=%s\n' "$WORLD_MERGE_SHA"
          printf 'production_authorization=not_granted\n'
