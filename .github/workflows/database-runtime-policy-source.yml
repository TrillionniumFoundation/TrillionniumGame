name: database-runtime-policy-source

on:
  pull_request:
    paths:
      - 'crates/trnm-contracts/**'
      - 'crates/trnm-persistence-runtime-policy/**'
      - 'contracts/database/runtime-policy-v1.json'
      - 'docs/development/DATABASE_RUNTIME_POLICY_V1.md'
      - '.github/workflows/database-runtime-policy-source.yml'
  push:
    branches: [main]
    paths:
      - 'crates/trnm-contracts/**'
      - 'crates/trnm-persistence-runtime-policy/**'
      - 'contracts/database/runtime-policy-v1.json'
      - 'docs/development/DATABASE_RUNTIME_POLICY_V1.md'
      - '.github/workflows/database-runtime-policy-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-runtime-policy-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  bounded-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Validate claim boundary
        run: |
          set -euo pipefail
          jq -e '
            .status == "source-candidate" and
            .claims.source_candidate == true and
            .claims.runtime_policy_defined == true and
            .claims.pool_implemented == false and
            .claims.tls_implemented == false and
            .claims.automatic_retry_implemented == false and
            .claims.database_durable == false and
            .claims.production_ready == false
          ' contracts/database/runtime-policy-v1.json >/dev/null
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.1
      - name: Format
        run: cargo fmt --manifest-path crates/trnm-persistence-runtime-policy/Cargo.toml -- --check
      - name: Test
        run: cargo test --manifest-path crates/trnm-persistence-runtime-policy/Cargo.toml --all-targets --locked
      - name: Strict lint
        run: cargo clippy --manifest-path crates/trnm-persistence-runtime-policy/Cargo.toml --all-targets --locked -- -D warnings
