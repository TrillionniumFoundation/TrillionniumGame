syntax = "proto3";

package trillionnium.realtime.v1;

// Source-candidate transport envelope only. This is not the Nakama realtime
// protobuf schema and grants no compatibility credit.
message AuthorityCommandEnvelope {
  bytes json_request = 1;
}

message AuthorityResponseEnvelope {
  uint32 status = 1;
  bytes json_body = 2;
}
