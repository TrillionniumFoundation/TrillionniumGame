name: candidate-identity-manifest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-identity-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-candidate-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact candidate without external actions
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CANDIDATE_REPOSITORY"
          test -n "$CANDIDATE_SHA"
          rm -rf "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin \
            "https://github.com/${CANDIDATE_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin \
            "${CANDIDATE_SHA}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Generate exact manifest
        env:
          TRNM_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/generate-candidate-manifest.py \
            --output run/candidate/candidate-manifest.json
          python3 -m json.tool run/candidate/candidate-manifest.json >/dev/null
          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            '.repository == "TrillionniumFoundation/TrillionniumGame" and
             .commit == $sha and
             (.tree | length) == 40 and
             .claim_boundary.exact_source_identity_recorded == true and
             .claim_boundary.source_validation_executed == false and
             .claim_boundary.independently_reviewed == false and
             .claim_boundary.compatibility_credit == false and
             .claim_boundary.production_ready == false' \
            run/candidate/candidate-manifest.json >/dev/null
          sha256sum run/candidate/candidate-manifest.json \
            > run/candidate/SHA256SUMS
      - name: Build deterministic retained identity packet
        shell: bash
        run: |
          set -euo pipefail
          archive="run/candidate/candidate-identity-${CANDIDATE_SHA}.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -czf "$archive" -C run/candidate \
            candidate-manifest.json SHA256SUMS
          test -s "$archive"
          sha256sum "$archive"
      - name: Retain exact candidate identity packet
        id: retained-candidate-identity
        uses: ./.github/actions/upload-evidence
        with:
          name: candidate-identity-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: run/candidate/candidate-identity-${{ env.CANDIDATE_SHA }}.tar.gz
          mime_type: application/gzip
      - name: Verify retained identity receipt
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ steps.retained-candidate-identity.outputs.artifact_id }}'
          test '${{ steps.retained-candidate-identity.outputs.sha256 }}' != ''
          test '${{ steps.retained-candidate-identity.outputs.size_bytes }}' -gt 0
          printf '### Retained source identity packet\n\n'
          printf 'artifact_id=%s\nsha256=%s\nsize_bytes=%s\n' \
            '${{ steps.retained-candidate-identity.outputs.artifact_id }}' \
            '${{ steps.retained-candidate-identity.outputs.sha256 }}' \
            '${{ steps.retained-candidate-identity.outputs.size_bytes }}'
          printf 'Retention is transport evidence only; independent acceptance and gap closure remain false.\n'
