[package]
name = "trnm-persistence-pg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
native-tls = "=0.2.18"
# Existing locked native backend, exposed only by the diagnostic TLS binary.
openssl = "=0.10.81"
postgres = "=0.19.14"
postgres-native-tls = "=0.5.3"
prost = "=0.14.3"
r2d2 = "=0.8.10"
r2d2_postgres = "=0.18.2"
tokio = { version = "=1.53.1", features = ["rt", "time"] }
tonic = { version = "=0.14.5", features = ["transport"] }
tonic-prost = "=0.14.5"
trnm-contracts = { path = "../trnm-contracts" }
trnm-realtime-wire = { path = "../trnm-realtime-wire" }
trnm-session-core = { path = "../trnm-session-core" }
trnm-token-jwt-adapter = { path = "../trnm-token-jwt-adapter" }

[build-dependencies]
prost-build = "=0.14.3"
prost-types = "=0.14.3"
protoc-bin-vendored = "=3.2.0"
tonic-build = "=0.14.5"
tonic-prost-build = "=0.14.5"

[lints]
workspace = true
