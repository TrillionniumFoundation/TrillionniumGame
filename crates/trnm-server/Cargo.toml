[package]
name = "trnm-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "Apache-2.0"
description = "Fail-closed TrillionniumGame Rust server vertical slice"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "trnm-server"
path = "src/main.rs"

[dependencies]
trnm-contracts = { path = "../trnm-contracts" }
trnm-persistence-core = { path = "../trnm-persistence-core" }

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
