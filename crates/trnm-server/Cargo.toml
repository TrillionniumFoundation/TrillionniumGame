[package]
name = "trnm-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
license = "Apache-2.0"
description = "Canonical fail-closed TrillionniumGame server composition root"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "trnm-server-composition-candidate"
path = "src/main.rs"

[dependencies]
postgres = "=0.19.14"
prost = "=0.14.3"
tokio = { version = "=1.53.1", features = ["rt", "time"] }
tonic = { version = "=0.14.5", features = ["transport"] }
tonic-prost = "=0.14.5"
trnm-contracts = { path = "../trnm-contracts" }
trnm-persistence-pg = { path = "../trnm-persistence-pg" }
trnm-realtime-wire = { path = "../trnm-realtime-wire" }
trnm-session-core = { path = "../trnm-session-core" }
trnm-token-jwt-adapter = { path = "../trnm-token-jwt-adapter" }

[build-dependencies]
prost-build = "=0.14.3"
prost-types = "=0.14.3"
protoc-bin-vendored = "=3.2.0"
tonic-build = "=0.14.5"
tonic-prost-build = "=0.14.5"

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
