name: ${TRNM_ORACLE_PROJECT:-trillionnium-game-immutable-oracle}

services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TRNM_ORACLE_DB_PASSWORD:?TRNM_ORACLE_DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    security_opt: [no-new-privileges:true]
    healthcheck:
      # pg_isready can succeed against the temporary postmaster used by the
      # official image during initialization. Require PID 1 to be the final
      # postgres process and execute a real SQL probe before releasing Nakama.
      test:
        - CMD-SHELL
        - >-
          test "$$(cat /proc/1/comm)" = postgres &&
          test "$$(psql -X -U postgres -d nakama -Atqc 'SELECT 1')" = 1
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  nakama:
    image: heroiclabs/nakama:3.40.0@sha256:92fb184e3271be12fd4d239766afb285322a50aaf769a59433445d59624c78cd
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRNM_ORACLE_DB_PASSWORD: ${TRNM_ORACLE_DB_PASSWORD:?TRNM_ORACLE_DB_PASSWORD is required}
      TRNM_ORACLE_SESSION_KEY: ${TRNM_ORACLE_SESSION_KEY:?TRNM_ORACLE_SESSION_KEY is required}
      TRNM_ORACLE_REFRESH_KEY: ${TRNM_ORACLE_REFRESH_KEY:?TRNM_ORACLE_REFRESH_KEY is required}
      TRNM_ORACLE_SERVER_KEY: ${TRNM_ORACLE_SERVER_KEY:?TRNM_ORACLE_SERVER_KEY is required}
      TRNM_ORACLE_RUNTIME_KEY: ${TRNM_ORACLE_RUNTIME_KEY:?TRNM_ORACLE_RUNTIME_KEY is required}
      TRNM_ORACLE_CONSOLE_KEY: ${TRNM_ORACLE_CONSOLE_KEY:?TRNM_ORACLE_CONSOLE_KEY is required}
      TRNM_ORACLE_CONSOLE_PASSWORD: ${TRNM_ORACLE_CONSOLE_PASSWORD:?TRNM_ORACLE_CONSOLE_PASSWORD is required}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        database="postgres:$${TRNM_ORACLE_DB_PASSWORD}@postgres:5432/nakama"
        /nakama/nakama migrate up --database.address "$$database"
        exec /nakama/nakama \
          --name trnm-oracle \
          --database.address "$$database" \
          --logger.level INFO \
          --session.encryption_key "$${TRNM_ORACLE_SESSION_KEY}" \
          --session.refresh_encryption_key "$${TRNM_ORACLE_REFRESH_KEY}" \
          --session.token_expiry_sec 3600 \
          --session.refresh_token_expiry_sec 86400 \
          --socket.server_key "$${TRNM_ORACLE_SERVER_KEY}" \
          --runtime.http_key "$${TRNM_ORACLE_RUNTIME_KEY}" \
          --console.signing_key "$${TRNM_ORACLE_CONSOLE_KEY}" \
          --console.username trnm-oracle \
          --console.password "$${TRNM_ORACLE_CONSOLE_PASSWORD}"
    ports:
      - 127.0.0.1:${TRNM_ORACLE_HTTP_PORT:-0}:7350
    networks: [backend, edge]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

networks:
  backend:
    internal: true
  edge: {}

volumes:
  postgres-data: {}
