name: ${TRNM_NAKAMA_COMPOSE_PROJECT:-trillionnium-nakama-p0}

services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: trillionnium_nakama
      POSTGRES_PASSWORD: ${TRNM_NAKAMA_DB_PASSWORD:?TRNM_NAKAMA_DB_PASSWORD is required}
      POSTGRES_USER: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/run/postgresql:rw,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trillionnium_nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 20s

  nakama:
    image: ${TRNM_NAKAMA_IMAGE:-trillionnium-nakama:p0}
    build:
      context: ./runtime
      dockerfile: Dockerfile
      args:
        SOURCE_DATE_EPOCH: ${TRNM_NAKAMA_SOURCE_DATE_EPOCH:?TRNM_NAKAMA_SOURCE_DATE_EPOCH is required}
        PAPER_RAID_SOURCE_REVISION: ${TRNM_NAKAMA_SOURCE_REVISION:?TRNM_NAKAMA_SOURCE_REVISION is required}
        PAPER_RAID_SOURCE_TREE: ${TRNM_NAKAMA_SOURCE_TREE:?TRNM_NAKAMA_SOURCE_TREE is required}
        PAPER_RAID_SBOM_SHA256: ${TRNM_NAKAMA_SBOM_SHA256:?TRNM_NAKAMA_SBOM_SHA256 is required}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:?NAKAMA_CONSOLE_PASSWORD is required}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY:?NAKAMA_CONSOLE_SIGNING_KEY is required}
      NAKAMA_RUNTIME_HTTP_KEY: ${NAKAMA_RUNTIME_HTTP_KEY:?NAKAMA_RUNTIME_HTTP_KEY is required}
      NAKAMA_SOCKET_SERVER_KEY: ${NAKAMA_SERVER_KEY:?NAKAMA_SERVER_KEY is required}
      NAKAMA_SESSION_ENCRYPTION_KEY: ${NAKAMA_SESSION_ENCRYPTION_KEY:?NAKAMA_SESSION_ENCRYPTION_KEY is required}
      NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY: ${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY:?NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY is required}
      TRNM_HEPTA_ISSUER_KEYS: ${TRNM_HEPTA_ISSUER_KEYS:?TRNM_HEPTA_ISSUER_KEYS is required}
      TRNM_HEPTA_CONTROL_ISSUER_KEYS: ${TRNM_HEPTA_CONTROL_ISSUER_KEYS:?TRNM_HEPTA_CONTROL_ISSUER_KEYS is required}
      TRNM_RESEARCH_CONTROL_TEST_FAILPOINT_FILE: ${TRNM_RESEARCH_CONTROL_TEST_FAILPOINT_FILE:-}
      TRNM_HEPTA_BASE_URL: ${TRNM_HEPTA_BASE_URL:?TRNM_HEPTA_BASE_URL is required}
      TRNM_HEPTA_SERVICE_TOKEN: ${TRNM_HEPTA_SERVICE_TOKEN:?TRNM_HEPTA_SERVICE_TOKEN is required}
      TRNM_NAKAMA_AUTHORITY_KEY_ID: ${TRNM_NAKAMA_AUTHORITY_KEY_ID:?TRNM_NAKAMA_AUTHORITY_KEY_ID is required}
      TRNM_NAKAMA_AUTHORITY_PRIVATE_KEY: ${TRNM_NAKAMA_AUTHORITY_PRIVATE_KEY:?TRNM_NAKAMA_AUTHORITY_PRIVATE_KEY is required}
      TRNM_NAKAMA_AUTHORITY_PUBLIC_KEYS: ${TRNM_NAKAMA_AUTHORITY_PUBLIC_KEYS:?TRNM_NAKAMA_AUTHORITY_PUBLIC_KEYS is required}
      TRNM_NAKAMA_DB_PASSWORD: ${TRNM_NAKAMA_DB_PASSWORD:?TRNM_NAKAMA_DB_PASSWORD is required}
      TRNM_NAKAMA_MATCH_TICK_RATE: ${TRNM_NAKAMA_MATCH_TICK_RATE:-5}
      TRNM_NAKAMA_OPERATOR_TOKEN: ${TRNM_NAKAMA_OPERATOR_TOKEN:?TRNM_NAKAMA_OPERATOR_TOKEN is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${TRNM_NAKAMA_DB_PASSWORD}" in
          *[!A-Za-z0-9._~-]*)
            echo "TRNM_NAKAMA_DB_PASSWORD must use the URL-safe alphabet A-Za-z0-9._~-" >&2
            exit 64
            ;;
        esac
        if [ "$${#TRNM_NAKAMA_DB_PASSWORD}" -lt 32 ]; then
          echo "TRNM_NAKAMA_DB_PASSWORD must contain at least 32 characters" >&2
          exit 64
        fi
        validate_local_secret() {
          value="$$1"
          name="$$2"
          case "$$value" in
            *[!A-Za-z0-9._~-]*)
              echo "$$name must use the URL-safe alphabet A-Za-z0-9._~-" >&2
              exit 64
              ;;
          esac
          if [ "$${#value}" -lt 32 ]; then
            echo "$$name must contain at least 32 characters" >&2
            exit 64
          fi
        }
        validate_local_secret "$${NAKAMA_CONSOLE_PASSWORD}" NAKAMA_CONSOLE_PASSWORD
        validate_local_secret "$${NAKAMA_CONSOLE_SIGNING_KEY}" NAKAMA_CONSOLE_SIGNING_KEY
        validate_local_secret "$${NAKAMA_RUNTIME_HTTP_KEY}" NAKAMA_RUNTIME_HTTP_KEY
        validate_local_secret "$${NAKAMA_SOCKET_SERVER_KEY}" NAKAMA_SOCKET_SERVER_KEY
        validate_local_secret "$${NAKAMA_SESSION_ENCRYPTION_KEY}" NAKAMA_SESSION_ENCRYPTION_KEY
        validate_local_secret "$${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY}" NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY
        umask 077
        config=/tmp/trnm-nakama.yml
        append_runtime_env() {
          # Nakama exposes only runtime.env entries through RUNTIME_CTX_ENV;
          # ordinary process environment variables are intentionally omitted.
          escaped=$$(printf '%s' "$$1" | sed "s/'/''/g")
          printf "    - '%s'\n" "$$escaped" >>"$$config"
        }
        # A Paper Raid may span seven days, and a completed delivery-only
        # runtime must remain available while Hepta is temporarily down.
        # Durable resume still covers host/process outages beyond this bounded
        # live-runtime grace period.
        printf '%s\n' \
          'name: trnm-nakama-p0' \
          'database:' \
          '  address:' \
          "    - \"postgres:$${TRNM_NAKAMA_DB_PASSWORD}@postgres:5432/trillionnium_nakama\"" \
          'logger:' \
          '  level: INFO' \
          'match:' \
          '  max_empty_sec: 691200' \
          'console:' \
          '  username: trnm-console' \
          "  password: \"$${NAKAMA_CONSOLE_PASSWORD}\"" \
          "  signing_key: \"$${NAKAMA_CONSOLE_SIGNING_KEY}\"" \
          'runtime:' \
          "  http_key: \"$${NAKAMA_RUNTIME_HTTP_KEY}\"" \
          '  env:' \
          >"$$config"
        append_runtime_env "TRNM_HEPTA_ISSUER_KEYS=$${TRNM_HEPTA_ISSUER_KEYS}"
        append_runtime_env "TRNM_HEPTA_CONTROL_ISSUER_KEYS=$${TRNM_HEPTA_CONTROL_ISSUER_KEYS}"
        if [ -n "$${TRNM_RESEARCH_CONTROL_TEST_FAILPOINT_FILE}" ]; then
          append_runtime_env "TRNM_RESEARCH_CONTROL_TEST_FAILPOINT_FILE=$${TRNM_RESEARCH_CONTROL_TEST_FAILPOINT_FILE}"
        fi
        append_runtime_env "TRNM_HEPTA_BASE_URL=$${TRNM_HEPTA_BASE_URL}"
        append_runtime_env "TRNM_HEPTA_SERVICE_TOKEN=$${TRNM_HEPTA_SERVICE_TOKEN}"
        append_runtime_env "TRNM_NAKAMA_AUTHORITY_KEY_ID=$${TRNM_NAKAMA_AUTHORITY_KEY_ID}"
        append_runtime_env "TRNM_NAKAMA_AUTHORITY_PRIVATE_KEY=$${TRNM_NAKAMA_AUTHORITY_PRIVATE_KEY}"
        append_runtime_env "TRNM_NAKAMA_AUTHORITY_PUBLIC_KEYS=$${TRNM_NAKAMA_AUTHORITY_PUBLIC_KEYS}"
        append_runtime_env "TRNM_NAKAMA_OPERATOR_TOKEN=$${TRNM_NAKAMA_OPERATOR_TOKEN}"
        append_runtime_env "TRNM_NAKAMA_MATCH_TICK_RATE=$${TRNM_NAKAMA_MATCH_TICK_RATE}"
        printf '%s\n' \
          'socket:' \
          "  server_key: \"$${NAKAMA_SOCKET_SERVER_KEY}\"" \
          '  max_message_size_bytes: 131072' \
          'session:' \
          "  encryption_key: \"$${NAKAMA_SESSION_ENCRYPTION_KEY}\"" \
          "  refresh_encryption_key: \"$${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY}\"" \
          >>"$$config"
        /nakama/nakama migrate up --config "$$config"
        exec /nakama/nakama --config "$$config"
    ports:
      - "127.0.0.1:${TRNM_NAKAMA_HTTP_PORT:-0}:7350"
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    stop_grace_period: 20s

networks:
  backend:
    internal: true
  # Docker Engine 29 does not activate host port publishing for a container
  # attached only to an internal network. This edge network exists solely for
  # Nakama's loopback-bound client port; PostgreSQL remains backend-only.
  edge: {}

volumes:
  postgres-data:
